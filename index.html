<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webová Aplikace | Dashboard</title>
  <link rel="stylesheet" href="common.css" />
  <script src="theme.js"></script>
  <script src="podpis.js" defer></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>" />
  <meta name="theme-color" content="#2d2d2d" />
  <style>
    body {
      height: 100vh;
      overflow: hidden;
    }

    /* Odkaz na samostatný web Metodus */
    .odkaz-metodus {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 10px 10px 10px;
      padding: 9px 11px;
      background: linear-gradient(120deg, var(--accent-soft), transparent 75%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .odkaz-metodus:hover {
      border-color: var(--accent);
      background-color: var(--bg-elevated);
    }

    .odkaz-metodus .znak {
      width: 1.35rem;
      height: auto;
      fill: var(--accent);
      flex-shrink: 0;
    }

    .odkaz-metodus b {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .odkaz-metodus span.popis {
      display: block;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    /* Layout */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Hlavička */
    .hlavicka {
      background-color: var(--bg-elevated);
      color: var(--text);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hlavicka-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .hlavicka h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Hamburger – jen na malých obrazovkách */
    .hamburger {
      display: none;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .hamburger:hover {
      background-color: var(--accent);
      color: var(--on-accent, #fff);
      border-color: var(--accent);
    }

    /* Tmavé pozadí pod vysunutým menu */
    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* Hlavní obsah */
    .obsah {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Menu */
    .menu {
      width: 240px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--bg-panel);
    }

    /* Lepkavá horní lišta menu: hledání + filtrovací pilulky */
    .menu-top {
      position: sticky;
      top: 0;
      z-index: 5;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .menu-search-wrap {
      padding: 10px 10px 6px 10px;
    }

    .menu-search {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .menu-search:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    /* Rozbalovací tlačítko s kategoriemi (dřív pilulky pod hlavičkou —
       zabíraly nahoře v menu moc místa) */
    .skupiny-wrap {
      position: relative;
      padding: 0 10px 10px 10px;
    }

    .skupiny-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      text-align: left;
      padding: 7px 10px;
      cursor: pointer;
    }

    .skupiny-toggle:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .skupiny-toggle:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .skupiny-toggle #skupinyToggleLabel {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skupiny-toggle .sipka {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .skupiny-toggle[aria-expanded="true"] .sipka {
      transform: rotate(180deg);
    }

    /* Vysunutá nabídka kategorií */
    .skupiny {
      display: none;
      position: absolute;
      left: 10px;
      right: 10px;
      top: calc(100% - 6px);
      z-index: 20;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-height: 60vh;
      overflow-y: auto;
      padding: 4px;
    }

    .skupiny.show {
      display: block;
    }

    .skupina-polozka {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.8rem;
      text-align: left;
      padding: 6px 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .skupina-polozka .nazev {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skupina-polozka:hover {
      background-color: var(--bg-hover);
      color: var(--text);
    }

    .skupina-polozka.active {
      background-color: var(--accent);
      color: var(--on-accent, #fff);
      font-weight: 600;
    }

    .skupina-polozka .pill-pocet {
      margin-left: auto;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-faint);
      background-color: var(--bg-input);
      border-radius: 9px;
      padding: 0 6px;
      line-height: 1.5;
    }

    .skupina-polozka:hover .pill-pocet,
    .skupina-polozka.active .pill-pocet {
      color: #fff;
      background-color: rgba(0, 0, 0, 0.25);
    }

    /* Hláška, když hledání nic nenajde */
    .bez-vysledku {
      display: none;
      padding: 18px 16px;
      color: var(--text-faint);
      font-size: 0.85rem;
      text-align: center;
    }
    .bez-vysledku.zobraz { display: block; }

    /* Krátké právní upozornění na konci menu */
    .menu-pravni {
      margin: 0;
      padding: 12px 15px 16px;
      border-top: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 0.7rem;
      line-height: 1.45;
    }
    .menu-pravni a { color: var(--accent); white-space: nowrap; }

    .sekce {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .sekce:last-child {
      border-bottom: none;
    }

    .sekce h2 {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 10px 15px 8px 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      padding: 4px 6px;
      transition: background-color 0.15s ease;
    }

    .sekce h2:hover {
      background-color: var(--bg-elevated);
      color: var(--accent-hover);
    }

    .sekce h2 .pocet {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-faint);
      background-color: var(--bg-hover);
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 600;
    }

    .sekce h2 .sipka {
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .sekce.collapsed h2 .sipka {
      transform: rotate(-90deg);
    }

    .sekce.collapsed ul {
      display: none;
    }

    .sekce ul {
      list-style: none;
    }

    /* Sekce s jedinou aplikací: hlavička by jen zdvojovala název položky,
       proto se zobrazí rovnou odkaz a sekce se nedá sbalit. */
    .sekce.jedina {
      padding: 4px 0;
    }

    .sekce.jedina h2 {
      display: none;
    }

    .sekce.jedina ul {
      display: block;
    }

    .sekce li {
      position: relative;
    }

    .sekce a {
      display: block;
      padding: 8px 32px 8px 25px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sekce a:hover,
    .sekce a.kb-focus {
      background-color: var(--bg-hover);
      color: var(--text);
      padding-left: 30px;
    }

    /* Ikony z balíku assets/index-icons (místo úvodního emoji názvu) */
    .ikona {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border-radius: 5px;
    }
    /* záporný okraj: větší ikona nezvětší výšku řádku menu */
    .sekce a .ikona {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      vertical-align: middle;
      margin: -6px 10px -6px -4px;
    }
    .sekce h2 .titulek {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .sekce h2 .ikona {
      width: 24px;
      height: 24px;
      margin: -4px 0;
    }
    #skupinyToggleLabel .ikona {
      vertical-align: middle;
      margin: -4px 6px -4px 0;
    }

    .sekce a.active {
      background-color: var(--bg-control);
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    /* Tečka stavu stránky (vývoj / beta / stable) vlevo od názvu */
    .sekce li[data-stav]::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-top: -3px;
      border-radius: 50%;
      pointer-events: none;
    }
    .sekce li[data-stav="vyvoj"]::before  { background-color: var(--warn); }
    .sekce li[data-stav="beta"]::before   { background-color: var(--accent); }
    .sekce li[data-stav="stable"]::before { background-color: var(--ok); }

    /* Filtr podle stavu: řada přepínačů pod kategoriemi */
    .stavy-filtr {
      display: flex;
      gap: 4px;
      padding: 0 10px 10px 10px;
    }
    .stavy-filtr button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 0;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 2px;
      cursor: pointer;
      white-space: nowrap;
    }
    .stavy-filtr button:hover { color: var(--text); border-color: var(--border-strong); }
    .stavy-filtr button.active {
      color: var(--text);
      border-color: currentColor;
      background-color: var(--bg-hover);
    }
    .stavy-filtr button[data-stav="vyvoj"].active  { color: var(--warn); }
    .stavy-filtr button[data-stav="beta"].active   { color: var(--accent); }
    .stavy-filtr button[data-stav="stable"].active { color: var(--ok); }
    .stavy-filtr .tecka {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: none;
    }
    .stavy-filtr [data-stav="vyvoj"] .tecka  { background-color: var(--warn); }
    .stavy-filtr [data-stav="beta"] .tecka   { background-color: var(--accent); }
    .stavy-filtr [data-stav="stable"] .tecka { background-color: var(--ok); }

    /* Štítek stavu otevřené aplikace vpravo nahoře v hlavičce */
    #stavAplikace { cursor: help; }
    #stavAplikace[hidden] { display: none; }

    /* Hvězdička oblíbených */
    .hvezda {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-faint);
      opacity: 0;
      padding: 2px 4px;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .sekce li:hover .hvezda { opacity: 0.7; }
    .hvezda:hover { opacity: 1 !important; color: var(--warn); }
    .hvezda.je-oblibena { opacity: 0.9; color: var(--warn); }

    /* Ovládání v hlavičce */
    .ovladani {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ovladani button {
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .ovladani button:hover {
      background-color: var(--accent);
      color: var(--on-accent, #fff);
      border-color: var(--accent);
    }

    /* zvýraznění při hledání */
    .sekce a.zvyrazneno {
      background-color: var(--accent-soft);
      color: var(--text);
    }

    .sekce.skryto { display: none; }
    .sekce li.skryto { display: none; }

    @media (max-width: 768px) {
      .ovladani .jen-desktop { display: none; }
    }

    /* Pracovní plocha */
    .pracovni-plocha {
      flex: 1;
      background-color: var(--bg-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pracovni-plocha iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Responzivita – telefon a tablet: menu skryté v hamburgeru */
    @media (max-width: 1024px) {
      .hamburger { display: inline-flex; }

      .menu {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 80%;
        max-width: 300px;
        z-index: 1000;
        border-right: 1px solid var(--border);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 2px 0 14px rgba(0, 0, 0, 0.55);
      }
      .menu.open { transform: translateX(0); }

      .menu-overlay { display: block; }
      .menu-overlay.show { opacity: 1; pointer-events: auto; }

      .pracovni-plocha { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hlavicka">
      <div class="hlavicka-left">
        <button id="hamburger" class="hamburger" aria-label="Otevřít menu" aria-expanded="false" aria-controls="hlavniMenu">☰</button>
        <h1>Webový systém</h1>
      </div>
      <div class="ovladani">
        <span id="stavAplikace" class="stav-stitek" hidden></span>
        <button id="btnDomu" title="Úvodní přehled">🏠</button>
        <button id="btnTema" title="Přepnout světlý / tmavý režim">🌙</button>
        <button id="btnInfo" title="O projektu – podmínky užívání a autorská práva">ℹ️</button>
        <button id="btnNastaveni" title="Nastavení – data uložená v prohlížeči">⚙️</button>
        <button id="btnNoveOkno" title="Otevřít aktuální aplikaci v novém okně">🗗</button>
        <button id="rozbalitVse" class="jen-desktop" title="Rozbalit vše">⊞ Rozbalit</button>
        <button id="sbalitVse" class="jen-desktop" title="Sbalit vše">⊟ Sbalit</button>
      </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="obsah">
      <nav class="menu" id="hlavniMenu">
        <div class="menu-top">
          <div class="menu-search-wrap">
            <input type="search" id="hledatMenu" class="menu-search" placeholder="🔍 Hledat aplikaci… (Ctrl+K)" autocomplete="off" />
          </div>
          <a class="odkaz-metodus" href="https://lavionus.github.io/metodus/" target="_blank" rel="noopener" title="Samostatný web s výukovými aplikacemi">
            <svg class="znak" viewBox="0 0 655 488" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,488) scale(0.1,-0.1)"><path d="M5911 4824 c-708 -239 -1389 -584 -1876 -950 -352 -264 -547 -485 -738 -835 -22 -40 -20 -42 -92 91 -182 335 -566 695 -1067 999 -428 259 -1117 569 -1582 710 -225 69 -459 -49 -526 -266 -33 -109 -31 -4397 3 -4463 39 -78 132 -121 215 -100 247 62 474 296 558 575 17 56 18 153 21 1635 1 866 2 1588 3 1604 0 40 33 34 285 -50 976 -324 1596 -753 1810 -1254 117 -274 117 -276 124 -1170 7 -837 2 -784 71 -843 111 -95 297 -66 363 56 22 42 22 42 28 817 5 741 6 779 26 865 124 529 489 910 1200 1252 354 169 962 387 984 351 5 -7 9 -727 9 -1599 0 -1587 0 -1587 25 -1673 45 -155 115 -267 238 -382 223 -208 448 -238 531 -72 26 52 26 52 26 2204 0 1529 -3 2168 -11 2206 -41 199 -219 348 -413 348 -35 0 -102 -17 -215 -56z"/></g></svg>
            <span>
              <b>Metodus – výuka</b>
              <span class="popis">výukové aplikace pro školu ↗</span>
            </span>
          </a>
          <div class="skupiny-wrap">
            <button class="skupiny-toggle" id="skupinyToggle" title="Filtrovat podle kategorie"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="skupiny">
              <span id="skupinyToggleLabel">📂 Vše</span>
              <span class="sipka">▾</span>
            </button>
            <div class="skupiny" id="skupiny" role="listbox" aria-label="Kategorie aplikací"></div>
          </div>
          <div class="stavy-filtr" id="stavyFiltr" role="group" aria-label="Filtrovat podle stavu"></div>
        </div>
        <div id="menuSekce"></div>
        <div class="bez-vysledku" id="bezVysledku">Žádná aplikace neodpovídá hledání ani filtru.</div>
        <p class="menu-pravni">Bez záruky, autor neodpovídá za škody. Web je duševním vlastnictvím autora.
          <a href="#obsah/about.html">Podmínky a O projektu</a></p>
      </nav>

      <main class="pracovni-plocha">
        <iframe name="okno" src="obsah/aplikace.html" title="Aktivní aplikace" allow="fullscreen; autoplay; encrypted-media; picture-in-picture; camera" allowfullscreen></iframe>
      </main>
    </div>
  </div>

  <script src="apps.js"></script>
  <script src="assets/index-icons/ikony.js"></script>
  <script>
    /* ============================================================
       Rozcestník: menu se generuje z katalogu v apps.js.
       Stav: hash v URL (deep-link), localStorage (téma, oblíbené,
       nedávné, sbalené sekce, skupina), sessionStorage (poslední
       otevřená stránka).
       ============================================================ */
    /* Zápis do úložiště: přes file:// (a v přísném režimu soukromí) je kvóta
       nulová a setItem vyhodí výjimku — nesmí shodit zbytek skriptu, web pak
       funguje dál, jen si nic nezapamatuje. */
    function uloz(uloziste, klic, hodnota) {
      try { uloziste.setItem(klic, hodnota); }
      catch { /* bez trvalé paměti */ }
    }

    function precti(uloziste, klic) {
      try { return uloziste.getItem(klic); }
      catch { return null; }
    }

    if (location.protocol === 'file:') {
      console.warn('Web je otevřený přes file:// — nastavení se neuloží a část '
        + 'aplikací nenačte data. Spusť ./test_local.sh a otevři http://localhost:8000/');
    }

    const DOMOVSKA = 'obsah/aplikace.html';
    const NASTAVENI = 'obsah/nastaveni.html';   // mimo katalog, otevírá se tlačítkem ⚙️
    const KEY_PAGE = 'webapp_current_page';
    const KEY_COLLAPSE = 'webapp_collapsed_sections';
    const KEY_SKUPINA = 'webapp_skupina';
    const KEY_OBLIBENE = 'webapp_oblibene';
    const KEY_NEDAVNE = 'webapp_nedavne';
    const KEY_POCTY = 'webapp_pocty';     // soubor -> počet otevření (úvod: Nejčastěji používané)
    const MAX_NEDAVNYCH = 24;
    const KEY_TEMA = 'webapp_theme';
    const KEY_STAV = 'webapp_stav_filtr';

    const iframe = document.querySelector('iframe[name="okno"]');
    const menuEl = document.getElementById('hlavniMenu');
    const menuSekceEl = document.getElementById('menuSekce');
    const skupinyEl = document.getElementById('skupiny');
    const skupinyToggle = document.getElementById('skupinyToggle');
    const skupinyToggleLabel = document.getElementById('skupinyToggleLabel');
    const bezVysledku = document.getElementById('bezVysledku');

    // Kategorie visí v rozbalovacím tlačítku — vysunutá nabídka se překrývá
    // se seznamem aplikací, takže neposouvá menu dolů.
    function setSkupinyOpen(open) {
      skupinyEl.classList.toggle('show', open);
      skupinyToggle.setAttribute('aria-expanded', String(open));
    }
    skupinyToggle.addEventListener('click', () => {
      setSkupinyOpen(!skupinyEl.classList.contains('show'));
    });
    // klik kamkoli mimo tlačítko i nabídku ji zavře
    document.addEventListener('click', e => {
      if (!e.target.closest('.skupiny-wrap')) setSkupinyOpen(false);
    });

    const nactiJson = (key, def) => {
      try { return JSON.parse(precti(localStorage, key)) ?? def; }
      catch { return def; }
    };

    // Při první návštěvě (žádné uložené preference) start se všemi sekcemi
    // sbalenými — jinak by uvítal dlouhý sloupec stovek rozbalených položek.
    let collapsedSet = precti(localStorage, KEY_COLLAPSE) === null
      ? new Set(KATALOG_SEKCE.map(s => s.nazev))
      : new Set(nactiJson(KEY_COLLAPSE, []));
    let aktivniSkupina = precti(localStorage, KEY_SKUPINA) || 'vse';
    // Oblíbené nemají vlastní sekci v menu, hvězdičky plní dlaždice na úvodní stránce.
    let oblibene = nactiJson(KEY_OBLIBENE, []);
    let nedavne = nactiJson(KEY_NEDAVNE, []);
    let pocty = nactiJson(KEY_POCTY, {});
    let aktivniStav = precti(localStorage, KEY_STAV) || 'vse';
    const stavPodleId = new Map(KATALOG_STAVY.map(s => [s.id, s]));
    if (aktivniStav !== 'vse' && !stavPodleId.has(aktivniStav)) aktivniStav = 'vse';

    // index katalogu: soubor -> {nazev, tagy}
    const podleSouboru = new Map();
    KATALOG_SEKCE.forEach(s => s.polozky.forEach(p => podleSouboru.set(p.soubor, p)));

    // hledání bez diakritiky
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    /* ---- Ikony z balíku assets/index-icons ----
       Ikona nahrazuje úvodní emoji názvu. Co v mapě ikon chybí (nová
       stránka před přegenerováním balíku), zůstává s emoji jako dřív. */
    const IKONY = typeof KATALOG_IKONY !== 'undefined' ? KATALOG_IKONY : null;
    function ikona(cesta) {
      if (!IKONY || !cesta) return null;
      const img = document.createElement('img');
      img.className = 'ikona';
      img.src = IKONY.koren + cesta + '.webp';
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      return img;
    }
    // "🌧️ Předpověď" -> "Předpověď": první slovo se zahodí, když obsahuje znak, který
    // není písmeno ani číslice (stejně jako symbol ikony určuje tools/generate-index-icons.mjs)
    function bezEmoji(nazev) {
      const m = nazev.match(/^(\S+)\s+(.+)$/u);
      return (m && /[^\p{L}\p{N}]/u.test(m[1])) ? m[2] : nazev;
    }
    // obsah prvku: ikona + název bez emoji, nebo původní název s emoji
    function naplnSIkonou(el, cesta, nazev) {
      const img = ikona(cesta);
      if (img) el.append(img, bezEmoji(nazev));
      else el.textContent = nazev;
    }

    /* ---- Stavba menu z katalogu ---- */
    function vytvorPolozku(p) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + p.soubor;               // klik = změna hashe -> hashchange otevře aplikaci
      a.dataset.page = p.soubor;
      naplnSIkonou(a, IKONY?.stranky[p.soubor], p.nazev);
      a.dataset.hledani = norm(p.nazev + ' ' + (p.tagy || []).join(' '));
      const stav = stavPodleId.get(p.stav);
      if (stav) {
        li.dataset.stav = stav.id;
        a.title = `${p.nazev} – ${stav.label}: ${stav.popis}`;
      }
      const st = document.createElement('button');
      st.className = 'hvezda';
      st.title = 'Přidat / odebrat z oblíbených';
      st.textContent = '★';
      st.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        toggleOblibena(p.soubor);
      });
      li.appendChild(a);
      li.appendChild(st);
      return li;
    }

    function vytvorSekci(nazev, skupina, polozky) {
      const div = document.createElement('div');
      div.className = 'sekce';
      div.dataset.nazev = nazev;
      div.dataset.skupina = skupina;
      const h2 = document.createElement('h2');
      const span = document.createElement('span');
      span.className = 'titulek';
      naplnSIkonou(span, IKONY?.sekce[nazev], nazev);
      const badge = document.createElement('span');
      badge.className = 'pocet';
      badge.textContent = polozky.length;
      const sipka = document.createElement('span');
      sipka.className = 'sipka';
      sipka.textContent = '▾';
      h2.append(span, badge, sipka);
      const ul = document.createElement('ul');
      polozky.forEach(p => ul.appendChild(vytvorPolozku(p)));
      div.append(h2, ul);
      if (polozky.length === 1) div.classList.add('jedina');
      else if (collapsedSet.has(nazev)) div.classList.add('collapsed');
      h2.addEventListener('click', () => {
        setCollapsed(div, !div.classList.contains('collapsed'));
        saveCollapsed();
      });
      return div;
    }

    function renderMenu() {
      menuSekceEl.innerHTML = '';
      KATALOG_SEKCE.forEach(s => menuSekceEl.appendChild(vytvorSekci(s.nazev, s.skupina, s.polozky)));
      obnovHvezdy();
      updateActiveLink(aktualni);
      aplikujFiltr();
    }

    /* ---- Sbalování sekcí ---- */
    function saveCollapsed() {
      uloz(localStorage, KEY_COLLAPSE, JSON.stringify([...collapsedSet]));
    }
    function setCollapsed(s, collapsed) {
      if (s.classList.contains('jedina')) return;   // jednopoložkovou sekci není co sbalovat
      s.classList.toggle('collapsed', collapsed);
      if (collapsed) collapsedSet.add(s.dataset.nazev);
      else collapsedSet.delete(s.dataset.nazev);
    }
    const vsechnySekce = () => [...menuSekceEl.querySelectorAll('.sekce')];

    document.getElementById('rozbalitVse').addEventListener('click', () => {
      vsechnySekce().forEach(s => setCollapsed(s, false));
      saveCollapsed();
    });
    document.getElementById('sbalitVse').addEventListener('click', () => {
      vsechnySekce().forEach(s => setCollapsed(s, true));
      saveCollapsed();
    });

    /* ---- Oblíbené & nedávné ---- */
    function toggleOblibena(soubor) {
      const i = oblibene.indexOf(soubor);
      if (i >= 0) oblibene.splice(i, 1);
      else oblibene.push(soubor);
      uloz(localStorage, KEY_OBLIBENE, JSON.stringify(oblibene));
      obnovHvezdy();   // sekce v menu už není, stačí přebarvit hvězdičky
    }
    function obnovHvezdy() {
      menuSekceEl.querySelectorAll('li').forEach(li => {
        const a = li.querySelector('a[data-page]');
        const st = li.querySelector('.hvezda');
        if (a && st) st.classList.toggle('je-oblibena', oblibene.includes(a.dataset.page));
      });
    }
    // Menu sekci „Nedávné“ nemá; historie se vede kvůli dlaždicím
    // „🕘 Naposledy otevřené“ na úvodní stránce (obsah/aplikace.html).
    // zapocitat = otevřel uživatel (F5 se do „Nejčastěji používané“ nepočítá)
    function pridejNedavnou(soubor, zapocitat) {
      if (soubor === DOMOVSKA || soubor === NASTAVENI) return;
      nedavne = [soubor, ...nedavne.filter(f => f !== soubor)].slice(0, MAX_NEDAVNYCH);
      uloz(localStorage, KEY_NEDAVNE, JSON.stringify(nedavne));
      if (!zapocitat) return;
      pocty[soubor] = (pocty[soubor] || 0) + 1;
      uloz(localStorage, KEY_POCTY, JSON.stringify(pocty));
    }
    // Oblíbené, historii i počty mění i úvodní stránka (křížek, řazení, import;
    // jiný dokument, stejný origin) – bez převzetí změny by je další zápis
    // z rozcestníku přepsal starým stavem.
    window.addEventListener('storage', e => {
      if (e.key === KEY_OBLIBENE) { oblibene = nactiJson(KEY_OBLIBENE, []); obnovHvezdy(); }
      else if (e.key === KEY_NEDAVNE) nedavne = nactiJson(KEY_NEDAVNE, []);
      else if (e.key === KEY_POCTY) pocty = nactiJson(KEY_POCTY, {});
    });

    /* ---- Otevírání aplikací (hash = deep-link) ---- */
    let aktualni = null;

    function updateActiveLink(page) {
      menuSekceEl.querySelectorAll('a[data-page]').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
    }

    /* zUzivatele = navigaci vyvolal uživatel (klik v menu, změna hashe, zpráva
       z iframu). Při obnovení stránky (F5) je false: sbalení sekcí si uživatel
       nastavil sám a automatické rozbalení sekce s otevřenou aplikací by mu ho
       po každém načtení přepsalo. */
    function otevri(page, zUzivatele = true) {
      if (!page || page === aktualni) return;
      // hash může nést i parametry pro aplikaci: #obsah/x.html?k=… (sdílené odkazy) –
      // katalog se kontroluje podle samotného souboru, parametry jdou do iframu
      const soubor = page.split("?")[0];
      if (!podleSouboru.has(soubor) && soubor !== DOMOVSKA && soubor !== NASTAVENI) {
        // neznámý hash (i starý odkaz na aplikaci, která je dnes ve výukovém
        // webu) – nechodit mimo katalog, otevřít domovskou stránku
        page = DOMOVSKA;
      }
      aktualni = page;
      iframe.src = page;
      const zaklad = page.split('?')[0];
      zobrazStav(zaklad);
      uloz(sessionStorage, KEY_PAGE, zaklad);
      pridejNedavnou(zaklad, zUzivatele);
      updateActiveLink(zaklad);
      // sekci s aktivní aplikací rozbalit – jen když aplikaci otevřel uživatel
      if (zUzivatele) {
        const s = menuSekceEl.querySelector(`a[data-page="${CSS.escape(zaklad)}"]`)?.closest('.sekce');
        if (s) { setCollapsed(s, false); saveCollapsed(); }
      }
      if (window.matchMedia('(max-width: 1024px)').matches) closeMenu();
    }

    // štítek vpravo nahoře: v jaké fázi je otevřená aplikace
    const stavAplikace = document.getElementById('stavAplikace');
    function zobrazStav(soubor) {
      const stav = stavPodleId.get(podleSouboru.get(soubor)?.stav);
      stavAplikace.hidden = !stav;
      if (!stav) return;
      stavAplikace.className = 'stav-stitek stav-' + stav.id;
      stavAplikace.textContent = stav.label;
      stavAplikace.title = stav.popis;
    }

    window.addEventListener('hashchange', () => {
      otevri(decodeURIComponent(location.hash.slice(1)) || DOMOVSKA);
    });

    // dashboard (v iframe) může požádat o otevření aplikace
    window.addEventListener('message', e => {
      if (e.data && typeof e.data.otevri === 'string') {
        location.hash = e.data.otevri;
        otevri(e.data.otevri);
      }
      // dlaždice kategorie na úvodu: přepnout skupinu v menu jako klik v nabídce
      if (e.data && typeof e.data.skupina === 'string') {
        polozkySkupin.find(b => b.dataset.skupina === e.data.skupina)?.click();
        if (window.matchMedia('(max-width: 1024px)').matches) openMenu();
      }
    });

    document.getElementById('btnDomu').addEventListener('click', () => {
      history.pushState(null, '', location.pathname);
      otevri(DOMOVSKA);
    });
    document.getElementById('btnInfo').addEventListener('click', () => {
      location.hash = 'obsah/about.html';      // hashchange stránku otevře
    });
    document.getElementById('btnNastaveni').addEventListener('click', () => {
      location.hash = NASTAVENI;               // hashchange stránku otevře
    });
    document.getElementById('btnNoveOkno').addEventListener('click', () => {
      window.open(aktualni || DOMOVSKA, '_blank');
    });

    /* ---- Přepínání tématu ---- */
    // theme.js už téma použil při načtení; tady se jen přepíná a rozesílá.
    const btnTema = document.getElementById('btnTema');
    const themeColor = document.querySelector('meta[name="theme-color"]');

    function zobrazTema() {
      const light = document.documentElement.dataset.theme === 'light';
      btnTema.textContent = light ? '☀️' : '🌙';
      btnTema.title = light ? 'Přepnout na tmavý režim' : 'Přepnout na světlý režim';
      if (themeColor) themeColor.content = light ? '#ffffff' : '#2d2d2d';
    }
    zobrazTema();

    btnTema.addEventListener('click', () => {
      const light = document.documentElement.dataset.theme !== 'light';
      if (light) document.documentElement.dataset.theme = 'light';
      else delete document.documentElement.dataset.theme;
      uloz(localStorage, KEY_TEMA, light ? 'light' : 'dark');
      // storage událost se ve stejné záložce nespouští -> iframu to řekneme přímo
      iframe.contentWindow?.postMessage({ tema: light ? 'light' : 'dark' }, '*');
      zobrazTema();
    });

    /* ---- Kategorie v rozbalovací nabídce ---- */
    const polozkySkupin = [];
    function skupinaPocet(id) {
      return KATALOG_SEKCE.reduce((n, s) =>
        n + ((id === 'vse' || s.skupina === id) ? s.polozky.length : 0), 0);
    }
    function updateSkupinaState() {
      polozkySkupin.forEach(p => {
        const je = p.dataset.skupina === aktivniSkupina;
        p.classList.toggle('active', je);
        p.setAttribute('aria-selected', String(je));
      });
      const aktivni = polozkySkupin.find(p => p.dataset.skupina === aktivniSkupina);
      if (aktivni) {
        skupinyToggleLabel.textContent = '';
        naplnSIkonou(skupinyToggleLabel, IKONY?.skupiny[aktivni.dataset.skupina], aktivni.dataset.label);
      }
    }
    function makeSkupina(id, label) {
      const b = document.createElement('button');
      b.className = 'skupina-polozka';
      b.dataset.skupina = id;
      b.dataset.label = label;
      b.setAttribute('role', 'option');
      b.innerHTML = `<span class="nazev"></span><span class="pill-pocet">${skupinaPocet(id)}</span>`;
      const img = ikona(IKONY?.skupiny[id]);
      if (img) b.prepend(img);
      b.querySelector('.nazev').textContent = img ? bezEmoji(label) : label;
      b.addEventListener('click', () => {
        aktivniSkupina = id;
        uloz(localStorage, KEY_SKUPINA, id);
        nastavDotaz('');
        // po přepnutí kategorie se sekce sbalí — cílem je přehled sekcí,
        // ne sloupec desítek položek, kterým se musí projet
        vsechnySekce().forEach(s => setCollapsed(s, true));
        saveCollapsed();
        updateSkupinaState();
        aplikujFiltr();
        setSkupinyOpen(false);
      });
      skupinyEl.appendChild(b);
      polozkySkupin.push(b);
    }
    makeSkupina('vse', '📂 Vše');
    KATALOG_SKUPINY.forEach(g => {
      if (KATALOG_SEKCE.some(s => s.skupina === g.id)) makeSkupina(g.id, g.label);
    });
    if (!polozkySkupin.some(p => p.dataset.skupina === aktivniSkupina)) aktivniSkupina = 'vse';
    updateSkupinaState();

    /* ---- Filtr podle stavu (vývoj / beta / stable) ---- */
    const stavyFiltrEl = document.getElementById('stavyFiltr');
    function makeStavFiltr(id, label, popis) {
      const b = document.createElement('button');
      b.dataset.stav = id;
      const pocet = KATALOG_SEKCE.reduce((n, s) =>
        n + s.polozky.filter(p => id === 'vse' || p.stav === id).length, 0);
      b.title = `${popis} (${pocet})`;
      if (id !== 'vse') {
        const t = document.createElement('span');
        t.className = 'tecka';
        b.appendChild(t);
      }
      b.appendChild(document.createTextNode(label));
      b.addEventListener('click', () => {
        aktivniStav = id;
        uloz(localStorage, KEY_STAV, id);
        updateStavState();
        aplikujFiltr();
      });
      stavyFiltrEl.appendChild(b);
    }
    function updateStavState() {
      stavyFiltrEl.querySelectorAll('button').forEach(b => {
        const je = b.dataset.stav === aktivniStav;
        b.classList.toggle('active', je);
        b.setAttribute('aria-pressed', String(je));
      });
    }
    makeStavFiltr('vse', 'Vše', 'Všechny stavy');
    KATALOG_STAVY.forEach(s => makeStavFiltr(s.id, s.label, s.popis));
    updateStavState();
    const vyhovujeStavu = li => aktivniStav === 'vse' || li.dataset.stav === aktivniStav;

    /* ---- Hledání (hlavička + menu) + filtr skupin ---- */
    const hledatMenu = document.getElementById('hledatMenu');
    const searchInputs = [hledatMenu];

    function nastavDotaz(val) {
      searchInputs.forEach(i => { i.value = val; });
    }
    function aktualniDotaz() {
      const i = searchInputs.find(x => x.value.trim());
      return i ? norm(i.value.trim()) : '';
    }

    function aplikujFiltr() {
      const q = aktualniDotaz();
      zrusKbFokus();
      if (q) {
        let celkemShod = 0;
        vsechnySekce().forEach(s => {
          let shoda = 0;
          s.querySelectorAll('li').forEach(li => {
            const a = li.querySelector('a[data-page]');
            const match = a.dataset.hledani.includes(q) && vyhovujeStavu(li);
            li.classList.toggle('skryto', !match);
            a.classList.toggle('zvyrazneno', match);
            if (match) shoda++;
          });
          s.classList.toggle('skryto', shoda === 0);
          if (shoda > 0) s.classList.remove('collapsed');
          celkemShod += shoda;
        });
        bezVysledku.classList.toggle('zobraz', celkemShod === 0);
        return;
      }
      bezVysledku.classList.remove('zobraz');
      let celkem = 0;
      vsechnySekce().forEach(s => {
        let videt = 0;
        s.querySelectorAll('li').forEach(li => {
          const ok = vyhovujeStavu(li);
          li.classList.toggle('skryto', !ok);
          if (ok) videt++;
        });
        const patri = (aktivniSkupina === 'vse' || s.dataset.skupina === aktivniSkupina) && videt > 0;
        s.classList.toggle('skryto', !patri);
        s.classList.toggle('collapsed',
          !s.classList.contains('jedina') && collapsedSet.has(s.dataset.nazev));
        s.querySelectorAll('a[data-page]').forEach(a => a.classList.remove('zvyrazneno'));
        const pocet = s.querySelector('h2 .pocet');
        if (pocet) pocet.textContent = videt;
        if (patri) celkem += videt;
      });
      bezVysledku.classList.toggle('zobraz', celkem === 0);
    }

    searchInputs.forEach(input => {
      input.addEventListener('input', () => {
        nastavDotaz(input.value);
        aplikujFiltr();
      });
    });

    /* ---- Klávesové ovládání ---- */
    let kbIndex = -1;
    function viditelneOdkazy() {
      return vsechnySekce()
        .filter(s => !s.classList.contains('skryto') && !s.classList.contains('collapsed'))
        .flatMap(s => [...s.querySelectorAll('li:not(.skryto) a[data-page]')]);
    }
    function zrusKbFokus() {
      kbIndex = -1;
      menuSekceEl.querySelectorAll('a.kb-focus').forEach(a => a.classList.remove('kb-focus'));
    }
    function posunKbFokus(smer) {
      const odkazy = viditelneOdkazy();
      if (!odkazy.length) return;
      kbIndex = (kbIndex + smer + odkazy.length) % odkazy.length;
      menuSekceEl.querySelectorAll('a.kb-focus').forEach(a => a.classList.remove('kb-focus'));
      const cil = odkazy[kbIndex];
      cil.classList.add('kb-focus');
      cil.scrollIntoView({ block: 'nearest' });
    }

    document.addEventListener('keydown', e => {
      const vInputu = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        (window.matchMedia('(max-width: 1024px)').matches ? openMenu : () => {})();
        hledatMenu.focus();
        hledatMenu.select();
        return;
      }
      if (e.key === '/' && !vInputu) {
        e.preventDefault();
        hledatMenu.focus();
        hledatMenu.select();
        return;
      }
      if (e.key === 'Escape') {
        if (aktualniDotaz()) { nastavDotaz(''); aplikujFiltr(); }
        setSkupinyOpen(false);
        closeMenu();
        return;
      }
      if (vInputu && searchInputs.includes(document.activeElement)) {
        if (e.key === 'ArrowDown') { e.preventDefault(); posunKbFokus(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); posunKbFokus(-1); }
        else if (e.key === 'Enter') {
          const foc = menuSekceEl.querySelector('a.kb-focus') || viditelneOdkazy()[0];
          if (foc) { location.hash = foc.dataset.page; nastavDotaz(''); aplikujFiltr(); }
        }
      }
    });

    /* ---- Hamburger: vysouvací menu na telefonu a tabletu ---- */
    const hamburger = document.getElementById('hamburger');
    const menuOverlay = document.getElementById('menuOverlay');

    function openMenu() {
      menuEl.classList.add('open');
      menuOverlay.classList.add('show');
      hamburger.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
      menuEl.classList.remove('open');
      menuOverlay.classList.remove('show');
      hamburger.setAttribute('aria-expanded', 'false');
    }
    hamburger.addEventListener('click', () =>
      menuEl.classList.contains('open') ? closeMenu() : openMenu());
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('resize', () => {
      if (!window.matchMedia('(max-width: 1024px)').matches) closeMenu();
    });

    /* ---- Start ---- */
    renderMenu();
    const zHashe = decodeURIComponent(location.hash.slice(1));
    // false = obnovení stránky, ne akce uživatele -> sbalení sekcí zůstane, jak si ho nastavil
    otevri(zHashe || precti(sessionStorage, KEY_PAGE) || DOMOVSKA, false);

    /* ---- PWA ---- */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
