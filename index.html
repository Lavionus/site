<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webová Aplikace | Dashboard</title>
  <link rel="stylesheet" href="common.css" />
  <script src="theme.js"></script>
  <script src="podpis.js" defer></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>" />
  <meta name="theme-color" content="#2d2d2d" />
  <style>
    body {
      height: 100vh;
      overflow: hidden;
    }

    /* Layout */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Hlavička */
    .hlavicka {
      background-color: var(--bg-elevated);
      color: var(--text);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hlavicka-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .hlavicka h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Hamburger – jen na malých obrazovkách */
    .hamburger {
      display: none;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .hamburger:hover {
      background-color: var(--accent);
      color: var(--on-accent, #fff);
      border-color: var(--accent);
    }

    /* Tmavé pozadí pod vysunutým menu */
    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* Hlavní obsah */
    .obsah {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Menu */
    .menu {
      width: 270px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--bg-panel);
    }

    /* Lepkavá horní lišta menu: hledání + filtrovací pilulky */
    .menu-top {
      position: sticky;
      top: 0;
      z-index: 5;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .menu-search-wrap {
      display: flex;
      gap: 6px;
      padding: 10px 10px 6px 10px;
    }

    .menu-search {
      flex: 1;
      min-width: 0;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .menu-search:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    /* vestavěný křížek je drobný – nahrazuje ho samostatné tlačítko */
    .menu-search::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    .menu-search-zrus {
      flex: none;
      align-self: stretch;
      width: 34px;
      display: grid;
      place-items: center;
      padding: 2px;
      background-clip: content-box; /* podbarvení 2 px od okraje */
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }
    /* s textem v poli lehce červený, po najetí výrazněji */
    .menu-search-zrus:not(:disabled) {
      color: var(--danger);
      background-color: color-mix(in srgb, var(--danger) 14%, transparent);
    }
    .menu-search-zrus:hover:not(:disabled) {
      background-color: color-mix(in srgb, var(--danger) 30%, transparent);
    }
    .menu-search-zrus:disabled { opacity: 0.45; cursor: default; }

    /* Rozbalovací tlačítko s kategoriemi (dřív pilulky pod hlavičkou —
       zabíraly nahoře v menu moc místa) */
    .skupiny-wrap {
      position: relative;
      padding: 0 10px 10px 10px;
    }

    .skupiny-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      text-align: left;
      padding: 7px 10px;
      cursor: pointer;
    }

    .skupiny-toggle:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .skupiny-toggle:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .skupiny-toggle #skupinyToggleLabel {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skupiny-toggle .sipka {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .skupiny-toggle[aria-expanded="true"] .sipka {
      transform: rotate(180deg);
    }

    /* Vysunutá nabídka kategorií */
    .skupiny {
      display: none;
      position: absolute;
      left: 10px;
      right: 10px;
      top: calc(100% - 6px);
      z-index: 20;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-height: 60vh;
      overflow-y: auto;
      padding: 4px;
    }

    .skupiny.show {
      display: block;
    }

    .skupina-polozka {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.8rem;
      text-align: left;
      padding: 6px 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .skupina-polozka .nazev {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skupina-polozka:hover {
      background-color: var(--bg-hover);
      color: var(--text);
    }

    .skupina-polozka.active {
      background-color: var(--accent);
      color: var(--on-accent, #fff);
      font-weight: 600;
    }

    .skupina-polozka .pill-pocet {
      margin-left: auto;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-faint);
      background-color: var(--bg-input);
      border-radius: 9px;
      padding: 0 6px;
      line-height: 1.5;
    }

    .skupina-polozka:hover .pill-pocet,
    .skupina-polozka.active .pill-pocet {
      color: #fff;
      background-color: rgba(0, 0, 0, 0.25);
    }

    /* Hláška, když hledání nic nenajde */
    .bez-vysledku {
      display: none;
      padding: 18px 16px;
      color: var(--text-faint);
      font-size: 0.85rem;
      text-align: center;
    }
    .bez-vysledku.zobraz { display: block; }

    /* Krátké právní upozornění na konci menu */
    .menu-pravni {
      margin: 0;
      padding: 12px 15px 16px;
      border-top: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 0.7rem;
      line-height: 1.45;
    }
    .menu-pravni a { color: var(--accent); white-space: nowrap; }

    /* Strom menu: kategorie (skupina) → podkategorie (sekce) → stránky */
    .skupina-blok {
      border-bottom: 1px solid var(--border);
    }

    .skupina-blok h2,
    .sekce h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }

    .skupina-blok h2 {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin: 6px 8px;
      padding: 7px 6px;
    }

    .sekce h3 {
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 600;
      margin: 1px 8px 1px 6px;
      padding: 5px 6px;
    }

    .skupina-blok h2:hover,
    .sekce h3:hover {
      background-color: var(--bg-elevated);
    }
    .skupina-blok h2:hover { color: var(--accent-hover); }

    /* podkategorie odsazené pod kategorií s vodicí linkou */
    .skupina-telo {
      margin: 0 0 8px 18px;
      border-left: 1px solid var(--border);
    }
    .skupina-blok.collapsed .skupina-telo { display: none; }
    .skupina-blok.skryto { display: none; }

    /* posun k položce nesmí skončit pod lepkavou lištou s hledáním */
    .menu a, .menu h2, .menu h3 { scroll-margin-top: 130px; }

    .skupina-blok h2 .pocet,
    .sekce h3 .pocet {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-faint);
      background-color: var(--bg-hover);
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 600;
    }

    .skupina-blok h2 .sipka,
    .sekce h3 .sipka {
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .skupina-blok.collapsed h2 .sipka,
    .sekce.collapsed h3 .sipka {
      transform: rotate(-90deg);
    }

    .sekce.collapsed ul {
      display: none;
    }

    .sekce ul {
      list-style: none;
    }

    /* Jediná podkategorie v kategorii (Vaření, Právo…): její hlavička by jen
       zdvojovala název kategorie, proto se stránky zobrazí rovnou a sekce
       se nedá sbalit. */
    .sekce.jedina h3 {
      display: none;
    }

    .sekce.jedina ul {
      display: block;
    }

    .sekce li {
      position: relative;
    }

    .sekce a {
      display: block;
      padding: 7px 32px 7px 24px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sekce a:hover,
    .sekce a.kb-focus {
      background-color: var(--bg-hover);
      color: var(--text);
      padding-left: 28px;
    }

    /* Ikony z balíku assets/index-icons (místo úvodního emoji názvu) */
    .ikona {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border-radius: 5px;
    }
    /* záporný okraj: větší ikona nezvětší výšku řádku menu */
    .sekce a .ikona {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      vertical-align: middle;
      margin: -6px 10px -6px -4px;
    }
    .skupina-blok h2 .titulek,
    .sekce h3 .titulek {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .skupina-blok h2 .ikona,
    .sekce h3 .ikona {
      width: 24px;
      height: 24px;
      margin: -4px 0;
    }
    #skupinyToggleLabel .ikona {
      vertical-align: middle;
      margin: -4px 6px -4px 0;
    }

    .sekce a.active {
      background-color: var(--bg-control);
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    /* Tečka stavu stránky (vývoj / beta / stable) vlevo od názvu */
    .sekce li[data-stav]::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-top: -3px;
      border-radius: 50%;
      pointer-events: none;
    }
    .sekce li[data-stav="vyvoj"]::before  { background-color: var(--warn); }
    .sekce li[data-stav="beta"]::before   { background-color: var(--accent); }
    .sekce li[data-stav="stable"]::before { background-color: var(--ok); }

    /* Filtr podle stavu: řada přepínačů pod kategoriemi */
    .stavy-filtr {
      display: flex;
      gap: 4px;
      padding: 0 10px 10px 10px;
    }
    .stavy-filtr button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 0;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 2px;
      cursor: pointer;
      white-space: nowrap;
    }
    .stavy-filtr button:hover { color: var(--text); border-color: var(--border-strong); }
    .stavy-filtr button.active {
      color: var(--text);
      border-color: currentColor;
      background-color: var(--bg-hover);
    }
    .stavy-filtr button[data-stav="vyvoj"].active  { color: var(--warn); }
    .stavy-filtr button[data-stav="beta"].active   { color: var(--accent); }
    .stavy-filtr button[data-stav="stable"].active { color: var(--ok); }
    .stavy-filtr .tecka {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: none;
    }
    .stavy-filtr [data-stav="vyvoj"] .tecka  { background-color: var(--warn); }
    .stavy-filtr [data-stav="beta"] .tecka   { background-color: var(--accent); }
    .stavy-filtr [data-stav="stable"] .tecka { background-color: var(--ok); }

    /* Štítek stavu otevřené aplikace vpravo nahoře v hlavičce */
    #stavAplikace { cursor: help; }
    #stavAplikace[hidden] { display: none; }

    /* Hvězdička oblíbených */
    .hvezda {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-faint);
      opacity: 0;
      padding: 2px 4px;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .sekce li:hover .hvezda { opacity: 0.7; }
    .hvezda:hover { opacity: 1 !important; color: var(--warn); }
    .hvezda.je-oblibena { opacity: 0.9; color: var(--warn); }

    /* Ovládání v hlavičce */
    .ovladani {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ovladani button {
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .ovladani button:hover {
      background-color: var(--accent);
      color: var(--on-accent, #fff);
      border-color: var(--accent);
    }

    .jen-cs {
      margin-left: 6px;
      padding: 0 4px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font-size: 0.65rem;
      color: var(--text-faint);
    }

    /* Volba jazyka – nabídka se generuje z rejstříku i18n/jazyky.js */
    .jazyk-wrap { position: relative; }
    .jazyk-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      z-index: 30;
      min-width: 150px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 4px;
    }
    .ovladani .jazyk-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: none;
    }
    .ovladani .jazyk-menu button[aria-checked="true"] { color: var(--text); font-weight: 600; }

    /* zvýraznění při hledání */
    .sekce a.zvyrazneno {
      background-color: var(--accent-soft);
      color: var(--text);
    }

    .sekce.skryto { display: none; }
    .sekce li.skryto { display: none; }

    @media (max-width: 768px) {
      .ovladani .jen-desktop { display: none; }
    }

    /* Drobečková navigace nad aplikací: Hlavní stránka › kategorie › podkategorie › stránka */
    .drobky {
      display: flex;
      align-items: center;
      flex-wrap: wrap;   /* na úzkém displeji raději dva řádky než uříznutá cesta */
      gap: 2px;
      flex-shrink: 0;
      padding: 4px 10px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .drobky a,
    .drobky .aktualni {
      padding: 2px 6px;
      border-radius: 4px;
    }
    .drobky a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .drobky a:hover {
      color: var(--accent);
      background-color: var(--bg-hover);
    }
    .drobky .aktualni {
      color: var(--text);
      font-weight: 600;
    }
    .drobky .oddelovac { color: var(--text-faint); }

    /* Pracovní plocha */
    .pracovni-plocha {
      flex: 1;
      background-color: var(--bg-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pracovni-plocha iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Responzivita – telefon a tablet: menu skryté v hamburgeru */
    @media (max-width: 1024px) {
      .hamburger { display: inline-flex; }

      .menu {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 80%;
        max-width: 300px;
        z-index: 1000;
        border-right: 1px solid var(--border);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 2px 0 14px rgba(0, 0, 0, 0.55);
      }
      .menu.open { transform: translateX(0); }

      .menu-overlay { display: block; }
      .menu-overlay.show { opacity: 1; pointer-events: auto; }

      .pracovni-plocha { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hlavicka">
      <div class="hlavicka-left">
        <button id="hamburger" class="hamburger" aria-label="Otevřít menu" aria-expanded="false" aria-controls="hlavniMenu">☰</button>
        <h1>Webový systém</h1>
      </div>
      <div class="ovladani">
        <span id="stavAplikace" class="stav-stitek" hidden></span>
        <button id="btnDomu" title="Úvodní přehled">🏠</button>
        <button id="btnTema" title="Přepnout světlý / tmavý režim">🌙</button>
        <span class="jazyk-wrap" id="jazykWrap" data-i18n="ne" hidden>
          <button id="btnJazyk" title="Jazyk / Language" aria-haspopup="menu" aria-expanded="false" aria-controls="jazykMenu"></button>
          <div class="jazyk-menu" id="jazykMenu" role="menu" hidden></div>
        </span>
        <button id="btnInfo" title="O projektu – podmínky užívání a autorská práva">ℹ️</button>
        <button id="btnNastaveni" title="Nastavení – data uložená v prohlížeči">⚙️</button>
        <button id="btnNoveOkno" title="Otevřít aktuální aplikaci v novém okně">🗗</button>
        <button id="rozbalitVse" class="jen-desktop" title="Rozbalit vše">⊞ Rozbalit</button>
        <button id="sbalitVse" class="jen-desktop" title="Sbalit vše">⊟ Sbalit</button>
      </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="obsah">
      <nav class="menu" id="hlavniMenu">
        <div class="menu-top">
          <div class="menu-search-wrap">
            <input type="search" id="hledatMenu" class="menu-search" placeholder="🔍 Hledat aplikaci… (Ctrl+K)" autocomplete="off" />
            <button type="button" id="zrusHledani" class="menu-search-zrus" title="Zrušit hledání" aria-label="Zrušit hledání" disabled>✕</button>
          </div>
          <div class="skupiny-wrap">
            <button class="skupiny-toggle" id="skupinyToggle" title="Filtrovat podle kategorie"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="skupiny">
              <span id="skupinyToggleLabel">📂 Vše</span>
              <span class="sipka">▾</span>
            </button>
            <div class="skupiny" id="skupiny" role="listbox" aria-label="Kategorie aplikací"></div>
          </div>
          <div class="stavy-filtr" id="stavyFiltr" role="group" aria-label="Filtrovat podle stavu"></div>
        </div>
        <div id="menuSekce"></div>
        <div class="bez-vysledku" id="bezVysledku">Žádná aplikace neodpovídá hledání ani filtru.</div>
        <p class="menu-pravni">Bez záruky, autor neodpovídá za škody. Web je duševním vlastnictvím autora.
          <a href="#obsah/about.html">Podmínky a O projektu</a></p>
      </nav>

      <main class="pracovni-plocha">
        <nav class="drobky" id="drobky" aria-label="Umístění na webu"></nav>
        <iframe name="okno" src="obsah/aplikace.html" title="Aktivní aplikace" allow="fullscreen; autoplay; encrypted-media; picture-in-picture; camera" allowfullscreen></iframe>
      </main>
    </div>
  </div>

  <script src="apps.js"></script>
  <script src="assets/index-icons/ikony.js"></script>
  <script>
    /* ============================================================
       Rozcestník: menu se generuje z katalogu v apps.js.
       Stav: hash v URL (deep-link), localStorage (téma, oblíbené,
       nedávné, sbalené sekce, skupina), sessionStorage (poslední
       otevřená stránka).
       ============================================================ */
    /* Zápis do úložiště: přes file:// (a v přísném režimu soukromí) je kvóta
       nulová a setItem vyhodí výjimku — nesmí shodit zbytek skriptu, web pak
       funguje dál, jen si nic nezapamatuje. */
    function uloz(uloziste, klic, hodnota) {
      try { uloziste.setItem(klic, hodnota); }
      catch { /* bez trvalé paměti */ }
    }

    function precti(uloziste, klic) {
      try { return uloziste.getItem(klic); }
      catch { return null; }
    }

    if (location.protocol === 'file:') {
      console.warn('Web je otevřený přes file:// — nastavení se neuloží a část '
        + 'aplikací nenačte data. Spusť ./test_local.sh a otevři http://localhost:8000/');
    }

    const DOMOVSKA = 'obsah/aplikace.html';
    const NASTAVENI = 'obsah/nastaveni.html';   // mimo katalog, otevírá se tlačítkem ⚙️
    const KEY_PAGE = 'webapp_current_page';
    const KEY_COLLAPSE = 'webapp_collapsed_sections';
    const KEY_SKUPINA = 'webapp_skupina';
    const KEY_OBLIBENE = 'webapp_oblibene';
    const KEY_NEDAVNE = 'webapp_nedavne';
    const KEY_POCTY = 'webapp_pocty';     // soubor -> počet otevření (úvod: Nejčastěji používané)
    const MAX_NEDAVNYCH = 24;
    const KEY_TEMA = 'webapp_theme';
    const KEY_STAV = 'webapp_stav_filtr';

    const iframe = document.querySelector('iframe[name="okno"]');
    const menuEl = document.getElementById('hlavniMenu');
    const menuSekceEl = document.getElementById('menuSekce');
    const skupinyEl = document.getElementById('skupiny');
    const skupinyToggle = document.getElementById('skupinyToggle');
    const skupinyToggleLabel = document.getElementById('skupinyToggleLabel');
    const bezVysledku = document.getElementById('bezVysledku');

    // Kategorie visí v rozbalovacím tlačítku — vysunutá nabídka se překrývá
    // se seznamem aplikací, takže neposouvá menu dolů.
    function setSkupinyOpen(open) {
      skupinyEl.classList.toggle('show', open);
      skupinyToggle.setAttribute('aria-expanded', String(open));
    }
    skupinyToggle.addEventListener('click', () => {
      setSkupinyOpen(!skupinyEl.classList.contains('show'));
    });
    // klik kamkoli mimo tlačítko i nabídku ji zavře
    document.addEventListener('click', e => {
      if (!e.target.closest('.skupiny-wrap')) setSkupinyOpen(false);
    });

    const nactiJson = (key, def) => {
      try { return JSON.parse(precti(localStorage, key)) ?? def; }
      catch { return def; }
    };

    // Při první návštěvě (žádné uložené preference) start se všemi kategoriemi
    // i sekcemi sbalenými — jinak by uvítal dlouhý sloupec stovek položek.
    // Kategorie (skupina) má v množině klíč 'skupina:<id>', sekce svůj název.
    const klicSkupiny = id => 'skupina:' + id;
    let collapsedSet = precti(localStorage, KEY_COLLAPSE) === null
      ? new Set([...KATALOG_SEKCE.map(s => s.nazev), ...KATALOG_SKUPINY.map(g => klicSkupiny(g.id))])
      : new Set(nactiJson(KEY_COLLAPSE, []));
    let aktivniSkupina = precti(localStorage, KEY_SKUPINA) || 'vse';
    // Oblíbené nemají vlastní sekci v menu, hvězdičky plní dlaždice na úvodní stránce.
    let oblibene = nactiJson(KEY_OBLIBENE, []);
    let nedavne = nactiJson(KEY_NEDAVNE, []);
    let pocty = nactiJson(KEY_POCTY, {});
    let aktivniStav = precti(localStorage, KEY_STAV) || 'vse';
    const stavPodleId = new Map(KATALOG_STAVY.map(s => [s.id, s]));
    if (aktivniStav !== 'vse' && !stavPodleId.has(aktivniStav)) aktivniStav = 'vse';

    // index katalogu: soubor -> {nazev, tagy}
    const podleSouboru = new Map();
    KATALOG_SEKCE.forEach(s => s.polozky.forEach(p => podleSouboru.set(p.soubor, p)));

    // hledání bez diakritiky
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    // hledá se i podle názvu sekce (podkategorie) a skupiny (kategorie)
    const skupinaPodleId = new Map(KATALOG_SKUPINY.map(g => [g.id, g.label]));
    // v jiném jazyce se hledá česky i v tom jazyce (i18n.js, slovník _katalog)
    const preloz = s => (window.I18N ? I18N.preloz(s) : s);
    const dvojjazycne = s => (preloz(s) === s ? s : s + ' ' + preloz(s));
    const tagyJazyka = soubor => (window.I18N ? I18N.tagy(soubor) : []);
    // umístění stránky: soubor -> sekce (podkategorie) -> skupina (kategorie);
    // sekce má do adresy krátký kód z názvu ("🧩 Hlavolamy" -> "hlavolamy"),
    // stejně ho počítá obsah/aplikace.html
    const sekcePodleSouboru = new Map();
    KATALOG_SEKCE.forEach(s => s.polozky.forEach(p => sekcePodleSouboru.set(p.soubor, s)));
    const kodSekce = s => norm(bezEmoji(s.nazev)).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const sekcePodleKodu = new Map(KATALOG_SEKCE.map(s => [kodSekce(s), s]));
    const skupinaObj = new Map(KATALOG_SKUPINY.map(g => [g.id, g]));
    const kontextHledani = new Map();
    KATALOG_SEKCE.forEach(s => s.polozky.forEach(p => kontextHledani.set(p.soubor,
      (kontextHledani.get(p.soubor) || '') + ' ' + dvojjazycne(s.nazev) + ' ' + dvojjazycne(skupinaPodleId.get(s.skupina) || ''))));

    /* ---- Ikony z balíku assets/index-icons ----
       Ikona nahrazuje úvodní emoji názvu. Co v mapě ikon chybí (nová
       stránka před přegenerováním balíku), zůstává s emoji jako dřív. */
    const IKONY = typeof KATALOG_IKONY !== 'undefined' ? KATALOG_IKONY : null;
    function ikona(cesta) {
      if (!IKONY || !cesta) return null;
      const img = document.createElement('img');
      img.className = 'ikona';
      img.src = IKONY.koren + cesta + '.webp';
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      return img;
    }
    // "🌧️ Předpověď" -> "Předpověď": první slovo se zahodí, když obsahuje znak, který
    // není písmeno ani číslice (stejně jako symbol ikony určuje tools/generate-index-icons.mjs)
    function bezEmoji(nazev) {
      const m = nazev.match(/^(\S+)\s+(.+)$/u);
      return (m && /[^\p{L}\p{N}]/u.test(m[1])) ? m[2] : nazev;
    }
    // obsah prvku: ikona + název bez emoji, nebo původní název s emoji
    function naplnSIkonou(el, cesta, nazev) {
      const img = ikona(cesta);
      if (img) el.append(img, bezEmoji(nazev));
      else el.textContent = nazev;
    }

    /* ---- Stavba menu z katalogu ---- */
    function vytvorPolozku(p) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + p.soubor;               // klik = změna hashe -> hashchange otevře aplikaci
      a.dataset.page = p.soubor;
      naplnSIkonou(a, IKONY?.stranky[p.soubor], p.nazev);
      a.dataset.hledani = norm(dvojjazycne(p.nazev) + ' ' + [...(p.tagy || []), ...tagyJazyka(p.soubor)].join(' ')
        + (kontextHledani.get(p.soubor) || ''));
      // stránka, která se nepřekládá (jen_cs) – v jiném jazyce webu štítek „CZ“
      if (p.jen_cs && window.I18N && I18N.jazyk !== 'cs') {
        const cz = document.createElement('span');
        cz.className = 'jen-cs';
        cz.textContent = 'CZ';
        cz.title = 'Jen česky';
        a.appendChild(cz);
      }
      const stav = stavPodleId.get(p.stav);
      if (stav) {
        li.dataset.stav = stav.id;
        a.title = `${preloz(p.nazev)} – ${preloz(stav.label)}: ${preloz(stav.popis)}`;
      }
      const st = document.createElement('button');
      st.className = 'hvezda';
      st.title = 'Přidat / odebrat z oblíbených';
      st.textContent = '★';
      st.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        toggleOblibena(p.soubor);
      });
      li.appendChild(a);
      li.appendChild(st);
      return li;
    }

    // hlavička kategorie (h2) i podkategorie (h3): ikona, název, počet, šipka
    function vytvorHlavicku(tag, cestaIkony, nazev, pocet) {
      const h = document.createElement(tag);
      const span = document.createElement('span');
      span.className = 'titulek';
      naplnSIkonou(span, cestaIkony, nazev);
      const badge = document.createElement('span');
      badge.className = 'pocet';
      badge.textContent = pocet;
      const sipka = document.createElement('span');
      sipka.className = 'sipka';
      sipka.textContent = '▾';
      h.append(span, badge, sipka);
      return h;
    }

    // klik na hlavičku sbalí / rozbalí kategorii nebo podkategorii
    function sbalovaci(div, hlavicka) {
      if (collapsedSet.has(div.dataset.nazev)) div.classList.add('collapsed');
      hlavicka.addEventListener('click', () => {
        setCollapsed(div, !div.classList.contains('collapsed'));
        saveCollapsed();
      });
    }

    function vytvorSkupinu(g, sekce) {
      const div = document.createElement('div');
      div.className = 'skupina-blok';
      div.dataset.nazev = klicSkupiny(g.id);
      div.dataset.skupina = g.id;
      const h2 = vytvorHlavicku('h2', IKONY?.skupiny[g.id], g.label,
        sekce.reduce((n, s) => n + s.polozky.length, 0));
      const telo = document.createElement('div');
      telo.className = 'skupina-telo';
      sekce.forEach(s => telo.appendChild(vytvorSekci(s.nazev, s.skupina, s.polozky, sekce.length === 1)));
      div.append(h2, telo);
      sbalovaci(div, h2);
      return div;
    }

    function vytvorSekci(nazev, skupina, polozky, jedina) {
      const div = document.createElement('div');
      div.className = 'sekce';
      div.dataset.nazev = nazev;
      div.dataset.skupina = skupina;
      const h3 = vytvorHlavicku('h3', IKONY?.sekce[nazev], nazev, polozky.length);
      const ul = document.createElement('ul');
      polozky.forEach(p => ul.appendChild(vytvorPolozku(p)));
      div.append(h3, ul);
      if (jedina) div.classList.add('jedina');
      else sbalovaci(div, h3);
      return div;
    }

    function renderMenu() {
      menuSekceEl.innerHTML = '';
      KATALOG_SKUPINY.forEach(g => {
        const sekce = KATALOG_SEKCE.filter(s => s.skupina === g.id);
        if (sekce.length) menuSekceEl.appendChild(vytvorSkupinu(g, sekce));
      });
      obnovHvezdy();
      updateActiveLink(aktualni);
      aplikujFiltr();
    }

    /* ---- Sbalování sekcí ---- */
    function saveCollapsed() {
      uloz(localStorage, KEY_COLLAPSE, JSON.stringify([...collapsedSet]));
    }
    function setCollapsed(s, collapsed) {
      if (s.classList.contains('jedina')) return;   // jedinou sekci kategorie není co sbalovat
      s.classList.toggle('collapsed', collapsed);
      if (collapsed) collapsedSet.add(s.dataset.nazev);
      else collapsedSet.delete(s.dataset.nazev);
    }
    const vsechnySekce = () => [...menuSekceEl.querySelectorAll('.sekce')];
    const vsechnySkupiny = () => [...menuSekceEl.querySelectorAll('.skupina-blok')];

    document.getElementById('rozbalitVse').addEventListener('click', () => {
      [...vsechnySkupiny(), ...vsechnySekce()].forEach(s => setCollapsed(s, false));
      saveCollapsed();
    });
    document.getElementById('sbalitVse').addEventListener('click', () => {
      [...vsechnySkupiny(), ...vsechnySekce()].forEach(s => setCollapsed(s, true));
      saveCollapsed();
    });

    /* ---- Oblíbené & nedávné ---- */
    function toggleOblibena(soubor) {
      const i = oblibene.indexOf(soubor);
      if (i >= 0) oblibene.splice(i, 1);
      else oblibene.push(soubor);
      uloz(localStorage, KEY_OBLIBENE, JSON.stringify(oblibene));
      obnovHvezdy();   // sekce v menu už není, stačí přebarvit hvězdičky
    }
    function obnovHvezdy() {
      menuSekceEl.querySelectorAll('li').forEach(li => {
        const a = li.querySelector('a[data-page]');
        const st = li.querySelector('.hvezda');
        if (a && st) st.classList.toggle('je-oblibena', oblibene.includes(a.dataset.page));
      });
    }
    // Menu sekci „Nedávné“ nemá; historie se vede kvůli dlaždicím
    // „🕘 Naposledy otevřené“ na úvodní stránce (obsah/aplikace.html).
    // zapocitat = otevřel uživatel (F5 se do „Nejčastěji používané“ nepočítá)
    function pridejNedavnou(soubor, zapocitat) {
      if (soubor === DOMOVSKA || soubor === NASTAVENI) return;
      nedavne = [soubor, ...nedavne.filter(f => f !== soubor)].slice(0, MAX_NEDAVNYCH);
      uloz(localStorage, KEY_NEDAVNE, JSON.stringify(nedavne));
      if (!zapocitat) return;
      pocty[soubor] = (pocty[soubor] || 0) + 1;
      uloz(localStorage, KEY_POCTY, JSON.stringify(pocty));
    }
    // Oblíbené, historii i počty mění i úvodní stránka (křížek, řazení, import;
    // jiný dokument, stejný origin) – bez převzetí změny by je další zápis
    // z rozcestníku přepsal starým stavem.
    window.addEventListener('storage', e => {
      if (e.key === KEY_OBLIBENE) { oblibene = nactiJson(KEY_OBLIBENE, []); obnovHvezdy(); }
      else if (e.key === KEY_NEDAVNE) nedavne = nactiJson(KEY_NEDAVNE, []);
      else if (e.key === KEY_POCTY) pocty = nactiJson(KEY_POCTY, {});
    });

    /* ---- Otevírání aplikací (hash = deep-link) ---- */
    let aktualni = null;

    function updateActiveLink(page) {
      menuSekceEl.querySelectorAll('a[data-page]').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
    }

    /* zUzivatele = navigaci vyvolal uživatel (klik v menu, změna hashe, zpráva
       z iframu). Při obnovení stránky (F5) je false: sbalení sekcí si uživatel
       nastavil sám a automatické rozbalení sekce s otevřenou aplikací by mu ho
       po každém načtení přepsalo. */
    function otevri(page, zUzivatele = true) {
      if (!page || page === aktualni) return;
      // hash může nést i parametry pro aplikaci: #obsah/x.html?k=… (sdílené odkazy) –
      // katalog se kontroluje podle samotného souboru, parametry jdou do iframu
      const soubor = page.split("?")[0];
      if (!podleSouboru.has(soubor) && soubor !== DOMOVSKA && soubor !== NASTAVENI) {
        // neznámý hash (i starý odkaz na aplikaci, která je dnes ve výukovém
        // webu) – nechodit mimo katalog, otevřít domovskou stránku
        page = DOMOVSKA;
      }
      aktualni = page;
      iframe.src = page;
      const zaklad = page.split('?')[0];
      zobrazStav(zaklad);
      uloz(sessionStorage, KEY_PAGE, zaklad);
      pridejNedavnou(zaklad, zUzivatele);
      updateActiveLink(zaklad);
      const misto = umisteni(page);
      zobrazDrobky(misto, zaklad);
      // stránku (kategorii) ukázat v menu – jen když ji otevřel uživatel
      if (zUzivatele) odhalVMenu(misto);
      if (window.matchMedia('(max-width: 1024px)').matches) closeMenu();
    }

    /* ---- Umístění ve struktuře webu ----
       Stránka z katalogu, nebo výpis kategorie / podkategorie na úvodní
       stránce (obsah/aplikace.html?skupina=hry, ?sekce=hlavolamy).
       Vrací { g: skupina, s: sekce, p: položka } – co chybí, je undefined. */
    function umisteni(page) {
      const [zaklad, dotaz = ''] = page.split('?');
      const p = podleSouboru.get(zaklad);
      let s = sekcePodleSouboru.get(zaklad);
      let g;
      if (zaklad === DOMOVSKA) {
        const par = new URLSearchParams(dotaz);
        s = sekcePodleKodu.get(par.get('sekce'));
        g = skupinaObj.get(par.get('skupina'));
      }
      if (s) g = skupinaObj.get(s.skupina);
      return { g, s, p };
    }

    const odkazSkupiny = g => DOMOVSKA + '?skupina=' + g.id;
    const odkazSekce = s => DOMOVSKA + '?sekce=' + kodSekce(s);

    // Hlavní stránka › kategorie › podkategorie › stránka; vše kromě poslední části je odkaz
    const drobkyEl = document.getElementById('drobky');
    function zobrazDrobky({ g, s, p }, zaklad) {
      const casti = [['🏠 Hlavní stránka', DOMOVSKA]];
      if (g) casti.push([g.label, odkazSkupiny(g)]);
      if (s) casti.push([s.nazev, odkazSekce(s)]);
      if (p) casti.push([p.nazev]);
      else if (zaklad === 'obsah/about.html') casti.push(['ℹ️ O projektu']);
      else if (zaklad === NASTAVENI) casti.push(['⚙️ Nastavení']);
      drobkyEl.replaceChildren();
      casti.forEach(([text, cil], i) => {
        if (i) {
          const odd = document.createElement('span');
          odd.className = 'oddelovac';
          odd.textContent = '›';
          odd.setAttribute('aria-hidden', 'true');
          drobkyEl.appendChild(odd);
        }
        const posledni = i === casti.length - 1;
        const el = document.createElement(posledni ? 'span' : 'a');
        if (posledni) {
          el.className = 'aktualni';
          el.setAttribute('aria-current', 'page');
        } else {
          el.href = '#' + cil;
        }
        el.textContent = text;
        drobkyEl.appendChild(el);
      });
    }

    // rozbalí v menu kategorii (a podkategorii) s otevřenou stránkou a posune se k ní
    function odhalVMenu({ g, s, p }) {
      if (!g) return;
      if (aktivniSkupina !== 'vse' && aktivniSkupina !== g.id) {
        aktivniSkupina = 'vse';   // filtr kategorie by stránku v menu schoval
        uloz(localStorage, KEY_SKUPINA, aktivniSkupina);
        updateSkupinaState();
      }
      const blok = vsechnySkupiny().find(b => b.dataset.skupina === g.id);
      const sekceEl = s && vsechnySekce().find(x => x.dataset.nazev === s.nazev);
      setCollapsed(blok, false);
      if (sekceEl) setCollapsed(sekceEl, false);
      saveCollapsed();
      aplikujFiltr();
      const cil = (p && sekceEl.querySelector(`a[data-page="${CSS.escape(p.soubor)}"]`))
        || (sekceEl && !sekceEl.classList.contains('jedina') && sekceEl.querySelector('h3'))
        || blok.querySelector('h2');
      if (p) { cil.scrollIntoView({ block: 'nearest' }); return; }
      // kategorie / podkategorie (drobečky, výpis): nadpis hned pod lepkavou lištu s filtry
      menuEl.scrollTop += cil.getBoundingClientRect().top - menuEl.getBoundingClientRect().top
        - menuEl.querySelector('.menu-top').offsetHeight;
    }

    // štítek vpravo nahoře: v jaké fázi je otevřená aplikace
    const stavAplikace = document.getElementById('stavAplikace');
    function zobrazStav(soubor) {
      const stav = stavPodleId.get(podleSouboru.get(soubor)?.stav);
      stavAplikace.hidden = !stav;
      if (!stav) return;
      stavAplikace.className = 'stav-stitek stav-' + stav.id;
      stavAplikace.textContent = stav.label;
      stavAplikace.title = stav.popis;
    }

    window.addEventListener('hashchange', () => {
      otevri(decodeURIComponent(location.hash.slice(1)) || DOMOVSKA);
    });

    // dashboard (v iframe) může požádat o otevření aplikace
    window.addEventListener('message', e => {
      if (e.data && typeof e.data.otevri === 'string') {
        location.hash = e.data.otevri;
        otevri(e.data.otevri);
      }
    });

    document.getElementById('btnDomu').addEventListener('click', () => {
      history.pushState(null, '', location.pathname);
      otevri(DOMOVSKA);
    });
    document.getElementById('btnInfo').addEventListener('click', () => {
      location.hash = 'obsah/about.html';      // hashchange stránku otevře
    });
    document.getElementById('btnNastaveni').addEventListener('click', () => {
      location.hash = NASTAVENI;               // hashchange stránku otevře
    });
    document.getElementById('btnNoveOkno').addEventListener('click', () => {
      window.open(aktualni || DOMOVSKA, '_blank');
    });

    /* ---- Volba jazyka ---- */
    // Jazyky bere z rejstříku (i18n/jazyky.js); testovací jazyk (stav 'test')
    // jen když je zrovna zvolený. Po volbě se znovu načte celý rozcestník
    // i s iframem – překlad se dělá jen při načtení stránky.
    if (window.I18N) {
      const jazykWrap = document.getElementById('jazykWrap');
      const btnJazyk = document.getElementById('btnJazyk');
      const jazykMenu = document.getElementById('jazykMenu');
      const otevriJazyky = ano => {
        jazykMenu.hidden = !ano;
        btnJazyk.setAttribute('aria-expanded', ano);
      };
      btnJazyk.textContent = I18N.jazyk.toUpperCase();
      for (const j of I18N.jazyky()) {
        if (j.stav === 'test' && j.kod !== I18N.jazyk) continue;
        const b = document.createElement('button');
        b.setAttribute('role', 'menuitemradio');
        b.setAttribute('aria-checked', j.kod === I18N.jazyk);
        b.textContent = j.nazev + (j.stav === 'stable' ? '' : ' 🚧');
        b.title = j.stav === 'stable' ? j.nazev : j.nazev + ' – překlad se připravuje / translation in progress';
        b.addEventListener('click', () => {
          otevriJazyky(false);
          if (j.kod === I18N.jazyk) return;
          uloz(localStorage, 'webapp_lang', j.kod);
          location.reload();
        });
        jazykMenu.appendChild(b);
      }
      btnJazyk.addEventListener('click', () => otevriJazyky(jazykMenu.hidden));
      document.addEventListener('click', e => { if (!jazykWrap.contains(e.target)) otevriJazyky(false); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') otevriJazyky(false); });
      jazykWrap.hidden = false;
    }

    /* ---- Přepínání tématu ---- */
    // theme.js už téma použil při načtení; tady se jen přepíná a rozesílá.
    const btnTema = document.getElementById('btnTema');
    const themeColor = document.querySelector('meta[name="theme-color"]');

    function zobrazTema() {
      const light = document.documentElement.dataset.theme === 'light';
      btnTema.textContent = light ? '☀️' : '🌙';
      btnTema.title = light ? 'Přepnout na tmavý režim' : 'Přepnout na světlý režim';
      if (themeColor) themeColor.content = light ? '#ffffff' : '#2d2d2d';
    }
    zobrazTema();

    btnTema.addEventListener('click', () => {
      const light = document.documentElement.dataset.theme !== 'light';
      if (light) document.documentElement.dataset.theme = 'light';
      else delete document.documentElement.dataset.theme;
      uloz(localStorage, KEY_TEMA, light ? 'light' : 'dark');
      // storage událost se ve stejné záložce nespouští -> iframu to řekneme přímo
      iframe.contentWindow?.postMessage({ tema: light ? 'light' : 'dark' }, '*');
      zobrazTema();
    });

    /* ---- Kategorie v rozbalovací nabídce ---- */
    const polozkySkupin = [];
    function skupinaPocet(id) {
      return KATALOG_SEKCE.reduce((n, s) =>
        n + ((id === 'vse' || s.skupina === id) ? s.polozky.length : 0), 0);
    }
    function updateSkupinaState() {
      polozkySkupin.forEach(p => {
        const je = p.dataset.skupina === aktivniSkupina;
        p.classList.toggle('active', je);
        p.setAttribute('aria-selected', String(je));
      });
      const aktivni = polozkySkupin.find(p => p.dataset.skupina === aktivniSkupina);
      if (aktivni) {
        skupinyToggleLabel.textContent = '';
        naplnSIkonou(skupinyToggleLabel, IKONY?.skupiny[aktivni.dataset.skupina], aktivni.dataset.label);
      }
    }
    function makeSkupina(id, label) {
      const b = document.createElement('button');
      b.className = 'skupina-polozka';
      b.dataset.skupina = id;
      b.dataset.label = label;
      b.setAttribute('role', 'option');
      b.innerHTML = `<span class="nazev"></span><span class="pill-pocet">${skupinaPocet(id)}</span>`;
      const img = ikona(IKONY?.skupiny[id]);
      if (img) b.prepend(img);
      b.querySelector('.nazev').textContent = img ? bezEmoji(label) : label;
      b.addEventListener('click', () => {
        aktivniSkupina = id;
        uloz(localStorage, KEY_SKUPINA, id);
        nastavDotaz('');
        // po přepnutí kategorie se sekce sbalí — cílem je přehled sekcí,
        // ne sloupec desítek položek, kterým se musí projet
        vsechnySekce().forEach(s => setCollapsed(s, true));
        vsechnySkupiny().forEach(b => { if (b.dataset.skupina === id) setCollapsed(b, false); });
        saveCollapsed();
        updateSkupinaState();
        aplikujFiltr();
        setSkupinyOpen(false);
      });
      skupinyEl.appendChild(b);
      polozkySkupin.push(b);
    }
    makeSkupina('vse', '📂 Vše');
    KATALOG_SKUPINY.forEach(g => {
      if (KATALOG_SEKCE.some(s => s.skupina === g.id)) makeSkupina(g.id, g.label);
    });
    if (!polozkySkupin.some(p => p.dataset.skupina === aktivniSkupina)) aktivniSkupina = 'vse';
    updateSkupinaState();

    /* ---- Filtr podle stavu (vývoj / beta / stable) ---- */
    const stavyFiltrEl = document.getElementById('stavyFiltr');
    function makeStavFiltr(id, label, popis) {
      const b = document.createElement('button');
      b.dataset.stav = id;
      const pocet = KATALOG_SEKCE.reduce((n, s) =>
        n + s.polozky.filter(p => id === 'vse' || p.stav === id).length, 0);
      b.title = `${preloz(popis)} (${pocet})`;
      if (id !== 'vse') {
        const t = document.createElement('span');
        t.className = 'tecka';
        b.appendChild(t);
      }
      b.appendChild(document.createTextNode(label));
      b.addEventListener('click', () => {
        aktivniStav = id;
        uloz(localStorage, KEY_STAV, id);
        updateStavState();
        aplikujFiltr();
      });
      stavyFiltrEl.appendChild(b);
    }
    function updateStavState() {
      stavyFiltrEl.querySelectorAll('button').forEach(b => {
        const je = b.dataset.stav === aktivniStav;
        b.classList.toggle('active', je);
        b.setAttribute('aria-pressed', String(je));
      });
    }
    makeStavFiltr('vse', 'Vše', 'Všechny stavy');
    KATALOG_STAVY.forEach(s => makeStavFiltr(s.id, s.label, s.popis));
    updateStavState();
    const vyhovujeStavu = li => aktivniStav === 'vse' || li.dataset.stav === aktivniStav;

    /* ---- Hledání (hlavička + menu) + filtr skupin ---- */
    const hledatMenu = document.getElementById('hledatMenu');
    const searchInputs = [hledatMenu];

    function nastavDotaz(val) {
      searchInputs.forEach(i => { i.value = val; });
    }
    function aktualniDotaz() {
      const i = searchInputs.find(x => x.value.trim());
      return i ? norm(i.value.trim()) : '';
    }

    function aplikujFiltr() {
      const q = aktualniDotaz();
      document.getElementById('zrusHledani').disabled = !q;
      zrusKbFokus();
      if (q) {
        let celkemShod = 0;
        vsechnySekce().forEach(s => {
          let shoda = 0;
          s.querySelectorAll('li').forEach(li => {
            const a = li.querySelector('a[data-page]');
            const match = a.dataset.hledani.includes(q) && vyhovujeStavu(li);
            li.classList.toggle('skryto', !match);
            a.classList.toggle('zvyrazneno', match);
            if (match) shoda++;
          });
          s.classList.toggle('skryto', shoda === 0);
          if (shoda > 0) s.classList.remove('collapsed');
          celkemShod += shoda;
        });
        aktualizujSkupiny(true);
        bezVysledku.classList.toggle('zobraz', celkemShod === 0);
        return;
      }
      bezVysledku.classList.remove('zobraz');
      let celkem = 0;
      vsechnySekce().forEach(s => {
        let videt = 0;
        s.querySelectorAll('li').forEach(li => {
          const ok = vyhovujeStavu(li);
          li.classList.toggle('skryto', !ok);
          if (ok) videt++;
        });
        const patri = (aktivniSkupina === 'vse' || s.dataset.skupina === aktivniSkupina) && videt > 0;
        s.classList.toggle('skryto', !patri);
        s.classList.toggle('collapsed',
          !s.classList.contains('jedina') && collapsedSet.has(s.dataset.nazev));
        s.querySelectorAll('a[data-page]').forEach(a => a.classList.remove('zvyrazneno'));
        const pocet = s.querySelector('h3 .pocet');
        if (pocet) pocet.textContent = videt;
        if (patri) celkem += videt;
      });
      aktualizujSkupiny(false);
      bezVysledku.classList.toggle('zobraz', celkem === 0);
    }

    // kategorie: schovat, když nemá viditelnou sekci; počet = viditelné stránky;
    // při hledání se kategorie se shodou rozbalí (bez zápisu do sbalených)
    function aktualizujSkupiny(hledani) {
      vsechnySkupiny().forEach(b => {
        const videt = b.querySelectorAll('.sekce:not(.skryto) li:not(.skryto)').length;
        b.classList.toggle('skryto', videt === 0);
        b.classList.toggle('collapsed', hledani ? videt === 0 : collapsedSet.has(b.dataset.nazev));
        b.querySelector('h2 .pocet').textContent = videt;
      });
    }

    const zrusHledani = document.getElementById('zrusHledani');
    searchInputs.forEach(input => {
      input.addEventListener('input', () => {
        nastavDotaz(input.value);
        aplikujFiltr();
      });
    });
    zrusHledani.addEventListener('click', () => {
      nastavDotaz('');
      aplikujFiltr();
      hledatMenu.focus();
    });

    /* ---- Klávesové ovládání ---- */
    let kbIndex = -1;
    function viditelneOdkazy() {
      return vsechnySekce()
        .filter(s => !s.classList.contains('skryto') && !s.classList.contains('collapsed')
          && !s.closest('.skupina-blok').classList.contains('collapsed'))
        .flatMap(s => [...s.querySelectorAll('li:not(.skryto) a[data-page]')]);
    }
    function zrusKbFokus() {
      kbIndex = -1;
      menuSekceEl.querySelectorAll('a.kb-focus').forEach(a => a.classList.remove('kb-focus'));
    }
    function posunKbFokus(smer) {
      const odkazy = viditelneOdkazy();
      if (!odkazy.length) return;
      kbIndex = (kbIndex + smer + odkazy.length) % odkazy.length;
      menuSekceEl.querySelectorAll('a.kb-focus').forEach(a => a.classList.remove('kb-focus'));
      const cil = odkazy[kbIndex];
      cil.classList.add('kb-focus');
      cil.scrollIntoView({ block: 'nearest' });
    }

    document.addEventListener('keydown', e => {
      const vInputu = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        (window.matchMedia('(max-width: 1024px)').matches ? openMenu : () => {})();
        hledatMenu.focus();
        hledatMenu.select();
        return;
      }
      if (e.key === '/' && !vInputu) {
        e.preventDefault();
        hledatMenu.focus();
        hledatMenu.select();
        return;
      }
      if (e.key === 'Escape') {
        if (aktualniDotaz()) { nastavDotaz(''); aplikujFiltr(); }
        setSkupinyOpen(false);
        closeMenu();
        return;
      }
      if (vInputu && searchInputs.includes(document.activeElement)) {
        if (e.key === 'ArrowDown') { e.preventDefault(); posunKbFokus(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); posunKbFokus(-1); }
        else if (e.key === 'Enter') {
          const foc = menuSekceEl.querySelector('a.kb-focus') || viditelneOdkazy()[0];
          if (foc) { location.hash = foc.dataset.page; nastavDotaz(''); aplikujFiltr(); }
        }
      }
    });

    /* ---- Hamburger: vysouvací menu na telefonu a tabletu ---- */
    const hamburger = document.getElementById('hamburger');
    const menuOverlay = document.getElementById('menuOverlay');

    function openMenu() {
      menuEl.classList.add('open');
      menuOverlay.classList.add('show');
      hamburger.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
      menuEl.classList.remove('open');
      menuOverlay.classList.remove('show');
      hamburger.setAttribute('aria-expanded', 'false');
    }
    hamburger.addEventListener('click', () =>
      menuEl.classList.contains('open') ? closeMenu() : openMenu());
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('resize', () => {
      if (!window.matchMedia('(max-width: 1024px)').matches) closeMenu();
    });

    /* ---- Start ---- */
    renderMenu();
    const zHashe = decodeURIComponent(location.hash.slice(1));
    // false = obnovení stránky, ne akce uživatele -> sbalení sekcí zůstane, jak si ho nastavil
    otevri(zHashe || precti(sessionStorage, KEY_PAGE) || DOMOVSKA, false);

    /* ---- PWA ---- */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
