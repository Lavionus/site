<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📔 Fotokniha – návrhář</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<script src="../dialog.js" defer></script>
<script src="lib/pdflib/pdf-lib.min.js" defer></script>
<script src="lib/pdflib/fontkit.umd.min.js" defer></script>
<script src="pdf_dilna/jadro.js" defer></script>
<script src="fotokniha/jadro.js" defer></script>
<script src="fotokniha/uloziste.js" defer></script>
<script src="fotokniha/editor.js" defer></script>
<style>
body{background:var(--bg-deep);margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none !important}
/* horní lišta – vzor prompty.html */
.lista{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.lista::-webkit-scrollbar{display:none}
.lista > *{flex-shrink:0}
.lista h1{font-size:1.02rem;font-weight:600;white-space:nowrap;margin:0}
.lista .skup{display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:1px 4px 3px;border-radius:9px;background:color-mix(in srgb,var(--bg-control) 45%,transparent);border:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.lista .skup-projekt{flex-direction:row;align-items:baseline;gap:8px;background:none;border-color:transparent;padding-left:0;margin-right:4px}
.lista .skup-nazev{font-size:9.5px;line-height:1.25;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);text-align:center;user-select:none}
.lista .skup-tl{display:flex;align-items:center;gap:2px}
.lista .vpravo{margin-left:auto;display:flex;gap:4px}
.samostatne .lista{padding-right:72px}
.pocet{color:var(--text-faint);font-size:.78rem;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tl{background:var(--bg-control);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:.84rem;white-space:nowrap;font-family:inherit;line-height:1.3}
.tl:hover:not(:disabled){background:var(--bg-hover);border-color:var(--border-strong)}
.tl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tl.hlavni-tl{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent);font-weight:600}
.tl.hlavni-tl:hover{background:var(--accent-hover)}
.tl:disabled{opacity:.45;cursor:default}
.strana-info{font-size:.8rem;color:var(--text-muted);min-width:74px;text-align:center}
@media (max-width:1150px){.lista .txt{display:none}}
@media (max-width:1560px){.lista .txt2{display:none}}
.nabidka{position:fixed;z-index:60;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:260px;max-height:calc(100vh - 70px);overflow-y:auto}
.nabidka .tl{display:flex;align-items:center;gap:6px;text-align:left;background:none;border-color:transparent;padding:6px 10px}
.nabidka .tl:hover:not(:disabled){background:var(--bg-hover)}
.nabidka kbd,.napoveda kbd{margin-left:auto;font-size:.7rem;color:var(--text-faint);font-family:inherit;border:1px solid var(--border);border-radius:4px;padding:0 5px}
.nabidka hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.nabidka .titulek{font-size:.72rem;color:var(--text-faint);padding:4px 10px;text-transform:uppercase;letter-spacing:.04em}
.nabidka .tl.prep::before{content:'';display:inline-block;width:1em;color:var(--accent);font-weight:700}
.nabidka .tl.prep[aria-pressed="true"]{background:none;border-color:transparent}
.nabidka .tl.prep[aria-pressed="true"]::before{content:'✓'}

/* rozložení: šuplík | plocha | panel, dole pás dvoustran */
.rozlozeni{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr) 260px}
aside{background:var(--bg-panel);overflow:auto;min-height:0;padding:10px}
#suplik{border-right:1px solid var(--border)}
#panel{border-left:1px solid var(--border)}
aside h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:12px 0 6px;font-weight:600}
aside h3:first-child{margin-top:0}
.sup-hlava{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--text-muted);margin-bottom:8px}
.sup-hlava label{display:flex;gap:4px;align-items:center;cursor:pointer}
#fotky{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.fot{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--bg-control);border:2px solid transparent;cursor:grab}
.fot img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.fot.vybrana{border-color:var(--accent)}
.fot .pouzito{position:absolute;left:3px;top:3px;background:var(--accent);color:var(--on-accent,#fff);font-size:.68rem;border-radius:8px;padding:0 5px;font-weight:600}
.fot .nizke{position:absolute;right:3px;bottom:3px;font-size:.7rem}
.fot .smaz{position:absolute;right:2px;top:2px;border:0;border-radius:50%;width:20px;height:20px;line-height:18px;padding:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;opacity:0;font-size:.75rem}
.fot:hover .smaz,.fot:focus-within .smaz{opacity:1}
.prazdny-suplik{font-size:.82rem;color:var(--text-muted);border:2px dashed var(--border);border-radius:8px;padding:16px 10px;text-align:center;line-height:1.5}
.suplik-drop{outline:3px dashed var(--accent);outline-offset:-6px}

main#plocha{position:relative;overflow:auto;display:flex;min-width:0;min-height:0;background:var(--bg-deep);padding:18px;box-sizing:border-box}
#platno{position:relative;touch-action:none;user-select:none;margin:auto}

/* dvoustrana */
.dv{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.35);overflow:hidden}
.dv .ram{position:absolute;overflow:hidden;box-sizing:border-box}
.dv .ram img{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.dv .ram.prazdny{background:repeating-linear-gradient(45deg,rgba(128,128,128,.18) 0 8px,rgba(128,128,128,.28) 8px 16px);border:1px dashed rgba(90,90,90,.8);display:flex;align-items:center;justify-content:center;color:rgba(60,60,60,.9);font-size:12px;text-align:center}
.dv .deska{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,rgba(120,120,120,.55) 0 6px,rgba(160,160,160,.55) 6px 12px);display:flex;align-items:center;justify-content:center;color:#222;font-size:12px;pointer-events:none;text-align:center}
.dv .spad{position:absolute;background:rgba(120,120,120,.45);pointer-events:none}
.dv .vod{position:absolute;pointer-events:none;box-sizing:border-box}
.dv .vod.orez{border:1px solid rgba(220,40,40,.9)}
.dv .vod.bezp{border:1px dashed rgba(30,140,230,.85)}
.dv .vod.hrbet{border-left:1px dashed rgba(220,40,40,.8);width:0}
.dv .vod.hrbet-pas{background:rgba(220,40,40,.08)}
.dv .stitek{position:absolute;bottom:2px;font-size:10px;white-space:nowrap;color:rgba(80,80,80,.9);pointer-events:none}
.dv .dpi{position:absolute;right:3px;top:3px;font-size:11px;border-radius:4px;padding:0 4px;font-weight:600;pointer-events:none}
.dv .dpi.chyba{background:#c62828;color:#fff}
.dv .dpi.varovani{background:#f9a825;color:#000}
.dv .duch{position:absolute;opacity:.35;pointer-events:none;max-width:none}
.edit .ram{cursor:move}
.edit .ram.vybrany{outline:2px solid var(--accent);outline-offset:0;overflow:visible}
.edit .ram.vybrany .orezka{position:absolute;inset:0;overflow:hidden}
.edit .ram.vyrez{cursor:grab;outline-style:dashed}
.edit .ram.cil{outline:3px solid var(--accent);outline-offset:-3px}
.uchop{position:absolute;width:12px;height:12px;background:var(--accent);border:2px solid var(--bg-panel);border-radius:3px;z-index:3;box-sizing:border-box}
.uchop[data-u="nw"]{left:-7px;top:-7px;cursor:nwse-resize}.uchop[data-u="ne"]{right:-7px;top:-7px;cursor:nesw-resize}
.uchop[data-u="sw"]{left:-7px;bottom:-7px;cursor:nesw-resize}.uchop[data-u="se"]{right:-7px;bottom:-7px;cursor:nwse-resize}
.uchop[data-u="n"]{left:calc(50% - 6px);top:-7px;cursor:ns-resize}.uchop[data-u="s"]{left:calc(50% - 6px);bottom:-7px;cursor:ns-resize}
.uchop[data-u="w"]{top:calc(50% - 6px);left:-7px;cursor:ew-resize}.uchop[data-u="e"]{top:calc(50% - 6px);right:-7px;cursor:ew-resize}
.vodicko{position:absolute;background:#e91e63;pointer-events:none;z-index:4}

/* panel vlastností */
.pole{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;font-size:.82rem}
.pole label{color:var(--text-muted)}
.vstup{background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:.84rem;font-family:inherit;min-width:0}
.vstup:focus{outline:2px solid var(--accent);outline-offset:1px}
.mm4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mm4 label{display:flex;flex-direction:column;font-size:.74rem;color:var(--text-muted);gap:2px}
.mm4 input{width:100%;box-sizing:border-box}
#panel .pole input[type=range]{width:100%}
.tlacitka{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tlacitka .tl{font-size:.8rem}
.dpi-info{font-size:.82rem;padding:6px 8px;border-radius:6px;margin:6px 0;border:1px solid var(--border)}
.dpi-info.ok{border-color:var(--ok)}.dpi-info.varovani{border-color:var(--warn)}.dpi-info.chyba{border-color:var(--danger)}
.predlohy{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.predlohy.dvou{grid-template-columns:repeat(3,1fr)}
.predlohy button{background:var(--bg-control);border:1px solid var(--border);border-radius:5px;padding:4px;cursor:pointer;line-height:0}
.predlohy button:hover:not(:disabled){border-color:var(--accent);background:var(--bg-hover)}
.predlohy button:disabled{opacity:.35;cursor:default}
.predlohy svg{width:100%;height:auto}
.predlohy svg .pl{fill:var(--bg-input);stroke:var(--border-strong)}
.predlohy svg .r{fill:var(--accent);opacity:.75}
.pozn{font-size:.76rem;color:var(--text-faint);line-height:1.45}

/* pás dvoustran */
#pas{display:flex;gap:10px;overflow-x:auto;padding:8px 10px;background:var(--bg-panel);border-top:1px solid var(--border);flex-shrink:0;align-items:flex-end}
.mini{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;background:none;border:2px solid transparent;border-radius:6px;padding:3px;font-family:inherit;color:var(--text-muted);font-size:.72rem}
.mini.aktivni{border-color:var(--accent);color:var(--text)}
.mini .dv{box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* modální okna */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px}
.modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;width:100%;max-width:620px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.modal h2{font-size:1.1rem;margin:0}
.modal .pole{font-size:.88rem}
.modal .dole{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal p,.modal li{font-size:.88rem;line-height:1.55;margin:0}
.modal ul,.modal ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.knihy{display:flex;flex-direction:column;gap:6px}
.kniha-r{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.kniha-r.aktivni{border-color:var(--accent)}
.kniha-r .n{flex:1;min-width:0}
.kniha-r .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kniha-r .n small{color:var(--text-faint)}
.kontrola li{cursor:pointer;list-style:none;padding:4px 6px;border-radius:5px}
.kontrola li:hover{background:var(--bg-hover)}
.kontrola{padding-left:0 !important}
.prubeh{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:120;display:flex;align-items:center;justify-content:center}
.prubeh div{background:var(--bg-panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:18px 26px;font-size:.95rem}
.napoveda table{border-collapse:collapse;font-size:.85rem}
.napoveda td{padding:3px 8px;border-bottom:1px solid var(--border)}
.drop-plocha{outline:3px dashed var(--accent);outline-offset:-10px}

.dv .txt{position:absolute;box-sizing:border-box}
.dv .txt svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.dv .txt text{font-kerning:none;white-space:pre}
.edit .txt{cursor:move;outline:1px dashed rgba(128,128,128,.55)}
.edit .txt.pretece{outline:2px dashed #c62828}
.edit .txt.vybrany{outline:2px solid var(--accent)}
.dv .cislo-str{pointer-events:none}
.dv .lem{position:absolute;inset:0;pointer-events:none;box-sizing:border-box}
.dv .vod.ohyb{border-left:1px dashed rgba(220,40,40,.9);width:0}
.dv .vod.hrbet-zona{background:rgba(220,40,40,.08)}
.edit .ram.zdroj-prohozeni{outline:3px dashed #f9a825}
.edit.prohazovani .ram:not(.txt){cursor:copy}
.mini.ob .dv{box-shadow:0 1px 4px rgba(0,0,0,.5)}
.mini-sep{width:1px;align-self:stretch;background:var(--border);flex-shrink:0}
textarea.vstup{width:100%;box-sizing:border-box;min-height:70px;resize:vertical}
.seg{display:flex;gap:2px}
.seg .tl{flex:1;padding:3px 4px}
.pole select.vstup,.pole input.vstup{width:100%;box-sizing:border-box}
.varovani-txt{color:var(--danger);font-size:.8rem;margin:4px 0}
/* náhled knihy */
.nahled-bg{position:fixed;inset:0;z-index:115;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#ddd}
.nahled-bg .kniha{position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.8)}
.nahled-bg .kniha .dv{position:absolute;box-shadow:none}
.nahled-bg .kniha .hrbet-stin{position:absolute;top:0;bottom:0;width:40px;margin-left:-20px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.22) 50%,rgba(0,0,0,0));pointer-events:none}
.nahled-bg .ovl{display:flex;gap:10px;align-items:center;font-size:.9rem}
.nahled-bg .tl{background:#333;color:#eee;border-color:#555}
/* paleta příkazů */
.paleta{max-width:560px;padding:0;gap:0;overflow:hidden}
.paleta input{border:0;border-bottom:1px solid var(--border);border-radius:0;padding:12px 14px;font-size:1rem}
.paleta ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto;display:block}
.paleta li{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;font-size:.88rem}
.paleta li.akt,.paleta li:hover{background:var(--bg-hover)}
.paleta kbd{margin-left:auto;font-size:.7rem;color:var(--text-faint);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-family:inherit}

@media (max-width:820px){
  body{height:auto;min-height:100vh;overflow:auto}
  .rozlozeni{display:flex;flex-direction:column}
  #suplik{border-right:0;border-bottom:1px solid var(--border);max-height:150px}
  #fotky{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:72px;overflow-x:auto}
  main#plocha{height:clamp(200px,72vw,62vh);flex-shrink:0;padding:8px}
  #panel{border-left:0;border-top:1px solid var(--border)}
}
</style>
</head>
<body>
<header class="lista" id="lista">
  <div class="skup skup-projekt">
    <h1>📔 Fotokniha</h1>
    <span class="pocet" id="nazevKnihy" data-i18n="ne"></span>
  </div>
  <div class="skup" role="group" aria-label="Kniha"><span class="skup-nazev" aria-hidden="true">Kniha</span><div class="skup-tl">
    <button class="tl" data-nabidka="nabKniha" title="Nová kniha, moje knihy, formát, obálka, čísla stran, záloha">📔<span class="txt"> Kniha</span> ▾</button>
    <button class="tl hlavni-tl" data-prikaz="pridatFotky" title="Přidat fotky z počítače nebo telefonu">📷<span class="txt"> Přidat fotky</span></button>
  </div></div>
  <div class="skup" role="group" aria-label="Upravit"><span class="skup-nazev" aria-hidden="true">Upravit</span><div class="skup-tl">
    <button class="tl" data-prikaz="zpet" id="btnZpet" title="Zpět (Ctrl+Z)" aria-label="Zpět">↶</button>
    <button class="tl" data-prikaz="znovu" id="btnZnovu" title="Znovu (Ctrl+Y)" aria-label="Znovu">↷</button>
    <button class="tl" data-prikaz="novyRamecek" title="Přidat prázdný rámeček na fotku (R)">▭<span class="txt txt2"> Rámeček</span></button>
    <button class="tl" data-prikaz="novyText" title="Přidat textové pole (T)">𝐓<span class="txt txt2"> Text</span></button>
    <button class="tl" data-nabidka="nabUpravit" title="Kopírovat, vložit, automatické rozvržení">🛠<span class="txt txt2"> Úpravy</span> ▾</button>
  </div></div>
  <div class="skup" role="group" aria-label="Dvoustrana"><span class="skup-nazev" aria-hidden="true">Dvoustrana</span><div class="skup-tl">
    <button class="tl" data-prikaz="predchozi" title="Předchozí dvoustrana (PageUp)" aria-label="Předchozí dvoustrana">◀</button>
    <span class="strana-info" id="stranaInfo"></span>
    <button class="tl" data-prikaz="dalsi" title="Další dvoustrana (PageDown)" aria-label="Další dvoustrana">▶</button>
    <button class="tl" data-nabidka="nabDvoustrana" title="Vložit, přesunout, duplikovat, smazat dvoustranu">📄<span class="txt txt2"> Dvoustrana</span> ▾</button>
  </div></div>
  <div class="skup" role="group" aria-label="Zobrazit"><span class="skup-nazev" aria-hidden="true">Zobrazit</span><div class="skup-tl">
    <button class="tl" data-prikaz="oddalit" title="Oddálit (Ctrl+−)" aria-label="Oddálit">−</button>
    <button class="tl" data-prikaz="cela" id="btnZoom" title="Celá plocha (Ctrl+0)">100 %</button>
    <button class="tl" data-prikaz="priblizit" title="Přiblížit (Ctrl++)" aria-label="Přiblížit">+</button>
    <button class="tl" data-nabidka="nabZobrazit" title="Vodítka, spadávka, přichytávání, náhled knihy">👁<span class="txt txt2"> Zobrazit</span> ▾</button>
  </div></div>
  <div class="skup" role="group" aria-label="Tisk"><span class="skup-nazev" aria-hidden="true">Tisk</span><div class="skup-tl">
    <button class="tl" data-prikaz="kontrola" title="Kontrola před tiskem">✔<span class="txt"> Kontrola</span></button>
    <button class="tl" data-nabidka="nabTisk" title="Export PDF a JPEG pro tiskárnu">🖨<span class="txt"> Export</span> ▾</button>
  </div></div>
  <span class="vpravo">
    <button class="tl" data-prikaz="paleta" title="Paleta příkazů (Ctrl+K)" aria-label="Paleta příkazů">⌘</button>
    <button class="tl" data-prikaz="napoveda" title="Nápověda a klávesové zkratky (F1)" aria-label="Nápověda">❓</button>
  </span>
</header>

<div id="nabKniha" class="nabidka" hidden>
  <button class="tl" data-prikaz="novaKniha">✚ Nová kniha…</button>
  <button class="tl" data-prikaz="mojeKnihy">📚 Moje knihy…</button>
  <hr>
  <button class="tl" data-prikaz="vlastnosti">⚙ Formát, počet stran, vazba…</button>
  <button class="tl" data-prikaz="obalka">📕 Obálka a hřbet…</button>
  <button class="tl" data-prikaz="cislaStran">#️⃣ Čísla stran…</button>
  <button class="tl" data-prikaz="prejmenovat">✎ Přejmenovat knihu</button>
  <hr>
  <button class="tl" data-prikaz="zaloha">💾 Zálohovat projekt (ZIP)</button>
  <button class="tl" data-prikaz="obnova">📂 Obnovit ze zálohy…</button>
</div>
<div id="nabUpravit" class="nabidka" hidden>
  <button class="tl" data-prikaz="automatika">🪄 Rozvrhnout fotky automaticky…</button>
  <hr>
  <button class="tl" data-prikaz="kopirovat">⎘ Kopírovat prvek <kbd>Ctrl+C</kbd></button>
  <button class="tl" data-prikaz="vlozit">📋 Vložit prvek <kbd>Ctrl+V</kbd></button>
  <button class="tl" data-prikaz="prohodit">⇄ Prohodit fotku s jiným rámečkem</button>
  <button class="tl" data-prikaz="smazatPrvek">🗑 Smazat vybraný prvek <kbd>Delete</kbd></button>
</div>
<div id="nabDvoustrana" class="nabidka" hidden>
  <button class="tl" data-prikaz="obalkaJdi">📕 Upravit obálku</button>
  <hr>
  <button class="tl" data-prikaz="vlozitDvoustranu">➕ Vložit prázdnou dvoustranu za tuto (+2 strany)</button>
  <button class="tl" data-prikaz="duplikovatDvoustranu">⎘ Duplikovat dvoustranu (+2 strany)</button>
  <button class="tl" data-prikaz="posunDriv">⇤ Posunout dvoustranu dříve</button>
  <button class="tl" data-prikaz="posunPozdeji">⇥ Posunout dvoustranu později</button>
  <hr>
  <button class="tl" data-prikaz="vyprazdnit">⌫ Vyprázdnit dvoustranu</button>
  <button class="tl" data-prikaz="smazatDvoustranu">🗑 Smazat dvoustranu (−2 strany)</button>
</div>
<div id="nabZobrazit" class="nabidka" hidden>
  <button class="tl" data-prikaz="nahled">📖 Náhled knihy <kbd>P</kbd></button>
  <hr>
  <button class="tl prep" data-prikaz="prep" data-nast="voditka" aria-pressed="true">Vodítka (ořez, bezpečná zóna, hřbet)</button>
  <button class="tl prep" data-prikaz="prep" data-nast="spad" aria-pressed="true">Zašednout spadávku (odřízne se)</button>
  <button class="tl prep" data-prikaz="prep" data-nast="prichyt" aria-pressed="true">Přichytávat k vodítkům <kbd>Alt</kbd></button>
  <button class="tl prep" data-prikaz="prep" data-nast="dpi" aria-pressed="true">Varování DPI v rámečcích</button>
</div>
<div id="nabTisk" class="nabidka" hidden>
  <div class="titulek">PDF pro tiskárnu</div>
  <button class="tl" data-prikaz="pdfStrany">📄 PDF – každá strana zvlášť</button>
  <button class="tl" data-prikaz="pdfDvoustrany">📖 PDF – po dvoustranách</button>
  <button class="tl" data-prikaz="pdfObalka">📕 PDF – obálka (desky + hřbet)</button>
  <button class="tl prep" data-prikaz="prep" data-nast="znacky" aria-pressed="false">Ořezové značky v PDF</button>
  <hr>
  <div class="titulek">Pro fotolab</div>
  <button class="tl" data-prikaz="jpegZip">🖼 JPEG 300 DPI po dvoustranách (ZIP)</button>
  <hr>
  <button class="tl" data-prikaz="jakTisknout">❔ Jak knihu nechat vytisknout</button>
</div>

<div class="rozlozeni">
  <aside id="suplik" aria-label="Fotky">
    <div class="sup-hlava">
      <span id="pocetFotek"></span>
      <label><input type="checkbox" id="jenNepouzite"> jen nepoužité</label>
      <select id="razeni" class="vstup" aria-label="Pořadí fotek" title="Pořadí fotek v šuplíku">
        <option value="import">Pořadí přidání</option>
        <option value="datum">Datum pořízení</option>
        <option value="nazev">Název souboru</option>
      </select>
    </div>
    <div id="fotky"></div>
    <input type="file" id="soubor" accept="image/*" multiple hidden>
    <input type="file" id="zalohaSoubor" accept=".zip,application/zip" hidden>
  </aside>
  <main id="plocha"><div id="platno" class="edit"></div></main>
  <aside id="panel" aria-label="Vlastnosti"></aside>
</div>
<footer id="pas" aria-label="Dvoustrany"></footer>
</body>
</html>
