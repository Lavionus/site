<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt</title>
  <link rel="stylesheet" href="../common.css">
  <script src="../theme.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
      color: var(--accent);
    }

    .contact-info {
      background-color: var(--bg-elevated);
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .contact-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .contact-icon {
      font-size: 1.5rem;
      margin-right: 15px;
      min-width: 30px;
    }

    .contact-details h3 {
      font-size: 0.9rem;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .contact-details p {
      font-size: 1.1rem;
      color: var(--text);
    }

    .contact-details a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact-details a:hover {
      color: #8bb8ff;
      text-decoration: underline;
    }

    .message-box {
      background-color: var(--bg-elevated);
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      border-left: 3px solid var(--accent);
    }

    .message-box p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kontakt</h1>
    
    <div class="contact-info">
      <div class="contact-item">
        <div class="contact-icon">📧</div>
        <div class="contact-details">
          <h3>Email</h3>
          <p><a href="mailto:hdm@seznam.cz">hdm@seznam.cz</a></p>
        </div>
      </div>
    </div>

    <div class="message-box">
      <p>💡 Máte dotaz nebo nápad na vylepšení? Neváhejte mě kontaktovat!</p>
    </div>
  </div>
</body>
</html>
