/* náhled na obrazovce: dvoustrany jako v otevřené knize */
@media screen{
  html{background:#5d5d5b}
  body{margin:0}
  .pagedjs_pages{display:flex;flex-wrap:wrap;justify-content:flex-start;width:calc(var(--pagedjs-width) * 2 + 2px);margin:24px auto}
  /* zvětšení až po sazbě – zoom během sazby rozhodí měření Paged.js (místo 330 stran 183) */
  body.hotovo .pagedjs_pages{zoom:var(--meritko,1)}
  .pagedjs_page{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.45);margin-bottom:22px}
  .pagedjs_first_page{margin-left:var(--pagedjs-width)}
  body.jednotlive .pagedjs_pages{width:auto;justify-content:center;gap:0 22px}
  body.jednotlive .pagedjs_first_page{margin-left:0}
  .pagedjs_left_page{box-shadow:-2px 2px 14px rgba(0,0,0,.45),inset -10px 0 14px -10px rgba(0,0,0,.18)}
  .pagedjs_right_page{box-shadow:2px 2px 14px rgba(0,0,0,.45),inset 10px 0 14px -10px rgba(0,0,0,.18)}
  body.voditka .pagedjs_area{outline:1px dashed rgba(220,40,40,.55)}
  body.voditka .pagedjs_margin-top,body.voditka .pagedjs_margin-bottom{outline:1px dotted rgba(40,90,220,.45)}
  #zdroj{display:none}
  .hlaska{font:15px system-ui,sans-serif;color:#eee;text-align:center;margin:30vh auto;max-width:30em}
}
@media print{ .hlaska{display:none} }

</head>
<body>
<div class="hlaska" id="hlaska">Sázím knihu…</div>
<script>
(async function () {
  const S = window.SAZBA_JADRO;
  const pan = window.parent !== window ? window.parent : window.opener;
  const hlas = zprava => { if (pan) try { pan.postMessage(Object.assign({ sazba: true }, zprava), location.origin); } catch (e) {} };
  const chyba = t => { document.getElementById('hlaska').textContent = t; hlas({ stav: 'chyba', text: t }); };

  try {
    let data = null;
    try { data = pan && pan.SAZBA_DATA && pan.SAZBA_DATA(); } catch (e) {}
    if (!data || !data.kniha) throw new Error('Tuto stránku otevírá stránka Sazba knihy (sazba.html).');
    const kniha = data.kniha, nast = S.doplnNastaveni(data.nast);
    if (nast.nahled === 'jednotlive') document.body.classList.add('jednotlive');
    if (nast.voditka) document.body.classList.add('voditka');
    if (!(kniha.kapitoly || []).length) throw new Error('Kniha nemá žádný text.');
    document.documentElement.lang = S.JAZYKY[kniha.jazyk] ? kniha.jazyk : 'cs';   // dělení slov podle jazyka knihy

    const html = S.htmlKnihy(kniha, nast, { datum: new Date() });
    const css = S.cssKnihy(nast, kniha);

    // písma a ilustrace musí být načtené dřív, než Paged.js začne měřit
    const rodina = S.PISMA[nast.pismo].rodina;
    await Promise.all(['400 12pt', 'italic 400 12pt', '600 12pt'].map(f => document.fonts.load(`${f} ${rodina}`, 'Aáčř„“')).concat(document.fonts.ready)).catch(() => {});
    const zdroj = document.createElement('div');
    zdroj.id = 'zdroj';
    zdroj.innerHTML = html;
    document.body.appendChild(zdroj);
    await Promise.all([...zdroj.querySelectorAll('img')].map(async img => {
      try { await img.decode(); img.setAttribute('width', img.naturalWidth); img.setAttribute('height', img.naturalHeight); }
      catch (e) { img.closest('figure') ? img.closest('figure').remove() : img.remove(); }
    }));
    zdroj.remove();
    const obsah = document.createDocumentFragment();
    [...zdroj.childNodes].forEach(n => obsah.appendChild(n));

    const P = window.PagedModule;
    let stran = 0;
    class Hlidac extends P.Handler {
      afterPageLayout(el) {
        stran++;
        // úvodní listy a otevření kapitol bez živého záhlaví (a bez čísla, je-li nahoře)
        if (el.querySelector('.uvodni')) el.classList.add('bez-zahlavi', 'bez-cisla');
        else if (el.querySelector('h1.kap')) el.classList.add('bez-zahlavi', 'otevreni');
        if (stran % 10 === 0) hlas({ stav: 'strana', stran });
      }
    }
    P.registerHandlers(Hlidac);
    document.getElementById('hlaska').remove();
    const t0 = performance.now();
    const tok = await new P.Previewer().preview(obsah, [{ [location.href.split('#')[0].split('?')[0] + '#sazba']: css }], document.body);
    // prázdné strany (vložené kvůli začátku kapitoly na liché) – bez záhlaví i čísla
    document.querySelectorAll('.pagedjs_blank_page').forEach(p => p.classList.add('bez-zahlavi', 'bez-cisla'));
    // číslování od první kapitoly: Paged.js dá „counter-reset: page 1“ jen jedné straně a Chromium ho
    // na další strany nepřenese (za stranou 1 následovala 7) → každé straně číslo napevno
    // (target-counter v obsahu už počítá od první kapitoly)
    const strany = [...document.querySelectorAll('.pagedjs_page')];
    const prvni = strany.findIndex(p => p.querySelector('.kapitola.prvni'));
    strany.forEach((p, i) => { p.style.counterIncrement = 'none'; p.style.counterSet = 'page ' + (prvni > 0 ? i - prvni + 1 : i + 1); });
    document.body.classList.add('hotovo');
    window.__sazba = { stran: tok.total, ms: Math.round(performance.now() - t0) };
    document.title = kniha.nazev || 'Sazba knihy';
    hlas({ stav: 'hotovo', stran: tok.total, ms: window.__sazba.ms });
  } catch (e) {
    console.error(e);
    window.__sazba = { chyba: String(e && e.message || e) };
    chyba('Sazba se nepodařila: ' + (e && e.message || e));
  }
})();
</script>
</body>
</html>
