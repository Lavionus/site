<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Krumpáč – trpasličí plošinovka</title>
<script src="../podpis.js" defer></script>
<script src="../rekord.js"></script>
<style>
  :root { --bg: #07070c; --fg: #d8d2c4; --tlumena: #8d8778; --tlac: #1e1c22; --tlac-okraj: #4a4450; --akcent: #e0a040; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body { font-family: 'Courier New', monospace; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #obal { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; }
  #cv { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; touch-action: none; border: 1px solid #222; }
  #info { font-size: 12px; line-height: 1.5; text-align: center; color: var(--tlumena); max-width: 900px; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; align-items: center; }
  #info b { color: var(--fg); font-weight: normal; }
  #info button { background: var(--tlac); color: var(--fg); border: 1px solid var(--tlac-okraj); border-radius: 4px; font: 13px 'Courier New', monospace; padding: 2px 8px; cursor: pointer; }
  #dotyk { display: none; position: fixed; left: 0; right: 0; bottom: 30px; padding: 0 14px; justify-content: space-between; pointer-events: none; }
  body.dotykove #dotyk { display: flex; }
  body.dotykove .klavesnice { display: none; }
  #dotyk .skupina { display: flex; gap: 14px; pointer-events: auto; }
  #dotyk button { width: 68px; height: 68px; border-radius: 50%; background: rgba(40, 36, 46, .72); border: 2px solid rgba(160, 150, 170, .5); color: #eee; font: bold 26px sans-serif; touch-action: none; }
  #dotyk button.drzi { background: rgba(224, 160, 64, .6); }
  #dotyk #tSkok { width: 78px; height: 78px; }
  #dotyk .sloupec { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  #dotyk button.male { width: 52px; height: 52px; font-size: 20px; }
</style>
</head>
<body>
<div id="obal">
  <canvas id="cv" width="480" height="270" aria-label="Herní plocha Krumpáče"></canvas>
  <div id="info">
    <span class="klavesnice"><b>←→</b> chůze · <b>mezera</b> skok · <b>↑↓</b> žebřík · <b>X</b> krumpáč · <b>C</b> hod · <b>P</b> pauza</span>
    <span id="rekordBox"></span>
    <button id="zvukBtn" type="button" title="Zvuky (M)">🔊</button>
    <button id="hudbaBtn" type="button" title="Hudba (N)">🎵</button>
  </div>
</div>
<div id="dotyk" aria-hidden="true">
  <div class="skupina"><button id="tVlevo">◀</button><div class="sloupec"><button id="tNahoru" class="male">▲</button><button id="tDolu" class="male">▼</button></div><button id="tVpravo">▶</button></div>
  <div class="skupina"><div class="sloupec"><button id="tHod" class="male">🪓</button><button id="tUtok" class="male">⛏</button></div><button id="tSkok">⤒</button></div>
</div>
<script src="krumpac/hra.js"></script>
<script src="krumpac/nepratele.js"></script>
<script src="krumpac/bossove.js"></script>
<script src="krumpac/urovne.js"></script>
<script src="krumpac/zvuk.js"></script>
<script src="krumpac/hudba.js"></script>
<script src="krumpac/ui.js"></script>
<script>KRUMPAC.ui.start();</script>
</body>
</html>
