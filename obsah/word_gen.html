<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔤 Generátor slov</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<script src="../dialog.js" defer></script>
<style>
body{min-height:100vh;padding:10px;line-height:1.35}
.container{max-width:1400px;margin:0 auto}
.zahlavi{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin:0 2px 8px}
.zalozky{display:flex;gap:4px;margin-left:auto}
.zalozka{background:var(--bg-control);border:1px solid var(--border);color:var(--text-muted);padding:4px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:.85rem;white-space:nowrap;transition:border-color .15s,color .15s}
.zalozka:hover{border-color:var(--accent);color:var(--text)}
.zalozka[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
h1{font-size:1.2rem;font-weight:600}
.sub{color:var(--text-faint);font-size:.78rem}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.hlava{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:7px}
h2{font-size:.9rem;color:var(--accent);font-weight:600;white-space:nowrap}
h2 .pocet{color:var(--text-faint);font-weight:400;font-size:.78rem;margin-left:3px}

/* nastavení */
.nastaveni{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.pole{display:flex;flex-direction:column;gap:2px;font-size:.7rem;color:var(--text-muted)}
.pole input,.pole select{background:var(--bg-input);border:1px solid var(--border-strong);border-radius:5px;color:var(--text);padding:5px 7px;font:inherit;font-size:.88rem;height:31px}
.pole input[type=number]{width:54px}
.pole input[type=text]{width:76px}
.volba{display:flex;align-items:center;gap:5px;height:31px;font-size:.8rem;color:var(--text-muted);cursor:pointer;user-select:none;white-space:nowrap}
.volba input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* tlačítka */
.btn{background:var(--accent);color:#fff;border:none;height:31px;padding:0 14px;border-radius:5px;cursor:pointer;font:inherit;font-weight:600;font-size:.88rem;white-space:nowrap;margin-left:auto;transition:background .15s,transform .1s}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:scale(.98)}
/* bílá na světlém tmavém akcentu má kontrast jen ~2,6:1 */
:root:not([data-theme="light"]) .btn{color:#0b1a30}
.btn2{background:var(--bg-control);color:var(--text);border:1px solid var(--border);padding:3px 8px;border-radius:5px;cursor:pointer;font:inherit;font-size:.78rem;white-space:nowrap}
.btn2:hover:not(:disabled){border-color:var(--accent)}
.btn2:disabled{opacity:.45;cursor:default}
.btn2.nebezpecne:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
.tlacitka{display:flex;gap:4px;flex-wrap:wrap}

/* dvojice */
.dvojice-radek{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
#dvojice{flex:1 1 220px;min-width:0;background:var(--bg-input);border:1px solid var(--border-strong);border-radius:6px;color:var(--text);padding:5px 10px;height:38px;font:inherit;font-size:1.18rem;font-weight:600}
#dvojice::placeholder{color:var(--text-faint);font-weight:400;font-size:.88rem}
.dvojice-radek .btn2{height:38px;padding:0 10px}
.citac{font-size:.75rem;color:var(--text-faint);min-width:26px}
.citac.plno{color:var(--accent);font-weight:600}
.varianty{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.75rem;color:var(--text-faint)}
.varianty:not(:empty){margin-top:6px}
.varianta{background:transparent;border:1px dashed var(--border-strong);color:var(--text-muted);border-radius:5px;padding:2px 8px;cursor:pointer;font:inherit;font-size:.88rem}
.varianta:hover{border-style:solid;border-color:var(--accent);color:var(--text)}

/* mřížka slov */
#mrizka{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:5px}
/* nalezená slova mají různou délku – dlaždice se roztáhnou podle slova,
   aby se dlouhé tvary nelámaly doprostřed */
#mrizkaHledani{display:flex;flex-wrap:wrap;gap:5px}
#mrizkaHledani .slovo{flex:0 0 auto;overflow-wrap:normal}
.slovo{position:relative;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font:inherit;font-size:1.08rem;font-weight:600;color:var(--text);cursor:pointer;text-align:center;overflow-wrap:anywhere;transition:transform .12s,border-color .15s,background .15s}
.slovo:hover{transform:translateY(-1px);border-color:var(--accent);background:var(--bg-hover)}
.slovo:active{transform:scale(.97)}
.slovo:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.slovo.vybrane{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.slovo.ulozene::after{content:'★';position:absolute;top:1px;right:4px;font-size:.55rem;color:var(--warn)}
.slovo.blik{animation:blik .45s ease}
@keyframes blik{0%{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.04)}}
#mrizka .prazdne{grid-column:1/-1}
#mrizkaHledani .prazdne{width:100%}
#hledanyText{width:150px;font-size:1rem;font-weight:600}
.vice{display:flex;justify-content:center;margin-top:6px}

/* štítky */
/* Tři sloupce: vlevo zapamatované, uprostřed návrhy, vpravo nastavení a editace.
   V DOM jsou v pořadí nastavení → slova → zapamatované, protože v jednom sloupci
   (mobil) má nastavení přijít první; na širokém displeji je rozsadí grid-column. */
.rozvrzeni{display:grid;gap:8px;align-items:start}
.sloupec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sloupec .card{margin-bottom:0}
@media(min-width:900px){
  .rozvrzeni{grid-template-columns:minmax(170px,1fr) minmax(360px,2.2fr) minmax(215px,1.1fr)}
  .sloupec-ulozene{grid-column:1;grid-row:1}
  .sloupec-slova{grid-column:2;grid-row:1}
  .sloupec-nastroje{grid-column:3;grid-row:1}
}
.stitky{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.stitek{display:flex;align-items:center;justify-content:space-between;background:var(--bg-panel);border:1px solid var(--border);border-radius:999px;font-size:.95rem;overflow:hidden;transition:border-color .15s}
.stitek:hover{border-color:var(--accent)}
.stitek.vybrane{border-color:var(--accent);background:var(--accent-soft)}
.stitek .text{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere;background:none;border:none;color:var(--text);font:inherit;padding:3px 3px 3px 11px;cursor:pointer}
.stitek .x{background:none;border:none;color:var(--text-faint);font-size:1rem;line-height:1;padding:3px 9px 3px 4px;cursor:pointer}
.stitek .x:hover{color:var(--danger)}
.prazdne{color:var(--text-faint);font-size:.8rem;font-style:italic}

@media(max-width:520px){
  body{padding:6px}
  .card{padding:8px}
  .btn{flex:1 1 100%;margin-left:0}
  #mrizka{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
}
@media(prefers-reduced-motion:reduce){
  .slovo,.btn,.stitek{transition:none}
  .slovo:hover{transform:none}
  .slovo.blik{animation:none}
}
</style>
</head>
<body>
<div class="container">
  <div class="zahlavi">
    <h1>🔤 Generátor slov</h1>
    <p class="sub" id="napoveda">Klik na slovo ho zapamatuje a přidá do dvojice · G = generovat</p>
    <div class="zalozky" role="tablist">
      <button class="zalozka" id="zalozkaGenerator" role="tab" aria-selected="true" aria-controls="kartaVarka">🎲 Generátor</button>
      <button class="zalozka" id="zalozkaHledani" role="tab" aria-selected="false" aria-controls="kartaVysledky">🔍 Hledání ve slovníku</button>
    </div>
  </div>

  <div class="rozvrzeni">
  <div class="sloupec sloupec-nastroje">
  <section class="card" id="kartaNastaveni">
    <div class="nastaveni">
      <label class="pole">Styl
        <select id="styl"></select>
      </label>
      <label class="pole">Min. délka
        <input type="number" id="minDelka" min="3" max="16" value="5">
      </label>
      <label class="pole">Max. délka
        <input type="number" id="maxDelka" min="3" max="16" value="9">
      </label>
      <label class="pole">Začíná na
        <input type="text" id="zacatek" maxlength="5" placeholder="cokoli" spellcheck="false" autocomplete="off">
      </label>
      <label class="pole">Končí na
        <input type="text" id="konec" maxlength="5" placeholder="cokoli" spellcheck="false" autocomplete="off">
      </label>
      <label class="pole">Počet
        <select id="pocet">
          <option>20</option><option selected>40</option><option>60</option><option>100</option>
        </select>
      </label>
      <label class="volba" title="Za každou souhláskou samohláska a naopak – bez shluků jako „str“ nebo „ou“ (např. Bakotu, Ramise)">
        <input type="checkbox" id="stridat"> Střídat souhl./samohl.
      </label>
      <label class="volba" title="Část slov začne samohláskou (Ariel, Onaka) – jinak začínají vždy souhláskou">
        <input type="checkbox" id="samohlaskou"> I na samohlásku
      </label>
      <button class="btn" id="generovat" title="Klávesová zkratka: G">🎲 Generovat</button>
    </div>
  </section>

  <section class="card" id="kartaHledaniNastaveni" hidden>
    <div class="nastaveni">
      <label class="pole">Hledaný text
        <input type="text" id="hledanyText" placeholder="např. sko" spellcheck="false" autocomplete="off">
      </label>
      <label class="pole">Kde ve slově
        <select id="kdeHledat">
          <option value="vsude">Kdekoli</option>
          <option value="zacatek">Na začátku</option>
          <option value="uprostred">Uprostřed</option>
          <option value="konec">Na konci</option>
        </select>
      </label>
      <label class="pole">Řazení
        <select id="razeni">
          <option value="abecedne">Abecedně</option>
          <option value="kratke">Od nejkratšího</option>
          <option value="dlouhe">Od nejdelšího</option>
        </select>
      </label>
      <label class="volba" title="Český slovník: 326 813 tvarů z frekvenčního seznamu ověřených pravopisným slovníkem cs_CZ">
        <input type="checkbox" id="jazykCs" checked> Česky
      </label>
      <label class="volba" title="Anglický slovník: 87 950 tvarů z pravopisného slovníku en_US">
        <input type="checkbox" id="jazykEn"> English
      </label>
      <label class="volba" title="Zadané „zed“ pak najde i „zeď“ a „cest“ i „čest“">
        <input type="checkbox" id="bezDiakritiky"> Bez diakritiky
      </label>
      <label class="volba" title="Vynechá slovesa, přídavná jména a příslovce – zůstanou jen podstatná jména včetně skloňovaných tvarů">
        <input type="checkbox" id="jenPodstatna"> Jen podstatná jména
      </label>
    </div>
    <div class="varianty" id="stavHledani"></div>
  </section>

  <section class="card">
    <div class="dvojice-radek">
      <h2>Dvojice</h2>
      <span class="citac" id="citac">0 / 2</span>
      <input type="text" id="dvojice" placeholder="Klikni na slova níže nebo piš ručně…" spellcheck="false" autocomplete="off" aria-label="Vybraná dvojice slov">
      <div class="tlacitka">
        <button class="btn2" id="prohodit" title="Prohodit pořadí slov">⇄</button>
        <button class="btn2" id="ulozitSlova" title="Zapamatovat slova z pole – i ručně upravená nebo vlastní">★ Slova</button>
        <button class="btn2" id="ulozitDvojici" title="Uložit dvojici (Enter)">☆ Dvojice</button>
        <button class="btn2 nebezpecne" id="vymazatDvojici">Vymazat</button>
      </div>
    </div>
    <div class="varianty" id="varianty"></div>
  </section>
  </div>

  <div class="sloupec sloupec-slova">

  <section class="card" id="kartaVarka">
    <div class="hlava">
      <h2>Vygenerovaná slova <span class="pocet" id="pocetSlov"></span></h2>
      <div class="tlacitka">
        <button class="btn2" id="nahodnaZVarky" title="Složit dvojici ze dvou náhodných slov této várky">🎲 Dvojice z várky</button>
        <button class="btn2" id="predchozi" disabled title="Vrátit předchozí várku slov">↶ Předchozí várka</button>
      </div>
    </div>
    <div id="mrizka"></div>
  </section>

  <section class="card" id="kartaVysledky" hidden>
    <div class="hlava">
      <h2>Nalezená slova <span class="pocet" id="pocetNalezenych"></span></h2>
      <div class="tlacitka">
        <button class="btn2" id="kopirovatNalezena" title="Kopírovat všechna nalezená slova" aria-label="Kopírovat nalezená slova">📋</button>
        <button class="btn2" id="stahnoutNalezena" title="Stáhnout nalezená slova jako TXT" aria-label="Stáhnout nalezená slova">⬇</button>
      </div>
    </div>
    <div id="mrizkaHledani"></div>
    <div class="vice"><button class="btn2" id="viceVysledku" hidden>Zobrazit dalších 300</button></div>
  </section>
  </div>

  <div class="sloupec sloupec-ulozene">
    <section class="card">
      <div class="hlava">
        <h2>Zapamatovaná slova <span class="pocet" id="pocetUlozenych"></span></h2>
        <div class="tlacitka">
          <button class="btn2" id="nahodnaDvojice" title="Složit dvojici ze dvou náhodných zapamatovaných slov">🎲 Dvojice</button>
          <button class="btn2" id="kopirovatSlova" title="Kopírovat všechna slova" aria-label="Kopírovat všechna slova">📋</button>
          <button class="btn2" id="stahnoutSlova" title="Stáhnout slova jako TXT" aria-label="Stáhnout slova jako TXT">⬇</button>
          <button class="btn2 nebezpecne" id="vymazatSlova">Vymazat vše</button>
        </div>
      </div>
      <div class="stitky" id="ulozenaSlova"></div>
    </section>

    <section class="card">
      <div class="hlava">
        <h2>Uložené dvojice <span class="pocet" id="pocetDvojic"></span></h2>
        <div class="tlacitka">
          <button class="btn2" id="kopirovatDvojice" title="Kopírovat všechny dvojice" aria-label="Kopírovat všechny dvojice">📋</button>
          <button class="btn2" id="stahnoutDvojice" title="Stáhnout dvojice jako TXT" aria-label="Stáhnout dvojice jako TXT">⬇</button>
          <button class="btn2 nebezpecne" id="vymazatDvojice">Vymazat vše</button>
        </div>
      </div>
      <div class="stitky" id="ulozeneDvojice"></div>
    </section>
  </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ============ Styly ============
// Slovo = slabiky (začátek + samohláska) a koncovka. Opakovaná položka
// v poli má větší váhu. `zakazSlabiky` vyřadí jednotlivou slabiku,
// `zakaz` celé slovo (pravopis, nevyslovitelné shluky samohlásek).
const STYLY = {
  univerzalni: {
    nazev: 'Univerzální',
    zacatky: ['b','br','c','cr','d','dr','f','fl','fr','g','gl','gr','h','j','k','kr','l','m','n','p','pl','pr','qu','r','s','sl','sn','sp','st','str','t','tr','v','z'],
    samohlasky: ['a','e','i','o','u','ai','ei','ou'],
    konce: ['','','','','l','m','n','r','s','t','x','th','nd','nt','st','sk','rn','lm','ph','sh'],
  },
  cesky: {
    nazev: 'České',
    zacatky: ['b','br','č','d','dr','h','hr','ch','j','k','kl','kr','l','m','ml','n','p','pl','pr','r','ř','s','sk','sl','st','š','t','tr','v','vl','z','zb','ž'],
    samohlasky: ['a','a','e','e','i','o','o','u','á','í','y','ou','ě'],
    konce: ['','','','','k','l','n','r','s','t','ch','c','v','ň','št','sk','nk','vice','nov','dlo','tka','ček'],
    // po měkkých souhláskách nepíšeme y, ě jen po b p v m f d t n, ů ne na začátku
    zakaz: /[čřšžjc][yý]|(^|[^bpvmfdtn])ě|(^|[aeiouyáéíóúůěý])ů/,
  },
  fantasy: {
    nazev: 'Fantasy (elfí)',
    zacatky: ['','l','l','n','r','s','th','v','m','g','d','f','y','c','sh','gl','dr','tr','gw'],
    samohlasky: ['a','a','a','e','e','e','i','i','o','o','ae','ia','ie','y','ë'],
    konce: ['','','n','l','r','s','th','nd','dor','wen','riel','las','mir','ion','ith','ar'],
    zakaz: /([aeiouyë])\1|[aeiouyë]{3}/,
  },
  latinsky: {
    nazev: 'Latinské',
    zacatky: ['c','cl','cr','d','f','fl','g','gr','l','m','n','p','pr','qu','r','s','st','t','tr','v'],
    samohlasky: ['a','a','e','i','i','o','u','ae','au'],
    konce: ['us','us','um','a','is','ix','or','ia','ex','ius','o','ens','ax','n',''],
    zakaz: /([aeiou])\1|[aeiou]{3}/,
  },
  japonsky: {
    nazev: 'Japonské',
    zacatky: ['','k','k','s','t','n','h','m','y','r','r','w','sh','ch','ts','g','z','d','b','f'],
    samohlasky: ['a','i','u','e','o'],
    konce: ['','','','','n'],
    zakazSlabiky: /^(yi|ye|wu|wi|we|wo|ts[aieo]|si|ti|tu|hu|zi|di|du|f[aieo])$/,
    zakaz: /[aiueo]{3}/,
  },
  scifi: {
    nazev: 'Sci-fi',
    zacatky: ['z','x','k','v','tr','kr','n','q','r','s','dr','th','vr','zy','ks'],
    samohlasky: ['a','o','e','i','y','a','o'],
    konce: ['x','x','n','on','ar','ex','ix','is','os','ek','ux','','tron','ra','ta'],
    zakaz: /[aeioy]{3}|([aeioy])\1/,
  },
  severske: {
    nazev: 'Severské',
    zacatky: ['b','bj','d','f','fr','g','gr','h','hj','k','kn','l','m','n','r','s','sk','sn','st','sv','t','th','tr','v'],
    samohlasky: ['a','a','e','i','o','u','y','ei','au','å','ö'],
    konce: ['','','r','n','k','ld','rd','st','ss','nd','sen','son','berg','fjord','vik','dal','heim'],
    zakaz: /([aeiouyåö])\1|[aeiouyåö]{3}/,
  },
  slovanske: {
    nazev: 'Slovanské',
    zacatky: ['b','bl','br','v','vl','g','d','dr','ž','z','k','kr','l','m','n','p','pr','r','s','sl','st','sv','t','tr','č','š','ch','hr'],
    samohlasky: ['a','a','e','i','o','o','u','í','ě'],
    konce: ['','','v','n','r','š','sk','slav','mír','bor','žek','ka','vice','nov','grad'],
    zakaz: /[čřšžjc][yý]|(^|[^bpvmfdtn])ě|(^|[aeiouyáéíóúůěý])ů/,
  },
  recke: {
    nazev: 'Řecké',
    zacatky: ['d','f','g','h','k','kh','kl','l','m','n','p','ph','pl','r','s','st','t','th','tr','x','z'],
    samohlasky: ['a','a','e','e','i','o','o','u','ei','ai'],
    konce: ['os','os','on','as','is','es','ios','or','n','s','','kles','andros','ia'],
    zakaz: /([aeiou])\1|[aeiou]{3}/,
  },
  skreti: {
    nazev: 'Skřetí',
    zacatky: ['b','br','d','dr','g','gr','gh','k','kr','l','m','n','r','sh','sk','sn','t','th','tr','z','zg'],
    samohlasky: ['a','a','o','o','u','u','i'],
    konce: ['','g','k','sh','th','z','rg','gh','rak','nak','mog','zug','durz','grim'],
    zakaz: /([aoui])\1/,
  },
  polyneske: {
    nazev: 'Polynéské',
    // slabika je vždy souhláska + samohláska, slovo končí samohláskou
    zacatky: ['','h','h','k','k','l','m','m','n','p','t','t','w','ng'],
    samohlasky: ['a','a','a','e','i','o','u','u'],
    konce: ['','','','',''],
    zakaz: /[aeiou]{3}/,
  },
};

const nahodne = pole => pole[Math.floor(Math.random() * pole.length)];
const KONCI_SAMOHLASKOU = /[aeiouyáéíóúůěýëåö]$/i;
const SAMOHLASKA = /[aeiouyáéíóúůěýëåö]/i;

// true, když se v textu písmeno po písmenu střídá souhláska a samohláska
function stridaSe(text) {
  for (let i = 1; i < text.length; i++) {
    if (SAMOHLASKA.test(text[i]) === SAMOHLASKA.test(text[i - 1])) return false;
  }
  return true;
}

// Varianta stylu jen z jednopísmenných hlásek. Prázdný začátek (slovo
// začínající samohláskou) uprostřed slova by dal dvě samohlásky za sebou –
// takové slovo vyřadí kontrola `strida` ve vytvorSlovo.
function stridavyStyl(styl) {
  return {
    ...styl,
    zacatky: styl.zacatky.filter(z => z === '' || (z.length === 1 && !SAMOHLASKA.test(z))),
    samohlasky: styl.samohlasky.filter(s => s.length === 1),
    konce: styl.konce.filter(k => k === '' || (!SAMOHLASKA.test(k[0]) && stridaSe(k))),
    strida: true,
  };
}

// rezim: 'zacatek-samohlaska' – slovo začne samohláskou (jen krátkou: „Ýroza"
//        ani „Ůpeka" nevypadají dobře), 'zacatek-souhlaska' – souhláska povinná,
//        'po-souhlasce' – samohláska za souhláskou ze zadaného začátku,
//        'volny' – jak dává styl (fantasy a japonština mají i prázdný začátek)
function slabika(styl, rezim) {
  const bezZacatku = rezim === 'zacatek-samohlaska' || rezim === 'po-souhlasce';
  const zacatky = rezim === 'zacatek-souhlaska' ? styl.zacatky.filter(z => z !== '') : styl.zacatky;
  // jen jednopísmenná krátká samohláska – „Oumlul" ani „Eistait" nevypadají dobře
  const kratke = styl.samohlasky.filter(s => /^[aeiou]$/.test(s));
  const samohlasky = rezim === 'zacatek-samohlaska' && kratke.length ? kratke : styl.samohlasky;
  for (let i = 0; i < 20; i++) {
    const s = (bezZacatku ? '' : nahodne(zacatky)) + nahodne(samohlasky);
    if (!styl.zakazSlabiky || !styl.zakazSlabiky.test(s)) return s;
  }
  return nahodne(samohlasky);
}

// souhláska před zadaným koncem, který začíná samohláskou („Brako" + t + „a")
function napojeni(styl, konec) {
  const zacatky = styl.zacatky.filter(z => z !== '');
  for (let i = 0; i < 20; i++) {
    const z = nahodne(zacatky);
    if (!styl.zakazSlabiky || !styl.zakazSlabiky.test(z + konec[0])) return z;
  }
  return nahodne(zacatky);
}

// Cílová délka se losuje rovnoměrně z rozsahu, takže krátká i dlouhá slova
// přicházejí stejně často (skládání náhodného počtu slabik dává hlavně střed).
function vytvorSlovo(styl, min, max, zacatek, konec = '', samohlaskou = false) {
  const konecSamohlaskou = konec !== '' && SAMOHLASKA.test(konec[0]);
  // kolik místa nechat na konci: koncovka stylu, nebo zadaný konec (+ až dvě souhlásky před ním)
  const rezerva = konec ? konec.length + (konecSamohlaskou ? 2 : 0) : 1;
  for (let pokus = 0; pokus < 100; pokus++) {
    const cil = min + Math.floor(Math.random() * (max - min + 1));
    // začátek končící samohláskou („ko") už je slabika – stačí mu koncovka („Kon");
    // stejně tak konec začínající samohláskou – stačí před něj souhláska („Bus", „Krus")
    let slovo = zacatek, predchozi = '';
    let slabik = KONCI_SAMOHLASKOU.test(zacatek) || konecSamohlaskou ? 1 : 0;
    for (let krok = 0; krok < 30 && slabik < 8 && (slabik === 0 || slovo.length + rezerva < cil); krok++) {
      // za souhláskou ze zadaného začátku musí přijít samohláska;
      // na začátku slova je samohláska bez souhlásky jen jako volba („Ariel")
      const rezim = slovo === ''
        ? (samohlaskou && Math.random() < 0.35 ? 'zacatek-samohlaska' : 'zacatek-souhlaska')
        : (KONCI_SAMOHLASKOU.test(slovo) ? 'volny' : 'po-souhlasce');
      const s = slabika(styl, rezim);
      if (s === predchozi) continue; // „baba", „tsutsu"
      slovo += s;
      predchozi = s;
      slabik++;
    }
    if (konec) {
      if (konecSamohlaskou && (slovo === '' || KONCI_SAMOHLASKOU.test(slovo))) slovo += napojeni(styl, konec);
      slovo += konec;
    } else {
      const konce = styl.konce.filter(k => slovo.length + k.length <= max);
      if (!konce.length) continue;
      slovo += nahodne(konce);
    }
    if (slovo.length < min || slovo.length > max) continue;
    // zadaný začátek a konec se nekontrolují, jen jejich napojení na zbytek slova
    const jadro = slovo.slice(Math.max(0, zacatek.length - 1), slovo.length - Math.max(0, konec.length - 1));
    if (/(.)\1\1/.test(jadro) || (styl.zakaz && styl.zakaz.test(jadro))) continue;
    if (styl.strida && !stridaSe(jadro)) continue;
    return slovo.charAt(0).toLocaleUpperCase('cs') + slovo.slice(1);
  }
  return null;
}

function generujVarku(n, styl, min, max, zacatek, konec = '', samohlaskou = false) {
  const nalezena = new Set();
  for (let pokus = 0; nalezena.size < n && pokus < n * 200; pokus++) {
    const slovo = vytvorSlovo(styl, min, max, zacatek, konec, samohlaskou);
    if (slovo) nalezena.add(slovo);
  }
  return [...nalezena];
}

// ============ Pomocné ============
const KLIC = 'webapp_slova_';
function nacti(klic, vychozi) {
  try {
    const v = JSON.parse(localStorage.getItem(KLIC + klic));
    return v ?? vychozi;
  } catch { return vychozi; }
}
function uloz(klic, hodnota) {
  try { localStorage.setItem(KLIC + klic, JSON.stringify(hodnota)); } catch {}
}
const seznamTextu = v => Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];

function tvar(n, jedno, dve, pet) {
  return n === 1 ? jedno : (n >= 2 && n <= 4 ? dve : pet);
}

// dialog.js se načítá s defer – při prvním běhu skriptu ještě nemusí existovat
function hlaska(text, chyba) {
  if (typeof Dialog === 'undefined') return;
  chyba ? Dialog.chyba(text) : Dialog.info(text);
}
function potvrd(text) {
  return typeof Dialog !== 'undefined' ? Dialog.potvrd(text) : Promise.resolve(confirm(text));
}

async function kopiruj(text, popis) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // v iframu bez oprávnění clipboard-write
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (!ok) return hlaska('Kopírování se nepovedlo', true);
  }
  hlaska('Zkopírováno: ' + (popis || text));
}

function stahni(text, jmeno) {
  const odkaz = document.createElement('a');
  odkaz.href = URL.createObjectURL(new Blob([text + '\n'], { type: 'text/plain;charset=utf-8' }));
  odkaz.download = jmeno;
  document.body.appendChild(odkaz);
  odkaz.click();
  odkaz.remove();
  setTimeout(() => URL.revokeObjectURL(odkaz.href), 10000);
  hlaska('Staženo: ' + jmeno);
}

function prazdne(text) {
  const e = document.createElement('div');
  e.className = 'prazdne';
  e.textContent = text;
  return e;
}

// ============ Nastavení ============
const selStyl = $('styl'), inMin = $('minDelka'), inMax = $('maxDelka'),
      inZacatek = $('zacatek'), inKonec = $('konec'), selPocet = $('pocet'),
      chkStridat = $('stridat'), chkSamohlaskou = $('samohlaskou');

const jenPismena = text => text.toLocaleLowerCase('cs').replace(/[^a-záčďéěíňóřšťúůýžë]/g, '');

for (const [id, styl] of Object.entries(STYLY)) selStyl.add(new Option(styl.nazev, id));

function obnovNastaveni() {
  const s = nacti('nastaveni', {});
  if (s && typeof s === 'object') {
    if (STYLY[s.styl]) selStyl.value = s.styl;
    if (s.min) inMin.value = s.min;
    if (s.max) inMax.value = s.max;
    if (typeof s.zacatek === 'string') inZacatek.value = s.zacatek;
    if (typeof s.konec === 'string') inKonec.value = s.konec;
    if ([...selPocet.options].some(o => o.value === String(s.pocet))) selPocet.value = s.pocet;
    chkStridat.checked = s.stridat === true;
    chkSamohlaskou.checked = s.samohlaskou === true;
  }
}

function prectiNastaveni() {
  let min = parseInt(inMin.value, 10), max = parseInt(inMax.value, 10);
  if (isNaN(min)) min = 5;
  if (isNaN(max)) max = 9;
  min = Math.max(3, Math.min(16, min));
  max = Math.max(3, Math.min(16, max));
  if (min > max) [min, max] = [max, min];
  inMin.value = min;
  inMax.value = max;
  const zacatek = jenPismena(inZacatek.value), konec = jenPismena(inKonec.value);
  inZacatek.value = zacatek;
  inKonec.value = konec;
  const n = { styl: selStyl.value, min, max, zacatek, konec, pocet: parseInt(selPocet.value, 10),
              stridat: chkStridat.checked, samohlaskou: chkSamohlaskou.checked };
  uloz('nastaveni', n);
  return n;
}

// ============ Dvojice ============
const vstup = $('dvojice');
const slovaDvojice = () => vstup.value.trim().split(/\s+/).filter(Boolean);

function nastavDvojici(slova) {
  vstup.value = slova.join(' ');
  poZmeneDvojice();
}

function poZmeneDvojice() {
  const s = slovaDvojice();
  $('citac').textContent = s.length + ' / 2';
  $('citac').classList.toggle('plno', s.length === 2);
  $('prohodit').disabled = $('ulozitDvojici').disabled = s.length !== 2;
  $('ulozitSlova').disabled = s.length === 0;
  uloz('rozpracovana', vstup.value);
  vykresliVarianty(s);
  oznacVybrane();
}

// klik na slovo, které už ve dvojici je, ho z ní odebere
function prepniVeDvojici(slovo) {
  const s = slovaDvojice();
  const i = s.indexOf(slovo);
  if (i >= 0) {
    s.splice(i, 1);
    nastavDvojici(s);
    return 'odebrano';
  }
  if (s.length >= 2) {
    hlaska('Dvojice je plná – klikni na slovo v ní, nebo ji vymaž');
    return 'plno';
  }
  s.push(slovo);
  nastavDvojici(s);
  return 'pridano';
}

function vykresliVarianty(s) {
  const box = $('varianty');
  box.textContent = '';
  if (s.length === 1) box.textContent = 'Vyber ještě jedno slovo.';
  if (s.length !== 2) return;
  const [a, b] = s;
  const tvary = new Set([
    `${a} ${b}`,
    a + b,
    a + b.toLocaleLowerCase('cs'),
    `${a}-${b}`,
    (a + b).toLocaleLowerCase('cs'),
    // doména: diakritika se v názvech domén nepoužívá
    (a + b).toLocaleLowerCase('cs').normalize('NFD').replace(/[̀-ͯ]/g, '') + '.cz',
  ]);
  box.append('Kopírovat:');
  for (const t of tvary) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'varianta';
    btn.textContent = t;
    btn.addEventListener('click', () => kopiruj(t));
    box.appendChild(btn);
  }
}

vstup.addEventListener('input', () => {
  const s = slovaDvojice();
  if (s.length > 2) {
    nastavDvojici(s.slice(0, 2));
    hlaska('Dvojice má nejvýš 2 slova');
  } else {
    poZmeneDvojice();
  }
});
vstup.addEventListener('keydown', e => {
  if (e.key === 'Enter') ulozDvojici();
});

$('prohodit').addEventListener('click', () => nastavDvojici(slovaDvojice().reverse()));
$('vymazatDvojici').addEventListener('click', () => {
  nastavDvojici([]);
  vstup.focus();
});

// ============ Zapamatovaná slova a dvojice ============
let ulozenaSlova = seznamTextu(nacti('ulozena', []));
let ulozeneDvojice = seznamTextu(nacti('dvojice', []));

function stitek(text, titulek, priKliku, priOdebrani) {
  const st = document.createElement('span');
  st.className = 'stitek';
  st.dataset.hodnota = text;
  const t = document.createElement('button');
  t.type = 'button';
  t.className = 'text';
  t.textContent = text;
  t.title = titulek;
  t.addEventListener('click', priKliku);
  const x = document.createElement('button');
  x.type = 'button';
  x.className = 'x';
  x.textContent = '×';
  x.title = 'Odebrat';
  x.setAttribute('aria-label', 'Odebrat ' + text);
  x.addEventListener('click', priOdebrani);
  st.append(t, x);
  return st;
}

function vykresliUlozena() {
  const box = $('ulozenaSlova');
  box.textContent = '';
  const n = ulozenaSlova.length;
  $('pocetUlozenych').textContent = n ? `(${n})` : '';
  $('nahodnaDvojice').disabled = n < 2;
  $('kopirovatSlova').disabled = $('stahnoutSlova').disabled = $('vymazatSlova').disabled = !n;
  if (!n) box.appendChild(prazdne('Zatím nic. Klikni na vygenerované slovo.'));
  for (const slovo of ulozenaSlova) {
    box.appendChild(stitek(slovo, 'Přidat do dvojice / odebrat z ní',
      () => prepniVeDvojici(slovo),
      () => {
        ulozenaSlova = ulozenaSlova.filter(w => w !== slovo);
        uloz('ulozena', ulozenaSlova);
        vykresliUlozena();
      }));
  }
  oznacVybrane();
}

function vykresliDvojice() {
  const box = $('ulozeneDvojice');
  box.textContent = '';
  const n = ulozeneDvojice.length;
  $('pocetDvojic').textContent = n ? `(${n})` : '';
  $('kopirovatDvojice').disabled = $('stahnoutDvojice').disabled = $('vymazatDvojice').disabled = !n;
  if (!n) box.appendChild(prazdne('Hotovou dvojici ulož tlačítkem ☆ Dvojice.'));
  for (const d of ulozeneDvojice) {
    box.appendChild(stitek(d, 'Načíst do dvojice',
      () => nastavDvojici(d.split(' ')),
      () => {
        ulozeneDvojice = ulozeneDvojice.filter(x => x !== d);
        uloz('dvojice', ulozeneDvojice);
        vykresliDvojice();
      }));
  }
  oznacVybrane();
}

function zapamatuj(slovo) {
  if (ulozenaSlova.includes(slovo)) return;
  ulozenaSlova.push(slovo);
  uloz('ulozena', ulozenaSlova);
  vykresliUlozena();
}

function ulozDvojici() {
  const s = slovaDvojice();
  if (s.length !== 2) return hlaska('Dvojice potřebuje dvě slova');
  const text = s.join(' ');
  if (ulozeneDvojice.includes(text)) return hlaska('Tahle dvojice už je uložená');
  ulozeneDvojice.unshift(text);
  uloz('dvojice', ulozeneDvojice);
  vykresliDvojice();
  hlaska('Dvojice uložena');
}
$('ulozitDvojici').addEventListener('click', ulozDvojici);

// zapamatuje i slovo, které si uživatel v poli upravil nebo napsal sám
$('ulozitSlova').addEventListener('click', () => {
  const s = slovaDvojice();
  if (!s.length) return hlaska('V poli není žádné slovo');
  const nova = s.filter(w => !ulozenaSlova.includes(w));
  s.forEach(zapamatuj);
  hlaska(nova.length ? 'Zapamatováno: ' + nova.join(', ')
                     : `Už ${tvar(s.length, 'je zapamatované', 'jsou zapamatovaná', 'je zapamatovaných')}`);
});

// dvě různá slova ze seznamu: druhý index se losuje z kratšího rozsahu a posune,
// aby nevznikla dvojice stejných slov
function nahodnaZeSeznamu(seznam) {
  const i = Math.floor(Math.random() * seznam.length);
  let j = Math.floor(Math.random() * (seznam.length - 1));
  if (j >= i) j++;
  return [seznam[i], seznam[j]];
}
$('nahodnaDvojice').addEventListener('click', () => nastavDvojici(nahodnaZeSeznamu(ulozenaSlova)));
$('nahodnaZVarky').addEventListener('click', () => nastavDvojici(nahodnaZeSeznamu(varka)));

$('kopirovatSlova').addEventListener('click', () => {
  const n = ulozenaSlova.length;
  kopiruj(ulozenaSlova.join('\n'), `${n} ${tvar(n, 'slovo', 'slova', 'slov')}`);
});
$('kopirovatDvojice').addEventListener('click', () => {
  const n = ulozeneDvojice.length;
  kopiruj(ulozeneDvojice.join('\n'), `${n} ${tvar(n, 'dvojice', 'dvojice', 'dvojic')}`);
});
$('stahnoutSlova').addEventListener('click', () => stahni(ulozenaSlova.join('\n'), 'slova.txt'));
$('stahnoutDvojice').addEventListener('click', () => stahni(ulozeneDvojice.join('\n'), 'dvojice.txt'));

$('vymazatSlova').addEventListener('click', async () => {
  if (!ulozenaSlova.length || !await potvrd('Vymazat všechna zapamatovaná slova?')) return;
  ulozenaSlova = [];
  uloz('ulozena', ulozenaSlova);
  vykresliUlozena();
});
$('vymazatDvojice').addEventListener('click', async () => {
  if (!ulozeneDvojice.length || !await potvrd('Vymazat všechny uložené dvojice?')) return;
  ulozeneDvojice = [];
  uloz('dvojice', ulozeneDvojice);
  vykresliDvojice();
});

// ============ Mřížka ============
const mrizka = $('mrizka');
let varka = [];
const historie = [];

function oznacVybrane() {
  const vybrana = new Set(slovaDvojice());
  const ulozena = new Set(ulozenaSlova);
  const dvojice = slovaDvojice().join(' ');
  document.querySelectorAll('#mrizka .slovo, #mrizkaHledani .slovo').forEach(b => {
    const ve = vybrana.has(b.textContent);
    b.classList.toggle('vybrane', ve);
    b.setAttribute('aria-pressed', ve);
    b.classList.toggle('ulozene', ulozena.has(b.textContent));
  });
  $('ulozenaSlova').querySelectorAll('.stitek').forEach(st =>
    st.classList.toggle('vybrane', vybrana.has(st.dataset.hodnota)));
  $('ulozeneDvojice').querySelectorAll('.stitek').forEach(st =>
    st.classList.toggle('vybrane', st.dataset.hodnota === dvojice));
}

function vykresliMrizku() {
  mrizka.textContent = '';
  $('pocetSlov').textContent = varka.length ? `(${varka.length})` : '';
  $('predchozi').disabled = !historie.length;
  $('nahodnaZVarky').disabled = varka.length < 2;
  if (!varka.length) {
    mrizka.appendChild(prazdne('Pro tohle nastavení se žádná slova nenašla – zkus širší rozsah délky nebo jiný začátek či konec.'));
    return;
  }
  const frag = document.createDocumentFragment();
  for (const slovo of varka) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'slovo';
    b.textContent = slovo;
    frag.appendChild(b);
  }
  mrizka.appendChild(frag);
  oznacVybrane();
}

function klikNaSlovo(e) {
  const b = e.target.closest('.slovo');
  if (!b) return;
  const slovo = b.textContent;
  zapamatuj(slovo);
  if (prepniVeDvojici(slovo) === 'pridano') {
    b.classList.remove('blik');
    void b.offsetWidth; // restart animace při rychlém opakovaném kliku
    b.classList.add('blik');
  }
}
mrizka.addEventListener('click', klikNaSlovo);
$('mrizkaHledani').addEventListener('click', klikNaSlovo);

function generuj() {
  const n = prectiNastaveni();
  if (n.zacatek.length + n.konec.length > n.max) {
    const co = [n.zacatek && `začátek „${n.zacatek}"`, n.konec && `konec „${n.konec}"`].filter(Boolean).join(' a ');
    hlaska(`Na ${co} je max. délka ${n.max} příliš krátká`);
  }
  const styl = n.stridat ? stridavyStyl(STYLY[n.styl]) : STYLY[n.styl];
  const nova = generujVarku(n.pocet, styl, n.min, n.max, n.zacatek, n.konec, n.samohlaskou);
  if (varka.length) {
    historie.push(varka);
    if (historie.length > 20) historie.shift();
  }
  varka = nova;
  uloz('varka', varka);
  vykresliMrizku();
  if (nova.length && nova.length < n.pocet) {
    hlaska(`Našlo se jen ${nova.length} ${tvar(nova.length, 'unikátní slovo', 'unikátní slova', 'unikátních slov')}`);
  }
}

$('generovat').addEventListener('click', generuj);
$('predchozi').addEventListener('click', () => {
  if (!historie.length) return;
  varka = historie.pop();
  uloz('varka', varka);
  vykresliMrizku();
});

[selStyl, selPocet, chkStridat, chkSamohlaskou].forEach(el => el.addEventListener('change', generuj));
[inMin, inMax, inZacatek, inKonec].forEach(el => {
  el.addEventListener('change', prectiNastaveni);
  el.addEventListener('keydown', e => { if (e.key === 'Enter') generuj(); });
});

document.addEventListener('keydown', e => {
  if (zalozka !== 'generator') return;
  if (e.key.toLowerCase() !== 'g' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest('input, select, textarea, [contenteditable]')) return;
  e.preventDefault();
  generuj();
});

// ============ Záložky ============
const ZALOZKY = {
  generator: { tlacitko: 'zalozkaGenerator', karty: ['kartaNastaveni', 'kartaVarka'],
               napoveda: 'Klik na slovo ho zapamatuje a přidá do dvojice · G = generovat' },
  hledani:   { tlacitko: 'zalozkaHledani', karty: ['kartaHledaniNastaveni', 'kartaVysledky'],
               napoveda: 'Najde slova ze slovníku · klik na slovo ho zapamatuje a přidá do dvojice' },
};
let zalozka = 'generator';

function prepniZalozku(nova) {
  zalozka = ZALOZKY[nova] ? nova : 'generator';
  for (const [id, popis] of Object.entries(ZALOZKY)) {
    const aktivni = id === zalozka;
    $(popis.tlacitko).setAttribute('aria-selected', aktivni);
    popis.karty.forEach(karta => { $(karta).hidden = !aktivni; });
  }
  $('napoveda').textContent = ZALOZKY[zalozka].napoveda;
  uloz('zalozka', zalozka);
  if (zalozka === 'hledani') {
    $('hledanyText').focus();
    naplanujHledani(0);
  }
}
$('zalozkaGenerator').addEventListener('click', () => prepniZalozku('generator'));
$('zalozkaHledani').addEventListener('click', () => prepniZalozku('hledani'));

// ============ Slovníky ============
// Slovníky jsou velké (česky 1,4 MB), proto se stahují až při prvním hledání.
const SOUBORY_SLOVNIKU = { cs: 'slovnikCz.js', en: 'slovnikEn.js' };
const slovniky = {};   // jazyk → { nazev, slova, bez }
const nacitani = {};

// v souboru má každý řádek na začátku znak s počtem písmen sdílených s předchozím slovem
function rozbalSlovnik(data) {
  const slova = [];
  let predchozi = '';
  for (const radek of data.split('\n')) {
    if (!radek) continue;
    const slovo = predchozi.slice(0, radek.charCodeAt(0) - 48) + radek.slice(1);
    slova.push(slovo);
    predchozi = slovo;
  }
  return slova;
}

// bitová mapa podstatných jmen: jeden bit na slovo, ve stejném pořadí jako slova
function rozbalBitmapu(base64) {
  const text = atob(base64);
  const bajty = new Uint8Array(text.length);
  for (let i = 0; i < text.length; i++) bajty[i] = text.charCodeAt(i);
  return bajty;
}
const jePodstatne = (slovnik, i) => (slovnik.podstatna[i >> 3] & (1 << (i & 7))) !== 0;

function nactiSlovnik(jazyk) {
  if (slovniky[jazyk]) return Promise.resolve(slovniky[jazyk]);
  if (nacitani[jazyk]) return nacitani[jazyk];
  nacitani[jazyk] = new Promise((hotovo, chyba) => {
    const tag = document.createElement('script');
    tag.src = SOUBORY_SLOVNIKU[jazyk];
    tag.onload = () => {
      const zdroj = window.SLOVNIKY && window.SLOVNIKY[jazyk];
      if (!zdroj) return chyba(new Error('slovník se nenačetl'));
      slovniky[jazyk] = {
        nazev: zdroj.nazev,
        slova: rozbalSlovnik(zdroj.data),
        podstatna: rozbalBitmapu(zdroj.podstatna),
      };
      zdroj.data = '';   // rozbalený seznam stačí, původní text už jen zabírá paměť
      hotovo(slovniky[jazyk]);
    };
    tag.onerror = () => chyba(new Error('slovník se nepodařilo stáhnout'));
    document.head.appendChild(tag);
  });
  return nacitani[jazyk];
}

const bezDiakritiky = text => text.normalize('NFD').replace(/[̀-ͯ]/g, '');

// ============ Hledání ve slovníku ============
const KROK_VYSLEDKU = 300;
// řazení podle abecedy je drahé (localeCompare); u velkých výsledků se vynechá,
// slovníky samy jsou abecedně seřazené
const MEZ_RAZENI = 5000;
let nalezena = [], zobrazeno = 0, casovacHledani = 0;

function vyhovuje(slovo, hledane, kde) {
  if (kde === 'zacatek') return slovo.startsWith(hledane);
  if (kde === 'konec') return slovo.endsWith(hledane);
  if (kde === 'vsude') return slovo.includes(hledane);
  // uprostřed: musí existovat výskyt, který není na začátku ani na konci
  for (let i = slovo.indexOf(hledane); i >= 0; i = slovo.indexOf(hledane, i + 1)) {
    if (i > 0 && i + hledane.length < slovo.length) return true;
  }
  return false;
}

function prectiHledani() {
  const n = {
    text: $('hledanyText').value.trim().toLocaleLowerCase('cs'),
    kde: $('kdeHledat').value,
    razeni: $('razeni').value,
    cs: $('jazykCs').checked,
    en: $('jazykEn').checked,
    bez: $('bezDiakritiky').checked,
    podstatna: $('jenPodstatna').checked,
  };
  uloz('hledani', n);
  return n;
}

function naplanujHledani(prodleva = 200) {
  clearTimeout(casovacHledani);
  casovacHledani = setTimeout(hledej, prodleva);
}

async function hledej() {
  const n = prectiHledani();
  const jazyky = [n.cs && 'cs', n.en && 'en'].filter(Boolean);
  const stav = $('stavHledani');
  if (!n.text || !jazyky.length) {
    nalezena = [];
    stav.textContent = n.text ? 'Vyber aspoň jeden slovník.' : 'Zadej hledaný text.';
    vykresliNalezena();
    return;
  }
  if (jazyky.some(j => !slovniky[j])) stav.textContent = 'Načítám slovník…';
  try {
    await Promise.all(jazyky.map(nactiSlovnik));
  } catch {
    nalezena = [];
    stav.textContent = 'Slovník se nepodařilo načíst.';
    vykresliNalezena();
    hlaska('Slovník se nepodařilo načíst', true);
    return;
  }
  const hledane = n.bez ? bezDiakritiky(n.text) : n.text;
  const vysledky = [];
  for (const jazyk of jazyky) {
    const slovnik = slovniky[jazyk];
    // porovnávací seznam bez diakritiky se spočítá až při prvním takovém hledání
    if (n.bez && !slovnik.bez) slovnik.bez = slovnik.slova.map(bezDiakritiky);
    const hledaci = n.bez ? slovnik.bez : slovnik.slova;
    for (let i = 0; i < hledaci.length; i++) {
      if (n.podstatna && !jePodstatne(slovnik, i)) continue;
      if (vyhovuje(hledaci[i], hledane, n.kde)) vysledky.push(slovnik.slova[i]);
    }
  }
  // řazení podle délky je stabilní, takže uvnitř stejné délky zůstane abeceda
  if (n.razeni === 'kratke') vysledky.sort((a, b) => a.length - b.length);
  else if (n.razeni === 'dlouhe') vysledky.sort((a, b) => b.length - a.length);
  else if (jazyky.length > 1 && vysledky.length <= MEZ_RAZENI) vysledky.sort((a, b) => a.localeCompare(b, 'cs'));

  nalezena = vysledky;
  const kde = { vsude: 'kdekoli', zacatek: 'na začátku', uprostred: 'uprostřed', konec: 'na konci' }[n.kde];
  const prohledano = jazyky.map(j => `${slovniky[j].nazev} (${slovniky[j].slova.length})`).join(' + ');
  stav.textContent = `„${hledane}" ${kde}${n.podstatna ? ' · jen podstatná jména' : ''} · prohledáno ${prohledano}`;
  vykresliNalezena();
}

function vykresliNalezena() {
  const box = $('mrizkaHledani');
  box.textContent = '';
  zobrazeno = 0;
  $('pocetNalezenych').textContent = nalezena.length ? `(${nalezena.length})` : '';
  $('kopirovatNalezena').disabled = $('stahnoutNalezena').disabled = !nalezena.length;
  if (!nalezena.length) {
    box.appendChild(prazdne($('hledanyText').value.trim()
      ? 'Žádné slovo nevyhovuje – zkus jiné písmeno nebo druhý slovník.'
      : 'Napiš písmena, která má slovo obsahovat.'));
    $('viceVysledku').hidden = true;
    return;
  }
  dalsiVysledky();
}

function dalsiVysledky() {
  const box = $('mrizkaHledani');
  const frag = document.createDocumentFragment();
  const konec = Math.min(zobrazeno + KROK_VYSLEDKU, nalezena.length);
  for (let i = zobrazeno; i < konec; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'slovo';
    b.textContent = nalezena[i];
    frag.appendChild(b);
  }
  box.appendChild(frag);
  zobrazeno = konec;
  const zbyva = nalezena.length - zobrazeno;
  $('viceVysledku').hidden = !zbyva;
  $('viceVysledku').textContent = `Zobrazit dalších ${Math.min(KROK_VYSLEDKU, zbyva)} (zbývá ${zbyva})`;
  oznacVybrane();
}

$('viceVysledku').addEventListener('click', dalsiVysledky);
$('hledanyText').addEventListener('input', () => naplanujHledani());
$('hledanyText').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(casovacHledani); hledej(); }
});
[$('kdeHledat'), $('razeni'), $('jazykCs'), $('jazykEn'), $('bezDiakritiky'), $('jenPodstatna')]
  .forEach(el => el.addEventListener('change', () => naplanujHledani(0)));
$('kopirovatNalezena').addEventListener('click', () =>
  kopiruj(nalezena.join('\n'), `${nalezena.length} ${tvar(nalezena.length, 'slovo', 'slova', 'slov')}`));
$('stahnoutNalezena').addEventListener('click', () => stahni(nalezena.join('\n'), 'nalezena_slova.txt'));

function obnovHledani() {
  const h = nacti('hledani', {});
  if (!h || typeof h !== 'object') return;
  if (typeof h.text === 'string') $('hledanyText').value = h.text;
  if (h.kde) $('kdeHledat').value = h.kde;
  if (h.razeni) $('razeni').value = h.razeni;
  $('jazykCs').checked = h.cs !== false;
  $('jazykEn').checked = h.en === true;
  $('bezDiakritiky').checked = h.bez === true;
  $('jenPodstatna').checked = h.podstatna === true;
}

// ============ Start ============
obnovNastaveni();
const rozpracovana = nacti('rozpracovana', '');
vstup.value = typeof rozpracovana === 'string' ? rozpracovana : '';
vykresliUlozena();
vykresliDvojice();
// poslední várka přežije znovunačtení (rozcestník stránku v iframu načítá znovu)
varka = seznamTextu(nacti('varka', []));
if (varka.length) vykresliMrizku();
else generuj();
poZmeneDvojice();
obnovHledani();
prepniZalozku(nacti('zalozka', 'generator'));
</script>
</body>
</html>
