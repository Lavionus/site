<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔎 Kde je Vali?</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<script src="../rekord.js"></script>
<script src="kde_je_vali/sprity.js"></script>
<style>
html,body{height:100%}
body{background:var(--bg-deep);margin:0;color:var(--text);display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none !important}

/* horní lišta se skupinami a rozbalovacími nabídkami (vzor prevoznik.html) */
.lista{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.lista::-webkit-scrollbar{display:none}
.lista > *{flex-shrink:0}
.lista h1{font-size:1.02rem;font-weight:600;white-space:nowrap;margin:0 6px 0 0}
.lista .skup{display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:1px 4px 3px;border-radius:9px;background:color-mix(in srgb,var(--bg-control) 45%,transparent);border:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.lista .skup-nazev{font-size:9.5px;line-height:1.25;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);text-align:center;user-select:none}
.lista .skup-tl{display:flex;align-items:center;gap:2px}
.samostatne .lista{padding-right:72px}
@media (max-width:640px){.lista{flex-wrap:wrap}.lista .txt{display:none}}
.tl{background:var(--bg-control);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:.84rem;white-space:nowrap;font-family:inherit;line-height:1.3}
.tl:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.tl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tl.hlavni-tl{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent);font-weight:600}
.tl.hlavni-tl:hover{background:var(--accent-hover)}

.nabidka{position:fixed;z-index:60;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:230px;max-height:calc(100vh - 70px);overflow-y:auto}
.nabidka .tl{display:flex;align-items:center;gap:6px;text-align:left;background:none;border-color:transparent;padding:6px 10px}
.nabidka .tl:hover{background:var(--bg-hover)}
.nabidka .tl[aria-current="true"]{background:var(--accent-soft)}
.nabidka kbd{margin-left:auto;font-size:.7rem;color:var(--text-faint);font-family:inherit;border:1px solid var(--border);border-radius:4px;padding:0 5px}
.nabidka hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.nabidka .nadpis{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);padding:4px 10px 0}
.nabidka .rekordy{font-size:.8rem;color:var(--text-muted);padding:2px 10px}

/* co hledat */
.hledej{display:flex;align-items:center;gap:4px}
.cil{position:relative;width:34px;height:46px;border-radius:7px;background:var(--bg-panel);border:1px solid var(--border);display:grid;place-items:center;padding:0;cursor:pointer}
.cil canvas{width:30px;height:42px}
.cil.drobny{width:38px}
.cil.drobny canvas{width:34px;height:34px}
.hledej.husto .cil{width:29px;height:38px}
.hledej.husto .cil canvas{width:26px;height:34px}
.hledej.husto .cil.drobny canvas{width:26px;height:26px}
@media (max-width:640px){.lista .hledej{flex-wrap:wrap;max-width:calc(100vw - 40px)}}
.cil.nalezen{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg-panel))}
.cil.nalezen::after{content:'✓';position:absolute;right:-4px;bottom:-4px;font-size:.75rem;font-weight:700;background:var(--ok);color:var(--on-accent,#fff);border-radius:50%;width:15px;height:15px;display:grid;place-items:center}
.cas{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:600;min-width:3.2em;text-align:center}
.cas small{display:block;font-size:.65rem;font-weight:400;color:var(--text-muted)}

.plocha{position:relative;flex:1;min-height:0;background:var(--bg-deep);touch-action:none;user-select:none}
#platno{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
#platno.tahne{cursor:grabbing}
.zoom{position:absolute;right:10px;bottom:34px;display:flex;flex-direction:column;gap:4px}
.zoom .tl{width:36px;height:36px;font-size:1.1rem;padding:0;box-shadow:var(--shadow)}
.hlaska{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:6px 14px;box-shadow:var(--shadow);font-size:.9rem;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.hlaska.chyba{border-color:var(--danger);color:var(--danger)}
.hlaska.ok{border-color:var(--ok)}
.nacitani{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-muted)}

/* pruh přes horní okraj scény: úvod (sám zmizí) a výsledek – nic neblokuje */
.pruh{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px 8px 6px 12px;max-width:calc(100% - 90px);box-sizing:border-box;font-size:.9rem;line-height:1.4}
.pruh canvas{width:30px;height:42px;flex-shrink:0}
.pruh.vyhra{border-color:var(--ok)}
.pruh .tl{flex-shrink:0}
.pruh .zavrit{background:none;border:0;color:var(--text-muted);font-size:1.1rem;cursor:pointer;padding:2px 6px;flex-shrink:0}
@media (max-width:640px){.pruh{flex-wrap:wrap;max-width:calc(100% - 20px)}}
/* vysouvací panely s popisem (nápověda, detail hledaného) */
.nabidka.popis{max-width:min(360px,calc(100vw - 16px));padding:10px 14px;line-height:1.5;font-size:.88rem}
.nabidka.popis h3{margin:0 0 4px;font-size:1rem}
.nabidka.popis p{margin:.35em 0;color:var(--text-muted)}
.nabidka.popis ul{margin:.2em 0 .4em;padding-left:1.2em}
.nabidka.popis canvas{float:right;margin:0 0 6px 10px;width:72px;height:100px}
/* seznam slov ve viktoriánském pokoji */
.seznam{flex-shrink:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;padding:7px 12px 9px;background:var(--bg-elevated);border-top:1px solid var(--border);font-size:.95rem;font-family:Georgia,'Times New Roman',serif}
.seznam span{white-space:nowrap}
.seznam span.nalezen{text-decoration:line-through;color:var(--text-faint)}
.seznam canvas{width:44px;height:44px;display:block}
.seznam .silueta{border-radius:6px;background:var(--bg-panel);border:1px solid var(--border);padding:2px;position:relative}
.seznam .silueta.nalezen{opacity:.35}
.seznam .silueta.nalezen::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:1.4rem;font-weight:700;color:var(--ok)}
.pocet{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:600;padding:0 6px}
</style>
</head>
<body>
<header class="lista">
  <h1>🔎 Kde je Vali?</h1>
  <div class="skup" role="group" aria-label="Hra"><span class="skup-nazev" aria-hidden="true">Hra</span><div class="skup-tl">
    <button class="tl hlavni-tl" data-prikaz="nova" title="Nová scéna (N)">🎲<span class="txt"> Nová</span></button>
    <button class="tl" data-nabidka="nabHra" aria-expanded="false" title="Co hledat, scéna a obtížnost">⚙️<span class="txt"> Nastavení</span> ▾</button>
  </div></div>
  <div class="skup" role="group" aria-label="Hledej"><span class="skup-nazev" aria-hidden="true">Hledej</span><div class="skup-tl hledej" id="cile"></div></div>
  <div class="skup" role="group" aria-label="Čas"><span class="skup-nazev" aria-hidden="true">Čas</span><div class="skup-tl"><div class="cas" id="cas">0:00</div></div></div>
  <div class="skup" role="group" aria-label="Pomoc"><span class="skup-nazev" aria-hidden="true">Pomoc</span><div class="skup-tl">
    <button class="tl" data-prikaz="napoveda" title="Zúžit oblast hledání (H) – hra pak nejde do rekordů">💡<span class="txt"> Nápověda</span></button>
    <button class="tl" data-nabidka="nabPomoc" aria-expanded="false" title="Co hledat a jak se hraje">❓</button>
  </div></div>
</header>

<div id="nabHra" class="nabidka" hidden>
  <div class="nadpis">Co hledat</div>
  <div id="nabRezimy"></div>
  <hr>
  <div class="nadpis">Obtížnost</div>
  <button class="tl" data-obtiznost="lehka">🙂 Lehká <kbd>1</kbd></button>
  <button class="tl" data-obtiznost="stredni">😐 Střední <kbd>2</kbd></button>
  <button class="tl" data-obtiznost="tezka">😬 Těžká <kbd>3</kbd></button>
  <button class="tl" data-obtiznost="mistr">🎩 Mistr <kbd>4</kbd></button>
  <div id="nabSeznam">
    <hr>
    <div class="nadpis">Seznam v pokoji</div>
    <button class="tl" data-seznam="slova">🔤 Slova</button>
    <button class="tl" data-seznam="siluety">👤 Siluety</button>
  </div>
  <hr>
  <div class="nadpis">Scéna</div>
  <div id="nabSceny"></div>
  <hr>
  <button class="tl" data-prikaz="sdilej">🔗 Zkopírovat odkaz na tuto scénu</button>
  <hr>
  <div class="nadpis">Rekordy (bez nápovědy)</div>
  <div class="rekordy" id="rekLehka"></div>
  <div class="rekordy" id="rekStredni"></div>
  <div class="rekordy" id="rekTezka"></div>
  <div class="rekordy" id="rekMistr"></div>
</div>

<div id="nabPomoc" class="nabidka popis" hidden></div>
<div id="nabCil" class="nabidka popis" hidden></div>

<main class="plocha" id="plocha">
  <canvas id="platno" aria-label="Scéna plná lidí – najdi, co je v liště Hledej"></canvas>
  <div class="nacitani" id="nacitani">Načítám scénu…</div>
  <div class="zoom">
    <button class="tl" data-prikaz="priblizit" title="Přiblížit (+)">+</button>
    <button class="tl" data-prikaz="oddalit" title="Oddálit (−)">−</button>
    <button class="tl" data-prikaz="cela" title="Celá scéna (0)">⤢</button>
  </div>
  <div class="hlaska" id="hlaska" hidden></div>
  <div class="pruh" id="pruh" hidden></div>
</main>
<div class="seznam" id="seznam" hidden></div>

<script>
/* ---------- jádro bez DOM (testuje _test/kde_je_vali_test.js) ---------- */
const VALI = (() => {
  // pochozí plochy scén jako mnohoúhelníky v podílech šířky/výšky obrázku;
  // pokoje (typ 'pokoj'): plochy = kde smí ležet střed předmětu (bez stropu a oken)
  const SCENY = [
    { id: 'namesti', nazev: '🏛️ Náměstí s trhem', soubor: 'scena_namesti.webp', plochy: [[[.02, .34], [.78, .34], [.98, .4], [.98, .57], [.85, .57], [.84, .8], [.98, .8], [.98, .98], [.13, .98], [.12, .62], [.02, .62]]] },
    { id: 'plaz', nazev: '🏖️ Pláž', soubor: 'scena_plaz.webp', plochy: [[[.01, .12], [.82, .12], [.82, .22], [.99, .22], [.99, .99], [.01, .99]]] },
    { id: 'park', nazev: '🌳 Park', soubor: 'scena_park.webp', plochy: [[[.15, .08], [.8, .08], [.8, .22], [.95, .24], [.9, .8], [.85, .95], [.1, .95], [.06, .3], [.15, .2]]] },
    { id: 'zima', nazev: '⛄ Zimní městečko', soubor: 'scena_zima.webp', plochy: [[[.13, .28], [.87, .28], [.87, .6], [.93, .65], [.98, .98], [.02, .98], [.07, .62], [.13, .6]]] },
    { id: 'salon', typ: 'pokoj', nazev: '🛋️ Salon', soubor: 'pokoj_salon.webp', plochy: [[[0.02, 0.22], [0.48, 0.22], [0.48, 0.97], [0.02, 0.97]], [[0.48, 0.56], [0.98, 0.56], [0.98, 0.97], [0.48, 0.97]], [[0.78, 0.22], [0.98, 0.22], [0.98, 0.56], [0.78, 0.56]]] },
    { id: 'pracovna', typ: 'pokoj', nazev: '📚 Pracovna', soubor: 'pokoj_pracovna.webp', plochy: [[[0.02, 0.2], [0.22, 0.2], [0.22, 0.97], [0.02, 0.97]], [[0.22, 0.47], [0.98, 0.47], [0.98, 0.97], [0.22, 0.97]], [[0.34, 0.18], [0.98, 0.18], [0.98, 0.47], [0.34, 0.47]]] },
    { id: 'loznice', typ: 'pokoj', nazev: '🛏️ Budoár', soubor: 'pokoj_loznice.webp', plochy: [[[0.02, 0.17], [0.36, 0.17], [0.36, 0.97], [0.02, 0.97]], [[0.36, 0.44], [0.98, 0.44], [0.98, 0.97], [0.36, 0.97]], [[0.5, 0.17], [0.98, 0.17], [0.98, 0.44], [0.5, 0.44]]] },
    { id: 'jidelna', typ: 'pokoj', nazev: '🍽️ Jídelna', soubor: 'pokoj_jidelna.webp', plochy: [[[0.02, 0.17], [0.55, 0.17], [0.55, 0.97], [0.02, 0.97]], [[0.55, 0.42], [0.98, 0.42], [0.98, 0.97], [0.55, 0.97]], [[0.76, 0.17], [0.98, 0.17], [0.98, 0.42], [0.76, 0.42]]] },
    { id: 'kuchyne', typ: 'pokoj', nazev: '🍲 Kuchyně', soubor: 'pokoj_kuchyne.webp', plochy: [[[0.02, 0.08], [0.6, 0.08], [0.6, 0.97], [0.02, 0.97]], [[0.6, 0.42], [0.98, 0.42], [0.98, 0.97], [0.6, 0.97]], [[0.74, 0.08], [0.98, 0.08], [0.98, 0.42], [0.74, 0.42]]] },
    { id: 'detsky', typ: 'pokoj', nazev: '🧸 Dětský pokoj', soubor: 'pokoj_detsky.webp', plochy: [[[0.02, 0.17], [0.4, 0.17], [0.4, 0.97], [0.02, 0.97]], [[0.4, 0.45], [0.98, 0.45], [0.98, 0.97], [0.4, 0.97]], [[0.52, 0.17], [0.98, 0.17], [0.98, 0.45], [0.52, 0.45]]] },
    { id: 'zahrada', typ: 'pokoj', nazev: '🌿 Zimní zahrada', soubor: 'pokoj_zahrada.webp', plochy: [[[0.02, 0.05], [0.2, 0.05], [0.2, 0.97], [0.02, 0.97]], [[0.2, 0.38], [0.98, 0.38], [0.98, 0.97], [0.2, 0.97]]] },
    { id: 'puda', typ: 'pokoj', nazev: '🕯️ Půda', soubor: 'pokoj_puda.webp', plochy: [[[0.02, 0.1], [0.42, 0.1], [0.42, 0.97], [0.02, 0.97]], [[0.42, 0.42], [0.98, 0.42], [0.98, 0.97], [0.42, 0.97]], [[0.6, 0.1], [0.98, 0.1], [0.98, 0.42], [0.6, 0.42]]] },
    { id: 'kulecnik', typ: 'pokoj', nazev: '🎱 Kuřácký salon', soubor: 'pokoj_kulecnik.webp', plochy: [[[0.02, 0.17], [0.46, 0.17], [0.46, 0.97], [0.02, 0.97]], [[0.46, 0.45], [0.98, 0.45], [0.98, 0.97], [0.46, 0.97]], [[0.65, 0.17], [0.98, 0.17], [0.98, 0.45], [0.65, 0.45]]] },
    { id: 'hudebni', typ: 'pokoj', nazev: '🎻 Hudební salon', soubor: 'pokoj_hudebni.webp', plochy: [[[0.02, 0.17], [0.37, 0.17], [0.37, 0.97], [0.02, 0.97]], [[0.37, 0.42], [0.98, 0.42], [0.98, 0.97], [0.37, 0.97]], [[0.65, 0.17], [0.98, 0.17], [0.98, 0.42], [0.65, 0.42]]] },
    { id: 'koupelna', typ: 'pokoj', nazev: '🛁 Koupelna', soubor: 'pokoj_koupelna.webp', plochy: [[[0.02, 0.06], [0.7, 0.06], [0.7, 0.97], [0.02, 0.97]], [[0.7, 0.42], [0.98, 0.42], [0.98, 0.97], [0.7, 0.97]], [[0.8, 0.06], [0.98, 0.06], [0.98, 0.42], [0.8, 0.42]]] },
    { id: 'kabinet', typ: 'pokoj', nazev: '🦋 Kabinet kuriozit', soubor: 'pokoj_kabinet.webp', plochy: [[[0.02, 0.12], [0.76, 0.12], [0.76, 0.97], [0.02, 0.97]], [[0.76, 0.42], [0.98, 0.42], [0.98, 0.97], [0.76, 0.97]], [[0.85, 0.12], [0.98, 0.12], [0.98, 0.42], [0.85, 0.42]]] },
    { id: 'hala', typ: 'pokoj', nazev: '🕰️ Vstupní hala', soubor: 'pokoj_hala.webp', plochy: [[[0.02, 0.12], [0.35, 0.12], [0.35, 0.97], [0.02, 0.97]], [[0.35, 0.6], [0.98, 0.6], [0.98, 0.97], [0.35, 0.97]], [[0.47, 0.25], [0.98, 0.25], [0.98, 0.6], [0.47, 0.6]], [[0.47, 0.12], [0.7, 0.12], [0.7, 0.25], [0.47, 0.25]]] },
  ];
  const typScen = rezim => REZIMY[rezim].pokoj ? 'pokoj' : 'venku';
  const scenyRezimu = rezim => SCENY.filter(s => (s.typ || 'venku') === typScen(rezim));
  // vyska = medián výšky postavy jako podíl výšky scény (dole o 20 % víc, nahoře o 20 % míň)
  // lide = další hledané postavy, veci = hledané věci/zvířata (mix = jejich počet v Mixu), vypln = věci a zvířata navíc jako vata
  // pokoj: hledat = délka seznamu, polozit = kolik předmětů leží v pokoji (zbytek mate), vel = výška předmětu
  // jako podíl výšky scény, sila = jak moc se barvy předmětu přizpůsobí okolí (0–1), uhel = max. natočení (rad),
  // kandidatu = z kolika možných míst se vybere to, kde předmět nejvíc splývá, kryti = jak velkou část předmětu
  // smí zakrýt scéna (zastrčení za polštář, knihu…)
  const OBTIZNOSTI = {
    lehka: { nazev: 'Lehká', pocet: 110, vyska: .085, navnady: 0, lide: 0, veci: 5, mix: 2, vypln: 8,
      pokoj: { hledat: 8, polozit: 20, vel: .07, sila: .35, uhel: .35, kandidatu: 1, kryti: 0 } },
    stredni: { nazev: 'Střední', pocet: 220, vyska: .066, navnady: 8, lide: 2, veci: 8, mix: 3, vypln: 16,
      pokoj: { hledat: 12, polozit: 30, vel: .052, sila: .55, uhel: .8, kandidatu: 5, kryti: .25 } },
    tezka: { nazev: 'Těžká', pocet: 360, vyska: .054, navnady: 18, lide: 4, veci: 12, mix: 4, vypln: 26,
      pokoj: { hledat: 18, polozit: 42, vel: .04, sila: .72, uhel: 1.6, kandidatu: 12, kryti: .4 } },
    mistr: { nazev: 'Mistr', pocet: 460, vyska: .047, navnady: 26, lide: 6, veci: 16, mix: 6, vypln: 36,
      pokoj: { hledat: 24, polozit: 56, vel: .034, sila: .86, uhel: Math.PI, kandidatu: 20, kryti: .5 } },
  };
  // co se hledá: vali = Vali je 1. cíl, lide/veci = počty podle obtížnosti, druhy = odkud se berou hledané věci
  const REZIMY = {
    vali: { nazev: '🧍 Vali a lidé', vali: true, lide: o => o.lide, veci: () => 0, druhy: [] },
    veci: { nazev: '🔑 Ztracené věci', vali: false, lide: () => 0, veci: o => o.veci, druhy: ['vec'] },
    zvirata: { nazev: '🐾 Zvířátka', vali: false, lide: () => 0, veci: o => o.veci, druhy: ['zvire'] },
    mix: { nazev: '🎯 Mix', vali: true, lide: o => o.lide, veci: o => o.mix, druhy: ['vec', 'zvire'] },
    viktor: { nazev: '🕯️ Viktoriánský pokoj', vali: false, pokoj: true, lide: () => 0, veci: o => o.pokoj.hledat, druhy: ['viktor'] },
  };
  const DROBNE = ['vec', 'zvire'];

  function rng(seed) {   // mulberry32
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;

  /* ---- lišta hledaných: obrázky (venku) nebo seznam slov (pokoj) ---- */

  /* ---- kamera ---- */

      VALI.scenyRezimu(rezim).map(s => `<button class="tl" data-scena="${s.id}">${s.nazev}</button>`).join('');
    document.querySelectorAll('[data-obtiznost]').forEach(b => b.setAttribute('aria-current', b.dataset.obtiznost === obtiznost));
    document.querySelectorAll('[data-scena]').forEach(b => b.setAttribute('aria-current', b.dataset.scena === scenaVolba));
    document.querySelectorAll('[data-rezim]').forEach(b => b.setAttribute('aria-current', b.dataset.rezim === rezim));
    document.querySelectorAll('[data-seznam]').forEach(b => b.setAttribute('aria-current', b.dataset.seznam === seznamDruh));
    $('nabSeznam').hidden = !VALI.REZIMY[rezim].pokoj;
  }
  $('nabRezimy').innerHTML = Object.entries(VALI.REZIMY).map(([id, r]) => `<button class="tl" data-rezim="${id}">${r.nazev}</button>`).join('');
  function umisti(n, b) {
    const r = b.getBoundingClientRect();
    n.style.top = (r.bottom + 4) + 'px';
    n.style.left = Math.max(6, Math.min(r.left, innerWidth - n.offsetWidth - 6)) + 'px';
  }

  const stred = () => [platno.clientWidth / 2, platno.clientHeight / 2];
  const PRIKAZY = {
    nova: () => novaHra(),
    napoveda,
    priblizit: () => zoomNa(kam.z * 1.4, ...stred()),
    oddalit: () => zoomNa(kam.z / 1.4, ...stred()),
    cela,
    async sdilej() {
      const url = location.href.split('?')[0].split('#')[0] + '?h=' + VALI.kod(hra);
      try { await navigator.clipboard.writeText(url); hlaska('Odkaz zkopírován – kdo ho otevře, dostane stejnou scénu.', 'ok', 3000); }
      catch { hlaska(url, '', 8000); }
    },
  };
  function zavriNabidky() {
    document.querySelectorAll('.nabidka:not([hidden])').forEach(n => { n.hidden = true; });
    document.querySelectorAll('[data-nabidka][aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }
  document.querySelectorAll('[data-nabidka]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const n = $(b.dataset.nabidka), bylo = !n.hidden;
    zavriNabidky();
    if (bylo) return;
    if (n.id === 'nabPomoc') {
      if (!hra) return;
      n.innerHTML = napovedaHtml();
      const cv = n.querySelector('canvas');
      n.hidden = false;
      if (cv) portret(cv, hra.postavy[hra.cile[0]].s);
    }
    n.hidden = false; b.setAttribute('aria-expanded', 'true');
    umisti(n, b);
  }));
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-prikaz], [data-obtiznost], [data-scena], [data-rezim], [data-seznam]');
    if (b) {
      e.stopPropagation(); zavriNabidky();
      if (b.dataset.seznam) { seznamDruh = b.dataset.seznam; vykresliNabidky(); if (hra) { vykresliCile(); rozmer(); omez(); } return; }
      if (b.dataset.obtiznost) { obtiznost = b.dataset.obtiznost; return novaHra(); }
      if (b.dataset.scena) { scenaVolba = b.dataset.scena; return novaHra(); }
      if (b.dataset.rezim && VALI.REZIMY[b.dataset.rezim].pokoj !== VALI.REZIMY[rezim].pokoj) scenaVolba = 'nahodna';
      if (b.dataset.rezim) { rezim = b.dataset.rezim; return novaHra(); }
      return PRIKAZY[b.dataset.prikaz]();
    }
    if (!e.target.closest('.nabidka')) zavriNabidky();
  });
  addEventListener('resize', () => { zavriNabidky(); rozmer(); omez(); });
  platno.addEventListener('pointerdown', () => { if (!$('pruh').classList.contains('vyhra')) $('pruh').hidden = true; });
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.('input,textarea')) return;
    if (e.key === 'Escape') { zavriNabidky(); $('pruh').hidden = true; return; }
    const krok = 120 / kam.z;
    const akce = {
      '+': PRIKAZY.priblizit, '=': PRIKAZY.priblizit, '-': PRIKAZY.oddalit, '0': cela,
      n: PRIKAZY.nova, h: napoveda, '1': () => { obtiznost = 'lehka'; novaHra(); },
      '2': () => { obtiznost = 'stredni'; novaHra(); }, '3': () => { obtiznost = 'tezka'; novaHra(); },
      '4': () => { obtiznost = 'mistr'; novaHra(); },
      ArrowLeft: () => { kam.x -= krok; omez(); prekresli(); }, ArrowRight: () => { kam.x += krok; omez(); prekresli(); },
      ArrowUp: () => { kam.y -= krok; omez(); prekresli(); }, ArrowDown: () => { kam.y += krok; omez(); prekresli(); },
    }[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (akce) { e.preventDefault(); akce(); }
  });

  // přepnutí tématu: pozadí plátna a barva siluet
  new MutationObserver(() => { if (hra) { vykresliCile(); prekresli(); } })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // čas v liště
  setInterval(() => { if (hra) $('cas').textContent = formatCas(cas()); }, 250);

  /* ---- start ---- */
  nactiAtlas(0).then(() => {
    rozmer();
    novaHra(VALI.zKodu(new URLSearchParams(location.search).get('h')) || undefined);
  }, () => { $('nacitani').textContent = 'Nepodařilo se načíst postavy.'; });
  window.VALI_HRA = {   // pro testy
    stav: () => hra, kam, klik, naSvet,
    celaAlfa: (i, u, v) => { const sp = S[hra.postavy[i].s], D = atl(sp).data; return D.data[((sp.y + v) * D.width + sp.x + u) * 4 + 3]; },
  };
})();
</script>
