<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dešťová voda – odvodnění, nádrž, vsakování</title>
<meta name="description" content="Odvodnění střech (žlaby a svody podle ČSN 75 6760 a ČSN EN 12056-3), návrh akumulační nádrže s denní simulací srážek, vsakovací zařízení podle ČSN 75 9010, retenční nádrž s regulovaným odtokem a úspora vody v Kč. Orientační výpočty se zdroji.">
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../dialog.js"></script>
<script src="../podpis.js" defer></script>
<script src="lib/chart.min.js"></script>
<script src="destova_voda/hd_data.js"></script>
<script src="destova_voda/jadro.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-deep,var(--bg));color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.lista{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.lista::-webkit-scrollbar{display:none}
.lista > *{flex-shrink:0}
.lista h1{font-size:1.02rem;font-weight:600;white-space:nowrap;margin:0 6px 0 0}
.lista .skup{display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:1px 4px 3px;border-radius:9px;background:color-mix(in srgb,var(--bg-control) 45%,transparent);border:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.lista .skup-nazev{font-size:9.5px;line-height:1.25;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);text-align:center;user-select:none}
.lista .skup-tl{display:flex;align-items:center;gap:2px}
.samostatne .lista{padding-right:72px}
.tl{background:var(--bg-control);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:.84rem;white-space:nowrap;font-family:inherit;line-height:1.3}
.tl:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.tl:focus-visible,.btn:focus-visible,.vstup:focus{outline:2px solid var(--accent);outline-offset:1px}
.tl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
select.tl{padding:4px 6px;max-width:190px}
@media (max-width:1150px){.lista .txt{display:none}}
.nabidka{position:fixed;z-index:60;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:250px;max-height:calc(100vh - 70px);overflow-y:auto}
.nabidka .tl{display:flex;align-items:center;gap:6px;text-align:left;background:none;border-color:transparent;padding:6px 10px}
.nabidka .tl:hover{background:var(--bg-hover)}
.nabidka hr{border:0;border-top:1px solid var(--border);margin:4px 0}
[hidden]{display:none !important}

.btn{background:var(--bg-control);color:var(--text);border:1px solid var(--border-strong);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:.84rem;font-family:inherit}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.mini{padding:3px 8px;font-size:.78rem}
.btn.danger{color:var(--danger)}
.vstup{background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:.86rem;font-family:inherit;min-width:0;width:100%}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}

main{flex:1;min-height:0;overflow:auto;padding:12px clamp(10px,2.5vw,24px) 40px}
.obal{max-width:1200px;margin:0 auto;display:grid;gap:12px}
.karta{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius,8px);padding:12px 14px;min-width:0}
.karta h2{font-size:1rem;margin:0 0 8px}
.karta h3{font-size:.9rem;margin:12px 0 6px}
.pole-mriz{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 12px}
.pole{display:grid;gap:3px;font-size:.78rem;color:var(--text-muted);align-content:start}
.pole .vstup{color:var(--text)}
.pole.zaskrt{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--text)}
.napoveda{font-size:.76rem;color:var(--text-faint);line-height:1.4}
.info{font-size:.82rem;line-height:1.5;background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;color:var(--text-muted);margin:8px 0}
.info.varovani{border-left-color:var(--warn)}
.info.chyba{border-left-color:var(--danger)}
.info.ok{border-left-color:var(--ok)}
.souhrn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.dlazdice{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.dlazdice b{display:block;font-size:1.3rem;line-height:1.15}
.dlazdice span{font-size:.75rem;color:var(--text-muted)}
.dlazdice.ok b{color:var(--ok)} .dlazdice.spatne b{color:var(--danger)} .dlazdice.pozor b{color:var(--warn)}
.tab-obal{overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--text-muted);font-weight:600;font-size:.74rem;background:var(--bg-elevated)}
td.c,th.c{text-align:right;white-space:nowrap}
tr.max td{font-weight:700;background:var(--accent-soft)}
td .vstup{padding:4px 6px;font-size:.82rem}
.plochy td:nth-child(1){min-width:120px} .plochy td:nth-child(3){min-width:200px} .plochy td:nth-child(4){min-width:96px}
.plochy td input[type=number]{width:80px}
.graf{position:relative;height:260px;margin:8px 0}
.vysledky-geo{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dva{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
details summary{cursor:pointer;color:var(--accent);font-size:.84rem;margin:6px 0}
a{color:var(--accent)}
.zdroje li{margin:4px 0;line-height:1.45;font-size:.86rem}
.tisk-jen{display:none}
@media print{
  .lista,.nepis,#podpis-pruh,.graf{display:none!important}
  .tisk-jen{display:block}
  body{display:block;height:auto;background:#fff;color:#000}
  main{overflow:visible;padding:0}
  .karta,.info,.dlazdice{background:#fff;border-color:#999;break-inside:avoid}
  a{color:#000}
}
</style>
</head>
<body>
<header class="lista" id="lista">
  <h1>🌧️ Dešťová voda</h1>
  <div class="skup" role="group" aria-label="Projekt"><span class="skup-nazev" aria-hidden="true">Projekt</span><div class="skup-tl">
    <select class="tl" id="vyberProjektu" aria-label="Projekt"></select>
    <button class="tl" data-nabidka="nabSoubor" aria-expanded="false" title="Projekty, záloha, tisk">📁<span class="txt"> Soubor</span> ▾</button>
  </div></div>
  <div class="skup" role="group" aria-label="Výpočet"><span class="skup-nazev" aria-hidden="true">Výpočet</span><div class="skup-tl">
    <button class="tl" data-pohled="plochy" aria-pressed="true">🏠<span class="txt"> Plochy &amp; žlaby</span></button>
    <button class="tl" data-pohled="nadrz" aria-pressed="false">🛢️<span class="txt"> Akumulace</span></button>
    <button class="tl" data-pohled="vsak" aria-pressed="false">🕳️<span class="txt"> Vsakování</span></button>
    <button class="tl" data-pohled="retence" aria-pressed="false">⏳<span class="txt"> Retence</span></button>
    <button class="tl" data-pohled="uspora" aria-pressed="false">💰<span class="txt"> Úspora</span></button>
  </div></div>
  <div class="skup" role="group" aria-label="Výstup"><span class="skup-nazev" aria-hidden="true">Výstup</span><div class="skup-tl">
    <button class="tl" data-pohled="protokol" aria-pressed="false">📋<span class="txt"> Protokol</span></button>
    <button class="tl" data-pohled="zdroje" aria-pressed="false">📚<span class="txt"> Zdroje</span></button>
  </div></div>
</header>

<div id="nabSoubor" class="nabidka" hidden>
  <button class="tl" data-prikaz="novy">✚ Nový projekt</button>
  <button class="tl" data-prikaz="duplikovat">⧉ Duplikovat projekt</button>
  <button class="tl" data-prikaz="prejmenovat">✏️ Přejmenovat…</button>
  <button class="tl" data-prikaz="smazat">🗑️ Smazat projekt…</button>
  <hr>
  <button class="tl" data-prikaz="tisk">🖨️ Tisk protokolu</button>
  <button class="tl" data-prikaz="export">💾 Záloha všech projektů (JSON)</button>
  <button class="tl" data-prikaz="import">📂 Obnovit ze zálohy…</button>
</div>
<input type="file" id="souborImport" accept=".json,application/json" hidden>
<input type="file" id="souborCsv" accept=".csv,.txt,text/csv,text/plain" hidden>

<main><div class="obal" id="obsah"></div></main>

<script>
(function () {
'use strict';
const J = window.DestJadro;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const f = J.fmt;
const cz = x => String(x).replace('.', ',');
if (window.self === window.top) document.body.classList.add('samostatne');

let data;
try { data = J.migruj(JSON.parse(localStorage.getItem(J.KLIC))); } catch (e) { data = J.prazdna(); }
let pohled = 'plochy';
try { pohled = localStorage.getItem(J.KLIC + '_pohled') || 'plochy'; } catch (e) {}
const pr = () => data.projekty.find(p => p.id === data.aktivni);

function uloz() {
  pr().zmeneno = new Date().toISOString().slice(0, 10);
  try { localStorage.setItem(J.KLIC, JSON.stringify(data)); }
  catch (e) { Dialog.chyba('Data se nepodařilo uložit (plné úložiště?)'); }
}

/* ---------- vazba polí na projekt: data-k="sekce.klic" ---------- */
const NULOVATELNE = new Set(['vsak.Avsak', 'nadrz.uhrn']);
const TEXTOVE = new Set(['lokalita.nazev', 'poznamka', 'odvodneni.rezim', 'odvodneni.p', 'vsak.p', 'vsak.typ', 'retence.umisteni', 'retence.rezim', 'uspora.cena', 'vsak.test.tvar']);
function ziskej(cesta) { return cesta.split('.').reduce((o, k) => o == null ? o : o[k], pr()); }
function nastav(cesta, v) {
  const c = cesta.split('.'), posl = c.pop();
  const o = c.reduce((x, k) => x[k], pr());
  o[posl] = v;
}
function hodnotaPole(el) {
  const k = el.dataset.k;
  if (el.type === 'checkbox') return el.checked;
  if (TEXTOVE.has(k)) return el.value;
  if (el.value.trim() === '' && NULOVATELNE.has(k)) return null;
  const n = J.cislo(el.value, NaN);
  return Number.isFinite(n) ? n : undefined;
}
const pole = (k, popis, o) => {
  o = o || {};
  const v = ziskej(k);
  const typ = o.text ? 'text' : 'text" inputmode="decimal';
  return `<label class="pole">${popis}<input class="vstup" data-k="${k}" type="${typ}" value="${esc(v == null ? '' : (k === 'vsak.kv' ? Number(v).toExponential() : String(v)).replace('.', ','))}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}>${o.pozn ? `<span class="napoveda">${o.pozn}</span>` : ''}</label>`;
};
const vyber = (k, popis, moznosti, pozn) => `<label class="pole">${popis}<select class="vstup" data-k="${k}">${moznosti.map(([h, t]) => `<option value="${esc(h)}"${String(ziskej(k)) === String(h) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>${pozn ? `<span class="napoveda">${pozn}</span>` : ''}</label>`;
const zaskrt = (k, popis) => `<label class="pole zaskrt"><input type="checkbox" data-k="${k}"${ziskej(k) ? ' checked' : ''}> ${popis}</label>`;
const dl = (hodnota, popis, tr) => `<div class="dlazdice ${tr || ''}"><b>${hodnota}</b><span>${popis}</span></div>`;
const stanice = (i) => { const s = J.HD.stanice[i]; return `${s.misto} (${s.vyska} m n. m.)`; };
const stanMoznosti = () => J.HD.stanice.map((s, i) => [i, stanice(i)]);

/* ---------- grafy ---------- */
const grafy = {};
function barvy() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return { text: v('--text-muted'), mrizka: v('--border'), accent: v('--accent'), ok: v('--ok'), warn: v('--warn'), danger: v('--danger') };
}
function graf(id, cfg) {
  if (grafy[id]) { grafy[id].destroy(); delete grafy[id]; }
  const c = $(id); if (!c || !window.Chart) return;
  const b = barvy();
  Chart.defaults.color = b.text; Chart.defaults.borderColor = b.mrizka; Chart.defaults.font.family = 'system-ui,sans-serif';
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { labels: { boxWidth: 12 } } } }, cfg.options || {});
  grafy[id] = new Chart(c, typeof cfg.data === 'function' ? Object.assign(cfg, { data: cfg.data(b) }) : cfg);
}

/* ---------- 🏠 Plochy & žlaby ---------- */
function htmlLokalita() {
  const l = pr().lokalita;
  return `<section class="karta"><h2>📍 Lokalita</h2>
    <div class="pole-mriz">
      <label class="pole">Obec / místo<span style="display:flex;gap:4px"><input class="vstup" data-k="lokalita.nazev" value="${esc(l.nazev)}" placeholder="např. Tábor"><button class="btn nepis" data-prikaz="hledatMisto" title="Najít souřadnice a nadmořskou výšku (Open-Meteo)">🔍</button></span>
        <span class="napoveda">${l.lat != null ? `${l.lat.toFixed(3)}° s. š., ${l.lon.toFixed(3)}° v. d.` : 'Souřadnice nejsou zadané (potřebné jen pro stažení srážek).'}</span></label>
      ${pole('lokalita.vyska', 'Nadmořská výška [m n. m.]', { pozn: 'Pro roční úhrn srážek podle TP 1.20 tab. 6.' })}
      ${vyber('lokalita.stanice', 'Stanice návrhových úhrnů srážek', stanMoznosti(), 'Zvolte nejbližší stanici s podobnou nadmořskou výškou (ČKAIT TP 1.20 tab. 2 a 3). Nad 700 m n. m. zjišťovat individuálně.')}
    </div>
    <div class="vysledky-geo nepis" id="geoVysledky"></div></section>`;
}
function htmlPlochy() {
  const p = pr();
  const radky = p.plochy.map(pl => {
    const d = J.DRUH[pl.druh];
    return `<tr data-pl="${pl.id}"><td><input class="vstup" data-f="nazev" value="${esc(pl.nazev)}" aria-label="Název plochy"></td>
      <td><input class="vstup" data-f="A" type="number" min="0" step="any" value="${pl.A}" aria-label="Půdorys m²"></td>
      <td><select class="vstup" data-f="druh" aria-label="Druh plochy">${J.DRUHY.map(x => `<option value="${x.id}"${x.id === pl.druh ? ' selected' : ''}>${esc(x.nazev)}</option>`).join('')}</select></td>
      <td><select class="vstup" data-f="sklon" aria-label="Sklon">${J.SKLONY.map(x => `<option value="${x.id}"${x.id === pl.sklon ? ' selected' : ''}>${x.nazev}</option>`).join('')}</select></td>
      <td class="c">${J.souC(pl).toLocaleString('cs-CZ')} / ${J.souPsi(pl).toLocaleString('cs-CZ')} / ${d.psiD ? J.souPsiD(pl).toLocaleString('cs-CZ') : '–'}</td>
      <td><input type="checkbox" data-f="nadrz"${pl.nadrz && d.psiD ? ' checked' : ''}${d.psiD ? '' : ' disabled'} aria-label="Do nádrže"></td>
      <td><input type="checkbox" data-f="vsak"${pl.vsak ? ' checked' : ''} aria-label="Do vsaku a retence"></td>
      <td>${d.strecha ? `<input class="vstup" data-f="svody" type="number" min="1" step="1" value="${pl.svody}" aria-label="Počet svodů">` : ''}</td>
      <td>${d.strecha ? `<input class="vstup" data-f="delka" type="number" min="0" step="any" value="${pl.delka || ''}" aria-label="Délka žlabu m">` : ''}</td>
      <td class="nepis"><button class="btn mini danger" data-prikaz="smazPlochu" data-id="${pl.id}" title="Odebrat plochu" aria-label="Odebrat plochu">✕</button></td></tr>`;
  }).join('');
  return `<section class="karta"><h2>🏠 Odvodňované plochy</h2>
    <div class="tab-obal"><table class="plochy"><thead><tr><th>Název</th><th>Půdorys [m²]</th><th>Druh povrchu</th><th>Sklon</th><th class="c" title="C pro odvodnění (ČSN 75 6760) / ψ pro vsak a retenci (TP 1.20 tab. 4) / ψd pro nádrž (TP 1.20 tab. 8)">C / ψ / ψ<sub>d</sub></th><th title="Svádí se do akumulační nádrže">Nádrž</th><th title="Počítá se do vsakování a retence">Vsak</th><th title="Počet svodů (střechy)">Svodů</th><th title="Délka žlabu [m] (volitelné)">Žlab [m]</th><th class="nepis"></th></tr></thead><tbody>${radky}</tbody></table></div>
    <button class="btn nepis" data-prikaz="pridejPlochu">✚ Přidat plochu</button>
    <p class="napoveda">Plocha = půdorysný průmět (ne plocha šikmé střechy); vliv větru se v ČR nezohledňuje (ČSN 75 6760). C – součinitel odtoku ČSN 75 6760:2014 tab. 8; ψ – TP 1.20 tab. 4 (ČSN 75 9010); ψ<sub>d</sub> – součinitel využití srážkové vody, TP 1.20 tab. 8 (DIN 1989-1).</p>
  </section>
  <section class="karta"><h2>🌀 Žlaby a svody</h2>
    <div class="pole-mriz">
      ${vyber('odvodneni.rezim', 'Návrhová intenzita deště', [['csn', 'ČSN 75 6760: 0,03 l/(s·m²) pro celou ČR'], ['stanice', 'z 5min úhrnu zvolené stanice'], ['vlastni', 'vlastní hodnota']])}
      ${pr().odvodneni.rezim === 'stanice' ? vyber('odvodneni.p', 'Periodicita', [['0.2', 'p = 0,2 (1× za 5 let)'], ['0.1', 'p = 0,1 (1× za 10 let)']]) : ''}
      ${pr().odvodneni.rezim === 'vlastni' ? pole('odvodneni.i', 'Intenzita i [l/(s·m²)]', { pozn: 'Statistické údaje lokality (ČSN EN 12056-3 čl. 4.2).' }) : ''}
      ${vyber('odvodneni.k', 'Součinitel bezpečnosti (ČSN EN 12056-3)', J.BEZPECNOST.map(b => [b.k, b.nazev]))}
    </div>
    <div id="vysOdv"></div>
  </section>`;
}
function vysOdvodneni() {
  const p = pr(), i = J.intenzita(p), k = p.odvodneni.k;
  const strechy = p.plochy.filter(pl => J.DRUH[pl.druh].strecha);
  let h = `<p class="info">Odtok Q = i · A · C · k = <b>${f(i, 4)} l/(s·m²)</b>${k !== 1 ? ` × ${String(k).replace('.', ',')}` : ''} · A · C. Půlkruhový žlab: Q<sub>L</sub> = 0,9 · 2,78·10⁻⁵ · A<sub>E</sub><sup>1,25</sup> (ČSN EN 12056-3, krátký žlab, bez příznivého vlivu sklonu). Svod: Q<sub>RWP</sub> = 2,5·10⁻⁴ · k<sub>b</sub><sup>−0,167</sup> · d<sub>i</sub><sup>2,667</sup> · f<sup>1,667</sup>, k<sub>b</sub> = 0,25 mm, f = 0,33.</p>`;
  if (!strechy.length) return h + '<p class="info varovani">Žádná střecha – přidejte plochu druhu „Střecha…“.</p>';
  h += `<div class="tab-obal"><table><thead><tr><th>Střecha</th><th class="c">A [m²]</th><th class="c">Q [l/s]</th><th class="c">Svodů</th><th class="c">Q na svod</th><th class="c">Žlab ø [mm]</th><th class="c">kapacita</th><th class="c">Svod d<sub>i</sub> [mm]</th><th class="c">kapacita</th></tr></thead><tbody>`;
  const pozn = [];
  for (const pl of strechy) {
    const o = J.navrhOdvodneni(pl, i, k);
    h += `<tr><td>${esc(pl.nazev)}</td><td class="c">${f(pl.A, 1)}</td><td class="c">${f(o.Q, 2)}</td><td class="c">${pl.svody}</td><td class="c">${f(o.Qs, 2)}</td>
      <td class="c">${o.zlab ? '≥ ' + o.zlab : '<b style="color:var(--danger)">> ' + J.ZLABY[J.ZLABY.length - 1] + '</b>'}</td><td class="c">${o.zlab ? f(o.kapZlab, 2) + ' l/s' : '–'}</td>
      <td class="c">${o.svod ? '≥ ' + o.svod : '<b style="color:var(--danger)">> ' + J.SVODY[J.SVODY.length - 1] + '</b>'}</td><td class="c">${o.svod ? f(o.kapSvod, 2) + ' l/s' : '–'}</td></tr>`;

/* ---------- 💰 Úspora ---------- */
function vyuzitiVody(p) {
  if (p.srazky) { const s = J.simuluj(p, p.nadrz.objem, p.srazky); return { budova: s.vyuzBudova, zalivka: s.vyuzZalivka, zdroj: `denní simulace, nádrž ${f(p.nadrz.objem, 1)} m³` }; }
  const b = J.mesicniBilance(p), n = p.nadrz; let bu = 0, za = 0;
  b.rady.forEach(r => { const vyuz = Math.min(r.pritok, r.potreba), pd = J.potrebaDen(n, r.mesic); if (pd.celkem > 0) { bu += vyuz * pd.budova / pd.celkem; za += vyuz * pd.zalivka / pd.celkem; } });
  return { budova: bu, zalivka: za, zdroj: 'měsíční bilance bez simulace (horní odhad – předpokládá dost velkou nádrž)' };
}

function obnovVyber() {

}
function vykresli() {

  document.querySelectorAll('[data-pohled]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pohled === pohled)));

/* ---------- příkazy ---------- */
function stahni(jmeno, obsah, typ) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([obsah], { type: typ }));
  a.download = jmeno; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function nactiJson(url) {
  let odp;
  try { odp = await fetch(url); } catch (e) { throw new Error('Služba není dostupná (offline nebo blokovaná síť).'); }
  if (!odp.ok) throw new Error('Služba vrátila chybu ' + odp.status + '.');
  return odp.json();
}
const PRIKAZY = {
  novy: async () => { const n = await Dialog.zeptej('Název projektu', 'Nový projekt'); if (n == null) return; const p = J.novyProjekt(n.trim() || 'Nový projekt'); data.projekty.push(p); data.aktivni = p.id; uloz(); obnovVyber(); vykresli(); },
  duplikovat: () => { const p = J.normProjekt(JSON.parse(JSON.stringify(pr()))); p.id = J.novyId(); p.nazev += ' (kopie)'; data.projekty.push(p); data.aktivni = p.id; uloz(); obnovVyber(); vykresli(); },
  prejmenovat: async () => { const n = await Dialog.zeptej('Nový název projektu', pr().nazev); if (!n || !n.trim()) return; pr().nazev = n.trim().slice(0, 100); uloz(); obnovVyber(); if (pohled === 'protokol') vykresli(); },
  smazat: async () => {
    if (!await Dialog.potvrd(`Smazat projekt „${pr().nazev}“?`)) return;
    data.projekty = data.projekty.filter(p => p.id !== data.aktivni);
    if (!data.projekty.length) data.projekty.push(J.novyProjekt('Můj dům'));
    data.aktivni = data.projekty[0].id; uloz(); obnovVyber(); vykresli();
  },
  tisk: () => { pohled = 'protokol'; vykresli(); setTimeout(() => print(), 50); },
  export: () => stahni('destova-voda-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(data), 'application/json'),
  import: () => $('souborImport').click(),
  pridejPlochu: () => { pr().plochy.push(J.novaPlocha({ nazev: 'Plocha ' + (pr().plochy.length + 1), A: 20 })); uloz(); vykresli(); },
  smazPlochu: (b) => { pr().plochy = pr().plochy.filter(x => x.id !== b.dataset.id); uloz(); vykresli(); },
  hledatMisto: async () => {
    const q = pr().lokalita.nazev.trim();
    if (q.length < 2) return Dialog.info('Napište název obce.');
    const box = $('geoVysledky'); box.textContent = 'Hledám…';
    try {
      const js = await nactiJson('https://geocoding-api.open-meteo.com/v1/search?count=8&language=cs&countryCode=CZ&name=' + encodeURIComponent(q));
      const r = js.results || [];
      box.innerHTML = r.length ? r.map((x, k) => `<button class="btn mini" data-prikaz="vyberMisto" data-k2="${k}">${esc(x.name)}${x.admin2 ? ', ' + esc(x.admin2) : ''} (${Math.round(x.elevation || 0)} m)</button>`).join('') + '<span class="napoveda">Open-Meteo Geocoding, data GeoNames (CC BY 4.0)</span>' : 'Nic nenalezeno.';
      box._vysledky = r;
    } catch (e) { box.textContent = ''; Dialog.chyba('Hledání místa selhalo: ' + e.message); }
  },
  vyberMisto: (b) => {
    const x = $('geoVysledky')._vysledky[+b.dataset.k2], l = pr().lokalita;
    l.nazev = x.name + (x.admin2 ? ', ' + x.admin2 : ''); l.lat = x.latitude; l.lon = x.longitude; if (x.elevation != null) l.vyska = Math.round(x.elevation);
    uloz(); vykresli();
  },
  stahniSrazky: async (b) => {
    const l = pr().lokalita;
    if (l.lat == null) { pohled = 'plochy'; vykresli(); return Dialog.info('Nejdřív najděte lokalitu (🔍 u názvu obce).'); }
    const o = J.obdobiOpenMeteo();
    b.disabled = true; b.textContent = '⏳ Stahuji…';
    try {
      const js = await nactiJson(`https://archive-api.open-meteo.com/v1/archive?latitude=${l.lat}&longitude=${l.lon}&start_date=${o.od}&end_date=${o.do}&daily=precipitation_sum&timezone=Europe%2FPrague`);
      pr().srazky = J.zOpenMeteo(js, l.lat, l.lon); uloz(); vykresli();
      Dialog.info('Staženo ' + pr().srazky.mm.length + ' dní srážek.');
    } catch (e) { Dialog.chyba('Stažení srážek selhalo: ' + e.message); vykresli(); }
  },
  nactiCsv: () => $('souborCsv').click(),
  odeberSrazky: async () => { if (await Dialog.potvrd('Odebrat denní řadu srážek z projektu?')) { pr().srazky = null; uloz(); vykresli(); } },
  pouzijKv: (b) => { pr().vsak.kv = +(+b.dataset.kv).toPrecision(3); uloz(); vykresli(); }
};
$('souborCsv').onchange = async e => {
  const soubor = e.target.files[0]; e.target.value = '';
  if (!soubor) return;
  try { pr().srazky = J.zCsv(await soubor.text()); pr().srazky.zdroj = 'CSV: ' + soubor.name; uloz(); vykresli(); }
  catch (er) { Dialog.chyba('CSV se nepodařilo načíst: ' + er.message); }
};
$('souborImport').onchange = async e => {
  const soubor = e.target.files[0]; e.target.value = '';
  if (!soubor) return;
  let d; try { d = JSON.parse(await soubor.text()); } catch (er) { return Dialog.chyba('Soubor není platný JSON.'); }
  if (!d || !Array.isArray(d.projekty)) return Dialog.chyba('Tohle není záloha Dešťové vody.');
  if (!await Dialog.potvrd(`Záloha obsahuje ${d.projekty.length} projektů. Přidat je k současným?`)) return;
  const m = J.migruj(d);
  for (const p of m.projekty) { if (data.projekty.some(x => x.id === p.id)) p.id = J.novyId(); data.projekty.push(p); }
  data.aktivni = m.projekty[0].id; uloz(); obnovVyber(); vykresli(); Dialog.info('Načteno.');
};

function zavriNabidky() {
  document.querySelectorAll('.nabidka:not([hidden])').forEach(n => { n.hidden = true; });
  document.querySelectorAll('[data-nabidka][aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
document.querySelectorAll('[data-nabidka]').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  const n = $(b.dataset.nabidka), bylo = !n.hidden;
  zavriNabidky(); if (bylo) return;
  n.hidden = false; b.setAttribute('aria-expanded', 'true');
  const r = b.getBoundingClientRect();
  n.style.top = (r.bottom + 4) + 'px';
  n.style.left = Math.max(6, Math.min(r.left, innerWidth - n.offsetWidth - 6)) + 'px';
}));
document.addEventListener('click', e => {
  const p = e.target.closest('[data-prikaz]');
  if (p) { e.preventDefault(); zavriNabidky(); return PRIKAZY[p.dataset.prikaz](p); }
  if (!e.target.closest('.nabidka')) zavriNabidky();
  const pv = e.target.closest('[data-pohled]');
  if (pv) { pohled = pv.dataset.pohled; try { localStorage.setItem(J.KLIC + '_pohled', pohled); } catch (er) {} vykresli(); }
});
// změny polí: hodnoty uložit a přepočítat výsledky; u voleb, které mění formulář, překreslit celé
const PREKRESLI = new Set(['odvodneni.rezim', 'retence.zPloch', 'retence.rezim', 'uspora.cena', 'vsak.test.tvar', 'lokalita.vyska']);
function zmena(e, konec) {
  const el = e.target;
  if (el.dataset.k) {
    const v = hodnotaPole(el);
    if (v === undefined) return;
    nastav(el.dataset.k, v);
    // normalizace (meze) přes jádro, aby uložené hodnoty byly platné
    const n = J.normProjekt(pr()); Object.assign(pr(), n);
    uloz();
    if (PREKRESLI.has(el.dataset.k) && konec) return vykresli();
    if (el.dataset.k === 'nadrz.uhrn' && konec) return vykresli();
    return prepocti();
  }
  const tr = el.closest('[data-pl]');
  if (tr && el.dataset.f) {
    const pl = pr().plochy.find(x => x.id === tr.dataset.pl); if (!pl) return;
    const k = el.dataset.f;
    pl[k] = el.type === 'checkbox' ? el.checked : (k === 'nazev' || k === 'druh' || k === 'sklon') ? el.value : J.cislo(el.value, pl[k]);
    Object.assign(pl, J.novaPlocha(pl));
    uloz();
