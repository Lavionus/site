<!DOCTYPE html>
<html lang="cs">
<head>
<!-- Univerzální čtečka knih: vlastní knihovna (MD, TXT, EPUB, MOBI) v IndexedDB.
     ctecka_knih.html = správce knihovny, ctecka_knih.html?id=<kniha> = čtení ve společné čtečce (obsah/ctecka/).
     Logika: ctecka/knihovna.js (úložiště, správce, spuštění čtečky), převod formátů ctecka/prevod.js. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Čtečka knih – moje knihovna</title>
<meta name="description" content="Univerzální čtečka e-knih v prohlížeči: nahrajte EPUB, MOBI, Markdown nebo TXT a čtěte s obsahem, hledáním, záložkami, poznámkami, předčítáním a motivy čtení. Knihovna s pokrokem čtení, vše jen ve vašem zařízení.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Čtečka">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="ctecka/ctecka.css">
<script src="../theme.js"></script>
<script src="../dialog.js"></script>
<script src="../podpis.js" defer></script>
<script src="ctecka/jadro.js"></script>
<script src="ctecka/prevod.js"></script>
<script src="ctecka/knihovna_data.js"></script>
<!-- Čtečka (sablona.js, ctecka.js, piper.js) se načítá až za běhu z knihovna.js; tyto odkazy se nespouštějí,
     jen říkají nástrojům překladu (_test/i18n_*), které sdílené moduly stránka používá. -->
<script type="text/plain" src="ctecka/sablona.js"></script>
<script type="text/plain" src="ctecka/ctecka.js"></script>
<script type="text/plain" src="ctecka/piper.js"></script>
<style>
  .knihovna{flex:1;overflow-y:auto;padding:14px clamp(10px,3vw,28px) 40px}
  .knihovna .uvod{max-width:640px;margin:8vh auto;text-align:center;color:var(--text-muted);line-height:1.6}
  .knihovna .uvod h2{color:var(--text);font-size:1.3rem}
  .mrizka{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
  .karta{display:flex;flex-direction:column;gap:6px;min-width:0}
  .obal{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;border:1px solid var(--border);background:var(--bg-elevated);cursor:pointer;box-shadow:var(--shadow);padding:0;font:inherit;color:inherit;width:100%}
  .obal img{width:100%;height:100%;object-fit:cover;display:block}
  .obal .gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px;text-align:center;color:#fff;font-family:Georgia,serif;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .obal .gen b{font-size:1.02rem;line-height:1.25;overflow-wrap:anywhere}
  .obal .gen span{font-size:.8rem;opacity:.9}
  .obal .format{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:.66rem;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
  .obal .znacka-docteno{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:4px}
  .karta.docteno .obal img,.karta.docteno .obal .gen{opacity:.75}
  .karta .akce .tl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
  .tl.filtr-aktivni{border-color:var(--accent)}
  .obal:hover{border-color:var(--accent)}
  .obal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .karta .nazev{font-weight:600;font-size:.9rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .karta .autor,.karta .info{font-size:.78rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pokrok{height:4px;border-radius:2px;background:var(--bg-control);overflow:hidden}
  .pokrok i{display:block;height:100%;background:var(--accent)}
  /* „Číst“ přes celou šířku karty, ikony pod ním – čtyři tlačítka v řadě se do úzké karty nevešla */
  .karta .akce{display:flex;flex-wrap:wrap;gap:4px}
  .karta .akce .tl{flex:1 1 0;min-width:0;padding:3px 4px;font-size:.78rem;text-align:center}
  .karta .akce .tl:first-child{flex:1 0 100%;overflow:hidden;text-overflow:ellipsis}
  .paticka-knihovny{margin-top:28px;font-size:.78rem;color:var(--text-faint);text-align:center}
  body.pretahovani .knihovna{outline:3px dashed var(--accent);outline-offset:-10px}
  .ukol{position:fixed;inset:auto 0 0 0;padding:10px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--bg-panel);border-top:1px solid var(--border);z-index:90;font-size:.88rem}
  .ukol span{max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .karta .serie{font-size:.74rem;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .karta .info .hv,.hv{color:var(--warn,#c90);letter-spacing:1px}
  /* pruh „Pokračovat ve čtení“ */
  .knihovna h2{font-size:.95rem;margin:4px 0 10px;color:var(--text-muted);font-weight:600}
  .knihovna h2 span{font-weight:400;color:var(--text-faint);font-size:.8rem}
  .pokracovat{margin-bottom:22px}
  .pruh{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .rozect{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;color:inherit;font:inherit;min-width:0}
  .rozect:hover{border-color:var(--accent)}
  .rozect .obal.mini{width:52px;flex-shrink:0;box-shadow:none}
  .rozect .obal.mini .gen{padding:3px}.rozect .obal.mini .gen b{font-size:.5rem}.rozect .obal.mini .gen span{display:none}
  .rozect-text{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;font-size:.78rem;color:var(--text-muted)}
  .rozect-text b{color:var(--text);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rozect-text > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .police{margin-bottom:26px}
  /* okna */
  .modal .okno.siroke{max-width:760px}
  .modal h3{font-size:.95rem;margin:16px 0 6px}
  .napoveda{color:var(--text-muted);font-size:.82rem;line-height:1.45}
  .tl.hlavni{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
  .tl.hlavni:hover:not(:disabled){background:var(--accent-hover,var(--accent))}
  .tlacitka{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .web-seznam{display:flex;flex-direction:column;gap:8px}
  .web-kniha{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elevated)}
  .web-kniha > div{min-width:0}
  .uprava{display:flex;gap:16px;flex-wrap:wrap}
  .uprava-obal{display:flex;flex-direction:column;gap:6px;width:130px}
  .uprava-obal .tl{white-space:normal;font-size:.78rem}
  .uprava-obal .obal{cursor:default}
  .uprava-pole{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
  .uprava-pole label,.pole-nazev{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--text-muted)}
  .uprava-pole .dva{display:flex;gap:8px}.uprava-pole .dva label{flex:1}.uprava-pole .dva label.uzke{flex:0 0 90px}
  .hvezdy{display:flex;gap:2px;align-items:center}
  .hvezda{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--border-strong,#888);padding:0 2px}
  .hvezda.plna{color:var(--warn,#e0a800)}
  .hvezdy .tl{margin-left:8px;padding:1px 6px;font-size:.75rem}
  .kap-seznam{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow-y:auto;padding-right:4px}
  .kap-radek{display:flex;gap:6px;align-items:center}
  .kap-radek .vstup{flex:1;min-width:0;padding:3px 7px}
  .kap-c{width:2.2em;text-align:right;color:var(--text-faint);font-size:.8rem}
  .kap-slov{font-size:.74rem;color:var(--text-faint);width:5.5em;text-align:right}
  /* deník */
  .dlazdice{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
  .dlazdice > div{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px}
  .dlazdice b{font-size:1.35rem}.dlazdice span{font-size:.78rem;color:var(--text-muted)}
  .mesice{display:flex;gap:4px;height:110px;align-items:flex-end;padding:0 2px 18px;position:relative}
  .mesic{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative}
  .mesic .sl{width:40%;min-height:1px;border-radius:2px 2px 0 0}
  .sl.knihy,.tecka.knihy{background:var(--accent)}.sl.cas,.tecka.cas{background:color-mix(in srgb,var(--accent) 35%,var(--bg-control))}
  .mesic em{position:absolute;bottom:-17px;font-size:.66rem;color:var(--text-faint);font-style:normal}
  .legenda{display:flex;gap:6px;align-items:center}.tecka{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:8px}
  .denik-tab td{vertical-align:top}.denik-tab td:first-child{white-space:nowrap;color:var(--text-muted)}
  .modal .denik-tab td:last-child{text-align:right}
  .denik-tab .pozn{font-size:.8rem;color:var(--text-muted);font-style:italic;margin-top:2px}
  .cil{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.88rem}
  .obal .format.nova{background:var(--accent);color:var(--on-accent,#fff)}
  .obal .format.chybi{background:rgba(120,0,0,.75)}
  .rozect-text .odhad{color:var(--text-faint)}
  .upozorneni{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:16px;padding:10px 12px;border:1px solid var(--warn,#c90);border-radius:8px;background:var(--bg-elevated);font-size:.86rem;line-height:1.4}
  .upozorneni > span{flex:1 1 260px}
  /* seznam místo mřížky: malá obálka vlevo, údaje uprostřed, tlačítka vpravo */
  .knihovna.seznam .mrizka{grid-template-columns:1fr;gap:8px}
  .knihovna.seznam .karta{display:grid;grid-template-columns:52px minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center;padding:6px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elevated)}
  .knihovna.seznam .karta > *{grid-column:2}
  .knihovna.seznam .karta .obal{grid-column:1;grid-row:1 / span 6;align-self:start;box-shadow:none}
  .knihovna.seznam .obal .gen{padding:3px}.knihovna.seznam .obal .gen b{font-size:.5rem}.knihovna.seznam .obal .gen span,.knihovna.seznam .obal .format,.knihovna.seznam .obal .znacka-docteno{display:none}
  .knihovna.seznam .karta .akce{grid-column:3;grid-row:1 / span 6;flex-wrap:nowrap}
  .knihovna.seznam .karta .akce .tl:first-child{flex:0 0 auto}
  .knihovna.seznam .karta .pokrok{max-width:260px}
  @media (max-width:520px){
    .knihovna.seznam .karta{grid-template-columns:44px minmax(0,1fr)}
    .knihovna.seznam .karta .akce{grid-column:2;grid-row:auto}
  }
  /* telefon: dvě obálky vedle sebe i na 320 px */
  @media (max-width:440px){.mrizka{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .ukol{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  /* jen správce knihovny (body.spravce) – čtečka ?id= má vlastní vzhled v ctecka.css */
  body.spravce .modal .okno{max-height:90vh;max-height:90dvh}
  /* dotyk: větší cíle (karta, nabídky, kapitoly, hvězdičky), písmo polí 16 px – iOS jinak při psaní přiblíží stránku */
  @media (pointer:coarse){
    .karta .akce .tl{min-height:40px;font-size:.9rem}
    .kap-radek .tl{min-width:40px;min-height:40px}
    .hvezda{font-size:1.9rem;padding:0 4px}
    body.spravce .vstup{font-size:16px}
    body.spravce .nabidka .tl{min-height:40px}
  }
</style>
</head>
<body>
<script src="ctecka/knihovna.js"></script>
</body>
</html>
