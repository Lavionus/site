<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přehled aplikací</title>
  <link rel="stylesheet" href="../common.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <style>
    body {
      background-color: var(--bg-deep);
      padding: 28px clamp(16px, 4vw, 48px);
      min-height: 100vh;
    }

    header.uvod {
      margin-bottom: 26px;
    }
    header.uvod h1 {
      font-size: 1.5rem;
      font-weight: 650;
      margin-bottom: 6px;
    }
    header.uvod p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }
    header.uvod .statistika {
      color: var(--text-faint);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    section {
      margin-bottom: 30px;
    }
    section h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .dlazdice {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .dlazdice a {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 14px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      transition: transform 0.12s ease, border-color 0.12s ease, background-color 0.12s ease;
      overflow: hidden;
    }
    .dlazdice a:hover {
      border-color: var(--accent);
      background-color: var(--bg-elevated);
      transform: translateY(-2px);
    }
    .dlazdice .emoji {
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .dlazdice .nazev {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prazdne {
      color: var(--text-faint);
      font-size: 0.85rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .tip {
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(120deg, var(--accent-soft), transparent 70%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .tip .emoji { font-size: 1.8rem; }
    .tip .text b { display: block; margin-bottom: 3px; }
    .tip .text span { color: var(--text-muted); font-size: 0.85rem; }
    .tip a.otevrit {
      margin-left: auto;
      flex-shrink: 0;
      background-color: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
    }
    .tip a.otevrit:hover { background-color: var(--accent-hover); }

    /* Odkaz na samostatný vzdělávací web */
    .nodus {
      display: flex;
      align-items: center;
      gap: 14px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px 18px;
      flex-wrap: wrap;
    }
    .nodus .znak { width: 2rem; height: auto; fill: var(--accent); flex-shrink: 0; }
    .nodus .text b { display: block; margin-bottom: 3px; }
    .nodus .text span { color: var(--text-muted); font-size: 0.85rem; }
    .nodus a.otevrit {
      margin-left: auto;
      flex-shrink: 0;
      background-color: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
    }
    .nodus a.otevrit:hover { background-color: var(--accent-hover); }
  </style>
</head>
<body>
  <header class="uvod">
    <h1>👋 Vítejte</h1>
    <p>Vyberte aplikaci v menu vlevo, nebo začněte jednou z dlaždic níže.</p>
    <div class="statistika" id="statistika"></div>
  </header>

  <section class="tip-sekce">
    <h2>💡 Tip na vyzkoušení</h2>
    <div class="tip" id="tip"></div>
  </section>

  <section>
    <h2>🎓 Výuka</h2>
    <div class="nodus">
      <svg class="znak" viewBox="0 0 782 737" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,737) scale(0.1,-0.1)"><path d="M3640 7351 c-1053 -202 -1833 -1281 -1877 -2598 -7 -225 -12 -217 97 -157 114 62 372 174 544 236 135 48 132 45 140 116 76 673 470 1325 944 1561 266 133 585 135 851 4 655 -322 1060 -1322 937 -2313 -111 -897 -506 -1752 -1128 -2442 -38 -42 -68 -80 -68 -86 0 -41 405 -332 574 -414 49 -23 49 -23 113 47 967 1047 1478 2693 1233 3970 -190 988 -781 1759 -1540 2009 -249 82 -593 110 -820 67z M3630 4884 c-591 -50 -1072 -179 -1585 -424 -1037 -494 -1786 -1337 -1985 -2230 -249 -1117 371 -2005 1530 -2194 212 -35 557 -48 708 -27 37 5 110 15 162 21 352 44 788 179 1130 350 138 69 137 67 34 140 -137 97 -266 203 -412 338 -98 91 -138 122 -150 117 -920 -378 -1848 -255 -2176 289 -337 560 -9 1434 771 2053 921 732 2090 975 3201 667 90 -25 166 -44 168 -41 6 6 23 100 40 217 17 128 31 554 18 563 -46 28 -480 116 -704 143 -127 15 -640 27 -750 18z M6246 4168 c-3 -12 -12 -77 -21 -143 -21 -157 -69 -424 -100 -550 -28 -115 -41 -87 101 -205 680 -564 998 -1352 765 -1899 -328 -771 -1696 -828 -2731 -113 -729 503 -1365 1438 -1600 2350 -14 53 -15 53 -157 -12 -277 -128 -540 -288 -535 -327 10 -81 175 -514 285 -751 377 -809 1056 -1586 1749 -2004 1386 -835 3092 -622 3632 453 494 985 -31 2305 -1251 3143 -125 86 -131 89 -137 58z"/></g></svg>
      <div class="text">
        <b>Nodus – samostatný web pro školu</b>
        <span>77 aplikací: čeština, matematika, přírodní vědy, zeměpis, dějepis a jazyky.</span>
      </div>
      <a class="otevrit" href="../nodus/index.html" target="_top">Otevřít Nodus</a>
    </div>
  </section>

  <section>
    <h2>⭐ Oblíbené</h2>
    <div class="dlazdice" id="oblibene"></div>
  </section>

  <section>
    <h2>🕘 Naposledy otevřené</h2>
    <div class="dlazdice" id="nedavne"></div>
  </section>

  <script src="../apps.js"></script>
  <script>
    const podleSouboru = new Map();
    KATALOG_SEKCE.forEach(s => s.polozky.forEach(p => podleSouboru.set(p.soubor, p)));
    const vsechny = [...podleSouboru.values()];

    const nactiJson = key => {
      try { return JSON.parse(localStorage.getItem(key)) || []; }
      catch { return []; }
    };

    // rozdělení "🌧️ Předpověď" na emoji + text
    function rozdel(nazev) {
      const m = nazev.match(/^(\P{L}+)\s*(.*)$/u);
      return (m && m[2]) ? { emoji: m[1].trim(), text: m[2] } : { emoji: '🔹', text: nazev };
    }

    // otevření aplikace: uvnitř rozcestníku přes postMessage, samostatně přímým odkazem
    function odkaz(p, popisek) {
      const a = document.createElement('a');
      a.href = '../index.html#' + p.soubor;
      a.target = '_top';
      if (popisek) {
        a.className = 'otevrit';
        a.textContent = popisek;
      } else {
        const { emoji, text } = rozdel(p.nazev);
        const e = document.createElement('span');
        e.className = 'emoji';
        e.textContent = emoji;
        const n = document.createElement('span');
        n.className = 'nazev';
        n.textContent = text;
        a.append(e, n);
      }
      a.addEventListener('click', ev => {
        if (window.parent !== window) {
          ev.preventDefault();
          window.parent.postMessage({ otevri: p.soubor }, '*');
        }
      });
      return a;
    }

    function naplnDlazdice(elId, soubory, prazdnyText) {
      const el = document.getElementById(elId);
      const apps = soubory.map(f => podleSouboru.get(f)).filter(Boolean);
      if (!apps.length) {
        const d = document.createElement('div');
        d.className = 'prazdne';
        d.textContent = prazdnyText;
        el.appendChild(d);
        return;
      }
      apps.forEach(p => el.appendChild(odkaz(p)));
    }

    naplnDlazdice('oblibene', nactiJson('webapp_oblibene'),
      'Zatím nic – najeďte v menu na aplikaci a klikněte na ★.');
    naplnDlazdice('nedavne', nactiJson('webapp_nedavne'),
      'Historie je prázdná – otevřete první aplikaci z menu.');

    document.getElementById('statistika').textContent =
      `K dispozici je ${vsechny.length} aplikací ve ${KATALOG_SEKCE.length} kategoriích.`;

    // tip dne – deterministicky podle data
    const den = Math.floor(Date.now() / 86400000);
    const tipApp = vsechny[den % vsechny.length];
    const { emoji, text } = rozdel(tipApp.nazev);
    const tipEl = document.getElementById('tip');
    const te = document.createElement('span');
    te.className = 'emoji';
    te.textContent = emoji;
    const tt = document.createElement('div');
    tt.className = 'text';
    const b = document.createElement('b');
    b.textContent = text;
    const sub = document.createElement('span');
    sub.textContent = (tipApp.tagy || []).join(' · ') || 'Vyzkoušejte dnešní náhodně vybranou aplikaci.';
    tt.append(b, sub);
    tipEl.append(te, tt, odkaz(tipApp, 'Otevřít'));
  </script>
</body>
</html>
