<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 Pantomima</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<style>
  html,body{min-height:100%;}
  body{
    background:var(--bg-deep); padding:20px clamp(14px,3vw,40px) 32px; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  .head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center;}
  h1{margin:0; font-size:1.5rem; font-weight:700;}
  .sub{color:var(--text-muted); font-size:.85rem; margin:4px 0 16px; text-align:center; padding:0 12px;}
  .langtoggle{display:flex; gap:6px;}
  .langtoggle button{padding:6px 12px; font-size:.82rem;}
  .stage{ width:min(540px,96vw); }

  button{font-family:inherit; cursor:pointer; font-weight:600; color:var(--text);
    background:var(--bg-control); border:1px solid var(--border-strong); border-radius:6px; padding:10px 16px;
    font-size:15px; transition:background .15s, border-color .15s;}
  button:hover{background:var(--bg-hover);}

  /* kategorie / lišta */
  .bar{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:12px;}
  .bar button{background:var(--bg-elevated); border-color:var(--border); padding:7px 13px; font-size:.84rem; color:var(--text-muted); border-radius:14px;}
  .bar button.sel{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}

  /* obtížnost + časovač */
  .diffbar{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom:12px;}
  .diffbar .lbl{font-size:.7rem; color:var(--text-faint); letter-spacing:1px; text-transform:uppercase; margin-right:2px;}
  .diffbar button{background:var(--bg-elevated); border-color:var(--border); padding:7px 14px; font-size:.82rem; color:var(--text-muted); border-radius:14px;}
  .diffbar button[data-d="1"].sel{background:var(--ok); border-color:var(--ok); color:#fff;}
  .diffbar button[data-d="2"].sel{background:var(--warn); border-color:var(--warn); color:#fff;}
  .diffbar button[data-d="3"].sel{background:var(--danger); border-color:var(--danger); color:#fff;}
  .diffbar button[data-time].sel{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* karta */
  .tcard{background:var(--bg-panel); border:1px solid var(--border); color:var(--text); border-radius:var(--radius); padding:26px 20px;
    box-shadow:var(--shadow); position:relative; overflow:hidden; touch-action:pan-y; min-height:280px;
    display:flex; flex-direction:column; justify-content:center;}
  .tcard::before{content:""; position:absolute; inset:0; height:5px; background:var(--accent);}
  .tcard.timeup{animation:flash .4s 3;}
  @keyframes flash{ 50%{background:rgba(224,93,93,.2);} }
  .cat{position:absolute; top:20px; right:18px; font-size:.72rem; font-weight:700; color:var(--accent); letter-spacing:1px; text-transform:uppercase;}
  .cdiff{position:absolute; top:19px; left:18px; font-size:12px; font-weight:800; letter-spacing:1px;}
  .mask{font-size:52px; text-align:center; margin-bottom:4px; user-select:none;}
  .mainword{font-size:clamp(30px,8vw,44px); font-weight:800; text-align:center;
    margin:6px 0 10px; letter-spacing:.5px; word-break:break-word;}
  .hint{font-size:.9rem; text-align:center; color:var(--text-muted); font-style:italic; margin:-4px 0 10px; padding:0 6px;}
  .timer{font-size:clamp(20px,5.5vw,26px); font-weight:800; text-align:center; color:var(--accent);
    font-variant-numeric:tabular-nums; min-height:32px;}
  .timer.low{color:var(--danger);}
  .timer.done{color:var(--danger);}

  .nextbtn{width:100%; padding:16px; font-size:1.1rem; letter-spacing:.5px; margin-top:16px;
    background:var(--accent); border:1px solid var(--accent); color:#fff;}
  .nextbtn:hover{background:var(--accent-hover); border-color:var(--accent-hover);}
  .controls{display:flex; gap:10px; margin-top:10px;}
  .controls button{flex:1;}
  .counter{text-align:center; font-size:.8rem; color:var(--text-faint); margin-top:12px;}
  .keyhint{text-align:center; margin-top:8px; font-size:.75rem; color:var(--text-faint);}
  .kbd{display:inline-block; background:var(--bg-input); border:1px solid var(--border); border-bottom-width:2px;
    border-radius:5px; padding:1px 7px; font-weight:700; font-size:.72rem;}
  .settings{margin-top:22px; padding-top:16px; border-top:1px solid var(--border);}
  .settings .diffbar:last-of-type{margin-bottom:0;}
  .settings .bar{margin-bottom:0;}
  footer{color:var(--text-faint); font-size:.75rem; margin:18px 0 4px; text-align:center;}
  a{color:var(--accent);}
  .swap{transition:opacity .12s;}

/* světlý režim: dorovnání kontrastu textu */
:root[data-theme="light"] .sel { color: var(--text) !important; }
</style>
</head>
<body>
  <div class="head">
    <h1>🎭 Pantomima</h1>
    <div class="langtoggle">
      <button data-lang="cs" class="sel">🇨🇿 CZ</button>
      <button data-lang="en">🇬🇧 EN</button>
    </div>
  </div>
  <div class="sub" data-t="subtitle">Databanka slov k předvádění — beze slov, jen tělem. Klepni a předváděj.</div>

  <div class="stage">
    <div class="tcard swap" id="tcard">
      <div class="cdiff" id="cardDiff"></div>
      <div class="cat" id="cardCat"></div>
      <div class="mask">🎭</div>
      <div class="mainword" id="mainWord">—</div>
      <div class="hint" id="hint"></div>
      <div class="timer" id="timer"></div>
    </div>

    <button class="nextbtn" id="nextBtn" data-t="next">DALŠÍ SLOVO ▶</button>
    <div class="controls">
      <button id="prevBtn" data-t="prev">‹ Zpět</button>
      <button id="shuffleBtn" data-t="shuffle">🔀 Zamíchat</button>
    </div>
    <div class="counter" id="counter"></div>
    <div class="keyhint" data-t="keyhint"></div>

    <div class="settings">
      <div class="diffbar" id="diffBar"></div>
      <div class="diffbar" id="timeBar"></div>
      <div class="bar" id="catBar"></div>
    </div>
  </div>

  <footer><span data-t="footer">PANTOMIMA · databanka slov</span> · <a href="tabooGame.html" data-t="toTaboo">přejít na Tabu →</a></footer>

<script src="pantomimaData.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);

/* ---- překlady rozhraní ---- */
const I18N = {
  cs:{ subtitle:"Databanka slov k předvádění — beze slov, jen tělem. Klepni a předváděj.",
    next:"DALŠÍ SLOVO ▶", prev:"‹ Zpět", shuffle:"🔀 Zamíchat",
    keyhint:'<span class="kbd">→ / mezera</span> další · <span class="kbd">←</span> zpět · nebo táhni prstem',
    footer:"PANTOMIMA · databanka slov", toTaboo:"přejít na Tabu →", all:"Vše",
    diffLbl:"Obtížnost", diffEasy:"● Lehká", diffMed:"●● Střední", diffHard:"●●● Těžká",
    timeLbl:"⏱ Časovač", timeOff:"Vypnuto",
    diffName:{1:"Lehká",2:"Střední",3:"Těžká"}, empty:"Žádná slova — vyber jinou obtížnost nebo kategorii",
    timeUp:"ČAS!", counter:(i,n)=>`${i} / ${n}` },
  en:{ subtitle:"A word bank for acting out — no words, body only. Tap and act.",
    next:"NEXT WORD ▶", prev:"‹ Back", shuffle:"🔀 Shuffle",
    keyhint:'<span class="kbd">→ / space</span> next · <span class="kbd">←</span> back · or swipe',
    footer:"CHARADES · word bank", toTaboo:"go to Taboo →", all:"All",
    diffLbl:"Difficulty", diffEasy:"● Easy", diffMed:"●● Medium", diffHard:"●●● Hard",
    timeLbl:"⏱ Timer", timeOff:"Off",
    diffName:{1:"Easy",2:"Medium",3:"Hard"}, empty:"No words — pick another difficulty or category",
    timeUp:"TIME'S UP!", counter:(i,n)=>`${i} / ${n}` }
};
let lang = localStorage.getItem('pantoLang') || 'cs';
const T = () => I18N[lang];

/* databanka je v pantomimaData.js (PANTOMIMA_DB[jazyk][kategorie][obtížnost] = pole slov) */
const DB = PANTOMIMA_DB;

/* ---- stav ---- */
let selectedCats = new Set();
let selectedDiff = loadSet('pantoDiff',[1,2,3]);
let timerLen = parseInt(localStorage.getItem('pantoTimer')||'0',10);
let deck=[], pos=-1, timerId=null, timeLeft=0;

function loadSet(key,def){
  try{ const s=JSON.parse(localStorage.getItem(key)); if(Array.isArray(s)&&s.length) return new Set(s.filter(d=>[1,2,3].includes(d))); }catch(e){}
  return new Set(def);
}
function saveDiff(){ localStorage.setItem('pantoDiff', JSON.stringify([...selectedDiff])); }

function cats(){ return Object.keys(DB[lang]); }
function buildDeck(){
  let pool=[];
  selectedCats.forEach(c=>{
    selectedDiff.forEach(d=>{
      (DB[lang][c][d]||[]).forEach(entry=>{
        const [w,hint] = Array.isArray(entry) ? entry : [entry,''];
        pool.push({w, hint, d, cat:c});
      });
    });
  });
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  deck=pool; pos=-1;
}

/* ---- lišta obtížnosti ---- */
function renderDiffBar(){
  const bar=$('#diffBar'); bar.innerHTML='';
  const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent=T().diffLbl; bar.appendChild(lbl);
  [[1,T().diffEasy],[2,T().diffMed],[3,T().diffHard]].forEach(([d,txt])=>{
    const b=document.createElement('button');
    b.dataset.d=d; b.textContent=txt; b.classList.toggle('sel', selectedDiff.has(d));
    b.onclick=()=>{ if(selectedDiff.has(d)){ if(selectedDiff.size>1) selectedDiff.delete(d);} else selectedDiff.add(d);
      saveDiff(); renderDiffBar(); buildDeck(); next(); };
    bar.appendChild(b);
  });
}

/* ---- lišta časovače ---- */
function renderTimeBar(){
  const bar=$('#timeBar'); bar.innerHTML='';
  const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent=T().timeLbl; bar.appendChild(lbl);
  [[0,T().timeOff],[30,'30 s'],[60,'60 s'],[90,'90 s']].forEach(([t,txt])=>{
    const b=document.createElement('button');
    b.dataset.time=t; b.textContent=txt; b.classList.toggle('sel', timerLen===t);
    b.onclick=()=>{ timerLen=t; localStorage.setItem('pantoTimer',t); renderTimeBar(); startTimer(); };
    bar.appendChild(b);
  });
}

/* ---- časovač ---- */
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(){
  stopTimer();
  const el=$('#timer'); el.className='timer'; $('#tcard').classList.remove('timeup');
  if(!timerLen || !deck.length){ el.textContent=''; return; }
  timeLeft=timerLen; el.textContent=fmt(timeLeft);
  timerId=setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      stopTimer(); el.textContent=T().timeUp; el.classList.add('done');
      $('#tcard').classList.add('timeup');
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      return;
    }
    el.textContent=fmt(timeLeft);
    el.classList.toggle('low', timeLeft<=10);
  },1000);
}
function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

/* ---- lišta kategorií ---- */
function renderBar(){
  const bar=$('#catBar'); bar.innerHTML='';
  const cs=cats();
  const all=document.createElement('button');
  all.textContent=T().all; all.classList.toggle('sel', selectedCats.size===cs.length);
  all.onclick=()=>{ selectedCats = selectedCats.size===cs.length ? new Set([cs[0]]) : new Set(cs); afterCatChange(); };
  bar.appendChild(all);
  cs.forEach(c=>{
    const b=document.createElement('button');
    b.textContent=c; b.classList.toggle('sel', selectedCats.has(c));
    b.onclick=()=>{ if(selectedCats.has(c)){ if(selectedCats.size>1) selectedCats.delete(c);} else selectedCats.add(c); afterCatChange(); };
    bar.appendChild(b);
  });
}
function afterCatChange(){ renderBar(); buildDeck(); next(); }

/* ---- navigace kartami ---- */
const DIFF_COL={1:"#2e7d4f",2:"#c08a1e",3:"#b1083a"};
function render(){
  const c=deck[pos];
  const card=$('#tcard'); card.style.opacity=0;
  setTimeout(()=>{
    if(!c){
      $('#mainWord').textContent='—'; $('#cardCat').textContent='';
      $('#cardDiff').textContent=''; $('#counter').textContent=T().empty;
      $('#timer').textContent=''; $('#hint').textContent='';
      card.style.opacity=1; return;
    }
    $('#mainWord').textContent=c.w;
    $('#hint').textContent=c.hint||'';
    $('#cardCat').textContent=c.cat;
    const cd=$('#cardDiff'); cd.textContent='●'.repeat(c.d); cd.style.color=DIFF_COL[c.d]; cd.title=T().diffName[c.d];
    $('#counter').textContent=T().counter(pos+1, deck.length);
    card.style.opacity=1;
  },120);
  startTimer();
}
function next(){ if(!deck.length){ render(); return; } pos++; if(pos>=deck.length){ buildDeck(); pos=0; } render(); }
function prev(){ if(!deck.length){ render(); return; } pos--; if(pos<0) pos=deck.length-1; render(); }

/* ---- překlad UI ---- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{ const v=T()[el.dataset.t]; if(typeof v==='string') el.innerHTML=v; });
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('sel', b.dataset.lang===lang));
  selectedCats=new Set(cats());
  renderDiffBar(); renderTimeBar(); renderBar(); buildDeck(); next();
}

/* ---- ovládání ---- */
document.querySelectorAll('[data-lang]').forEach(b=> b.onclick=()=>{ lang=b.dataset.lang; localStorage.setItem('pantoLang',lang); applyLang(); });
$('#nextBtn').onclick=next;
$('#prevBtn').onclick=prev;
$('#shuffleBtn').onclick=()=>{ buildDeck(); next(); };

window.addEventListener('keydown',e=>{
  if(e.code==='ArrowRight'||e.code==='Space'){ e.preventDefault(); next(); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); prev(); }
});

/* swipe */
let sx=0,sy=0,st=0; const card=$('#tcard');
card.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; st=Date.now(); });
card.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx, dy=e.clientY-sy; if(Date.now()-st>700) return;
  if(Math.abs(dx)<40 && Math.abs(dy)<40){ next(); return; } // klepnutí = další
  if(Math.abs(dx)>Math.abs(dy)) (dx>0?prev:next)(); // táhni vpravo = zpět, vlevo = další
});

applyLang();
})();
</script>
</body>
</html>
