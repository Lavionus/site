<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🟩 Slovo (Wordle)</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 12px;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.6rem;margin-bottom:6px;font-weight:600}
.sub{color:var(--text-faint);font-size:.85rem;margin-bottom:14px;text-align:center}
.lista{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-family:inherit}
.btn-sec{background:var(--bg-control);color:var(--text);border:1px solid var(--border-strong)}
.rezim{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--text-faint)}
.rezim select{background:var(--bg-control);color:var(--text);border:1px solid var(--border-strong);border-radius:6px;padding:6px 8px;font-family:inherit}
.grid{display:grid;gap:6px;margin-bottom:16px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.row.trhni{animation:trhni .4s}
@keyframes trhni{10%,90%{transform:translateX(-4px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-6px)}}
.tile{width:56px;height:56px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;text-transform:uppercase}
@media(max-width:400px){.tile{width:46px;height:46px;font-size:1.5rem}}
.tile.filled{border-color:var(--text-faint)}
.tile.correct{background:#27ae60;border-color:#27ae60;color:#fff}
.tile.present{background:#e0a800;border-color:#e0a800;color:#111}
.tile.absent{background:var(--bg-control);border-color:var(--bg-control);color:var(--text-muted)}
.msg{min-height:28px;font-weight:600;margin-bottom:12px;text-align:center}
.keyboard{display:flex;flex-direction:column;gap:6px;align-items:center}
.krow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.key{background:var(--border-strong);border:none;border-radius:5px;padding:14px 10px;cursor:pointer;color:var(--text);font-weight:600;font-size:.9rem;min-width:30px;font-family:inherit}
.key.wide{min-width:54px;font-size:.75rem}
.key.correct{background:#27ae60;color:#fff}
.key.present{background:#e0a800;color:#111}
.key.absent{background:var(--bg-elevated);color:var(--text-faint)}
.staty{margin-top:20px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:14px 16px;width:min(100%,420px)}
.staty h2{font-size:.95rem;margin-bottom:10px}
.statrada{display:flex;justify-content:space-around;text-align:center;margin-bottom:12px}
.statrada .v{font-size:1.5rem;font-weight:700}
.statrada .l{font-size:.72rem;color:var(--text-faint)}
.rozlozeni{display:flex;flex-direction:column;gap:4px}
.rozrad{display:flex;align-items:center;gap:8px;font-size:.8rem}
.rozrad .n{width:12px;color:var(--text-faint)}
.rozrad .pruh{background:var(--accent);height:18px;border-radius:3px;min-width:22px;color:#fff;font-size:.72rem;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-weight:600}
.rozrad.tento .pruh{background:#27ae60}
</style>
</head>
<body>
<h1>🟩 Slovo</h1>
<div class="sub">Uhádni pětipísmenné slovo na 6 pokusů</div>
<div class="lista">
  <label class="rezim">Režim:
    <select id="rezim">
      <option value="nahodne" selected>Náhodné slovo</option>
      <option value="denni">Slovo dne</option>
    </select>
  </label>
  <button class="btn" id="newBtn">🔄 Nová hra</button>
  <button class="btn btn-sec" id="vzdatBtn">🏳️ Vzdát se</button>
</div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg"></div>
<div class="keyboard" id="keyboard"></div>

<div class="staty">
  <h2>📊 Statistika</h2>
  <div class="statrada">
    <div><div class="v" id="sOdehrano">0</div><div class="l">Odehráno</div></div>
    <div><div class="v" id="sUspech">0 %</div><div class="l">Úspěšnost</div></div>
    <div><div class="v" id="sSerie">0</div><div class="l">Série 🔥</div></div>
    <div><div class="v" id="sNejserie">0</div><div class="l">Nejdelší série</div></div>
  </div>
  <div class="rozlozeni" id="rozlozeni"></div>
  <div style="text-align:right;margin-top:10px">
    <button class="btn btn-sec" id="statResetBtn" style="font-size:.78rem;padding:5px 10px">↺ Vynulovat statistiku</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

/* Tajenky = slova, která může hra zvolit. Všechna jsou ověřená česká slova
   v základním tvaru; dřívější seznam obsahoval useknutá neslova (medvě, okurk,
   jablk), která se nedala uhodnout. */
const TAJENKY=[
'altán','anděl','atlas','autor','balón','banán','barva','blesk','borec','bratr','brána',
'brýle','buben','budík','bunda','cesta','chata','chlap','chrup','cukry','datum','deska',
'divák','dlaha','dobro','domov','dopis','dotaz','drdol','dráha','duben','dveře','dárek',
'délka','dílna','dýmka','dřevo','důkaz','efekt','farma','fauna','forma','fotka','garáž',
'hasič','herec','hlava','hlína','hokej','holub','horko','hotel','houba','hrnec','hrnek',
'hrách','hudba','jazyk','jehla','jelen','ježek','jitro','jizva','jméno','játra','kabát',
'kamna','kanál','kapka','kapsa','karta','klika','klíče','kniha','kolej','koláč','kolík',
'komár','komín','konev','koník','kopec','korek','koráb','kosti','kotel','kotva','koule',
'kozel','košík','krtek','krása','kráva','kufry','kuřák','květy','kytka','kámen','křída',
'labuť','lahev','lampa','letec','listy','liška','lopta','louka','lovec','lupen','lyžař',
'lékař','lžíce','maják','malíř','matka','mince','mléko','motor','motýl','mouka','mraky',
'mrkev','myška','máslo','místo','mýdlo','město','nehet','nemoc','notes','nouze','nudle',
'nábor','nádrž','nákup','nápad','nápoj','národ','návrh','nůžky','oblak','obraz','obruč',
'oceán','odpad','okraj','oliva','opice','ostří','otisk','ovoce','ovčák','ořech','palec',
'palác','panna','panák','papír','pekař','penál','peníz','perla','pilot','plech','plody',
'ploty','pohár','pojem','pokoj','pokus','popel','posel','potok','povoz','prach','prase',
'prkno','prsty','prvek','práce','pytel','párek','pásek','pásmo','pátek','písek','píseň',
'rajče','ranec','rebel','rodič','rohož','rokle','rozum','rubín','ruina','rukáv','rybíz',
'rytíř','rádce','rádio','rámec','salát','samec','sazba','sedlo','sever','sešit','silák',
'sirka','sklad','sklep','skoba','sleva','slina','sloup','slova','sluch','smích','sokol',
'sopka','spona','srdce','srnec','stopa','strom','strop','stádo','stěna','sukně','svaly',
'svíce','sysel','sádlo','sáňky','tabák','talíř','tanec','taška','teplo','tepna','terén',
'tlapa','trest','trhák','tráva','tunel','tuřín','tužka','tvary','týden','ulice','vagón',
'vazba','veslo','večer','vichr','vidle','vlaky','vlasy','vlnka','vlčák','vodka','vodík',
'vojín','vrata','vrták','válec','vánek','vápno','vážka','výhra','výlet','vývar','včela',
'věnec','větev','věšák','zajíc','zebra','zlato','zubař','zvony','zvíře','zákon','zámek',
'západ','zápas','závod','údolí','úkoly','únava','úroda','úsměv','ústav','útvar','úvaha',
'účast','čepel','čtení','číslo','šipka','šiška','škola','šperk','špína','štika','štola',
'štěně','šálek','šátek','šňůra','žabka','žebro','želva','židle','župan',
];
/* Navíc přijímané tipy – hráč je smí zadat, ale nikdy nepadnou jako tajenka. */
const NAVIC=[
'banka','bažin','bomba','brali','budka','busta','bydlí','běžet','cesty','dobrá','dobrý',
'domek','držet','dárky','dělal','dělat','dělám','hezká','hezký','horký','jasný','jedla',
'jedli','jinak','jistě','kolem','kolik','který','lehký','levný','ležel','ležet','mnoho',
'modrá','mokrý','možná','našel','našla','nejde','nikdo','nosit','nutné','náhle','pijou',
'pišme','pomoc','pravý','první','pěkná','pěkný','sedět','silná','silný','slabý','starý',
'teplá','teplý','tichý','tmavá','tvrdý','těžký','velká','velký','vidím','vidět','vlevo',
'zlatý','zpívá','čepec','černá','černý','činka','žlutá','žlutý',
];
const SLOVNIK=new Set([...TAJENKY,...NAVIC]);
const KLIC_STAT='webapp_hra_slovo_staty';

let answer,row,col,guesses,done;

/* ---------- statistika ---------- */
function nactiStaty(){
  try{
    const s=JSON.parse(localStorage.getItem(KLIC_STAT));
    if(s&&Array.isArray(s.rozlozeni))return s;
  }catch{/* poškozený nebo nedostupný záznam – začneme znovu */}
  return {odehrano:0,vyhry:0,serie:0,nejserie:0,rozlozeni:[0,0,0,0,0,0]};
}
let staty=nactiStaty();
function ulozStaty(){
  try{localStorage.setItem(KLIC_STAT,JSON.stringify(staty));}catch{/* nevadí */}
}
function zapisVysledek(vyhra,pokusu){
  staty.odehrano++;
  if(vyhra){
    staty.vyhry++;staty.serie++;
    staty.rozlozeni[pokusu-1]++;
    if(staty.serie>staty.nejserie)staty.nejserie=staty.serie;
  } else staty.serie=0;
  ulozStaty();renderStaty(vyhra?pokusu:0);
}
function renderStaty(zvyrazni){
  $('sOdehrano').textContent=staty.odehrano;
  $('sUspech').textContent=(staty.odehrano?Math.round(staty.vyhry/staty.odehrano*100):0)+' %';
  $('sSerie').textContent=staty.serie;
  $('sNejserie').textContent=staty.nejserie;
  const max=Math.max(1,...staty.rozlozeni);
  $('rozlozeni').innerHTML=staty.rozlozeni.map((n,i)=>
    `<div class="rozrad${zvyrazni===i+1?' tento':''}"><span class="n">${i+1}</span>`+
    `<div class="pruh" style="width:${Math.max(8,n/max*100)}%">${n}</div></div>`).join('');
}

/* ---------- hra ---------- */
function slovoDne(){
  // stejné datum = stejné slovo (bez ohledu na časové pásmo uživatele)
  const d=new Date();
  const dnu=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
  return TAJENKY[dnu%TAJENKY.length];
}
function newGame(){
  const slovo=$('rezim').value==='denni'?slovoDne():TAJENKY[Math.floor(Math.random()*TAJENKY.length)];
  answer=[...slovo];
  row=0;col=0;guesses=Array.from({length:6},()=>Array(5).fill(''));done=false;
  $('msg').textContent='';$('msg').style.color='';
  buildGrid();buildKeyboard();
}
function buildGrid(){
  $('grid').innerHTML=guesses.map((g,r)=>`<div class="row" data-r="${r}">${g.map((c,i)=>`<div class="tile" data-r="${r}" data-c="${i}"></div>`).join('')}</div>`).join('');
}
/* Klávesnici stavíme z písmen, která se ve slovníku opravdu vyskytují –
   dřívější pevný seznam neobsahoval ú, ň, ť ani ď. */
function diakritika(){
  const zaklad=new Set('qwertzuiopasdfghjklyxcvbnm');
  const extra=new Set();
  SLOVNIK.forEach(w=>[...w].forEach(ch=>{if(!zaklad.has(ch))extra.add(ch);}));
  return [...extra].sort();
}
const LAYOUT=[diakritika().join(''),'qwertzuiop','asdfghjkl','yxcvbnm'];
function buildKeyboard(){
  $('keyboard').innerHTML='';
  LAYOUT.forEach((rowStr,ri)=>{
    const div=document.createElement('div');div.className='krow';
    if(ri===3){const e=document.createElement('button');e.className='key wide';e.textContent='ENTER';e.onclick=submit;div.appendChild(e);}
    [...rowStr].forEach(ch=>{const b=document.createElement('button');b.className='key';b.textContent=ch;b.dataset.k=ch;b.onclick=()=>type(ch);div.appendChild(b);});
    if(ri===3){const e=document.createElement('button');e.className='key wide';e.textContent='⌫';e.onclick=del;div.appendChild(e);}
    $('keyboard').appendChild(div);
  });
}
function type(ch){if(done||col>=5)return;guesses[row][col]=ch;updateTile(row,col,ch);col++;}
function del(){if(done||col<=0)return;col--;guesses[row][col]='';updateTile(row,col,'');}
function updateTile(r,c,ch){const t=document.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`);t.textContent=ch;t.classList.toggle('filled',!!ch);}
function trhni(){
  const r=document.querySelector(`.row[data-r="${row}"]`);
  if(!r)return;
  r.classList.remove('trhni');void r.offsetWidth;r.classList.add('trhni');
  setTimeout(()=>r.classList.remove('trhni'),450);
}
function submit(){
  if(done)return;
  if(col<5){flash('Zadej všech 5 písmen');trhni();return;}
  const slovo=guesses[row].join('');
  if(!SLOVNIK.has(slovo)){flash('Tohle slovo neznám');trhni();return;}
  const guess=guesses[row];
  const ansCopy=[...answer];const result=Array(5).fill('absent');
  for(let i=0;i<5;i++)if(guess[i]===answer[i]){result[i]='correct';ansCopy[i]=null;}
  for(let i=0;i<5;i++)if(result[i]!=='correct'){const idx=ansCopy.indexOf(guess[i]);if(idx>=0){result[i]='present';ansCopy[idx]=null;}}
  for(let i=0;i<5;i++){const t=document.querySelector(`.tile[data-r="${row}"][data-c="${i}"]`);t.classList.add(result[i]);
    const k=document.querySelector(`.key[data-k="${guess[i]}"]`);
    if(k){if(result[i]==='correct')k.className='key correct';else if(result[i]==='present'&&!k.classList.contains('correct'))k.className='key present';else if(result[i]==='absent'&&!k.classList.contains('correct')&&!k.classList.contains('present'))k.className='key absent';}}
  if(result.every(r=>r==='correct')){
    done=true;$('msg').textContent='🎉 Výborně! Uhodnuto na '+(row+1)+'. pokus.';$('msg').style.color='var(--ok)';
    zapisVysledek(true,row+1);return;
  }
  row++;col=0;
  if(row>=6){
    done=true;$('msg').textContent='💀 Slovo bylo: '+answer.join('').toUpperCase();$('msg').style.color='var(--danger)';
    zapisVysledek(false,0);
  }
}
function flash(m){
  $('msg').textContent=m;$('msg').style.color='var(--warn)';
  setTimeout(()=>{if(!done)$('msg').textContent='';},1400);
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  if(e.key==='Enter')submit();
  else if(e.key==='Backspace')del();
  else if([...e.key].length===1&&/\p{L}/u.test(e.key))type(e.key.toLowerCase());
});
$('newBtn').onclick=newGame;
$('rezim').onchange=newGame;
$('vzdatBtn').onclick=()=>{
  if(done)return;
  done=true;
  $('msg').textContent='🏳️ Slovo bylo: '+answer.join('').toUpperCase();
  $('msg').style.color='var(--danger)';
  zapisVysledek(false,0);
};
$('statResetBtn').onclick=()=>{
  staty={odehrano:0,vyhry:0,serie:0,nejserie:0,rozlozeni:[0,0,0,0,0,0]};
  ulozStaty();renderStaty(0);
};
renderStaty(0);
newGame();
</script>
</body>
</html>
