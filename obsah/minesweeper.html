<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💣 Hledání min</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../rekord.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.6rem;margin-bottom:14px;font-weight:600}
.top{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--accent)}
select{background:var(--border);border:1px solid var(--border-strong);border-radius:4px;color:var(--text);padding:9px}
.info{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:1.1rem;font-weight:700;min-width:90px;text-align:center}
.board{display:grid;gap:2px;background:var(--border);padding:6px;border-radius:8px;touch-action:manipulation;
  /* --sl = počet sloupců; buňka se zmenší, aby se deska vešla i na telefon */
  --bunka:min(32px, calc((100vw - 34px - (var(--sl) - 1) * 2px) / var(--sl)))}
.cell{width:var(--bunka);height:var(--bunka);font-size:clamp(.6rem,calc(var(--bunka) * .55),1rem);background:var(--bg-control);border:1px solid var(--border-strong);border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.cell.open{background:var(--bg-input);border-color:var(--bg-elevated);cursor:default}
.cell.mine{background:#c0392b}
.cell.flag{background:#2a3a4a}
.c1{color:var(--accent)}.c2{color:var(--ok)}.c3{color:var(--danger)}.c4{color:#9b59b6}.c5{color:#e67e22}.c6{color:#1abc9c}.c7{color:#ecf0f1}.c8{color:#95a5a6}
.hint{color:var(--text-faint);font-size:.85rem;margin-top:16px;text-align:center;max-width:480px}
.msg{margin-top:12px;font-size:1.2rem;font-weight:700;min-height:28px}
.msg.win{color:var(--ok)}.msg.lose{color:var(--danger)}
</style>
</head>
<body>
<h1>💣 Hledání min (Minesweeper)</h1>
<div class="top">
  <div class="info">💣 <span id="mines">0</span></div>
  <div class="info">⏱️ <span id="time">0</span></div>
  <select id="level">
    <option value="9,9,10">Lehká (9×9, 10 min)</option>
    <option value="16,16,40">Střední (16×16, 40 min)</option>
    <option value="24,16,70">Těžká (24×16, 70 min)</option>
  </select>
  <button class="btn" id="newBtn">🙂 Nová hra</button>
  <span id="rekordBox"></span>
</div>
<div class="board" id="board"></div>
<div class="msg" id="msg"></div>
<p class="hint">Levý klik = odkrýt, pravý klik (nebo dlouhý dotyk) = vlajka 🚩. Cíl: odkrýt všechna pole bez min.</p>
<script>
const $=id=>document.getElementById(id);
let cols,rows,mineCount,grid,revealed,flagged,gameDone,first,timer,seconds;
let rek=null;const rekordy={};   // nejlepší čas se drží zvlášť pro každou obtížnost
function nastavRekord(){
  if(typeof Rekord==='undefined')return;
  const uroven=$('level').value;
  if(!rekordy[uroven]){
    const popis=$('level').options[$('level').selectedIndex].text.split(' (')[0];
    rekordy[uroven]=Rekord.sleduj('webapp_hra_minesweeper_'+uroven.replace(/,/g,'x'),
      {vyssiLepsi:false,popisek:'Nejlepší čas ('+popis.toLowerCase()+')',format:v=>v+' s'});
  }
  rek=rekordy[uroven];rek.prvek($('rekordBox'));
}
function init(){
  [cols,rows,mineCount]=$('level').value.split(',').map(Number);
  grid=Array.from({length:rows},()=>Array(cols).fill(0));
  revealed=Array.from({length:rows},()=>Array(cols).fill(false));
  flagged=Array.from({length:rows},()=>Array(cols).fill(false));
  gameDone=false;first=true;seconds=0;clearInterval(timer);$('time').textContent=0;
  nastavRekord();
  $('mines').textContent=mineCount;$('msg').textContent='';$('msg').className='msg';$('newBtn').textContent='🙂 Nová hra';
  const b=$('board');b.style.setProperty('--sl',cols);b.style.gridTemplateColumns=`repeat(${cols},var(--bunka))`;
  b.innerHTML='';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=document.createElement('div');c.className='cell';c.dataset.x=x;c.dataset.y=y;
    b.appendChild(c);
  }
}
function placeMines(sx,sy){
  let placed=0;
  while(placed<mineCount){
    const x=Math.floor(Math.random()*cols),y=Math.floor(Math.random()*rows);
    if(grid[y][x]===-1||(Math.abs(x-sx)<=1&&Math.abs(y-sy)<=1))continue;
    grid[y][x]=-1;placed++;
  }
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(grid[y][x]===-1)continue;let n=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const ny=y+dy,nx=x+dx;if(ny>=0&&ny<rows&&nx>=0&&nx<cols&&grid[ny][nx]===-1)n++;}
    grid[y][x]=n;
  }
}
function cellEl(x,y){return $('board').children[y*cols+x];}
function reveal(x,y){
  if(revealed[y][x]||flagged[y][x])return;
  revealed[y][x]=true;const c=cellEl(x,y);c.classList.add('open');
  if(grid[y][x]===-1){c.classList.add('mine');c.textContent='💥';lose();return;}
  if(grid[y][x]>0){c.textContent=grid[y][x];c.classList.add('c'+grid[y][x]);}
  else{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const ny=y+dy,nx=x+dx;if(ny>=0&&ny<rows&&nx>=0&&nx<cols)reveal(nx,ny);}}
}
function lose(){gameDone=true;clearInterval(timer);$('msg').textContent='💀 Šlápls na minu!';$('msg').className='msg lose';$('newBtn').textContent='😵 Nová hra';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(grid[y][x]===-1&&!flagged[y][x]&&!revealed[y][x]){const c=cellEl(x,y);c.classList.add('open');c.textContent='💣';}
    if(grid[y][x]!==-1&&flagged[y][x]){cellEl(x,y).textContent='❌';}
  }}
function checkWin(){
  if(gameDone)return;
  // výhra = všechna pole BEZ min jsou odkrytá (odkrytá mina znamená prohru, nikdy výhru)
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(grid[y][x]===-1&&revealed[y][x])return;
    if(grid[y][x]!==-1&&!revealed[y][x])return;
  }
  gameDone=true;clearInterval(timer);
  let zprava='🎉 Vyhráls! Čas: '+seconds+' s';
  if(rek&&rek.zapis(seconds))zprava='🏆 Nový rekord: '+seconds+' s!';
  $('msg').textContent=zprava;$('msg').className='msg win';$('newBtn').textContent='😎 Nová hra';
}
function flagsUsed(){let n=0;flagged.forEach(r=>r.forEach(f=>{if(f)n++;}));return n;}
$('board').addEventListener('click',e=>{
  const c=e.target.closest('.cell');if(!c||gameDone)return;
  if(Date.now()<lpSuppress)return; // ghost click po dlouhém tapu nesmí odkrýt pole
  const x=+c.dataset.x,y=+c.dataset.y;
  if(flagged[y][x])return;
  if(first){placeMines(x,y);first=false;timer=setInterval(()=>{seconds++;$('time').textContent=seconds;},1000);}
  reveal(x,y);if(!gameDone)checkWin();
});
function toggleFlag(c){
  if(gameDone)return;
  const x=+c.dataset.x,y=+c.dataset.y;if(revealed[y][x])return;
  flagged[y][x]=!flagged[y][x];c.classList.toggle('flag',flagged[y][x]);c.textContent=flagged[y][x]?'🚩':'';
  $('mines').textContent=mineCount-flagsUsed();
}
$('board').addEventListener('contextmenu',e=>{
  e.preventDefault();const c=e.target.closest('.cell');if(!c)return;
  // nativní contextmenu z dlouhého tapu by přehodil vlajku podruhé — dlouhý tap a contextmenu se navzájem potlačují
  if(Date.now()<lpSuppress)return;
  clearTimeout(lpTimer);lpTimer=null;lpSuppress=Date.now()+700;
  toggleFlag(c);
});
// long-press for touch flag
let lpTimer=null,lpSuppress=0;
$('board').addEventListener('touchstart',e=>{const c=e.target.closest('.cell');if(!c)return;
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{lpTimer=null;lpSuppress=Date.now()+700;toggleFlag(c);},450);},{passive:true});
$('board').addEventListener('touchmove',()=>{clearTimeout(lpTimer);lpTimer=null;},{passive:true});
$('board').addEventListener('touchend',e=>{
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
  else{e.preventDefault();} // dlouhý tap už vlajku přepnul — zablokuj následný click/contextmenu
},{passive:false});
$('newBtn').onclick=init;$('level').onchange=init;
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
