<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starfall: Iron Horizon</title>
<script src="../i18n.js"></script>
<script src="../podpis.js" defer></script>
<style>
  /* Hra má vlastní tmavou paletu nezávislou na tématu webu (jako ostatní arkády). */
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #napoveda {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 6px; background: rgba(11, 20, 36, 0.92); border: 1px solid #2a3a55;
    color: #cfe8ff; font: 14px ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    pointer-events: none; text-align: center;
  }
  #napoveda.skryt { display: none; }
  /* Telefon na výšku: plátno 16:9 by bylo drobné – vyzvat k otočení. */
  #otoc {
    display: none; position: fixed; inset: 0; z-index: 10; background: #05060d; color: #cfe8ff;
    font: 18px ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  @media (orientation: portrait) and (max-width: 600px) { #otoc { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="napoveda">Klikni do hry · ovládání klávesnicí (WASD / šipky, mezerník)</div>
<div id="otoc">⟲<br><br>Otoč telefon na šířku</div>
<script>
  // Klávesy dostane jen okno s fokusem – v rozcestníku je hra v iframu, takže připomenout kliknutí.
  // Na dotykovém zařízení stačí krátká nápověda k ovládání prstem, která po prvním dotyku zmizí.
  (function () {
    const n = document.getElementById('napoveda');
    if (matchMedia('(pointer: coarse)').matches) {
      n.textContent = 'Táhni prstem po hře – loď letí a střílí · ťukni na položky a tlačítka';
      addEventListener('pointerdown', () => n.classList.add('skryt'), { once: true });
      return;
    }
    const ukaz = () => n.classList.toggle('skryt', document.hasFocus());
    addEventListener('focus', ukaz);
    addEventListener('blur', ukaz);
    addEventListener('pointerdown', () => { window.focus(); ukaz(); });
    ukaz();
  })();
</script>
<!-- Sestaveno z projektu MyWebSites/Starfall (tools/export_site.sh); obrázky jsou v balíčku jako data URI. -->
<script defer src="starfall/starfall.js"></script>
</body>
</html>
