<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚪 Dveře do světa</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<script src="../dialog.js"></script>
<style>
/* Scéna má vlastní „chodbu“ — v tmavém tématu večerní, ve světlém denní. */
:root {
  --zed-1: #2a2c3a; --zed-2: #232532; --zed-vzor: rgba(255,255,255,.025);
  --podlaha-1: #3a2b22; --podlaha-2: #2b1f19; --lista: #17181f;
  --lampa: rgba(255, 214, 150, .20);
  --panel-sklo: rgba(20, 22, 30, .72); --panel-text: #eef0f6; --panel-tlumene: #b8bccb;
  --hlavni-svetlo: #fff3d1;
  --podlaha: clamp(170px, 30vh, 240px);
  --misto-na-dvere: calc(100vh - var(--podlaha) - 140px);
}
:root[data-theme="light"] {
  --zed-1: #e9e1d3; --zed-2: #ddd3c2; --zed-vzor: rgba(120, 90, 50, .05);
  --podlaha-1: #b88d63; --podlaha-2: #9c724c; --lista: #f6f1e8;
  --lampa: rgba(255, 236, 190, .55);
}
html, body { height: 100%; }
body { background: var(--zed-2); overflow: hidden; }

/* ---------- chodba ---------- */
.scena {
  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 38% 34% at 50% 18%, var(--lampa), transparent 70%),
    repeating-linear-gradient(90deg, var(--zed-vzor) 0 2px, transparent 2px 46px),
    linear-gradient(var(--zed-1), var(--zed-2));
  transform-origin: 50% 52%;
  transition: transform 1.1s cubic-bezier(.6, 0, .3, 1), filter 1.1s;
}
.scena.vstup { transform: scale(2.6); filter: brightness(1.4); }
.podlaha {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--podlaha);
  background:
    linear-gradient(rgba(0,0,0,.35), transparent 30%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 90px),
    linear-gradient(var(--podlaha-1), var(--podlaha-2));
  border-top: 10px solid var(--lista);
}
.nadpis {
  position: absolute; top: 18px; left: 0; right: 0; text-align: center;
  pointer-events: none; color: var(--text);
}
.nadpis h1 { font-size: clamp(1.25rem, 3.4vw, 1.9rem); font-weight: 650; letter-spacing: .02em; }
.nadpis p { color: var(--text-muted); font-size: .92rem; margin-top: 4px; }

/* dveře: vnější tlačítko = zárubeň, uvnitř otvor se světlem a otočné křídlo */
.vchod {
  --v: max(150px, min(var(--misto-na-dvere), 500px));
  --s: calc(var(--v) * .5);
  --dvere: #7a4a26; --dvere-tmave: #5b361b; --zarubne: #3e2614; --kovani: #d9b45a;
  position: absolute; left: 50%; bottom: var(--podlaha);
  width: var(--s); height: var(--v); transform: translateX(-50%);
  border: none; background: none; padding: 0; cursor: pointer;
  perspective: 1400px;
  -webkit-tap-highlight-color: transparent;
}
.vchod::before { /* zárubeň */
  content: ''; position: absolute; inset: -14px -14px 0 -14px;
  background: linear-gradient(90deg, var(--zarubne), color-mix(in srgb, var(--zarubne) 70%, #fff) 50%, var(--zarubne));
  border-radius: var(--tvar-ram, 6px 6px 0 0);
  box-shadow: 0 10px 40px rgba(0,0,0,.45);
}
.otvor {
  position: absolute; inset: 0; overflow: hidden;
  border-radius: var(--tvar, 3px 3px 0 0);
  background: radial-gradient(ellipse at 50% 60%, var(--svetlo, #ffe7a8), color-mix(in srgb, var(--svetlo, #ffe7a8) 40%, #000) 120%);
}
.otvor::after { /* záře, která při otevření zesílí */
  content: ''; position: absolute; inset: 0; background: var(--hlavni-svetlo);
  opacity: 0; transition: opacity .9s ease-in;
}
.vchod.otevreno .otvor::after { opacity: .95; }
.kridlo {
  position: absolute; inset: 0;
  border-radius: var(--tvar, 3px 3px 0 0);
  background: linear-gradient(100deg, var(--dvere-tmave), var(--dvere) 18%, var(--dvere) 82%, var(--dvere-tmave));
  transform-origin: 0 50%;
  transition: transform 1s cubic-bezier(.5, 0, .25, 1), filter 1s;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.25);
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1.6fr;
  gap: 9%; padding: 14% 13% 16%;
}
.vchod:hover .kridlo, .vchod:focus-visible .kridlo { transform: rotateY(-7deg); }
.vchod.otevreno .kridlo { transform: rotateY(-104deg); filter: brightness(.55); }
.vchod:focus-visible { outline: none; }
.vchod:focus-visible::before { outline: 3px solid var(--accent); outline-offset: 4px; }
.panel {
  border-radius: 3px;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.10), inset -2px -2px 0 rgba(0,0,0,.30), inset 0 0 0 6px rgba(0,0,0,.06);
}
.klika {
  position: absolute; right: 9%; top: 54%; width: 13%; aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff8, transparent 45%), var(--kovani);
  box-shadow: 0 2px 4px rgba(0,0,0,.45);
  transition: transform .3s;
}
.vchod:hover .klika { transform: rotate(-25deg); }
.stitek {
  position: absolute; left: 50%; top: 5.5%; transform: translateX(-50%);
  background: var(--kovani); color: #2b2113;
  font: 700 clamp(.7rem, 1.9vh, .95rem)/1 ui-monospace, 'Cascadia Mono', Menlo, monospace;
  padding: 4px 8px; border-radius: 3px; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 #fff6;
}
/* škvíra pod dveřmi a světlo rozlité po podlaze */
.paprsek {
  position: absolute; left: 50%; top: calc(100% - var(--podlaha)); width: min(90vw, 460px);
  height: calc(var(--podlaha) * .8); transform: translateX(-50%);
  background: radial-gradient(ellipse 50% 22% at 50% 0, var(--svetlo, #ffe7a8), transparent 75%);
  opacity: .55; pointer-events: none; mix-blend-mode: screen;
  transition: opacity .8s, background .8s;
}
:root[data-theme="light"] .paprsek { mix-blend-mode: normal; opacity: .45; }
.vchod:hover ~ .paprsek { opacity: .8; }

/* tvary a barvy dveří — pokaždé jiné */
.vchod.s-modre   { --dvere: #2f6db3; --dvere-tmave: #1f4c80; --zarubne: #e9e4d8; --kovani: #c9cdd3; --tvar: 50% 50% 3px 3px / 26% 26% 0 0; --tvar-ram: 50% 50% 0 0 / 28% 28% 0 0; }
.vchod.s-cervene { --dvere: #a3322b; --dvere-tmave: #7a221d; --zarubne: #f3efe7; --kovani: #1d1d1d; }
.vchod.s-zelene  { --dvere: #2d5e46; --dvere-tmave: #1e4231; --zarubne: #f1ede6; --kovani: #d9b45a; }
.vchod.s-bile    { --dvere: #eeeae2; --dvere-tmave: #cfc9bd; --zarubne: #8a7a66; --kovani: #9a8a5a; }
.vchod.s-zlute   { --dvere: #e0a526; --dvere-tmave: #b47f12; --zarubne: #5a4632; --kovani: #333; --tvar: 50% 50% 3px 3px / 26% 26% 0 0; --tvar-ram: 50% 50% 0 0 / 28% 28% 0 0; }
.vchod.s-hobit   { --s: var(--v); --v: max(140px, min(calc(var(--misto-na-dvere) * .8), 400px));
                   --dvere: #3f7a3a; --dvere-tmave: #2b5628; --zarubne: #6b4a2b; --kovani: #e0b652;
                   --tvar: 50%; --tvar-ram: 50%; }
.vchod.s-hobit .kridlo { overflow: hidden; grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr; gap: 3%; padding: 6%; }
.vchod.s-hobit .panel { border-radius: 0; box-shadow: inset -2px 0 0 rgba(0,0,0,.25); }
.vchod.s-hobit .klika { right: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 11%; }
.vchod.s-hobit .stitek { top: 22%; }
.vchod.s-shoji   { --dvere: #f4ecd8; --dvere-tmave: #e0d4b8; --zarubne: #3b2a1c; --kovani: #3b2a1c; }
.vchod.s-shoji .kridlo {
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(25% - 3px), #4a3524 calc(25% - 3px) 25%),
    repeating-linear-gradient(0deg, transparent 0 calc(12.5% - 3px), #4a3524 calc(12.5% - 3px) 12.5%),
    var(--dvere);
  box-shadow: inset 0 0 0 7px #4a3524;
}
.vchod.s-shoji .panel { visibility: hidden; }
.vchod.s-shoji .klika { border-radius: 3px; width: 6%; aspect-ratio: .3; background: #2b1d12; }
.vchod.s-shoji .stitek { background: #2b1d12; color: #f4ecd8; }
.vchod.s-cervene .kridlo, .vchod.s-zelene .kridlo { grid-template-rows: 1.2fr 1fr 1fr; }
.vchod.s-zelene .panel:nth-child(-n+2) { background: rgba(255, 240, 200, .18); box-shadow: inset 0 0 0 3px rgba(0,0,0,.35); }

/* ---------- ovládání v chodbě ---------- */
.ovladani {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  width: min(760px, calc(100% - 24px));
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--panel-text);
}
.vyzva { font-size: .95rem; color: var(--panel-text); text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.rezim { display: inline-flex; background: var(--panel-sklo); border-radius: 999px; padding: 3px; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.14); }
.rezim button { border: 0; background: none; color: var(--panel-text); font: inherit; font-size: .88rem; padding: 5px 14px; border-radius: 999px; cursor: pointer; }
.rezim button[aria-pressed="true"] { background: #fff; color: #1d2030; font-weight: 600; }
.cipy { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.cip {
  border: 1px solid rgba(255,255,255,.18); background: var(--panel-sklo); color: var(--panel-text);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer;
  backdrop-filter: blur(6px);
}
.cip:hover { border-color: rgba(255,255,255,.45); }
.cip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.radek { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px; font-size: .85rem; }
.radek label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; background: var(--panel-sklo); padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(6px); }
.pocet { color: var(--panel-tlumene); background: var(--panel-sklo); padding: 5px 11px; border-radius: 999px; }

/* ---------- výhled (za dveřmi) ---------- */
.vyhled {
  position: fixed; inset: 0; z-index: 10; background: #000;
  display: flex; flex-direction: column;
  clip-path: inset(0 round 0);
  transition: clip-path .95s cubic-bezier(.6, 0, .25, 1);
}
.vyhled[hidden] { display: none; }
.vyhled.skryto { visibility: hidden; }

/* lišta nad pracovní plochou – mimo přehrávač, takže najetí myší na ni
   neprobudí ovládání YouTube ani Street View */
.lista {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 10px;
  background: #15171f; border-bottom: 1px solid #2a2d3a; color: var(--panel-text);
  min-height: 50px;
}
.lista-nazev { flex: 1; min-width: 0; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lista-nazev small { font-weight: 400; color: var(--panel-tlumene); margin-left: 6px; }
.lista-tl { display: flex; gap: 6px; flex: none; }
.tl {
  border: 1px solid rgba(255,255,255,.16); background: #232633; color: var(--panel-text);
  border-radius: 9px; padding: 7px 11px; font: inherit; font-size: .88rem;
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
}
.tl:hover { border-color: rgba(255,255,255,.45); background: #2b2f3e; }
.tl.hlavni { background: var(--accent); border-color: var(--accent); color: #fff; }
.tl[aria-pressed="true"] { color: #ffd34d; border-color: rgba(255, 211, 77, .5); }
.tl .txt { display: inline; }

.plocha { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#prehravac, #prehravac iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.zablesk { position: absolute; inset: 0; background: var(--hlavni-svetlo); opacity: 0; pointer-events: none; transition: opacity .7s ease-out; z-index: 3; }
.zablesk.zapnuto { opacity: 1; transition: none; }

/* medailonek */
.karta {
  position: absolute; left: 12px; top: 12px; width: min(340px, calc(100% - 24px)); z-index: 2;
  background: var(--panel-sklo); color: var(--panel-text); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 12px 14px 11px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
  max-height: calc(100% - 24px); overflow: auto;
  transition: opacity .25s, transform .25s;
}
.karta.schovana { opacity: 0; transform: translateY(-8px) scale(.98); pointer-events: none; }
.karta .hlavicka { display: flex; align-items: center; gap: 8px; }
.karta .typ { flex: 1; font-size: .75rem; color: var(--panel-tlumene); text-transform: uppercase; letter-spacing: .06em; }
.karta .skryt { background: none; border: 0; color: var(--panel-tlumene); font-size: 1.05rem; line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.karta .skryt:hover { color: #fff; background: rgba(255,255,255,.1); }
.karta h2 { font-size: 1.2rem; margin: 3px 0 2px; line-height: 1.25; }
.karta .puvodni { font-size: .8rem; color: var(--panel-tlumene); }
.karta .misto { color: var(--panel-tlumene); font-size: .88rem; }
.karta .mapka { margin-top: 9px; border-radius: 8px; background: rgba(120, 160, 220, .10); position: relative; overflow: hidden; }
.karta .mapka svg { display: block; width: 100%; height: auto; max-height: 150px; }
.karta .mapka .souse { fill: rgba(235, 238, 245, .30); }
.karta .mapka .bod { fill: #ff5b4f; stroke: #fff; }
.karta .mapka .vlna { fill: none; stroke: #ff5b4f; animation: vlna 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vlna { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(2.4); } }
.karta .mapka .kontinent { position: absolute; right: 7px; bottom: 4px; font-size: .68rem; color: var(--panel-tlumene); letter-spacing: .04em; }
.karta .cas { margin-top: 9px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 3px 12px; }
.karta .cas b { font-variant-numeric: tabular-nums; }
.karta .popis { margin-top: 7px; font-size: .86rem; line-height: 1.45; color: #dfe2ea; }
.karta .poznamka { margin-top: 7px; font-size: .85rem; line-height: 1.4; color: #ffe39a; white-space: pre-wrap; }
.karta .prestehovano { margin-top: 7px; font-size: .8rem; color: #ffd27a; line-height: 1.4; }
.karta .zdroj { margin-top: 8px; font-size: .74rem; color: var(--panel-tlumene); line-height: 1.5; }
.karta .zdroj a { color: #9cc3ff; }
.karta .zdroj button { background: none; border: 0; padding: 0; font: inherit; color: #9cc3ff; text-decoration: underline; cursor: pointer; }
:root[data-theme="light"] .karta .mapka .souse { fill: rgba(235, 238, 245, .32); }

.hlaseni {
  position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 2;
  background: var(--panel-sklo); color: var(--panel-text); backdrop-filter: blur(10px);
  border-radius: 12px; padding: 12px 16px; max-width: min(520px, calc(100% - 28px));
  text-align: center; font-size: .92rem; line-height: 1.45;
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.hlaseni[hidden] { display: none; }
.hlaseni code { background: rgba(255,255,255,.12); padding: 1px 5px; border-radius: 4px; }
.hlaseni a { color: #9cc3ff; }
.hlaseni .tlacitka { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.nacitam { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: toc 1s linear infinite; }
@keyframes toc { to { transform: rotate(360deg); } }
.toast {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4;
  background: #232633; color: var(--panel-text); border: 1px solid #3a3e50; border-radius: 10px;
  padding: 8px 10px 8px 14px; font-size: .88rem; display: flex; gap: 10px; align-items: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.45);
}
.toast[hidden] { display: none; }
.toast button { background: none; border: 1px solid #4a4f66; color: #9cc3ff; border-radius: 7px; padding: 4px 9px; font: inherit; font-size: .84rem; cursor: pointer; }

/* ---------- dialogy (seznam míst, oblíbené, odkazy) ---------- */
dialog.okno {
  border: 1px solid var(--border); border-radius: 14px; background: var(--bg-panel); color: var(--text);
  width: min(860px, calc(100% - 24px)); max-height: min(86vh, 820px); padding: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  margin: auto;    /* common.css nuluje okraje všem prvkům – dialog by jinak nebyl uprostřed */
}
dialog.okno.male { width: min(520px, calc(100% - 24px)); }
dialog.okno::backdrop { background: rgba(0,0,0,.55); }
.okno-hlava { position: sticky; top: 0; z-index: 1; background: var(--bg-panel); padding: 14px 16px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.okno-hlava h2 { font-size: 1.1rem; flex: 1 1 auto; }
.okno input[type=search], .okno input[type=text], .okno input[type=url], .okno textarea, .okno select {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-input); color: var(--text); font: inherit;
}
.okno-hlava input[type=search] { flex: 1 1 200px; }
.okno button.b {
  font: inherit; font-size: .88rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-control); color: var(--text); cursor: pointer; white-space: nowrap;
}
.okno button.b:hover { background: var(--bg-hover); }
.okno button.b.hlavni { background: var(--accent); border-color: var(--accent); color: #fff; }
.okno button.b.nebezpecne { color: var(--danger); }
.okno-telo { padding: 6px 16px 16px; }
.okno-nastroje { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px 0; }
.okno-nastroje .pruh { flex: 1; }
.prepinac { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.prepinac button { font: inherit; font-size: .84rem; padding: 5px 11px; background: var(--bg-control); color: var(--text); border: 0; border-right: 1px solid var(--border); cursor: pointer; }
.prepinac button:last-child { border-right: 0; }
.prepinac button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.prazdno { color: var(--text-muted); padding: 22px 4px; text-align: center; line-height: 1.6; }

.seznam-telo h3 { font-size: .9rem; color: var(--accent); margin: 14px 0 6px; }
.seznam-telo ul { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 12px; }
.seznam-telo li button {
  width: 100%; text-align: left; font: inherit; font-size: .88rem; background: none; border: none; color: var(--text);
  padding: 5px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: baseline;
}
.seznam-telo li button:hover { background: var(--bg-hover); }
.seznam-telo li .m { color: var(--text-faint); font-size: .78rem; }
.seznam-telo li.byl button::after { content: '✓'; margin-left: auto; color: var(--ok); }
.seznam-telo li.rozbite button { opacity: .5; }

/* oblíbené */
.obl-seznam { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.obl-seznam li { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elevated); }
.obl-ikona { font-size: 1.4rem; line-height: 1; }
.obl-text { min-width: 0; }
.obl-text b { display: block; font-size: .95rem; overflow-wrap: anywhere; }
.obl-text .m { color: var(--text-faint); font-size: .8rem; }
.obl-text .p { color: var(--text-muted); font-size: .84rem; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.obl-akce { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.obl-akce button { font: inherit; font-size: .82rem; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-control); color: var(--text); cursor: pointer; }
.obl-akce button:hover { background: var(--bg-hover); }
.formular { display: grid; gap: 10px; padding: 14px 16px 16px; }
.formular label { display: grid; gap: 4px; font-size: .86rem; color: var(--text-muted); }
.formular input, .formular textarea { width: 100%; }
.formular textarea { min-height: 70px; resize: vertical; }

<script>
(function () {
'use strict';

/* Data jsou v dvere_do_sveta_data.js:
   kamery: [YouTube ID, kanál (záloha), typ, název, místo, kód země, šířka, délka, časové pásmo, popis]
   mista:  [ID panoramatu, typ, název, místo, kód země, šířka, délka, směr pohledu (°), časové pásmo, popis] */
const DATA = (window.DVERE_DATA && window.DVERE_DATA.kamery) || [];
const DATA_SV = (window.DVERE_DATA && window.DVERE_DATA.mista) || [];

const TYPY = {
  zvirata: { ikona: '🦁', nazev: 'Zvířata' },
  hory:    { ikona: '🏔️', nazev: 'Hory' },
  more:    { ikona: '🌊', nazev: 'Moře a voda' },
  mesta:   { ikona: '🏙️', nazev: 'Města' },
  sopky:   { ikona: '🌋', nazev: 'Sopky' },
  nebe:    { ikona: '🌌', nazev: 'Noční obloha' },
  vesmir:  { ikona: '🚀', nazev: 'Vesmír' },
  vlaky:   { ikona: '🚂', nazev: 'Vlaky' },
};
const TYPY_SV = {
  vyhlidky: { ikona: '🔭', nazev: 'Vyhlídky' },
  more:     { ikona: '🏖️', nazev: 'Moře a pobřeží' },
  mesta:    { ikona: '🏙️', nazev: 'Města' },
  pamatky:  { ikona: '🏛️', nazev: 'Památky' },
  priroda:  { ikona: '🌲', nazev: 'Příroda' },
  vzacne:   { ikona: '🧭', nazev: 'Na konci světa' },
};
const VLASTNI = { ikona: '📌', nazev: 'Vlastní místo' };
const STYLY = ['s-dub', 's-modre', 's-cervene', 's-zelene', 's-bile', 's-zlute', 's-hobit', 's-shoji'];
const PRAHA = [50.087, 14.421];
const KLIC = 'webapp_dvere_';

const KAMERY = DATA.map(([yt, kanal, typ, nazev, misto, zeme, lat, lon, tz, popis]) =>
  ({ id: yt, druh: 'kamera', yt, kanal, typ, nazev, misto, zeme, lat, lon, tz, popis }));
const MISTA = DATA_SV.map(([pano, typ, nazev, misto, zeme, lat, lon, smer, tz, popis]) =>
  ({ id: 'sv:' + pano, druh: 'sv', pano, typ, nazev, misto, zeme, lat, lon, smer, tz, popis }));
const PODLE_ID = new Map([...KAMERY, ...MISTA].map(k => [k.id, k]));
const typyDruhu = k => k.vlastni ? { vlastni: VLASTNI } : k.druh === 'sv' ? TYPY_SV : TYPY;
const typy = () => nastaveni.rezim === 'sv' ? TYPY_SV : TYPY;
const druhRezimu = () => nastaveni.rezim === 'sv' ? 'sv' : 'kamera';

/* ---------- úložiště (v soukromém okně může vyhodit) ---------- */
function nacti(klic, vychozi) {
  try { const v = JSON.parse(localStorage.getItem(KLIC + klic)); return v ?? vychozi; }
  catch { return vychozi; }
}
function uloz(klic, hodnota) {
  try { localStorage.setItem(KLIC + klic, JSON.stringify(hodnota)); } catch { /* nevadí */ }
}
const navstivene = new Set(nacti('navstivene', []));
const rozbite = nacti('rozbite', {});          // id → čas, kdy přenos selhal
const nastaveni = Object.assign({ rezim: 'kamery', typ: 'vse', den: true, medailonek: true }, nacti('nastaveni', {}));
const ROZBITE_NA = 12 * 3600e3;                 // po 12 h to se stejnou kamerou zkusíme znovu
for (const [id, t] of Object.entries(rozbite)) if (Date.now() - t > ROZBITE_NA) delete rozbite[id];

/* ---------- oblíbené ----------
   Záznam: { id, nazev?, pozn?, pridano, polozka? }. U míst z katalogu se drží jen id
   (+ vlastní název a poznámka), vlastní místa nesou celou položku v `polozka`. */
let oblibene = nacti('oblibene2', null);
if (!Array.isArray(oblibene)) {
  // převod ze starší verze (jen seznam id)
  oblibene = nacti('oblibene', []).filter(id => PODLE_ID.has(id)).map(id => ({ id, pridano: new Date().toISOString() }));
  uloz('oblibene2', oblibene);
}
const ulozOblibene = () => uloz('oblibene2', oblibene);
const zaznam = id => oblibene.find(o => o.id === id);
const polozkaZaznamu = o => o.polozka || PODLE_ID.get(o.id) || null;
const zobrazNazev = k => zaznam(k.id)?.nazev || k.nazev;

/* ---------- slunce a čas ---------- */
// výška slunce nad obzorem (°) – zjednodušené vzorce, přesnost ~1° stačí na den/noc
function vyskaSlunce(lat, lon, kdy = new Date()) {
  const r = Math.PI / 180;
  const n = kdy.getTime() / 864e5 - 10957.5;           // dny od J2000
  const L = 280.46 + 0.9856474 * n;
  const g = (357.528 + 0.9856003 * n) * r;
  const lam = (L + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * r;
  const eps = (23.439 - 4e-7 * n) * r;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  const gmst = 280.46061837 + 360.98564736629 * n;
  const H = (gmst + lon) * r - ra;
  return Math.asin(Math.sin(lat * r) * Math.sin(dec) + Math.cos(lat * r) * Math.cos(dec) * Math.cos(H)) / r;
}
function mistniHodiny(k, kdy = new Date()) {
  try { return new Intl.DateTimeFormat('cs-CZ', { timeZone: k.tz, hour: '2-digit', minute: '2-digit' }).format(kdy); }
  catch { return '--:--'; }
}
function mistniHodina(k) {
  try { return +new Intl.DateTimeFormat('en-GB', { timeZone: k.tz, hour: 'numeric', hourCycle: 'h23' }).format(new Date()); }
  catch { return 12; }
}
// časové pásmo vlastního místa odhadneme z délky (Etc/GMT má obrácené znaménko)
function pasmoZDelky(lon) {
  const o = Math.max(-12, Math.min(14, Math.round(lon / 15)));
  return o === 0 ? 'UTC' : 'Etc/GMT' + (o > 0 ? '-' : '+') + Math.abs(o);
}
function faze(k) {
  if (k.lat == null) return k.typ === 'vesmir'
    ? { ikona: '🛰️', text: 'nad Zemí', svetlo: '#9fd0ff', den: true, noc: true }
    : { ikona: '', text: '', svetlo: '#ffe7a8', den: true, noc: true, nevime: true };
  const h = vyskaSlunce(k.lat, k.lon);
  const rano = mistniHodina(k) < 12;
  if (h > 8)   return { ikona: '☀️', text: 'den', svetlo: '#fff1c4', den: true };
  if (h > 0)   return { ikona: rano ? '🌄' : '🌇', text: rano ? 'ráno, slunce je nízko' : 'zlatá hodinka', svetlo: '#ffbe6b', den: true };
  if (h > -6)  return { ikona: '🌆', text: rano ? 'svítání' : 'soumrak', svetlo: '#c58bd6', den: h > -3 };
  if (h > -12) return { ikona: '🌃', text: rano ? 'před svítáním' : 'po setmění', svetlo: '#6d7fe0', noc: true };
  return { ikona: '🌙', text: 'noc', svetlo: k.typ === 'nebe' ? '#57e3a2' : '#3d55b8', noc: true };
}
function vzdalenost(k) {
  if (k.lat == null) return null;
  const r = Math.PI / 180, [a, b] = PRAHA;
  const d = Math.sin((k.lat - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(k.lat * r) * Math.sin((k.lon - b) * r / 2) ** 2;
  return Math.round(2 * 6371 * Math.asin(Math.sqrt(d)));
}
function vlajka(kod) {
  if (!kod) return '📌';
  if (!/^[A-Z]{2}$/.test(kod) || kod === 'UN') return '🛰️';
  return String.fromCodePoint(...[...kod].map(c => 127397 + c.charCodeAt(0)));
}

/* ---------- mapka kontinentu ----------
   Obrysy pevnin: Natural Earth 1:110m (volné dílo), zaokrouhlené na čtvrt stupně
   a delta-kódované v dvere_pevniny.js. Kreslí se ve válcové projekci se
   zkrácením délky podle kosinu střední šířky výřezu. */
const KONTINENTY = {
  evropa:     { nazev: 'Evropa', box: [-25, 34, 45, 72] },
  asie:       { nazev: 'Asie', box: [25, -11, 150, 60] },
  afrika:     { nazev: 'Afrika', box: [-20, -36, 55, 38] },
  sam:        { nazev: 'Severní Amerika', box: [-170, 5, -50, 75] },
  jam:        { nazev: 'Jižní Amerika', box: [-93, -57, -33, 13] },
  oceanie:    { nazev: 'Austrálie a Oceánie', box: [110, -48, 180, 0] },
  pacifik:    { nazev: 'Tichý oceán', box: [150, -50, 290, 25], posun: true },   // přes 180. poledník: západní délky +360°
  arktida:    { nazev: 'Arktida', box: [-75, 60, 60, 84] },
  antarktida: { nazev: 'Antarktida', box: [-180, -85, 180, -60] },
};
function kontinent(lat, lon) {
  if (lat < -60) return 'antarktida';
  if (lat > 72) return 'arktida';
  if (lon < -95 && lat < 5) return 'pacifik';
  if (lon >= -170 && lon < -30) return lat > 12 || (lat > 7 && lon < -77) ? 'sam' : 'jam';
  if (lon >= -30 && lon <= 42 && lat >= 35) return 'evropa';
  if (lon >= -30 && lon <= 52 && lat < 37.5 && !(lon > 34 && lat > 12)) return 'afrika';
  if ((lon >= 110 && lat < -9) || lon > 165 || lon < -170) return 'oceanie';
  return 'asie';
}
let prstence = null;
function pevniny() {
  if (prstence) return prstence;
  prstence = [];
  const txt = window.DVERE_PEVNINY || '';
  for (const r of txt.split('|')) {
    if (!r) continue;
    let x = 0, y = 0;
    const body = r.split(' ').map(p => { const [dx, dy] = p.split(','); x += +dx; y += +dy; return [x / 4, y / 4]; });
    let x0 = 180, x1 = -180, y0 = 90, y1 = -90;
    for (const [a, b] of body) { if (a < x0) x0 = a; if (a > x1) x1 = a; if (b < y0) y0 = b; if (b > y1) y1 = b; }
    prstence.push({ body, x0, x1, y0, y1 });
  }
  return prstence;
}
const mapkyCache = {};
function mapka(lat, lon) {
  if (lat == null) return '';
  const id = kontinent(lat, lon), K = KONTINENTY[id];
  const [x0, y0, x1, y1] = K.box;
  const L = d => K.posun && d < 0 ? d + 360 : d;
  const kx = Math.cos(((y0 + y1) / 2) * Math.PI / 180);
  const W = (x1 - x0) * kx, H = y1 - y0;
  if (!mapkyCache[id]) {
    let d = '';
    for (const p of pevniny()) {
      if (K.posun && p.x0 < 0 && p.x1 >= 0) continue;   // prstenec přes nultý poledník do tichomořského výřezu nepatří
      const px0 = L(p.x0), px1 = L(p.x1);
      if (px1 < x0 || px0 > x1 || p.y1 < y0 || p.y0 > y1) continue;
      // prstence rozříznuté 180. poledníkem: na skoku přes celou mapu začít nový úsek
      let pa = null, skok = false;
      d += p.body.map(([a0, b]) => {
        const a = L(a0);
        const cmd = pa === null || Math.abs(a - pa) > 180 ? 'M' : 'L';
        if (pa !== null && cmd === 'M') skok = true;
        pa = a;
        return cmd + ((a - x0) * kx).toFixed(1) + ' ' + (y1 - b).toFixed(1);
      }).join('') + (skok ? '' : 'Z');
    }
    mapkyCache[id] = d;
  }
  const px = (L(lon) - x0) * kx, py = y1 - lat, r = W * 0.016;
  return `<div class="mapka" title="${esc(K.nazev)}"><svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path class="souse" d="${mapkyCache[id]}"/>
    <circle class="vlna" cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="${(r * 1.6).toFixed(2)}" stroke-width="${(r * .35).toFixed(2)}"/>
    <circle class="bod" cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="${r.toFixed(2)}" stroke-width="${(r * .4).toFixed(2)}"/>
  </svg><span class="kontinent">${esc(K.nazev)}</span></div>`;
}

/* ---------- výběr místa ---------- */
function vhodneTed(k) {
  const f = faze(k);
  if (k.typ === 'vesmir' || f.nevime) return true;
  if (k.typ === 'nebe') return !!f.noc;
  return !!f.den;
}
function sbirkaRezimu() {
  if (nastaveni.typ === 'oblibene') return oblibene.map(polozkaZaznamu).filter(k => k && k.druh === druhRezimu());
  return nastaveni.rezim === 'sv' ? MISTA : KAMERY;
}
function kandidati(bezId) {
  let pool = sbirkaRezimu().filter(k => !rozbite[k.id] && k.id !== bezId);
  if (nastaveni.typ !== 'vse' && nastaveni.typ !== 'oblibene') pool = pool.filter(k => k.typ === nastaveni.typ);
  if (nastaveni.den && nastaveni.rezim !== 'sv') {   // panoramata nejsou živá, denní doba nehraje roli
    const ted = pool.filter(vhodneTed);
    if (ted.length) pool = ted;
  }
  return pool;
}
function vyber(bezId) {
  const pool = kandidati(bezId);
  if (!pool.length) return null;
  const nove = pool.filter(k => !navstivene.has(k.id));
  const z = nove.length ? nove : pool;
  return z[Math.floor(Math.random() * z.length)];
}

/* ---------- chodba ---------- */
const $ = id => document.getElementById(id);
const scena = $('scena'), vchod = $('vchod'), vyhled = $('vyhled');
let cil = null;            // kam vedou zavřené dveře
let aktualni = null;       // kde právě jsme
let styl = '';

function pripravDvere() {
  const moznosti = STYLY.filter(s => s !== styl);
  styl = moznosti[Math.floor(Math.random() * moznosti.length)];
  vchod.className = 'vchod ' + styl;
  cil = vyber(aktualni?.id);
  aktualni = null;
  ukazCil();
}
function ukazCil() {
  const vyzva = $('vyzva');
  if (!cil) {
    $('stitek').textContent = '🔒';
    vchod.style.removeProperty('--svetlo'); $('paprsek').style.removeProperty('--svetlo');
    vyzva.textContent = nastaveni.typ === 'oblibene'
      ? (nastaveni.rezim === 'sv' ? 'Mezi oblíbenými zatím nemáš žádné panorama – ulož si je hvězdičkou za dveřmi.' : 'Mezi oblíbenými zatím nemáš žádnou kameru – ulož si ji hvězdičkou za dveřmi.')
      : 'Tyhle dveře jsou zamčené – zkus jiný výběr.';
    vchod.disabled = true;
    return;
  }
  vchod.disabled = false;
  const f = faze(cil);
  $('stitek').textContent = f.nevime ? '★' : '🕐 ' + mistniHodiny(cil);
  vchod.style.setProperty('--svetlo', f.svetlo);
  $('paprsek').style.setProperty('--svetlo', f.svetlo);
  vchod.setAttribute('aria-label', f.nevime ? 'Otevřít dveře' : `Otevřít dveře (za nimi je teď ${mistniHodiny(cil)}, ${f.text})`);
  vyzva.textContent = f.nevime ? 'Klepni na dveře – vedou na jedno z tvých míst'
    : cil.druh === 'sv' ? 'Klepni na dveře – vedou na místo, kde je teď ' + mistniHodiny(cil)
    : 'Klepni na dveře – za nimi je teď ' + f.text;
}
function aktualizujPocet() {
  const vse = nastaveni.rezim === 'sv' ? MISTA : KAMERY;
  const byl = vse.filter(k => navstivene.has(k.id)).length;
  $('pocet').textContent = `Prošlé dveře: ${byl} z ${vse.length}`;
  $('tlOblibeneCh').textContent = `★ Oblíbené (${oblibene.length})`;
}
function vykresliCipy() {
  const cipy = $('cipy');
  const volby = [['vse', '✨ Kamkoli'], ...Object.entries(typy()).map(([id, t]) => [id, t.ikona + ' ' + t.nazev]), ['oblibene', '★ Jen oblíbené']];
  cipy.replaceChildren(...volby.map(([id, text]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cip'; b.textContent = text;
    b.setAttribute('aria-pressed', String(nastaveni.typ === id));
    b.addEventListener('click', () => {
      nastaveni.typ = id; uloz('nastaveni', nastaveni);
      vykresliCipy(); cil = vyber(); ukazCil();
    });
    return b;
  }));
}
function vykresliRezim() {
  for (const b of $('rezim').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.rezim === nastaveni.rezim));
  $('denniDobaObal').hidden = nastaveni.rezim === 'sv';
  $('podtitul').textContent = nastaveni.rezim === 'sv'
    ? 'Za každými dveřmi je panorama Street View z nějakého krásného místa. Kam vedou tyhle?'
    : 'Za každými dveřmi je živá kamera někde na Zemi. Kam vedou tyhle?';
}
function prepniRezim(rezim) {
  if (rezim === nastaveni.rezim) return;
  nastaveni.rezim = rezim;
  if (nastaveni.typ !== 'oblibene') nastaveni.typ = 'vse';   // kategorie se v režimech liší
  uloz('nastaveni', nastaveni);
  vykresliRezim(); vykresliCipy(); aktualizujPocet();
}
$('rezim').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  prepniRezim(b.dataset.rezim);
  cil = vyber(); ukazCil();
});
$('denniDoba').checked = nastaveni.den;
$('denniDoba').addEventListener('change', e => {
  nastaveni.den = e.target.checked; uloz('nastaveni', nastaveni);
  cil = vyber(); ukazCil();
});
// cedulka s časem se má hýbat, i když jen stojíme v chodbě
setInterval(() => { if (!aktualni && cil) ukazCil(); }, 20000);

/* ---------- přechod dveřmi ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pockej = ms => new Promise(r => setTimeout(r, reduce ? 10 : ms));
let animuji = false;

function vyrezDveri() {
  const r = vchod.querySelector('.otvor').getBoundingClientRect();
  const W = innerWidth, H = innerHeight;
  const kulate = styl === 's-hobit' ? '50%' : '4px';
  return `inset(${r.top}px ${W - r.right}px ${H - r.bottom}px ${r.left}px round ${kulate})`;
}

async function otevri(k) {
  if (animuji || !k) return;
  animuji = true;
  aktualni = k;
  vchod.classList.add('otevreno');
  vyhled.hidden = false;
  vyhled.classList.add('skryto');
  spust(k);                                   // přenos se načítá, zatímco se dveře otvírají
  vyhled.style.transition = 'none';
  vyhled.style.clipPath = vyrezDveri();
  await pockej(950);
  vyhled.style.clipPath = vyrezDveri();       // dveře se mezitím mohly posunout (změna okna)
  vyhled.classList.remove('skryto');
  $('zablesk').classList.add('zapnuto');
  void vyhled.offsetWidth;
  vyhled.style.transition = '';
  scena.classList.add('vstup');
  requestAnimationFrame(() => {
    vyhled.style.clipPath = 'inset(0 round 0)';
    $('zablesk').classList.remove('zapnuto');
  });
  await pockej(1000);
  vyhled.style.clipPath = '';
  animuji = false;
  $('tlJinam').focus({ preventScroll: true });
}

async function zavri() {
  if (animuji || vyhled.hidden) return;
  animuji = true;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  scena.classList.remove('vstup');
  vyhled.style.clipPath = 'inset(0 round 0)';
  void vyhled.offsetWidth;
  vyhled.style.clipPath = vyrezDveri();
  await pockej(950);
  vyhled.hidden = true;
  vyhled.style.clipPath = '';
  zrusPrehravac();
  vchod.classList.remove('otevreno');
  await pockej(700);
  pripravDvere();
  animuji = false;
  vchod.focus({ preventScroll: true });
}

async function jinam(k) {
  k = k || vyber(aktualni?.id);
  if (!k) return;
  const z = $('zablesk');
  z.classList.add('zapnuto');
  aktualni = k;
  spust(k);
  await pockej(120);
  z.classList.remove('zapnuto');
}
// otevřít konkrétní místo – z chodby přes dveře, ve výhledu rovnou
function jdiNa(k) {
  delete rozbite[k.id];
  if (k.druh !== druhRezimu()) prepniRezim(k.druh === 'sv' ? 'sv' : 'kamery');
  if (vyhled.hidden) { cil = k; ukazCil(); otevri(k); } else jinam(k);
}

/* ---------- YouTube ---------- */
let ytSlib = null;
function nactiYT() {
  if (window.YT && YT.Player) return Promise.resolve(YT);
  if (ytSlib) return ytSlib;
  ytSlib = new Promise((hotovo, chyba) => {
    const puvodni = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (puvodni) puvodni(); hotovo(YT); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { ytSlib = null; chyba(new Error('YouTube API se nenačetlo')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && YT.Player)) { ytSlib = null; chyba(new Error('timeout')); } }, 20000);
  });
  return ytSlib;
}

let prehravac = null, pokus = 0, hlidac = null, zmarenoZaSebou = 0, bezi = false;
const denik = [];   // posledních pár událostí přehrávače – pro testy a ladění
function zapis(k, zKanalu, co) { denik.push({ yt: k.yt, kanal: zKanalu, co, t: Date.now() }); if (denik.length > 40) denik.shift(); }

function zrusPrehravac() {
  clearTimeout(hlidac);
  pokus++;
  bezi = false;
  if (prehravac) { try { prehravac.destroy(); } catch { /* už neexistuje */ } prehravac = null; }
  $('prehravac').replaceChildren();
}
function zapisNavstevu(k) {
  navstivene.add(k.id); uloz('navstivene', [...navstivene]);
  aktualizujPocet();
}

async function spust(k, zKanalu = false) {
  if (k.druh === 'sv') { spustSV(k); return; }
  zrusPrehravac();
  const muj = pokus;
  zapisNavstevu(k);
  vykresliKartu(k, zKanalu ? 'kanal' : null);
  hlas('<div class="nacitam"></div><div>Otevírám dveře do místa ' + esc(zobrazNazev(k)) + '…</div>');
  let YTx;
  try { YTx = await nactiYT(); }
  catch {
    if (muj !== pokus) return;
    hlas('Přenosy z YouTube se nepodařilo načíst – jsi připojen(a) k internetu, nebo je YouTube blokovaný?',
      [['Zkusit znovu', () => spust(k)], ['Zpět na chodbu', zavri]]);
    return;
  }
  if (muj !== pokus) return;

  const obal = $('prehravac');
  const udalosti = {
    onReady: e => {
      if (muj !== pokus) return;
      try { e.target.mute(); e.target.playVideo(); } catch { /* nevadí */ }
    },
    onStateChange: e => {
      if (muj !== pokus) return;
      zapis(k, zKanalu, 'stav ' + e.data);
      if (e.data === YTx.PlayerState.PLAYING) {
        // stream mohl skončit a ID teď ukazuje jen záznam – pak zkusíme živý obraz kanálu
        let data = {};
        try { data = e.target.getVideoData() || {}; } catch { /* nevadí */ }
        if (data.isLive === false && !zKanalu && k.kanal) { spust(k, true); return; }
        bezi = true; zmarenoZaSebou = 0;
        clearTimeout(hlidac); hlas(null);
        if (zKanalu) vykresliKartu(k, 'kanal', data.title);
      } else if (e.data === YTx.PlayerState.ENDED) {
        if (!zKanalu && k.kanal) spust(k, true); else if (!k.vlastni) selhalo(k);
      }
    },
    onError: e => {
      if (muj !== pokus) return;
      zapis(k, zKanalu, 'chyba ' + e.data);
      // 152/153 = přehrávač nedostal adresu stránky (typicky stránka otevřená ze souboru);
      // za to kamera nemůže, takže ji neoznačujeme jako rozbitou a nepřeskakujeme
      if (e.data === 152 || e.data === 153) { chybiAdresa(k); return; }
      if (!zKanalu && k.kanal) spust(k, true);
      else if (k.vlastni) hlas('Tohle video YouTube nedovoluje přehrát ve stránce (chyba ' + e.data + ').' + odkazVen(k), [['🎲 Jinam', () => jinam()]]);
      else selhalo(k);
    },
  };
  const vars = { autoplay: 1, mute: 1, playsinline: 1, rel: 0, iv_load_policy: 3, modestbranding: 1 };
  if (/^https?:/.test(location.protocol)) vars.origin = location.origin;
  if (!zKanalu) {
    const misto = document.createElement('div');
    obal.appendChild(misto);
    prehravac = new YTx.Player(misto, { videoId: k.yt, host: 'https://www.youtube-nocookie.com', playerVars: vars, events: udalosti });
  } else {
    // živé vysílání kanálu – přes API jde jen vložením hotového iframu
    const f = document.createElement('iframe');
    const q = new URLSearchParams({ channel: k.kanal, enablejsapi: 1, ...vars });
    f.src = 'https://www.youtube.com/embed/live_stream?' + q;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.title = k.nazev;
    obal.appendChild(f);
    prehravac = new YTx.Player(f, { events: udalosti });
  }
  clearTimeout(hlidac);
  hlidac = setTimeout(() => {
    if (muj !== pokus || bezi) return;
    hlas('Přenos se zatím nerozběhl. Někdy stačí klepnout na ▶ v přehrávači.',
      [['🎲 Zkusit jiné dveře', () => jinam()]], true);
  }, 20000);
}

/* Street View: oficiální vložení panoramatu podle ID; „náhradní“ = starší vložení
   podle souřadnic, které si samo najde nejbližší aktuální panorama (pro případ,
   že Google původní snímek mezitím nahradil novým a ID přestalo platit). */
function urlSV(k, nahradni) {
  if (nahradni || !k.pano) return `https://maps.google.com/maps?layer=c&cbll=${k.lat},${k.lon}&cbp=12,${k.smer || 0},0,0,0&output=svembed&hl=cs`;
  return `https://www.google.com/maps/embed?pb=!4v1759700000000!6m8!1m7!1s${encodeURIComponent(k.pano)}!2m2!1d${k.lat}!2d${k.lon}!3f${k.smer || 0}!4f0!5f0.78&hl=cs`;
}
function spustSV(k, nahradni = false) {
  zrusPrehravac();
  const muj = pokus;
  zapisNavstevu(k);
  vykresliKartu(k, nahradni ? 'nahradni' : null);
  hlas('<div class="nacitam"></div><div>Otevírám dveře do místa ' + esc(zobrazNazev(k)) + '…</div>');
  const f = document.createElement('iframe');
  f.src = urlSV(k, nahradni);
  f.title = 'Street View – ' + k.nazev;
  f.allow = 'fullscreen; accelerometer; gyroscope';
  f.allowFullscreen = true;
  f.referrerPolicy = 'no-referrer-when-downgrade';
  f.addEventListener('load', () => {
    if (muj !== pokus) return;
    bezi = true; zmarenoZaSebou = 0; clearTimeout(hlidac); hlas(null);
  });
  $('prehravac').appendChild(f);
  clearTimeout(hlidac);
  hlidac = setTimeout(() => {
    if (muj !== pokus || bezi) return;
    hlas('Panorama se zatím nenačetlo.', [['🔄 Náhradní pohled', () => spustSV(k, true)], ['🎲 Jinam', () => jinam()]], true);
  }, 20000);
}

function odkazVen(k) {
  return `<br><a href="${esc(odkazNa(k))}" target="_blank" rel="noopener">Otevřít přímo na ${k.druh === 'sv' ? 'Mapách Google' : 'YouTube'} ↗</a>`;
}
function chybiAdresa(k) {
  clearTimeout(hlidac);
  const zeSouboru = location.protocol === 'file:';
  hlas((zeSouboru
      ? 'YouTube nepřehrává videa ve stránce otevřené přímo ze souboru (file://) – chybí mu adresa webu.<br>Otevři stránku přes web nebo místní server (<code>./test_local.sh</code> → http://localhost:8000).'
      : 'YouTube odmítl přehrát přenos ve stránce (chyba konfigurace přehrávače). Pomůže otevřít stránku přes http(s) a nevypínat v prohlížeči odesílání adresy stránky (Referer).') +
    odkazVen(k),
    [['🌐 Zkusit Street View', () => { prepniRezim('sv'); jinam(); }],
     ['🚪 Zpět na chodbu', zavri]]);
}

function selhalo(k) {
  rozbite[k.id] = Date.now(); uloz('rozbite', rozbite);
  zmarenoZaSebou++;
  if (zmarenoZaSebou >= 4) {
    zmarenoZaSebou = 0;
    hlas('Několik dveří po sobě vedlo do zdi. Možná je problém s připojením.',
      [['🎲 Zkusit další', () => jinam()], ['🚪 Zpět na chodbu', zavri]]);
    return;
  }
  hlas('Za těmito dveřmi je dnes zavřeno – přenos neběží. Otevírám jiné…');
  const muj = pokus;
  setTimeout(() => { if (muj === pokus && !vyhled.hidden) jinam(); }, 1600);
}

/* ---------- odkazy ---------- */
function odkazNa(k) {
  if (k.druh === 'kamera') return 'https://www.youtube.com/watch?v=' + encodeURIComponent(k.yt);
  if (k.pano) return `https://www.google.com/maps/@?api=1&map_action=pano&pano=${encodeURIComponent(k.pano)}&heading=${k.smer || 0}`;
  return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${k.lat},${k.lon}&heading=${k.smer || 0}`;
}

/* ---------- medailonek ---------- */
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

let kartaStav = null;
function vykresliKartu(k, rezim, titulKanalu) {
  kartaStav = { k, rezim, titulKanalu };
  const t = typyDruhu(k)[k.typ] || VLASTNI;
  const f = faze(k);
  const km = vzdalenost(k);
  const o = zaznam(k.id);
  const nazev = o?.nazev || k.nazev;
  const cas = f.nevime ? '' : `<div class="cas"><span>${k.lat == null ? 'čas UTC' : 'místní čas'} <b>${mistniHodiny(k)}</b></span><span>${f.ikona} ${esc(f.text)}</span>${km != null ? `<span>📍 ${km.toLocaleString('cs-CZ')} km od Prahy</span>` : ''}</div>`;
  const url = rezim === 'kanal' ? 'https://www.youtube.com/channel/' + encodeURIComponent(k.kanal) + '/live' : odkazNa(k);
  const zdroj = k.druh === 'sv'
    ? `Panorama Google Street View (není živě) · <a href="${esc(url)}" target="_blank" rel="noopener">otevřít v Mapách ↗</a> · ${rezim === 'nahradni'
        ? '<button type="button" data-akce="puvodni">původní pohled</button>'
        : '<button type="button" data-akce="nahradni" title="Když panorama zůstane černé">nic nevidím?</button>'}`
    : `${k.vlastni ? 'YouTube' : 'Živě z YouTube'} · <a href="${esc(url)}" target="_blank" rel="noopener">otevřít zdroj ↗</a>`;
  $('karta').innerHTML = `
    <div class="hlavicka"><div class="typ">${t.ikona} ${esc(t.nazev)}</div>
      <button type="button" class="skryt" data-akce="skryt" title="Skrýt medailonek (I) – znovu ho otevřeš tlačítkem ⓘ v liště" aria-label="Skrýt medailonek">✕</button></div>
    <h2>${vlajka(k.zeme)} ${esc(nazev)}</h2>
    ${o?.nazev && o.nazev !== k.nazev ? `<div class="puvodni">${esc(k.nazev)}</div>` : ''}
    ${k.misto ? `<div class="misto">${esc(k.misto)}</div>` : ''}
    ${mapka(k.lat, k.lon)}
    ${cas}
    ${k.popis ? `<div class="popis">${esc(k.popis)}</div>` : ''}
    ${o?.pozn ? `<div class="poznamka">📝 ${esc(o.pozn)}</div>` : ''}

function prepniUlozeni() {
  if (!aktualni) return;
  const k = aktualni;
  const i = oblibene.findIndex(o => o.id === k.id);
  if (i >= 0) {

    toast('Odebráno z oblíbených.', ['Vrátit', () => { oblibene.splice(i, 0, puvodni); ulozOblibene(); aktualizujPocet(); prekresliKartu(); }]);
  } else {
    oblibene.unshift({ id: k.id, pridano: new Date().toISOString(), ...(k.vlastni ? { polozka: k } : {}) });
    ulozOblibene(); aktualizujPocet(); prekresliKartu();
    toast('Uloženo do oblíbených.', ['✎ Přidat poznámku', () => upravit(k.id)]);

}

function rozeberOdkaz(text) {
  text = text.trim();
  if (!text) return { chyba: 'Vlož odkaz.' };
  let m = text.match(/(?:youtu\.be\/|[?&]v=|\/(?:embed|live|shorts|v)\/)([\w-]{11})(?![\w-])/);
  if (m) return { druh: 'kamera', yt: m[1] };
  if (/^[\w-]{11}$/.test(text)) return { druh: 'kamera', yt: text };
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/.test(text))
    return { chyba: 'Zkrácené odkazy maps.app.goo.gl stránka neumí rozbalit – otevři ho v prohlížeči a zkopíruj plnou adresu z adresního řádku.' };
  const pano = text.match(/!1s([\w-]{16,})!2e0/)?.[1] || text.match(/[?&]pano=([\w-]{16,})/)?.[1] || null;
  m = text.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)(?:,[^/]*?(\d+(?:\.\d+)?)h)?/);
  if (m) return { druh: 'sv', lat: +m[1], lon: +m[2], smer: Math.round(+(m[3] || 0)), pano };
  m = text.match(/(?:cbll|viewpoint)=(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);
  if (m) return { druh: 'sv', lat: +m[1], lon: +m[2], smer: Math.round(+(text.match(/heading=(-?\d+(?:\.\d+)?)/)?.[1] || 0)), pano };
  m = text.match(/^(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)$/);
  if (m) return { druh: 'sv', lat: +m[1], lon: +m[2], smer: 0, pano: null };
  return { chyba: 'Odkaz nepoznávám – vlož odkaz na YouTube nebo na Street View v Mapách Google.' };
}
const cislo = s => { const v = parseFloat(String(s).replace(',', '.')); return Number.isFinite(v) ? v : null; };

let upravovane = null;     // id upravovaného záznamu, nebo null = nový vlastní
function upravit(id) {
  upravovane = id;
  const o = id ? zaznam(id) : null;
  const k = o ? polozkaZaznamu(o) : null;
  const vlastni = !o || !!k?.vlastni;

  $('formOdkaz').value = vlastni && k ? odkazNa(k) : '';
  $('formNazev').value = o?.nazev || k?.nazev || '';
  $('formNazev').placeholder = k?.nazev || 'Jak se místo jmenuje';
  $('formMisto').value = k?.vlastni ? k.misto || '' : '';
  $('formLat').value = k?.vlastni && k.lat != null ? k.lat : '';
  $('formLon').value = k?.vlastni && k.lon != null ? k.lon : '';
  $('formPozn').value = o?.pozn || '';
  $('formChyba').hidden = true;
  $('formDlg').showModal();
  (vlastni && !o ? $('formOdkaz') : $('formNazev')).focus();
}

$('form').addEventListener('submit', e => {
  e.preventDefault();

  const k = o ? polozkaZaznamu(o) : null;

    if (!nazev) return chyba('Vyplň název.');
    let lat = cislo($('formLat').value), lon = cislo($('formLon').value);
    if ((lat == null) !== (lon == null) || (lat != null && (Math.abs(lat) > 90 || Math.abs(lon) > 180)))
      return chyba('Souřadnice vyplň obě (šířka −90 až 90, délka −180 až 180), nebo je nech prázdné.');
    if (r.druh === 'sv' && lat == null) return chyba('Street View potřebuje souřadnice.');
    const polozka = {
      id: k?.id || 'vl:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),

      lat, lon, tz: lat != null ? pasmoZDelky(lon) : 'UTC', popis: '',

    };
    if (o) { o.polozka = polozka; o.nazev = undefined; o.pozn = pozn || undefined; }

async function smazat(id) {

function vykresliOblibene() {
  const hledane = $('oblHledat').value.trim().toLowerCase();
  const radit = $('oblRadit').value;
  let polozky = oblibene.map(o => ({ o, k: polozkaZaznamu(o) })).filter(x => x.k);
  if (hledane) polozky = polozky.filter(({ o, k }) => [o.nazev, o.pozn, k.nazev, k.misto, k.popis].join(' ').toLowerCase().includes(hledane));
  if (radit === 'nazev') polozky.sort((a, b) => (a.o.nazev || a.k.nazev).localeCompare(b.o.nazev || b.k.nazev, 'cs'));
  else if (radit === 'druh') polozky.sort((a, b) => a.k.druh.localeCompare(b.k.druh) || (a.o.nazev || a.k.nazev).localeCompare(b.o.nazev || b.k.nazev, 'cs'));
  $('oblTitul').textContent = `★ Oblíbená místa (${oblibene.length})`;
  const ul = $('oblSeznam');

  if (!polozky.length) {
    ul.innerHTML = `<li class="prazdno" style="display:block;border:0;background:none">${oblibene.length
      ? 'Nic neodpovídá hledání.'
      : 'Zatím tu nic není.<br>Za dveřmi ulož místo tlačítkem ☆ Uložit, nebo přidej vlastní odkaz na YouTube či Street View.'}</li>`;
    return;
  }
  for (const { o, k } of polozky) {
    const li = document.createElement('li');
    const datum = o.pridano ? new Date(o.pridano).toLocaleDateString('cs-CZ') : '';
    li.innerHTML = `<div class="obl-ikona">${k.druh === 'sv' ? '🌐' : '📡'}</div>
      <div class="obl-text"><b>${vlajka(k.zeme)} ${esc(o.nazev || k.nazev)}</b>
        <div class="m">${esc([o.nazev && o.nazev !== k.nazev ? k.nazev : '', k.misto, k.vlastni ? 'vlastní místo' : '', datum && 'uloženo ' + datum].filter(Boolean).join(' · '))}</div>
        ${o.pozn ? `<div class="p">📝 ${esc(o.pozn)}</div>` : ''}</div>
      <div class="obl-akce">
        <button type="button" data-a="otevrit">▶ Otevřít</button>
        <button type="button" data-a="upravit">✎ Upravit</button>
        <button type="button" data-a="odkaz" title="Otevřít zdroj v nové záložce">↗</button>
        <button type="button" data-a="smazat" title="Odebrat z oblíbených">🗑</button>
      </div>`;
    li.addEventListener('click', e => {
      const a = e.target.closest('button')?.dataset.a;
      if (a === 'otevrit') { $('oblDlg').close(); jdiNa(k); }

      else if (a === 'odkaz') window.open(odkazNa(k), '_blank', 'noopener');
      else if (a === 'smazat') smazat(o.id);
    });
    ul.appendChild(li);
  }
}

function celaObrazovka() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else vyhled.requestFullscreen?.().catch(() => {});
}
$('tlCela').addEventListener('click', celaObrazovka);
if (!document.fullscreenEnabled) $('tlCela').hidden = true;

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
  if (e.target.closest('input, textarea, select')) return;
  if (vyhled.hidden) return;
  const k = e.key.toLowerCase();
  if (k === 'escape' && !document.fullscreenElement) { e.preventDefault(); zavri(); }
  else if (k === 'n') jinam();
  else if (k === 'i') medailonek();
  else if (k === 's') prepniUlozeni();
  else if (k === 'f') celaObrazovka();
});

/* pro testy */
window.DVERE = { KAMERY, MISTA, vyskaSlunce, faze, vyber, kandidati, nastaveni, rozbite, otevri, zavri, jinam, jdiNa, denik,
  rozeberOdkaz, kontinent, mapka, oblibene: () => oblibene, stav: () => ({ cil, aktualni, styl, bezi, animuji }) };

medailonek(nastaveni.medailonek);
vykresliRezim();
vykresliCipy();
aktualizujPocet();
pripravDvere();
})();
