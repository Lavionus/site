<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tank 1990</title>
<script src="../podpis.js" defer></script>
<style>
  :root { --bg: #000; --fg: #bcbcbc; --tlumena: #7c7c7c; --tlac: #2a2a2a; --tlac-okraj: #555; --cervena: #d82800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body { font-family: 'Courier New', monospace; overflow: hidden; touch-action: manipulation; }
  #obal { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; }
  #cv { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; touch-action: none; }
  #info { font-size: 12px; line-height: 1.5; text-align: center; color: var(--tlumena); max-width: 760px; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; align-items: center; }
  #info b { color: var(--fg); font-weight: normal; }
  #zvukBtn { background: var(--tlac); color: var(--fg); border: 1px solid var(--tlac-okraj); border-radius: 4px; font-size: 14px; padding: 1px 8px; cursor: pointer; }
  #dotyk { display: none; width: 100%; max-width: 520px; justify-content: space-between; align-items: center; user-select: none; -webkit-user-select: none; }
  body.dotykove #dotyk { display: flex; }
  body.dotykove .klavesnice { display: none; }
  #kriz { width: 132px; height: 132px; border-radius: 50%; background: var(--tlac); border: 2px solid var(--tlac-okraj); position: relative; touch-action: none; }
  #kriz::before, #kriz::after { content: ''; position: absolute; background: #444; border-radius: 4px; }
  #kriz::before { left: 50%; top: 14px; bottom: 14px; width: 34px; transform: translateX(-50%); }
  #kriz::after { top: 50%; left: 14px; right: 14px; height: 34px; transform: translateY(-50%); }
  .prave { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #palba { width: 84px; height: 84px; border-radius: 50%; background: var(--cervena); border: 3px solid #fc7460; color: #fff; font: bold 18px 'Courier New', monospace; touch-action: none; }
  #startBtn { padding: 6px 14px; border-radius: 14px; background: var(--tlac); border: 1px solid var(--tlac-okraj); color: var(--fg); font: 12px 'Courier New', monospace; touch-action: none; }
</style>
</head>
<body>
<div id="obal">
  <canvas id="cv" width="256" height="224" aria-label="Herní plocha Tank 1990"></canvas>
  <div id="dotyk" aria-hidden="true">
    <div id="kriz"></div>
    <div class="prave">
      <button id="startBtn" type="button">START / PAUZA</button>
      <button id="palba" type="button">A</button>
    </div>
  </div>
  <div id="info">
    <span class="klavesnice"><b>Hráč 1:</b> WASD + mezerník (sám hraje i šipkami + Enter)</span>
    <span class="klavesnice"><b>Hráč 2:</b> šipky + Enter / pravý Ctrl</span>
    <span class="klavesnice"><b>P / Esc</b> pauza · <b>M</b> zvuk</span>
    <span>Gamepad funguje. Chraň orla dole!</span>
    <button id="zvukBtn" type="button">🔊</button>
  </div>
</div>
<script src="tank1990/mapy.js"></script>
<script src="tank1990/hra.js"></script>
<script src="tank1990/grafika.js"></script>
<script src="tank1990/zvuk.js"></script>
<script src="tank1990/ui.js"></script>
<script>TANK.ui.start();</script>
</body>
</html>
