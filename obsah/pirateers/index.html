<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirateers - Pirátská bitva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui" class="hidden">
            <div class="player-only">HP: <span id="hp-value">100 / 100</span></div>
            <div class="player-only">Plachty: <span id="sails-value">▯▯▯▯▯</span></div>
            <div class="player-only">Děla: <span id="reload-value">nabito</span></div>
            <div>Skóre: <span id="score-value">0</span></div>
            <div id="alive">Modří: <span id="alive-blue">0</span> &nbsp;|&nbsp; Rudí: <span id="alive-red">0</span></div>
            <div id="upgrades" class="player-only">Náklad: <span id="upgrades-value">—</span></div>
        </div>
        <div id="controls">W/&uarr; – povolit plachty &nbsp;|&nbsp; S/&darr; – zatáhnout &nbsp;|&nbsp; A/D nebo &larr;&rarr; – kormidlo &nbsp;|&nbsp; Mezerník – boční salva &nbsp;|&nbsp; P – pauza &nbsp;|&nbsp; Esc – menu</div>

        <div id="menu">
            <h1>Pirateers</h1>

            <div class="row">
                <label><input type="radio" name="mode" id="mode-ffa" checked> Volná bitva – všichni proti tobě</label>
                <label><input type="radio" name="mode" id="mode-teams"> Dva týmy proti sobě</label>
            </div>

            <div class="row" id="row-opponents">
                <label for="opponents">Počet protihráčů: <span id="opponents-value">3</span></label>
                <input type="range" id="opponents" min="1" max="10" value="3">
            </div>

            <div class="row hidden" id="row-team-size">
                <label for="team-size">Lodí v každém týmu: <span id="team-size-value">3</span></label>
                <input type="range" id="team-size" min="1" max="6" value="3">
            </div>

            <div class="row hidden" id="row-spectate">
                <label><input type="checkbox" id="spectate"> Jen přihlížím (AI proti AI)</label>
            </div>

            <div class="row">
                <label for="difficulty">Posádky nepřátel: <span id="difficulty-value">Ostřílení</span></label>
                <input type="range" id="difficulty" min="0" max="2" value="1">
            </div>

            <div class="row">
                <label for="islands">Mapa: <span id="islands-value">Středně</span></label>
                <input type="range" id="islands" min="0" max="3" value="2">
            </div>

            <div class="row">
                <label><input type="checkbox" id="random-map" checked> Nová mapa pro každou bitvu</label>
            </div>

            <div class="row seed-row">
                <label for="seed">Seed mapy (když se nelosuje)</label>
                <input type="number" id="seed" value="1" min="0" step="1">
                <button id="dice" type="button" class="secondary" title="Náhodný seed">🎲</button>
            </div>

            <div class="row legend">
                <label>Vylepšení z vraků (⚒ tesaři opravují trup i sami, 6 s po posledním zásahu)</label>
                <div id="upgrade-list"></div>
            </div>

            <button id="start-btn" type="button">Vyplout</button>
        </div>

        <div id="game-over" class="hidden">
            <h1 id="go-title">Hra skončila!</h1>
            <p>Skóre: <span id="final-score">0</span></p>
            <button id="restart-btn" type="button">Hrát znovu</button>
            <button id="menu-btn" type="button" class="secondary">Menu</button>
        </div>
    </div>
    <script type="module" src="js/game.js"></script>
</body>
</html>
