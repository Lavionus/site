<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nad krajinou – simulátor dronu</title>
<meta name="description" content="Simulátor letu dronem v přirozené 3D krajině: kamerový dron i FPV, letová škola, fotomise a závody.">
<script src="../podpis.js" defer></script>
<style>
  :root { --bg: #0b0f14; --fg: #e8edf2; --tlumena: #9aa7b4; --panel: rgba(12, 18, 26, 0.82); --okraj: rgba(255, 255, 255, 0.14); --akcent: #7fd1ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #obal { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  #scena { display: block; position: absolute; inset: 0; }
  #osd, #menu, #dotyk { position: absolute; inset: 0; pointer-events: none; }
  #menu > *, #dotyk > * { pointer-events: auto; }
  #nacitani { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at 50% 30%, #23384d 0%, #0b0f14 70%); z-index: 20; }
  #nacitani[hidden] { display: none; }
  #nacitani h1 { font-weight: 300; letter-spacing: 0.08em; font-size: clamp(26px, 6vw, 44px); }
  #nacitani .text { color: var(--tlumena); font-size: 14px; min-height: 1.4em; }
  #nacitani .pruh { width: min(320px, 70vw); height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  #nacitani .pruh i { display: block; height: 100%; width: 0; background: var(--akcent); transition: width 0.2s; }
</style>
</head>
<body>
<div id="obal">
  <canvas id="scena" aria-label="Pohled z dronu nad krajinou"></canvas>
  <div id="osd" aria-live="polite"></div>
  <div id="dotyk"></div>
  <div id="menu"></div>
  <div id="nacitani"><h1>Nad krajinou</h1><div class="pruh"><i></i></div><div class="text">Načítám…</div></div>
</div>
<script src="lib/three.0.160.0.min.js"></script>
<script src="dron/nahoda.js"></script>
<script src="dron/sum.js"></script>
<script src="dron/spolecne.js"></script>
<script src="dron/teren.js"></script>
<script src="dron/rizeni.js"></script>
<script src="dron/fyzika.js"></script>
<script src="dron/kolize.js"></script>
<script src="dron/autopilot.js"></script>
<script src="dron/vstup.js"></script>
<script src="dron/zvuk.js"></script>
<script src="dron/obloha.js"></script>
<script src="dron/pocasi.js"></script>
<script src="dron/post.js"></script>
<script src="dron/textury.js"></script>
<script src="dron/terenvykres.js"></script>
<script src="dron/voda.js"></script>
<script src="dron/vegetace.js"></script>
<script src="dron/stavby.js"></script>
<script src="dron/zvirata.js"></script>
<script src="dron/dronmodel.js"></script>
<script src="dron/kamera.js"></script>
<script src="dron/osd.js"></script>
<script src="dron/mise.js"></script>
<script src="dron/ui.js"></script>
<script src="dron/hra.js"></script>
</body>
</html>
