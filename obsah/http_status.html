<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 HTTP stavové kódy</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.container{max-width:860px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:14px;font-weight:600;text-align:center}
.search{width:100%;background:var(--border);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:12px;font-size:1rem;margin-bottom:14px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.cat{padding:7px 14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:.84rem}
.cat.active{background:var(--accent);border-color:var(--accent);color:#fff}
.code-item{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin-bottom:8px;display:flex;gap:16px;align-items:start}
.code-item .num{font-size:1.6rem;font-weight:700;min-width:60px}
.code-item .info{flex:1}
.code-item .name{font-weight:600;font-size:1.05rem}
.code-item .desc{font-size:.85rem;color:var(--text-faint);margin-top:3px}
.c1{color:#3498db}.c2{color:#27ae60}.c3{color:#f1c40f}.c4{color:#e67e22}.c5{color:#e74c3c}
.empty{text-align:center;color:var(--text-faint);padding:30px}

/* světlý režim: dorovnání kontrastu textu */
:root[data-theme="light"] .num.c2 { color: #1e864a; }
:root[data-theme="light"] .num.c3 { color: #8e7409; }
:root[data-theme="light"] .num.c4 { color: #b1611a; }
</style>
</head>
<body>
<div class="container">
  <h1>🌐 HTTP stavové kódy</h1>
  <input class="search" id="search" placeholder="🔍 Hledat (404, not found, přesměrování…)">
  <div class="cats" id="cats">
    <div class="cat active" data-c="">Vše</div>
    <div class="cat" data-c="1">1xx Info</div>
    <div class="cat" data-c="2">2xx Úspěch</div>
    <div class="cat" data-c="3">3xx Přesměrování</div>
    <div class="cat" data-c="4">4xx Chyba klienta</div>
    <div class="cat" data-c="5">5xx Chyba serveru</div>
  </div>
  <div id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const CODES=[
  [100,'Continue','Pokračuj – server přijal hlavičky, klient může poslat tělo požadavku.'],
  [101,'Switching Protocols','Server přepíná protokol (např. na WebSocket).'],
  [200,'OK','Požadavek byl úspěšný.'],
  [201,'Created','Zdroj byl úspěšně vytvořen (typicky po POST).'],
  [202,'Accepted','Požadavek přijat ke zpracování, ale ještě nedokončen.'],
  [203,'Non-Authoritative Information','Odpověď prošla proxy, které ji upravilo — nemusí být totožná s originálem.'],
  [204,'No Content','Úspěch, ale není co vrátit (prázdné tělo).'],
  [206,'Partial Content','Vrácena část zdroje (Range požadavek, stahování).'],
  [207,'Multi-Status','WebDAV: jedna odpověď nese více nezávislých výsledků.'],
  [300,'Multiple Choices','Existuje víc možností, klient si má vybrat.'],
  [301,'Moved Permanently','Zdroj trvale přesunut na novou URL.'],
  [302,'Found','Dočasné přesměrování na jinou URL.'],
  [303,'See Other','Výsledek najdeš na jiné adrese — načti ji metodou GET (typicky po odeslání formuláře).'],
  [304,'Not Modified','Zdroj se nezměnil, použij verzi z cache.'],
  [307,'Temporary Redirect','Dočasné přesměrování se zachováním metody.'],
  [308,'Permanent Redirect','Trvalé přesměrování se zachováním metody.'],
  [400,'Bad Request','Chybný požadavek – server mu nerozumí.'],
  [401,'Unauthorized','Vyžadováno přihlášení / chybí autentizace.'],
  [402,'Payment Required','Rezervováno pro platbu; v praxi ho používají některá API pro vyčerpaný kredit.'],
  [403,'Forbidden','Přístup zakázán, i když je klient ověřen.'],
  [404,'Not Found','Hledaný zdroj nebyl nalezen.'],
  [405,'Method Not Allowed','HTTP metoda není pro tento zdroj povolena.'],
  [406,'Not Acceptable','Server neumí odpovědět v žádném formátu, který klient přijímá (hlavička Accept).'],
  [407,'Proxy Authentication Required','Je potřeba se nejdřív přihlásit k proxy serveru.'],
  [408,'Request Timeout','Klient neposlal požadavek včas.'],
  [409,'Conflict','Konflikt se stavem zdroje (např. duplicita).'],
  [410,'Gone','Zdroj byl trvale odstraněn.'],
  [411,'Length Required','Chybí hlavička Content-Length.'],
  [412,'Precondition Failed','Podmínka v hlavičce (If-Match apod.) neplatí — obvykle konflikt souběžných úprav.'],
  [413,'Payload Too Large','Tělo požadavku je příliš velké.'],
  [414,'URI Too Long','Adresa je příliš dlouhá — typicky moc parametrů v query stringu.'],
  [415,'Unsupported Media Type','Server neumí zpracovat formát těla požadavku (špatný Content-Type).'],
  [416,'Range Not Satisfiable','Požadovaný rozsah bajtů mimo velikost souboru.'],
  [418,'I\'m a teapot','Žertovný kód (RFC 2324) – jsem konvička na čaj. ☕'],
  [422,'Unprocessable Entity','Data jsou syntakticky OK, ale sémanticky chybná (validace).'],
  [423,'Locked','Zdroj je zamčený.'],
  [425,'Too Early','Server odmítá zpracovat požadavek poslaný příliš brzy (ochrana proti replay).'],
  [426,'Upgrade Required','Klient musí přejít na jiný protokol (např. TLS nebo HTTP/2).'],
  [428,'Precondition Required','Server vyžaduje podmíněný požadavek, aby předešel přepsání cizích změn.'],
  [429,'Too Many Requests','Příliš mnoho požadavků – rate limit.'],
  [431,'Request Header Fields Too Large','Hlavičky požadavku jsou příliš velké — často přerostlé cookies.'],
  [451,'Unavailable For Legal Reasons','Obsah je nedostupný z právních důvodů (cenzura, autorská práva).'],
  [500,'Internal Server Error','Obecná chyba na straně serveru.'],
  [501,'Not Implemented','Server neumí metodu zpracovat.'],
  [502,'Bad Gateway','Chybná odpověď od nadřazeného serveru (proxy/gateway).'],
  [503,'Service Unavailable','Služba dočasně nedostupná (přetížení/údržba).'],
  [504,'Gateway Timeout','Nadřazený server neodpověděl včas.'],
  [505,'HTTP Version Not Supported','Server nepodporuje verzi HTTP z požadavku.'],
  [507,'Insufficient Storage','Serveru došlo místo pro uložení dat.'],
  [511,'Network Authentication Required','Nejdřív se musíš přihlásit k síti (přihlašovací stránka veřejné Wi-Fi).'],
];
let activeCat='';
document.querySelectorAll('.cat').forEach(c=>c.onclick=()=>{activeCat=c.dataset.c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));c.classList.add('active');render();});
function render(){
  const q=$('search').value.toLowerCase().trim();
  const list=CODES.filter(([num,name,desc])=>{
    if(activeCat&&String(num)[0]!==activeCat)return false;
    if(!q)return true;
    return String(num).includes(q)||name.toLowerCase().includes(q)||desc.toLowerCase().includes(q);
  });
  $('list').innerHTML=list.length?list.map(([num,name,desc])=>`<div class="code-item"><div class="num c${String(num)[0]}">${num}</div><div class="info"><div class="name">${name}</div><div class="desc">${desc}</div></div></div>`).join(''):'<div class="empty">Nic nenalezeno 🤷</div>';
}
$('search').oninput=render;
render();
</script>
</body>
</html>
