<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Země v kostce pro cestovatele</title>
<meta name="description" content="Praktické údaje o státech světa: zásuvky a napětí (potřebuji adaptér?), strana jízdy, tísňová čísla, měna, předvolba, čas, spropitné, pitná voda, dálniční poplatky, plán cesty přes více zemí (sada adaptérů), plánovač hovorů přes časová pásma, kurzy a tahák měn, porovnání zemí, mapa, kontrolní seznam a tisk.">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<script src="../theme.js"></script>
<script src="../dialog.js"></script>
<script src="../podpis.js" defer></script>
<script src="zeme_v_kostce/data.js"></script>
<script src="zeme_v_kostce/jadro.js"></script>
<script src="zeme_v_kostce/zasuvky.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-deep,var(--bg));color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.lista{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.lista::-webkit-scrollbar{display:none}
.lista > *{flex-shrink:0}
.lista h1{font-size:1.02rem;font-weight:600;white-space:nowrap;margin:0 6px 0 0}
.lista .skup{display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:1px 4px 3px;border-radius:9px;background:color-mix(in srgb,var(--bg-control) 45%,transparent);border:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.lista .skup-nazev{font-size:9.5px;line-height:1.25;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);text-align:center;user-select:none}
.lista .skup-tl{display:flex;align-items:center;gap:2px}
.lista .skup-hledat{flex:1 1 170px;flex-shrink:1;min-width:140px;background:none;border-color:transparent;padding:0}
.lista .skup-hledat .vstup{width:100%}
.lista .vpravo{margin-left:auto;display:flex;gap:4px}
.samostatne .lista{padding-right:72px}
.tl{background:var(--bg-control);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:.84rem;white-space:nowrap;font-family:inherit;line-height:1.3}
.tl:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.tl:focus-visible,.btn:focus-visible,.vstup:focus{outline:2px solid var(--accent);outline-offset:1px}
.tl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
select.tl{padding:4px 6px}
@media (max-width:1100px){.lista .txt{display:none}}
.nabidka{position:fixed;z-index:1100;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:250px;max-height:calc(100vh - 70px);overflow-y:auto}
.nabidka .tl{display:flex;align-items:center;gap:6px;text-align:left;background:none;border-color:transparent;padding:6px 10px;text-decoration:none}
.nabidka .tl:hover{background:var(--bg-hover)}
.nabidka hr{border:0;border-top:1px solid var(--border);margin:4px 0}
[hidden]{display:none !important}
.btn{background:var(--bg-control);color:var(--text);border:1px solid var(--border-strong);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:.84rem;white-space:nowrap;font-family:inherit;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bg-hover)}
.btn.mini{padding:3px 8px;font-size:.78rem}
.vstup{background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 9px;font-size:.86rem;font-family:inherit;min-width:0}

main{flex:1;min-height:0;overflow:auto;padding:12px clamp(10px,2.5vw,24px) 40px}
main.mapa-rezim{padding:0;overflow:hidden;display:flex;flex-direction:column}
.obal{max-width:1200px;margin:0 auto}
h2{font-size:1.1rem;margin:4px 0 10px}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:0 0 6px}
.tip{font-size:.8rem;color:var(--text-muted);margin:4px 0 10px;line-height:1.45}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius,8px);padding:10px 12px;min-width:0}
.radek-vyber{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.radek-vyber .vstup{max-width:100%}
.nejiste{font-size:.72rem;color:var(--warn);white-space:nowrap;cursor:help}
.vlajka{font-size:1.3em;margin-right:4px}

/* tabulka přehledu */
.tab-obal{overflow-x:auto;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--text-muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg-hover)}
td.nw{white-space:nowrap}
.typ{display:inline-block;min-width:1.5em;text-align:center;font-weight:700;font-size:.78rem;border:1px solid var(--border-strong);border-radius:5px;padding:0 4px;margin:1px}
.stav{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stav.ne,.stav.ok{background:var(--ok)} .stav.cast{background:var(--warn)} .stav.ano,.stav.menic{background:var(--danger)}

/* karta země */
.karta-hlava{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.karta-hlava h2{margin:0;font-size:1.5rem}
.karta-hlava .podnadpis{color:var(--text-muted);font-size:.85rem}
.mrizka{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;align-items:start}
.udaj{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem;line-height:1.4}
.udaj dt{color:var(--text-muted)} .udaj dd{margin:0}
.udaj.blok{grid-template-columns:1fr;gap:0} .udaj.blok dd{margin-bottom:6px}
.udaj dd.nw{white-space:nowrap}
.zasuvky{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 8px}
.zasuvka{text-align:center;font-size:.78rem;width:76px}
.zas{width:64px;height:64px;display:block;margin:0 auto 2px}
.zas .tvar{fill:var(--bg-control);stroke:var(--border-strong);stroke-width:2}
.zas .vybrani{fill:none;stroke:var(--border-strong);stroke-width:1.5;stroke-dasharray:3 2}
.zas .otvor{fill:var(--text)}
.zas .pin{fill:var(--accent)}
.verdikt{border-left:4px solid var(--border-strong);padding:6px 10px;border-radius:4px;background:var(--bg-control);font-size:.86rem;line-height:1.45;margin:4px 0}
.verdikt.ok{border-left-color:var(--ok)} .verdikt.pozor{border-left-color:var(--warn)} .verdikt.ne{border-left-color:var(--danger)}
.cisla{display:flex;flex-wrap:wrap;gap:8px}
.cislo{flex:1 1 90px;text-align:center;background:var(--bg-control);border:1px solid var(--border);border-radius:8px;padding:6px 4px;text-decoration:none;color:var(--text)}
.cislo b{display:block;font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums}
.cislo span{font-size:.74rem;color:var(--text-muted)}
.cislo.hlavni{border-color:var(--accent)}
.odkazy{display:flex;flex-wrap:wrap;gap:6px}
.velky-cas{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}

/* porovnání */
.porovnani td:first-child{color:var(--text-muted);white-space:nowrap}
.porovnani td{vertical-align:top}
.porovnani tr.jine td:not(:first-child){background:color-mix(in srgb,var(--warn) 12%,transparent)}

/* kontrolní seznam */
.seznam{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.seznam label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;cursor:pointer;line-height:1.4;font-size:.9rem}
.seznam input{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}
.seznam .dulezite span::after{content:" •";color:var(--danger)}
.seznam input:checked + span{text-decoration:line-through;color:var(--text-muted)}
.pokrok{height:6px;background:var(--bg-control);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.pokrok i{display:block;height:100%;background:var(--ok)}

/* zásuvky – přehled typů */
.typy{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.typy .panel{display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;font:inherit;color:inherit}
.typy .panel:hover{border-color:var(--border-strong)}
.typy .panel[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.typy .panel .zas{margin:0;flex-shrink:0}
.typy b{font-size:1.05rem}
.typy small{display:block;color:var(--text-muted);font-size:.78rem;line-height:1.35;margin-top:2px}

/* mapa */
.mapa-hlava{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);font-size:.84rem}
.legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1px solid var(--border-strong)}
#mapa{flex:1;min-height:300px;background:var(--bg)}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg-elevated);color:var(--text)}
.leaflet-popup-content{margin:10px 12px;font-size:.85rem;line-height:1.45}
.leaflet-bar a{background:var(--bg-elevated);color:var(--text);border-color:var(--border)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--bg-elevated) 80%,transparent)!important;color:var(--text-muted)}
.leaflet-control-attribution a{color:var(--accent)}

.zdroje{font-size:.85rem;line-height:1.55}
.zdroje li{margin-bottom:4px}
a{color:var(--accent)}

/* filtry, oblíbené */
.cipy{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.cip{background:var(--bg-control);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.cip:hover{border-color:var(--border-strong)}
.cip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.hvezda{background:none;border:0;cursor:pointer;font-size:1.1rem;color:var(--text-faint);padding:0 2px;line-height:1;font-family:inherit}
.hvezda[aria-pressed="true"]{color:var(--warn)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.ikonka{background:none;border:0;color:var(--text-muted);cursor:pointer;padding:2px 5px;border-radius:4px;font:inherit}
.ikonka:hover{background:var(--bg-hover);color:var(--text)}
.ikonka:focus-visible,.cip:focus-visible,.hvezda:focus-visible{outline:2px solid var(--accent)}
.nabidka label.tl{cursor:default}
.nabidka label.tl select{margin-left:auto;max-width:170px}

/* trasa */
.cesty-lista{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.cesty-lista label{display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--text-muted)}
.cesty-lista select{font-weight:600;color:var(--text);max-width:260px}
.vybirac{position:relative;flex:1 1 300px;max-width:560px}
.vybirac .vstup{width:100%;font-size:.95rem;padding:8px 10px}
.navrhy{position:absolute;z-index:50;left:0;right:0;top:100%;margin:2px 0 0;padding:4px;list-style:none;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);max-height:330px;overflow:auto}
.navrhy li{padding:7px 8px;border-radius:5px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.navrhy li small{color:var(--text-muted);margin-left:auto;white-space:nowrap}
.navrhy li.akt,.navrhy li:hover{background:var(--accent-soft)}
.navrhy li.prazdne{cursor:default;color:var(--text-muted)}
.rychle{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:8px 0 12px}
.rychle .tip{margin:0 4px 0 0}
.souhrn{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.souhrn .cip.ne{border-color:var(--danger)} .souhrn .cip.pozor{border-color:var(--warn)} .souhrn .cip.ok{border-color:var(--ok)}
.itinerar{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:4px}
.itinerar li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.itinerar li.domov{background:transparent;border-style:dashed;color:var(--text-muted);font-size:.88rem;padding:4px 10px}
.itinerar .tahlo{cursor:grab;color:var(--text-faint);user-select:none;font-size:1.1rem;line-height:1}
.itinerar .cislo-z{width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--on-accent,#fff);display:inline-grid;place-items:center;font-size:.78rem;font-weight:700;flex-shrink:0}
.itinerar .nazev-z{font-weight:600;color:var(--text);font-size:.95rem}
.itinerar .terminy{display:flex;flex-wrap:wrap;gap:4px 8px;margin-left:auto;font-size:.78rem;color:var(--text-muted)}
.itinerar .terminy label{display:flex;align-items:center;gap:4px}
.itinerar .terminy .vstup{padding:3px 6px;font-size:.84rem}
.itinerar .noci{font-size:.8rem;color:var(--text-muted);min-width:4.5em;text-align:right;white-space:nowrap}
.itinerar .akce{display:flex}
.itinerar .ikonka:disabled{opacity:.3;cursor:default;background:none}
.itinerar .zast-var{flex-basis:100%;font-size:.8rem;padding-left:2.9em}
.itinerar .zast-var.chyba{color:var(--danger)} .itinerar .zast-var.info{color:var(--text-muted)}
.itinerar li.cil-drop{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.itinerar li.tazeny{opacity:.45}
@media (max-width:600px){.itinerar .akce{margin-left:auto}.itinerar .terminy{margin-left:2.4em}}
.akce-trasy{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(36px + env(safe-area-inset-bottom,0px));z-index:1200;background:var(--bg-elevated);color:var(--text);border:1px solid var(--border-strong);box-shadow:var(--shadow);border-radius:8px;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;font-size:.88rem;max-width:calc(100vw - 24px)}
.mapa-hlava .vyber-info{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adaptery{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:6px}
.adaptery .zasuvka{width:auto;min-width:76px;max-width:160px}
.kapesni{font-size:.82rem}
.kapesni td,.kapesni th{padding:4px 6px;cursor:default}
.kapesni tbody tr{cursor:default}
.seznam-zemi{font-size:.85rem;line-height:1.5;margin:0;padding-left:18px}

/* čas a schůzky */
.hodiny{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;margin-bottom:12px}
.hodiny .panel{position:relative;padding-right:30px}
.hodiny .panel.ref{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hodiny .nazev{font-size:.82rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hodiny .x{position:absolute;top:4px;right:2px;display:flex;flex-direction:column}
table.planovac{border-collapse:separate;border-spacing:2px;font-size:.78rem;width:auto}
.planovac th,.planovac td{padding:3px 0;text-align:center;border:0;min-width:27px;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.planovac th.misto{text-align:left;padding:0 8px 0 2px;min-width:120px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem;color:var(--text);cursor:default;position:sticky;left:0;background:var(--bg-panel);z-index:1}
.planovac td{border-radius:4px;cursor:pointer;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.planovac td.prace{background:color-mix(in srgb,var(--ok) 32%,transparent)}
.planovac td.okraj{background:color-mix(in srgb,var(--warn) 26%,transparent)}
.planovac td.noc{background:var(--bg-control);color:var(--text-muted)}
.planovac .vyb{outline:2px solid var(--accent);outline-offset:-1px}
.planovac thead th{color:var(--text-muted);font-weight:500}
.planovac thead th.spolecne{color:var(--ok);font-weight:700}
.planovac sup{font-size:.62rem;color:var(--text-muted);margin-left:1px}
.legenda-cas{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--text-muted);margin:6px 0}
.legenda-cas i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.prevod{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:.9rem}
.prevod b{font-variant-numeric:tabular-nums}

/* měny */
.kurz-radek{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.kurz-radek input{width:8.5em}
.kurz-radek .vstup[type=number]{text-align:right}
.tahaky{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.tahak table{font-size:.85rem}
.tahak td{padding:2px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tahak td:last-child{text-align:right}
.tahak tbody tr{cursor:default}
.meny-tab td{vertical-align:middle}
.meny-tab tbody tr{cursor:default}
.meny-tab input{width:7em}

@media (max-width:480px){.udaj{grid-template-columns:1fr}.udaj dd{margin-bottom:4px}}
@media print{
  .lista,.nabidka,.radek-vyber,.tisk-ne,#podpis-pruh,.toast,.itinerar .tahlo,.itinerar .akce{display:none!important}
  body{display:block;height:auto;background:#fff;color:#000}
  main{overflow:visible;padding:0}
  .panel{break-inside:avoid;background:#fff;border-color:#999}
  .mrizka{grid-template-columns:1fr 1fr}
  .cislo{border-color:#999;background:#fff}
  .tab-obal{overflow:visible;border-color:#999}
  .tahaky{grid-template-columns:1fr 1fr 1fr}
  .planovac th.misto{position:static}
}
</style>
</head>
<body>
<header class="lista" id="lista">
  <h1>🌍 Země v kostce</h1>
  <div class="skup" role="group" aria-label="Zobrazit"><span class="skup-nazev" aria-hidden="true">Zobrazit</span><div class="skup-tl">
    <button class="tl" data-pohled="prehled" aria-pressed="true" title="Tabulka všech zemí s filtry (1)">📋<span class="txt"> Přehled</span></button>
    <button class="tl" data-pohled="karta" aria-pressed="false" title="Karta vybrané země (2)">🗂️<span class="txt"> Karta země</span></button>
    <button class="tl" data-pohled="trasa" aria-pressed="false" title="Plán cesty přes více zemí (3)">🧳<span class="txt"> Trasa</span><span id="pocetTrasy"></span></button>
    <button class="tl" data-pohled="mapa" aria-pressed="false" title="Mapa světa (4)">🗺️<span class="txt"> Mapa</span></button>
  </div></div>
  <div class="skup" role="group" aria-label="Nástroje"><span class="skup-nazev" aria-hidden="true">Nástroje</span><div class="skup-tl">
    <button class="tl" id="tlNastroje" data-nabidka="nabNastroje" aria-expanded="false" aria-pressed="false" title="Porovnání, čas a schůzky, měny, seznam před cestou, zásuvky">🧰<span class="txt"> Nástroje</span> ▾</button>
  </div></div>
  <div class="skup" role="group" aria-label="Filtr"><span class="skup-nazev" aria-hidden="true">Oblast</span><div class="skup-tl">
    <select class="tl" id="oblast" aria-label="Oblast"><option value="">Celý svět</option></select>
  </div></div>
  <div class="skup skup-hledat">
    <input type="search" id="hledat" class="vstup" placeholder="🔍 Země, měna, předvolba… ( / )" aria-label="Hledat zemi" autocomplete="off">
  </div>
  <span class="vpravo">
    <button class="tl" data-nabidka="nabVice" aria-expanded="false" title="Domovská země, tisk, sdílení, export, zdroje">☰<span class="txt"> Více</span> ▾</button>
  </span>
</header>

<div id="nabNastroje" class="nabidka" hidden>
  <button class="tl" data-pohled="porovnani" aria-pressed="false">⚖️ Porovnání dvou zemí <small>(5)</small></button>
  <button class="tl" data-pohled="cas" aria-pressed="false">🕒 Čas a plánovač schůzek <small>(6)</small></button>
  <button class="tl" data-pohled="meny" aria-pressed="false">💱 Měny, kurzy a tahák <small>(7)</small></button>
  <button class="tl" data-pohled="seznam" aria-pressed="false">✅ Kontrolní seznam před cestou <small>(8)</small></button>
  <button class="tl" data-pohled="zasuvky" aria-pressed="false">🔌 Typy zásuvek A–O <small>(9)</small></button>
</div>

<div id="nabVice" class="nabidka" hidden>
  <label class="tl">🏠 Domov <select class="vstup" id="domovSel" aria-label="Domovská země"></select></label>
  <hr>
  <button class="tl" data-prikaz="tisk">🖨️ Vytisknout (karta, trasa, seznam, tahák)</button>
  <button class="tl" data-prikaz="odkaz">🔗 Kopírovat odkaz na zemi / trasu</button>
  <button class="tl" data-prikaz="csv">⬇️ Export přehledu do CSV</button>
  <hr>
  <button class="tl" data-prikaz="zkratky">⌨️ Klávesové zkratky</button>
  <button class="tl" data-prikaz="zdroje">ℹ️ Zdroje a upozornění</button>
</div>

<main id="hlavni"><div class="obal" id="obsah"></div></main>
<div id="toast" class="toast" role="status" hidden><span></span><button class="btn mini" id="toastZpet">↶ Vrátit</button></div>

<script>
(() => {
'use strict';
const J = window.ZVK, D = window.ZVK_DATA;
const $ = id => document.getElementById(id);
const P = 'webapp_zeme_v_kostce_';
const nacti = (k, v) => { try { const x = localStorage.getItem(P + k); return x === null ? v : JSON.parse(x); } catch { return v; } };
const zapamatuj = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const ZEME = J.nactiZeme(D);
const PODLE = Object.fromEntries(ZEME.map(z => [z.kod, z]));
const MZV = {
  zeme: 'https://mzv.gov.cz/jnp/cz/encyklopedie_statu/index.html',
  varovani: 'https://mzv.gov.cz/jnp/cz/cestujeme/aktualni_doporuceni_a_varovani/index.html',
  drozd: 'https://drozd.mzv.gov.cz/',
  konzul: 'https://mzv.gov.cz/jnp/cz/cestujeme/konzularni_sluzba/index.html'
};
const KURZY_URL = 'https://open.er-api.com/v6/latest/';
const POHLEDY = ['prehled', 'karta', 'trasa', 'mapa', 'porovnani', 'cas', 'meny', 'seznam', 'zasuvky'];
const NASTROJE = { porovnani: ['⚖️', 'Porovnání'], cas: ['🕒', 'Čas a schůzky'], meny: ['💱', 'Měny a kurzy'], seznam: ['✅', 'Před cestou'], zasuvky: ['🔌', 'Zásuvky'] };

/* ---------- názvy přes Intl v jazyce webu ---------- */
const loc = () => (window.I18N && I18N.jazyk) || 'cs';
const dn = {};
const intlNazev = (typ, kod) => {
  const k = loc() + typ;
  try { dn[k] = dn[k] || new Intl.DisplayNames(loc(), { type: typ }); return dn[k].of(kod); } catch { return kod; }
};
const nazev = z => intlNazev('region', z.kod);
const menaNazev = m => (loc() === 'cs' && D.meny[m]) || (intlNazev('currency', m) !== m ? intlNazev('currency', m) : D.meny[m] || m);
const jazykNazev = l => { const n = intlNazev('language', l); return (loc() === 'cs' && D.jazyky[l]) || (n && n !== l ? n : D.jazyky[l] || l); };
const vlajka = kod => String.fromCodePoint(...[...kod].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
const nazvyHledani = z => [nazev(z), intlNazev('region', z.kod), new Intl.DisplayNames('en', { type: 'region' }).of(z.kod), ...z.meny.map(menaNazev)];
const serazene = () => ZEME.slice().sort((a, b) => nazev(a).localeCompare(nazev(b), loc()));
const mesto = p => p.split('/').pop().replace(/_/g, ' ');
const cislo = (x, des) => x.toLocaleString(loc(), { maximumFractionDigits: des ?? (Math.abs(x) < 1 ? 4 : Math.abs(x) < 100 ? 2 : 0) });

/* ---------- stav ---------- */
let pohled = nacti('pohled', 'prehled');
if (!POHLEDY.includes(pohled)) pohled = 'prehled';
let domov = PODLE[nacti('domov', 'CZ')] ? nacti('domov', 'CZ') : 'CZ';
let vybrana = PODLE[location.hash.slice(1).toUpperCase()] ? location.hash.slice(1).toUpperCase() : nacti('vybrana', 'AT');
if (!PODLE[vybrana]) vybrana = 'AT';
let porovnat = nacti('porovnat', [domov, vybrana]);
let razeni = { sl: 'nazev', smer: 1 };
let barvaMapy = nacti('mapa', 'adapter');
let filtrTyp = '';
const odskrtnute = nacti('seznam', {});
/* cesty: [{id, nazev, zastavky: [{kod, od, do}]}]; trasa = kódy zemí aktivní cesty (odvozené) */
let cesty = nacti('cesty', null);
if (!Array.isArray(cesty) || !cesty.length) cesty = [{ id: 1, nazev: 'Moje cesta', zastavky: nacti('trasa', []).filter(k => PODLE[k]).map(kod => ({ kod, od: '', do: '' })) }];
cesty = cesty.filter(c => c && typeof c === 'object');
if (!cesty.length) cesty = [{ id: 1, nazev: 'Moje cesta', zastavky: [] }];
cesty.forEach((c, i) => {
  c.id = c.id ?? i + 1; c.nazev = String(c.nazev || 'Cesta ' + (i + 1));
  c.zastavky = (Array.isArray(c.zastavky) ? c.zastavky : []).filter(z => z && PODLE[z.kod]).map(z => ({ kod: z.kod, od: z.od || '', do: z.do || '' }));
});
let aktivniCesta = nacti('aktivniCesta', cesty[0].id);
if (!cesty.some(c => c.id === aktivniCesta)) aktivniCesta = cesty[0].id;
const cesta = () => cesty.find(c => c.id === aktivniCesta);
let trasa = cesta().zastavky.map(z => z.kod);
let zpet = null, zpetCasovac = 0, navrhIdx = 0, tazeno = -1;
const oblibene = new Set(nacti('oblibene', []).filter(k => PODLE[k]));
const filtry = new Set(nacti('filtry', []));
let cilSeznamu = nacti('cilSeznamu', 'zeme');
const vlastniBody = nacti('vlastni', []);
const platneHodiny = h => { const [k, p] = String(h).split('|'); return !!PODLE[k] && PODLE[k].pasma.includes(p); };
let hodiny = (Array.isArray(nacti('hodiny', [])) ? nacti('hodiny', []) : []).filter(platneHodiny);
let casDen = '', casHod = null;
let kurzy = nacti('kurzy', null), kurzyStav = '', kurzyChybaCas = 0;
const vlastniKurzy = nacti('vlastniKurzy', {});
const pridaneMeny = nacti('meny', []);
let kalk = nacti('kalk', { castka: 100, z: '', na: '' });

const nej = (z, q) => z.nejiste.includes(q) ? ' <span class="nejiste" title="Údaj zdroj neuvádí nebo je sporný – před cestou si ho potvrďte">⚠️ neověřeno</span>' : '';
const typy = z => z.zasuvky.map(t => `<span class="typ">${t}</span>`).join('');
const napetiText = z => z.napeti.join(' / ') + ' V · ' + z.hz.join(' / ') + ' Hz';
const jizdaText = z => z.jizda === 'L' ? '⬅️ vlevo' : 'vpravo ➡️';
const rozdil = z => J.formatRozdil(J.rozdilCasu(PODLE[domov].pasma[0], z.pasma[0]));
const ADAPTER = { ne: 'bez adaptéru', cast: 'jen ploché vidlice', ano: 'adaptér nutný' };
const vTrase = kod => trasa.includes(kod);

function ulozTrasu() {
  trasa = cesta().zastavky.map(z => z.kod);
  zapamatuj('cesty', cesty); zapamatuj('aktivniCesta', aktivniCesta);
  try { localStorage.removeItem(P + 'trasa'); } catch {}
  $('pocetTrasy').textContent = trasa.length ? ` ${trasa.length}` : '';
}
/** Před změnou, kterou jde vrátit: uloží stav a ukáže lištu s tlačítkem Vrátit. */
function zapamatujZpet(text) {
  zpet = { cesty: JSON.stringify(cesty), aktivni: aktivniCesta };
  const t = $('toast');
  t.querySelector('span').textContent = text; t.hidden = false;
  clearTimeout(zpetCasovac);
  zpetCasovac = setTimeout(() => { t.hidden = true; zpet = null; }, 8000);
}
function vratZpet() {
  if (!zpet) return;
  cesty = JSON.parse(zpet.cesty); aktivniCesta = zpet.aktivni; zpet = null;
  $('toast').hidden = true; ulozTrasu(); vykresli();
}
function prepniTrasu(kod) {
  const z = cesta().zastavky, i = z.findIndex(x => x.kod === kod);
  if (i < 0) z.push(J.novaZastavka(z, kod));
  else { zapamatujZpet(`${nazev(PODLE[kod])} – odebráno z cesty.`); z.splice(i, 1); }
  ulozTrasu();
}
function prepniOblibenou(kod) {
  if (oblibene.has(kod)) oblibene.delete(kod); else oblibene.add(kod);
  zapamatuj('oblibene', [...oblibene]);
}

function vyberZeme(id, hodnota, popis, navic) {
  return `<select class="vstup" id="${id}" aria-label="${esc(popis)}">${navic || ''}` +
    serazene().map(z => `<option value="${z.kod}"${z.kod === hodnota ? ' selected' : ''}>${esc(nazev(z))}</option>`).join('') + '</select>';
}

/* ---------- přehled ---------- */
const FILTRY = {
  oblibene: ['⭐ oblíbené', z => oblibene.has(z.kod)],
  trasa: ['🧳 v trase', z => vTrase(z.kod)],
  ehp: ['🇪🇺 EU a EHP', z => J.vEhp(z.kod)],
  bezAdapteru: ['🔌 bez adaptéru', z => J.adapter(PODLE[domov], z).stav === 'ne'],
  napeti: ['⚡ jiné napětí', z => J.napeti(PODLE[domov], z).stav === 'menic'],
  vlevo: ['⬅️ jízda vlevo', z => z.jizda === 'L'],
  dalnice: ['🛣️ placené dálnice', z => J.placeneSilnice(z)],
  voda: ['🚰 voda raději balená', z => z.voda === 'n'],
  mena: ['💱 stejná měna jako doma', z => z.meny.some(m => PODLE[domov].meny.includes(m))]
};
function filtrovane() {
  const ob = $('oblast').value;
  return J.hledej(ZEME, $('hledat').value, nazvyHledani)
    .filter(z => (!ob || z.oblast === ob) && [...filtry].every(f => !FILTRY[f] || FILTRY[f][1](z)));
}
const SLOUPCE = [
  ['nazev', 'Země', z => nazev(z)],
  ['zasuvky', 'Zásuvky', z => z.zasuvky.join('')],
  ['adapter', 'Adaptér', z => ['ne', 'cast', 'ano'].indexOf(J.adapter(PODLE[domov], z).stav)],
  ['napeti', 'Napětí', z => z.napeti[0]],
  ['jizda', 'Jízda', z => z.jizda],
  ['tisnova', 'Tísňová čísla', z => z.jednotne || z.tisnova[0]],
  ['mena', 'Měna', z => z.meny[0]],
  ['predvolba', 'Předvolba', z => +z.predvolba.replace(/\D/g, '')],
  ['cas', 'Čas', z => J.rozdilCasu(PODLE[domov].pasma[0], z.pasma[0])]
];
const hvezda = kod => `<button class="hvezda" data-oblibena="${kod}" aria-pressed="${oblibene.has(kod)}" title="Oblíbená země" aria-label="Oblíbená">${oblibene.has(kod) ? '★' : '☆'}</button>`;
function prehled() {
  const sl = SLOUPCE.find(s => s[0] === razeni.sl) || SLOUPCE[0];
  const seznam = filtrovane().sort((a, b) => {
    const x = sl[2](a), y = sl[2](b);
    return razeni.smer * (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), loc())) || nazev(a).localeCompare(nazev(b), loc());
  });
  const dom = PODLE[domov];
  const radky = seznam.map(z => {
    const a = J.adapter(dom, z), n = J.napeti(dom, z);
    const tis = z.tisnova.every(t => t === z.tisnova[0]) ? z.tisnova[0] : z.tisnova.filter(Boolean).join(' / ');
    return `<tr data-zeme="${z.kod}">
      <td class="nw">${hvezda(z.kod)}<span class="vlajka" aria-hidden="true">${vlajka(z.kod)}</span><span data-i18n="ne">${esc(nazev(z))}</span>${vTrase(z.kod) ? ' <span title="V trase">🧳</span>' : ''}</td>
      <td class="nw">${typy(z)}</td>
      <td class="nw"><span class="stav ${a.stav}"></span>${ADAPTER[a.stav]}</td>
      <td class="nw"><span class="stav ${n.stav}"></span>${napetiText(z)}</td>
      <td class="nw">${jizdaText(z)}</td>
      <td class="nw">${esc(tis || '?')}${z.jednotne && !z.tisnova.includes(z.jednotne) ? ' · ' + z.jednotne : ''}${nej(z, 't')}</td>
      <td class="nw">${z.meny.join(', ')}</td>
      <td class="nw">${z.predvolba}</td>
      <td class="nw">${rozdil(z)}${z.pasma.length > 1 ? ' *' : ''}</td></tr>`;
  }).join('');
  const hlava = SLOUPCE.map(s => `<th data-razeni="${s[0]}" aria-sort="${razeni.sl === s[0] ? (razeni.smer > 0 ? 'ascending' : 'descending') : 'none'}">${s[1]}${razeni.sl === s[0] ? (razeni.smer > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
  const cipy = Object.entries(FILTRY).map(([k, [t]]) => `<button class="cip" data-filtr="${k}" aria-pressed="${filtry.has(k)}">${t}</button>`).join('') +
    (filtry.size ? '<button class="cip" data-filtr="" title="Zrušit všechny filtry">✕ zrušit</button>' : '');
  return `<div class="cipy" role="group" aria-label="Filtry">${cipy}</div>
    <p class="tip">${seznam.length} zemí. Adaptér, napětí a čas se porovnávají s domovskou zemí <b>${esc(nazev(dom))}</b> (změna v ☰ Více). Klepnutím na řádek otevřete kartu země, ☆ přidá zemi mezi oblíbené. * = více časových pásem, uveden čas hlavního města.</p>
    ${seznam.length ? `<div class="tab-obal"><table><thead><tr>${hlava}</tr></thead><tbody>${radky}</tbody></table></div>` : '<p class="panel">Nic nenalezeno – zkuste zrušit některý filtr.</p>'}`;
}

/* ---------- kurzy měn ---------- */
const domMena = () => PODLE[domov].meny[0];
async function nactiKurzy(vynutit) {
  const base = domMena();
  if (kurzyStav === 'nacitam' || (!vynutit && kurzyStav === 'chyba' && Date.now() - kurzyChybaCas < 5 * 60e3)) return;
  if (!vynutit && kurzy && kurzy.base === base && Date.now() - kurzy.stazeno < 12 * 3600e3) return;
  kurzyStav = 'nacitam';
  try {
    const odp = await fetch(KURZY_URL + base);
    const j = await odp.json();
    if (j.result !== 'success' || !j.rates) throw new Error(j['error-type'] || 'chyba');
    kurzy = { base, cas: j.time_last_update_unix * 1000, stazeno: Date.now(), rates: j.rates };
    zapamatuj('kurzy', kurzy);
    kurzyStav = '';
  } catch { kurzyStav = 'chyba'; kurzyChybaCas = Date.now(); }
  if (['karta', 'trasa', 'meny'].includes(pohled)) vykresliSFokusem();
}
/** Kolik jednotek domácí měny stojí 1 jednotka měny m (vlastní kurz směnárny má přednost). */
function cena(m) {
  const d = domMena();
  if (m === d) return 1;
  if (vlastniKurzy[m + '>' + d] > 0) return vlastniKurzy[m + '>' + d];
  return kurzy && kurzy.rates ? J.prevedMenu(1, m, d, Object.assign({ [kurzy.base]: 1 }, kurzy.rates)) : null;
}
const jeVlastni = m => vlastniKurzy[m + '>' + domMena()] > 0;
function kurzText(m) {
  const c = cena(m), d = domMena();
  if (c) return `1 ${m} = <b>${cislo(c)} ${d}</b>${c < 1 ? ` · 1 ${d} = ${cislo(1 / c)} ${m}` : ''}${jeVlastni(m) ? ' <small>(vlastní kurz)</small>' : ''}`;
  return kurzyStav === 'chyba' ? 'kurz se nepodařilo načíst' : kurzy ? 'kurz není k dispozici' : 'kurz se načítá…';
}
function kurzyStari() {
  if (!kurzy) return '';
  return `Kurzy <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a> ze dne ${new Date(kurzy.cas).toLocaleDateString(loc())} – orientační střed, směnárna a banka účtují přirážku.`;
}
function prevodnik(m) {
  const d = domMena(), c = cena(m);
  if (!c) return '';
  return `<div class="kurz-radek" data-mena="${m}"><input type="number" class="vstup" data-prevod="cizi" value="100" min="0" step="any" aria-label="Částka v ${m}"> ${m} =
    <input type="number" class="vstup" data-prevod="domov" value="${+(100 * c).toFixed(2)}" min="0" step="any" aria-label="Částka v ${d}"> ${d}</div>`;
}

/* ---------- karta země ---------- */
function casZeme(pasmo, kdy) {
  try { return new Intl.DateTimeFormat(loc(), { timeZone: pasmo, weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(kdy || new Date()); }
  catch { return '?'; }
}
function verdiktElektro(dom, z) {
  const a = J.adapter(dom, z), n = J.napeti(dom, z);
  let h = '';
  if (a.stav === 'ne') h += `<div class="verdikt ok">🔌 Vidlice z ${esc(nazev(dom))} pasují – adaptér není potřeba.</div>`;
  else if (a.stav === 'cast') h += `<div class="verdikt pozor">🔌 Ploché vidlice (Europlug C – nabíječky) projdou, ale uzemněné vidlice ne. Vezměte adaptér pro zásuvky typu <b>${a.doporucene.join(', ')}</b>.</div>`;
  else h += `<div class="verdikt ne">🔌 Potřebujete cestovní adaptér pro zásuvky typu <b>${a.doporucene.join(', ')}</b>.</div>`;
  if (n.stav === 'menic') h += `<div class="verdikt ne">⚡ Jiné napětí (${z.napeti.join(' / ')} V). Nabíječky s označením 100–240 V fungují, spotřebiče jen na ${dom.napeti.join('/')} V (fén, konvice, žehlička) potřebují měnič.</div>`;
  else h += `<div class="verdikt ok">⚡ Napětí odpovídá (${z.napeti.join(' / ')} V).</div>`;
  if (n.hz) h += `<div class="verdikt pozor">〰️ Jiný kmitočet (${z.hz.join(' / ')} Hz) – může ovlivnit motory a hodiny řízené sítí.</div>`;
  if (z.zasuvky.length > 1 && a.stav !== 'ano') h += '<p class="tip">Země používá více typů zásuvek – v hotelu může být jiný, než očekáváte.</p>';
  return h;
}
function tisnovaKarty(z) {
  const T = ['Policie', 'Záchranka', 'Hasiči'];
  return (z.jednotne ? `<a class="cislo hlavni" href="tel:${z.jednotne}"><b>${z.jednotne}</b><span>Jednotné číslo</span></a>` : '') +
    (z.tisnova[0] && z.tisnova.every(c => c === z.tisnova[0]) && z.tisnova[0] !== z.jednotne
      ? `<a class="cislo" href="tel:${z.tisnova[0]}"><b>${z.tisnova[0]}</b><span>Policie, záchranka, hasiči</span></a>`
      : z.tisnova[0] && z.tisnova.every(c => c === z.jednotne) ? ''
      : z.tisnova.map((c, i) => c ? `<a class="cislo" href="tel:${c}"><b>${c}</b><span>${T[i]}</span></a>` : `<span class="cislo"><b>?</b><span>${T[i]}</span></span>`).join(''));
}
function karta() {
  const z = PODLE[vybrana], dom = PODLE[domov];
  const roz = J.rozdilCasu(dom.pasma[0], z.pasma[0]);
  const cizi = z.meny.filter(m => m !== domMena());
  return `<div class="radek-vyber">${vyberZeme('volbaKarta', vybrana, 'Země')}
      <button class="btn" data-oblibena="${z.kod}" aria-pressed="${oblibene.has(z.kod)}">${oblibene.has(z.kod) ? '★ Oblíbená' : '☆ Oblíbit'}</button>
      <button class="btn" data-trasa="${z.kod}" aria-pressed="${vTrase(z.kod)}" title="Cesta „${esc(cesta().nazev)}“">${vTrase(z.kod) ? '✓ V trase' : '➕ Do trasy'}</button>
      <button class="btn" data-prikaz="tisk">🖨️ Tisk</button>
      <button class="btn" data-pohled-zeme="seznam">✅ Před cestou</button>
      <button class="btn" data-pohled-zeme="porovnani">⚖️ Porovnat s domovem</button></div>
    <div class="karta-hlava"><h2><span class="vlajka" aria-hidden="true">${vlajka(z.kod)}</span><span data-i18n="ne">${esc(nazev(z))}</span></h2>
      <span class="podnadpis">${z.kod} · ${J.OBLASTI[z.oblast]}${J.vEhp(z.kod) ? ' · EU/EHP' : ''}</span></div>
    <div class="mrizka">
      <section class="panel"><h3>🆘 Tísňová čísla${nej(z, 't')}</h3><div class="cisla">${tisnovaKarty(z)}</div>

      <section class="panel"><h3>🍽️ Spropitné a voda (orientačně)${nej(z, 's')}${nej(z, 'w')}</h3><dl class="udaj">

      <section class="panel"><h3>🏛️ Ministerstvo zahraničních věcí ČR</h3><div class="odkazy">

        <p class="tip">Na stránkách MZV vyberte oblast a zemi – najdete podmínky vstupu, kontakty na zastupitelský úřad a aktuální bezpečnostní situaci.</p></section>

/* ---------- trasa přes víc zemí ---------- */
const CASTE_CILE = ['HR', 'IT', 'AT', 'SK', 'DE', 'GR', 'ES', 'FR', 'SI', 'HU', 'PL', 'GB', 'TR', 'EG', 'TH', 'US'];
const fmtDen = d => d ? new Date(d).toLocaleDateString(loc(), { day: 'numeric', month: 'numeric', timeZone: 'UTC', ...(d.slice(0, 4) !== String(new Date().getFullYear()) && { year: 'numeric' }) }) : '';
const tvar = (n, a, b, c) => n === 1 ? a : n > 1 && n < 5 ? b : c;
function navrhyZemi(q) {
  const n = J.norm(q);
  return J.hledej(ZEME, q, nazvyHledani).filter(z => !vTrase(z.kod))
    .sort((a, b) => (J.norm(nazev(b)).startsWith(n) - J.norm(nazev(a)).startsWith(n)) || nazev(a).localeCompare(nazev(b), loc()))
    .slice(0, 8);
}
function ukazNavrhy() {
  const vst = $('trasaHledat'), ul = $('trasaNavrhy');
  if (!vst || !ul) return;
  const q = vst.value.trim();
  if (!q) { ul.hidden = true; vst.setAttribute('aria-expanded', 'false'); return; }
  const n = navrhyZemi(q);
  navrhIdx = Math.min(navrhIdx, Math.max(0, n.length - 1));
  ul.innerHTML = n.length
    ? n.map((z, i) => `<li role="option" id="navrh${i}" data-navrh="${z.kod}" class="${i === navrhIdx ? 'akt' : ''}" aria-selected="${i === navrhIdx}">${vlajka(z.kod)} <span>${esc(nazev(z))}</span><small>${z.meny.join(', ')} · ${z.predvolba}</small></li>`).join('')
    : '<li class="prazdne">Nic nenalezeno (nebo už je v cestě)</li>';
  ul.hidden = false; vst.setAttribute('aria-expanded', 'true');
  vst.setAttribute('aria-activedescendant', n.length ? 'navrh' + navrhIdx : '');
}
function pridejZVyberu(kod) {
  if (!kod || vTrase(kod)) return;
  prepniTrasu(kod); navrhIdx = 0; vykresli();
  const v = $('trasaHledat'); if (v) v.focus();
}
function trasaPohled() {
  const dom = PODLE[domov], c = cesta(), zast = c.zastavky, cile = zast.map(z => PODLE[z.kod]);
  const nazvy = list => list.map(z => esc(nazev(z))).join(', ');
  const k = J.kontrolaZastavek(zast);
  const lista = `<div class="cesty-lista tisk-ne">
      <label>🧳 Cesta <select class="vstup" id="cestaVyber" aria-label="Vybrat cestu">${cesty.map(x => `<option value="${x.id}"${x.id === c.id ? ' selected' : ''}>${esc(x.nazev)} (${x.zastavky.length})</option>`).join('')}</select></label>
      <button class="btn" id="cestaNova" title="Založit další cestu">➕ Nová</button>
      <button class="btn" id="cestaPrejmenuj" title="Přejmenovat cestu">✏️ Přejmenovat</button>
      ${cesty.length > 1 || zast.length ? `<button class="btn" id="cestaSmaz" title="${cesty.length > 1 ? 'Smazat tuto cestu' : 'Odebrat všechny zastávky'}">🗑️ ${cesty.length > 1 ? 'Smazat' : 'Vyprázdnit'}</button>` : ''}</div>`;
  const rychle = [...new Set([...oblibene, ...CASTE_CILE])].filter(x => x !== domov && !vTrase(x) && PODLE[x]).slice(0, 12);
  const vybirac = `<div class="radek-vyber tisk-ne" style="margin-bottom:0">
      <div class="vybirac"><input type="search" class="vstup" id="trasaHledat" placeholder="➕ Přidat zemi – začněte psát název, měnu nebo předvolbu…" autocomplete="off"
        role="combobox" aria-expanded="false" aria-controls="trasaNavrhy" aria-autocomplete="list" aria-label="Přidat zemi do cesty">
        <ul class="navrhy" id="trasaNavrhy" role="listbox" hidden></ul></div>
      <button class="btn" id="trasaMapa" title="Klikáním na mapě přidávat a odebírat země">🗺️ Vybrat na mapě</button></div>
    <div class="rychle tisk-ne"><span class="tip">Rychle přidat:</span>${rychle.map(x => `<button class="cip" data-trasa="${x}" title="${oblibene.has(x) ? 'Oblíbená země' : 'Častý cíl'}">${oblibene.has(x) ? '⭐' : ''}${vlajka(x)} ${esc(nazev(PODLE[x]))}</button>`).join('')}</div>`;
  if (!cile.length) return lista + vybirac + `<div class="panel"><h2>🧳 ${esc(c.nazev)} – zatím prázdná</h2>
    <p class="tip">1. Přidejte země, kterými pojedete (psaním výše, tlačítky „Rychle přidat“, na mapě nebo ➕ Do trasy na kartě země).<br>
    2. Volitelně doplňte termíny – další zastávka automaticky navazuje na odjezd z předchozí.<br>
    3. Dostanete jednu sadu adaptérů do kufru, přehled měn s kurzem, dálničních poplatků a časových posunů, kontrolní seznam pro celou cestu a kapesní kartu tísňových čísel k vytištění.</p></div>`;

  const itinerar = `<ol class="itinerar" aria-label="Zastávky cesty">
    <li class="domov">🏠 Start: <b>${esc(nazev(dom))}</b>${zast[0].od ? ' · ' + fmtDen(zast[0].od) : ''}</li>
    ${zast.map((z, i) => {
      const n = k.noci[i], v = k.varovani.filter(x => x.i === i);
      return `<li class="zastavka" draggable="true" data-zast="${i}">
        <span class="tahlo" title="Přetažením změníte pořadí" aria-hidden="true">⠿</span>
        <span class="cislo-z">${i + 1}</span>
        <button class="ikonka nazev-z" data-zeme="${z.kod}" title="Karta země">${vlajka(z.kod)} ${esc(nazev(PODLE[z.kod]))}</button>
        <span class="terminy"><label>příjezd <input type="date" class="vstup" data-zast-od="${i}" value="${z.od}" aria-label="Příjezd ${esc(nazev(PODLE[z.kod]))}"></label>
          <label>odjezd <input type="date" class="vstup" data-zast-do="${i}" value="${z.do}"${z.od ? ` min="${z.od}"` : ''} aria-label="Odjezd ${esc(nazev(PODLE[z.kod]))}"></label></span>
        <span class="noci">${n != null && n >= 0 ? `🌙 ${n} ${tvar(n, 'noc', 'noci', 'nocí')}` : ''}</span>
        <span class="akce"><button class="ikonka" data-zast-posun="${i}:-1"${i ? '' : ' disabled'} title="Posunout dříve" aria-label="Posunout dříve">↑</button><button class="ikonka" data-zast-posun="${i}:1"${i < zast.length - 1 ? '' : ' disabled'} title="Posunout později" aria-label="Posunout později">↓</button><button class="ikonka" data-trasa="${z.kod}" title="Odebrat z cesty" aria-label="Odebrat">✕</button></span>
        ${v.map(x => `<div class="zast-var ${x.typ}">${x.typ === 'chyba' ? '⚠️' : 'ℹ️'} ${esc(x.text)}</div>`).join('')}</li>`;
    }).join('')}

  const akce = `<div class="akce-trasy tisk-ne">
      <button class="btn" data-prikaz="tisk">🖨️ Tisk (kapesní karta)</button>
      <button class="btn" data-prikaz="odkaz">🔗 Sdílet odkazem</button>
      <button class="btn" data-pohled-trasa="seznam">✅ Kontrolní seznam</button>

      <button class="btn" data-pohled="meny">💱 Měny a tahák</button></div>`;
  const sada = J.sadaAdapteru(dom, cile);
  const menic = cile.filter(z => J.napeti(dom, z).stav === 'menic'), hz = cile.filter(z => J.napeti(dom, z).hz);
  const cast = cile.filter(z => J.adapter(dom, z).stav === 'cast');
  const meny = [...new Set(cile.flatMap(z => z.meny))];
  const jinaJizda = cile.filter(z => z.jizda !== dom.jizda);
  const dalnice = cile.filter(z => z.vineta);
  const voda = cile.filter(z => z.voda === 'n');
  const posuny = cile.map(z => J.rozdilCasu(dom.pasma[0], z.pasma[0]));
  const maxPosun = posuny.reduce((m, p) => Math.abs(p) > Math.abs(m) ? p : m, 0);
  const ciziMeny = meny.filter(m => !dom.meny.includes(m));
  const placene = cile.filter(J.placeneSilnice);
  const chyby = k.varovani.filter(x => x.typ === 'chyba').length;
  const cip = (tr, cil, text) => `<button class="cip ${tr}" data-skoc="${cil}">${text}</button>`;
  const souhrn = `<div class="souhrn tisk-ne" aria-label="Souhrn cesty">
      ${cip(k.dni ? 'ok' : '', 'itinerar', k.dni ? `📅 ${k.dni} ${tvar(k.dni, 'den', 'dny', 'dní')} · ${fmtDen(k.od)} – ${fmtDen(k.do)}` : '📅 termíny nezadány')}
      ${chyby ? cip('ne', 'itinerar', `⚠️ ${chyby} ${tvar(chyby, 'problém', 'problémy', 'problémů')} v termínech`) : ''}
      ${cip(sada.length ? 'pozor' : 'ok', 'p-elektro', sada.length ? `🔌 ${tvar(sada.length, 'adaptér', 'adaptéry', 'adaptérů').replace(/^/, sada.length + ' ')}: ${sada.map(x => x.typ).join(', ')}` : '🔌 bez adaptéru')}
      ${menic.length ? cip('ne', 'p-elektro', `⚡ jiné napětí: ${nazvy(menic)}`) : ''}
      ${cip(ciziMeny.length ? 'pozor' : 'ok', 'p-meny', ciziMeny.length ? `💱 ${ciziMeny.join(', ')}` : '💱 domácí měna')}
      ${cip(placene.length ? 'pozor' : 'ok', 'p-silnice', placene.length ? `🛣️ dálniční poplatky: ${placene.length} ${tvar(placene.length, 'země', 'země', 'zemí')}` : '🛣️ bez poplatků')}
      ${jinaJizda.length ? cip('pozor', 'p-silnice', `🚗 jízda ${jinaJizda[0].jizda === 'L' ? 'vlevo' : 'vpravo'}`) : ''}
      ${cip(Math.abs(maxPosun) >= 180 ? 'pozor' : 'ok', 'p-cas', `🕒 ${maxPosun ? 'posun až ' + J.formatRozdil(maxPosun) : 'stejný čas'}`)}</div>`;

  const elektro = (sada.length
    ? `<div class="adaptery">${sada.map(s => `<div class="zasuvka">${ZVK_SVG(s.typ)}<b>typ ${s.typ}</b><br><small>${nazvy(s.zeme.map(k => PODLE[k]))}</small></div>`).join('')}</div>
       <p class="tip">${sada.length === 1 ? 'Stačí jeden adaptér.' : `Nejmenší sada: ${sada.length} adaptéry` + ' – nebo jeden univerzální cestovní adaptér.'}</p>`
    : `<div class="verdikt ok">Vidlice z ${esc(nazev(dom))} pasují ve všech zemích trasy.</div>`) +
    (cast.length ? `<div class="verdikt pozor">Jen ploché vidlice projdou v: ${nazvy(cast)}.</div>` : '') +

    `<p class="tip">${kurzyStari()} <button class="btn mini tisk-ne" data-pohled="meny">💱 Tahák a kalkulačka</button></p>`;

  const silnice = (jinaJizda.length ? `<div class="verdikt pozor">🚗 Jinak než doma se jezdí v: ${nazvy(jinaJizda)} (${jinaJizda[0].jizda === 'L' ? 'vlevo' : 'vpravo'}).</div>` : '<div class="verdikt ok">🚗 Všude se jezdí na stejné straně jako doma.</div>') +
    (dalnice.length ? `<dl class="udaj blok" style="margin-top:6px">${dalnice.map(z => `<dt>${vlajka(z.kod)} ${esc(nazev(z))}</dt><dd>${esc(z.vineta)}</dd>`).join('')}</dl><p class="tip">Stav 11/2026 – ověřte před cestou.</p>` : '');

  const cas = `<dl class="udaj">${cile.map((z, i) => `<dt>${vlajka(z.kod)} ${esc(nazev(z))}</dt><dd class="nw">${esc(casZeme(z.pasma[0]))} · ${posuny[i] ? J.formatRozdil(posuny[i]) : 'stejný čas'}${z.pasma.length > 1 ? ' *' : ''}</dd>`).join('')}</dl>`;

    ${cile.map((z, i) => `<tr><td class="nw">${vlajka(z.kod)} ${esc(nazev(z))}</td>${k.dni ? `<td class="nw">${fmtDen(zast[i].od)}${zast[i].do ? '–' + fmtDen(zast[i].do) : ''}</td>` : ''}<td class="nw"><b>${z.tisnova.map(c => c || '?').join(' / ')}</b>${nej(z, 't')}</td><td class="nw"><b>${z.jednotne || '–'}</b></td>
      <td class="nw">${z.predvolba}</td><td class="nw">${z.zasuvky.join(', ')} · ${z.napeti.join('/')} V</td><td class="nw">${z.meny.join(', ')}</td><td class="nw">${posuny[i] ? J.formatRozdil(posuny[i]) : '0'}</td><td>${{ a: 'pitná', c: 'opatrně', n: 'balená' }[z.voda]}</td></tr>`).join('')}
    </tbody></table></div><p class="tip">Velvyslanectví ČR: <a href="${MZV.zeme}" target="_blank" rel="noopener">mzv.gov.cz → Informace o státech</a> · Registrace cesty: <a href="${MZV.drozd}" target="_blank" rel="noopener">drozd.mzv.gov.cz</a></p>`;

  return lista + `<h2>🧳 ${esc(c.nazev)}: ${esc(nazev(dom))} → ${nazvy(cile)}${k.dni ? ` <small class="tip">(${fmtDen(k.od)} – ${fmtDen(k.do)})</small>` : ''}</h2>` + souhrn + vybirac + `<div id="itinerar">${itinerar}</div>` + akce + `
    <div class="mrizka">

      <section class="panel" id="p-cas"><h3>🕒 Čas oproti domovu</h3>${cas}
        ${voda.length ? `<p class="tip">🚰 Kohoutkovou vodu raději nepít: ${nazvy(voda)}.</p>` : ''}</section>
    </div>
    <section class="panel" style="margin-top:10px"><h3>🆘 Kapesní karta – ${esc(c.nazev)}</h3>${kapesni}</section>`;
}

/* ---------- porovnání ---------- */
function porovnani() {
  const [a, b] = porovnat.map(k => PODLE[k] || PODLE.CZ);
  const ad = J.adapter(a, b), np = J.napeti(a, b);
  const R = [
    ['Zásuvky', z => typy(z), z => z.zasuvky.join()],
    ['Napětí', napetiText, napetiText],
    ['Jízda', jizdaText, z => z.jizda],
    ['Tísňová čísla', z => z.tisnova.map(c => c || '?').join(' / ') + (z.jednotne ? ' · ' + z.jednotne : ''), z => z.tisnova.join() + z.jednotne],
    ['Měna', z => z.meny.map(m => `${m} – ${esc(menaNazev(m))}`).join('<br>'), z => z.meny.join()],
    ['Předvolba', z => z.predvolba, z => z.predvolba],
    ['Čas teď', z => esc(casZeme(z.pasma[0])), z => J.posunUtc(z.pasma[0])],
    ['Jazyk', z => z.jazyky.map(l => esc(jazykNazev(l))).join(', '), z => z.jazyky.join()],
    ['Jednotky', z => esc(J.jednotky(z.kod)), z => J.jednotky(z.kod)],
    ['Spropitné', z => J.SPROPITNE[z.spropitne], z => z.spropitne],
    ['Voda', z => J.VODA[z.voda], z => z.voda],
    ['Dálnice', z => esc(z.vineta || '–'), z => z.vineta]
  ];
  const roz = J.rozdilCasu(a.pasma[0], b.pasma[0]);
  return `<div class="radek-vyber">${vyberZeme('porA', a.kod, 'Odkud')} <button class="btn" id="prohodit" title="Prohodit" aria-label="Prohodit země">⇄</button> ${vyberZeme('porB', b.kod, 'Kam')}</div>
    <div class="panel" style="margin-bottom:10px"><h3>Cesta ${esc(nazev(a))} → ${esc(nazev(b))}</h3>
      ${verdiktElektro(a, b)}
      <div class="verdikt ${a.jizda === b.jizda ? 'ok' : 'pozor'}">🚗 ${a.jizda === b.jizda ? 'Jezdí se na stejné straně.' : `V cílové zemi se jezdí ${b.jizda === 'L' ? 'vlevo' : 'vpravo'}!`}</div>
      <div class="verdikt ${Math.abs(roz) >= 180 ? 'pozor' : 'ok'}">🕒 ${roz ? 'Časový posun ' + J.formatRozdil(roz) : 'Stejný čas'}.</div>
      ${a.meny.some(m => b.meny.includes(m)) ? '<div class="verdikt ok">💱 Stejná měna.</div>' : `<div class="verdikt pozor">💱 Jiná měna: ${b.meny.join(', ')}.</div>`}

/* ---------- čas a plánovač schůzek ---------- */
const popisHodin = h => { const [k, p] = h.split('|'); const z = PODLE[k]; return nazev(z) + (z.pasma.length > 1 ? ' – ' + mesto(p) : ''); };
function vychoziHodiny() {
  return [...new Set([domov, vybrana, ...trasa].map(k => `${k}|${PODLE[k].pasma[0]}`))];
}
function denDnes(pasmo) { return J.mistniCas(pasmo, new Date()).den; }
function cas() {
  if (!hodiny.length) hodiny = vychoziHodiny();
  const ref = hodiny[0].split('|')[1];
  if (!casDen) casDen = denDnes(ref);
  const [y, m, d] = casDen.split('-').map(Number);
  const pulnoc = J.mistniNaUtc(y, m, d, 0, 0, ref).getTime();
  const okamziky = [];
  for (let t = pulnoc; J.mistniCas(ref, new Date(t)).den === casDen && okamziky.length < 26; t += 3600e3) okamziky.push(new Date(t));
  const den0 = Date.parse(casDen);
  const bunky = hodiny.map(h => okamziky.map(t => {
    const mc = J.mistniCas(h.split('|')[1], t);
    const tr = mc.h >= 8 && mc.h < 18 ? 'prace' : mc.h >= 7 && mc.h < 22 ? 'okraj' : 'noc';
    return { mc, tr, posunDne: Math.round((Date.parse(mc.den) - den0) / 864e5) };
  }));
  const spolecne = okamziky.map((_, i) => bunky.every(r => r[i].tr === 'prace'));
  const dnyTxt = n => n > 0 ? `<sup>+${n}</sup>` : n < 0 ? `<sup>−${-n}</sup>` : '';
  const radky = hodiny.map((h, r) => `<tr><th class="misto" title="${esc(popisHodin(h))}">${vlajka(h.split('|')[0])} ${esc(popisHodin(h))}</th>${bunky[r].map((b, i) =>
    `<td class="${b.tr}${casHod === i ? ' vyb' : ''}" data-hod="${i}">${b.mc.h}${b.mc.min ? '<sup>:' + String(b.mc.min).padStart(2, '0') + '</sup>' : ''}${dnyTxt(b.posunDne)}</td>`).join('')}</tr>`).join('');
  const hlava = `<tr><th class="misto"></th>${okamziky.map((_, i) => `<th data-hod="${i}" class="${spolecne[i] ? 'spolecne' : ''}"${spolecne[i] ? ' title="Pracovní doba všude"' : ''}>${spolecne[i] ? '★' : ''}</th>`).join('')}</tr>`;
  const nSpol = spolecne.filter(Boolean).length;
  const now = new Date();
  const karty = hodiny.map((h, i) => {
    const p = h.split('|')[1], r = J.rozdilCasu(ref, p);
    return `<div class="panel${i ? '' : ' ref'}"><div class="nazev" title="${esc(popisHodin(h))}">${vlajka(h.split('|')[0])} ${esc(popisHodin(h))}</div>
      <div class="velky-cas">${esc(casZeme(p, now))}</div><div class="tip" style="margin:0">${i ? (r ? J.formatRozdil(r) : 'stejný čas') : 'výchozí'}</div>
      <span class="x tisk-ne">${hodiny.length > 1 ? `<button class="ikonka" data-hodiny-x="${i}" title="Odebrat" aria-label="Odebrat">✕</button>` : ''}${i ? `<button class="ikonka" data-hodiny-ref="${i}" title="Nastavit jako výchozí" aria-label="Nastavit jako výchozí">⤒</button>` : ''}</span></div>`;
  }).join('');
  const volby = serazene().flatMap(z => z.pasma.map(p => `<option value="${z.kod}|${p}">${esc(nazev(z))}${z.pasma.length > 1 ? ' – ' + esc(mesto(p)) : ''}</option>`)).join('');
  const prevod = casHod !== null ? `<section class="panel" style="margin-top:10px"><h3>Vybraný čas</h3><ul class="prevod">${hodiny.map(h => {
      const p = h.split('|')[1];
      return `<li>${vlajka(h.split('|')[0])} ${esc(popisHodin(h))}: <b>${esc(new Intl.DateTimeFormat(loc(), { timeZone: p, weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }).format(okamziky[casHod]))}</b></li>`;
    }).join('')}</ul></section>` : '';
  return `<div class="radek-vyber tisk-ne">
      <select class="vstup" id="hodinyPridej" aria-label="Přidat místo"><option value="">➕ Přidat místo…</option>${volby}</select>
      <label>Den <input type="date" class="vstup" id="casDen" value="${casDen}"></label>
      <button class="btn" id="casDnes">Dnes</button>
      ${trasa.length ? '<button class="btn" id="hodinyTrasa">🧳 Místa z trasy</button>' : ''}</div>
    <div class="hodiny">${karty}</div>
    <h2>🗓️ Plánovač hovoru – ${esc(new Date(den0).toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }))} (${esc(popisHodin(hodiny[0]))})</h2>
    <div class="tab-obal"><table class="planovac"><thead>${hlava}</thead><tbody>${radky}</tbody></table></div>
    <div class="legenda-cas"><span><i style="background:color-mix(in srgb,var(--ok) 32%,transparent)"></i>pracovní doba 8–18</span><span><i style="background:color-mix(in srgb,var(--warn) 26%,transparent)"></i>ráno a večer</span><span><i style="background:var(--bg-control)"></i>noc</span><span>★ vyhovuje všem · <sup>+1</sup> následující den</span></div>
    ${okamziky.length !== 24 ? `<p class="tip">⏱️ V tento den se mění čas – den má ${okamziky.length} hodin.</p>` : ''}
    <p class="tip">${hodiny.length > 1 ? (nSpol ? `Společná pracovní doba: ${nSpol} h.` : 'Pracovní doba se nikde nepřekrývá – zkuste ráno nebo večer (žluté).') : 'Přidejte další místa.'} Klepnutím na sloupec převedete čas pro všechna místa. Letní čas se počítá podle zvoleného dne.</p>
    ${prevod}`;
}

        <button class="btn mini" id="kurzyObnov">🔄 Aktualizovat</button></p></div>
    <h2>💱 Měny trasy a vybrané země</h2>

      ${tahaky ? '<button class="btn" data-prikaz="tisk">🖨️ Tisk taháku</button>' : ''}</div>

function prepoctiKalk() {

/* ---------- kontrolní seznam ---------- */

      <button class="btn" id="vlastniPridej">➕ Přidat</button></div>

/* ---------- mapa ---------- */
const BARVY = {
  adapter: { nazev: 'Adaptér z domova', fn: z => J.adapter(PODLE[domov], z).stav, leg: { ne: ['bez adaptéru', '--ok'], cast: ['jen ploché vidlice', '--warn'], ano: ['adaptér nutný', '--danger'] } },
  napeti: { nazev: 'Napětí', fn: z => J.napeti(PODLE[domov], z).stav, leg: { ok: ['stejné napětí', '--ok'], menic: ['jiné napětí', '--danger'] } },
  jizda: { nazev: 'Strana jízdy', fn: z => z.jizda, leg: { P: ['vpravo', '--accent'], L: ['vlevo', '--warn'] } },
  voda: { nazev: 'Kohoutková voda', fn: z => z.voda, leg: { a: ['pitná', '--ok'], c: ['místně opatrně', '--warn'], n: ['raději balená', '--danger'] } },
  spropitne: { nazev: 'Spropitné', fn: z => String(z.spropitne), leg: { 0: ['není zvykem', '--ok'], 1: ['drobné', '--accent'], 2: ['asi 10 %', '--warn'], 3: ['15–20 %', '--danger'] } },
  cas: { nazev: 'Časový posun', fn: z => { const h = Math.abs(J.rozdilCasu(PODLE[domov].pasma[0], z.pasma[0])) / 60; return h < 1 ? 'a' : h < 3 ? 'b' : h < 7 ? 'c' : 'd'; }, leg: { a: ['do 1 h', '--ok'], b: ['1–3 h', '--accent'], c: ['3–7 h', '--warn'], d: ['7 h a víc', '--danger'] } },
  trasa: { nazev: 'Trasa a oblíbené', fn: z => vTrase(z.kod) ? 't' : oblibene.has(z.kod) ? 'o' : '', leg: { t: ['v trase', '--accent'], o: ['oblíbené', '--warn'] } }
};
let mapa = null, mapaPolygony = {};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function nactiSkript(src) {
  return new Promise((ok, chyba) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => chyba(new Error(src)); document.head.appendChild(s); });
}
function mapaHtml() {
  const b = BARVY[barvaMapy] || BARVY.adapter;
  return `<div class="mapa-hlava"><label>Obarvit: <select class="vstup" id="barvaMapy">${Object.entries(BARVY).map(([k, v]) => `<option value="${k}"${k === barvaMapy ? ' selected' : ''}>${v.nazev}</option>`).join('')}</select></label>
    <span class="legenda">${Object.values(b.leg).map(([t, c]) => `<span><i style="background:var(${c})"></i>${t}</span>`).join('')}<span><i style="background:var(--bg-control)"></i>${barvaMapy === 'trasa' ? 'ostatní' : 'bez údajů'}</span></span>
    ${barvaMapy === 'trasa' ? `<span class="vyber-info" id="vyberInfo">${vyberInfo()}</span>` : ''}</div>
    <div id="mapa" role="application" aria-label="Mapa světa"><p class="tip" style="padding:20px">Načítám mapu…</p></div>`;
}
const vyberInfo = () => `<span class="tip" style="margin:0">Klepnutím na zemi ji přidáte do cesty „${esc(cesta().nazev)}“ nebo odeberete.</span><button class="btn" data-pohled="trasa">🧳 Hotovo – zpět na trasu (${trasa.length})</button>`;
const tlTrasy = kod => `<button class="btn mini" data-trasa="${kod}" style="margin-top:6px">${vTrase(kod) ? '✓ V trase' : '➕ Do trasy'}</button>`;
async function kresliMapu() {
  try {
    if (!window.L) await nactiSkript('lib/leaflet/leaflet.js');
    if (!window.CM_SVET) await nactiSkript('cestovni_mapa/svet.js');
  } catch (e) { if ($('mapa')) $('mapa').innerHTML = '<p class="tip" style="padding:20px">Mapu se nepodařilo načíst.</p>'; return; }
  if (!$('mapa') || pohled !== 'mapa') return;
  $('mapa').innerHTML = '';
  mapa = L.map('mapa', { worldCopyJump: false, minZoom: 1, maxZoom: 7, zoomSnap: 0.5, attributionControl: true, maxBounds: [[-85, -200], [85, 200]] });
  mapa.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  mapa.attributionControl.addAttribution('Hranice: <a href="https://www.naturalearthdata.com" target="_blank" rel="noopener">Natural Earth</a> (volné dílo)');
  mapaPolygony = {};
  const sv = window.CM_SVET, b = BARVY[barvaMapy] || BARVY.adapter;
  const dek = r => { const out = []; let x = 0, y = 0; for (let i = 0; i < r.length; i += 2) { x += r[i]; y += r[i + 1]; out.push([y * sv.q, x * sv.q]); } return out; };
  const zemeMapy = sv.zeme.filter(m => m.k !== 'ATA' && m.a2 !== 'AQ')
    .map(m => ({ m, plocha: (m.bb[2] - m.bb[0]) * (m.bb[3] - m.bb[1]) })).sort((x, y) => y.plocha - x.plocha);
  for (const { m } of zemeMapy) {
    const z = PODLE[m.a2];
    const barva = z ? css((b.leg[b.fn(z)] || [0, '--bg-control'])[1]) : css('--bg-control');
    const pol = mapaPolygony[m.a2] = L.polygon(m.r.map(r => [dek(r)]), { color: css('--border-strong'), weight: 0.6, fillColor: barva, fillOpacity: z ? 0.75 : 0.5 }).addTo(mapa);
    if (z && barvaMapy === 'trasa') {
      const tip = () => `${nazev(z)} – ${vTrase(z.kod) ? '✓ v cestě (klepnutím odeberete)' : '➕ klepnutím přidáte'}`;
      pol.bindTooltip(tip, { sticky: true });
