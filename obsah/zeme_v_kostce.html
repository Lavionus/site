<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Země v kostce pro cestovatele</title>
<meta name="description" content="Praktické údaje o státech světa: zásuvky a napětí (potřebuji adaptér?), strana jízdy, tísňová čísla, měna, předvolba, čas, spropitné, pitná voda, dálniční poplatky, plán cesty přes více zemí (sada adaptérů), plánovač hovorů přes časová pásma, kurzy a tahák měn, porovnání zemí, mapa, kontrolní seznam a tisk.">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<script src="../theme.js"></script>
<script src="../dialog.js"></script>
<script src="../podpis.js" defer></script>
<script src="zeme_v_kostce/data.js"></script>
<script src="zeme_v_kostce/jadro.js"></script>
<script src="zeme_v_kostce/zasuvky.js"></script>
<script src="zeme_v_kostce/volani.js"></script>
<script src="zeme_v_kostce/vstup.js"></script>
<script src="zeme_v_kostce/ockovani.js"></script>
<script src="zeme_v_kostce/silnice.js"></script>
<script src="zeme_v_kostce/fraze_data.js"></script>
<script src="zeme_v_kostce/klima.js"></script>
<script src="zeme_v_kostce/velikosti.js"></script>
<script src="zeme_v_kostce/pravidla_spani.js"></script>
<script src="zeme_v_kostce/pravidla_priroda.js"></script>
<script src="zeme_v_kostce/pravidla_spolecnost.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-deep,var(--bg));color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.lista{display:flex;align-items:center;gap:6px;padding:4px 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--bg-elevated)),var(--bg-elevated));box-shadow:0 1px 6px rgba(0,0,0,.08);position:relative;z-index:5;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.lista::-webkit-scrollbar{display:none}
.lista > *{flex-shrink:0}
.lista h1{font-size:1.02rem;font-weight:600;white-space:nowrap;margin:0 6px 0 0}
.lista .skup{display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:1px 4px 3px;border-radius:9px;background:color-mix(in srgb,var(--bg-control) 45%,transparent);border:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.lista .skup-nazev{font-size:9.5px;line-height:1.25;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);text-align:center;user-select:none}
.lista .skup-tl{display:flex;align-items:center;gap:2px}
.lista .skup-hledat{flex:1 1 170px;flex-shrink:1;min-width:140px;background:none;border-color:transparent;padding:0}
.lista .skup-hledat .vstup{width:100%}
.lista .vpravo{margin-left:auto;display:flex;gap:4px}
.samostatne .lista{padding-right:72px}
.tl{background:var(--bg-control);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:7px;transition:background .15s,border-color .15s;cursor:pointer;font-size:.84rem;white-space:nowrap;font-family:inherit;line-height:1.3}
.tl:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.tl:focus-visible,.btn:focus-visible,.vstup:focus{outline:2px solid var(--accent);outline-offset:1px}
.tl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
select.tl{padding:4px 6px}
@media (max-width:1100px){.lista .txt{display:none}}
.nabidka{position:fixed;z-index:1100;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:250px;max-height:calc(100vh - 70px);overflow-y:auto}
.nabidka .tl{display:flex;align-items:center;gap:6px;text-align:left;background:none;border-color:transparent;padding:6px 10px;text-decoration:none}
.nabidka .tl:hover{background:var(--bg-hover)}
.nabidka hr{border:0;border-top:1px solid var(--border);margin:4px 0}
[hidden]{display:none !important}
.btn{background:var(--bg-control);color:var(--text);border:1px solid var(--border-strong);padding:6px 11px;border-radius:8px;transition:background .15s,border-color .15s,transform .1s;cursor:pointer;font-size:.84rem;white-space:nowrap;font-family:inherit;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bg-hover);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.mini{padding:3px 8px;font-size:.78rem}
.vstup{background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 9px;font-size:.86rem;font-family:inherit;min-width:0}

main{flex:1;min-height:0;overflow:auto;padding:12px clamp(10px,2.5vw,24px) 40px}
main.mapa-rezim{padding:0;overflow:hidden;display:flex;flex-direction:column}
.obal{max-width:1200px;margin:0 auto}
h2{font-size:1.1rem;margin:4px 0 10px}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.tip{font-size:.8rem;color:var(--text-muted);margin:4px 0 10px;line-height:1.45}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.radek-vyber{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.radek-vyber .vstup{max-width:100%}
.nejiste{font-size:.72rem;color:var(--warn);white-space:nowrap;cursor:help}
.vlajka{font-size:1.3em;margin-right:4px}

/* hlavička karty */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,300px);gap:14px;align-items:stretch;margin-bottom:12px;padding:16px 18px;border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--accent) 20%,var(--bg-panel)) 0%,var(--bg-panel) 65%);box-shadow:var(--shadow)}
.hero-hlava{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-vlajka{font-size:3.6rem;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.hero h2{margin:0;font-size:1.75rem;line-height:1.15}
.hero .podnadpis{color:var(--text-muted);font-size:.86rem;margin-top:2px}
.hero-cas{margin-left:auto;text-align:right}
.hero-cas b{display:block;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-cas small{color:var(--text-muted);font-size:.8rem}
.stitky{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.stitek{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:.82rem;background:color-mix(in srgb,var(--bg-control) 80%,transparent);border:1px solid var(--border);white-space:nowrap}
.stitek.ok{border-color:color-mix(in srgb,var(--ok) 60%,var(--border));background:color-mix(in srgb,var(--ok) 12%,var(--bg-panel))}
.stitek.pozor{border-color:color-mix(in srgb,var(--warn) 65%,var(--border));background:color-mix(in srgb,var(--warn) 13%,var(--bg-panel))}
.stitek.ne{border-color:color-mix(in srgb,var(--danger) 65%,var(--border));background:color-mix(in srgb,var(--danger) 12%,var(--bg-panel))}
.mini-mapa{display:block;width:100%;min-height:130px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:color-mix(in srgb,var(--accent) 16%,var(--bg-deep,var(--bg)));cursor:pointer;padding:0;position:relative}
.mini-mapa svg{display:block;width:100%;height:100%}
.mini-mapa .zem{fill:var(--bg-control);stroke:var(--border-strong);stroke-width:.6}
.mini-mapa .zem.vyb{fill:var(--accent);stroke:var(--accent)}
.mini-mapa .mest{fill:var(--bg-panel);stroke:var(--text);stroke-width:1.5}
.mini-mapa .krouzek{fill:none;stroke:var(--accent);stroke-width:2}
.mini-mapa .popis{position:absolute;right:6px;bottom:4px;font-size:.7rem;color:var(--text-muted);background:color-mix(in srgb,var(--bg-panel) 80%,transparent);padding:1px 6px;border-radius:6px}
.mini-mapa:hover{border-color:var(--accent)}
.navigace{display:inline-flex;align-items:stretch}
.navigace .btn{border-radius:0;padding:6px 10px}
.navigace .btn:first-child{border-radius:8px 0 0 8px} .navigace .btn:last-child{border-radius:0 8px 8px 0}
.navigace select{border-radius:0;border-left:0;border-right:0;max-width:220px}
.historie{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:-4px 0 12px;font-size:.8rem;color:var(--text-muted)}
.historie .cip{font-size:.78rem;padding:2px 9px}
@media (max-width:600px){.cipy{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}.cipy>*{flex-shrink:0}.prepinac{order:-1;margin-left:0}}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-cas{margin-left:0;text-align:left;flex-basis:100%}.mini-mapa{height:150px}}
/* slunce */
.den-pruh{position:relative;height:16px;border-radius:8px;background:color-mix(in srgb,var(--accent) 22%,var(--bg-control));overflow:hidden;margin:8px 0 3px}
.den-pruh i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 35%,transparent),color-mix(in srgb,var(--warn) 75%,transparent),color-mix(in srgb,var(--warn) 35%,transparent))}
.den-pruh b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);border-radius:1px}
.den-osa{display:flex;justify-content:space-between;font-size:.68rem;color:var(--text-faint);font-variant-numeric:tabular-nums}
.slunce-cisla{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.slunce-cisla b{font-size:1.15rem;font-variant-numeric:tabular-nums}
/* dlaždice přehledu */
.prepinac{display:inline-flex;margin-left:auto}
.prepinac .cip{border-radius:0} .prepinac .cip:first-child{border-radius:999px 0 0 999px} .prepinac .cip:last-child{border-radius:0 999px 999px 0;border-left:0}
.dlazdice{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.dlazdice-z{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dlazdice-z:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.dlazdice-z:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dl-hlava{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dl-hlava .dl-vlajka{font-size:2rem;line-height:1}
.dl-hlava b{display:block;font-size:.98rem;line-height:1.2}
.dl-hlava small{color:var(--text-muted);font-size:.74rem}
.dl-hlava .hvezda{margin-left:auto;align-self:flex-start}
.dl-radky{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:.78rem;color:var(--text-muted)}
.dl-radky span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-radky .cely{grid-column:1/-1;color:var(--text)}

/* sekce karty */
.skoky{position:sticky;top:-12px;z-index:4;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0;margin:-4px 0 4px;background:var(--bg-deep,var(--bg))}
.skoky::-webkit-scrollbar{display:none}
.skoky .cip{flex-shrink:0}
h2.sekce{font-size:1rem;margin:18px 0 8px;display:flex;align-items:center;gap:8px;scroll-margin-top:52px}
h2.sekce::after{content:"";flex:1;height:1px;background:var(--border)}
.panel.siroky{grid-column:1/-1}
.mrizka2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:10px;align-items:start}
.znacky{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px}
.znacka{text-align:center;font-size:.72rem;color:var(--text-muted)}
.znacka b{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:6px solid var(--danger);background:var(--bg-panel);color:var(--text);font-size:1.05rem;margin:0 auto 3px;font-variant-numeric:tabular-nums}
.vybava{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.ock{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:4px}
.ock li{display:flex;gap:8px;align-items:center;font-size:.88rem}
.uroven{font-size:.7rem;border-radius:999px;padding:1px 8px;border:1px solid var(--border);white-space:nowrap;min-width:7.5em;text-align:center;flex-shrink:0}
.uroven.povinne{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.uroven.doporuceno{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.uroven.prijezd,.uroven.zvazit{border-color:var(--border-strong)}
.vstup-kat{display:inline-block;font-weight:600;padding:4px 12px;border-radius:8px;margin-bottom:6px}
.klima svg{display:block;width:100%;height:auto;overflow:visible}
.klima .rozsah{fill:color-mix(in srgb,var(--warn) 80%,transparent)}
.klima .srazky{fill:color-mix(in srgb,var(--accent) 75%,transparent)}
.klima .zvyr{fill:var(--accent-soft)}
.klima text{fill:var(--text-muted);font-size:10px;font-family:inherit}
.klima text.hod{fill:var(--text);font-weight:600}
.klima .mrizka-l{stroke:var(--border);stroke-width:1}
.klima .nula{stroke:var(--text-faint);stroke-dasharray:3 3}
.klima .hit{fill:transparent;cursor:default}
.klima .hit:hover{fill:color-mix(in srgb,var(--text) 6%,transparent)}
.svatky{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:.86rem}
.svatky li{display:flex;gap:8px;align-items:baseline}
.svatky .d{font-variant-numeric:tabular-nums;color:var(--text-muted);min-width:6.5em;white-space:nowrap}
.svatky small{color:var(--text-muted)}
details.vic summary{cursor:pointer;color:var(--accent);font-size:.84rem;margin-top:6px}
.fraze td{vertical-align:middle;padding:5px 6px}
.fraze td:first-child{color:var(--text-muted);white-space:nowrap}
.fraze .orig{font-weight:600;font-size:.95rem}
.fraze .vysl{color:var(--text-muted);font-style:italic}
.fraze tbody tr{cursor:default}
.jazyky-tl{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
/* příroda a pravidla */
.pravidla{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:8px}
.pravidlo{border:1px solid var(--border);border-left:4px solid var(--border-strong);border-radius:10px;padding:8px 10px;background:var(--bg-panel)}
.pravidlo.ok{border-left-color:var(--ok)} .pravidlo.pozor{border-left-color:var(--warn)} .pravidlo.ne{border-left-color:var(--danger)}
.pravidlo .pr-hlava{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.9rem}
.pravidlo .pr-hlava .stitek{margin-left:auto;padding:1px 8px;font-size:.74rem}
.pravidlo p{margin:5px 0 0;font-size:.84rem;line-height:1.4;color:var(--text-muted)}
.matice td,.matice th{text-align:center}
.matice td:first-child,.matice th:first-child{text-align:left}
.matice .zn{display:inline-block;min-width:1.6em;border-radius:6px;padding:1px 4px;cursor:help}
.zn.ok{background:color-mix(in srgb,var(--ok) 22%,transparent)} .zn.pozor{background:color-mix(in srgb,var(--warn) 24%,transparent)} .zn.ne{background:color-mix(in srgb,var(--danger) 22%,transparent)}
/* časová osa trasy */
.osa{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px}
.osa .den{flex:0 0 auto;min-width:40px;text-align:center;border-radius:8px;padding:4px 2px;background:var(--bg-control);border:1px solid var(--border);font-size:.74rem;line-height:1.3}
.osa .den.lichy{background:color-mix(in srgb,var(--accent) 14%,var(--bg-panel))}
.osa .den.vikend{border-top:3px solid var(--danger)}
.osa .den.vikend small{color:var(--text);font-weight:700}
.osa .den b{display:block;font-size:.85rem}
.osa .den .vl{font-size:1rem;display:block;min-height:1.3em}
.osa .den.svatek{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.osa .den.zmena{border-color:var(--danger)}
.upozorneni{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:3px;font-size:.85rem}
.rozpocet input{width:6.5em;text-align:right}
.rozpocet td{vertical-align:middle}
.rozpocet tbody tr{cursor:default}
.rozpocet tfoot td{font-weight:700;border-top:2px solid var(--border-strong)}
/* velikosti */
.tab-velikosti td,.tab-velikosti th{text-align:center;cursor:default}
.tab-velikosti tbody tr{cursor:default}
.tab-velikosti .zvyr{background:var(--accent-soft);font-weight:600}
.prevodnik{display:grid;gap:6px}
.prevodnik .kurz-radek span{min-width:6.5em;color:var(--text-muted);font-size:.85rem}
/* paleta Ctrl+K */
.paleta-obal{position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,.4);display:flex;justify-content:center;align-items:flex-start;padding:10vh 12px 0}
.paleta{width:min(620px,100%);background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.paleta input{width:100%;border:0;border-bottom:1px solid var(--border);padding:13px 16px;font-size:1rem;background:var(--bg-panel);color:var(--text);font-family:inherit}
.paleta input:focus{outline:0}
.paleta-seznam{max-height:min(60vh,460px);overflow-y:auto;padding:6px}
.paleta-seznam button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--text);cursor:pointer;font:inherit;font-size:.9rem}
.paleta-seznam button.akt{background:var(--accent-soft)}
.paleta-seznam .druh{font-size:.7rem;color:var(--text-faint);margin-left:auto;white-space:nowrap}
.paleta-pata{font-size:.72rem;color:var(--text-faint);padding:6px 12px;border-top:1px solid var(--border)}
.offline{font-size:.75rem;border:1px solid var(--warn);border-radius:999px;padding:2px 8px;color:var(--text)}

/* zdroje na konci stránky */
.zdroje-pata{margin-top:28px;padding:14px 16px;border-top:2px solid var(--border);font-size:.8rem;line-height:1.55;color:var(--text-muted);scroll-margin-top:52px}
.zdroje-pata h2{font-size:.95rem;color:var(--text);margin:0 0 6px}
.zdroje-pata ul{margin:0 0 8px;padding-left:18px}
.zdroje-pata li{margin-bottom:3px}
.zdroje-pata b{color:var(--text)}
.zdroje-pata p{margin:6px 0}

/* tabulka přehledu */
.tab-obal{overflow-x:auto;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab-obal.prehled-tab{overflow:auto;max-height:calc(100vh - 175px)}
.prehled-tab thead th{position:sticky;top:0;z-index:2;background:var(--bg-panel);box-shadow:inset 0 -1px 0 var(--border)}
.prehled-tab tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg-control) 35%,transparent)}
.prehled-tab tbody tr:hover{background:var(--accent-soft)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--text-muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg-hover)}
td.nw{white-space:nowrap}
.typ{display:inline-block;min-width:1.5em;text-align:center;font-weight:700;font-size:.78rem;border:1px solid var(--border-strong);border-radius:5px;padding:0 4px;margin:1px}
.stav{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stav.ne,.stav.ok{background:var(--ok)} .stav.cast{background:var(--warn)} .stav.ano,.stav.menic{background:var(--danger)}

/* karta země */
.karta-hlava{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.karta-hlava h2{margin:0;font-size:1.5rem}
.karta-hlava .podnadpis{color:var(--text-muted);font-size:.85rem}
.mrizka{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;align-items:start}
.udaj{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem;line-height:1.4}
.udaj dt{color:var(--text-muted)} .udaj dd{margin:0}
.udaj.blok{grid-template-columns:1fr;gap:0} .udaj.blok dd{margin-bottom:6px}
.udaj dd.nw{white-space:nowrap}
.zasuvky{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 8px}
.zasuvka{text-align:center;font-size:.78rem;width:76px}
.zas{width:64px;height:64px;display:block;margin:0 auto 2px}
.zas .tvar{fill:var(--bg-control);stroke:var(--border-strong);stroke-width:2}
.zas .vybrani{fill:none;stroke:var(--border-strong);stroke-width:1.5;stroke-dasharray:3 2}
.zas .otvor{fill:var(--text)}
.zas .pin{fill:var(--accent)}
.verdikt{border-left:4px solid var(--border-strong);padding:6px 10px;border-radius:4px;background:var(--bg-control);font-size:.86rem;line-height:1.45;margin:4px 0}
.verdikt.ok{border-left-color:var(--ok)} .verdikt.pozor{border-left-color:var(--warn)} .verdikt.ne{border-left-color:var(--danger)}
.cisla{display:flex;flex-wrap:wrap;gap:8px}
.cislo{flex:1 1 90px;text-align:center;background:var(--bg-control);border:1px solid var(--border);border-radius:8px;padding:6px 4px;text-decoration:none;color:var(--text)}
.cislo b{display:block;font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums}
.cislo span{font-size:.74rem;color:var(--text-muted)}
.cislo.hlavni{border-color:var(--accent)}
.odkazy{display:flex;flex-wrap:wrap;gap:6px}
.velky-cas{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}

/* porovnání */
.porovnani td:first-child{color:var(--text-muted);white-space:nowrap}
.porovnani td{vertical-align:top}
.porovnani tr.jine td:not(:first-child){background:color-mix(in srgb,var(--warn) 12%,transparent)}

/* kontrolní seznam */
.seznam{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.seznam label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;cursor:pointer;line-height:1.4;font-size:.9rem}
.seznam input{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}
.seznam .dulezite span::after{content:" •";color:var(--danger)}
.seznam input:checked + span{text-decoration:line-through;color:var(--text-muted)}
.pokrok{height:6px;background:var(--bg-control);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.pokrok i{display:block;height:100%;background:var(--ok)}

/* zásuvky – přehled typů */
.typy{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.typy .panel{display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;font:inherit;color:inherit}
.typy .panel:hover{border-color:var(--border-strong)}
.typy .panel[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.typy .panel .zas{margin:0;flex-shrink:0}
.typy b{font-size:1.05rem}
.typy small{display:block;color:var(--text-muted);font-size:.78rem;line-height:1.35;margin-top:2px}

/* mapa */
.mapa-hlava{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);font-size:.84rem}
.legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1px solid var(--border-strong)}
#mapa{flex:1;min-height:300px;background:var(--bg)}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg-elevated);color:var(--text)}
.leaflet-popup-content{margin:10px 12px;font-size:.85rem;line-height:1.45}
.leaflet-bar a{background:var(--bg-elevated);color:var(--text);border-color:var(--border)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--bg-elevated) 80%,transparent)!important;color:var(--text-muted)}
.leaflet-control-attribution a{color:var(--accent)}

.zdroje{font-size:.85rem;line-height:1.55}
.zdroje li{margin-bottom:4px}
a{color:var(--accent)}

/* filtry, oblíbené */
.cipy{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.cip{background:var(--bg-control);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.cip:hover{border-color:var(--border-strong)}
.cip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cip .pocet{margin-left:5px;font-size:.72rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.cip.nula{border-style:dashed;color:var(--text-muted)}
.hvezda{background:none;border:0;cursor:pointer;font-size:1.1rem;color:var(--text-faint);padding:0 2px;line-height:1;font-family:inherit}
.hvezda[aria-pressed="true"]{color:var(--warn)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.ikonka{background:none;border:0;color:var(--text-muted);cursor:pointer;padding:2px 5px;border-radius:4px;font:inherit}
.ikonka:hover{background:var(--bg-hover);color:var(--text)}
.ikonka:focus-visible,.cip:focus-visible,.hvezda:focus-visible{outline:2px solid var(--accent)}
.nabidka label.tl{cursor:default}
.nabidka label.tl select{margin-left:auto;max-width:170px}

/* trasa */
.cesty-lista{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.cesty-lista label{display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--text-muted)}
.cesty-lista select{font-weight:600;color:var(--text);max-width:260px}
.vybirac{position:relative;flex:1 1 300px;max-width:560px}
.vybirac .vstup{width:100%;font-size:.95rem;padding:8px 10px}
.navrhy{position:absolute;z-index:50;left:0;right:0;top:100%;margin:2px 0 0;padding:4px;list-style:none;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);max-height:330px;overflow:auto}
.navrhy li{padding:7px 8px;border-radius:5px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.navrhy li small{color:var(--text-muted);margin-left:auto;white-space:nowrap}
.navrhy li.akt,.navrhy li:hover{background:var(--accent-soft)}
.navrhy li.prazdne{cursor:default;color:var(--text-muted)}
.rychle{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:8px 0 12px}
.rychle .tip{margin:0 4px 0 0}
.souhrn{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.souhrn .cip.ne{border-color:var(--danger)} .souhrn .cip.pozor{border-color:var(--warn)} .souhrn .cip.ok{border-color:var(--ok)}
.itinerar{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:4px}
.itinerar li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.itinerar li.domov{background:transparent;border-style:dashed;color:var(--text-muted);font-size:.88rem;padding:4px 10px}
.itinerar .tahlo{cursor:grab;color:var(--text-faint);user-select:none;font-size:1.1rem;line-height:1}
.itinerar .cislo-z{width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--on-accent,#fff);display:inline-grid;place-items:center;font-size:.78rem;font-weight:700;flex-shrink:0}
.itinerar .nazev-z{font-weight:600;color:var(--text);font-size:.95rem}
.itinerar .terminy{display:flex;flex-wrap:wrap;gap:4px 8px;margin-left:auto;font-size:.78rem;color:var(--text-muted)}
.itinerar .terminy label{display:flex;align-items:center;gap:4px}
.itinerar .terminy .vstup{padding:3px 6px;font-size:.84rem}
.itinerar .noci{font-size:.8rem;color:var(--text-muted);min-width:4.5em;text-align:right;white-space:nowrap}
.itinerar .akce{display:flex}
.itinerar .ikonka:disabled{opacity:.3;cursor:default;background:none}
.itinerar .zast-var{flex-basis:100%;font-size:.8rem;padding-left:2.9em}
.itinerar .zast-var.chyba{color:var(--danger)} .itinerar .zast-var.info{color:var(--text-muted)}
.itinerar li.cil-drop{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.itinerar li.tazeny{opacity:.45}
@media (max-width:600px){.itinerar .akce{margin-left:auto}.itinerar .terminy{margin-left:2.4em}}
.akce-trasy{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(36px + env(safe-area-inset-bottom,0px));z-index:1200;background:var(--bg-elevated);color:var(--text);border:1px solid var(--border-strong);box-shadow:var(--shadow);border-radius:8px;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;font-size:.88rem;max-width:calc(100vw - 24px)}
.mapa-hlava .vyber-info{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adaptery{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:6px}
.adaptery .zasuvka{width:auto;min-width:76px;max-width:160px}
.kapesni{font-size:.82rem}
.kapesni td,.kapesni th{padding:4px 6px;cursor:default}
.kapesni tbody tr{cursor:default}
.seznam-zemi{font-size:.85rem;line-height:1.5;margin:0;padding-left:18px}

/* čas a schůzky */
.hodiny{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;margin-bottom:12px}
.hodiny .panel{position:relative;padding-right:30px}
.hodiny .panel.ref{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hodiny .nazev{font-size:.82rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hodiny .x{position:absolute;top:4px;right:2px;display:flex;flex-direction:column}
table.planovac{border-collapse:separate;border-spacing:2px;font-size:.78rem;width:auto}
.planovac th,.planovac td{padding:3px 0;text-align:center;border:0;min-width:27px;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.planovac th.misto{text-align:left;padding:0 8px 0 2px;min-width:120px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem;color:var(--text);cursor:default;position:sticky;left:0;background:var(--bg-panel);z-index:1}
.planovac td{border-radius:4px;cursor:pointer;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.planovac td.prace{background:color-mix(in srgb,var(--ok) 32%,transparent)}
.planovac td.okraj{background:color-mix(in srgb,var(--warn) 26%,transparent)}
.planovac td.noc{background:var(--bg-control);color:var(--text-muted)}
.planovac .vyb{outline:2px solid var(--accent);outline-offset:-1px}
.planovac thead th{color:var(--text-muted);font-weight:500}
.planovac thead th.spolecne{color:var(--ok);font-weight:700}
.planovac sup{font-size:.62rem;color:var(--text-muted);margin-left:1px}
.legenda-cas{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--text-muted);margin:6px 0}
.legenda-cas i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.prevod{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:.9rem}
.prevod b{font-variant-numeric:tabular-nums}

/* měny */
.kurz-radek{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.kurz-radek input{width:8.5em}
.kurz-radek .vstup[type=number]{text-align:right}
.tahaky{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.tahak table{font-size:.85rem}
.tahak td{padding:2px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tahak td:last-child{text-align:right}
.tahak tbody tr{cursor:default}
.meny-tab td{vertical-align:middle}
.meny-tab tbody tr{cursor:default}
.meny-tab input{width:7em}

@media (max-width:480px){.udaj{grid-template-columns:1fr}.udaj dd{margin-bottom:4px}}
@media print{
  .hero{box-shadow:none;background:#fff;border-color:#999;grid-template-columns:1fr}.mini-mapa,.historie,.prepinac{display:none!important}
  .tab-obal.prehled-tab{max-height:none}
  .lista,.nabidka,.radek-vyber,.tisk-ne,#podpis-pruh,.toast,.itinerar .tahlo,.itinerar .akce{display:none!important}
  body{display:block;height:auto;background:#fff;color:#000}
  main{overflow:visible;padding:0}
  .panel{break-inside:avoid;background:#fff;border-color:#999}
  .mrizka{grid-template-columns:1fr 1fr}
  .cislo{border-color:#999;background:#fff}
  .tab-obal{overflow:visible;border-color:#999}
  .tahaky{grid-template-columns:1fr 1fr 1fr}
  .planovac th.misto{position:static}
}
</style>

<body>
<header class="lista" id="lista">
  <h1>🌍 Země v kostce</h1>
  <div class="skup" role="group" aria-label="Zobrazit"><span class="skup-nazev" aria-hidden="true">Zobrazit</span><div class="skup-tl">
    <button class="tl" data-pohled="prehled" aria-pressed="true" title="Tabulka všech zemí s filtry (1)">📋<span class="txt"> Přehled</span></button>
    <button class="tl" data-pohled="karta" aria-pressed="false" title="Karta vybrané země (2)">🗂️<span class="txt"> Karta země</span></button>
    <button class="tl" data-pohled="trasa" aria-pressed="false" title="Plán cesty přes více zemí (3)">🧳<span class="txt"> Trasa</span><span id="pocetTrasy"></span></button>
    <button class="tl" data-pohled="mapa" aria-pressed="false" title="Mapa světa (4)">🗺️<span class="txt"> Mapa</span></button>
  </div></div>
  <div class="skup" role="group" aria-label="Nástroje"><span class="skup-nazev" aria-hidden="true">Nástroje</span><div class="skup-tl">
    <button class="tl" id="tlNastroje" data-nabidka="nabNastroje" aria-expanded="false" aria-pressed="false" title="Porovnání, čas a schůzky, měny, seznam před cestou, zásuvky">🧰<span class="txt"> Nástroje</span> ▾</button>
  </div></div>
  <div class="skup" role="group" aria-label="Filtr"><span class="skup-nazev" aria-hidden="true">Oblast</span><div class="skup-tl">
    <select class="tl" id="oblast" aria-label="Oblast"><option value="">Celý svět</option></select>
  </div></div>
  <div class="skup skup-hledat">
    <input type="search" id="hledat" class="vstup" placeholder="🔍 Země, měna, předvolba… ( / )" aria-label="Hledat zemi" autocomplete="off">
  </div>
  <span class="vpravo">
    <span class="offline" id="offline" hidden title="Bez připojení – kurzy a svátky z uložených dat">📴 offline</span>
    <button class="tl" data-prikaz="paleta" title="Rychlé hledání zemí a příkazů (Ctrl+K)" aria-label="Rychlé hledání">⌘K</button>
    <button class="tl" data-nabidka="nabVice" id="tlDomov" aria-expanded="false" title="Domovská země – adaptér, napětí, čas a měna se porovnávají s ní"></button>
    <button class="tl" data-nabidka="nabVice" aria-expanded="false" title="Domovská země, tisk, sdílení, export, zdroje">☰<span class="txt"> Více</span> ▾</button>
  </span>
</header>

<div id="nabNastroje" class="nabidka" hidden>
  <button class="tl" data-pohled="porovnani" aria-pressed="false">⚖️ Porovnání dvou zemí <small>(5)</small></button>
  <button class="tl" data-pohled="cas" aria-pressed="false">🕒 Čas a plánovač schůzek <small>(6)</small></button>
  <button class="tl" data-pohled="meny" aria-pressed="false">💱 Měny, kurzy a tahák <small>(7)</small></button>
  <button class="tl" data-pohled="seznam" aria-pressed="false">✅ Kontrolní seznam před cestou <small>(8)</small></button>
  <button class="tl" data-pohled="zasuvky" aria-pressed="false">🔌 Typy zásuvek A–O <small>(9)</small></button>
  <button class="tl" data-pohled="velikosti" aria-pressed="false">👕 Velikosti a jednotky</button>
</div>

<div id="nabVice" class="nabidka" hidden>
  <label class="tl">🏠 Domov <select class="vstup" id="domovSel" aria-label="Domovská země"></select></label>
  <hr>
  <button class="tl" data-prikaz="tisk">🖨️ Vytisknout (karta, trasa, seznam, tahák)</button>
  <button class="tl" data-prikaz="odkaz">🔗 Kopírovat odkaz na zemi / trasu</button>
  <button class="tl" data-prikaz="csv">⬇️ Export přehledu do CSV</button>
  <button class="tl" data-prikaz="offline">📥 Připravit na cestu (offline)</button>

</div>

<main id="hlavni"><div class="obal" id="obsah"></div></main>
<div id="paleta" class="paleta-obal" hidden><div class="paleta" role="dialog" aria-modal="true" aria-label="Rychlé hledání">
  <input id="paletaVstup" type="search" autocomplete="off" placeholder="Země, nástroj nebo příkaz…" role="combobox" aria-expanded="true" aria-controls="paletaSeznam" aria-autocomplete="list">
  <div class="paleta-seznam" id="paletaSeznam" role="listbox"></div>
  <div class="paleta-pata">↑ ↓ výběr · Enter otevřít · Esc zavřít</div></div></div>
<div id="toast" class="toast" role="status" hidden><span></span><button class="btn mini" id="toastZpet">↶ Vrátit</button></div>

<script>
(() => {
'use strict';
const J = window.ZVK, D = window.ZVK_DATA;
const $ = id => document.getElementById(id);
const P = 'webapp_zeme_v_kostce_';
const nacti = (k, v) => { try { const x = localStorage.getItem(P + k); return x === null ? v : JSON.parse(x); } catch { return v; } };
const zapamatuj = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };
const objekt = x => x && typeof x === 'object' && !Array.isArray(x);
const nactiPole = k => { const x = nacti(k, []); return Array.isArray(x) ? x : []; };
const nactiObjekt = (k, v) => { const x = nacti(k, v); return objekt(x) ? x : v; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const ZEME = J.nactiZeme(D);
const PODLE = Object.fromEntries(ZEME.map(z => [z.kod, z]));
const MZV = {
  zeme: 'https://mzv.gov.cz/jnp/cz/encyklopedie_statu/index.html',
  varovani: 'https://mzv.gov.cz/jnp/cz/cestujeme/aktualni_doporuceni_a_varovani/index.html',
  drozd: 'https://drozd.mzv.gov.cz/',
  konzul: 'https://mzv.gov.cz/jnp/cz/cestujeme/konzularni_sluzba/index.html'
};
const KURZY_URL = 'https://open.er-api.com/v6/latest/';
const POHLEDY = ['prehled', 'karta', 'trasa', 'mapa', 'porovnani', 'cas', 'meny', 'seznam', 'zasuvky', 'velikosti'];
const NASTROJE = { porovnani: ['⚖️', 'Porovnání'], cas: ['🕒', 'Čas a schůzky'], meny: ['💱', 'Měny a kurzy'], seznam: ['✅', 'Před cestou'], zasuvky: ['🔌', 'Zásuvky'], velikosti: ['👕', 'Velikosti'] };

/* ---------- názvy přes Intl v jazyce webu ---------- */
const loc = () => (window.I18N && I18N.jazyk) || 'cs';
const dn = {};
const intlNazev = (typ, kod) => {
  const k = loc() + typ;
  try { dn[k] = dn[k] || new Intl.DisplayNames(loc(), { type: typ }); return dn[k].of(kod); } catch { return kod; }
};
const nazev = z => intlNazev('region', z.kod);
const menaNazev = m => (loc() === 'cs' && D.meny[m]) || (intlNazev('currency', m) !== m ? intlNazev('currency', m) : D.meny[m] || m);
const jazykNazev = l => { const n = intlNazev('language', l); return (loc() === 'cs' && D.jazyky[l]) || (n && n !== l ? n : D.jazyky[l] || l); };
const vlajka = kod => String.fromCodePoint(...[...kod].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
const nazvyHledani = z => [nazev(z), intlNazev('region', z.kod), new Intl.DisplayNames('en', { type: 'region' }).of(z.kod), ...z.meny.map(menaNazev)];
const serazene = () => ZEME.slice().sort((a, b) => nazev(a).localeCompare(nazev(b), loc()));
const mesto = p => p.split('/').pop().replace(/_/g, ' ');
const cislo = (x, des) => x.toLocaleString(loc(), { maximumFractionDigits: des ?? (Math.abs(x) < 1 ? 4 : Math.abs(x) < 100 ? 2 : 0) });

/* ---------- stav ---------- */

        <span class="cislo-z">${i + 1}</span>
        <button class="ikonka nazev-z" data-zeme="${z.kod}" title="Karta země">${vlajka(z.kod)} ${esc(nazev(PODLE[z.kod]))}</button>
        <span class="terminy"><label>příjezd <input type="date" class="vstup" data-zast-od="${i}" value="${z.od}" aria-label="Příjezd ${esc(nazev(PODLE[z.kod]))}"></label>
          <label>odjezd <input type="date" class="vstup" data-zast-do="${i}" value="${z.do}"${z.od ? ` min="${z.od}"` : ''} aria-label="Odjezd ${esc(nazev(PODLE[z.kod]))}"></label></span>
        <span class="noci">${n != null && n >= 0 ? `🌙 ${n} ${tvar(n, 'noc', 'noci', 'nocí')}` : ''}</span>
        <span class="akce"><button class="ikonka" data-zast-posun="${i}:-1"${i ? '' : ' disabled'} title="Posunout dříve" aria-label="Posunout dříve">↑</button><button class="ikonka" data-zast-posun="${i}:1"${i < zast.length - 1 ? '' : ' disabled'} title="Posunout později" aria-label="Posunout později">↓</button><button class="ikonka" data-trasa="${z.kod}" title="Odebrat z cesty" aria-label="Odebrat">✕</button></span>
        ${v.map(x => `<div class="zast-var ${x.typ}">${x.typ === 'chyba' ? '⚠️' : 'ℹ️'} ${esc(x.text)}</div>`).join('')}</li>`;
    }).join('')}
    <li class="domov">🏠 Návrat: <b>${esc(nazev(dom))}</b>${k.do ? ' · ' + fmtDen(k.do) : ''}</li></ol>`;

  const akce = `<div class="akce-trasy tisk-ne">
      <button class="btn" data-prikaz="tisk">🖨️ Tisk (kapesní karta)</button>
      <button class="btn" data-prikaz="odkaz">🔗 Sdílet odkazem</button>
      <button class="btn" data-pohled-trasa="seznam">✅ Kontrolní seznam</button>
      <button class="btn" data-pohled-trasa="cas">🕒 Hodiny a hovory</button>
      <button class="btn" data-pohled="meny">💱 Měny a tahák</button></div>`;
  const sada = J.sadaAdapteru(dom, cile);
  const menic = cile.filter(z => J.napeti(dom, z).stav === 'menic'), hz = cile.filter(z => J.napeti(dom, z).hz);
  const cast = cile.filter(z => J.adapter(dom, z).stav === 'cast');
  const meny = [...new Set(cile.flatMap(z => z.meny))];
  const jinaJizda = cile.filter(z => z.jizda !== dom.jizda);
  const dalnice = cile.filter(z => z.vineta);
  const voda = cile.filter(z => z.voda === 'n');
  const posuny = cile.map(z => J.rozdilCasu(dom.pasma[0], z.pasma[0]));
  const maxPosun = posuny.reduce((m, p) => Math.abs(p) > Math.abs(m) ? p : m, 0);
  const ciziMeny = meny.filter(m => !dom.meny.includes(m));
  const placene = cile.filter(J.placeneSilnice);
  const chyby = k.varovani.filter(x => x.typ === 'chyba').length;
  const cip = (tr, cil, text) => `<button class="cip ${tr}" data-skoc="${cil}">${text}</button>`;
  const souhrn = `<div class="souhrn tisk-ne" aria-label="Souhrn cesty">
      ${cip(k.dni ? 'ok' : '', 'itinerar', k.dni ? `📅 ${k.dni} ${tvar(k.dni, 'den', 'dny', 'dní')} · ${fmtDen(k.od)} – ${fmtDen(k.do)}` : '📅 termíny nezadány')}
      ${chyby ? cip('ne', 'itinerar', `⚠️ ${chyby} ${tvar(chyby, 'problém', 'problémy', 'problémů')} v termínech`) : ''}
      ${cip(sada.length ? 'pozor' : 'ok', 'p-elektro', sada.length ? `🔌 ${tvar(sada.length, 'adaptér', 'adaptéry', 'adaptérů').replace(/^/, sada.length + ' ')}: ${sada.map(x => x.typ).join(', ')}` : '🔌 bez adaptéru')}
      ${menic.length ? cip('ne', 'p-elektro', `⚡ jiné napětí: ${nazvy(menic)}`) : ''}
      ${cip(ciziMeny.length ? 'pozor' : 'ok', 'p-meny', ciziMeny.length ? `💱 ${ciziMeny.join(', ')}` : '💱 domácí měna')}
      ${cip(placene.length ? 'pozor' : 'ok', 'p-silnice', placene.length ? `🛣️ dálniční poplatky: ${placene.length} ${tvar(placene.length, 'země', 'země', 'zemí')}` : '🛣️ bez poplatků')}
      ${jinaJizda.length ? cip('pozor', 'p-silnice', `🚗 jízda ${jinaJizda[0].jizda === 'L' ? 'vlevo' : 'vpravo'}`) : ''}
      ${cip(Math.abs(maxPosun) >= 180 ? 'pozor' : 'ok', 'p-cas', `🕒 ${maxPosun ? 'posun až ' + J.formatRozdil(maxPosun) : 'stejný čas'}`)}</div>`;

  const elektro = (sada.length
    ? `<div class="adaptery">${sada.map(s => `<div class="zasuvka">${ZVK_SVG(s.typ)}<b>typ ${s.typ}</b><br><small>${nazvy(s.zeme.map(k => PODLE[k]))}</small></div>`).join('')}</div>
       <p class="tip">${sada.length === 1 ? 'Stačí jeden adaptér.' : `Nejmenší sada: ${sada.length} adaptéry` + ' – nebo jeden univerzální cestovní adaptér.'}</p>`
    : `<div class="verdikt ok">Vidlice z ${esc(nazev(dom))} pasují ve všech zemích trasy.</div>`) +
    (cast.length ? `<div class="verdikt pozor">Jen část vidlic z domova projde v: ${cast.map(z => `${esc(nazev(z))} (${J.adapter(dom, z).vidlice.filter(x => x.pasuje).map(x => x.typ).join(', ')})`).join(', ')}.</div>` : '') +
    (menic.length ? `<div class="verdikt ne">⚡ Jiné napětí: ${nazvy(menic)} – spotřebiče bez označení 100–240 V potřebují měnič.</div>` : '<div class="verdikt ok">⚡ Napětí všude odpovídá.</div>') +
    (hz.length ? `<div class="verdikt pozor">〰️ Jiný kmitočet: ${nazvy(hz)}.</div>` : '');

  const menyHtml = meny.map(m => `<div style="margin-bottom:6px"><b>${m}</b> – ${esc(menaNazev(m))} <small class="tip">(${nazvy(cile.filter(z => z.meny.includes(m)))})</small><br><span style="font-size:.86rem">${m === domMena() ? 'domácí měna' : kurzText(m)}</span></div>`).join('') +
    `<p class="tip">${kurzyStari()} <button class="btn mini tisk-ne" data-pohled="meny">💱 Tahák a kalkulačka</button></p>`;

  const silnice = (jinaJizda.length ? `<div class="verdikt pozor">🚗 Jinak než doma se jezdí v: ${nazvy(jinaJizda)} (${jinaJizda[0].jizda === 'L' ? 'vlevo' : 'vpravo'}).</div>` : '<div class="verdikt ok">🚗 Všude se jezdí na stejné straně jako doma.</div>') +
    (dalnice.length ? `<dl class="udaj blok" style="margin-top:6px">${dalnice.map(z => `<dt>${vlajka(z.kod)} ${esc(nazev(z))}</dt><dd>${esc(z.vineta)}</dd>`).join('')}</dl><p class="tip">Stav 11/2026 – ověřte před cestou.</p>` : '');

  const cas = `<dl class="udaj">${cile.map((z, i) => `<dt>${vlajka(z.kod)} ${esc(nazev(z))}</dt><dd class="nw"><span data-cas="${esc(z.pasma[0])}">${esc(casZeme(z.pasma[0]))}</span> · ${posuny[i] ? J.formatRozdil(posuny[i]) : 'stejný čas'}${z.pasma.length > 1 ? ' *' : ''}</dd>`).join('')}</dl>`;

  const kapesni = `<div class="tab-obal"><table class="kapesni"><thead><tr><th>Země</th>${k.dni ? '<th>📅 Termín</th>' : ''}<th>🆘 Policie / Záchr. / Hasiči</th><th>Jednotné</th><th>📞 Předvolba</th><th>🔌 Zásuvky</th><th>💱 Měna</th><th>🕒 Posun</th><th>☎️ Domů</th><th>🚰 Voda</th></tr></thead><tbody>
    ${cile.map((z, i) => `<tr><td class="nw">${vlajka(z.kod)} ${esc(nazev(z))}</td>${k.dni ? `<td class="nw">${fmtDen(zast[i].od)}${zast[i].do ? '–' + fmtDen(zast[i].do) : ''}</td>` : ''}<td class="nw"><b>${z.tisnova.map(c => c || '?').join(' / ')}</b>${nej(z, 't')}</td><td class="nw"><b>${z.jednotne || '–'}</b></td>
      <td class="nw">${z.predvolba}</td><td class="nw">${z.zasuvky.join(', ')} · ${z.napeti.join('/')} V</td><td class="nw">${z.meny.join(', ')}</td><td class="nw">${posuny[i] ? J.formatRozdil(posuny[i]) : '0'}</td><td class="nw">${vystup(z.kod)} ${cislaPredvolby(dom)}</td><td>${{ a: 'pitná', c: 'opatrně', n: 'balená' }[z.voda]}</td></tr>`).join('')}
    </tbody></table></div><p class="tip">Velvyslanectví ČR: <a href="${MZV.zeme}" target="_blank" rel="noopener">mzv.gov.cz → Informace o státech</a> · Registrace cesty: <a href="${MZV.drozd}" target="_blank" rel="noopener">drozd.mzv.gov.cz</a></p>`;

  const vstupy = domov === 'CZ' ? cile.map(z => [z, DVS.zeme[z.kod]]).filter(x => x[1]) : [];
  const nejhorsi = ['vizum', 'vop', 'evisa', 'eta', 'pas', 'op'].find(kat => vstupy.some(x => x[1][0] === kat));
  const ockVse = cile.flatMap(z => J.ockovaniZeme(DO.zeme[z.kod]).filter(x => x.uroven !== 'prijezd'));
  const povinna = ockVse.some(x => x.uroven === 'povinne');
  const souhrn2 = (nejhorsi ? cip(VSTUP_TRIDA[nejhorsi], 'p-doklady', '🛂 ' + VSTUP_KRATCE[nejhorsi]) : '') +
    (ockVse.length ? cip(povinna ? 'ne' : 'pozor', 'p-zdravi', povinna ? '💉 povinné očkování' : '💉 očkování ke zvážení') : '') +
    (cile.some(z => (DO.zeme[z.kod] || {}).malarie) ? cip('ne', 'p-zdravi', '🦟 malárie') : '');
  return lista + `<h2>🧳 ${esc(c.nazev)}: ${esc(nazev(dom))} → ${nazvy(cile)}${k.dni ? ` <small class="tip">(${fmtDen(k.od)} – ${fmtDen(k.do)})</small>` : ''}</h2>` + souhrn.replace('</div>', souhrn2 + '</div>') + vybirac + `<div id="itinerar">${itinerar}</div>` + akce + osaHtml(zast, k) + `
    <div class="mrizka">
      <section class="panel" id="p-elektro"><h3>🔌 Adaptéry do kufru</h3>${elektro}</section>
      <section class="panel" id="p-meny"><h3>💱 Měny</h3>${menyHtml}</section>
      <section class="panel" id="p-silnice"><h3>🛣️ Silnice a dálniční poplatky</h3>${silnice}</section>
      <section class="panel" id="p-cas"><h3>🕒 Čas oproti domovu</h3>${cas}
        ${voda.length ? `<p class="tip">🚰 Kohoutkovou vodu raději nepít: ${nazvy(voda)}.</p>` : ''}</section>
      <section class="panel" id="p-jetlag"><h3>😴 Jet lag</h3>${jetlagHtml(dom, zast, k)}</section>
      <section class="panel" id="p-doklady"><h3>🛂 Doklady a vstup</h3>${dokladyTrasy(cile)}</section>
      <section class="panel" id="p-zdravi"><h3>💉 Očkování a zdraví</h3>${zdraviTrasy(cile)}</section>
      <section class="panel" id="p-pocasi"><h3>🌡️ Počasí v termínu</h3>${pocasiTrasy(zast)}</section>
    </div>
    ${silniceTrasy(cile) ? `<section class="panel" id="p-pravidla" style="margin-top:10px"><h3>🚗 Pravidla na silnicích</h3>${silniceTrasy(cile)}</section>` : ''}
    ${pravidlaTrasy(cile) ? `<section class="panel" id="p-priroda" style="margin-top:10px"><h3>🏕️ Příroda a pravidla</h3>${pravidlaTrasy(cile)}</section>` : ''}
    <section class="panel" id="p-rozpocet" style="margin-top:10px"><h3>💰 Rozpočet podle měn</h3>${rozpocetHtml(zast, k)}</section>
    <section class="panel" id="p-kapesni" style="margin-top:10px"><h3>🆘 Kapesní karta – ${esc(c.nazev)}</h3>${kapesni}</section>`;
}

/* ---------- příroda a pravidla (stan, auto, pláže, oheň, sběr, alkohol, dron, nahota) ---------- */
const PRAVIDLA = [window.ZVK_PRAVIDLA_SPANI, window.ZVK_PRAVIDLA_PRIRODA, window.ZVK_PRAVIDLA_SPOLECNOST].filter(Boolean);
const pravidla = kod => Object.assign({}, ...PRAVIDLA.map(d => (d.zeme && d.zeme[kod]) || {}));
const pravNejiste = kod => PRAVIDLA.some(d => (d.nejiste || []).includes(kod));
const TEMATA = [['stan', '🏕️', 'Stan volně v přírodě'], ['auto', '🚐', 'Spaní v autě / obytňáku'], ['plaz', '🏖️', 'Pláže a koupání'], ['ohen', '🔥', 'Oheň v přírodě'],
  ['sber', '🍄', 'Houby a lesní plody'], ['alkohol', '🍺', 'Alkohol na veřejnosti'], ['dron', '🛸', 'Dron'], ['nahota', '🌞', 'Nudismus a topless']];
const KAT = { ano: ['ok', 'legální', '✔'], tolerovano: ['pozor', 'tolerováno', '~'], omezeno: ['pozor', 's omezením', '!'], ne: ['ne', 'zakázáno', '✖'], nejasne: ['', 'nejasné', '?'] };
const katPrav = x => KAT[x && x[0]] || KAT.nejasne;
function pravidlaPanel(z) {
  const p = pravidla(z.kod);
  const pol = TEMATA.filter(([k]) => p[k]).map(([k, i, t]) => { const [tr, txt] = katPrav(p[k]); return `<div class="pravidlo ${tr}"><div class="pr-hlava">${i} <b>${t}</b><span class="stitek ${tr}">${txt}</span></div>${p[k][1] ? `<p>${esc(p[k][1])}</p>` : ''}</div>`; }).join('');
  if (!pol) return '<p class="tip">Pro tuto zemi údaje nemáme.</p>';
  return `<div class="pravidla">${pol}</div><p class="tip" style="margin:8px 0 0">${pravNejiste(z.kod) ? '<span class="nejiste">⚠️ část údajů neověřena</span> ' : ''}Orientačně, stav 11/2026. Pravidla se liší podle regionů, v národních parcích a chráněných územích platí přísnější; místní značení má přednost.</p>`;
}
function pravidlaTrasy(cile) {
  const s = cile.filter(z => Object.keys(pravidla(z.kod)).length);
  if (!s.length) return '';
  return `<div class="tab-obal"><table class="kapesni matice"><thead><tr><th>Země</th>${TEMATA.map(([, i, t]) => `<th title="${t}">${i}</th>`).join('')}</tr></thead><tbody>${s.map(z => {
    const p = pravidla(z.kod);
    return `<tr><td class="nw">${vlajka(z.kod)} ${esc(nazev(z))}</td>${TEMATA.map(([k, , t]) => { const [tr, txt, zn] = katPrav(p[k]); return p[k] ? `<td><span class="zn ${tr}" title="${esc(t + ': ' + txt + (p[k][1] ? ' – ' + p[k][1] : ''))}">${zn}</span></td>` : '<td>–</td>'; }).join('')}</tr>`;
  }).join('')}</tbody></table></div>
    <p class="tip" style="margin:6px 0 0">${TEMATA.map(([, i, t]) => `${i} ${t.toLowerCase()}`).join(' · ')}. ✔ legální · ~ tolerováno · ! s omezením · ✖ zakázáno · ? nejasné – podrobnosti najetím myši nebo na kartě země.</p>`;
}

/* ---------- trasa: časová osa, jet lag, doklady, zdraví, počasí, silnice, rozpočet ---------- */
function osaHtml(zast, k) {
  const dny = J.dnyCesty(zast);
  if (!dny.length) return `<section class="panel tisk-ne" style="margin-bottom:10px"><h3>📅 Časová osa</h3><p class="tip" style="margin:0">Doplňte termíny zastávek – ukáže se osa po dnech se státními svátky, změnami času a východem a západem slunce.</p></section>`;
  const poradi = Object.fromEntries(zast.map((z, i) => [z.kod, i]));
  const upoz = [], nacita = new Set(), chybi = new Set();
  const svatkyDne = {};
  for (const z of zast) {
    if (!z.od) continue;
    const roky = [];
    for (let r = +z.od.slice(0, 4); r <= +(z.do || z.od).slice(0, 4); r++) roky.push(r);
    for (const r of roky) {
      const sv = svatkyRok(z.kod, +r);
      if (sv === undefined) nacita.add(z.kod); else if (sv === null) chybi.add(z.kod);
      for (const x of sv || []) if (x.den >= z.od && x.den <= (z.do || z.od)) {
        (svatkyDne[x.den] = svatkyDne[x.den] || []).push(z.kod);
        upoz.push([x.den, `🎉 ${vlajka(z.kod)} ${esc(nazev(PODLE[z.kod]))}: <span data-i18n="ne">${nazevSvatku(x)}</span>`]);
      }
    }
    for (const zm of J.zmenyCasu(PODLE[z.kod].pasma[0], z.od, z.do || z.od))
      upoz.push([zm.den, `🕒 ${vlajka(z.kod)} ${esc(nazev(PODLE[z.kod]))}: posun hodin ${zm.na > zm.z ? 'dopředu (+' : 'zpět (−'}${Math.abs(zm.na - zm.z) / 60} h)`]);
  }
  const zmenyDne = new Set(upoz.filter(u => u[1].startsWith('🕒')).map(u => u[0]));
  const bunky = dny.map(d => {
    const kod = d.kody[d.kody.length - 1] || '', z = PODLE[kod], hm = z && hlMesto(kod);
    let sl = '';
    if (hm) { const x = J.slunce(hm.sirka, hm.delka, d.den); sl = x.stav ? (x.stav === 'den' ? ' · polární den' : ' · polární noc') : ` · ☀️ ${fmtHod(x.vychod, z.pasma[0])}–${fmtHod(x.zapad, z.pasma[0])}`; }
    const tr = ['den', poradi[kod] % 2 ? 'lichy' : '', VIKEND(d.den) ? 'vikend' : '', svatkyDne[d.den] ? 'svatek' : '', zmenyDne.has(d.den) ? 'zmena' : ''].filter(Boolean).join(' ');
    const dt = new Date(d.den + 'T12:00:00Z');
    return `<div class="${tr}" title="${esc(fmtDatum(d.den) + ' – ' + d.kody.map(x => nazev(PODLE[x])).join(' → ') + sl)}"><small>${esc(dt.toLocaleDateString(loc(), { weekday: 'short', timeZone: 'UTC' }))}</small><b>${dt.getUTCDate()}.</b><span class="vl">${d.kody.map(vlajka).join('')}</span>${svatkyDne[d.den] ? '🎉' : zmenyDne.has(d.den) ? '🕒' : ''}</div>`;
  }).join('');
  upoz.sort((a, b) => a[0].localeCompare(b[0]));
  return `<section class="panel" id="p-osa" style="margin-bottom:10px"><h3>📅 Časová osa – ${k.dni} ${tvar(k.dni, 'den', 'dny', 'dní')}</h3>
    <div class="osa" role="list">${bunky}</div>
    ${upoz.length ? `<ul class="upozorneni">${upoz.map(u => `<li><b>${fmtDatum(u[0])}</b> ${u[1]}</li>`).join('')}</ul>` : nacita.size || chybi.size ? '' : '<p class="tip" style="margin:6px 0 0">V termínu cesty nejsou státní svátky ani změna času (svátky podle databáze Nager.Date).</p>'}
    ${nacita.size ? `<p class="tip" style="margin:6px 0 0">${navigator.onLine === false ? 'Offline – svátky nejsou uložené' : 'Načítám svátky'}: ${[...nacita].map(k => esc(nazev(PODLE[k]))).join(', ')}.</p>` : ''}
    ${chybi.size ? `<p class="tip" style="margin:6px 0 0">Svátky nejsou v databázi pro: ${[...chybi].map(k => esc(nazev(PODLE[k]))).join(', ')}.</p>` : ''}
    <p class="tip" style="margin:6px 0 0">🎉 státní svátek · 🕒 změna času · víkend červeně · najetím myši východ a západ slunce v hlavním městě.</p></section>`;
}
function jetlagHtml(dom, zast, k) {
  if (!zast.length) return '';
  /* úseky domov → 1. zastávka → … → domov; plán jen u přejezdů s posunem aspoň 3 h */
  const body = [{ kod: domov }, ...zast, { kod: domov, od: k.do }];
  const useky = body.slice(1).map((z, i) => ({ z: PODLE[body[i].kod], na: PODLE[z.kod], den: z.od, posun: J.rozdilCasu(PODLE[body[i].kod].pasma[0], PODLE[z.kod].pasma[0]) }))
    .filter(u => u.z.kod !== u.na.kod);
  const plany = useky.map(u => ({ u, j: J.jetlag(u.posun) })).filter(x => x.j);
  if (!plany.length) return `<div class="verdikt ok">Největší posun mezi zastávkami je ${J.formatRozdil(useky.reduce((m, u) => Math.abs(u.posun) > Math.abs(m) ? u.posun : m, 0)) || '0 h'} – jet lag nehrozí.</div>`;
  return plany.map(({ u, j }) => {
    const vych = j.smer === 'vychod';
    const od = u.den ? ` (od ${fmtDen(J.pridejDny(u.den, -j.dnyPred))})` : '';
    return `<div class="verdikt pozor"><b>${vlajka(u.z.kod)} → ${vlajka(u.na.kod)} ${esc(nazev(u.na))}: ${j.hodin} h na ${vych ? 'východ' : 'západ'}</b><br>
      Před přejezdem ${j.dnyPred} ${tvar(j.dnyPred, 'den', 'dny', 'dní')}${od} choďte spát a vstávejte každý den o 1 h ${vych ? 'dřív' : 'později'}.

function dokladyTrasy(cile) {

  return `<dl class="udaj blok">${cile.map(z => { const v = DVS.zeme[z.kod]; return v ? `<dt>${vlajka(z.kod)} ${esc(nazev(z))} – <span class="stitek ${VSTUP_TRIDA[v[0]]}" style="padding:1px 8px">${esc(J.VSTUP[v[0]])}</span>${nejD(DVS, z.kod)}</dt><dd>${esc(v[1] || '')}</dd>` : ''; }).join('')}</dl>
    <p class="tip" style="margin:4px 0 0">Občan ČR, turistika, stav ${esc(DVS.stav || '11/2026')} – ověřte na <a href="${MZV.zeme}" target="_blank" rel="noopener">MZV</a>.</p>`;
}
const UROVNE = ['povinne', 'doporuceno', 'prijezd', 'zvazit'];   // stejné pořadí jako ZVK.ockovaniZeme
function zdraviTrasy(cile) {
  const podle = {};
  for (const z of cile) for (const x of J.ockovaniZeme(DO.zeme[z.kod])) {
    const p = podle[x.k] = podle[x.k] || { nazev: x.nazev, uroven: x.uroven, zeme: [] };
    if (UROVNE.indexOf(x.uroven) < UROVNE.indexOf(p.uroven)) p.uroven = x.uroven;
    p.zeme.push(z.kod);
  }
  const pol = Object.values(podle).sort((a, b) => UROVNE.indexOf(a.uroven) - UROVNE.indexOf(b.uroven));
  const mal = cile.filter(z => (DO.zeme[z.kod] || {}).malarie);
  return (pol.length ? `<ul class="ock">${pol.map(p => `<li><span class="uroven ${p.uroven}">${UROVEN[p.uroven]}</span><span>${esc(p.nazev)} <small class="tip">(${p.zeme.map(k => esc(nazev(PODLE[k]))).join(', ')})</small></span></li>`).join('')}</ul>` : '<div class="verdikt ok">💉 Nad rámec běžných očkování nic zvláštního.</div>') +
    (mal.length ? `<div class="verdikt ${mal.some(z => DO.zeme[z.kod].malarie === 'vysoke') ? 'ne' : 'pozor'}">🦟 Malárie: ${mal.map(z => `${esc(nazev(z))} (${DO.zeme[z.kod].malarie === 'vysoke' ? 'většina země' : 'místně'})`).join(', ')}</div>` : '') +
    `<p class="tip" style="margin:4px 0 0">Žlutá zimnice „při příjezdu z rizikové země“ platí i při přejezdu mezi zeměmi trasy. Konzultace v centru cestovní medicíny 4–8 týdnů předem.</p>`;
}
function pocasiTrasy(zast) {
  const s = zast.filter(z => DK.zeme[z.kod]).map(z => {
    const mes = mesiceMezi(z.od, z.do), kl = DK.zeme[z.kod];
    if (!mes.length) return `<dt>${vlajka(z.kod)} ${esc(nazev(PODLE[z.kod]))}</dt><dd class="tip">bez termínu</dd>`;
    const [mx, mn, mm] = klimaMesice(kl, mes);
    return `<dt>${vlajka(z.kod)} ${esc(nazev(PODLE[z.kod]))}</dt><dd>${mes.map(i => MESICE_PLNE[i]).join(', ')}: <b>${mx} / ${mn} °C</b> · ${mm} mm/měsíc</dd>`;
  }).join('');
  return s ? `<dl class="udaj blok">${s}</dl><p class="tip" style="margin:4px 0 0">Průměrné denní maximum / minimum a srážky v hlavním městě (NASA POWER 2001–2025). Graf po měsících je na kartě země.</p>` : '<p class="tip">Bez klimatických dat.</p>';
}
function silniceTrasy(cile) {
  const s = cile.filter(z => DS.zeme[z.kod]);
  if (!s.length) return '';
  const vyb = [...new Set(s.flatMap(z => DS.zeme[z.kod].vybava || []))];
  return `<div class="tab-obal"><table class="kapesni"><thead><tr><th>Země</th><th>Obec / mimo / dálnice</th><th>Alkohol</th><th>Výbava</th></tr></thead><tbody>${s.map(z => {
    const x = DS.zeme[z.kod];
    return `<tr><td class="nw">${vlajka(z.kod)} ${esc(nazev(z))}</td><td class="nw">${x.lim.map(v => v ?? '–').join(' / ')} km/h</td><td class="nw">${alkText(x)}</td><td>${(x.vybava || []).map(v => esc(J.VYBAVA[v] || v)).join(', ') || '–'}</td></tr>`;
  }).join('')}</tbody></table></div>${vyb.length ? `<p style="margin:6px 0 0;font-size:.88rem">🧰 Do auta pro celou trasu: <b>${vyb.map(v => esc(J.VYBAVA[v] || v)).join(', ')}</b></p>` : ''}`;
}
function rozpocetHtml(zast, k) {
  const d = domMena();
  const pol = zast.map((z, i) => {
    const r = z.rozp || {}, Z = PODLE[z.kod], mena = r.mena && (Z.meny.includes(r.mena) || r.mena === d) ? r.mena : Z.meny[0];
    const dni = k.noci[i] != null && k.noci[i] >= 0 ? k.noci[i] : +r.dni || 0;
    return { i, kod: z.kod, mena, dni, rucne: !(k.noci[i] != null && k.noci[i] >= 0), denne: +r.denne || 0, jedn: +r.jedn || 0 };
  });
  const v = J.rozpocet(pol);
  let celkemDomov = 0, chybiKurz = false;
  const radky = pol.map((p, i) => {
    const c = cena(p.mena), dom = c ? v.polozky[i].castka * c : null;

      <td class="nw">${p.rucne ? `<input type="number" class="vstup" min="0" step="1" data-rozp="${i}:dni" value="${p.dni || ''}" placeholder="0" aria-label="Počet dní" style="width:4.5em">` : p.dni} ${tvar(p.dni, 'noc', 'noci', 'nocí')}</td>
      <td class="nw"><input type="number" class="vstup" min="0" step="any" data-rozp="${i}:denne" value="${p.denne || ''}" placeholder="0" aria-label="Denně"></td>
      <td class="nw"><input type="number" class="vstup" min="0" step="any" data-rozp="${i}:jedn" value="${p.jedn || ''}" placeholder="0" aria-label="Jednorázově"></td>
      <td class="nw">${menyVolba.length > 1 ? `<select class="vstup" data-rozp="${i}:mena" aria-label="Měna">${menyVolba.map(m => `<option${m === p.mena ? ' selected' : ''}>${m}</option>`).join('')}</select>` : p.mena}</td>
      <td class="nw" style="text-align:right"><b>${cislo(v.polozky[i].castka, 0)} ${p.mena}</b>${p.mena !== d && dom != null ? `<br><small class="tip">≈ ${cislo(dom, 0)} ${d}</small>` : ''}</td></tr>`;
  }).join('');
  return `<div class="tab-obal"><table class="kapesni rozpocet"><thead><tr><th>Země</th><th>Pobyt</th><th>Denně</th><th>Jednorázově</th><th>Měna</th><th style="text-align:right">Celkem</th></tr></thead><tbody>${radky}</tbody>
    <tfoot><tr><td colspan="5">${Object.entries(v.podleMen).map(([m, x]) => `${cislo(x, 0)} ${m}`).join(' + ') || 'Zadejte částky'}</td><td class="nw" style="text-align:right">≈ ${cislo(celkemDomov, 0)} ${d}${chybiKurz ? ' *' : ''}</td></tr></tfoot></table></div>
    <p class="tip" style="margin:6px 0 0">Denně = ubytování, jídlo, doprava na místě; jednorázově = vstupenky, vízum, pronájem auta… Pobyt podle nocí z termínů (bez termínů zadejte ručně). Přepočet středním kurzem${chybiKurz ? ' (* u některé měny kurz chybí)' : ''}.</p>`;
}

/* ---------- porovnání ---------- */
function porovnani() {
  const zeme = porovnat.map(k => PODLE[k] || PODLE.CZ), [a, b] = zeme;
  const ad = J.adapter(a, b), np = J.napeti(a, b);
  const kl = (z, i) => DK.zeme[z.kod] ? `${DK.zeme[z.kod][i][0]} / ${DK.zeme[z.kod][i][1]} °C` : '–';
  const sil = z => DS.zeme[z.kod];
  const R = [
    ['Zásuvky', z => typy(z), z => z.zasuvky.join()],
    ['Napětí', napetiText, napetiText],
    ['Jízda', jizdaText, z => z.jizda],
    ['Tísňová čísla', z => z.tisnova.map(c => c || '?').join(' / ') + (z.jednotne ? ' · ' + z.jednotne : ''), z => z.tisnova.join() + z.jednotne],
    ['Měna', z => z.meny.map(m => `${m} – ${esc(menaNazev(m))}`).join('<br>'), z => z.meny.join()],
    ['Předvolba', z => z.predvolba, z => z.predvolba],
    ['Čas teď', z => esc(casZeme(z.pasma[0])), z => J.posunUtc(z.pasma[0])],
    ['Jazyk', z => z.jazyky.map(l => esc(jazykNazev(l))).join(', '), z => z.jazyky.join()],
    ['Jednotky', z => esc(J.jednotky(z.kod)), z => J.jednotky(z.kod)],
    ['Spropitné', z => J.SPROPITNE[z.spropitne], z => z.spropitne],
    ['Voda', z => J.VODA[z.voda], z => z.voda],
    ['Dálnice', z => esc(z.vineta || '–'), z => z.vineta],
    ['Limity (km/h)', z => sil(z) ? sil(z).lim.map(v => v ?? '–').join(' / ') : '–', z => sil(z) ? sil(z).lim.join() : ''],
    ['Alkohol', z => sil(z) ? alkText(sil(z)) : '–', z => sil(z) ? String(sil(z).alk) : ''],
    ...(domov === 'CZ' ? [['Vstup (občan ČR)', z => DVS.zeme[z.kod] ? esc(VSTUP_KRATCE[DVS.zeme[z.kod][0]]) : '–', z => (DVS.zeme[z.kod] || [''])[0]]] : []),
    ['Očkování', z => esc(J.ockovaniZeme(DO.zeme[z.kod]).filter(x => x.uroven !== 'prijezd').map(x => x.nazev).join(', ') || '–'), z => J.ockovaniZeme(DO.zeme[z.kod]).filter(x => x.uroven !== 'prijezd').map(x => x.k).join()],
    ['Malárie', z => ({ vysoke: 'většina země', mistni: 'místně' })[(DO.zeme[z.kod] || {}).malarie] || '–', z => (DO.zeme[z.kod] || {}).malarie || ''],
    ['Leden (max / min)', z => kl(z, 0), z => kl(z, 0)],
    ['Červenec (max / min)', z => kl(z, 6), z => kl(z, 6)],
    ['Volání ven', z => vystup(z.kod), z => vystup(z.kod)],
    ...TEMATA.map(([k, i, t]) => [i + ' ' + t, z => { const x = pravidla(z.kod)[k]; return x ? `<span class="zn ${katPrav(x)[0]}" title="${esc(x[1] || '')}">${katPrav(x)[1]}</span>` : '–'; }, z => (pravidla(z.kod)[k] || [''])[0]])
  ];
  const roz = J.rozdilCasu(a.pasma[0], b.pasma[0]);
  const vybery = zeme.map((z, i) => vyberZeme('por' + 'ABCD'[i], z.kod, i ? 'Země ' + (i + 1) : 'Odkud') + (i >= 2 ? `<button class="ikonka" data-por-x="${i}" title="Odebrat" aria-label="Odebrat">✕</button>` : '')).join(' ');
  const hlava = `<div class="radek-vyber">${vybery.replace(/(<\/select>)/, '$1 <button class="btn" id="prohodit" title="Prohodit první dvě" aria-label="Prohodit země">⇄</button>')}
    ${zeme.length < 4 ? '<button class="btn" id="porPridej">➕ Přidat zemi</button>' : ''}</div>`;
  const tabulka = `<div class="tab-obal"><table class="porovnani"><thead><tr><th></th>${zeme.map(z => `<th>${vlajka(z.kod)} ${esc(nazev(z))}</th>`).join('')}</tr></thead><tbody>
    ${R.map(r => `<tr class="${new Set(zeme.map(r[2]).map(String)).size > 1 ? 'jine' : ''}"><td>${r[0]}</td>${zeme.map(z => `<td>${r[1](z)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  if (zeme.length > 2) return hlava + tabulka + '<p class="tip">Zvýrazněné řádky se liší. Podrobné doporučení (adaptér, jízda, měna) se ukáže při porovnání dvou zemí.</p>';
  return `${hlava}
    <div class="panel" style="margin-bottom:10px"><h3>Cesta ${esc(nazev(a))} → ${esc(nazev(b))}</h3>
      ${verdiktElektro(a, b)}
      <div class="verdikt ${a.jizda === b.jizda ? 'ok' : 'pozor'}">🚗 ${a.jizda === b.jizda ? 'Jezdí se na stejné straně.' : `V cílové zemi se jezdí ${b.jizda === 'L' ? 'vlevo' : 'vpravo'}!`}</div>
      <div class="verdikt ${Math.abs(roz) >= 180 ? 'pozor' : 'ok'}">🕒 ${roz ? 'Časový posun ' + J.formatRozdil(roz) : 'Stejný čas'}.</div>
      ${a.meny.some(m => b.meny.includes(m)) ? '<div class="verdikt ok">💱 Stejná měna.</div>' : `<div class="verdikt pozor">💱 Jiná měna: ${b.meny.join(', ')}.</div>`}

/* ---------- čas a plánovač schůzek ---------- */
const popisHodin = h => { const [k, p] = h.split('|'); const z = PODLE[k]; return nazev(z) + (z.pasma.length > 1 ? ' – ' + mesto(p) : ''); };
function vychoziHodiny() {
  return [...new Set([domov, vybrana, ...trasa].map(k => `${k}|${PODLE[k].pasma[0]}`))];
}
function denDnes(pasmo) { return J.mistniCas(pasmo, new Date()).den; }
function cas() {
  if (!hodiny.length) hodiny = vychoziHodiny();
  const ref = hodiny[0].split('|')[1];
  if (!casDen) casDen = denDnes(ref);
  const [y, m, d] = casDen.split('-').map(Number);
  const pulnoc = J.mistniNaUtc(y, m, d, 0, 0, ref).getTime();
  const okamziky = [];
  for (let t = pulnoc - 3 * 3600e3; t < pulnoc + 27 * 3600e3 && okamziky.length < 26; t += 3600e3) if (J.mistniCas(ref, new Date(t)).den === casDen) okamziky.push(new Date(t));
  const den0 = Date.parse(casDen);
  const bunky = hodiny.map(h => okamziky.map(t => {
    const mc = J.mistniCas(h.split('|')[1], t);
    const tr = mc.h >= 8 && mc.h < 18 ? 'prace' : mc.h >= 7 && mc.h < 22 ? 'okraj' : 'noc';
    return { mc, tr, posunDne: Math.round((Date.parse(mc.den) - den0) / 864e5) };
  }));
  const spolecne = okamziky.map((_, i) => bunky.every(r => r[i].tr === 'prace'));
  const dnyTxt = n => n > 0 ? `<sup>+${n}</sup>` : n < 0 ? `<sup>−${-n}</sup>` : '';
  const radky = hodiny.map((h, r) => `<tr><th class="misto" title="${esc(popisHodin(h))}">${vlajka(h.split('|')[0])} ${esc(popisHodin(h))}</th>${bunky[r].map((b, i) =>
    `<td class="${b.tr}${casHod === i ? ' vyb' : ''}" data-hod="${i}"${r ? '' : ' tabindex="0"'}>${b.mc.h}${b.mc.min ? '<sup>:' + String(b.mc.min).padStart(2, '0') + '</sup>' : ''}${dnyTxt(b.posunDne)}</td>`).join('')}</tr>`).join('');
  const hlava = `<tr><th class="misto"></th>${okamziky.map((_, i) => `<th data-hod="${i}" class="${spolecne[i] ? 'spolecne' : ''}"${spolecne[i] ? ' title="Pracovní doba všude"' : ''}>${spolecne[i] ? '★' : ''}</th>`).join('')}</tr>`;
  const nSpol = spolecne.filter(Boolean).length;
  const now = new Date();
  const karty = hodiny.map((h, i) => {
    const p = h.split('|')[1], r = J.rozdilCasu(ref, p);
    return `<div class="panel${i ? '' : ' ref'}"><div class="nazev" title="${esc(popisHodin(h))}">${vlajka(h.split('|')[0])} ${esc(popisHodin(h))}</div>
      <div class="velky-cas" data-cas="${esc(p)}">${esc(casZeme(p, now))}</div><div class="tip" style="margin:0">${i ? (r ? J.formatRozdil(r) : 'stejný čas') : 'výchozí'}</div>
      <span class="x tisk-ne">${hodiny.length > 1 ? `<button class="ikonka" data-hodiny-x="${i}" title="Odebrat" aria-label="Odebrat">✕</button>` : ''}${i ? `<button class="ikonka" data-hodiny-ref="${i}" title="Nastavit jako výchozí" aria-label="Nastavit jako výchozí">⤒</button>` : ''}</span></div>`;
  }).join('');
  const volby = serazene().flatMap(z => z.pasma.map(p => `<option value="${z.kod}|${p}">${esc(nazev(z))}${z.pasma.length > 1 ? ' – ' + esc(mesto(p)) : ''}</option>`)).join('');
  const prevod = casHod !== null ? `<section class="panel" style="margin-top:10px"><h3>Vybraný čas</h3><ul class="prevod">${hodiny.map(h => {
      const p = h.split('|')[1];
      return `<li>${vlajka(h.split('|')[0])} ${esc(popisHodin(h))}: <b>${esc(new Intl.DateTimeFormat(loc(), { timeZone: p, weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }).format(okamziky[casHod]))}</b></li>`;
    }).join('')}</ul></section>` : '';
  return `<div class="radek-vyber tisk-ne">
      <select class="vstup" id="hodinyPridej" aria-label="Přidat místo"><option value="">➕ Přidat místo…</option>${volby}</select>
      <label>Den <input type="date" class="vstup" id="casDen" value="${casDen}"></label>
      <button class="btn" id="casDnes">Dnes</button>
      ${trasa.length ? '<button class="btn" id="hodinyTrasa">🧳 Místa z trasy</button>' : ''}</div>
    <div class="hodiny">${karty}</div>
    <h2>🗓️ Plánovač hovoru – ${esc(new Date(den0).toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }))} (${esc(popisHodin(hodiny[0]))})</h2>
    <div class="tab-obal"><table class="planovac"><thead>${hlava}</thead><tbody>${radky}</tbody></table></div>
    <div class="legenda-cas"><span><i style="background:color-mix(in srgb,var(--ok) 32%,transparent)"></i>pracovní doba 8–18</span><span><i style="background:color-mix(in srgb,var(--warn) 26%,transparent)"></i>ráno a večer</span><span><i style="background:var(--bg-control)"></i>noc</span><span>★ vyhovuje všem · <sup>+1</sup> následující den</span></div>
    ${okamziky.length !== 24 ? `<p class="tip">⏱️ V tento den se mění čas – den má ${okamziky.length} hodin.</p>` : ''}
    <p class="tip">${hodiny.length > 1 ? (nSpol ? `Společná pracovní doba: ${nSpol} h.` : 'Pracovní doba se nikde nepřekrývá – zkuste ráno nebo večer (žluté).') : 'Přidejte další místa.'} Klepnutím na sloupec převedete čas pro všechna místa. Letní čas se počítá podle zvoleného dne.</p>
    ${prevod}`;
}

/* ---------- měny, kurzy a tahák ---------- */
function vsechnyMeny() {
  return [...new Set(ZEME.flatMap(z => z.meny))].sort((a, b) => menaNazev(a).localeCompare(menaNazev(b), loc()));
}
function meny() {
  const d = domMena();
  const sada = [...new Set([...trasa.flatMap(k => PODLE[k].meny), ...PODLE[vybrana].meny, ...pridaneMeny])].filter(m => m !== d);
  const vse = vsechnyMeny();
  const moznosti = sel => vse.map(m => `<option value="${m}"${m === sel ? ' selected' : ''}>${m} – ${esc(menaNazev(m))}</option>`).join('');
  if (!kalk.z) kalk.z = sada[0] || 'EUR';
  if (!kalk.na) kalk.na = d;
  const radky = sada.map(m => {
    const zeme = ZEME.filter(z => z.meny.includes(m) && (vTrase(z.kod) || z.kod === vybrana));
    const auto = kurzy && kurzy.rates ? J.prevedMenu(1, m, d, Object.assign({ [kurzy.base]: 1 }, kurzy.rates)) : null;
