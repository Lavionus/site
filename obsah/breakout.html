<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧱 Breakout</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<script src="../rekord.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(circle at 50% 0%,#22283a 0%,#101018 55%,#0a0a0f 100%);color:var(--text);min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.6rem;margin-bottom:10px;font-weight:600;text-shadow:0 0 12px rgba(106,166,253,.5)}
.hud{display:flex;gap:24px;margin-bottom:12px;font-size:1rem;flex-wrap:wrap;justify-content:center}
.hud b{color:var(--accent)}
.powerbar{display:flex;gap:8px;min-height:26px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
.pchip{background:#20263a;border:1px solid #3a4566;border-radius:20px;padding:3px 10px;font-size:.78rem;display:flex;align-items:center;gap:5px;color:#bcd0ff}
canvas{background:linear-gradient(#0d0d12,#050507);border-radius:10px;border:1px solid #3a3f55;touch-action:none;max-width:100%;box-shadow:0 0 30px rgba(80,110,220,.12),inset 0 0 40px rgba(0,0,0,.6)}
.btn{background:linear-gradient(#7db0ff,#5f93f2);color:#fff;border:none;padding:10px 22px;border-radius:6px;cursor:pointer;font-weight:600;margin-top:14px;box-shadow:0 3px 10px rgba(95,147,242,.4)}
.btn:hover{background:linear-gradient(#8fbaff,#6aa1f5)}
.hint{color:var(--text-faint);font-size:.84rem;margin-top:12px;text-align:center;max-width:480px;line-height:1.5}
.overlay-msg{margin-top:12px;font-size:1.3rem;font-weight:700;min-height:30px}

/* světlý režim: dorovnání kontrastu textu */
:root[data-theme="light"] .btn { color: var(--text); }
</style>
</head>
<body>
<h1>🧱 Breakout</h1>
<div class="hud"><div>Skóre: <b id="score">0</b></div><div>Životy: <b id="lives">3</b></div><div>Úroveň: <b id="level">1</b></div><div>Combo: <b id="combo">x1</b></div></div>
<div class="powerbar" id="powerbar"></div>
<div style="margin-bottom:8px"><span id="rekordBox"></span></div>
<canvas id="canvas" width="480" height="520"></canvas>
<button class="btn" id="startBtn">▶️ Start</button>
<div class="overlay-msg" id="msg"></div>
<p class="hint">Ovládání: pohyb myší / prstem nebo šipky ←→. Mezerník / klik vypustí přilepený míček. Rozbíjej cihly a chytej bonusy padající z nich!<br>
🟦 širší pálka · 🔴 multiball · 🐌 zpomalení · ❤️ život navíc · 🧲 lepivá pálka · 💀 užší pálka</p>
<script>
const $=id=>document.getElementById(id);
let rek=null;
window.addEventListener('DOMContentLoaded',()=>{
  if(typeof Rekord==='undefined')return;
  rek=Rekord.sleduj('webapp_hra_breakout',{vyssiLepsi:true,popisek:'Nejvyšší skóre',format:v=>v+' b'});
  rek.prvek($('rekordBox'));
});
const canvas=$('canvas'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let paddle,balls,bricks,particles,powerups,effects,score,lives,level,combo,running,keys={},shake=0,stars=[];
const COLORS=['#e74c3c','#e67e22','#f1c40f','#27ae60','#3498db','#9b59b6'];
const POWER_TYPES=[
  {k:'wide',icon:'🟦',color:'#3498db',label:'Široká pálka',dur:9000},
  {k:'multi',icon:'🔴',color:'#e74c3c',label:'Multiball',dur:0},
  {k:'slow',icon:'🐌',color:'#27ae60',label:'Zpomalení',dur:8000},
  {k:'life',icon:'❤️',color:'#ff4d6d',label:'Extra život',dur:0},
  {k:'sticky',icon:'🧲',color:'#9b59b6',label:'Lepivá pálka',dur:9000},
  {k:'shrink',icon:'💀',color:'#888',label:'Úzká pálka',dur:7000},
];
for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,tw:Math.random()*Math.PI*2});

function initLevel(){
  const rows=4+level,cols=8;const bw=W/cols,bh=22;
  bricks=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(Math.random()<0.85||r<3){
    const hasPower=Math.random()<0.18;
    bricks.push({x:c*bw,y:40+r*(bh+4),w:bw-4,h:bh,color:COLORS[r%COLORS.length],hits:1,power:hasPower?POWER_TYPES[Math.floor(Math.random()*POWER_TYPES.length)].k:null});
  }
  powerups=[];
  resetBall();
}
function resetBall(){
  paddle={x:W/2-45,y:H-30,w:90,h:12,baseW:90};
  balls=[{x:W/2,y:H-44,r:8,dx:0,dy:0,stuck:true,trail:[]}];
  launchStuck();
}
function launchStuck(){
  balls.forEach(b=>{if(b.stuck){b.dx=(Math.random()<.5?-1:1)*(2.6+level*0.3);b.dy=-(3+level*0.3);}});
}
function releaseStuck(){balls.forEach(b=>{if(b.stuck){b.stuck=false;b.dx=(Math.random()<.5?-1:1)*(2.6+level*0.3);b.dy=-(3+level*0.3);}});}
function start(){
  score=0;lives=3;level=1;combo=1;running=true;particles=[];effects={};
  $('msg').textContent='';initLevel();updateHud();loop();
}
function updateHud(){$('score').textContent=score;$('lives').textContent=lives;$('level').textContent=level;$('combo').textContent='x'+combo;renderPowerbar();}
function renderPowerbar(){
  const bar=$('powerbar');bar.innerHTML='';
  const now=performance.now();
  Object.keys(effects).forEach(k=>{
    if(effects[k]>now){
      const def=POWER_TYPES.find(p=>p.k===k);
      const left=Math.ceil((effects[k]-now)/1000);
      const chip=document.createElement('div');chip.className='pchip';
      chip.innerHTML=def.icon+' '+def.label+' '+left+'s';
      bar.appendChild(chip);
    }
  });
}
function spawnPowerup(x,y,type){powerups.push({x,y,vy:2.2,type});}
function applyPower(type){
  const now=performance.now();
  if(type==='wide'){paddle.w=paddle.baseW*1.6;effects.wide=now+POWER_TYPES.find(p=>p.k==='wide').dur;}
  else if(type==='shrink'){paddle.w=paddle.baseW*0.6;effects.shrink=now+POWER_TYPES.find(p=>p.k==='shrink').dur;}
  else if(type==='slow'){effects.slow=now+POWER_TYPES.find(p=>p.k==='slow').dur;}
  else if(type==='sticky'){effects.sticky=now+POWER_TYPES.find(p=>p.k==='sticky').dur;}
  else if(type==='life'){lives++;}
  else if(type==='multi'){
    const src=balls[0]||{x:paddle.x+paddle.w/2,y:paddle.y-10,dx:2,dy:-3,r:8,trail:[]};
    for(let i=0;i<2;i++){
      const ang=(Math.random()-0.5)*0.9;
      balls.push({x:src.x,y:src.y,r:8,dx:src.dx*Math.cos(ang)-src.dy*Math.sin(ang),dy:src.dx*Math.sin(ang)+src.dy*Math.cos(ang),stuck:false,trail:[]});
    }
  }
  updateHud();
}
function spawnParticles(x,y,color){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color});
  }
}
function loop(){
  if(!running)return;
  const now=performance.now();
  // expire effects
  if(effects.wide&&effects.wide<now){paddle.w=paddle.baseW;delete effects.wide;}
  if(effects.shrink&&effects.shrink<now){paddle.w=paddle.baseW;delete effects.shrink;}
  const speedMul=(effects.slow&&effects.slow>now)?0.55:1;
  // paddle move by keys
  if(keys.left)paddle.x-=6.5;if(keys.right)paddle.x+=6.5;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

  for(let bi=balls.length-1;bi>=0;bi--){
    const ball=balls[bi];
    if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;}
    else{
      ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>8)ball.trail.shift();
      ball.x+=ball.dx*speedMul;ball.y+=ball.dy*speedMul;
      if(ball.x<ball.r||ball.x>W-ball.r)ball.dx*=-1;
      if(ball.y<ball.r)ball.dy*=-1;
      if(ball.y+ball.r>paddle.y&&ball.y+ball.r<paddle.y+paddle.h+8&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.dy>0){
        if(effects.sticky&&effects.sticky>now){ball.stuck=true;ball.dx=0;ball.dy=0;}
        else{
          ball.dy=-Math.abs(ball.dy);const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.dx=hit*4.5;
        }
      }
      if(ball.y>H){balls.splice(bi,1);}
    }
  }
  if(!balls.length){
    lives--;combo=1;updateHud();
    if(lives<=0){running=false;
      let zprava='💀 Konec hry! Skóre: '+score;
      if(rek&&rek.zapis(score))zprava='🏆 Nový rekord: '+score+' bodů!';
      $('msg').textContent=zprava;draw();return;}
    resetBall();
  }

  // powerups falling
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.y+=p.vy;
    if(p.y+14>paddle.y&&p.y<paddle.y+paddle.h&&p.x>paddle.x-10&&p.x<paddle.x+paddle.w+10){
      applyPower(p.type);powerups.splice(i,1);continue;
    }
    if(p.y>H)powerups.splice(i,1);
  }

  // bricks
  let brickHit=false;
  for(let bi=balls.length-1;bi>=0;bi--){
    const ball=balls[bi];if(ball.stuck)continue;
    for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];
      if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){
        ball.dy*=-1;
        spawnParticles(b.x+b.w/2,b.y+b.h/2,b.color);
        if(b.power)spawnPowerup(b.x+b.w/2,b.y+b.h/2,b.power);
        bricks.splice(i,1);
        combo++;score+=10*Math.min(combo,10);
        brickHit=true;
        shake=4;
        updateHud();
        break;
      }
    }
  }
  if(!brickHit){/* combo persists while streak continues within same frame group */}
  if(!bricks.length){level++;combo=1;updateHud();$('msg').textContent='🎉 Úroveň '+(level-1)+' splněna!';initLevel();}

  // particles
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.03;if(p.life<=0)particles.splice(i,1);}
  if(shake>0)shake*=0.8;
  renderPowerbar();
  draw();
  requestAnimationFrame(loop);
}
function draw(){
  ctx.save();
  if(shake>0.3)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.clearRect(-10,-10,W+20,H+20);
  // starfield
  const t=performance.now()/600;
  stars.forEach(s=>{const a=0.3+0.5*Math.abs(Math.sin(t+s.tw));ctx.fillStyle='rgba(150,180,255,'+a.toFixed(2)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});

  // bricks with 3D shading
  bricks.forEach(b=>{
    const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
    grad.addColorStop(0,shade(b.color,25));grad.addColorStop(1,shade(b.color,-15));
    ctx.fillStyle=grad;
    roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(b.x+2,b.y+2,b.w-4,2);
    if(b.power){ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText('✦',b.x+b.w/2,b.y+b.h/2);}
  });

  // powerups
  powerups.forEach(p=>{
    const def=POWER_TYPES.find(d=>d.k===p.type);
    ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=def.color;ctx.shadowBlur=10;
    ctx.fillText(def.icon,p.x,p.y);
    ctx.shadowBlur=0;
  });

  // particles
  particles.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1;});

  // paddle
  const pgrad=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);
  pgrad.addColorStop(0,'#8fbaff');pgrad.addColorStop(1,'#5f93f2');
  ctx.fillStyle=pgrad;ctx.shadowColor='#6aa6fd';ctx.shadowBlur=12;
  roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();
  ctx.shadowBlur=0;

  // balls with trail + glow
  balls.forEach(ball=>{
    ball.trail.forEach((t,i)=>{
      ctx.globalAlpha=(i/ball.trail.length)*0.35;
      ctx.fillStyle='#9fd3ff';
      ctx.beginPath();ctx.arc(t.x,t.y,ball.r*0.7,0,7);ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.shadowColor='#fff';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fillStyle='#fff';ctx.fill();
    ctx.shadowBlur=0;
  });
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+pct,g=(n>>8&255)+pct,b=(n&255)+pct;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1);
}
canvas.onmousemove=e=>{const rect=canvas.getBoundingClientRect();paddle&&(paddle.x=(e.clientX-rect.left)*(W/rect.width)-paddle.w/2,paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x)));};
canvas.ontouchmove=e=>{e.preventDefault();const rect=canvas.getBoundingClientRect();paddle&&(paddle.x=(e.touches[0].clientX-rect.left)*(W/rect.width)-paddle.w/2,paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x)));};
canvas.onclick=()=>releaseStuck();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1;
  if(e.key===' '){e.preventDefault();releaseStuck();}
});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0;});
$('startBtn').onclick=start;
// initial draw
paddle={x:W/2-45,y:H-30,w:90,h:12,baseW:90};balls=[{x:W/2,y:H-44,r:8,dx:0,dy:0,stuck:true,trail:[]}];bricks=[];particles=[];powerups=[];effects={};draw();
</script>
</body>
</html>
