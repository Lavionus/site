<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗜️ Kleště, pinzety a svorky</title>
  <script src="lib/three.r128.min.js"></script>
  <link rel="stylesheet" href="../common.css">
  <script src="../theme.js"></script>
  <script src="../dialog.js"></script>
  <script src="../tvary.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="kleste/jadro.js"></script>
  <script src="kleste/celisti.js"></script>
  <script src="kleste/druhy.js"></script>
  <style>
    /* Nahoře hlavní nabídka (Soubor, Úpravy, Nástroj, Čelisti, Rozměry, Průřez,
       Tisk, Zobrazit) s rozbalovacími panely – panel jde 📌 připnout vlevo vedle
       náhledu. Pod ní 3D náhled a nákres, posuvník rozevření, varování, údaje
       o modelu a tipy pro tisk.
       Geometrii počítají moduly v kleste/ (běží i v node pro testy). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1600px; margin: 0 auto; padding: 14px 18px 24px; }
    .header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
    .header h1 { font-size: 1.3rem; font-weight: 650; }
    .header p { font-size: .84rem; color: var(--text-muted); }

    /* ---------- hlavní nabídka (desktopová lišta s rozbalovacími panely) ---------- */
    .menu { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 8px; margin: 0 -18px 12px; padding: 4px 18px;
      background: var(--bg-elevated); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .menu-polozky { display: flex; align-items: stretch; gap: 2px; min-width: 0; flex-wrap: wrap; }
    .menu-polozka { position: relative; }
    .menu-tl { font: inherit; font-size: .88rem; padding: 6px 11px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--text);
      cursor: pointer; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
    .menu-tl:hover, .menu-tl[aria-expanded="true"] { background: var(--bg-hover); border-color: var(--border); }
    .menu-tl[aria-expanded="true"] { color: var(--accent); }
    .menu-tl:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .menu-tl.pripnuty::after { content: '📌'; font-size: .7rem; opacity: .7; }
    .vybrano { font-weight: 400; font-size: .76rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
    .menu-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 41; width: 430px; max-width: calc(100vw - 24px);
      max-height: var(--menu-vyska, calc(100vh - 120px)); overflow-y: auto; overscroll-behavior: contain;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 9px; padding: 0 14px 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.35); }
    .menu-panel.uzky { width: 300px; }
    #mSoubor { width: 380px; }
    #mSoubor .tvary { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
    .menu-panel.siroky { width: 760px; }
    .menu-hlava { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 10px 0 8px; margin-bottom: 4px;
      background: var(--bg-elevated); border-bottom: 1px solid var(--border); font-size: .92rem; }
    .menu-hlava .pripnout { margin-left: auto; width: 28px; height: 26px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-control);
      cursor: pointer; font-size: .85rem; filter: grayscale(1); opacity: .75; }
    .menu-hlava .pripnout[aria-pressed="true"] { filter: none; opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
    .menu-akce { display: flex; flex-direction: column; gap: 1px; padding-top: 2px; }
    .menu-akce hr { border: none; border-top: 1px solid var(--border); margin: 5px 0; }
    .polozka { font: inherit; font-size: .86rem; text-align: left; padding: 7px 9px; border: none; border-radius: 6px; background: none; color: var(--text);
      cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .polozka:hover:not(:disabled), .polozka:focus-visible { background: var(--bg-hover); outline: none; }
    .polozka:disabled { opacity: .4; cursor: default; }
    .polozka kbd { margin-left: auto; font: inherit; font-size: .74rem; color: var(--text-muted); }
    .polozka[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
    .polozka[aria-pressed="true"]::before { content: '✓'; }
    .skupina-menu { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); padding: 4px 9px 2px; }
    .dva-sloupce { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    .podnadpis { font-size: .84rem; margin: 2px 0 4px; }
    .menu-vpravo { margin-left: auto; display: flex; gap: 4px; align-items: center; }
    .menu-vpravo .ikona { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-control); color: var(--text); cursor: pointer; font-size: 1rem; }
    .menu-vpravo .ikona:hover:not(:disabled) { background: var(--bg-hover); }
    .menu-vpravo .ikona:disabled { opacity: .35; cursor: default; }
    .hledani { position: relative; }
    .hledani input { width: 220px; padding: 5px 8px; font: inherit; font-size: .84rem; background: var(--bg-input, var(--bg-control)); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; }
    .hledani-vysledky { position: absolute; right: 0; top: calc(100% + 6px); z-index: 42; width: 340px; max-height: 60vh; overflow-y: auto;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 9px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
    .hledani-vysledky button { display: block; width: 100%; text-align: left; font: inherit; font-size: .84rem; padding: 6px 8px; border: none; border-radius: 6px;
      background: none; color: var(--text); cursor: pointer; }
    .hledani-vysledky button:hover, .hledani-vysledky button:focus-visible, .hledani-vysledky button.aktivni { background: var(--bg-hover); outline: none; }
    .hledani-vysledky small { color: var(--text-muted); display: block; font-size: .72rem; }
    .hledani-vysledky .nic { font-size: .82rem; color: var(--text-muted); padding: 6px 8px; }
    .par.zvyraznit { animation: zvyraznit 1.6s ease-out; border-radius: 6px; }
    @keyframes zvyraznit { 0%, 40% { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); } 100% { background: transparent; box-shadow: none; } }

    /* ---------- pracovní plocha + připnuté panely ---------- */
    .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
    .main.s-dokem { grid-template-columns: 420px minmax(0, 1fr); }
    .dok { display: none; flex-direction: column; gap: 10px; position: sticky; top: 52px; max-height: calc(100vh - 62px); overflow-y: auto; }
    .main.s-dokem .dok { display: flex; }
    .dok .menu-panel { position: static; width: auto; max-width: none; max-height: none; box-shadow: none; overflow: visible; }
    .dok .menu-panel .dva-sloupce { grid-template-columns: 1fr; }
    /* rozměry v rozbalené nabídce ve dvou sloupcích (méně posouvání); připnuté v jednom */
    .menu-polozka > #mRozmery { width: 860px; }
    .menu-polozka > #mRozmery #parNastroj { columns: 2; column-gap: 20px; }
    #parNastroj > .par, #parNastroj > fieldset, #parNastroj > p { break-inside: avoid; }
    #parNastroj > fieldset:first-of-type { margin-top: 0; }
    .menu-polozka > #mDruh { width: 900px; }
    .menu-polozka > #mDruh .galerie { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .hledat-druh { width: 100%; margin-bottom: 8px; padding: 5px 8px; font: inherit; font-size: .82rem; background: var(--bg-input, var(--bg-control)); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
    .skryt-hledanim { display: none !important; }
    mark.shoda { background: var(--accent-soft); color: inherit; border-radius: 3px; }
    .filtry { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .filtry button { font: inherit; font-size: .78rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--bg-control); color: var(--text); cursor: pointer; }
    .filtry button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent, #fff); border-color: var(--accent); }
    .galerie { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .galerie.mala { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .karta-vyber { display: flex; flex-direction: column; align-items: stretch; gap: 3px; text-align: left; padding: 5px 6px 6px;
      background: var(--bg-control); border: 1px solid var(--border); border-radius: 7px; color: var(--text); cursor: pointer; font: inherit; min-width: 0; }
    .karta-vyber:hover:not(:disabled) { background: var(--bg-hover); }
    .karta-vyber[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
    .karta-vyber:disabled { opacity: .38; cursor: not-allowed; }
    .karta-vyber canvas { width: 100%; height: 54px; display: block; border-radius: 4px; background: var(--bg-deep, rgba(0,0,0,.08)); }
    .galerie.mala .karta-vyber canvas { height: 46px; }
    .karta-vyber b { font-size: .78rem; font-weight: 600; line-height: 1.2; }
    .karta-vyber small { font-size: .7rem; color: var(--text-muted); line-height: 1.2; }
    .galerie.mala .karta-vyber b { font-size: .72rem; }
    .skupina-celisti { grid-column: 1 / -1; font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin: 6px 0 0; }
    .popis { font-size: .8rem; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }

    .par { display: grid; grid-template-columns: minmax(0, 1fr) 176px; gap: 4px 8px; align-items: center; padding: 4px 0; }
    .par label { font-size: .82rem; line-height: 1.25; }
    .par .jedn { color: var(--text-faint); font-size: .74rem; }
    .par .ovl { display: flex; gap: 6px; align-items: center; }
    .par input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
    .par input[type=number] { width: 62px; padding: 3px 5px; font: inherit; font-size: .82rem; background: var(--bg-input, var(--bg-control)); color: var(--text);
      border: 1px solid var(--border); border-radius: 5px; text-align: right; }
    .par select { width: 100%; padding: 4px 6px; font: inherit; font-size: .82rem; background: var(--bg-input, var(--bg-control)); color: var(--text); border: 1px solid var(--border); border-radius: 5px; }
    .par.prep { grid-template-columns: 1fr auto; }
    .par .reset { flex: 0 0 22px; width: 22px; height: 22px; padding: 0; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-control);
      color: var(--accent); cursor: pointer; font-size: .85rem; line-height: 1; }
    .par .reset:hover { background: var(--bg-hover); }
    .par .reset[hidden] { display: inline-block; visibility: hidden; }
    .par select { min-width: 0; }
    .par.prep label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .par .nap { grid-column: 1 / -1; font-size: .72rem; color: var(--text-muted); line-height: 1.3; margin-top: -2px; }
    fieldset.skup { border: 1px solid var(--border); border-radius: 7px; padding: 4px 9px 6px; margin-top: 8px; }
    fieldset.skup legend { font-size: .76rem; color: var(--text-muted); padding: 0 4px; }

    .tlacitka { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .btn { font: inherit; font-size: .84rem; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent);
      color: var(--on-accent, #fff); cursor: pointer; }
    .btn:hover { filter: brightness(1.08); }
    .btn-sec { background: var(--bg-control); color: var(--text); border-color: var(--border); }
    .btn:disabled { opacity: .5; cursor: progress; }

    hr.del { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
    .editor-obal { background: var(--bg-deep, rgba(0,0,0,.08)); border: 1px solid var(--border); border-radius: 7px; margin-top: 6px; }
    #prurezSvg { width: 100%; height: auto; display: block; touch-action: none; user-select: none; outline: none; }
    #prurezSvg:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 7px; }
    #prurezSvg .ramec { fill: none; stroke: var(--border-strong, #666); stroke-dasharray: 3 3; }
    #prurezSvg .osa { stroke: var(--text-faint); stroke-dasharray: 2 4; }
    #prurezSvg .podlozka { stroke: var(--text-muted); stroke-width: 2; }
    #prurezSvg .popisek { fill: var(--text-muted); font-size: 10px; font-family: inherit; }
    #prurezSvg .tvar { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; cursor: copy; }
    #prurezSvg .tvar.chyba { fill: rgba(229,72,77,.18); stroke: var(--danger); }
    #prurezSvg .stin { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
    #prurezSvg .kotva { fill: var(--bg-elevated); stroke: var(--accent); stroke-width: 2; cursor: move; }
    #prurezSvg .kotva.vybrana { fill: var(--accent); }
    #prurezSvg .kotva.zrcadlo { opacity: .35; pointer-events: none; }
    #prurezSvg .uchyt { fill: var(--warn); stroke: none; cursor: crosshair; }
    #prurezSvg .uchyt-cara, #svgProhnuti .uchyt-cara { stroke: var(--warn); stroke-width: 1; }
    #svgProhnuti { width: 100%; height: auto; display: block; touch-action: none; user-select: none; outline: none; background: var(--bg-deep, rgba(0,0,0,.08)); border-radius: 6px; }
    #svgProhnuti:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
    #svgProhnuti .mriz { stroke: var(--border); stroke-width: 1; }
    #svgProhnuti .osa0 { stroke: var(--text-faint); stroke-dasharray: 4 3; }
    #svgProhnuti .popisek { fill: var(--text-muted); font-size: 9px; font-family: inherit; }
    #svgProhnuti .plocha { fill: var(--accent-soft); stroke: none; }
    #svgProhnuti .tvar { fill: none; stroke: var(--accent); stroke-width: 2.2; }
    #svgProhnuti .kotva { fill: var(--bg-elevated); stroke: var(--accent); stroke-width: 2; cursor: move; }
    #svgProhnuti .kotva.vybrana { fill: var(--accent); }
    #svgProhnuti .uchyt { fill: var(--warn); cursor: crosshair; }
    #uzelProhnuti .aktivni { border-color: var(--accent); color: var(--accent); }
    #uzelProhnuti .uzel-pole { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; width: 100%; }
    #uzelProhnuti input { width: 58px; padding: 2px 4px; font: inherit; font-size: .8rem; background: var(--bg-input, var(--bg-control)); color: var(--text); border: 1px solid var(--border); border-radius: 5px; }
    .editor-lista { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: .8rem; }
    .editor-lista label { display: flex; gap: 5px; align-items: center; cursor: pointer; margin-right: 4px; }
    .btn.mala { padding: 3px 8px; font-size: .76rem; }

    /* ---------- pracovní plocha ---------- */
    .prace { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .nahled-obal { position: relative; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius, 8px); overflow: hidden; }
    #scena { width: 100%; height: min(62vh, 640px); min-height: 340px; outline: none; touch-action: none; cursor: grab; }
    .bez-webgl { margin: 0; padding: 40px 20px; text-align: center; color: var(--text-muted, #999); }
    #scena:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
    #scena canvas { display: block; }
    .lista-nahled { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
    .lista-nahled button { font: inherit; font-size: .76rem; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border);
      background: var(--bg-elevated); color: var(--text); cursor: pointer; opacity: .92; }
    .lista-nahled button:hover { background: var(--bg-hover); }
    .lista-nahled button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent, #fff); border-color: var(--accent); }
    .lista-nahled .oddel { width: 1px; background: var(--border); margin: 2px 4px; }
    .legenda { position: absolute; bottom: 8px; left: 8px; max-width: 58%; display: flex; gap: 10px; flex-wrap: wrap; font-size: .74rem; color: var(--text-muted);
      background: var(--bg-elevated); padding: 3px 8px; border-radius: 5px; opacity: .92; }
    .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    .rozmer { position: absolute; bottom: 8px; right: 10px; font-size: .76rem; color: var(--text-muted); background: var(--bg-elevated); padding: 3px 8px; border-radius: 5px; opacity: .92; }

    .nahledy { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    @media (min-width: 1280px) { .nahledy { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); } }
    .nakres-obal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius, 8px); overflow: hidden; display: flex; flex-direction: column; }
    .nakres-lista { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: .85rem; }
    .nakres-lista .btn { margin-left: auto; }
    .nakres { position: relative; flex: 1; min-height: 340px; height: min(62vh, 640px); }
    @media (max-width: 1279px) { .nakres { height: 440px; } }
    .nakres canvas, .nakres svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .nakres svg { pointer-events: none; }
    .nakres svg .kota { stroke: var(--accent); stroke-width: 1; fill: none; }
    .nakres svg .kota-sip { fill: var(--accent); }
    .nakres svg .kota-txt { fill: var(--accent); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--bg-elevated); stroke-width: 3px; }
    .nakres svg .titul { fill: var(--text-muted); font-size: 11px; font-family: inherit; }
    .nakres svg .tab { fill: var(--text); font-size: 10.5px; font-family: inherit; }
    .nakres svg .tab-k { fill: var(--text-muted); font-size: 10.5px; font-family: inherit; }
    .pohyb { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius, 8px); padding: 8px 12px; }
    .pohyb label { font-size: .85rem; font-weight: 600; }
    .pohyb input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
    .pohyb output { font-variant-numeric: tabular-nums; font-size: .85rem; min-width: 56px; text-align: right; }
    .pohyb .znacka { font-size: .74rem; color: var(--text-muted); }

    .opt-vysledek { border: 1px solid var(--accent); border-left-width: 4px; border-radius: 6px; padding: 10px 14px; background: var(--bg-elevated); font-size: .84rem; }
    .opt-vysledek h3 { font-size: .92rem; margin-bottom: 6px; }
    .opt-vysledek li { margin: 0 0 6px 18px; line-height: 1.4; }
    .opt-vysledek .zmena { font-weight: 600; font-variant-numeric: tabular-nums; }
    .opt-vysledek .proc { color: var(--text-muted); }
    .varovani:empty { display: none; }
    .varovani { border: 1px solid var(--warn); border-left-width: 4px; border-radius: 6px; padding: 8px 12px; background: var(--bg-elevated); font-size: .84rem; }
    .varovani li { margin-left: 16px; line-height: 1.4; }

    .karty { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; }
    .karta { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius, 8px); padding: 10px 14px; }
    .karta h3 { font-size: .9rem; margin-bottom: 6px; }
    .karta dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: .82rem; }
    .karta dt { color: var(--text-muted); }
    .karta dd { font-variant-numeric: tabular-nums; }
    .karta ul { font-size: .82rem; line-height: 1.45; padding-left: 16px; }
    .karta li + li { margin-top: 3px; }
    .ok { color: var(--ok); } .chyba { color: var(--danger); }

    @media (max-width: 980px) {
      .main, .main.s-dokem { grid-template-columns: 1fr; }
      .dok { position: static; max-height: none; order: 2; }
      .prace { order: 1; }
      .hledani input { width: 150px; }
      .menu-panel.siroky { width: 640px; }
      .menu-polozka > #mRozmery { width: 640px; }
      .menu-polozka > #mRozmery #parNastroj { columns: 1; }
      .menu-polozka > #mDruh { width: 640px; }
      .menu-polozka > #mDruh .galerie { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      /* svislý tah jedním prstem posouvá stránkou (náhled zabírá půl obrazovky), vodorovný otáčí, dva prsty zoom */
      #scena { height: 46vh; min-height: 260px; touch-action: pan-y; }
      .karty { grid-template-columns: 1fr; }
    }
    /* úzký displej: lišta se posouvá vodorovně, panely přes celou šířku pod ní */

<script>
(function () {
  'use strict';
  const KLIC = 'webapp_kleste_stav';
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const cislo = (x, d) => Number(x).toLocaleString('cs-CZ', { maximumFractionDigits: d == null ? 1 : d, minimumFractionDigits: 0 });
  const BARVY = { telo: '#4f8fe8', A: '#4f8fe8', B: '#ee9b35', tpu: '#36b37e', kruh: '#a97ff0', cep: '#9aa7b6' };
  const SKUPINY = { oko: 'Pružné oko', spoj: 'Spojení ramen', pruzina: 'Vnitřní pružina', uchop: 'Úchop', prohnuti: 'Rozestup ramen (tvar)', zamek: 'Zámek', rohatka: 'Rohatka', kloub: 'Kloub' };

  let stav = null, theta = 0, filtr = 'vse';
  let modelTisk = null;          // model v tiskové poloze (export, údaje)

  /* ================= stav ================= */
  function platny(s) {
    return s && KD.GENERATORY[s.gen] && KC.CELISTI[s.cel] && typeof s.p === 'object' && typeof s.celP === 'object';
  }
  // doplní chybějící parametry (starší uložený stav, cizí odkaz) výchozími
  // (cizí odkaz může obsahovat cokoli: neplatná čísla → výchozí, staré názvy spojů)
  function doplnStav(s) {
    const z = KD.zPredvolby(s.predvolba);
    const p = Object.assign(KD.vychoziParametry(s.gen), s.gen === z.gen ? z.p : {}, s.p);
    const vych = KD.vychoziParametry(s.gen);
    const opravCisla = (o, spec, vy) => {
      for (const q of spec) {
        if (q.typ === 'volba') { if (!q.volby.some(v => v[0] === o[q.id])) o[q.id] = vy[q.id] !== undefined ? vy[q.id] : q.volby[0][0]; }
        else if (q.typ === 'prepinac') { if (o[q.id] !== undefined) o[q.id] = !!o[q.id]; }
        else if (q.min != null && o[q.id] !== undefined) o[q.id] = Number.isFinite(o[q.id]) ? Math.min(q.max, Math.max(q.min, o[q.id])) : vy[q.id];
      }
    };
    if (p.spoj === 'oblouk') p.spoj = 'oko'; else if (p.spoj === 'dvojity') p.spoj = 'dvojite';
    opravCisla(p, KD.GENERATORY[s.gen].parametry, vych);
    const vc = KC.vychozi(s.cel, KD.kontextCelisti(s.gen, p, null));
    const celP = Object.assign({}, vc, s.celP);
    opravCisla(celP, KC.CELISTI[s.cel].parametry, vc);
    // křivky s neúplnými kotvami zahodit (editor by spadl)
    const kotvyOk = k => k && Array.isArray(k.kotvy) && k.kotvy.length >= 2 && k.kotvy.every(q => q && [q.p, q.a, q.b].every(v => Array.isArray(v) && v.length === 2 && v.every(Number.isFinite)));
    if (p.rozestup && !kotvyOk(p.rozestup)) delete p.rozestup;
    if (p.prohnutiKrivka && !kotvyOk(p.prohnutiKrivka)) delete p.prohnutiKrivka;
    if (p.prurez && !(p.prurez.kotvy && kotvyOk(p.prurez))) delete p.prurez;
    return { predvolba: s.predvolba, gen: s.gen, p, cel: s.cel, celP };
  }
  function nactiStav() {
    const m = location.hash.match(/^#n=(.+)$/);
    if (m) {
      // odkaz se načte jednou – pak se z adresy smaže, jinak by obnovení stránky
      // (F5) zahodilo všechny pozdější úpravy uložené v prohlížeči
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* */ }
      try { const s = JSON.parse(decodeURIComponent(m[1])); if (platny(s)) return doplnStav(s); } catch (e) { /* neplatný odkaz */ }
    }
    try { const s = JSON.parse(localStorage.getItem(KLIC)); if (platny(s)) return doplnStav(s); } catch (e) { /* bez úložiště */ }
    return KD.zPredvolby('pinzeta-anatomicka');
  }
  function ulozStav() { try { localStorage.setItem(KLIC, JSON.stringify(stav)); } catch (e) { /* soukromé okno */ } }

  /* ================= náhledy v galeriích (2D plátno, bez WebGL) ================= */
  const fronta = [];
  let frontaBezi = false;
  function doFronty(fn) {
    fronta.push(fn);
    if (frontaBezi) return;
    frontaBezi = true;
    const krok = (dl) => {
      // aspoň jedna úloha pokaždé (při zátěži vrací timeRemaining() 0 a náhledy
      // by se nevykreslily); chyba jednoho náhledu nesmí zastavit frontu
      const konec = performance.now() + 12;
      do {
        const f = fronta.shift();
        try { f(); } catch (e) { console.warn(e); }
      } while (fronta.length && (dl && !dl.didTimeout ? dl.timeRemaining() > 2 : performance.now() < konec));
      if (fronta.length) planuj(); else frontaBezi = false;
    };
    const planuj = () => window.requestIdleCallback ? requestIdleCallback(krok, { timeout: 300 }) : setTimeout(() => krok(null), 16);
    planuj();
  }

  function kresliTelesa(cv, telesa, smer, barva) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.clientWidth || 160, H = cv.clientHeight || 54;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    const nor = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
    const kriz = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const d = nor(smer), Wv = Math.abs(d[2]) > 0.9 ? [0, 1, 0] : [0, 0, 1];
    let r = nor(kriz(Wv, d)); if (Math.abs(d[2]) <= 0.9) r = r.map(x => -x);
    const u = kriz(d, r), sv = nor([d[0] + 0.3, d[1] + 0.2, d[2] + 0.6]);
    const tr = [];
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const t of telesa) {
      const V = t.V, I = t.I;
      for (let f = 0; f < I.length; f += 3) {
        const a = I[f] * 3, b = I[f + 1] * 3, cc = I[f + 2] * 3;
        const e1 = [V[b] - V[a], V[b + 1] - V[a + 1], V[b + 2] - V[a + 2]], e2 = [V[cc] - V[a], V[cc + 1] - V[a + 1], V[cc + 2] - V[a + 2]];
        const n = kriz(e1, e2), ln = Math.hypot(n[0], n[1], n[2]);
        if (ln < 1e-12) continue;
        const vis = (n[0] * d[0] + n[1] * d[1] + n[2] * d[2]) / ln;
        const P = [a, b, cc].map(q => [V[q] * r[0] + V[q + 1] * r[1] + V[q + 2] * r[2], V[q] * u[0] + V[q + 1] * u[1] + V[q + 2] * u[2], V[q] * d[0] + V[q + 1] * d[1] + V[q + 2] * d[2]]);
        for (const q of P) { if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
        if (vis <= 0) continue;
        const sv2 = Math.max(0, (n[0] * sv[0] + n[1] * sv[1] + n[2] * sv[2]) / ln);
        tr.push({ P, z: (P[0][2] + P[1][2] + P[2][2]) / 3, s: 0.42 + 0.58 * sv2 });
      }
    }
    if (!tr.length) return;
    tr.sort((a, b) => a.z - b.z);
    const k = Math.min((W - 8) / (x1 - x0 || 1), (H - 8) / (y1 - y0 || 1));
    const ox = (W - (x1 - x0) * k) / 2 - x0 * k, oy = (H + (y1 - y0) * k) / 2 + y0 * k;
    const [br, bg, bb] = barva;
    for (const t of tr) {
      c.fillStyle = `rgb(${Math.round(br * t.s)},${Math.round(bg * t.s)},${Math.round(bb * t.s)})`;
      c.beginPath();
      c.moveTo(ox + t.P[0][0] * k, oy - t.P[0][1] * k);
      c.lineTo(ox + t.P[1][0] * k, oy - t.P[1][1] * k);
      c.lineTo(ox + t.P[2][0] * k, oy - t.P[2][1] * k);
      c.closePath();
      c.fill();
      c.strokeStyle = c.fillStyle; c.lineWidth = 0.6; c.stroke();
    }
  }

  /* ================= galerie druhů ================= */

  /* ================= galerie čelistí ================= */
  const nahledyCelisti = new Map();
  function vykresliCelisti() {
    const povol = KD.povoleneCelisti(stav.gen);

    for (const [id, C] of Object.entries(KC.CELISTI)) (skup[C.skupina] = skup[C.skupina] || []).push(id);

  /* ================= parametry ================= */
  const stejne = (a, b) => (typeof a === 'number' && typeof b === 'number') ? Math.abs(a - b) < 1e-9 : a === b;
  const popisHodnoty = (q, v) => q.typ === 'volba' ? ((q.volby.find(x => x[0] === v) || [])[1] || v) : q.typ === 'prepinac' ? (v ? 'zapnuto' : 'vypnuto') : cislo(v, 3) + (q.jednotka ? ' ' + q.jednotka : '');
  // tlačítko návratu k výchozí hodnotě (skryté, když hodnota výchozí je)
  const tlVychozi = (q, hodnota, vych) => vych === undefined ? '' :
    `<button type="button" class="reset" data-reset="${q.id}" title="Zpět na výchozí: ${esc(popisHodnoty(q, vych))}" aria-label="${esc(q.nazev)}: zpět na výchozí hodnotu"${stejne(hodnota, vych) ? ' hidden' : ''}>↺</button>`;
  function radekParametru(q, hodnota, pref, vych) {
    const id = pref + q.id;
    const nap = q.napoveda ? `<div class="nap">${esc(q.napoveda)}</div>` : '';
    const rs = tlVychozi(q, hodnota, vych);

        + q.volby.map(([v, n]) => `<option value="${esc(v)}"${v === hodnota ? ' selected' : ''}>${esc(n)}</option>`).join('') + `</select>${rs}</div>${nap}</div>`;
    }
    if (q.typ === 'prepinac') {
      return `<div class="par prep"><label><input type="checkbox" id="${id}" data-par="${q.id}"${hodnota ? ' checked' : ''}> ${esc(q.nazev)}</label>${rs}${nap}</div>`;
    }
    const v = Number(hodnota);
    return `<div class="par"><label for="${id}">${esc(q.nazev)}${q.jednotka ? ` <span class="jedn">${esc(q.jednotka)}</span>` : ''}</label>
      <div class="ovl"><input type="range" min="${q.min}" max="${q.max}" step="${q.krok}" value="${v}" data-par="${q.id}" aria-label="${esc(q.nazev)}" tabindex="-1">
      <input type="number" id="${id}" min="${q.min}" max="${q.max}" step="${q.krok}" value="${+v.toFixed(3)}" data-par="${q.id}">${rs}</div>${nap}</div>`;
  }
  // výchozí hodnota = hodnota z předvolby, jinak výchozí hodnota parametru
  function vychoziNastroje(id) {
    const pv = KD.PREDVOLBY.find(x => x.id === stav.predvolba);
    return Object.assign(KD.vychoziParametry(stav.gen), pv && pv.gen === stav.gen ? pv.p : {})[id];
  }
  function vychoziCelisti(id) {
    const pv = KD.PREDVOLBY.find(x => x.id === stav.predvolba);
    // kontext bez aktuálních hodnot čelisti – jinak by „výchozí“ délka byla vždy ta současná
    const c = KD.kontextCelisti(stav.gen, stav.p, pv && pv.cel === stav.cel ? pv.celP : null);
    return Object.assign(KC.vychozi(stav.cel, c), pv && pv.cel === stav.cel ? pv.celP : {})[id];
  }

  function vykresliParametry() {
    const G = KD.GENERATORY[stav.gen];
    const vidi = q => !q.kdy || q.kdy(stav.p);
    // nástroj: hlavní parametry + skupiny; tiskové do sekce ⑤
    let h = '', hTisk = '', hPrurez = '', hCel = '';
    const skupiny = {};
    for (const q of G.parametry) {
      if (q.skryty) { if (q.skupina === 'prohnuti') skupiny[q.skupina] = skupiny[q.skupina] || []; continue; }
      if (!vidi(q)) continue;
      if (q.skupina === 'tisk') { hTisk += radekParametru(q, stav.p[q.id], 'n_', vychoziNastroje(q.id)); continue; }
      // rozměry průřezu ramen patří do ④, natočení a přechod čelistí do ⑤
      if (q.skupina === 'prurez') { hPrurez += radekParametru(q, stav.p[q.id], 'n_', vychoziNastroje(q.id)); continue; }
      if (q.skupina === 'celist') { hCel += radekParametru(q, stav.p[q.id], 'n_', vychoziNastroje(q.id)); continue; }
      if (q.skupina) { (skupiny[q.skupina] = skupiny[q.skupina] || []).push(q); continue; }
      h += radekParametru(q, stav.p[q.id], 'n_', vychoziNastroje(q.id));
    }
    for (const [sk, qs] of Object.entries(skupiny)) {
      // skupina se zapínacím přepínačem ukáže zbytek jen když je zapnutá
      const prep = qs.find(q => q.typ === 'prepinac');
      const zbytek = qs.filter(q => q !== prep);
      h += `<fieldset class="skup"><legend>${esc(SKUPINY[sk] || sk)}</legend>`
        + (sk === 'prohnuti' ? '<div id="edProhnuti"></div>' : '')
        + (prep ? radekParametru(prep, stav.p[prep.id], 'n_', vychoziNastroje(prep.id)) : '')
        + ((!prep || stav.p[prep.id]) ? zbytek.map(q => radekParametru(q, stav.p[q.id], 'n_', vychoziNastroje(q.id))).join('') : '')
        + '</fieldset>';
    }
    $('parNastroj').innerHTML = h;
    vykresliEditorProhnuti();
    $('parTisk').innerHTML = hTisk;
    $('parPrurez').innerHTML = hPrurez;
    $('parCelistNastroj').innerHTML = hCel ? hCel + '<hr class="del">' : '';
    // čelisti
    const pevne = G.pevneCelisti ? Object.keys(G.pevneCelisti).concat(['L']) : [];
    const C = KC.CELISTI[stav.cel];
    $('parCelisti').innerHTML = C.parametry.filter(q => !pevne.includes(q.id)).map(q => radekParametru(q, stav.celP[q.id], 'c_', vychoziCelisti(q.id))).join('')
      || '<p class="popis">Tvar čelistí určuje nástroj (klip má čelisti po celé délce).</p>';
  }

  function napojParametry(kontejner, cil, spec, vychozi) {
    kontejner.addEventListener('click', e => {
      const b = e.target.closest('[data-reset]');
      if (!b) return;
      const id = b.dataset.reset, v = vychozi(id);
      if (v === undefined) return;
      cil()[id] = v;
      const pole = b.closest('.par') && b.closest('.par').querySelector('[data-par][id]'), pid = pole && pole.id;
      vykresliParametry();
      // fokus zpět na pole parametru (tlačítko ↺ po resetu zmizí)
      const zpet = pid && document.getElementById(pid);
      if (zpet) zpet.focus();
      if (id === 't' || id === 'w') vykresliPrurez();
      zmena();
    });
    kontejner.addEventListener('input', e => {
      const el = e.target, id = el.dataset.par;
      if (!id) return;
      const q = spec().find(x => x.id === id);
      if (!q) return;
      let v;
      if (q.typ === 'volba') v = el.value;
      else if (q.typ === 'prepinac') v = el.checked;
      else {
        v = parseFloat(String(el.value).replace(',', '.'));
        if (!isFinite(v)) return;
        v = Math.min(q.max, Math.max(q.min, v));
        // druhé ovládací pole stejného parametru
        const par = el.closest('.par');
        if (par) par.querySelectorAll('input').forEach(x => { if (x !== el) x.value = el.type === 'range' ? +v.toFixed(3) : v; });
      }
      const viditelne = () => spec().filter(x => !x.kdy || x.kdy(cil())).map(x => x.id).join();
      const pred = viditelne();
      cil()[id] = v;
      const rb = el.closest('.par') && el.closest('.par').querySelector('[data-reset]');
      if (rb) rb.hidden = stejne(v, vychozi(id));
      if (id === 't' || id === 'w') vykresliPrurez();
      // překreslit, když se volbou nebo hodnotou změní, které parametry jsou vidět
      if (q.typ === 'volba' || q.typ === 'prepinac' || viditelne() !== pred) {
        vykresliParametry();
        // fokus zůstane na ovládacím prvku (výběr šipkami, mezerník u přepínače)
        const zpet = el.id && document.getElementById(el.id);
        if (zpet) zpet.focus();
      }
      zmena();
    });
    kontejner.addEventListener('change', e => {
      const el = e.target;
      if (el.type === 'number') {
        const q = spec().find(x => x.id === el.dataset.par);
        if (q) el.value = +cil()[q.id].toFixed(3);
      }
    });
  }

  /* ================= editor rozestupu ramen (Bézierova křivka) =================
     Vodorovně poloha po délce ramene (0 = u oka/spoje, 1 = u čelistí), svisle
     vnitřní mezera mezi rameny v tištěném tvaru. Bod 1 = mezera u oka, bod 2 =
     uprostřed, bod 3 = u čelistí (určuje rozevření při tisku). */
  const EP = { vyber: null, tah: null, ymax: 20 };
  // křivka tak, jak ji použije generátor (i s bodem 3 dopočteným z úhlu rozevření)
  const krivkaRozestupu = () => (KD.rozestup(stav) || {}).kr;
  const PX = f => 22 + f * 280, PY = h => 112 - h / EP.ymax * 96;
  function omezKrivku(kr) {
    // pořadí bodů se neřadí (vybraný/tažený bod by změnil index) – bod se
    // jen drží mezi sousedy; řadí se jen při vložení nového bodu
    const K = kr.kotvy;
    const n = K.length - 1;
    K[0].p[0] = 0; K[0].a = [0, 0];
    K[n].p[0] = 1; K[n].b = [0, 0];
    for (const q of K) q.p[1] = Math.max(0.2, q.p[1]);
    for (let i = 1; i < n; i++) K[i].p[0] = Math.min(K[i + 1].p[0] - 0.03, Math.max(K[i - 1].p[0] + 0.03, K[i].p[0]));
    // úchyty: správná strana a délka v rámci úseku – zkracují se ve SVÉM směru
    // (ořez jen vodorovné složky měnil sklon a protější úchyt poskakoval)
    for (let i = 0; i <= n; i++) {
      const q = K[i];
      if (i > 0) {
        const lim = K[i].p[0] - K[i - 1].p[0];
        if (q.a[0] > 0) q.a = [-q.a[0], -q.a[1]];
        if (-q.a[0] > lim) { const k = lim / -q.a[0]; q.a = [q.a[0] * k, q.a[1] * k]; }
      }
      if (i < n) {
        const lim = K[i + 1].p[0] - K[i].p[0];
        if (q.b[0] < 0) q.b = [-q.b[0], -q.b[1]];
        if (q.b[0] > lim) { const k = lim / q.b[0]; q.b = [q.b[0] * k, q.b[1] * k]; }
      }
    }
    return kr;
  }
  function upravRozestup(fn) {
    const kr = kopie(krivkaRozestupu()), y1 = kr.kotvy[kr.kotvy.length - 1].p[1];
    fn(kr);
    stav.p.rozestup = omezKrivku(kr);
    // posunutý bod u čelistí přebírá řízení rozevření od zadaného úhlu
    if (stav.p.rozevreni > 0 && Math.abs(kr.kotvy[kr.kotvy.length - 1].p[1] - y1) > 1e-6) {
      stav.p.rozevreni = 0;
      const par = $('n_rozevreni') && $('n_rozevreni').closest('.par');
      if (par) par.querySelectorAll('input').forEach(x => { x.value = 0; });
    }
    kresliRozestup();
    zmena();
  }
  function vykresliEditorProhnuti() {
    const el = $('edProhnuti');
    if (!el) return;
    if (!KD.GENERATORY[stav.gen].rozestup) { el.innerHTML = ''; return; }
    el.innerHTML = `<svg id="svgProhnuti" viewBox="0 0 326 150" tabindex="0" role="application"
        aria-label="Rozestup ramen po délce: táhněte body a úchyty, dvojklik přidá bod, Delete ho smaže, šipky posouvají vybraný bod."></svg>
      <div class="editor-lista" id="uzelProhnuti"></div>
      <div class="editor-lista">
        <span class="jedn">Tvar:</span>
        <button type="button" class="btn btn-sec mala" data-tvarp="vychozi" title="Rozestup odvozený z rozměrů nástroje">↺ výchozí</button>
        <button type="button" class="btn btn-sec mala" data-tvarp="klin" title="Ramena rovná, rozestup roste lineárně">klín</button>
        <button type="button" class="btn btn-sec mala" data-tvarp="vyboulene" title="Uprostřed víc od sebe – při stisku se dotknou nejdřív čelisti">vyboulená</button>
        <button type="button" class="btn btn-sec mala" data-tvarp="soubezna" title="Za okem se ramena rychle rozestoupí a dál jdou souběžně">souběžná</button>
      </div>
      <p class="popis" id="rozestupInfo"></p>`;
    const svg = $('svgProhnuti');
    const bod = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [(q.x - 22) / 280, (112 - q.y) / 96 * EP.ymax]; };
    svg.addEventListener('pointerdown', e => {
      const t = e.target;
      if (t.dataset.kotva != null) { EP.vyber = +t.dataset.kotva; EP.tah = { typ: 'kotva', i: EP.vyber }; }
      else if (t.dataset.uchyt) EP.tah = { typ: 'uchyt', i: EP.vyber, k: t.dataset.uchyt };
      else { EP.vyber = null; kresliRozestup(); return; }
      try { svg.setPointerCapture(e.pointerId); } catch (x) { /* syntetická událost */ }
      e.preventDefault(); svg.focus({ preventScroll: true }); kresliRozestup();
    });
    svg.addEventListener('pointermove', e => {
      if (!EP.tah) return;
      const [f, h] = bod(e), t = EP.tah;
      upravRozestup(kr => {
        const q = kr.kotvy[t.i];
        if (t.typ === 'kotva') q.p = [f, Math.round(h * 10) / 10];
        else {
          // tažený úchyt nesmí přejít na druhou stranu bodu (a vlevo, b vpravo)
          let v = [f - q.p[0], h - q.p[1]];
          if (t.k === 'a') v[0] = Math.min(v[0], -0.002); else v[0] = Math.max(v[0], 0.002);
          const o = t.k === 'a' ? 'b' : 'a', l = Math.hypot(v[0], v[1]) || 1;
          // protější úchyt: stejný směr (hladký bod), délka = jeho délka na začátku tahu
          // (ve stejných jednotkách jako v – svisle mm, vodorovně podíl délky)
          const lo = EP.tah.delkaO != null ? EP.tah.delkaO : (EP.tah.delkaO = Math.hypot(q[o][0], q[o][1]) || l);
          q[t.k] = v;
          q[o] = [-v[0] / l * lo, -v[1] / l * lo];
        }
      });
    });
    const konec = () => { if (EP.tah) { EP.tah = null; kresliRozestup(); } };
    svg.addEventListener('pointerup', konec);
    svg.addEventListener('pointercancel', konec);
    svg.addEventListener('dblclick', e => {
      const [f, hk] = bod(e);
      if (!(f > 0.03 && f < 0.97)) return;
      // jen dvojklik u křivky (do ~10 px), ne kdekoli v grafu
      const kr0 = krivkaRozestupu();
      if (!kr0 || Math.abs(KD.prohnutiKrivkou(kr0)(f) - hk) / EP.ymax * 96 > 10) return;
      upravRozestup(kr => {
        const h = KD.prohnutiKrivkou(kr)(f);
        kr.kotvy.push({ p: [f, h], a: [-0.06, 0], b: [0.06, 0] });
        kr.kotvy.sort((a, b) => a.p[0] - b.p[0]);
        EP.vyber = kr.kotvy.findIndex(q => q.p[0] === f);
        // úchyty ve směru křivky
        const q = kr.kotvy[EP.vyber], f2 = KD.prohnutiKrivkou(kr), m = (f2(f + 0.01) - f2(f - 0.01)) / 0.02;
        q.a = [-0.06, -0.06 * m]; q.b = [0.06, 0.06 * m];
      });
    });
    svg.addEventListener('keydown', e => {
      if (EP.vyber == null) return;
      const k = { ArrowLeft: [-0.01, 0], ArrowRight: [0.01, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1] }[e.key];
      if (k) { upravRozestup(kr => { const q = kr.kotvy[EP.vyber]; q.p = [q.p[0] + k[0] * (e.shiftKey ? 5 : 1), q.p[1] + k[1] * (e.shiftKey ? 5 : 1)]; }); e.preventDefault(); }
      else if (e.key === 'Delete' || e.key === 'Backspace') { smazUzelProhnuti(); e.preventDefault(); }
    });
    el.querySelectorAll('[data-tvarp]').forEach(b => b.addEventListener('click', () => {
      const typ = b.dataset.tvarp;
      EP.vyber = null;
      if (typ === 'vychozi') { delete stav.p.rozestup; kresliRozestup(); zmena(); return; }
      const K = krivkaRozestupu().kotvy, a0 = K[0].p[1], a1 = K[K.length - 1].p[1];
      const body = typ === 'klin' ? [[0, a0], [0.5, (a0 + a1) / 2], [1, a1]]

    $('nakresSvg').innerHTML = h;
    // měřítko vůči obrazovce (96 dpi)
    const m1 = 1 / (k * 25.4 / 96);
    $('nakresMeritko').textContent = 'měřítko na obrazovce ≈ 1 : ' + (m1 >= 1 ? cislo(m1, m1 < 10 ? 1 : 0) : '1 / ' + cislo(1 / m1, 1));
  }
  async function stahniNakres() {
    if (!nakresModel || !NK) return;
    const b = $('nakresPng');
    try { b.disabled = true; await stahniNakresPng(); }
    catch (e) { console.error(e); b.title = 'PNG se nepodařilo vytvořit'; }
    finally { b.disabled = false; }
  }
  async function stahniNakresPng() {
    const el = $('nakres'), W = el.clientWidth, H = el.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2) * 2;
    const c = document.createElement('canvas');
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d');
    // čáry vykreslit přímo ve výsledném rozlišení (roztažení by je rozmazalo)
    const pr0 = NK.r.getPixelRatio();
    NK.r.setPixelRatio(dpr);
    try { kresliNakres(nakresModel); g.drawImage(NK.r.domElement, 0, 0, c.width, c.height); }
    finally { NK.r.setPixelRatio(pr0); kresliNakres(nakresModel); }
    const svg = $('nakresSvg').cloneNode(true);
    // styly kót do SVG (obrázek nemá přístup k CSS stránky)
    const cs = getComputedStyle(document.documentElement), barva = n => (cs.getPropertyValue(n) || '#888').trim();
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.insertAdjacentHTML('afterbegin', `<style>.kota{stroke:${barva('--accent')};stroke-width:1;fill:none}.kota-sip{fill:${barva('--accent')}}.kota-txt{fill:${barva('--accent')};font:11px sans-serif;paint-order:stroke;stroke:${barva('--bg-elevated')};stroke-width:3px}.titul,.tab-k{fill:${barva('--text-muted')};font:11px sans-serif}.tab{fill:${barva('--text')};font:10.5px sans-serif}</style>`);
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
    const img = new Image();
    await new Promise((ok, chyba) => { img.onload = ok; img.onerror = chyba; img.src = url; });
    g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (!blob) throw new Error('toBlob');
    window.stahniSoubor(new Uint8Array(await blob.arrayBuffer()), nazevSouboru('png').replace(/\.png$/, '-nakres.png'), 'image/png');
  }

  /* ================= stavba a údaje ================= */
  let naplanovano = false, prvni = true;
  function zmena() {
    hlidejOptimalizaci();
    ulozStav();
    zaznamenej();
    if (naplanovano) return;
    naplanovano = true;
    requestAnimationFrame(() => { naplanovano = false; prestav(); });
  }
  function pohybStav() {
    try { return KD.pohyb(stav); } catch (e) { console.error(e); return { min: 0, max: 1, tisk: 0, nazev: 'Rozevření' }; }
  }
  // rozložení k tisku (bez modelu prázdné)
  const rozlozene = () => ({ casti: modelTisk ? KD.rozlozeni(modelTisk) : [] });
  function povolExport(ano) {
    for (const id of ['exportStl', 'export3mf', 'exportDily', 'rychleStl', 'rychle3mf']) if ($(id)) $(id).disabled = !ano;
  }
  function prestav() {
    const poh = pohybStav();
    let chyba = null;
    try { modelTisk = KD.sestav(stav, poh.tisk); } catch (e) { chyba = e; console.error(e); }
    povolExport(!chyba);
    if (chyba) {
      // starý model se nesmí exportovat – neodpovídá parametrům
      modelTisk = null;
      $('varovani').innerHTML = '<ul><li>Model se nepodařilo sestavit: ' + esc(chyba.message) + ' – upravte parametry nebo použijte ↶ Zpět.</li></ul>';
      return;
    }
    nastavPosuvnik();
    let m = modelTisk;
    if (Math.abs(theta - poh.tisk) > 1e-9) { try { m = KD.sestav(stav, theta); } catch (e) { m = modelTisk; } }
    zobrazModel(m);
    if (prvni) { nastavPohled('3d', modelTisk); prvni = false; }
    if (!EP.tah) kresliRozestup();      // editor rozestupu sleduje i ostatní rozměry (úhel, tloušťka…)
    udaje();
  }
  function nastavPosuvnik() {
    const poh = pohybStav();
    theta = Math.min(poh.max, Math.max(poh.min, theta));
    $('polohaNazev').textContent = poh.nazev;
    $('poloha').value = Math.round(1000 * (theta - poh.min) / (poh.max - poh.min || 1));
    $('polohaHodnota').textContent = cislo(theta, 1) + '°';
    $('poloha').setAttribute('aria-valuetext', poh.nazev + ' ' + cislo(theta, 1) + ' °');
    $('polohaZnacka').textContent = 'tisk: ' + cislo(poh.tisk, 1) + '°';
  }
  function zobrazPolohu() {
    let m;
    try { m = KD.sestav(stav, theta); } catch (e) { return; }
    zobrazModel(m);
    $('polohaHodnota').textContent = cislo(theta, 1) + '°';
    $('poloha').setAttribute('aria-valuetext', cislo(theta, 1) + ' °');
  }

  // plocha dolních ploch nad podložkou (tiskne se do vzduchu / jako most)
  function previsy(telesa) {
    let pl = 0;
    const z0 = telesa.length ? KJ.obal(telesa).lo[2] : 0;
    for (const t of telesa) {
      const V = t.V, I = t.I;
      for (let f = 0; f < I.length; f += 3) {
        const a = I[f] * 3, b = I[f + 1] * 3, c = I[f + 2] * 3;
        const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
        const vx = V[c] - V[a], vy = V[c + 1] - V[a + 1], vz = V[c + 2] - V[a + 2];
        const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, l = Math.hypot(nx, ny, nz);
        if (l < 1e-12 || nz / l > -0.72) continue;
        if ((V[a + 2] + V[b + 2] + V[c + 2]) / 3 - z0 < 0.15) continue;
        pl += l / 2;
      }
    }
    return pl;
  }

  function udaje() {
    const m = modelTisk;
    const vse = KD.rozlozeni(m).flatMap(c => c.telesa);
    const ob = KJ.obal(vse);
    let objem = 0, tr = 0, spatne = 0;
    for (const t of vse) { const k = KJ.kontrola(t); objem += k.objem; tr += k.trojuhelniku; if (k.spatneHrany || k.objem <= 0) spatne++; }
    const hust = parseFloat($('material').value) || 1.24;
    const pv = previsy(KD.rozlozeni(m).filter(c => c.role !== 'tpu').flatMap(c => c.telesa));
    const rozmer = [0, 1, 2].map(k => ob.hi[k] - ob.lo[k]);
    $('rozmer').textContent = rozmer.map(x => cislo(x, 1)).join(' × ') + ' mm';
    const pv0 = KD.PREDVOLBY.find(p => p.id === stav.predvolba);
    $('info').innerHTML = [
      ['Nástroj', esc(pv0 ? pv0.nazev : stav.gen) + ' · ' + esc(KC.CELISTI[stav.cel].nazev.toLowerCase())],
      ['Rozměry při tisku', rozmer.map(x => cislo(x, 1)).join(' × ') + ' mm'],
      ...(m.info && m.info.rozevreniTisk ? [['Rozevření při tisku', cislo(m.info.rozevreniTisk, 1) + '° <span class="jedn">(z rozestupu ramen u čelistí)</span>']] : []),
      ['Objem', '≈ ' + cislo(objem / 1000, 2) + ' cm³ <span class="jedn">(překryvy těles započteny)</span>'],
      ['Hmotnost', '≈ ' + cislo(objem / 1000 * hust, 1) + ' g'],
      ['Díly', m.casti.map(c => esc(c.nazev)).join(', ') + (new Set(m.casti.map(c => c.skupina || 'sestava')).size > 1 ? ' <span class="jedn">(tisknou se zvlášť)</span>' : '')],
      ['Síť', `${cislo(tr, 0)} trojúhelníků, ${vse.length} těles · ` + (spatne ? `<span class="chyba">${spatne} těles s chybou sítě</span>` : '<span class="ok">všechna uzavřená ✓</span>')],
      ['Do vzduchu', pv > 1 ? cislo(pv / 100, 2) + ' cm² spodních ploch nad podložkou' : 'nic – tiskne se bez podpěr']
    ].map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
    // varování
    const war = (m.varovani || []).slice();
    const kc = KC.kontrolaCelisti(stav.cel, Object.assign({}, stav.celP, KD.GENERATORY[stav.gen].pevneCelisti || {}), { t: stav.p.t, w: stav.p.w, g: stav.p.mezera || 0 });
    if (kc && !war.includes(kc)) war.push(kc);
    $('varovani').innerHTML = war.length ? '<ul>' + [...new Set(war)].map(w => `<li>${esc(w)}</li>`).join('') + '</ul>' : '';
    tipy(m, pv);
  }

  function tipy(m, pv) {
    const t = [], i = m.info || {}, p = stav.p;
    t.push('Tiskněte naležato přesně tak, jak model leží v náhledu (na podložce z = 0) – čelisti i ramena pak mají vrstvy podél délky a jsou nejpevnější.');
    if (i.pruzna) t.push('Pružná ramena: PETG nebo PP vydrží ohýbání mnohem lépe než PLA. Nastavte 4 a více perimetrů a 100% výplň, ať je rameno z plných drah.');
    if (i.tiskVKlidu) t.push(`Reverzní nástroj se tiskne zavřený s mezerou ${cislo(p.mezera, 2)} mm. V místě křížení jdou ramena nad sebou s vůlí ${cislo(p.vule, 2)} mm – horní rameno začíná mostem, po tisku ramena jemně rozhýbejte.`);
    if (i.kloub) {
      for (const x of (i.tipyKloubu || [])) t.push(x);
      t.push(i.tiskZvlast ? 'Rozložení dílů na podložce ukazuje tlačítko „Rozložení k tisku“ – v tomto rozložení se díly i exportují.' : 'Ve sliceru díly nespojujte a po tisku kloub opatrně rozhýbejte (pár minut v teplé vodě pomůže).');
      if (stav.p.rohatka) t.push('Rohatka drží, protože rukojeti mírně pruží do strany; povolí se vybočením rukojetí. Nejlépe funguje z PETG.');
    }
    if (m.casti.some(c => c.role === 'tpu')) t.push('Polštářky jsou v 3MF samostatná část – ve vícemateriálovém tisku jim přiřaďte TPU. Jinak je vytiskněte zvlášť (STL po dílech) a přilepte.');
    if (m.casti.some(c => c.role === 'kruh')) t.push('Zámkový kroužek se tiskne zvlášť nastojato (leží vedle nástroje), navlékne se přes hlavu na ramena.');
    const spoj = stav.gen === 'vidlice' ? ({ oblouk: 'oko', dvojity: 'dvojite' }[p.spoj] || p.spoj || 'hlava') : null;
    if (spoj && spoj !== 'hlava') t.push({ oko: 'Oko: ramena jsou tuhá a pruží jen pásek oka – větší rozsah rozevření. Větší úhel oka = delší pásek a měkčí chod. Pásek tiskněte se 100% výplní, nejlépe z PETG.', dvojite: 'Dvojité oko: dva rovnoběžné pásky se stálou mezerou – zhruba dvojnásobná síla čelistí při stejném rozevření.', meandr: 'Meandrová pružina: nejměkčí spoj s největším rozsahem; mezi závity nechte aspoň 0,6 mm, ať se při tisku nespojí.' }[spoj]);
    if (stav.gen === 'vidlice' && p.pruzina) t.push('Vnitřní pružina se při stisku prohýbá – čelisti tlačí větší silou a po puštění pinzetu sama rozevře.');
    if (pv > 1) t.push('Některé spodní plochy jsou nad podložkou (mosty pod horním ramenem kloubu či křížení, rozšířené čelisti) – krátké mosty zvládne slicer bez podpěr, u větších ploch zapněte podpěry jen od podložky.');
    const ob = KJ.obal(m.casti.flatMap(c => c.telesa));
    const obT = KJ.obal(KD.rozlozeni(m).flatMap(c => c.telesa));
    if (ob.lo[2] < -0.05) t.push('Čelisti jsou rozšířené souměrně a sahají pod ramena – nástroj leží na čelistech a ramena potřebují podpěry. Pro tisk bez podpěr vypněte v ④ „Rozšířit souměrně“.');
    if (Math.max(obT.hi[0] - obT.lo[0], obT.hi[1] - obT.lo[1]) > 220) t.push('Model je dlouhý ' + cislo(obT.hi[0] - obT.lo[0], 0) + ' mm – ověřte, že se vejde na podložku (případně ho ve sliceru natočte úhlopříčně).');
    if (stav.gen === 'klip') t.push('Pant je tenký pásek – z PETG nebo PP vydrží tisíce ohybů, z PLA se brzy zlomí. Klip zavírejte až po vychladnutí.');
    $('tipy').innerHTML = t.map(x => `<li>${esc(x)}</li>`).join('');
  }

  /* ================= optimalizace tvaru ================= */
  const MATERIALY = { '1.24': { nazev: 'PLA', eps: 0.015, vule: 0.35 }, '1.27': { nazev: 'PETG', eps: 0.025, vule: 0.4 }, '1.04': { nazev: 'ABS/ASA', eps: 0.02, vule: 0.35 },
    '0.90': { nazev: 'PP', eps: 0.05, vule: 0.45 }, '1.14': { nazev: 'Nylon', eps: 0.035, vule: 0.4 } };
  // návrh platí jen pro stav, ze kterého vznikl (optZ); „Vrátit“ jen dokud se
  // po použití nic dalšího nezměnilo (optPo) – jinak by zahodily pozdější úpravy
  let optNavrh = null, optZaloha = null, optZ = null, optPo = null;
  function hlidejOptimalizaci() {
    const j = JSON.stringify(stav);
    if (optNavrh && j !== optZ) { optNavrh = null; if ($('optVysledek')) $('optVysledek').hidden = true; }
    if (optZaloha && j !== optPo) { optZaloha = null; if ($('optVratit')) $('optVratit').hidden = true; }
  }
  function optimalizovat() {
    const mat = MATERIALY[$('material').value] || MATERIALY['1.24'];
    const r = KD.optimalizuj(stav, mat);
    const el = $('optVysledek');
    el.hidden = false;
    if (!r.zmeny.length) {
      optNavrh = null;
      el.innerHTML = `<h3>✨ Tvar je pro ${esc(mat.nazev)} už optimální</h3><p class="proc">Pružná místa vydrží rozevření, při stisku se nejdřív dotknou čelisti a rozměry odpovídají pravidlům. Materiál změníte v sekci ⑥.</p>
        <div class="tlacitka"><button class="btn btn-sec" type="button" data-opt="zavrit">Zavřít</button></div>`;
      return;
    }
    optNavrh = r.stav; optZ = JSON.stringify(stav);
    const hod = z => typeof z.z === 'number' ? cislo(z.z, 2) : (z.z == null ? '–' : esc(String(z.z)));
    el.innerHTML = `<h3>✨ Návrh optimalizace pro ${esc(mat.nazev)} (dovolené protažení ${cislo(mat.eps * 100, 1)} %)</h3><ul>`
      + r.zmeny.map(z => `<li><span class="zmena">${esc(z.nazev)}: ${hod(z)} → ${cislo(z.na, 2)} ${esc(z.jednotka)}</span><br><span class="proc">${esc(z.proc)}</span></li>`).join('')
      + `</ul><div class="tlacitka"><button class="btn" type="button" data-opt="pouzit">Použít</button><button class="btn btn-sec" type="button" data-opt="zavrit">Zrušit</button></div>`;
  }
  function pouzijOptimalizaci() {
    if (!optNavrh) return;
    optZaloha = kopie(stav);
    stav = optNavrh; optNavrh = null; optPo = JSON.stringify(stav);
    $('optVysledek').hidden = true;
    $('optVratit').hidden = false;
    theta = pohybStav().tisk;
    vykresliParametry(); vykresliPrurez();
    zmena();
  }

  /* ================= historie (Zpět / Znovu) ================= */
  const HIST = { zasobnik: [], pozice: -1, casovac: null, obnovuji: false };
  function zaznamenej() {
    if (HIST.obnovuji) return;
    clearTimeout(HIST.casovac);
    HIST.casovac = setTimeout(() => {
      const j = JSON.stringify(stav);
      if (HIST.zasobnik[HIST.pozice] === j) return;
      HIST.zasobnik = HIST.zasobnik.slice(0, HIST.pozice + 1);
      HIST.zasobnik.push(j);
      if (HIST.zasobnik.length > 80) HIST.zasobnik.shift();
      HIST.pozice = HIST.zasobnik.length - 1;
      tlacitkaHistorie();
    }, 350);
  }
  function tlacitkaHistorie() {
    $('zpet').disabled = $('zpetMenu').disabled = HIST.pozice <= 0;
    $('znovu').disabled = $('znovuMenu').disabled = HIST.pozice >= HIST.zasobnik.length - 1;
  }
  function krokHistorie(o) {
    clearTimeout(HIST.casovac);
    const j = JSON.stringify(stav);
    if (HIST.zasobnik[HIST.pozice] !== j) { HIST.zasobnik = HIST.zasobnik.slice(0, HIST.pozice + 1); HIST.zasobnik.push(j); HIST.pozice = HIST.zasobnik.length - 1; }
    const n = HIST.pozice + o;
    if (n < 0 || n >= HIST.zasobnik.length) return;
    HIST.pozice = n;
    HIST.obnovuji = true;
    stav = JSON.parse(HIST.zasobnik[n]);
    theta = pohybStav().tisk;
    vykresliGalerii(); vykresliCelisti(); vykresliParametry(); vykresliPrurez();
    zmena();
    HIST.obnovuji = false;
    tlacitkaHistorie();
  }

  /* ================= hlavní nabídka =================
     Rozbalovací panely pod lištou (jeden otevřený; když je otevřený, najetí
     na jinou položku přepne). Esc / klik mimo zavře. 📌 panel připne do doku
     vlevo vedle náhledu (zůstane otevřený, pamatuje se). */
  const bezDia = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const KLIC_DOK = KLIC + '_dok';
  let otevreneMenu = null;
  const tlMenu = id => document.querySelector('.menu-tl[data-menu="' + id + '"]');
  const jePripnuty = id => $(id) && $(id).parentElement === $('dok');
  function poOtevreni(id) {
    // náhledy v galeriích se kreslí podle skutečné velikosti plátna
    if (id === 'mDruh') vykresliGalerii();
    if (id === 'mCel') vykresliCelisti();
    if (id === 'mRozmery') kresliRozestup();
    if (id === 'mPrurez') vykresliPrurez();
  }
  function vyskaMenu() {
    const r = $('menu').getBoundingClientRect();
    document.documentElement.style.setProperty('--menu-dole', Math.round(r.bottom + 6) + 'px');
    document.documentElement.style.setProperty('--menu-vyska', Math.max(200, Math.round(innerHeight - r.bottom - 18)) + 'px');
  }
  function otevriMenu(id, fokus) {
    if (otevreneMenu && otevreneMenu !== id) zavriMenu(false);
    if (jePripnuty(id)) { $(id).scrollIntoView({ block: 'nearest' }); return; }
    vyskaMenu();
    otevreneMenu = id;
    $(id).hidden = false;
    tlMenu(id).setAttribute('aria-expanded', 'true');
    poOtevreni(id);
    if (fokus) { const f = $(id).querySelector('input:not([type=hidden]), select, button:not(.pripnout), [tabindex="0"]'); if (f) f.focus(); }
  }
  function zavriMenu(fokusZpet) {
    if (!otevreneMenu) return;
    const id = otevreneMenu;
    otevreneMenu = null;
    if (!jePripnuty(id)) $(id).hidden = true;
    tlMenu(id).setAttribute('aria-expanded', 'false');
    if (fokusZpet) tlMenu(id).focus();
  }
  function pripni(id, ano, ulozit) {
    const p = $(id), tl = tlMenu(id);
    if (ano) {
      if (otevreneMenu === id) { otevreneMenu = null; tl.setAttribute('aria-expanded', 'false'); }
      $('dok').appendChild(p);
      p.hidden = false;
    } else {
      tl.parentElement.appendChild(p);
      p.hidden = true;
    }
    tl.classList.toggle('pripnuty', ano);
    p.querySelector('.pripnout').setAttribute('aria-pressed', String(ano));
    p.querySelector('.pripnout').title = ano ? 'Odepnout (zpět do nabídky)' : 'Připnout panel vedle náhledu';
    $('main').classList.toggle('s-dokem', $('dok').children.length > 0);
    if (ano) poOtevreni(id);
    if (ulozit !== false) try { localStorage.setItem(KLIC_DOK, JSON.stringify([...$('dok').children].map(e => e.id))); } catch (e) { /* */ }
  }
  function napojMenu() {
    const menu = $('menu');
    menu.querySelectorAll('.menu-tl').forEach(b => {
      const id = b.dataset.menu;
      b.addEventListener('click', () => { if (otevreneMenu === id) zavriMenu(false); else otevriMenu(id); });
      // desktopové chování: při otevřené nabídce přepíná najetí myší
      b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && otevreneMenu && otevreneMenu !== id) otevriMenu(id); });
      b.addEventListener('keydown', e => {
        const vse = [...menu.querySelectorAll('.menu-tl')], i = vse.indexOf(b);
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          const n = vse[(i + (e.key === 'ArrowRight' ? 1 : -1) + vse.length) % vse.length];
          n.focus(); if (otevreneMenu) otevriMenu(n.dataset.menu); e.preventDefault();
        } else if (e.key === 'ArrowDown') { otevriMenu(id, true); e.preventDefault(); }
      });
    });
    document.querySelectorAll('.menu-panel .pripnout').forEach(b => b.addEventListener('click', () => {
      const id = b.closest('.menu-panel').id;
      pripni(id, !jePripnuty(id));
    }));
    // klik do položky akce v úzkých nabídkách (Soubor, Úpravy, Zobrazit) nabídku zavře
    menu.addEventListener('click', e => {
      const p = e.target.closest('.menu-akce .polozka');
      if (p && p.tagName === 'BUTTON' && !jePripnuty(p.closest('.menu-panel').id)) zavriMenu(false);
    });
    document.addEventListener('pointerdown', e => {
      if (otevreneMenu && !e.target.closest('.menu-polozka') && !e.target.closest('.dlg, dialog')) zavriMenu(false);
      if (!e.target.closest('.hledani')) $('hledaniVysledky').hidden = true;
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || document.querySelector('dialog[open]')) return;     // Esc v dialogu zavře jen dialog
      if (!$('hledaniVysledky').hidden) { $('hledaniVysledky').hidden = true; return; }
      if (otevreneMenu) { zavriMenu(true); e.preventDefault(); }
    });
    addEventListener('resize', () => { if (otevreneMenu) vyskaMenu(); });
    $('odepnoutVse').addEventListener('click', () => [...$('dok').children].forEach(p => pripni(p.id, false)));
    $('ukazNakres').addEventListener('change', e => { $('nakresObal').hidden = !e.target.checked; ulozZobrazeni(); });
    $('ukazUdaje').addEventListener('change', e => { document.querySelector('.karty').hidden = !e.target.checked; ulozZobrazeni(); });
    try {
      const z = JSON.parse(localStorage.getItem(KLIC + '_zobrazeni')) || {};
      if (z.nakres === false) { $('ukazNakres').checked = false; $('nakresObal').hidden = true; }
      if (z.udaje === false) { $('ukazUdaje').checked = false; document.querySelector('.karty').hidden = true; }
    } catch (e) { /* */ }
    let dok = [];
    try { dok = JSON.parse(localStorage.getItem(KLIC_DOK)) || []; } catch (e) { /* */ }
    for (const id of dok) if ($(id) && tlMenu(id) && $(id).querySelector('.pripnout')) pripni(id, true, false);
    // položky Úpravy
    $('zpetMenu').addEventListener('click', () => krokHistorie(-1));
    $('znovuMenu').addEventListener('click', () => krokHistorie(1));
    $('optimalizovatMenu').addEventListener('click', () => $('optimalizovat').click());
    $('nakresPngMenu').addEventListener('click', () => $('nakresPng').click());
  }
  function ulozZobrazeni() { try { localStorage.setItem(KLIC + '_zobrazeni', JSON.stringify({ nakres: $('ukazNakres').checked, udaje: $('ukazUdaje').checked })); } catch (e) { /* */ } }

  /* hledání nastavení: seznam nalezených parametrů napříč panely; výběr
     otevře panel, posune na řádek, zvýrazní ho a dá mu fokus */
  let vysledkyHledani = [];
  function hledejNastaveni() {
    const q = bezDia($('hledatNastaveni').value.trim()), el = $('hledaniVysledky');
    if (!q) { el.hidden = true; return; }
    vysledkyHledani = [];
    document.querySelectorAll('.menu-panel').forEach(p => {
      const nazevPanelu = p.querySelector('.menu-hlava b').textContent;
      p.querySelectorAll('.par').forEach(r => {
        const lb = r.querySelector('label'), lg = r.closest('fieldset') && r.closest('fieldset').querySelector('legend');
        if (!lb || r.closest('[hidden]:not(.menu-panel)')) return;
        const txt = lb.textContent.trim(), skup = lg ? lg.textContent.trim() : '';
        if (bezDia(txt + ' ' + skup + ' ' + nazevPanelu).includes(q)) vysledkyHledani.push({ panel: p.id, radek: r, txt, cesta: nazevPanelu + (skup ? ' › ' + skup : '') });
      });
    });
    el.innerHTML = vysledkyHledani.length
      ? vysledkyHledani.slice(0, 40).map((v, i) => `<button type="button" role="option" data-i="${i}">${esc(v.txt)}<small>${esc(v.cesta)}</small></button>`).join('')
      : '<div class="nic">Nic nenalezeno.</div>';
    el.hidden = false;
  }
  function jdiNaVysledek(i) {
    const v = vysledkyHledani[i];
    if (!v) return;
    $('hledaniVysledky').hidden = true;
    otevriMenu(v.panel);
    v.radek.scrollIntoView({ block: 'center', behavior: 'smooth' });
    v.radek.classList.remove('zvyraznit'); void v.radek.offsetWidth; v.radek.classList.add('zvyraznit');
    const f = v.radek.querySelector('input[type=number], select, input[type=checkbox]');
    if (f) f.focus({ preventScroll: true });
  }
  function napojHledani() {
    const h = $('hledatNastaveni'), el = $('hledaniVysledky');
    h.addEventListener('input', hledejNastaveni);
    h.addEventListener('focus', () => { if (h.value.trim()) hledejNastaveni(); });
    h.addEventListener('keydown', e => {
      if (e.key === 'Enter') { jdiNaVysledek(0); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { const b = el.querySelector('button'); if (b) { b.focus(); e.preventDefault(); } }
    });
    el.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) jdiNaVysledek(+b.dataset.i); });
    el.addEventListener('keydown', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (e.key === 'ArrowDown' && b.nextElementSibling) { b.nextElementSibling.focus(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { (b.previousElementSibling || h).focus(); e.preventDefault(); }
    });
  }

  /* ================= animace ================= */
  const animace = { bezi: false, t0: 0 };
  function krokAnimace() {
    const poh = pohybStav(), per = 3200;
    const f = 0.5 - 0.5 * Math.cos(2 * Math.PI * ((performance.now() - animace.t0) % per) / per);
    theta = poh.min + (poh.max - poh.min) * f;
    $('poloha').value = Math.round(1000 * f);
    zobrazPolohu();
  }
  function prepniAnimaci(zap) {
    animace.bezi = zap;
    animace.t0 = performance.now();
    $('animace').setAttribute('aria-pressed', String(zap));
    $('animace').textContent = zap ? '⏸ Zastavit' : '▶ Pohyb';
  }

  /* ================= export ================= */
  // jméno ze sbírky jen pro návrh ze sbírky – po výběru jiné předvolby ne
  // (aktivní položka sbírky zůstává; mění se až uložením nebo načtením jiné)
  let ciziJmeno = undefined;
  const aktivniSbirka = () => (sbirka && sbirka.aktivni ? sbirka.aktivni() : null);
  function nazevSouboru(pripona) {
    let a = aktivniSbirka();
    if (ciziJmeno !== undefined && a === ciziJmeno) a = null;
    const z = (a || (stav.predvolba + '-' + stav.cel)).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
    return (z || 'kleste') + '.' + pripona;
  }
  function stahni(data, jmeno, typ) {
    const url = URL.createObjectURL(new Blob([data], { type: typ }));
    const a = document.createElement('a');
    a.href = url; a.download = jmeno;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  window.stahniSoubor = stahni;   // pro testy (podvržení)
  // model na střed podložky
  function vycentrovane(m) {
    const casti = KD.rozlozeni(m);
    const ob = KJ.obal(casti.flatMap(c => c.telesa));
    const dx = -(ob.lo[0] + ob.hi[0]) / 2, dy = -(ob.lo[1] + ob.hi[1]) / 2, dz = -ob.lo[2];
    return casti.map(c => ({ nazev: c.nazev, role: c.role, telesa: c.telesa.map(t => KJ.posun(t, dx, dy, dz)) }));
  }
  async function deflate(data) {
    if (typeof CompressionStream === 'undefined') return null;
    try {
      const s = new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(s).arrayBuffer());
    } catch (e) { return null; }
  }
  async function export3MF() {
    if (!modelTisk) return;
    const casti = vycentrovane(modelTisk);
    const soubory = KJ.soubory3MF(casti, nazevSouboru('').replace(/\.$/, ''));
    for (const s of soubory) { const d = await deflate(s.data); if (d && d.length < s.data.length) s.deflate = d; }
    window.stahniSoubor(KJ.zip(soubory), nazevSouboru('3mf'), 'model/3mf');
  }

  /* ================= sbírka návrhů ================= */
  let sbirka = null;
  function popisNavrhu(s) {
    const pv = KD.PREDVOLBY.find(p => p.id === s.predvolba);
    const C = KC.CELISTI[s.cel];
    const L = s.p.L || ((s.p.predni || 0) + (s.p.zadni || 0));
    return (pv ? pv.nazev : s.gen) + ' · ' + (C ? C.nazev.toLowerCase() : '') + (L ? ' · ' + Math.round(L) + ' mm' : '');
  }

  /* ================= události ================= */
  function vyberPredvolbu(id) {
    stav = KD.zPredvolby(id);
    ciziJmeno = aktivniSbirka();
    optNavrh = null; optZaloha = null;
    if ($('optVysledek')) { $('optVysledek').hidden = true; $('optVratit').hidden = true; }
    prepniAnimaci(false);
    theta = pohybStav().tisk;
    prvni = true;
    vykresliGalerii(); vykresliCelisti(); vykresliParametry(); vykresliPrurez();
    zmena();
  }
  function vyberCelist(id) {
    if (id === stav.cel) return;
    const stare = stav.celP;
    const c = KD.kontextCelisti(stav.gen, stav.p, stare);
    const nove = KC.vychozi(id, c);
    // délka čelisti zůstane, pokud ji oba druhy mají
    if ('L' in nove && 'L' in stare) nove.L = stare.L;
    if ('ohyb' in nove && 'ohyb' in stare) nove.ohyb = stare.ohyb;
    stav.cel = id; stav.celP = nove;
    $('galerieCelisti').querySelectorAll('.karta-vyber').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.celist === id)));
    const C = KC.CELISTI[id];
    $('popisCelisti').textContent = C.popis;
    $('vybraneCelisti').textContent = C.nazev;
    vykresliParametry();
    zmena();
  }

  function init() {
    stav = nactiStav();
    theta = pohybStav().tisk;
    HIST.zasobnik = [JSON.stringify(stav)]; HIST.pozice = 0;
    vykresliFiltry(); vykresliGalerii(); vykresliCelisti(); vykresliParametry();
    napojPrurez(); vykresliPrurez();
    initScena();
    initNakres();
    napojParametry($('parNastroj'), () => stav.p, () => KD.GENERATORY[stav.gen].parametry, vychoziNastroje);
    napojParametry($('parTisk'), () => stav.p, () => KD.GENERATORY[stav.gen].parametry, vychoziNastroje);
    napojParametry($('parPrurez'), () => stav.p, () => KD.GENERATORY[stav.gen].parametry, vychoziNastroje);
    napojParametry($('parCelistNastroj'), () => stav.p, () => KD.GENERATORY[stav.gen].parametry, vychoziNastroje);
    napojParametry($('parCelisti'), () => stav.celP, () => KC.CELISTI[stav.cel].parametry, vychoziCelisti);
    $('filtry').addEventListener('click', e => {
      const b = e.target.closest('button[data-kat]'); if (!b) return;
      filtr = b.dataset.kat; vykresliFiltry(); vykresliGalerii();
    });
    // klik na už vybranou předvolbu úpravy nezahodí (na to je tlačítko „Výchozí“)
    $('galerieDruhu').addEventListener('click', e => { const b = e.target.closest('[data-predvolba]'); if (b && b.dataset.predvolba !== stav.predvolba) { vyberPredvolbu(b.dataset.predvolba); if (otevreneMenu === 'mDruh') zavriMenu(false); } });
    $('galerieCelisti').addEventListener('click', e => { const b = e.target.closest('[data-celist]'); if (b && !b.disabled) vyberCelist(b.dataset.celist); });
    document.querySelectorAll('[data-pohled]').forEach(b => b.addEventListener('click', () => nastavPohled(b.dataset.pohled, rezim === 'tisk' ? { casti: rozlozene().casti } : null)));
    document.querySelectorAll('[data-rezim]').forEach(b => b.addEventListener('click', () => nastavRezim(b.dataset.rezim)));
    $('poloha').addEventListener('input', e => {
      prepniAnimaci(false);
      const poh = pohybStav();
      theta = poh.min + (poh.max - poh.min) * e.target.value / 1000;
      zobrazPolohu();
    });
    $('animace').addEventListener('click', () => prepniAnimaci(!animace.bezi));
    $('optimalizovat').addEventListener('click', optimalizovat);
    $('rychleStl').addEventListener('click', () => $('exportStl').click());
    $('rychle3mf').addEventListener('click', () => $('export3mf').click());
    $('zpet').addEventListener('click', () => krokHistorie(-1));
    $('znovu').addEventListener('click', () => krokHistorie(1));
    document.addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const t = e.target, pise = t && (t.tagName === 'INPUT' && t.type !== 'range' && t.type !== 'checkbox' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
      if (pise) return;
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { krokHistorie(-1); e.preventDefault(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { krokHistorie(1); e.preventDefault(); }
    });
    napojHledani();
    $('hledatDruh').addEventListener('input', vykresliGalerii);
    napojMenu();
    $('optVysledek').addEventListener('click', e => {
      const a = e.target.dataset.opt;
      if (a === 'pouzit') pouzijOptimalizaci();
      else if (a === 'zavrit') { $('optVysledek').hidden = true; optNavrh = null; }
    });
    $('optVratit').addEventListener('click', () => {
      if (!optZaloha) return;
      stav = optZaloha; optZaloha = null;
      $('optVratit').hidden = true;
      theta = pohybStav().tisk;
      vykresliParametry(); vykresliPrurez(); zmena();
    });
    $('tiskovaPoloha').addEventListener('click', () => { prepniAnimaci(false); theta = pohybStav().tisk; nastavPosuvnik(); zobrazPolohu(); });
    $('material').addEventListener('change', () => { try { localStorage.setItem(KLIC + '_material', $('material').value); } catch (e) { /* */ } udaje(); });
    try { const mt = localStorage.getItem(KLIC + '_material'); if (mt) $('material').value = mt; } catch (e) { /* */ }
    $('exportStl').addEventListener('click', () => {
      if (!modelTisk) return;
      const tt = vycentrovane(modelTisk).flatMap(c => c.telesa);
      window.stahniSoubor(KJ.stlBinarni(tt), nazevSouboru('stl'), 'model/stl');
    });
    $('exportDily').addEventListener('click', () => {
      if (!modelTisk) return;
      const z = nazevSouboru('').replace(/\.$/, '');
      const soubory = vycentrovane(modelTisk).map((c, i) => ({ jmeno: z + '-' + (i + 1) + '-' + c.nazev.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').toLowerCase() + '.stl', data: KJ.stlBinarni(c.telesa) }));
      window.stahniSoubor(KJ.zip(soubory), z + '-dily.zip', 'application/zip');
    });
    $('export3mf').addEventListener('click', async () => { const b = $('export3mf'); b.disabled = true; try { await export3MF(); } finally { b.disabled = false; } });
    $('odkaz').addEventListener('click', async () => {
      const url = location.href.split('#')[0] + '#n=' + encodeURIComponent(JSON.stringify(stav));
      try { await navigator.clipboard.writeText(url); $('odkaz').textContent = '✓ Odkaz zkopírován'; }
      catch (e) { history.replaceState(null, '', url); $('odkaz').textContent = '✓ Odkaz je v adresním řádku'; }
      setTimeout(() => { $('odkaz').textContent = '🔗 Odkaz na návrh'; }, 2200);
    });
    $('vychozi').addEventListener('click', () => vyberPredvolbu(stav.predvolba));
    // vložený odkaz do stejné záložky (změní se jen #n=…)
    addEventListener('hashchange', () => {
      if (!/^#n=/.test(location.hash)) return;
      const s = nactiStav();
      stav = s; prvni = true;
      theta = pohybStav().tisk;
      vykresliGalerii(); vykresliCelisti(); vykresliParametry(); vykresliPrurez();
      zmena();
    });
    // tvary.js má `const Tvary` (globální, ale ne vlastnost window)
    if (typeof Tvary !== 'undefined') {
      sbirka = Tvary.pripoj({
        klic: 'webapp_kleste_tvary', typ: 'kleste', nazev: 'Kleště a pinzety', kontejner: $('tvary'),
        parametry: () => JSON.parse(JSON.stringify(stav)),
        pouzij: s => { if (!platny(s)) return; ciziJmeno = undefined; stav = doplnStav(s); theta = pohybStav().tisk; prvni = true; vykresliGalerii(); vykresliCelisti(); vykresliParametry(); vykresliPrurez(); zmena(); },
        popis: popisNavrhu
      });
    }
    prestav();
    // pro testy
    window.KLESTE = { kamera, prestav, krokHistorie, HIST, optimalizovat, pouzijOptimalizaci, ED, EP, NK: () => NK, kresliNakres: () => nakresModel && kresliNakres(nakresModel), vykresliPrurez, nastavRezim, rezim: () => rezim, skupina: () => skupina, stav: () => stav, model: () => modelTisk, theta: () => theta, vyberPredvolbu, vyberCelist, nastavPohled, prekresli };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
