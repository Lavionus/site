<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.container{max-width:680px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:18px;font-weight:600;text-align:center}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:24px;margin-bottom:20px}
.kategorie{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.kategorie{grid-template-columns:1fr}}
.kat{background:var(--border);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:16px;cursor:pointer;font-size:1rem;text-align:center;transition:all .12s}
.kat:hover{background:var(--accent);color:#fff}
.stav{display:flex;justify-content:space-between;color:var(--text-faint);font-size:.88rem;margin-bottom:14px}
.otazka{font-size:1.25rem;font-weight:600;margin-bottom:18px;line-height:1.45;min-height:3.6rem}
.odpovedi{display:grid;gap:10px}
.odp{background:var(--border);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:13px 16px;cursor:pointer;font-size:.95rem;text-align:left;transition:all .12s}
.odp:hover{background:var(--border-strong)}
.odp.spravne{background:#27ae60;border-color:#27ae60;color:#fff}
.odp.spatne{background:#c0392b;border-color:#c0392b;color:#fff}
.progres{background:var(--bg-hover);border-radius:4px;height:8px;overflow:hidden;margin-bottom:16px}
.progres>div{height:100%;background:var(--accent);transition:width .3s}
.vysledek{text-align:center}
.vysledek .velke{font-size:3rem;font-weight:700;color:var(--accent);margin:14px 0}
.vysledek .hodnoceni{font-size:1.1rem;color:var(--warn);margin-bottom:18px}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.95rem}
.skryto{display:none}
</style>
</head>

/* Odehrané otázky si pamatujeme, aby se stejná nevracela hned v další hře.
   Když se sada vyčerpá, začne se nanovo. */
const KLIC_ODEHRANE='webapp_hra_trivia_odehrane';
function nactiOdehrane(){
  try{const v=JSON.parse(localStorage.getItem(KLIC_ODEHRANE));return Array.isArray(v)?new Set(v):new Set();}
  catch{return new Set();}
}
function ulozOdehrane(mnozina){
  try{localStorage.setItem(KLIC_ODEHRANE,JSON.stringify([...mnozina]));}catch{/* nevadí */}
}
function zamichej(pole){
  const p=[...pole];
  for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  return p;
}
function vyberOtazky(zdroj,kolik){
  let odehrane=nactiOdehrane();
  let zbyva=zdroj.filter(o=>!odehrane.has(o[0]));
  if(zbyva.length<kolik){        // sada vyčerpaná – kolo se uzavře a jede se znovu
    odehrane=new Set();
    zbyva=[...zdroj];
  }
  const vybrane=zamichej(zbyva).slice(0,kolik);
  vybrane.forEach(o=>odehrane.add(o[0]));
  ulozOdehrane(odehrane);
  return vybrane;
}

$('kategorie').addEventListener('click',e=>{
  const k=e.target.closest('.kat')?.dataset.k;
  if(!k)return;
  const zdroj=k==='mix'?Object.values(OTAZKY).flat():OTAZKY[k];
  otazky=vyberOtazky(zdroj,10);
  poradi=0;skore=0;
  $('vyberKat').classList.add('skryto');
  $('konec').classList.add('skryto');
  $('hra').classList.remove('skryto');
  ukazOtazku();
});
function ukazOtazku(){
  zamceno=false;
  const o=otazky[poradi];
  $('poradi').textContent=`Otázka ${poradi+1} / ${otazky.length}`;
  $('skore').textContent=`Skóre: ${skore}`;
  $('progres').style.width=(poradi/otazky.length*100)+'%';
  $('otazka').textContent=o[0];
  const odpovedi=[[o[1],true],[o[2],false],[o[3],false],[o[4],false]].sort(()=>Math.random()-0.5);
  $('odpovedi').innerHTML=odpovedi.map(([t,ok],i)=>
    `<button class="odp" data-ok="${ok}">${String.fromCharCode(65+i)}) ${t}</button>`).join('');
}
$('odpovedi').addEventListener('click',e=>{
  const b=e.target.closest('.odp');
  if(!b||zamceno)return;
  zamceno=true;
  const ok=b.dataset.ok==='true';
  if(ok){b.classList.add('spravne');skore++;}
  else{
    b.classList.add('spatne');
    document.querySelector('.odp[data-ok="true"]').classList.add('spravne');
  }
  setTimeout(()=>{
    poradi++;
    if(poradi<otazky.length)ukazOtazku();
    else konec();
  },1200);
});
function konec(){
  $('hra').classList.add('skryto');
  $('konec').classList.remove('skryto');
  $('finale').textContent=skore+' / '+otazky.length;
  const pct=skore/otazky.length;
  $('hodnoceni').textContent=pct===1?'🏆 Fenomenální! Vše správně!':pct>=0.8?'🌟 Výborně!':pct>=0.5?'👍 Slušný výkon.':pct>=0.3?'📚 Je co zlepšovat…':'😅 Nevadí, zkus to znovu!';
  // rekord = nejvyšší procentuální úspěšnost (kategorie mají různý počet otázek)
  if(rek)rek.zapis(Math.round(pct*100));
}
$('znovu').onclick=()=>{
  $('konec').classList.add('skryto');
  $('vyberKat').classList.remove('skryto');
};
</script>
</body>
</html>
