<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📞 Trénink: podvodný hovor a SMS</title>
<meta name="description" content="Interaktivní nácvik obrany proti podvodům: volá „banka“, SMS o balíku, „mami, mám nové číslo“, klonovaný hlas vnuka, peníze omylem, bazar s kurýrem, nahrávání hovoru a falešná technická podpora.">
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../dialog.js"></script>
<script src="../podpis.js" defer></script>
<script src="gamebook/jadro.js"></script>
<script src="trenink_podvodu/pribeh.js"></script>
<style>
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font,system-ui,sans-serif);line-height:1.5}
.lista{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border)}
.lista .tl{flex-shrink:0}
.lista h1{font-size:1.02rem;font-weight:600;margin:0 auto 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.samostatne .lista{padding-right:72px}
.tl{background:var(--bg-control);color:var(--text);border:1px solid var(--border);padding:5px 9px;border-radius:6px;cursor:pointer;font:inherit;font-size:.86rem;white-space:nowrap}
.tl:hover{background:var(--bg-hover);border-color:var(--border-strong)}
@media (max-width:560px){.lista .txt{display:none}.lista h1{font-size:.95rem}}
.obal{max-width:820px;margin:0 auto;padding:16px 16px 70px}
.btn{background:var(--bg-control);color:var(--text);border:1px solid var(--border-strong);padding:9px 14px;border-radius:var(--radius,8px);cursor:pointer;font:inherit;font-size:.95rem}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.uvod p{margin:6px 0}
.postup{margin:10px 0 16px;color:var(--text-muted)}
.postup .mer{height:8px;border-radius:4px;background:var(--bg-control);overflow:hidden;margin-top:4px}
.postup .mer i{display:block;height:100%;background:var(--ok)}
.karty{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.karta{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);border-radius:var(--radius,8px);padding:12px;cursor:pointer;font:inherit}
.karta:hover{border-color:var(--accent)}
.karta .ik{font-size:1.7rem;line-height:1}
.karta b{display:block}
.karta .po{color:var(--text-muted);font-size:.9rem}
.karta .stav{display:inline-block;margin-top:6px;font-size:.8rem;padding:1px 8px;border-radius:999px;background:var(--bg-control);color:var(--text-muted)}
.stav.vyhra{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--text)}
.stav.castecne{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--text)}
.stav.prohra{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--text)}
.zasady{margin-top:22px;background:var(--bg-elevated);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:var(--radius,8px);padding:10px 16px}
.zasady h2{font-size:1.05rem;margin:4px 0 6px}
.zasady ul{margin:0;padding-left:20px}
.zasady li{margin:3px 0}
.hlava{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:.9rem;margin-bottom:8px}
.hlava b{color:var(--text)}
.zpetna{border-radius:var(--radius,8px);padding:9px 12px;margin:0 0 12px;border-left:4px solid var(--border-strong);background:var(--bg-elevated)}
.zpetna.ok{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--bg))}
.zpetna.chyba{border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--bg))}
.zpetna b{display:block}
.situace{font-size:1.06rem;margin:0 0 12px}
.zprava{background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin:0 0 16px;max-width:600px;box-shadow:var(--shadow)}
.zprava .od{font-size:.8rem;color:var(--text-muted);margin-bottom:4px;word-break:break-word}
.zprava .rec{font-size:1.04rem;word-break:break-word}
.zprava.hovor .rec{font-style:italic}
.zprava.sms,.zprava.chat,.zprava.banka{border-radius:14px 14px 14px 4px}
.zprava.web .rec,.zprava.web .od{font-family:ui-monospace,monospace}
.zprava.web{border-style:dashed}
.volby{display:flex;flex-direction:column;gap:8px}
.volba{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg-control);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--radius,8px);padding:11px 14px;cursor:pointer;font:inherit;font-size:1rem}
.volba:hover{background:var(--bg-hover);border-color:var(--accent)}
.volba .c{color:var(--accent);font-weight:700}
.konec{border-radius:var(--radius,8px);padding:12px 14px;margin-bottom:12px;font-weight:700;font-size:1.1rem}
.konec.vyhra{background:color-mix(in srgb,var(--ok) 20%,var(--bg))}
.konec.castecne{background:color-mix(in srgb,var(--warn) 22%,var(--bg))}
.konec.prohra{background:color-mix(in srgb,var(--danger) 18%,var(--bg))}
h2.pod{font-size:1.05rem;margin:18px 0 6px}
.obal ul{padding-left:22px}
.rozbor{padding-left:0;list-style:none;margin:0}
.rozbor li{border:1px solid var(--border);border-radius:var(--radius,8px);padding:8px 12px;margin:6px 0;background:var(--bg-elevated)}
.rozbor .vol{font-weight:600}
.rozbor .proc{color:var(--text-muted);font-size:.93rem}
.akce{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.odkazy{margin-top:30px;padding-top:12px;border-top:1px solid var(--border);color:var(--text-muted);font-size:.93rem}
.odkazy a{color:var(--accent)}
dialog.okno{border:1px solid var(--border);border-radius:10px;background:var(--bg-panel,var(--bg-elevated));color:var(--text);max-width:min(560px,94vw);padding:0}
dialog.okno::backdrop{background:rgba(0,0,0,.45)}
dialog.okno header{padding:10px 16px;font-weight:700;border-bottom:1px solid var(--border)}
dialog.okno .telo{padding:6px 16px;max-height:65vh;overflow:auto}
dialog.okno footer{padding:10px 16px;text-align:right;border-top:1px solid var(--border)}
.vysl{list-style:none;padding:0}
.vysl li{margin:6px 0}
</style>
</head>
<body>
<header class="lista">
  <h1>📞 Trénink: podvodný hovor a SMS</h1>
  <button class="tl" data-prikaz="vyber" title="Výběr scénáře">📋<span class="txt"> Scénáře</span></button>
  <button class="tl" data-prikaz="vysledky" title="Nalezené konce">🏆<span class="txt"> Výsledky</span></button>
  <button class="tl" data-prikaz="zasady" title="Zlatá pravidla">📌<span class="txt"> Zásady</span></button>
</header>
<main class="obal">
  <div id="obsah"></div>
  <p class="odkazy">Víc o podvodech: <a href="podvody.html">🛡️ Běžné podvody a jak se bránit</a> · <a href="podvody_prednaska.html">🎤 Přednáška: Nenechte se napálit</a></p>
</main>
<dialog class="okno" id="dlg"><form method="dialog">
  <header id="dlgTitul"></header>
  <div class="telo" id="dlgTelo"></div>
  <footer><button class="btn primary" value="ok">Zavřít</button></footer>
</form></dialog>
<script>
/* Stránka tréninku: scénáře z trenink_podvodu/pribeh.js běží na enginu gamebooků (gamebook/jadro.js).
   Rozcestí příběhu se nezobrazuje – místo něj karty scénářů. Uloženo ve webapp_trenink_podvodu. */
(function () {
'use strict';
const J = window.GamebookJadro, P = window.TRENINK_PRIBEH;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ZNAK = { vyhra: '✅', castecne: '⚠️', prohra: '❌' };
const POPIS_TYPU = { vyhra: 'Dobrý konec', castecne: 'Napůl dobrý konec', prohra: 'Špatný konec' };
const PORADI = { prohra: 1, castecne: 2, vyhra: 3 };
const IKONA_KDO = { hovor: '📞', sms: '💬', chat: '💬', web: '🌐', banka: '🏦', dvere: '🚪' };
if (window.self === window.top) document.body.classList.add('samostatne');

let ulozene = { hra: null, konce: {}, nejlepsi: {} };
try { Object.assign(ulozene, JSON.parse(localStorage.getItem(P.klic)) || {}); } catch (e) {}
let st = J.nactiStav(P, ulozene.hra);
if (st && !P.scenare.some(s => s.id === st.scenar)) st = null;
let posledni = null;   // naposledy zvolená volba (zpětná vazba nad další sekcí)

function uloz() { ulozene.hra = st; try { localStorage.setItem(P.klic, JSON.stringify(ulozene)); } catch (e) {} }
const scenar = id => P.scenare.find(s => s.id === id);

function vyber() {
  st = null; posledni = null; uloz();
  const hotovo = P.scenare.filter(s => ulozene.nejlepsi[s.id] === 'vyhra').length;
  $('obsah').innerHTML = `<div class="uvod">
    <p>Nanečisto si vyzkoušejte, jak se zachovat, když volá „banka“, přijde podezřelá SMS nebo se ozve „vnuk“ v nouzi. Vyberte scénář, čtěte a rozhodujte. Na konci uvidíte, co bylo správně a proč.</p>
    <p style="color:var(--text-muted)">Všechny postavy, čísla a firmy jsou smyšlené. Postupy podvodníků ale skutečné.</p></div>
    <div class="postup">Zvládnuto dobrým koncem: <b>${hotovo} / ${P.scenare.length}</b><div class="mer"><i style="width:${Math.round(100 * hotovo / P.scenare.length)}%"></i></div></div>
    <div class="karty">${P.scenare.map(s => {
      const n = ulozene.nejlepsi[s.id];
      return `<button class="karta" data-scenar="${s.id}"><span class="ik" aria-hidden="true">${s.ikona}</span><span><b>${esc(s.nazev)}</b><span class="po">${esc(s.popis)}</span><br>
        <span class="stav ${n || ''}">${n ? ZNAK[n] + ' ' + POPIS_TYPU[n] : 'nezkoušeno'}</span></span></button>`;
    }).join('')}</div>${zasadyHtml()}`;
}

function zasadyHtml() {
  return `<div class="zasady"><h2>📌 Zlatá pravidla</h2><ul>
    <li>Neznámému číslu neříkejte <b>„ano“</b>. Ozvěte se „Prosím?“ nebo „Co potřebujete?“.</li>
    <li>Na otázku „Souhlasíte s nahráváním?“ řekněte <b>NE</b> a zavěste. Poslouchat nabídku nemusíte.</li>
    <li>Z nahraných slabik umí AI dogenerovat váš hlas – a zavolat jím vaší rodině.</li>
    <li>Banka nikdy nechce převod na <b>„bezpečný účet“</b>, PIN, číslo karty ani <b>kód z SMS</b>.</li>
    <li>Ověřujte <b>zavěšením</b> a voláním na známé číslo (z karty, z aplikace, z kontaktů).</li>
    <li>Peníze přišlé <b>„omylem“</b> sami nevracejte – řešte to se svou bankou.</li>
    <li>Proti klonovanému hlasu: <b>rodinné heslo</b>, které nikde nepíšete.</li></ul></div>`;
}

function zacni(id) {
  const s = scenar(id);
  st = J.novaHra(P); st.scenar = id; st.cesta = [];
  J.vstup(st, P, s.start);
  posledni = null; uloz(); hra(); scrollTo(0, 0);
}

function zvol(i) {
  const v = P.sceny[st.scena].volby[i];
  st.cesta.push({ z: st.scena, i });
  J.zvol(st, P, i);
  posledni = v;
  if (st.konec) {
    const typ = P.konce[st.konec].typ, sid = st.scenar;
    if (!ulozene.konce[st.konec]) ulozene.konce[st.konec] = new Date().toISOString().slice(0, 10);
    if (!ulozene.nejlepsi[sid] || PORADI[typ] > PORADI[ulozene.nejlepsi[sid]]) ulozene.nejlepsi[sid] = typ;
  }
  uloz(); hra();
  const prvni = $('obsah').querySelector('.zpetna, .konec');
  if (prvni) prvni.scrollIntoView({ block: 'nearest' });
}

function zpetnaHtml(v) {
  if (!v || !v.proc) return '';
  const h = v.hodnoceni === 'ok' ? ['ok', '✅ Dobrá volba'] : v.hodnoceni === 'chyba' ? ['chyba', '⚠️ Tohle byla chyba'] : ['', 'ℹ️ Poznámka'];
  return `<div class="zpetna ${h[0]}" role="status"><b>${h[1]}</b>${esc(v.proc)}</div>`;
}

function hra() {
  const sc = scenar(st.scenar), s = P.sceny[st.scena];
  let h = `<div class="hlava"><span aria-hidden="true">${sc.ikona}</span><b>${esc(sc.nazev)}</b><span>· krok ${st.cesta.length + (s.konec ? 0 : 1)}</span></div>`;
  if (s.konec) {
    const k = P.konce[s.konec];
    h += `<div class="konec ${k.typ}">${ZNAK[k.typ]} ${POPIS_TYPU[k.typ]}: ${esc(k.nazev)}</div>${zpetnaHtml(posledni)}<p class="situace">${esc(s.text)}</p>
      <h2 class="pod">Co je správně</h2><ul>${sc.ponauceni.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <h2 class="pod">Vaše rozhodnutí</h2><ol class="rozbor">${st.cesta.map(c => {
        const v = P.sceny[c.z].volby[c.i];
        const z = v.hodnoceni === 'ok' ? '✅' : v.hodnoceni === 'chyba' ? '⚠️' : 'ℹ️';
        return `<li><div class="vol">${z} ${esc(v.text)}</div><div class="proc">${esc(v.proc)}</div></li>`;
      }).join('')}</ol>
      <div class="akce"><button class="btn primary" data-scenar="${sc.id}">↺ Zkusit znovu</button>${dalsi(sc) ? `<button class="btn" data-scenar="${dalsi(sc).id}">▶ Další: ${esc(dalsi(sc).nazev)}</button>` : ''}<button class="btn" data-prikaz="vyber">📋 Všechny scénáře</button></div>`;
  } else {
    h += zpetnaHtml(posledni) + `<p class="situace">${esc(s.text)}</p>`;
    if (s.rec || (s.kdo && s.kdo !== 'situace')) h += `<div class="zprava ${s.kdo || ''}"><div class="od">${IKONA_KDO[s.kdo] || ''} ${esc(s.od || '')}</div>${s.rec ? `<div class="rec">${s.kdo === 'hovor' ? '„' + esc(s.rec) + '“' : esc(s.rec)}</div>` : ''}</div>`;
    h += `<div class="volby" role="group" aria-label="Co uděláte?">${s.volby.map((v, i) => `<button class="volba" data-volba="${i}"><span class="c">${i + 1}.</span><span>${esc(v.text)}</span></button>`).join('')}</div>`;
  }
  $('obsah').innerHTML = h;
}
function dalsi(sc) {   // další scénář bez dobrého konce (po řadě dokola)
  const i = P.scenare.indexOf(sc);
  for (let k = 1; k < P.scenare.length; k++) { const s = P.scenare[(i + k) % P.scenare.length]; if (ulozene.nejlepsi[s.id] !== 'vyhra') return s; }
  return null;
}

function okno(titul, html) { $('dlgTitul').textContent = titul; $('dlgTelo').innerHTML = html; $('dlg').showModal(); }
const PRIKAZY = {
  vyber,
  zasady: () => okno('📌 Zlatá pravidla', zasadyHtml().replace('<h2>📌 Zlatá pravidla</h2>', '')),
  vysledky: () => okno('🏆 Výsledky', P.scenare.map(sc => `<h3 style="font-size:1rem;margin:12px 0 4px">${sc.ikona} ${esc(sc.nazev)}</h3><ul class="vysl">${
    Object.keys(P.konce).filter(id => id.startsWith(sc.id + '_')).map(id => {
      const k = P.konce[id];
      return ulozene.konce[id] ? `<li>${ZNAK[k.typ]} <b>${esc(k.nazev)}</b> – ${esc(k.popis)}</li>` : `<li style="color:var(--text-faint)">❔ ${POPIS_TYPU[k.typ]} – zatím nenalezeno</li>`;
    }).join('')}</ul>`).join('') +
    `<div class="akce"><button class="btn" type="button" data-prikaz="smazat">🗑️ Smazat výsledky</button></div>`),
  smazat: async () => {
    $('dlg').close();
    if (!await Dialog.potvrd('Smazat všechny výsledky tréninku?')) return;
    ulozene = { hra: null, konce: {}, nejlepsi: {} }; st = null; vyber();
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.prikaz) return PRIKAZY[d.prikaz]();
  if (d.scenar) return zacni(d.scenar);
  if (d.volba != null) return zvol(+d.volba);
});
document.addEventListener('keydown', e => {
  if (!st || st.konec || $('dlg').open || e.ctrlKey || e.altKey || e.metaKey) return;
  if (/^[1-9]$/.test(e.key)) { const b = $('obsah').querySelectorAll('.volba')[+e.key - 1]; if (b) { e.preventDefault(); b.click(); } }
});

if (st) hra(); else vyber();
window.TRENINK_APP = { stav: () => st, zacni, zvol };
})();
</script>
</body>
</html>
