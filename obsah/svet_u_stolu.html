<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Svět u stolu</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<script src="svet_u_stolu/lunarni.js"></script>
<script src="svet_u_stolu/jadro.js"></script>
<script src="svet_u_stolu/evropa_stred_vychod_data.js"></script>
<script src="svet_u_stolu/evropa_zapad_sever_data.js"></script>
<script src="svet_u_stolu/asie_data.js"></script>
<script src="svet_u_stolu/amerika_afrika_blizky_data.js"></script>
<script src="svet_u_stolu/hist_starovek_data.js"></script>
<script src="svet_u_stolu/hist_stredovek_novovek_data.js"></script>
<script src="svet_u_stolu/hist_19_20_stoleti_data.js"></script>
<script src="svet_u_stolu/hist_mimoevropske_data.js"></script>
<script src="svet_u_stolu/mapa_data.js" defer></script>
<script src="svet_u_stolu/ui.js" defer></script>
<style>
body{background:var(--bg-deep);margin:0;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none !important}
*{box-sizing:border-box}

/* horní lišta se skupinami (vzor prompty.html) */
.lista{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.lista h1{font-size:1.02rem;font-weight:600;white-space:nowrap;margin:0 6px 0 0}
.skup{display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:1px 4px 3px;border-radius:9px;background:color-mix(in srgb,var(--bg-control) 45%,transparent);border:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.skup-nazev{font-size:9.5px;line-height:1.25;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);text-align:center;user-select:none}
.skup-tl{display:flex;align-items:center;gap:2px}
.skup-hledat{flex:1 1 200px;min-width:160px;background:none;border-color:transparent;padding:0}
.tl{background:var(--bg-control);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:.84rem;white-space:nowrap;font-family:inherit;line-height:1.3}
.tl:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.tl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tl.hlavni-tl{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent);font-weight:600}
input.tl{padding:3px 6px}
.vstup{background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:.86rem;font-family:inherit;width:100%}
.vstup:focus{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:900px){.lista .txt{display:none}}
@media (max-width:560px){.skup-nazev{display:none}.lista h1{font-size:.95rem}}

.nabidka{position:fixed;z-index:60;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:230px;max-height:calc(100vh - 70px);overflow-y:auto}
.nabidka .tl{display:flex;align-items:center;gap:6px;text-align:left;background:none;border-color:transparent;padding:6px 10px}
.nabidka .tl:hover{background:var(--bg-hover)}
.nabidka hr{border:0;border-top:1px solid var(--border);margin:4px 0;width:100%}
.nabidka .titulek{font-size:.72rem;color:var(--text-faint);padding:4px 10px;text-transform:uppercase;letter-spacing:.04em}
.nabidka .tl.prep::before{content:'';display:inline-block;width:1em;color:var(--accent);font-weight:700}
.nabidka .tl.prep[aria-pressed="true"]{background:none;border-color:transparent}
.nabidka .tl.prep[aria-pressed="true"]::before{content:'✓'}
.nabidka .n{margin-left:auto;color:var(--text-faint);font-size:.75rem}

main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:14px 14px 50px}
.hlavicka-dne{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.hlavicka-dne h2{margin:0;font-size:1.5rem}
.hlavicka-dne .podtitul{color:var(--text-muted)}
.stitek-dnes{background:var(--accent);color:var(--on-accent,#fff);border-radius:10px;padding:1px 9px;font-size:.75rem;font-weight:600}
.info{color:var(--text-muted);font-size:.86rem;margin:6px 0}
h3.oddil{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:18px 0 8px}

/* karty položek */
.karty{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.karta{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.karta:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
.karta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.karta .hlava{display:flex;gap:10px;align-items:flex-start}
.karta .emoji{font-size:2rem;line-height:1}
.karta h4{margin:0;font-size:1rem;line-height:1.25}
.karta .kde{font-size:.82rem;color:var(--text-muted)}
.karta .proc{font-size:.84rem;color:var(--text-muted);line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;margin:0}
.karta .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.72rem;color:var(--text-faint);align-items:center}
.chip{background:var(--bg-elevated);border:1px solid var(--border);border-radius:9px;padding:0 7px;white-space:nowrap}
.karta.kratka .proc{display:none}
/* historické tradice: okraj v barvě „pergamenu“ */
.karta.hist{border-left:4px solid var(--warn)}
.chip.doba{border-color:color-mix(in srgb,var(--warn) 60%,var(--border));background:color-mix(in srgb,var(--warn) 12%,var(--bg-elevated))}
.pramen{font-size:.86rem;color:var(--text-muted);border-left:3px solid var(--warn);padding:2px 0 2px 10px;margin:8px 0}
.epocha{margin-bottom:18px}
.epocha h3{margin:0 0 4px;font-size:1.05rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.epocha h3 .roky{font-size:.8rem;color:var(--text-faint);font-weight:400}
.osa-skupina{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);margin:22px 0 10px;border-bottom:1px solid var(--border);padding-bottom:4px}
.bunka .p.h{font-style:italic;color:var(--text-muted)}

.rozlozeni-den{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:860px){.rozlozeni-den{grid-template-columns:1fr}}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.prazdno{background:var(--bg-panel);border:1px dashed var(--border-strong);border-radius:var(--radius);padding:16px;color:var(--text-muted)}

/* mapa */
.mapa{width:100%;height:auto;display:block;background:color-mix(in srgb,var(--accent) 6%,var(--bg-panel));border-radius:6px}
.mapa path{fill:var(--bg-control);stroke:var(--bg-panel);stroke-width:.4;vector-effect:non-scaling-stroke}
.mapa path.ma{fill:color-mix(in srgb,var(--accent) calc(var(--sila,1) * 100%),var(--bg-control));cursor:pointer}
.mapa path.ma:hover,.mapa path.vybrana{fill:var(--warn);}
.mapa circle{fill:var(--accent);stroke:var(--bg-panel);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.mapa-obal{position:relative}
.bublina{position:absolute;pointer-events:none;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:.8rem;box-shadow:var(--shadow);white-space:nowrap;z-index:5}
.legenda{display:flex;gap:10px;align-items:center;font-size:.76rem;color:var(--text-faint);margin-top:6px;flex-wrap:wrap}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:3px}

/* měsíc */
.mesic-hlava{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mesic-hlava h2{margin:0;font-size:1.3rem;min-width:160px}
.mrizka{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mrizka .dt{font-size:.72rem;color:var(--text-faint);text-align:center;text-transform:uppercase;padding:2px 0}
.bunka{background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;min-height:92px;padding:4px 5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;min-width:0}
.bunka:hover{border-color:var(--accent)}
.bunka.mimo{opacity:.35}
.bunka.dnes{box-shadow:inset 0 0 0 2px var(--accent)}
.bunka .c{font-size:.8rem;font-weight:600;color:var(--text-muted)}
.bunka .p{font-size:.74rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bunka .vic{font-size:.7rem;color:var(--text-faint)}
@media (max-width:640px){.bunka{min-height:58px}.bunka .p .t{display:none}.bunka .p{font-size:.9rem}}
.obdobi-pas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.obdobi-pas .tl{white-space:normal;text-align:left}

/* rok */
.rok{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.minimesic h4{margin:0 0 4px;font-size:.9rem;cursor:pointer}
.minimesic .mrizka{gap:2px}
.minimesic button{aspect-ratio:1;border:0;border-radius:4px;font-size:.7rem;cursor:pointer;color:var(--text);background:var(--bg-panel);font-family:inherit;padding:0}
.minimesic button.h1{background:color-mix(in srgb,var(--accent) 25%,var(--bg-panel))}
.minimesic button.h2{background:color-mix(in srgb,var(--accent) 50%,var(--bg-panel))}
.minimesic button.h3{background:var(--accent);color:var(--on-accent,#fff)}
.minimesic button.dnes{outline:2px solid var(--warn);outline-offset:-2px}
.minimesic button.prazdny{visibility:hidden}

/* detail */
.zavoj{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;justify-content:flex-end}
.detail{background:var(--bg-panel);width:min(620px,100%);height:100%;overflow-y:auto;padding:16px 18px 40px;box-shadow:var(--shadow);border-left:1px solid var(--border)}
.detail .zav{float:right;margin:18px 0 6px 8px}
.detail h2{margin:0 0 4px;font-size:1.35rem;display:flex;gap:10px;align-items:center}
.detail h2 .emoji{font-size:2.2rem}
.detail .kde{color:var(--text-muted);margin-bottom:8px}
.detail p{line-height:1.55}
.recept{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:12px}
.recept h3{margin:2px 0 6px;font-size:1.05rem}
.recept ul{padding-left:20px;margin:6px 0}
.recept ol{padding-left:22px;margin:6px 0}
.recept li{margin:3px 0;line-height:1.45}
.porce{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text-muted);flex-wrap:wrap}
.porce output{min-width:2ch;text-align:center;font-weight:600;color:var(--text)}
.terminy{font-size:.86rem;color:var(--text-muted)}
.terminy button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
a{color:var(--accent)}
.vysledky-hlava{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
@media print{.lista,.zavoj{display:none}}
</style>
</head>
<body>
<header class="lista" id="lista">
  <h1>🌍 Svět u stolu</h1>
  <div class="skup" role="group" aria-label="Datum"><span class="skup-nazev" aria-hidden="true">Datum</span><div class="skup-tl">
    <button class="tl" data-prikaz="zpet" title="Předchozí (←)" aria-label="Předchozí">◀</button>
    <input class="tl" type="date" id="datum" aria-label="Datum" title="Vybrat datum">
    <button class="tl" data-prikaz="vpred" title="Další (→)" aria-label="Další">▶</button>
    <button class="tl hlavni-tl" data-prikaz="dnes" title="Skočit na dnešek (T)">Dnes</button>
  </div></div>
  <div class="skup" role="group" aria-label="Pohled"><span class="skup-nazev" aria-hidden="true">Pohled</span><div class="skup-tl">
    <button class="tl" data-pohled="den" aria-pressed="true" title="Co se jí v jednom dni (D)">📅<span class="txt"> Den</span></button>
    <button class="tl" data-pohled="mesic" aria-pressed="false" title="Měsíční kalendář (M)">🗓️<span class="txt"> Měsíc</span></button>
    <button class="tl" data-pohled="rok" aria-pressed="false" title="Celý rok (R)">📆<span class="txt"> Rok</span></button>
    <button class="tl" data-pohled="mapa" aria-pressed="false" title="Mapa světa (P)">🗺️<span class="txt"> Mapa</span></button>
    <button class="tl" data-pohled="dejiny" aria-pressed="false" title="Historické epochy (H)">📜<span class="txt"> Dějiny</span></button>
  </div></div>
  <div class="skup" role="group" aria-label="Výběr"><span class="skup-nazev" aria-hidden="true">Výběr</span><div class="skup-tl">
    <button class="tl" data-nabidka="nabKultury" aria-expanded="false" title="Které tradice zobrazit">🕯️<span class="txt"> Tradice</span> ▾</button>
    <button class="tl" data-nabidka="nabDoby" aria-expanded="false" title="Současné a historické tradice, epochy">⏳<span class="txt"> Doba</span> ▾</button>
    <button class="tl" data-nabidka="nabKontinenty" aria-expanded="false" title="Kontinenty">🌐<span class="txt"> Kontinenty</span> ▾</button>
    <button class="tl" data-nabidka="nabVice" aria-expanded="false" title="Další možnosti">☰<span class="txt"> Více</span> ▾</button>
  </div></div>
  <div class="skup skup-hledat">
    <input class="vstup" type="search" id="hledat" placeholder="Hledat jídlo, zemi, svátek… (/)" aria-label="Hledat">
  </div>
</header>

<div id="nabKultury" class="nabidka" hidden></div>
<div id="nabKontinenty" class="nabidka" hidden></div>
<div id="nabDoby" class="nabidka" hidden></div>
<div id="nabVice" class="nabidka" hidden>
  <button class="tl" data-prikaz="nahodne">🎲 Náhodná tradice</button>
  <button class="tl" data-prikaz="vse">📋 Seznam všech tradic</button>
  <hr>
  <button class="tl" data-prikaz="tisk">🖨️ Vytisknout stránku</button>
  <button class="tl" data-prikaz="napoveda">❓ Nápověda a zdroje</button>
</div>

<main id="obsah" aria-live="polite"></main>

<div class="zavoj" id="zavoj" hidden>
  <aside class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailNazev" tabindex="-1"></aside>
</div>
</body>
</html>
