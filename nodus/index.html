<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nodus | Interaktivní učení</title>
  <meta name="description" content="Nodus – 77 interaktivních výukových aplikací pro 1. a 2. stupeň ZŠ i střední školu. Čeština, matematika, přírodní vědy, zeměpis, dějepis a cizí jazyky. Zdarma, bez registrace, funguje i offline." />
  <link rel="stylesheet" href="common.css" />
  <script src="theme.js"></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232f6fce%22/><path d=%22M50 26 L74 68 L26 68 Z%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%227%22 stroke-linejoin=%22round%22/><circle cx=%2250%22 cy=%2226%22 r=%2210%22 fill=%22%23fff%22/><circle cx=%2274%22 cy=%2268%22 r=%2210%22 fill=%22%23fff%22/><circle cx=%2226%22 cy=%2268%22 r=%2210%22 fill=%22%23fff%22/></svg>" />
  <meta name="theme-color" content="#2d2d2d" />
  <style>
    body {
      height: 100vh;
      overflow: hidden;
    }

    /* Značka v hlavičce */
    .znacka-symbol {
      color: var(--accent);
      font-size: 1.05em;
    }

    /* Odkaz na hlavní web – při samostatném nasazení stačí smazat (viz README) */
    .odkaz-zpet {
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .odkaz-zpet:hover {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    @media (max-width: 768px) {
      .odkaz-zpet .jen-desktop-inline { display: none; }
    }

    /* Layout */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Hlavička */
    .hlavicka {
      background-color: var(--bg-elevated);
      color: var(--text);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hlavicka-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .hlavicka h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Hamburger – jen na malých obrazovkách */
    .hamburger {
      display: none;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .hamburger:hover {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Tmavé pozadí pod vysunutým menu */
    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* Hlavní obsah */
    .obsah {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Menu */
    .menu {
      width: 240px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--bg-panel);
    }

    /* Lepkavá horní lišta menu: hledání + filtrovací pilulky */
    .menu-top {
      position: sticky;
      top: 0;
      z-index: 5;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .menu-search-wrap {
      padding: 10px 10px 6px 10px;
    }

    .menu-search {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .menu-search:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    /* Sbalovací hlavička nad pilulkami kategorií */
    .skupiny-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .skupiny-toggle:hover {
      color: var(--text);
    }

    .skupiny-toggle .sipka {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .skupiny-toggle[aria-expanded="true"] .sipka {
      transform: rotate(180deg);
    }

    /* Panel filtrů (předmět + ročník + připravované) */
    .filtry {
      display: none;
      padding: 2px 10px 10px 10px;
    }

    .filtry.show {
      display: block;
    }

    .filtr-nadpis {
      color: var(--text-faint);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 8px 0 5px 2px;
    }

    .skupiny {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Ročníky: úzké pilulky v mřížce, ať se vejdou na jeden až dva řádky */
    .rocniky {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .rocnik-pill {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 5px 0;
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .rocnik-pill:hover:not(:disabled) {
      background-color: var(--bg-hover);
      color: var(--text);
    }

    .rocnik-pill.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .rocnik-pill:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* Přepínač zobrazení připravovaných stránek */
    .prepinac {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      user-select: none;
    }

    .prepinac input { cursor: pointer; }
    .prepinac[hidden] { display: none; }

    .skupina-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .skupina-pill:hover {
      background-color: var(--bg-hover);
      color: var(--text);
    }

    .skupina-pill.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .skupina-pill .pill-pocet {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-faint);
      background-color: var(--bg-input);
      border-radius: 9px;
      padding: 0 6px;
      line-height: 1.4;
    }

    .skupina-pill:hover .pill-pocet,
    .skupina-pill.active .pill-pocet {
      color: #fff;
      background-color: rgba(0, 0, 0, 0.25);
    }

    /* Hláška, když hledání nic nenajde */
    .bez-vysledku {
      display: none;
      padding: 18px 16px;
      color: var(--text-faint);
      font-size: 0.85rem;
      text-align: center;
    }
    .bez-vysledku.zobraz { display: block; }

    .sekce {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .sekce:last-child {
      border-bottom: none;
    }

    .sekce h2 {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 10px 15px 8px 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      padding: 4px 6px;
      transition: background-color 0.15s ease;
    }

    .sekce h2:hover {
      background-color: var(--bg-elevated);
      color: var(--accent-hover);
    }

    .sekce h2 .pocet {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-faint);
      background-color: var(--bg-hover);
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 600;
    }

    .sekce h2 .sipka {
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .sekce.collapsed h2 .sipka {
      transform: rotate(-90deg);
    }

    .sekce.collapsed ul {
      display: none;
    }

    .sekce ul {
      list-style: none;
    }

    /* Sekce s jedinou aplikací: hlavička by jen zdvojovala název položky,
       proto se zobrazí rovnou odkaz a sekce se nedá sbalit. */
    .sekce.jedina {
      padding: 4px 0;
    }

    .sekce.jedina h2 {
      display: none;
    }

    .sekce.jedina ul {
      display: block;
    }

    .sekce li {
      position: relative;
    }

    .sekce a {
      display: block;
      padding: 8px 32px 8px 25px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sekce a:hover,
    .sekce a.kb-focus {
      background-color: var(--bg-hover);
      color: var(--text);
      padding-left: 30px;
    }

    /* Připravovaná stránka – v menu vizuálně odlišená */
    .sekce a.plan {
      color: var(--text-faint);
    }

    .sekce a.plan .znak-plan {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-left: 5px;
    }

    .sekce a.active {
      background-color: var(--bg-control);
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    /* Hvězdička oblíbených */
    .hvezda {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-faint);
      opacity: 0;
      padding: 2px 4px;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .sekce li:hover .hvezda { opacity: 0.7; }
    .hvezda:hover { opacity: 1 !important; color: var(--warn); }
    .hvezda.je-oblibena { opacity: 0.9; color: var(--warn); }

    /* Ovládání v hlavičce */
    .ovladani {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ovladani button {
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .ovladani button:hover {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* zvýraznění při hledání */
    .sekce a.zvyrazneno {
      background-color: var(--accent-soft);
      color: var(--text);
    }

    .sekce.skryto { display: none; }
    .sekce li.skryto { display: none; }

    @media (max-width: 768px) {
      .ovladani .jen-desktop { display: none; }
    }

    /* Pracovní plocha */
    .pracovni-plocha {
      flex: 1;
      background-color: var(--bg-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pracovni-plocha iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Responzivita – telefon a tablet: menu skryté v hamburgeru */
    @media (max-width: 1024px) {
      .hamburger { display: inline-flex; }

      .menu {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 80%;
        max-width: 300px;
        z-index: 1000;
        border-right: 1px solid var(--border);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 2px 0 14px rgba(0, 0, 0, 0.55);
      }
      .menu.open { transform: translateX(0); }

      .menu-overlay { display: block; }
      .menu-overlay.show { opacity: 1; pointer-events: auto; }

      .pracovni-plocha { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hlavicka">
      <div class="hlavicka-left">
        <button id="hamburger" class="hamburger" aria-label="Otevřít menu" aria-expanded="false" aria-controls="hlavniMenu">☰</button>
        <h1><span class="znacka-symbol" aria-hidden="true">◈</span> Nodus</h1>
      </div>
      <div class="ovladani">
        <a class="odkaz-zpet" href="../index.html" title="Přejít na hlavní web s ostatními aplikacemi">↩ <span class="jen-desktop-inline">Ostatní aplikace</span></a>
        <button id="btnDomu" title="Úvodní přehled">🏠</button>
        <button id="btnOsnova" title="Osnova – pokrytí učiva podle ročníků">🗺️</button>
        <button id="btnTema" title="Přepnout světlý / tmavý režim">🌙</button>
        <button id="btnNoveOkno" title="Otevřít aktuální aplikaci v novém okně">🗗</button>
        <button id="rozbalitVse" class="jen-desktop" title="Rozbalit vše">⊞ Rozbalit</button>
        <button id="sbalitVse" class="jen-desktop" title="Sbalit vše">⊟ Sbalit</button>
      </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="obsah">
      <nav class="menu" id="hlavniMenu">
        <div class="menu-top">
          <div class="menu-search-wrap">
            <input type="search" id="hledatMenu" class="menu-search" placeholder="🔍 Hledat učivo… (Ctrl+K)" autocomplete="off" />
          </div>
          <button class="skupiny-toggle" id="skupinyToggle" aria-expanded="false" aria-controls="filtry">
            <span id="skupinyToggleLabel">📚 Vše</span>
            <span class="sipka">▾</span>
          </button>
          <div class="filtry" id="filtry">
            <div class="filtr-nadpis">📚 Předmět</div>
            <div class="skupiny" id="skupiny"></div>
            <div class="filtr-nadpis">📅 Ročník</div>
            <div class="rocniky" id="rocniky"></div>
            <label class="prepinac" id="prepinacPlanObal">
              <input type="checkbox" id="prepinacPlan" checked>
              Zobrazit připravované 🚧
            </label>
          </div>
        </div>
        <div id="menuSekce"></div>
        <div class="bez-vysledku" id="bezVysledku">Žádné učivo neodpovídá zvolenému filtru.</div>
      </nav>

      <main class="pracovni-plocha">
        <iframe name="okno" src="obsah/prehled.html" title="Aktivní aplikace"></iframe>
      </main>
    </div>
  </div>

  <script src="apps.js"></script>
  <script>
    /* ============================================================
       Nodus: menu se generuje z katalogu v apps.js.
       Stav: hash v URL (deep-link), localStorage (téma, oblíbené,
       nedávné, sbalené sekce, skupina), sessionStorage (poslední
       otevřená stránka).
       ============================================================ */
    /* Zápis do úložiště: přes file:// (a v přísném režimu soukromí) je kvóta
       nulová a setItem vyhodí výjimku — nesmí shodit zbytek skriptu, web pak
       funguje dál, jen si nic nezapamatuje. */
    function uloz(uloziste, klic, hodnota) {
      try { uloziste.setItem(klic, hodnota); }
      catch { /* bez trvalé paměti */ }
    }

    function precti(uloziste, klic) {
      try { return uloziste.getItem(klic); }
      catch { return null; }
    }

    if (location.protocol === 'file:') {
      console.warn('Web je otevřený přes file:// — nastavení se neuloží a část '
        + 'aplikací nenačte data. Spusť ./test_local.sh a otevři http://localhost:8000/');
    }

    const DOMOVSKA = 'obsah/prehled.html';
    // stránky, které nejsou aplikacemi v katalogu, ale smí se otevřít v ploše
    // (na vyslovnost.html pořád přesměrovává staré odkazy hlavní web)
    const STRANKY_MIMO_KATALOG = [DOMOVSKA, 'obsah/osnova.html', 'obsah/vyslovnost.html'];
    const KEY_PAGE = 'nodus_current_page';
    const KEY_COLLAPSE = 'nodus_collapsed_sections';
    const KEY_SKUPINA = 'nodus_skupina';
    const KEY_OBLIBENE = 'nodus_oblibene';
    const KEY_NEDAVNE = 'nodus_nedavne';
    const KEY_SKUPINY_OPEN = 'nodus_skupiny_open';
    const KEY_ROCNIK = 'nodus_rocnik';
    const KEY_PLAN = 'nodus_zobraz_plan';
    const KEY_TEMA = 'webapp_theme';

    const iframe = document.querySelector('iframe[name="okno"]');
    const menuEl = document.getElementById('hlavniMenu');
    const menuSekceEl = document.getElementById('menuSekce');
    const skupinyEl = document.getElementById('skupiny');
    const rocnikyEl = document.getElementById('rocniky');
    const filtryEl = document.getElementById('filtry');
    const prepinacPlan = document.getElementById('prepinacPlan');
    const skupinyToggle = document.getElementById('skupinyToggle');
    const skupinyToggleLabel = document.getElementById('skupinyToggleLabel');
    const bezVysledku = document.getElementById('bezVysledku');

    // Pilulky kategorií jsou defaultně sbalené — zabíraly moc místa nahoře v menu.
    function setSkupinyOpen(open) {
      filtryEl.classList.toggle('show', open);
      skupinyToggle.setAttribute('aria-expanded', String(open));
      uloz(localStorage, KEY_SKUPINY_OPEN, open ? '1' : '0');
    }
    setSkupinyOpen(precti(localStorage, KEY_SKUPINY_OPEN) !== '0');
    skupinyToggle.addEventListener('click', () => {
      setSkupinyOpen(!skupinyEl.classList.contains('show'));
    });

    const nactiJson = (key, def) => {
      try { return JSON.parse(precti(localStorage, key)) ?? def; }
      catch { return def; }
    };

    // Při první návštěvě (žádné uložené preference) start se všemi sekcemi
    // sbalenými — jinak by uvítal dlouhý sloupec stovek rozbalených položek.
    let collapsedSet = precti(localStorage, KEY_COLLAPSE) === null
      ? new Set(KATALOG_SEKCE.map(s => s.nazev))
      : new Set(nactiJson(KEY_COLLAPSE, []));
    let aktivniSkupina = precti(localStorage, KEY_SKUPINA) || 'vse';
    let aktivniRocnik = precti(localStorage, KEY_ROCNIK) || 'vse';
    // připravované stránky (🚧) jsou ve výchozím stavu vidět – jsou to úkoly osnovy
    let zobrazPlan = precti(localStorage, KEY_PLAN) !== '0';
    let oblibene = nactiJson(KEY_OBLIBENE, []);
    let nedavne = nactiJson(KEY_NEDAVNE, []);

    // index katalogu: soubor -> {nazev, tagy, predmet, rocniky, stav}
    const podleSouboru = new Map();
    const VSECHNY = [];
    KATALOG_SEKCE.forEach(s => s.polozky.forEach(p => {
      podleSouboru.set(p.soubor, p);
      VSECHNY.push({ ...p, skupina: s.skupina });
    }));

    // hledání bez diakritiky
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    /* ---- Stavba menu z katalogu ---- */
    function vytvorPolozku(p) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + p.soubor;               // klik = změna hashe -> hashchange otevře aplikaci
      a.dataset.page = p.soubor;
      a.textContent = p.nazev;
      a.dataset.hledani = norm(p.nazev + ' ' + (p.tagy || []).join(' '));
      a.dataset.rocniky = (p.rocniky || []).join(',');
      if (p.stav === 'plan') {
        a.classList.add('plan');
        a.dataset.plan = '1';
        a.title = 'Připravujeme – stránka zatím jen popisuje, co má aplikace umět';
        const znak = document.createElement('span');
        znak.className = 'znak-plan';
        znak.textContent = '🚧';
        a.appendChild(znak);
      }
      const st = document.createElement('button');
      st.className = 'hvezda';
      st.title = 'Přidat / odebrat z oblíbených';
      st.textContent = '★';
      st.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        toggleOblibena(p.soubor);
      });
      li.appendChild(a);
      li.appendChild(st);
      return li;
    }

    function vytvorSekci(nazev, skupina, polozky, special) {
      const div = document.createElement('div');
      div.className = 'sekce';
      div.dataset.nazev = nazev;
      div.dataset.skupina = skupina;
      if (special) div.dataset.special = '1';
      const h2 = document.createElement('h2');
      const span = document.createElement('span');
      span.textContent = nazev;
      const badge = document.createElement('span');
      badge.className = 'pocet';
      badge.textContent = polozky.length;
      const sipka = document.createElement('span');
      sipka.className = 'sipka';
      sipka.textContent = '▾';
      h2.append(span, badge, sipka);
      const ul = document.createElement('ul');
      polozky.forEach(p => ul.appendChild(vytvorPolozku(p)));
      div.append(h2, ul);
      if (polozky.length === 1 && !special) div.classList.add('jedina');
      else if (collapsedSet.has(nazev)) div.classList.add('collapsed');
      h2.addEventListener('click', () => {
        setCollapsed(div, !div.classList.contains('collapsed'));
        saveCollapsed();
      });
      return div;
    }

    function renderMenu() {
      menuSekceEl.innerHTML = '';
      // speciální sekce nahoře
      const obl = oblibene.map(f => podleSouboru.get(f)).filter(Boolean);
      if (obl.length) menuSekceEl.appendChild(vytvorSekci('⭐ Oblíbené', 'vse', obl, true));
      const ned = nedavne.map(f => podleSouboru.get(f)).filter(Boolean);
      if (ned.length) menuSekceEl.appendChild(vytvorSekci('🕘 Nedávné', 'vse', ned, true));
      // katalogové sekce
      KATALOG_SEKCE.forEach(s => menuSekceEl.appendChild(vytvorSekci(s.nazev, s.skupina, s.polozky, false)));
      obnovHvezdy();
      updateActiveLink(aktualni);
      aplikujFiltr();
    }

    /* ---- Sbalování sekcí ---- */
    function saveCollapsed() {
      uloz(localStorage, KEY_COLLAPSE, JSON.stringify([...collapsedSet]));
    }
    function setCollapsed(s, collapsed) {
      if (s.classList.contains('jedina')) return;   // jednopoložkovou sekci není co sbalovat
      s.classList.toggle('collapsed', collapsed);
      if (collapsed) collapsedSet.add(s.dataset.nazev);
      else collapsedSet.delete(s.dataset.nazev);
    }
    const vsechnySekce = () => [...menuSekceEl.querySelectorAll('.sekce')];

    document.getElementById('rozbalitVse').addEventListener('click', () => {
      vsechnySekce().forEach(s => setCollapsed(s, false));
      saveCollapsed();
    });
    document.getElementById('sbalitVse').addEventListener('click', () => {
      vsechnySekce().forEach(s => setCollapsed(s, true));
      saveCollapsed();
    });

    /* ---- Oblíbené & nedávné ---- */
    function toggleOblibena(soubor) {
      const i = oblibene.indexOf(soubor);
      if (i >= 0) oblibene.splice(i, 1);
      else oblibene.push(soubor);
      uloz(localStorage, KEY_OBLIBENE, JSON.stringify(oblibene));
      renderMenu();
    }
    function obnovHvezdy() {
      menuSekceEl.querySelectorAll('li').forEach(li => {
        const a = li.querySelector('a[data-page]');
        const st = li.querySelector('.hvezda');
        if (a && st) st.classList.toggle('je-oblibena', oblibene.includes(a.dataset.page));
      });
    }
    function pridejNedavnou(soubor) {
      if (soubor === DOMOVSKA) return;
      nedavne = [soubor, ...nedavne.filter(f => f !== soubor)].slice(0, 8);
      uloz(localStorage, KEY_NEDAVNE, JSON.stringify(nedavne));
    }

    /* ---- Otevírání aplikací (hash = deep-link) ---- */
    let aktualni = null;

    function updateActiveLink(page) {
      menuSekceEl.querySelectorAll('a[data-page]').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
    }

    function otevri(page) {
      if (!page || page === aktualni) return;
      if (!podleSouboru.has(page) && !STRANKY_MIMO_KATALOG.includes(page)) {
        // neznámý hash – nechodit mimo katalog
        page = DOMOVSKA;
      }
      aktualni = page;
      iframe.src = page;
      uloz(sessionStorage, KEY_PAGE, page);
      pridejNedavnou(page);
      updateActiveLink(page);
      // sekci s aktivní aplikací rozbalit
      const a = menuSekceEl.querySelector(`a[data-page="${CSS.escape(page)}"]`);
      if (a) {
        const s = a.closest('.sekce');
        if (s && !s.dataset.special) { setCollapsed(s, false); saveCollapsed(); }
      }
      if (window.matchMedia('(max-width: 1024px)').matches) closeMenu();
      // nedávné se překreslí bez ztráty pozice scrollu menu
      obnovNedavneSekci();
    }

    function obnovNedavneSekci() {
      const stara = menuSekceEl.querySelector('.sekce[data-nazev="🕘 Nedávné"]');
      const ned = nedavne.map(f => podleSouboru.get(f)).filter(Boolean);
      if (!ned.length) { if (stara) stara.remove(); return; }
      const nova = vytvorSekci('🕘 Nedávné', 'vse', ned, true);
      if (stara) stara.replaceWith(nova);
      else {
        const obl = menuSekceEl.querySelector('.sekce[data-nazev="⭐ Oblíbené"]');
        menuSekceEl.insertBefore(nova, obl ? obl.nextSibling : menuSekceEl.firstChild);
      }
      obnovHvezdy();
      updateActiveLink(aktualni);
      aplikujFiltr();
    }

    // hash je buď cesta ke stránce, nebo výběr předmětu (#skupina=matematika)
    function zpracujHash(hash) {
      if (hash.startsWith('skupina=')) {
        vyberSkupinu(hash.slice(8));
        otevri(DOMOVSKA);
        return;
      }
      if (hash.startsWith('rocnik=')) {
        vyberRocnik(hash.slice(7));
        otevri(DOMOVSKA);
        return;
      }
      otevri(hash || DOMOVSKA);
    }

    window.addEventListener('hashchange', () => {
      zpracujHash(decodeURIComponent(location.hash.slice(1)));
    });

    // úvodní přehled (v iframe) může požádat o otevření aplikace nebo o předmět
    window.addEventListener('message', e => {
      if (!e.data) return;
      if (typeof e.data.otevri === 'string') {
        location.hash = e.data.otevri;
        otevri(e.data.otevri);
      } else if (typeof e.data.skupina === 'string') {
        vyberSkupinu(e.data.skupina);
      } else if (typeof e.data.rocnik === 'string') {
        vyberRocnik(e.data.rocnik);
      }
    });

    document.getElementById('btnDomu').addEventListener('click', () => {
      history.pushState(null, '', location.pathname);
      otevri(DOMOVSKA);
    });
    document.getElementById('btnOsnova').addEventListener('click', () => {
      location.hash = 'obsah/osnova.html';
    });
    document.getElementById('btnNoveOkno').addEventListener('click', () => {
      window.open(aktualni || DOMOVSKA, '_blank');
    });

    /* ---- Přepínání tématu ---- */
    // theme.js už téma použil při načtení; tady se jen přepíná a rozesílá.
    const btnTema = document.getElementById('btnTema');
    const themeColor = document.querySelector('meta[name="theme-color"]');

    function zobrazTema() {
      const light = document.documentElement.dataset.theme === 'light';
      btnTema.textContent = light ? '☀️' : '🌙';
      btnTema.title = light ? 'Přepnout na tmavý režim' : 'Přepnout na světlý režim';
      if (themeColor) themeColor.content = light ? '#ffffff' : '#2d2d2d';
    }
    zobrazTema();

    btnTema.addEventListener('click', () => {
      const light = document.documentElement.dataset.theme !== 'light';
      if (light) document.documentElement.dataset.theme = 'light';
      else delete document.documentElement.dataset.theme;
      uloz(localStorage, KEY_TEMA, light ? 'light' : 'dark');
      // storage událost se ve stejné záložce nespouští -> iframu to řekneme přímo
      iframe.contentWindow?.postMessage({ tema: light ? 'light' : 'dark' }, '*');
      zobrazTema();
    });

    /* ---- Pilulky předmětů a ročníků ---- */
    const pills = [];
    const rocnikPills = [];

    // Počet v pilulce vždy ukazuje, kolik položek zbude po započtení
    // ostatních os filtru – aby nesliboval víc, než kolik se po kliknutí zobrazí.
    function skupinaPocet(id) {
      return VSECHNY.filter(p => (id === 'vse' || p.skupina === id) && projdePolozka(p)).length;
    }
    function rocnikPocet(r) {
      return VSECHNY.filter(p => {
        if (!zobrazPlan && p.stav === 'plan') return false;
        if (aktivniSkupina !== 'vse' && p.skupina !== aktivniSkupina) return false;
        return r === 'vse' || (p.rocniky || []).map(String).includes(r);
      }).length;
    }
    function prepoctiPocty() {
      pills.forEach(b => {
        const n = skupinaPocet(b.dataset.skupina);
        b.querySelector('.pill-pocet').textContent = n;
        b.disabled = false;
      });
      rocnikPills.forEach(b => {
        const n = rocnikPocet(b.dataset.rocnik);
        b.textContent = b.dataset.popisek + (n ? '' : '');
        b.disabled = n === 0 && b.dataset.rocnik !== 'vse';
        b.title = n + ' položek';
      });
    }
    function updatePillState() {
      pills.forEach(p => p.classList.toggle('active', p.dataset.skupina === aktivniSkupina));
      rocnikPills.forEach(p => p.classList.toggle('active', p.dataset.rocnik === aktivniRocnik));
      const aktivni = pills.find(p => p.dataset.skupina === aktivniSkupina);
      const predmet = aktivni ? aktivni.querySelector('span').textContent : 'Vše';
      const rocnik = aktivniRocnik === 'vse' ? '' : ' · 📅 ' + aktivniRocnik + '. ročník';
      // popisek pilulky už vlastní emoji obsahuje, další prefix by se zdvojil
      skupinyToggleLabel.textContent = predmet + rocnik;
    }
    function vyberRocnik(r) {
      if (!rocnikPills.some(p => p.dataset.rocnik === r)) return;
      aktivniRocnik = r;
      uloz(localStorage, KEY_ROCNIK, r);
      nastavDotaz('');
      updatePillState();
      aplikujFiltr();
    }

    function vyberSkupinu(id) {
      if (!pills.some(p => p.dataset.skupina === id)) return;
      aktivniSkupina = id;
      uloz(localStorage, KEY_SKUPINA, id);
      nastavDotaz('');
      updatePillState();
      aplikujFiltr();
      setSkupinyOpen(true);
      if (window.matchMedia('(max-width: 1024px)').matches) openMenu();
      menuEl.scrollTop = 0;
    }

    function makePill(id, label) {
      const b = document.createElement('button');
      b.className = 'skupina-pill';
      b.dataset.skupina = id;
      b.innerHTML = `<span>${label}</span><span class="pill-pocet">${skupinaPocet(id)}</span>`;
      b.addEventListener('click', () => vyberSkupinu(id));
      skupinyEl.appendChild(b);
      pills.push(b);
    }
    makePill('vse', '📚 Vše');
    KATALOG_SKUPINY.forEach(g => {
      if (KATALOG_SEKCE.some(s => s.skupina === g.id)) makePill(g.id, g.label);
    });
    if (!pills.some(p => p.dataset.skupina === aktivniSkupina)) aktivniSkupina = 'vse';

    function makeRocnikPill(r, popisek) {
      const b = document.createElement('button');
      b.className = 'rocnik-pill';
      b.dataset.rocnik = r;
      b.dataset.popisek = popisek;
      b.textContent = popisek;
      b.addEventListener('click', () => vyberRocnik(r));
      rocnikyEl.appendChild(b);
      rocnikPills.push(b);
    }
    makeRocnikPill('vse', 'Vše');
    for (let r = 1; r <= 9; r++) makeRocnikPill(String(r), r + '.');
    if (!rocnikPills.some(p => p.dataset.rocnik === aktivniRocnik)) aktivniRocnik = 'vse';

    // Přepínač má smysl jen tehdy, když katalog nějaké připravované téma
    // opravdu obsahuje. Když je všechno hotové, jen by mátl.
    const maPlan = VSECHNY.some(p => p.stav === 'plan');
    if (!maPlan) {
      prepinacPlanObal.hidden = true;
      zobrazPlan = true;
    }

    prepinacPlan.checked = zobrazPlan;
    prepinacPlan.addEventListener('change', () => {
      zobrazPlan = prepinacPlan.checked;
      uloz(localStorage, KEY_PLAN, zobrazPlan ? '1' : '0');
      aplikujFiltr();
    });

    updatePillState();

    /* ---- Hledání (hlavička + menu) + filtr skupin ---- */
    const hledatMenu = document.getElementById('hledatMenu');
    const searchInputs = [hledatMenu];

    function nastavDotaz(val) {
      searchInputs.forEach(i => { i.value = val; });
    }
    function aktualniDotaz() {
      const i = searchInputs.find(x => x.value.trim());
      return i ? norm(i.value.trim()) : '';
    }

    /* Filtr má tři nezávislé osy: předmět (sekce), ročník a zobrazení
       připravovaných stránek. Hledání je čtvrtá – platí přes všechny sekce. */
    function projdeRocnikem(rocniky) {
      if (aktivniRocnik === 'vse') return true;
      return rocniky.includes(aktivniRocnik);
    }

    function projdePolozka(p) {
      if (!zobrazPlan && p.stav === 'plan') return false;
      return projdeRocnikem((p.rocniky || []).map(String));
    }

    function projdeOdkaz(a) {
      if (!zobrazPlan && a.dataset.plan === '1') return false;
      return projdeRocnikem(a.dataset.rocniky ? a.dataset.rocniky.split(',') : []);
    }

    function aplikujFiltr() {
      const q = aktualniDotaz();
      zrusKbFokus();
      let celkemShod = 0;
      vsechnySekce().forEach(s => {
        // oblíbené/nedávné se při hledání schovají (jinak by se položky zdvojily)
        if (q && s.dataset.special) { s.classList.add('skryto'); return; }
        const patri = s.dataset.special || aktivniSkupina === 'vse'
          || s.dataset.skupina === aktivniSkupina;
        let shoda = 0;
        s.querySelectorAll('li').forEach(li => {
          const a = li.querySelector('a[data-page]');
          const ok = projdeOdkaz(a) && (!q || a.dataset.hledani.includes(q));
          li.classList.toggle('skryto', !ok);
          a.classList.toggle('zvyrazneno', !!q && ok);
          if (ok) shoda++;
        });
        s.classList.toggle('skryto', !patri || shoda === 0);
        if (patri && shoda > 0) {
          if (q) s.classList.remove('collapsed');
          else s.classList.toggle('collapsed',
            !s.classList.contains('jedina') && collapsedSet.has(s.dataset.nazev));
          if (!s.dataset.special) celkemShod += shoda;
        }
      });
      bezVysledku.classList.toggle('zobraz', celkemShod === 0);
      prepoctiPocty();
    }

    searchInputs.forEach(input => {
      input.addEventListener('input', () => {
        nastavDotaz(input.value);
        aplikujFiltr();
      });
    });

    /* ---- Klávesové ovládání ---- */
    let kbIndex = -1;
    function viditelneOdkazy() {
      return vsechnySekce()
        .filter(s => !s.classList.contains('skryto') && !s.classList.contains('collapsed'))
        .flatMap(s => [...s.querySelectorAll('li:not(.skryto) a[data-page]')]);
    }
    function zrusKbFokus() {
      kbIndex = -1;
      menuSekceEl.querySelectorAll('a.kb-focus').forEach(a => a.classList.remove('kb-focus'));
    }
    function posunKbFokus(smer) {
      const odkazy = viditelneOdkazy();
      if (!odkazy.length) return;
      kbIndex = (kbIndex + smer + odkazy.length) % odkazy.length;
      menuSekceEl.querySelectorAll('a.kb-focus').forEach(a => a.classList.remove('kb-focus'));
      const cil = odkazy[kbIndex];
      cil.classList.add('kb-focus');
      cil.scrollIntoView({ block: 'nearest' });
    }

    document.addEventListener('keydown', e => {
      const vInputu = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        (window.matchMedia('(max-width: 1024px)').matches ? openMenu : () => {})();
        hledatMenu.focus();
        hledatMenu.select();
        return;
      }
      if (e.key === '/' && !vInputu) {
        e.preventDefault();
        hledatMenu.focus();
        hledatMenu.select();
        return;
      }
      if (e.key === 'Escape') {
        if (aktualniDotaz()) { nastavDotaz(''); aplikujFiltr(); }
        closeMenu();
        return;
      }
      if (vInputu && searchInputs.includes(document.activeElement)) {
        if (e.key === 'ArrowDown') { e.preventDefault(); posunKbFokus(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); posunKbFokus(-1); }
        else if (e.key === 'Enter') {
          const foc = menuSekceEl.querySelector('a.kb-focus') || viditelneOdkazy()[0];
          if (foc) { location.hash = foc.dataset.page; nastavDotaz(''); aplikujFiltr(); }
        }
      }
    });

    /* ---- Hamburger: vysouvací menu na telefonu a tabletu ---- */
    const hamburger = document.getElementById('hamburger');
    const menuOverlay = document.getElementById('menuOverlay');

    function openMenu() {
      menuEl.classList.add('open');
      menuOverlay.classList.add('show');
      hamburger.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
      menuEl.classList.remove('open');
      menuOverlay.classList.remove('show');
      hamburger.setAttribute('aria-expanded', 'false');
    }
    hamburger.addEventListener('click', () =>
      menuEl.classList.contains('open') ? closeMenu() : openMenu());
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('resize', () => {
      if (!window.matchMedia('(max-width: 1024px)').matches) closeMenu();
    });

    /* ---- Start ---- */
    renderMenu();
    const zHashe = decodeURIComponent(location.hash.slice(1));
    if (zHashe) zpracujHash(zHashe);
    else otevri(precti(sessionStorage, KEY_PAGE) || DOMOVSKA);

    /* ---- PWA ---- */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
