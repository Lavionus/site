<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bod, přímka, úsečka</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .kresba { width: min(560px, 92%); background: var(--bg-deep); border-radius: 10px; }
    .kresba .cara { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
    .kresba .bod { fill: var(--accent); }
    .kresba .popisek { fill: var(--text-muted); font-size: 13px; font-weight: 700; }
    .kresba .pravitko { fill: var(--bg-elevated); stroke: var(--border-strong); stroke-width: 1.5; }
    .kresba .ryska { stroke: var(--text-faint); stroke-width: 1.5; }
    .kresba .cislo { fill: var(--text-faint); font-size: 11px; }
    .kresba .volny-bod { fill: var(--bg-control); stroke: var(--border-strong); stroke-width: 2; cursor: pointer; }
    .kresba .volny-bod:hover { fill: var(--accent-hover); }
    .kresba .volny-bod.vybrany { fill: var(--accent); stroke: var(--accent); }
    .kresba .volny-bod.spravne { fill: var(--ok); stroke: var(--ok); }
  </style>
</head>
<body>
  <h1>📏 Bod, přímka, úsečka</h1>
  <p class="podtitul">Pro 2.–3. ročník: poznávání útvarů, měření úseček a rýsování podle zadání.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="poznej" class="active">🔍 Co je to?</button>
    <button data-rezim="zmer">📐 Změř úsečku</button>
    <button data-rezim="narysuj">✏️ Narýsuj úsečku</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Bod</b> je jediné místo, značí se velkým písmenem. <b>Přímka</b> nemá konec ani začátek –
    šipky na obou stranách. <b>Polopřímka</b> má počátek a pokračuje donekonečna.
    <b>Úsečka</b> má dva krajní body a dá se změřit.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_m2_geo', $('skore'));
let rezim = 'poznej';

const TYPY = [
  { id: 'bod', nazev: 'bod', ikona: '•' },
  { id: 'primka', nazev: 'přímka', ikona: '↔' },
  { id: 'poloprimka', nazev: 'polopřímka', ikona: '→' },
  { id: 'usecka', nazev: 'úsečka', ikona: '—' },
];

function kresliUtvar(typ) {
  const sipka = '<defs><marker id="sip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">'
    + '<path d="M0 0 L9 4.5 L0 9 z" fill="var(--accent)"/></marker></defs>';
  const zaklad = `<svg class="kresba" viewBox="0 0 400 120">${sipka}`;
  if (typ === 'bod') {
    return zaklad + `<circle class="bod" cx="200" cy="60" r="7"/>
      <text class="popisek" x="212" y="52">A</text></svg>`;
  }
  if (typ === 'primka') {
    return zaklad + `<line class="cara" x1="40" y1="60" x2="360" y2="60"
      marker-start="url(#sip)" marker-end="url(#sip)"/>
      <text class="popisek" x="196" y="46">p</text></svg>`;
  }
  if (typ === 'poloprimka') {
    return zaklad + `<line class="cara" x1="90" y1="60" x2="360" y2="60" marker-end="url(#sip)"/>
      <circle class="bod" cx="90" cy="60" r="6"/>
      <text class="popisek" x="80" y="46">A</text></svg>`;
  }
  return zaklad + `<line class="cara" x1="110" y1="60" x2="300" y2="60"/>
    <circle class="bod" cx="110" cy="60" r="6"/><circle class="bod" cx="300" cy="60" r="6"/>
    <text class="popisek" x="102" y="46">A</text><text class="popisek" x="294" y="46">B</text></svg>`;
}

/* ---- Co je to? ------------------------------------------------------------ */
function poznej() {
  const p = $('plocha');
  const typ = Uloha.nahodne(TYPY);
  p.innerHTML = `<div class="zadani">Jaký geometrický útvar je na obrázku?</div>${kresliUtvar(typ.id)}`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  const vysvetleni = {
    bod: 'Bod je jedno místo, značí se velkým písmenem.',
    primka: 'Přímka je nekonečná na obě strany – proto šipky.',
    'poloprimka': 'Polopřímka má počátek a druhým směrem pokračuje donekonečna.',
    usecka: 'Úsečka má dva krajní body, dá se změřit.',
  };
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(TYPY).map(t => ({ klic: t.id, ikona: t.ikona, popis: t.nazev })),
    spravnyKlic: typ.id,
    zpravaOk: '✅ ' + vysvetleni[typ.id],
    zpravaChyba: 'Ještě ne – všimni si, jestli má útvar krajní body nebo šipky.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Změř úsečku ---------------------------------------------------------- */
function zmer() {
  const p = $('plocha');
  const delka = Uloha.nahodneCislo(2, 9);
  const start = Uloha.nahodneCislo(0, 10 - delka);
  const KROK = 34, OKRAJ = 30;

  let rysky = '', cisla = '';
  for (let i = 0; i <= 10; i++) {
    const x = OKRAJ + i * KROK;
    rysky += `<line class="ryska" x1="${x}" y1="86" x2="${x}" y2="${i % 5 === 0 ? 68 : 76}"/>`;
    cisla += `<text class="cislo" x="${x - 3}" y="64">${i}</text>`;
  }
  const x1 = OKRAJ + start * KROK, x2 = OKRAJ + (start + delka) * KROK;

  p.innerHTML = `<div class="zadani">Kolik centimetrů měří úsečka AB?</div>
    <svg class="kresba" viewBox="0 0 400 150">
      <rect class="pravitko" x="20" y="86" width="360" height="40" rx="5"/>
      ${rysky}${cisla}
      <line class="cara" x1="${x1}" y1="40" x2="${x2}" y2="40"/>
      <circle class="bod" cx="${x1}" cy="40" r="6"/><circle class="bod" cx="${x2}" cy="40" r="6"/>
      <text class="popisek" x="${x1 - 4}" y="28">A</text>
      <text class="popisek" x="${x2 - 4}" y="28">B</text>
      <line class="ryska" x1="${x1}" y1="40" x2="${x1}" y2="86"/>
      <line class="ryska" x1="${x2}" y1="40" x2="${x2}" y2="86"/>
    </svg>`;

  const jine = new Set();
  let pokusu1 = 0;
  while (jine.size < 3 && pokusu1++ < 200) {
    const k = delka + Uloha.nahodneCislo(-3, 3);
    if (k !== delka && k >= 1 && k <= 10) jine.add(k);
  }
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([delka, ...jine]).map(d => ({ klic: String(d), popis: d + ' cm' })),
    spravnyKlic: String(delka),
    zpravaOk: `✅ Úsečka jde od ${start} do ${start + delka}, měří ${delka} cm.`,
    zpravaChyba: 'Odečti menší číslo od většího – kde úsečka začíná a kde končí?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Narýsuj úsečku ------------------------------------------------------- */
function narysuj() {
  const p = $('plocha');
  const cil = Uloha.nahodneCislo(2, 8);
  const KROK = 34, OKRAJ = 30;

  let body = '', cisla = '';
  for (let i = 0; i <= 10; i++) {
    const x = OKRAJ + i * KROK;
    body += `<circle class="volny-bod" data-i="${i}" cx="${x}" cy="70" r="9"/>`;
    cisla += `<text class="cislo" x="${x - 3}" y="98">${i}</text>`;
  }
  p.innerHTML = `<div class="zadani">Klepni na dva body tak, aby úsečka měřila <b>${cil} cm</b>.</div>
    <svg class="kresba" viewBox="0 0 400 120">
      <line class="ryska" x1="30" y1="70" x2="370" y2="70"/>
      <line id="hotovaCara" class="cara" x1="0" y1="70" x2="0" y2="70" style="display:none"/>
      ${body}${cisla}
    </svg>`;

  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  p.appendChild(odezva);

  const svg = p.querySelector('svg');
  let prvni = null;
  let chyboval = false, hotovo = false;

  svg.querySelectorAll('.volny-bod').forEach(b => {
    b.addEventListener('click', () => {
      if (hotovo) return;
      const i = Number(b.dataset.i);
      if (prvni === null) {
        prvni = i;
        svg.querySelectorAll('.volny-bod').forEach(x => x.classList.remove('vybrany'));
        b.classList.add('vybrany');
        odezva.className = 'odezva';
        odezva.textContent = `Začátek v bodě ${i}. Teď klepni na druhý konec.`;
        return;
      }
      const delka = Math.abs(i - prvni);
      if (delka === cil) {
        hotovo = true;
        b.classList.add('spravne');
        svg.querySelector(`.volny-bod[data-i="${prvni}"]`).classList.add('spravne');
        const cara = svg.querySelector('#hotovaCara');
        cara.setAttribute('x1', OKRAJ + Math.min(prvni, i) * KROK);
        cara.setAttribute('x2', OKRAJ + Math.max(prvni, i) * KROK);
        cara.style.display = '';
        odezva.className = 'odezva ok';
        odezva.textContent = `✅ Od ${Math.min(prvni, i)} do ${Math.max(prvni, i)} je to ${cil} cm.`;
        skore.vyhodnot(!chyboval);
        setTimeout(novaUloha, Uloha.PRODLEVA + 300);
      } else {
        chyboval = true;
        Uloha.trhni(svg);
        odezva.className = 'odezva chyba';
        odezva.textContent = `Takhle by úsečka měřila ${delka} cm, potřebujeme ${cil} cm. Zkus to znovu.`;
        prvni = null;
        svg.querySelectorAll('.volny-bod').forEach(x => x.classList.remove('vybrany'));
      }
    });
  });
}

const REZIMY = { poznej, zmer, narysuj };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
