<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔬 Stavba buňky</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:14px;font-weight:600;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
.tab{background:var(--bg-hover);border:1px solid var(--border-strong);border-radius:6px;padding:8px 16px;cursor:pointer;font-size:.85rem}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.layout{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:20px}
.bodybox{flex:0 0 420px;display:flex;justify-content:center;max-width:100%}
.infobox{flex:1;min-width:260px}
.bodywrap{position:relative;width:100%;background:#fff;border-radius:8px;overflow:hidden}
.bodywrap img{display:block;width:100%}
.bodywrap svg{position:absolute;top:0;left:0;width:100%;height:100%}
.organ{cursor:pointer;fill:transparent;stroke:transparent}
.organ:hover{fill:rgba(106,166,253,.25);stroke:#2f6fd0;stroke-width:4}
.organ.active{fill:rgba(245,197,66,.3);stroke:#e0a800;stroke-width:4}
.oname{font-size:1.15rem;font-weight:700;color:var(--accent);margin-bottom:8px}
.odesc{font-size:.9rem;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.chip{background:var(--bg-hover);border:1px solid var(--border-strong);border-radius:20px;padding:5px 11px;font-size:.78rem;color:var(--text);cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.quiz{display:none;text-align:center}
.scorebar{display:flex;justify-content:space-around;margin-bottom:14px}
.scorebar .v{font-size:1.4rem;font-weight:700;color:var(--accent)}.scorebar .l{font-size:.72rem;color:var(--text-faint)}
.qtext{font-size:1rem;margin-bottom:12px}
.opt{display:block;width:100%;max-width:420px;margin:6px auto;background:var(--bg-hover);border:1px solid var(--border-strong);border-radius:6px;padding:10px;color:var(--text);cursor:pointer;font-size:.85rem}
.hint{font-size:.76rem;color:var(--text-faint);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="container">
  <h1>🔬 Stavba buňky</h1>
  <div class="tabs">
    <div class="tab" data-t="zivocisna">🐾 Živočišná buňka</div>
    <div class="tab" data-t="rostlinna">🌱 Rostlinná buňka</div>
    <div class="tab" data-t="quiz">❓ Kvíz</div>
  </div>

  <div id="explore" class="layout">
    <div class="card bodybox" id="cellStage"></div>
    <div class="card infobox">
      <div id="infotext"><div class="oname">Klikni na organelu</div><div class="odesc">Vyber si část buňky přímo v obrázku, nebo pomocí tlačítka v seznamu níže, a zjisti její funkci.</div></div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div id="quiz" class="quiz card">
    <div class="scorebar"><div><div class="v" id="score">0</div><div class="l">Správně</div></div><div><div class="v" id="idx">0/10</div><div class="l">Otázka</div></div></div>
    <div class="qtext" id="qtext"></div>
    <div id="qopts"></div>
  </div>
  <p class="hint">Ilustrace je zjednodušená pro výuku, velikosti a tvary organel neodpovídají skutečnému měřítku.</p>
</div>

const SEZNAM={
  zivocisna:['membrana','cytoplazma','jadro','jaderko','er','ribozom','golgi','mitochondrie','lyzozom','vezikula','centrioly'],
  rostlinna:['stena','membrana','cytoplazma','vakuola','chloroplast','jadro','jaderko','er','ribozom','golgi','mitochondrie','lyzozom','vezikula']
};

function vyber(key){
  document.querySelectorAll('.organ,.chip').forEach(o=>o.classList.remove('active'));
  document.querySelectorAll(`.organ[data-o="${key}"],.chip[data-o="${key}"]`).forEach(o=>o.classList.add('active'));
  const o=ORGANELY[key];
  $('infotext').innerHTML=`<div class="oname">${o.n}</div><div class="odesc">${o.d}</div>`;
}

function loadCell(type){
  $('cellStage').innerHTML = type==='rostlinna' ? PLANT : ANIMAL;
  $('chips').innerHTML = SEZNAM[type].map(k=>`<button class="chip" data-o="${k}">${ORGANELY[k].n}</button>`).join('');
  document.querySelectorAll('.organ,.chip').forEach(el=>el.onclick=()=>vyber(el.dataset.o));
  $('infotext').innerHTML='<div class="oname">Klikni na organelu</div><div class="odesc">Vyber si část buňky přímo v obrázku, nebo pomocí tlačítka v seznamu níže, a zjisti její funkci.</div>';
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
  const m=t.dataset.t;
  if(m==='quiz'){$('explore').style.display='none';$('quiz').style.display='block';startQuiz();}
  else{$('explore').style.display='flex';$('quiz').style.display='none';loadCell(m);}
});
document.querySelector('.tab[data-t="zivocisna"]').classList.add('active');
loadCell('zivocisna');

let score,idx,poradi,total=10;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){score=0;idx=0;poradi=shuffle(Object.keys(ORGANELY)).slice(0,total);$('score').textContent=0;next();}
function next(){
  if(idx>=poradi.length){$('qtext').textContent=`Výsledek: ${score} / ${poradi.length}`;$('qopts').innerHTML='';return;}
  $('idx').textContent=`${idx+1}/${poradi.length}`;
  const key=poradi[idx];
  $('qtext').textContent=`Co dělá: ${ORGANELY[key].n.replace(/^\S+\s/,'')}?`;
  const correct=ORGANELY[key].d;
  const opts=shuffle([correct,...shuffle(Object.values(ORGANELY).map(o=>o.d).filter(d=>d!==correct)).slice(0,3)]);
  const box=$('qopts');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=()=>{
      [...box.children].forEach(x=>x.disabled=true);
      if(o===correct){b.style.borderColor='#27ae60';score++;}
      else{b.style.borderColor='#e74c3c';[...box.children].find(x=>x.textContent===correct).style.borderColor='#27ae60';}
      $('score').textContent=score;
      setTimeout(()=>{idx++;next();},900);
    };
    box.appendChild(b);
  });
}
</script>
