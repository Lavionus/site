<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✍️ Generátor diktátů</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.container{max-width:640px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:18px;font-weight:600;text-align:center}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:24px;margin-bottom:16px}
.setup{display:flex;gap:12px;flex-wrap:wrap;align-items:end;justify-content:center}
label{display:block;font-size:.78rem;color:var(--text-faint);margin-bottom:4px}
select{background:var(--border);border:1px solid var(--border-strong);border-radius:4px;color:var(--text);padding:9px}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--accent)}
.btn.sec{background:var(--border)}
.btn.sec:hover{background:#4d4d4d}
.game,.result{display:none}
.zadaniVety{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;
  padding:18px 20px;margin-bottom:14px;font-size:clamp(1.1rem,3.6vw,1.5rem);line-height:1.7;
  font-weight:600;letter-spacing:.02em}
.zadaniVety .chybi{color:var(--accent);border-bottom:3px solid var(--accent);padding:0 5px;margin:0 1px}
.zadaniPopis{color:var(--text-faint);font-size:.82rem;margin-bottom:10px}
.controls{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.progress{text-align:center;color:var(--text-faint);font-size:.8rem;margin-bottom:10px}
textarea{width:100%;min-height:100px;background:var(--bg-input);border:2px solid var(--border-strong);border-radius:8px;color:var(--text);padding:12px;font-size:1.05rem;font-family:inherit;resize:vertical}
.diff{line-height:1.8;font-size:1.05rem;margin-top:14px}
.diff .ok{color:#27ae60}
.diff .bad{color:#e74c3c;text-decoration:underline}
.correcttext{margin-top:10px;color:var(--text-faint);font-size:.9rem}
.big{font-size:2.2rem;font-weight:700;color:var(--accent);text-align:center}
</style>
</head>
<body>
<div class="container">
  <h1>✍️ Generátor diktátů</h1>
  <div class="card" id="setupCard">
    <p style="color:var(--text-faint);font-size:.85rem;text-align:center;margin-bottom:14px">Věta se vypíše s vynechanými písmeny, na která je zaměřená — přepiš ji celou a doplň je.</p>
    <div class="setup">
      <div><label>Zaměření</label><select id="cat">
        <option value="vyjm">Vyjmenovaná slova</option>
        <option value="velka">Velká písmena</option>
        <option value="shoda">Shoda podmětu s přísudkem</option>
        <option value="mix" selected>Mix</option>
      </select></div>
      <button class="btn" id="startBtn">▶️ Spustit diktát</button>
    </div>
  </div>

  <div class="card game" id="gameCard">
    <div class="progress" id="progress"></div>
    <div class="zadaniPopis" id="zadaniPopis"></div>
    <div class="zadaniVety" id="zadaniVety"></div>
    <textarea id="input" placeholder="Napiš sem celou větu i s doplněnými písmeny…"></textarea>
    <div class="controls" style="margin-top:14px">
      <button class="btn" id="checkBtn">✅ Zkontrolovat</button>
    </div>
    <div class="diff" id="diffBox"></div>
    <div class="correcttext" id="correctBox"></div>
  </div>

  <div class="card result" id="resultCard">
    <div class="big" id="finalScore"></div>
    <p style="color:var(--text-faint);margin-top:8px;text-align:center" id="finalDetail"></p>
    <div class="controls" style="margin-top:16px"><button class="btn" id="againBtn">🔄 Znovu</button></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const VETY={
vyjm:[
"Vydra si vyla pelíšek u rybníka.","Slyšeli jsme, jak myslivec troubí na lesní roh.",
"Bylinky voní po celé zahradě.","Výr usedl na starý dub a zpytoval okolí.",
"Byt byl plný knih a starých obrazů."],
velka:[
"O prázdninách jsme jeli do Prahy a navštívili Karlův most.",
"Moje kamarádka Petra bydlí v Brně na Moravě.",
"V pondělí pojedeme na výlet k řece Vltavě.",
"Pan Novák pracuje v nemocnici jako lékař."],
shoda:[
"Chlapci běželi rychle přes hřiště.","Dívky zpívaly krásnou píseň.",
"Děti si hrály celé odpoledne na zahradě.","Ptáci odlétali na jih před zimou."]
};
VETY.mix=[...VETY.vyjm,...VETY.velka,...VETY.shoda];

/* Ke každé větě si pamatujeme, na co je zaměřená – podle toho se maskují písmena. */
const KATEGORIE=new Map();
for(const [k,vety] of Object.entries(VETY)){
  if(k==='mix')continue;
  vety.forEach(v=>KATEGORIE.set(v,k));
}

const POPIS_ZAMERENI={
  vyjm:'Doplň i/y po obojetných souhláskách (b, f, l, m, p, s, v, z).',
  velka:'Doplň první písmena slov – rozhodni, kde patří velké písmeno.',
  shoda:'Doplň koncovky příčestí podle podmětu (shoda podmětu s přísudkem).',
};

/* Vrátí větu s vynechanými sledovanými písmeny (HTML). */
function zamaskuj(veta){
  const kat=KATEGORIE.get(veta)||'vyjm';
  const mezera='<span class="chybi">_</span>';
  if(kat==='velka'){
    return veta.replace(/(^|[\s„"(])(\p{L})/gu,(m,pred)=>pred+mezera);
  }
  if(kat==='shoda'){
    return veta.replace(/([lL])([iyíý])(?=\b)/g,(m,l)=>l+mezera);
  }
  return veta.replace(/([bflmpsvzBFLMPSVZ])([iíyý])/g,(m,pred)=>pred+mezera);
}
let queue,idx,scores=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Čtení nahlas je zatím vypnuté (web nemá kvalitní český hlas), diktát se proto
   zadává písemně – s vynechanými písmeny, na která je věta zaměřená. */
function start(){
  const cat=$('cat').value;
  queue=shuffle([...VETY[cat]]).slice(0,5);
  idx=0;scores=[];
  $('setupCard').style.display='none';$('resultCard').style.display='none';$('gameCard').style.display='block';
  loadSentence();
}
function loadSentence(){
  $('input').value='';$('diffBox').innerHTML='';$('correctBox').textContent='';
  $('progress').textContent=`Věta ${idx+1} / ${queue.length}`;
  const veta=queue[idx];
  $('zadaniVety').innerHTML=zamaskuj(veta);
  $('zadaniPopis').textContent=POPIS_ZAMERENI[KATEGORIE.get(veta)||'vyjm'];
  $('input').focus();
}
function normalize(s){return s.trim().replace(/\s+/g,' ');}
function diffWords(user,correct){
  const u=normalize(user).split(' ');
  const c=normalize(correct).split(' ');
  let html='';let ok=0;
  const len=Math.max(u.length,c.length);
  for(let i=0;i<len;i++){
    const uw=(u[i]||'').replace(/[.,!?]/g,'').toLowerCase();
    const cw=(c[i]||'').replace(/[.,!?]/g,'').toLowerCase();
    if(uw===cw&&uw!==''){html+=`<span class="ok">${u[i]||''}</span> `;ok++;}
    else{html+=`<span class="bad">${u[i]||'—'}</span> `;}
  }
  return {html,ok,total:c.length};
}
$('checkBtn').onclick=()=>{
  const d=diffWords($('input').value,queue[idx]);
  $('diffBox').innerHTML=d.html;
  $('correctBox').textContent='Správně: '+queue[idx];
  scores.push(d.ok/d.total);
};

$('input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.ctrlKey){$('checkBtn').click();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.shiftKey&&$('gameCard').style.display==='block'){
    idx++;
    if(idx>=queue.length){finish();}else{loadSentence();}
  }
});
$('gameCard').insertAdjacentHTML('beforeend','<div class="controls" style="margin-top:14px"><button class="btn sec" id="nextBtn">➡️ Další věta (Shift+Enter)</button></div>');
$('nextBtn').onclick=()=>{idx++;if(idx>=queue.length){finish();}else{loadSentence();}};
function finish(){
  $('gameCard').style.display='none';$('resultCard').style.display='block';
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  $('finalScore').textContent=Math.round(avg*100)+' %';
  $('finalDetail').textContent=avg>=0.85?'🏆 Skvělý diktát!':avg>=0.6?'👍 Dobré, zkontroluj si zvýrazněná slova.':'💪 Zkus to znovu, poslouchej pozorněji.';
}
$('startBtn').onclick=start;
$('againBtn').onclick=()=>{$('setupCard').style.display='block';$('resultCard').style.display='none';};
</script>
</body>
</html>
