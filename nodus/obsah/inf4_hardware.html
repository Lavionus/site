<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardware a bezpečné chování</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .nazev-zar { font-size: 1.25rem; font-weight: 700; }
    .situace { max-width: 560px; font-size: 1.05rem; line-height: 1.5; }
    .heslo { font-family: 'Courier New', monospace; font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 700; }
  </style>
</head>
<body>
  <h1>🖥️ Hardware a bezpečné chování</h1>
  <p class="podtitul">Pro 4.–5. ročník: části počítače, vstupní a výstupní zařízení, hesla a bezpečnost.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="kCemu" class="active">🔌 K čemu to je</button>
    <button data-rezim="vstupVystup">↔️ Vstup, nebo výstup?</button>
    <button data-rezim="hesla">🔑 Bezpečné heslo</button>
    <button data-rezim="bezpecnost">🛡️ Jak se zachovám</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Vstupní zařízení</b> dávají data do počítače (klávesnice, myš, mikrofon).
    <b>Výstupní zařízení</b> data z počítače ukazují (monitor, tiskárna, reproduktor).
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_inf4_hardware', $('skore'));
let rezim = 'kCemu';

const ZARIZENI = [
  { n: 'klávesnice', e: '⌨️', typ: 'vstup', k: 'píšeme na ní text a čísla' },
  { n: 'myš', e: '🖱️', typ: 'vstup', k: 'ukazujeme a klikáme s ní' },
  { n: 'mikrofon', e: '🎤', typ: 'vstup', k: 'nahrává zvuk do počítače' },
  { n: 'webkamera', e: '📷', typ: 'vstup', k: 'snímá obraz do počítače' },
  { n: 'skener', e: '🖨️', typ: 'vstup', k: 'převádí papírový dokument do počítače' },
  { n: 'monitor', e: '🖥️', typ: 'vystup', k: 'zobrazuje obraz z počítače' },
  { n: 'tiskárna', e: '🖨️', typ: 'vystup', k: 'tiskne dokumenty na papír' },
  { n: 'reproduktor', e: '🔊', typ: 'vystup', k: 'přehrává zvuk' },
  { n: 'sluchátka', e: '🎧', typ: 'vystup', k: 'přehrávají zvuk jen tobě' },
  { n: 'procesor', e: '🧠', typ: 'jine', k: 'počítá a řídí celý počítač' },
  { n: 'pevný disk', e: '💾', typ: 'jine', k: 'ukládá data i po vypnutí' },
  { n: 'operační paměť', e: '⚡', typ: 'jine', k: 'drží data, se kterými se právě pracuje' },
];

const HESLA = [
  { h: 'Kv3tin4-Modr@', dobre: true, proc: 'je dlouhé, má velká i malá písmena, číslice a znak' },
  { h: '123456', dobre: false, proc: 'je krátké a nejčastěji hádané heslo na světě' },
  { h: 'heslo', dobre: false, proc: 'je běžné slovo, počítač ho uhodne během chvilky' },
  { h: 'Ryba+Kolo7!', dobre: true, proc: 'kombinuje dvě slova, číslici i znak' },
  { h: 'Petr2015', dobre: false, proc: 'obsahuje jméno a rok narození – to o tobě kdekdo ví' },
  { h: 'qwertz', dobre: false, proc: 'jsou to písmena vedle sebe na klávesnici' },
  { h: 'S3dm1kraska!Les', dobre: true, proc: 'je dlouhé a těžko uhodnutelné' },
  { h: 'aaaa', dobre: false, proc: 'je krátké a stále stejné písmeno' },
];

const SITUACE = [
  {
    o: 'Ve hře ti někdo cizí napíše, ať mu pošleš svoje heslo. Co uděláš?', e: '🎮',
    v: [{ t: 'Heslo nepošlu a řeknu to rodičům', ok: true },
        { t: 'Pošlu ho, když slíbí odměnu', ok: false },
        { t: 'Pošlu jen půlku hesla', ok: false }],
    proc: 'Heslo se nesdílí s nikým – ani s kamarádem, ani za odměnu ve hře.',
  },
  {
    o: 'Přišel ti e-mail „Vyhrál jsi mobil, klikni sem“. Co uděláš?', e: '📧',
    v: [{ t: 'Neklikám a ukážu to dospělému', ok: true },
        { t: 'Kliknu a vyplním údaje', ok: false },
        { t: 'Přepošlu ho kamarádům', ok: false }],
    proc: 'Takové zprávy jsou podvod (phishing) – snaží se získat údaje nebo peníze.',
  },
  {
    o: 'Chceš si založit účet na nové stránce. Co je správně?', e: '🔐',
    v: [{ t: 'Poradím se s rodiči a použiju silné heslo', ok: true },
        { t: 'Použiju stejné heslo jako všude jinde', ok: false },
        { t: 'Napíšu heslo do sešitu ve třídě', ok: false }],
    proc: 'Stejné heslo všude znamená, že únik z jedné stránky ohrozí všechny ostatní.',
  },
  {
    o: 'Někdo tě v chatu uráží a posmívá se ti. Co uděláš?', e: '💬',
    v: [{ t: 'Neodpovídám, udělám snímek obrazovky a řeknu to dospělému', ok: true },
        { t: 'Odpovím mu stejně sprostě', ok: false },
        { t: 'Nikomu to neřeknu a budu to řešit sám', ok: false }],
    proc: 'Důkaz (snímek obrazovky) pomůže a dospělý ti s kyberšikanou pomůže.',
  },
  {
    o: 'Kamarád tě chce vyfotit a dát fotku na internet. Co platí?', e: '📸',
    v: [{ t: 'Musí se mě nejdřív zeptat a já můžu říct ne', ok: true },
        { t: 'Může to udělat bez ptaní', ok: false },
        { t: 'Stačí, když to řekne až potom', ok: false }],
    proc: 'Fotka je osobní údaj – bez souhlasu ji nikdo zveřejňovat nesmí.',
  },
  {
    o: 'Počítač hlásí, že se má stáhnout neznámý program. Co uděláš?', e: '⚠️',
    v: [{ t: 'Nic nestahuji a zeptám se dospělého', ok: true },
        { t: 'Stáhnu ho, ať mám klid', ok: false },
        { t: 'Vypnu antivirus, aby to prošlo', ok: false }],
    proc: 'Neznámé programy mohou obsahovat virus – nikdy je nestahuj bez dospělého.',
  },
];

/* ---- K čemu to je ------------------------------------------------------------- */
function kCemu() {
  const p = $('plocha');
  const z = Uloha.nahodne(ZARIZENI);
  const jine = Uloha.zamichej(ZARIZENI.filter(x => x.k !== z.k)).slice(0, 3);
  p.innerHTML = `<div class="zadani">K čemu slouží toto zařízení?</div>
    <div class="karta"><div class="obrazek">${z.e}</div><div class="nazev-zar">${z.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([z, ...jine]).map(x => ({ klic: x.k, popis: x.k })),
    spravnyKlic: z.k,
    zpravaOk: `✅ ${z.n} – ${z.k}.`,
    zpravaChyba: 'To dělá jiné zařízení.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Vstup, nebo výstup? ------------------------------------------------------- */
function vstupVystup() {
  const p = $('plocha');
  const z = Uloha.nahodne(ZARIZENI);
  p.innerHTML = `<div class="zadani">Je to vstupní, nebo výstupní zařízení?</div>
    <div class="karta"><div class="obrazek">${z.e}</div><div class="nazev-zar">${z.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([
      { klic: 'vstup', ikona: '⬅️', popis: 'vstupní (data do počítače)' },
      { klic: 'vystup', ikona: '➡️', popis: 'výstupní (data z počítače)' },
      { klic: 'jine', ikona: '⚙️', popis: 'ani jedno – vnitřní část' },
    ]),
    spravnyKlic: z.typ,
    zpravaOk: z.typ === 'jine'
      ? `✅ ${z.n} je vnitřní část počítače – ${z.k}.`
      : `✅ ${z.n} je ${z.typ === 'vstup' ? 'vstupní' : 'výstupní'} zařízení – ${z.k}.`,
    zpravaChyba: 'Zeptej se: dostávají se tudy data dovnitř, nebo ven?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Bezpečné heslo ------------------------------------------------------------ */
function hesla() {
  const p = $('plocha');
  const h = Uloha.nahodne(HESLA);
  p.innerHTML = `<div class="zadani">Je tohle bezpečné heslo?</div>
    <div class="karta"><div class="obrazek">🔑</div><div class="heslo">${h.h}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'ano', ikona: '🛡️', popis: 'Ano, je bezpečné' },
      { klic: 'ne', ikona: '⚠️', popis: 'Ne, je slabé' },
    ],
    spravnyKlic: h.dobre ? 'ano' : 'ne',
    zpravaOk: `✅ ${h.dobre ? 'Ano' : 'Ne'} – ${h.proc}.`,
    zpravaChyba: 'Silné heslo je dlouhé, míchá písmena, číslice a znaky a nedá se uhodnout.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Jak se zachovám ----------------------------------------------------------- */
function bezpecnost() {
  const p = $('plocha');
  const u = Uloha.nahodne(SITUACE);
  const spravna = u.v.find(x => x.ok);
  p.innerHTML = `<div class="zadani">${u.o}</div>
    <div class="karta"><div class="obrazek">${u.e}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(u.v).map(x => ({ klic: x.t, popis: x.t })),
    spravnyKlic: spravna.t,
    zpravaOk: '✅ Správně. ' + u.proc,
    zpravaChyba: 'Tohle by ti mohlo ublížit – zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { kCemu, vstupVystup, hesla, bezpecnost };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
