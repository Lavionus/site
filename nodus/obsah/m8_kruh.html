<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kruh a kružnice</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../uloha.js"></script>
  <style>
    .kresba { width: min(300px, 78%); }
    .kresba .kruznice { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
    .kresba .cara { stroke: var(--warn); stroke-width: 3; }
    .kresba .pomocna { stroke: var(--text-muted); stroke-width: 2; stroke-dasharray: 5 4; }
    .kresba .stred { fill: var(--text); }
    .kresba .popis { fill: var(--text-muted); font-size: 13px; text-anchor: middle; }
    .kresba .vysec { fill: var(--warn); fill-opacity: 0.35; stroke: var(--warn); stroke-width: 2; }
    .uloha-text { max-width: 620px; font-size: 1.02rem; line-height: 1.6; }
    .uloha-text b { color: var(--accent); }
    .vzorec { font-family: 'Courier New', monospace; color: var(--text-muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>⭕ Kruh a kružnice</h1>
  <p class="podtitul">Pro 8. ročník: obvod a obsah kruhu, části kruhu a poloha přímky ke kružnici.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="vypocet" class="active">🧮 Obvod a obsah</button>
    <button data-rezim="casti">🧩 Části kruhu</button>
    <button data-rezim="poloha">📏 Přímka a kružnice</button>
    <button data-rezim="vztahy">🔁 Poloměr a průměr</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Obvod kruhu <b>o = 2πr = πd</b>, obsah <b>S = πr²</b>. Ludolfovo číslo <b>π ≈ 3,14</b>
    udává, kolikrát je obvod delší než průměr. <b>Kružnice</b> je čára, <b>kruh</b> je celá plocha uvnitř.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_m8_kruh', $('skore'));
let rezim = 'vypocet';
const PI = 3.14;
const fmt = x => Number(Number(x).toFixed(2)).toLocaleString('cs-CZ');
function odezvaEl() { const d = document.createElement('div'); d.className = 'odezva'; return d; }

function vypocet() {
  const p = $('plocha');
  const r = Uloha.nahodneCislo(2, 15);
  const zeStredu = Math.random() < 0.5;       // zadání poloměrem, nebo průměrem
  const hledameObsah = Math.random() < 0.5;
  const obvod = 2 * PI * r, obsah = PI * r * r;
  const vysledek = hledameObsah ? obsah : obvod;
  const jednotka = hledameObsah ? 'cm²' : 'cm';

  const jine = new Set([fmt(hledameObsah ? obvod : obsah), fmt(vysledek * 2), fmt(vysledek / 2), fmt(PI * r)]);
  jine.delete(fmt(vysledek));

  p.innerHTML = `<div class="zadani uloha-text">Kruh má ${zeStredu ? `poloměr <b>r = ${r} cm</b>`
      : `průměr <b>d = ${2 * r} cm</b>`}. Jaký má ${hledameObsah ? 'obsah' : 'obvod'}? (π = 3,14)</div>
    <div class="karta"><svg class="kresba" viewBox="0 0 220 200">
      <circle class="kruznice" cx="110" cy="100" r="70"/>
      <line class="cara" x1="110" y1="100" x2="180" y2="100"/>
      <circle class="stred" cx="110" cy="100" r="4"/>
      <text class="popis" x="145" y="92">r = ${r}</text>
      <text class="popis" x="110" y="188">${zeStredu ? '' : 'd = ' + 2 * r}</text>
    </svg><div class="vzorec">o = 2πr &nbsp;·&nbsp; S = πr²</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(vysledek), ...[...jine].slice(0, 3)])
      .map(t => ({ klic: t, popis: t + ' ' + jednotka })),
    spravnyKlic: fmt(vysledek),
    zpravaOk: hledameObsah
      ? `✅ S = π · ${r}² = ${fmt(obsah)} cm²`
      : `✅ o = 2 · π · ${r} = ${fmt(obvod)} cm`,
    zpravaChyba: 'Nezaměň obvod a obsah: obvod je délka čáry, obsah je plocha.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const CASTI = [
  { klic: 'tetiva', nazev: 'tětiva', popis: 'úsečka spojující dva body kružnice',
    kresba: '<line class="cara" x1="55" y1="140" x2="170" y2="70"/>' },
  { klic: 'polomer', nazev: 'poloměr', popis: 'úsečka od středu k bodu kružnice',
    kresba: '<line class="cara" x1="110" y1="100" x2="180" y2="100"/>' },
  { klic: 'prumer', nazev: 'průměr', popis: 'tětiva procházející středem, je dvakrát delší než poloměr',
    kresba: '<line class="cara" x1="40" y1="100" x2="180" y2="100"/>' },
  { klic: 'vysec', nazev: 'kruhová výseč', popis: 'část kruhu ohraničená dvěma poloměry a obloukem',
    kresba: '<path class="vysec" d="M110 100 L180 100 A70 70 0 0 0 145 39 Z"/>' },
  { klic: 'usec', nazev: 'kruhová úseč', popis: 'část kruhu oddělená tětivou',
    kresba: '<path class="vysec" d="M55 140 A70 70 0 0 0 170 70 Z"/>' },
  { klic: 'oblouk', nazev: 'oblouk', popis: 'část samotné kružnice mezi dvěma body',
    kresba: '<path class="cara" fill="none" d="M180 100 A70 70 0 0 0 110 30"/>' },
];
function casti() {
  const p = $('plocha');
  const u = Uloha.nahodne(CASTI);
  p.innerHTML = `<div class="zadani">Jak se nazývá vyznačená část?</div>
    <div class="karta"><svg class="kresba" viewBox="0 0 220 200">
      <circle class="kruznice" cx="110" cy="100" r="70" fill="none"/>
      ${u.kresba}
      <circle class="stred" cx="110" cy="100" r="4"/>
    </svg></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.klic, ...Uloha.zamichej(CASTI.filter(x => x.klic !== u.klic)).slice(0, 3).map(x => x.klic)])
      .map(k => ({ klic: k, popis: CASTI.find(x => x.klic === k).nazev })),
    spravnyKlic: u.klic,
    zpravaOk: `✅ ${u.nazev} – ${u.popis}`,
    zpravaChyba: 'Sleduj, čím je útvar ohraničený: dvěma poloměry, tětivou, nebo jde jen o čáru?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

function poloha() {
  const p = $('plocha');
  const r = 70;
  const typ = Uloha.nahodne(['secna', 'tecna', 'vnejsi']);
  const vzdalenost = typ === 'secna' ? 35 : typ === 'tecna' ? 70 : 100;
  const y = 100 + vzdalenost;

  p.innerHTML = `<div class="zadani uloha-text">Jaká je vzájemná poloha přímky a kružnice?
      Poloměr je ${r / 10} cm, vzdálenost přímky od středu ${fmt(vzdalenost / 10)} cm.</div>
    <div class="karta"><svg class="kresba" viewBox="0 0 240 230">
      <circle class="kruznice" cx="110" cy="100" r="${r}" fill="none"/>
      <circle class="stred" cx="110" cy="100" r="4"/>
      <line class="pomocna" x1="110" y1="100" x2="110" y2="${y}"/>
      <line class="cara" x1="10" y1="${y}" x2="230" y2="${y}"/>
      <text class="popis" x="140" y="${(100 + y) / 2}">${fmt(vzdalenost / 10)} cm</text>
    </svg></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([
      { klic: 'secna', popis: 'sečna – protíná kružnici ve dvou bodech' },
      { klic: 'tecna', popis: 'tečna – má s kružnicí jediný společný bod' },
      { klic: 'vnejsi', popis: 'vnější přímka – nemá s kružnicí společný bod' },
    ]),
    spravnyKlic: typ,
    zpravaOk: typ === 'secna' ? '✅ Vzdálenost je menší než poloměr – přímka je sečna.'
      : typ === 'tecna' ? '✅ Vzdálenost se rovná poloměru – přímka je tečna (je kolmá k poloměru).'
      : '✅ Vzdálenost je větší než poloměr – přímka kružnici míjí.',
    zpravaChyba: 'Porovnej vzdálenost přímky od středu s poloměrem.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

function vztahy() {
  const p = $('plocha');
  const r = Uloha.nahodneCislo(2, 20);
  const typ = Uloha.nahodne(['naPrumer', 'naPolomer', 'zObvodu']);
  let zadani, spravny, jine;
  if (typ === 'naPrumer') {
    zadani = `Kružnice má poloměr <b>${r} cm</b>. Jak dlouhý je průměr?`;
    spravny = fmt(2 * r); jine = [fmt(r), fmt(r / 2), fmt(4 * r)];
  } else if (typ === 'naPolomer') {
    zadani = `Kružnice má průměr <b>${2 * r} cm</b>. Jak dlouhý je poloměr?`;
    spravny = fmt(r); jine = [fmt(2 * r), fmt(4 * r), fmt(r / 2)];
  } else {
    zadani = `Obvod kruhu je <b>${fmt(2 * PI * r)} cm</b>. Jaký je jeho průměr? (π = 3,14)`;
    spravny = fmt(2 * r); jine = [fmt(r), fmt(4 * r), fmt(2 * PI * r / 2)];
  }
  p.innerHTML = `<div class="zadani uloha-text">${zadani}</div>
    <div class="karta"><div class="vzorec">d = 2r &nbsp;·&nbsp; o = πd</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([spravny, ...jine.filter(x => x !== spravny)])
      .map(t => ({ klic: t, popis: t + ' cm' })),
    spravnyKlic: spravny,
    zpravaOk: `✅ ${spravny} cm`,
    zpravaChyba: 'Průměr je vždy dvojnásobek poloměru, obvod je π-krát průměr.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { vypocet, casti, poloha, vztahy };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
novaUloha();
</script>
</body>
</html>
