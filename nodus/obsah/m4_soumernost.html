<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Osová souměrnost</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .sit { width: min(420px, 92%); }
    .sit .bunka { fill: var(--bg-control); stroke: var(--border); stroke-width: 1; }
    .sit .bunka.vzor { fill: var(--accent); fill-opacity: 0.6; }
    .sit .bunka.klikaci { cursor: pointer; }
    .sit .bunka.klikaci:hover { fill: var(--accent); fill-opacity: 0.3; }
    .sit .bunka.vybrana { fill: var(--accent); fill-opacity: 0.9; }
    .sit .bunka.spravne { fill: var(--ok); fill-opacity: 0.8; }
    .sit .osa { stroke: var(--danger); stroke-width: 3; stroke-dasharray: 7 5; }
    .utvar { width: min(240px, 60vw); }
    .utvar .tvar { fill: var(--accent); fill-opacity: 0.65; stroke: var(--accent); stroke-width: 3; }
    .utvar .osa { stroke: var(--danger); stroke-width: 2.5; stroke-dasharray: 6 4; }
  </style>
</head>
<body>
  <h1>🪞 Osová souměrnost</h1>
  <p class="podtitul">Pro 4.–5. ročník: osa souměrnosti, počet os a dokreslování podle osy.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="maOsu" class="active">🔍 Je souměrný?</button>
    <button data-rezim="pocetOs">🔢 Kolik má os?</button>
    <button data-rezim="dokresli">🖍️ Dokresli podle osy</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Útvar je <b>osově souměrný</b>, když ho osa rozdělí na dvě části, které se přesně překryjí
    (jako by se přeložil papír). Čtverec má 4 osy, obdélník 2, rovnostranný trojúhelník 3, kruh nekonečně mnoho.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_m4_soumernost', $('skore'));
let rezim = 'maOsu';

/* útvary: SVG tvar + počet os souměrnosti */
const UTVARY = [
  { n: 'čtverec', osy: 4, svg: '<rect class="tvar" x="45" y="45" width="110" height="110"/>' },
  { n: 'obdélník', osy: 2, svg: '<rect class="tvar" x="25" y="60" width="150" height="80"/>' },
  { n: 'kruh', osy: 99, svg: '<circle class="tvar" cx="100" cy="100" r="70"/>' },
  { n: 'rovnostranný trojúhelník', osy: 3, svg: '<polygon class="tvar" points="100,35 165,150 35,150"/>' },
  { n: 'rovnoramenný trojúhelník', osy: 1, svg: '<polygon class="tvar" points="100,35 150,155 50,155"/>' },
  { n: 'obecný trojúhelník', osy: 0, svg: '<polygon class="tvar" points="60,40 170,120 40,155"/>' },
  { n: 'kosočtverec', osy: 2, svg: '<polygon class="tvar" points="100,30 165,100 100,170 35,100"/>' },
  { n: 'pravidelný šestiúhelník', osy: 6, svg: '<polygon class="tvar" points="100,32 159,66 159,134 100,168 41,134 41,66"/>' },
  { n: 'lichoběžník s rameny stejné délky', osy: 1, svg: '<polygon class="tvar" points="65,55 135,55 170,145 30,145"/>' },
  { n: 'nepravidelný čtyřúhelník', osy: 0, svg: '<polygon class="tvar" points="45,50 160,40 175,140 60,160"/>' },
];

const svgUtvar = u => `<svg class="utvar" viewBox="0 0 200 200">${u.svg}</svg>`;

/* ---- Je souměrný? ----------------------------------------------------------- */
function maOsu() {
  const p = $('plocha');
  const u = Uloha.nahodne(UTVARY);
  p.innerHTML = `<div class="zadani">Je tento útvar osově souměrný?</div>
    <div class="karta">${svgUtvar(u)}<div class="popis">${u.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'ano', ikona: '🪞', popis: 'Ano, má osu' },
      { klic: 'ne', ikona: '🚫', popis: 'Ne, nemá' },
    ],
    spravnyKlic: u.osy > 0 ? 'ano' : 'ne',
    zpravaOk: u.osy > 0
      ? `✅ ${u.n} má ${u.osy === 99 ? 'nekonečně mnoho os' : u.osy + (u.osy === 1 ? ' osu' : u.osy < 5 ? ' osy' : ' os')} souměrnosti.`
      : `✅ ${u.n} nemá žádnou osu souměrnosti.`,
    zpravaChyba: 'Představ si, že útvar přeložíš – překryjí se obě části?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Kolik má os? ------------------------------------------------------------ */
function pocetOs() {
  const p = $('plocha');
  const u = Uloha.nahodne(UTVARY.filter(x => x.osy > 0 && x.osy !== 99));
  p.innerHTML = `<div class="zadani">Kolik os souměrnosti má tento útvar?</div>
    <div class="karta">${svgUtvar(u)}<div class="popis">${u.n}</div></div>`;
  const jine = new Set();
  let pokusu1 = 0;
  while (jine.size < 3 && pokusu1++ < 200) {
    const k = Uloha.nahodneCislo(0, 6);
    if (k !== u.osy) jine.add(k);
  }
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([u.osy, ...jine]).map(v => ({ klic: String(v), popis: String(v) })),
    spravnyKlic: String(u.osy),
    zpravaOk: `✅ ${u.n} má ${u.osy} ${u.osy === 1 ? 'osu' : u.osy < 5 ? 'osy' : 'os'} souměrnosti.`,
    zpravaChyba: 'Zkus si útvar přeložit vodorovně, svisle i úhlopříčně.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Dokresli podle osy ------------------------------------------------------ */
function dokresli() {
  const KROK = 32, OKRAJ = 20, SLOUPCU = 8, RADKU = 6;
  const p = $('plocha');
  const pulka = SLOUPCU / 2;

  /* náhodný obrazec v levé polovině */
  const vzor = new Set();
  const pocet = Uloha.nahodneCislo(4, 7);
  while (vzor.size < pocet) {
    vzor.add(`${Uloha.nahodneCislo(0, pulka - 1)},${Uloha.nahodneCislo(0, RADKU - 1)}`);
  }
  const zrcadlo = new Set([...vzor].map(k => {
    const [s, r] = k.split(',').map(Number);
    return `${SLOUPCU - 1 - s},${r}`;
  }));

  let bunky = '';
  for (let r = 0; r < RADKU; r++) {
    for (let s = 0; s < SLOUPCU; s++) {
      const jeVzor = vzor.has(`${s},${r}`);
      const klikaci = s >= pulka;
      bunky += `<rect class="bunka${jeVzor ? ' vzor' : ''}${klikaci ? ' klikaci' : ''}" `
        + `data-k="${s},${r}" x="${OKRAJ + s * KROK}" y="${OKRAJ + r * KROK}" `
        + `width="${KROK}" height="${KROK}"/>`;
    }
  }
  const osaX = OKRAJ + pulka * KROK;
  p.innerHTML = `<div class="zadani">Dokresli obrázek podle osy – klepej na čtverečky vpravo.</div>
    <svg class="sit" viewBox="0 0 ${OKRAJ * 2 + SLOUPCU * KROK} ${OKRAJ * 2 + RADKU * KROK}">
      ${bunky}
      <line class="osa" x1="${osaX}" y1="${OKRAJ - 8}" x2="${osaX}" y2="${OKRAJ + RADKU * KROK + 8}"/>
    </svg>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  p.appendChild(odezva);

  const svg = p.querySelector('svg');
  let chyboval = false, hotovo = false;
  const vybrane = new Set();

  svg.querySelectorAll('.bunka.klikaci').forEach(bunka => {
    bunka.addEventListener('click', () => {
      if (hotovo) return;
      const k = bunka.dataset.k;
      if (!zrcadlo.has(k)) {
        chyboval = true;
        Uloha.trhni(svg);
        bunka.classList.add('spatne');
        setTimeout(() => bunka.classList.remove('spatne'), 420);
        odezva.className = 'odezva chyba';
        odezva.textContent = 'Tenhle čtvereček v zrcadle není – porovnej vzdálenost od osy.';
        return;
      }
      bunka.classList.add('vybrana');
      vybrane.add(k);
      odezva.className = 'odezva';
      odezva.textContent = `Hotovo ${vybrane.size} z ${zrcadlo.size} čtverečků.`;
      if (vybrane.size === zrcadlo.size) {
        hotovo = true;
        svg.querySelectorAll('.bunka.vybrana').forEach(x => x.classList.add('spravne'));
        odezva.className = 'odezva ok';
        odezva.textContent = '✅ Obrázek je souměrný podle osy!';
        skore.vyhodnot(!chyboval);
        setTimeout(novaUloha, Uloha.PRODLEVA + 400);
      }
    });
  });
}

const REZIMY = { maOsu, pocetOs, dokresli };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
