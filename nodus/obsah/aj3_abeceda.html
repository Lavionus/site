<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angličtina – abeceda a hláskování</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .pismeno { font-size: clamp(3.5rem, 14vw, 6rem); font-weight: 700; color: var(--accent); line-height: 1; }
    .hlaskovani {
      font-size: clamp(1.1rem, 4vw, 1.8rem); font-weight: 700; letter-spacing: 0.06em;
      max-width: 560px; line-height: 1.5;
    }
    .cteni { color: var(--text-faint); font-style: italic; font-size: 1rem; margin-top: 4px; }
    .tabulka-abecedy {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
      max-width: 900px; margin-top: 12px;
    }
    .tabulka-abecedy span {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 7px;
      padding: 4px 8px; font-size: 0.76rem; color: var(--text-muted);
    }
    .tabulka-abecedy b { color: var(--text); }
  </style>
</head>
<body>
  <h1>🔤 Anglická abeceda a hláskování</h1>
  <p class="podtitul">Pro 3.–4. ročník: jak se písmena čtou a jak se slova hláskují.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="cteniPismene" class="active">🗣️ Jak se čte písmeno</button>
    <button data-rezim="podleCteni">👂 Které písmeno slyším</button>
    <button data-rezim="hlaskovani">🔡 Hláskované slovo</button>
    <button data-rezim="poradi">➡️ Co následuje</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <div class="tabulka-abecedy" id="tabulkaAbecedy"></div>

  <p class="napoveda">
    Anglická abeceda má <b>26 písmen</b> – nemá háčky ani čárky. Čtení je v tabulce zapsané
    česky, aby se dalo přečíst nahlas i bez zvuku.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_aj3_abeceda', $('skore'));
let rezim = 'cteniPismene';

/* písmeno -> české přepsání anglického názvu písmene */
const ABECEDA = {
  A: 'ej', B: 'bí', C: 'sí', D: 'dý', E: 'í', F: 'ef', G: 'dží', H: 'ejč', I: 'aj',
  J: 'džej', K: 'kej', L: 'el', M: 'em', N: 'en', O: 'ou', P: 'pí', Q: 'kjů', R: 'ár',
  S: 'es', T: 'tý', U: 'jů', V: 'ví', W: 'dabljů', X: 'eks', Y: 'vaj', Z: 'zed',
};
const PISMENA = Object.keys(ABECEDA);

const SLOVA = ['DOG', 'CAT', 'BOOK', 'TREE', 'HOUSE', 'SCHOOL', 'APPLE', 'WATER',
               'GREEN', 'MOUSE', 'TABLE', 'CHAIR', 'BIRD', 'FISH', 'MILK', 'DOOR'];

$('tabulkaAbecedy').innerHTML = PISMENA
  .map(z => `<span><b>${z}</b> ${ABECEDA[z]}</span>`).join('');

/* ---- Jak se čte písmeno? --------------------------------------------------- */
function cteniPismene() {
  const p = $('plocha');
  const z = Uloha.nahodne(PISMENA);
  const jina = Uloha.zamichej(PISMENA.filter(x => ABECEDA[x] !== ABECEDA[z])).slice(0, 3);
  p.innerHTML = `<div class="zadani">Jak se toto písmeno čte anglicky?</div>
    <div class="karta"><div class="pismeno">${z}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([z, ...jina]).map(x => ({ klic: ABECEDA[x], popis: ABECEDA[x] })),
    spravnyKlic: ABECEDA[z],
    zpravaOk: `✅ ${z} se čte „${ABECEDA[z]}“`,
    zpravaChyba: 'Takhle se čte jiné písmeno – podívej se do tabulky dole.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Které písmeno slyším? ------------------------------------------------- */
function podleCteni() {
  const p = $('plocha');
  const z = Uloha.nahodne(PISMENA);
  const jina = Uloha.zamichej(PISMENA.filter(x => x !== z)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Které písmeno se čte takto?</div>
    <div class="karta"><div class="hlaskovani">${ABECEDA[z]}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([z, ...jina]).map(x => ({ klic: x, popis: x })),
    spravnyKlic: z,
    zpravaOk: `✅ „${ABECEDA[z]}“ je písmeno ${z}`,
    zpravaChyba: 'Ještě ne – zkontroluj si tabulku pod úlohou.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Hláskované slovo ------------------------------------------------------ */
function hlaskovani() {
  const p = $('plocha');
  const slovo = Uloha.nahodne(SLOVA);
  const jina = Uloha.zamichej(SLOVA.filter(x => x !== slovo)).slice(0, 3);
  // schválně ukazujeme jen čtení písmen – kdyby svítila i samotná písmena,
  // stačilo by je přečíst a úloha by nic neprocvičila
  const cteno = [...slovo].map(z => ABECEDA[z]).join(' – ');
  p.innerHTML = `<div class="zadani">Které slovo se takto hláskuje?</div>
    <div class="karta"><div class="hlaskovani">${cteno}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([slovo, ...jina]).map(x => ({ klic: x, popis: x })),
    spravnyKlic: slovo,
    zpravaOk: `✅ ${cteno} → ${[...slovo].join('-')} = ${slovo}`,
    zpravaChyba: 'Přečti si hláskování znovu popořadě – každá slabika je jedno písmeno.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Co následuje? --------------------------------------------------------- */
function poradi() {
  const p = $('plocha');
  const i = Uloha.nahodneCislo(0, PISMENA.length - 2);
  const z = PISMENA[i], dalsiPismeno = PISMENA[i + 1];
  const jina = Uloha.zamichej(PISMENA.filter(x => x !== dalsiPismeno && x !== z)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Které písmeno následuje v anglické abecedě?</div>
    <div class="karta"><div class="pismeno">${z}</div>
    <div class="cteni">čti: ${ABECEDA[z]}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([dalsiPismeno, ...jina]).map(x => ({ klic: x, popis: x })),
    spravnyKlic: dalsiPismeno,
    zpravaOk: `✅ Po ${z} následuje ${dalsiPismeno} („${ABECEDA[dalsiPismeno]}“)`,
    zpravaChyba: 'Zkus si abecedu odříkat od začátku.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { cteniPismene, podleCteni, hlaskovani, poradi };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
