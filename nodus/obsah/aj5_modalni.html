<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angličtina – can, must</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .veta-en { font-size: clamp(1.2rem, 4.5vw, 1.8rem); font-weight: 700; line-height: 1.45; max-width: 620px; }
    .veta-en .mezera { color: var(--accent); border-bottom: 3px solid var(--accent); padding: 0 12px; }
    .preklad { color: var(--text-faint); font-size: 0.95rem; font-style: italic; }
    .znacka { font-size: clamp(2.6rem, 10vw, 4rem); }
  </style>
</head>
<body>
  <h1>🔑 Can, must – modální slovesa</h1>
  <p class="podtitul">Pro 5.–6. ročník: umět, smět, muset a nesmět.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="vyznam" class="active">🇨🇿 Co to znamená?</button>
    <button data-rezim="doplnVetu">✏️ Doplň sloveso</button>
    <button data-rezim="pravidla">🚸 Značky a pravidla</button>
    <button data-rezim="tvar">🔧 Správný tvar</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Po modálním slovese následuje <b>infinitiv bez to</b>: I can swim (ne <i>to swim</i>).
    Ve 3. osobě se nepřidává -s: <i>he can</i>, nikoli <i>he cans</i>.
    <b>mustn't</b> = nesmíš, <b>don't have to</b> = nemusíš.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_aj5_modalni', $('skore'));
let rezim = 'vyznam';

const VYZNAMY = [
  { en: 'can', cz: 'umět, moci' },
  { en: "can't", cz: 'nemoci, neumět' },
  { en: 'must', cz: 'muset' },
  { en: "mustn't", cz: 'nesmět' },
  { en: "don't have to", cz: 'nemuset' },
  { en: 'may', cz: 'smět (zdvořile)' },
  { en: 'should', cz: 'měl by' },
  { en: "shouldn't", cz: 'neměl by' },
];

const VETY = [
  { v: 'A fish ___ swim very well.', spr: 'can', cz: 'Ryba umí výborně plavat.' },
  { v: 'You ___ do your homework before playing.', spr: 'must', cz: 'Musíš si udělat úkol, než si půjdeš hrát.' },
  { v: "You ___ touch the hot oven!", spr: "mustn't", cz: 'Nesmíš sahat na horkou troubu!' },
  { v: 'A baby ___ read yet.', spr: "can't", cz: 'Miminko ještě neumí číst.' },
  { v: 'It is Saturday – we ___ get up early.', spr: "don't have to", cz: 'Je sobota, nemusíme brzo vstávat.' },
  { v: '___ I open the window, please?', spr: 'may', cz: 'Mohu prosím otevřít okno?' },
  { v: 'You ___ eat more vegetables.', spr: 'should', cz: 'Měl bys jíst víc zeleniny.' },
  { v: 'She ___ play the piano beautifully.', spr: 'can', cz: 'Krásně hraje na klavír.' },
];

const ZNACKY = [
  { e: '🚭', spr: "mustn't", t: 'You ___ smoke here.', cz: 'Tady se nesmí kouřit.' },
  { e: '🤫', spr: "mustn't", t: 'You ___ talk in the library.', cz: 'V knihovně se nesmí mluvit.' },
  { e: '🅿️', spr: 'can', t: 'You ___ park here.', cz: 'Tady smíš parkovat.' },
  { e: '🚸', spr: 'must', t: 'You ___ stop for children.', cz: 'Musíš zastavit kvůli dětem.' },
  { e: '📵', spr: "mustn't", t: 'You ___ use your phone here.', cz: 'Tady nesmíš používat telefon.' },
  { e: '🏊', spr: 'can', t: 'You ___ swim here.', cz: 'Tady smíš plavat.' },
  { e: '🪖', spr: 'must', t: 'You ___ wear a helmet.', cz: 'Musíš mít přilbu.' },
  { e: '🍽️', spr: "don't have to", t: 'You ___ bring your own food.', cz: 'Nemusíš si nosit vlastní jídlo.' },
];

const TVARY = [
  { spatne: 'He cans swim.', spravne: 'He can swim.', proc: 'modální sloveso nemá ve 3. osobě -s' },
  { spatne: 'She must to go home.', spravne: 'She must go home.', proc: 'po must následuje infinitiv bez to' },
  { spatne: 'Can you to help me?', spravne: 'Can you help me?', proc: 'po can následuje infinitiv bez to' },
  { spatne: 'I can to ride a bike.', spravne: 'I can ride a bike.', proc: 'po can nikdy nedáváme to' },
  { spatne: 'He doesn\'t can swim.', spravne: "He can't swim.", proc: 'zápor se tvoří přidáním not přímo k can' },
  { spatne: 'Do you can dance?', spravne: 'Can you dance?', proc: 'otázka se tvoří přehozením can a podmětu' },
];

/* ---- Co to znamená? ------------------------------------------------------------- */
function vyznam() {
  const p = $('plocha');
  const u = Uloha.nahodne(VYZNAMY);
  const jine = Uloha.zamichej(VYZNAMY.filter(x => x.cz !== u.cz)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Co znamená toto sloveso?</div>
    <div class="karta"><div class="veta-en">${u.en}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.cz, popis: x.cz })),
    spravnyKlic: u.cz,
    zpravaOk: `✅ ${u.en} = ${u.cz}`,
    zpravaChyba: 'Pozor na rozdíl mustn\'t (nesmíš) a don\'t have to (nemusíš).',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Doplň sloveso --------------------------------------------------------------- */
function doplnVetu() {
  const p = $('plocha');
  const u = Uloha.nahodne(VETY);
  const jine = Uloha.zamichej(VYZNAMY.filter(x => x.en !== u.spr)).slice(0, 3).map(x => x.en);
  p.innerHTML = `<div class="zadani">Doplň správné sloveso:</div>
    <div class="karta"><div class="veta-en">${u.v.replace('___', '<span class="mezera">?</span>')}</div>
    <div class="preklad">${u.cz}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.spr, ...jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.spr,
    zpravaOk: `✅ ${u.v.replace('___', u.spr)}`,
    zpravaChyba: 'Přečti si český překlad – jde o umět, muset, nesmět, nebo nemuset?',
    poSpravne: napoprve => {
      skore.vyhodnot(napoprve);
      p.querySelector('.mezera').textContent = u.spr;
    },
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Značky a pravidla ------------------------------------------------------------ */
function pravidla() {
  const p = $('plocha');
  const u = Uloha.nahodne(ZNACKY);
  const jine = Uloha.zamichej(["can", "can't", "must", "mustn't", "don't have to"]
    .filter(x => x !== u.spr)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Co říká tato značka?</div>
    <div class="karta"><div class="znacka">${u.e}</div>
    <div class="veta-en">${u.t.replace('___', '<span class="mezera">?</span>')}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.spr, ...jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.spr,
    zpravaOk: `✅ ${u.t.replace('___', u.spr)} – ${u.cz}`,
    zpravaChyba: 'Zakázáno → mustn\'t, povoleno → can, povinnost → must.',
    poSpravne: napoprve => {
      skore.vyhodnot(napoprve);
      p.querySelector('.mezera').textContent = u.spr;
    },
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Správný tvar ------------------------------------------------------------------ */
function tvar() {
  const p = $('plocha');
  const u = Uloha.nahodne(TVARY);
  const jine = Uloha.zamichej(TVARY.filter(x => x.spravne !== u.spravne)).slice(0, 2).map(x => x.spravne);
  p.innerHTML = `<div class="zadani">Která věta je gramaticky správně?</div>
    <div class="karta"><div class="preklad">Pozor na tvar modálního slovesa.</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.spravne, u.spatne, ...jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.spravne,
    zpravaOk: `✅ ${u.spravne} – ${u.proc}.`,
    zpravaChyba: 'Zkontroluj: žádné to za modálním slovesem a žádné -s ve 3. osobě.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { vyznam, doplnVetu, pravidla, tvar };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
