<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔬 Fyzikální hřiště pro děti</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text);
  display:flex;flex-direction:column;height:100dvh}

.horni{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--bg-panel);
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.horni h1{font-size:1.05rem;font-weight:600;margin-right:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--bg-control);border:1px solid var(--border-strong);color:var(--text-muted);
  border-radius:6px;padding:7px 14px;font-size:.84rem;cursor:pointer;font-family:inherit}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

.ovladani{display:flex;gap:14px;align-items:center;padding:10px 16px;background:var(--bg-elevated);
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.ovladani label{font-size:.78rem;color:var(--text-muted);display:flex;align-items:center;gap:7px}
.ovladani label b{color:var(--text);font-variant-numeric:tabular-nums;min-width:3.6em;display:inline-block}
input[type=range]{width:110px;accent-color:var(--accent)}
.ovladani button{background:var(--bg-control);border:1px solid var(--border-strong);color:var(--text);
  border-radius:6px;padding:7px 12px;font-size:.82rem;cursor:pointer;font-family:inherit}
.ovladani button:hover{border-color:var(--accent)}
.ovladani button.zap{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ovladani button.hlavni{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.oddel{width:1px;align-self:stretch;background:var(--border)}
.prepinac{display:flex;gap:4px}
/* Při porovnávání dvou kyvadel drží délky i hmotnosti ve sloupcích pod sebou,
   ať se dají hodnoty srovnat pohledem. */
.kyvadla{display:grid;grid-template-columns:auto auto;gap:6px 16px;align-items:center}
.kyvadla.jedno .radek-b{display:none}
.kyvadla.jedno .znacka{display:none}
.kyvadla .znacka{font-size:.72rem;font-weight:700;width:21px;height:21px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;border:2px solid;background:transparent;flex:0 0 auto}
.kyvadla .znacka.a{border-color:var(--accent);color:var(--accent)}
.kyvadla .znacka.b{border-color:var(--warn);color:var(--warn)}
@media(max-width:820px){
  /* na telefon se dva sloupce posuvníků nevejdou – poskládáme je do jednoho
     sloupce, ale pořád seřazené podle veličiny (obě délky, pak obě hmotnosti) */
  .kyvadla{grid-template-columns:1fr}
  .kyvadla .delka-a{order:1} .kyvadla .delka-b{order:2}
  .kyvadla .hmota-a{order:3} .kyvadla .hmota-b{order:4}
}
.prepinac button{padding:6px 10px;font-size:.78rem}

/* Panel má vlastní posuvník; kdyby řádek gridu rostl podle jeho obsahu,
   roztáhl by se s ním i canvas a scéna by se kreslila mimo viditelnou plochu.
   Proto min-height:0 na všech úrovních. */
.scena{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;min-height:0}
.platno-obal{position:relative;background:var(--bg);min-width:0;min-height:0}
canvas{display:block;width:100%;height:100%}
.panel{background:var(--bg-panel);border-left:1px solid var(--border);padding:14px 16px;min-width:0;
  min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media(max-width:820px){
  /* minmax(0,…) i min-height:0 jsou nutné: aspect-ratio se jinak spolu
     s min-height propíše do minimální ŠÍŘKY sloupce a rozbije to layout */
  body{height:auto;min-height:100dvh}
  .scena{grid-template-columns:minmax(0,1fr)}
  .panel{border-left:none;border-top:1px solid var(--border);overflow:visible}
  .platno-obal{aspect-ratio:4/3}
}

.blok h2{font-size:.82rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;
  margin-bottom:8px;font-weight:600}
.mereni{display:flex;flex-direction:column;gap:5px}
.mereni .radek{display:flex;justify-content:space-between;align-items:baseline;font-size:.86rem;
  padding:4px 8px;background:var(--bg-elevated);border-radius:6px}
.mereni .radek span{color:var(--text-muted)}
.mereni .radek b{font-variant-numeric:tabular-nums}
.mereni .radek.duraz{border-left:3px solid var(--accent)}

.energie{display:flex;flex-direction:column;gap:7px}
.epruh{font-size:.78rem}
.epruh .popis{display:flex;justify-content:space-between;margin-bottom:3px;color:var(--text-muted)}
.epruh .popis b{color:var(--text);font-variant-numeric:tabular-nums}
.epruh .drazka{height:12px;background:var(--bg-elevated);border-radius:6px;overflow:hidden}
.epruh .drazka i{display:block;height:100%;border-radius:6px;transition:width .08s linear}
.epruh.ep .drazka i{background:#7e57c2}
.epruh.ek .drazka i{background:#ef6c00}
.epruh.ec .drazka i{background:var(--ok)}
.epruh.ztrata .drazka i{background:var(--danger)}

.vyklad{font-size:.84rem;line-height:1.6;color:var(--text-muted)}
.vyklad b{color:var(--text)}
.otazka{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:10px 12px;font-size:.84rem;line-height:1.55}
.otazka .nadpis{font-weight:600;color:var(--text);margin-bottom:4px}
/* Výška se dopočítá v JS z nejdelší možné hlášky (--vyska-hlasky), aby text
   pod boxem neposkakoval pokaždé, když se změní situace. */
.hlaska{padding:9px 12px;border-radius:8px;font-size:.84rem;line-height:1.5;font-weight:600;
  min-height:var(--vyska-hlasky,auto);display:flex;align-items:center}
/* barvu nese rámeček, text musí zůstat čitelný i na tónovaném pozadí */
.hlaska.klid{background:rgba(224,166,63,.15);border:1px solid var(--warn);color:var(--text)}
.hlaska.jede{background:var(--accent-soft);border:1px solid var(--accent);color:var(--text)}
.legenda{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--text-muted)}
.legenda span{display:flex;align-items:center;gap:5px}
.legenda i{width:14px;height:3px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div class="horni">
  <h1>🔬 Fyzikální hřiště</h1>
  <div class="tabs" id="tabs">
    <button data-sim="kyvadlo" class="active">🪀 Kyvadlo</button>
    <button data-sim="rovina">📐 Nakloněná rovina</button>
    <button data-sim="srazky">💥 Srážky</button>
  </div>
</div>

<div class="ovladani" id="ovladani"></div>

<div class="ovladani">
  <div class="prepinac">
    <button id="btnPauza" title="Mezerník">⏸️ Pauza</button>
    <button id="btnKrok" title="Posun o kousek dopředu">⏭️ Krok</button>
  </div>
  <label>Tempo
    <span class="prepinac" id="tempo">
      <button data-t="0.15">🐌 ¼</button>
      <button data-t="0.4">🚶 ½</button>
      <button data-t="1" class="zap">🏃 1×</button>
    </span>
  </label>
  <div class="oddel"></div>
  <button id="btnSily" class="zap">➡️ Síly</button>
  <button id="btnStopa" class="zap">〰️ Stopa</button>
  <button id="btnStitky" class="zap">🏷️ Popisky</button>
</div>

<div class="scena">
  <div class="platno-obal"><canvas id="c"></canvas></div>
  <aside class="panel">
    <div class="blok"><h2>Co se právě děje</h2><div id="hlaska"></div><div class="mereni" id="mereni"></div></div>
    <div class="blok"><h2>Energie</h2><div class="energie" id="energie"></div></div>
    <div class="blok"><h2>Legenda</h2><div class="legenda" id="legenda"></div></div>
    <div class="blok"><h2>Jak to funguje</h2><div class="vyklad" id="vyklad"></div></div>
    <div class="otazka" id="otazka"></div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
const G = 9.81;

let sim = 'kyvadlo';
let bezi = true, tempo = 1, krokuj = 0;
let ukazSily = true, ukazStopu = true, ukazStitky = true;

/* ---------- barvy podle tématu ----------
   Kreslíme na canvas, takže se k tokenům z common.css musíme dostat ručně.
   Přečteme je jednou a znovu při přepnutí tématu. */
let B = {};
function nactiBarvy() {
  const s = getComputedStyle(document.documentElement);
  const t = n => s.getPropertyValue(n).trim();
  B = {
    pozadi: t('--bg'), text: t('--text'), slabe: t('--text-faint'), tlumene: t('--text-muted'),
    cara: t('--border-strong'), akcent: t('--accent'), ok: t('--ok'), varovani: t('--warn'),
    chyba: t('--danger'),
    teleso: '#e0a63f', teleso2: '#6aa6fd', tiha: '#ef5350', treni: '#8d6e63',
    normala: '#26a69a', slozka: '#ab47bc', rychlost: '#42a5f5',
  };
}
nactiBarvy();
new MutationObserver(nactiBarvy).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function rozmer() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width === Math.round(w * dpr) && canvas.height === Math.round(h * dpr)) return;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', rozmer);
/* Plátno mění velikost i bez změny okna — když se zalomí lišta ovládání nebo
   se přepne simulace. Samotná událost `resize` na to nestačí. */
if (window.ResizeObserver) new ResizeObserver(rozmer).observe(document.querySelector('.platno-obal'));

/* ---------- kreslicí pomůcky ---------- */
const W = () => canvas.clientWidth, H = () => canvas.clientHeight;

/* `odsad` posune popisek kolmo na šipku – na nakloněné rovině míří tři síly
   stejným směrem a jejich popisky by se jinak slily. */
function sipka(x, y, dx, dy, barva, popis, tloustka, odsad) {
  const d = Math.hypot(dx, dy);
  if (d < 4) return;                       // kratší šipka než hrot nedává smysl
  const x2 = x + dx, y2 = y + dy;
  const uhel = Math.atan2(dy, dx);
  const hrot = Math.min(11, d * 0.32);
  ctx.strokeStyle = barva; ctx.fillStyle = barva; ctx.lineWidth = tloustka || 3;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2 - Math.cos(uhel) * hrot * 0.6, y2 - Math.sin(uhel) * hrot * 0.6); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hrot * Math.cos(uhel - 0.42), y2 - hrot * Math.sin(uhel - 0.42));
  ctx.lineTo(x2 - hrot * Math.cos(uhel + 0.42), y2 - hrot * Math.sin(uhel + 0.42));
  ctx.closePath(); ctx.fill();
  if (popis && ukazStitky) {
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // u krátké šipky by popisek skončil na tělese – odsuneme ho na minimální odstup
    const odstup = Math.max(d, 32) + 15;
    const o = odsad || 0;
    const lx = x + Math.cos(uhel) * odstup - Math.sin(uhel) * o;
    const ly = y + Math.sin(uhel) * odstup + Math.cos(uhel) * o;
    const s = ctx.measureText(popis).width;
    ctx.fillStyle = B.pozadi; ctx.globalAlpha = .8;
    ctx.fillRect(lx - s / 2 - 3, ly - 8, s + 6, 16);
    ctx.globalAlpha = 1;
    ctx.fillStyle = barva; ctx.fillText(popis, lx, ly);
  }
}

function stitek(x, y, text, barva) {
  if (!ukazStitky) return;
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const s = ctx.measureText(text).width;
  ctx.fillStyle = B.pozadi; ctx.globalAlpha = .85;
  ctx.fillRect(x - s / 2 - 5, y - 9, s + 10, 18);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = barva; ctx.lineWidth = 1;
  ctx.strokeRect(x - s / 2 - 5, y - 9, s + 10, 18);
  ctx.fillStyle = barva; ctx.fillText(text, x, y);
}

function cistiPlochu() { ctx.fillStyle = B.pozadi; ctx.fillRect(0, 0, W(), H()); }

/* ---------- panel ---------- */
function vypisMereni(radky) {
  $('mereni').innerHTML = radky.map(r =>
    `<div class="radek${r.duraz ? ' duraz' : ''}"><span>${r.popis}</span><b>${r.hodnota}</b></div>`).join('');
}
function vypisEnergie(polozky, max) {
  $('energie').innerHTML = polozky.map(p =>
    `<div class="epruh ${p.trida}"><div class="popis"><span>${p.popis}</span><b>${p.hodnota.toFixed(2)} J</b></div>` +
    `<div class="drazka"><i style="width:${max > 0 ? Math.min(100, p.hodnota / max * 100) : 0}%"></i></div></div>`).join('');
}
/* Všechny hlášky, které se můžou objevit – v nejdelší podobě, jakou dovolí
   rozsahy posuvníků. Slouží jen k změření potřebné výšky boxu. */
const HLASKY_PRO_MERENI = [
  'Nahoře je energie <b>schovaná ve výšce</b> (fialová). Dole se celá promění na <b>pohyb</b> (oranžová).',
  'Právě teď je závaží nejrychlejší — všechna energie je v pohybu.',
  'Kyvadlo je nachystané v počáteční poloze. Nastav si délku a hmotnost a pak stiskni <b>▶️ Pustit</b>.',
  'Obě kyvadla jsou stejná — kývají naprosto souhlasně. Změň u <b>B</b> jednu hodnotu a sleduj rozdíl.',
  'Sklon 60° <b>nestačí</b> — tření (988 N) je silnější než tah dolů (888 N). Přidej sklon nad <b>42°</b>.',
  'Těleso dojelo dolů. Čím větší sklon, tím rychleji.',
  'Tah dolů (888 N) <b>přemohl</b> tření (988 N) — těleso zrychluje.',
  'Sklon už stačí (přes 42°). Stiskni <b>Pustit</b>.',
  'Sleduj čísla vlevo. <b>Hybnost</b> zůstane po srážce stejná — vždycky.',
  'Dokonale <b>pružná</b> srážka: hybnost i pohybová energie zůstaly stejné.',
  'Dokonale <b>nepružná</b> srážka: koule pokračují společně a část energie se proměnila v teplo. Hybnost se ale zachovala!',
  'Částečně pružná srážka: hybnost se zachovala, kus energie se ztratil.',
];

let merenaSirka = 0;
/* Box mění text podle situace a s ním měnil i výšku, což posouvalo celý zbytek
   panelu. Změříme proto nejvyšší možnou hlášku a výšku zafixujeme na ni.
   Bereme maximum přes všechny simulace, aby to neposkočilo ani při přepnutí. */
function ustalVyskuHlasky() {
  const sirka = $('hlaska').clientWidth;
  if (!sirka || sirka === merenaSirka) return;   // bez změny šířky není co přepočítávat
  merenaSirka = sirka;
  const vzor = document.createElement('div');
  vzor.className = 'hlaska jede';
  vzor.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;min-height:0;width:' + sirka + 'px';
  document.body.appendChild(vzor);
  let max = 0;
  for (const t of HLASKY_PRO_MERENI) {
    vzor.innerHTML = '<span>' + t + '</span>';
    // offsetHeight vrací celé pixely a nejdelší hlášku by zaokrouhlil dolů,
    // takže by o půl pixelu přetekla; rect.height je zlomkový
    max = Math.max(max, vzor.getBoundingClientRect().height);
  }
  vzor.remove();
  document.documentElement.style.setProperty('--vyska-hlasky', Math.ceil(max) + 'px');
}

function hlaska(text, trida) {
  $('hlaska').innerHTML = text ? `<div class="hlaska ${trida}"><span>${text}</span></div>` : '';
}
function legenda(polozky) {
  $('legenda').innerHTML = polozky.map(p => `<span><i style="background:${p.barva}"></i>${p.popis}</span>`).join('');
}

/* =====================================================================
   KYVADLO
   Klíčová myšlenka: perioda závisí na délce, ne na hmotnosti.
   Proto umí porovnat dvě kyvadla vedle sebe.
   ===================================================================== */
const kyvadlo = {
  a: { L: 1.2, m: 1, uhel: Math.PI / 3, omega: 0, stopa: [], tPosl: null, perioda: null, prosloDolu: 0 },
  b: { L: 0.6, m: 3, uhel: Math.PI / 3, omega: 0, stopa: [], tPosl: null, perioda: null, prosloDolu: 0 },
  dve: false, tlumeni: 0.08, cas: 0, pusteno: false,

  reset() {
    const u = Number($('kUhel').value) * Math.PI / 180;
    [this.a, this.b].forEach(k => {
      k.uhel = u; k.omega = 0; k.stopa = []; k.tPosl = null; k.perioda = null; k.prosloDolu = 0;
    });
    this.cas = 0;
    // Kyvadlo se po přípravě nerozjíždí samo – ať se dá v klidu nastavit
    // délka i hmotnost, aniž by to pokaždé odstartovalo nový pokus.
    this.pusteno = false;
  },
  krok(dt) {
    if (!this.pusteno) return;
    this.cas += dt;
    const zpracuj = k => {
      const predtim = k.uhel;
      const alfa = -(G / k.L) * Math.sin(k.uhel) - this.tlumeni * k.omega;
      k.omega += alfa * dt;
      k.uhel += k.omega * dt;
      // periodu měříme z průchodů nejnižším bodem – dva průchody = jeden kmit
      if (predtim < 0 !== k.uhel < 0) {
        k.prosloDolu++;
        if (k.tPosl !== null && k.prosloDolu % 2 === 1) k.perioda = this.cas - k.tPosl;
        if (k.prosloDolu % 2 === 1) k.tPosl = this.cas;
      }
    };
    zpracuj(this.a);
    if (this.dve) zpracuj(this.b);
  },
  energie(k) {
    const h = k.L * (1 - Math.cos(k.uhel));      // výška nad nejnižším bodem
    const v = Math.abs(k.omega) * k.L;
    return { ep: k.m * G * h, ek: 0.5 * k.m * v * v, v, h };
  },
  kresli() {
    cistiPlochu();
    const w = W(), h = H();
    // Měřítko počítáme z delšího z obou kyvadel, aby se vešla obě
    // a jejich délky se daly poctivě porovnat.
    const maxL = this.dve ? Math.max(this.a.L, this.b.L) : this.a.L;
    const mer = Math.max(28, Math.min((h - 190) / maxL, w * (this.dve ? 0.19 : 0.30)));
    // závěs posadíme tak, aby kyvadlo i šipka tíhy pod ním vyšly na střed plátna
    const py = Math.max(46, (h - maxL * mer - 96) / 2);
    const kresliJedno = (k, cx, barva, jmeno) => {
      const dl = k.L * mer;
      const bx = cx + dl * Math.sin(k.uhel), by = py + dl * Math.cos(k.uhel);
      const polomer = 10 + Math.cbrt(k.m) * 7;

      // stopa
      if (ukazStopu) {
        k.stopa.push([bx, by]);
        if (k.stopa.length > 140) k.stopa.shift();
        ctx.lineWidth = 2;
        for (let i = 1; i < k.stopa.length; i++) {
          ctx.globalAlpha = i / k.stopa.length * 0.5;
          ctx.strokeStyle = barva;
          ctx.beginPath(); ctx.moveTo(k.stopa[i - 1][0], k.stopa[i - 1][1]); ctx.lineTo(k.stopa[i][0], k.stopa[i][1]); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      // svislice a oblouk úhlu
      ctx.strokeStyle = B.slabe; ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(cx, py + dl + 30); ctx.stroke();
      ctx.setLineDash([]);
      const rOblouk = Math.min(46, dl * 0.42);
      ctx.strokeStyle = B.tlumene; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, py, rOblouk, Math.PI / 2, Math.PI / 2 + k.uhel, k.uhel < 0);
      ctx.stroke();
      // Popisek úhlu patří vedle oblouku. U krátkého závěsu by ale padl na závaží,
      // proto ho v tom případě překlopíme na druhou stranu svislice, kde je volno.
      const rPopisku = rOblouk + 18;
      let uPopisku = k.uhel / 2;
      const lx = cx + rPopisku * Math.sin(uPopisku), ly = py + rPopisku * Math.cos(uPopisku);
      if (Math.hypot(lx - bx, ly - by) < polomer + 20) uPopisku = -k.uhel / 2;
      stitek(cx + rPopisku * Math.sin(uPopisku), py + rPopisku * Math.cos(uPopisku),
        Math.abs(k.uhel * 180 / Math.PI).toFixed(0) + '°', B.tlumene);

      // závěs
      ctx.strokeStyle = B.cara; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cx - 28, py); ctx.lineTo(cx + 28, py); ctx.stroke();
      ctx.strokeStyle = barva; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(bx, by); ctx.stroke();

      // hladina nejnižšího bodu – ukazuje výšku, ze které závaží padá
      const dnoY = py + dl;
      ctx.strokeStyle = B.slabe; ctx.setLineDash([3, 6]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - dl - 20, dnoY); ctx.lineTo(cx + dl + 20, dnoY); ctx.stroke();
      ctx.setLineDash([]);

      // závaží
      ctx.fillStyle = B.teleso;
      ctx.beginPath(); ctx.arc(bx, by, polomer, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = barva; ctx.lineWidth = 2; ctx.stroke();

      const e = this.energie(k);
      if (ukazSily) {
        // Tíha a její složka kolmo k závěsu — právě ta kyvadlo rozhoupává.
        // Šipka roste s hmotností, ale je omezená, aby nepřerostla scénu.
        const tiha = k.m * G;
        const skala = Math.min(3.4, 88 / tiha);
        sipka(bx, by, 0, tiha * skala, B.tiha, 'Fɡ');
        const tang = -tiha * Math.sin(k.uhel);
        sipka(bx, by, tang * skala * Math.cos(k.uhel), -tang * skala * Math.sin(k.uhel),
          B.slozka, 'F∥', 2.5);
        const smer = k.omega >= 0 ? 1 : -1;
        sipka(bx, by, smer * e.v * 15 * Math.cos(k.uhel), -smer * e.v * 15 * Math.sin(k.uhel),
          B.rychlost, 'v', 2.5);
      }
      // Popisek dáváme k závěsu, ne k závaží — u závaží se pere s lanem i se šipkami.
      stitek(cx, py - 22, jmeno + ' · ' + k.m.toFixed(1).replace('.', ',') + ' kg · ' +
        k.L.toFixed(2).replace('.', ',') + ' m', barva);
      return e;
    };

    const ea = this.dve ? kresliJedno(this.a, w * 0.3, B.akcent, 'A') : kresliJedno(this.a, w / 2, B.akcent, 'Kyvadlo');
    let eb = null;
    if (this.dve) eb = kresliJedno(this.b, w * 0.72, B.varovani, 'B');

    // panel
    const teor = k => 2 * Math.PI * Math.sqrt(k.L / G);
    const radky = [
      { popis: 'Délka závěsu', hodnota: this.a.L.toFixed(2) + ' m' },
      { popis: 'Hmotnost', hodnota: this.a.m.toFixed(1) + ' kg' },
      { popis: 'Rychlost', hodnota: ea.v.toFixed(2) + ' m/s' },
      { popis: 'Výška nad dnem', hodnota: ea.h.toFixed(3) + ' m' },
      { popis: 'Perioda naměřená', hodnota: this.a.perioda ? this.a.perioda.toFixed(2) + ' s' : 'měřím…', duraz: true },
      { popis: 'Perioda ze vzorce', hodnota: teor(this.a).toFixed(2) + ' s', duraz: true },
    ];
    if (this.dve) {
      radky.push({ popis: '— kyvadlo B —', hodnota: '' });
      radky.push({ popis: 'B: délka / hmotnost', hodnota: this.b.L.toFixed(2) + ' m / ' + this.b.m.toFixed(1) + ' kg' });
      radky.push({ popis: 'B: perioda naměřená', hodnota: this.b.perioda ? this.b.perioda.toFixed(2) + ' s' : 'měřím…', duraz: true });
    }
    vypisMereni(radky);

    const maxE = this.a.m * G * this.a.L * (1 - Math.cos(Number($('kUhel').value) * Math.PI / 180)) || 1;
    vypisEnergie([
      { popis: 'Polohová Ep (výška)', hodnota: ea.ep, trida: 'ep' },
      { popis: 'Pohybová Ek (rychlost)', hodnota: ea.ek, trida: 'ek' },
      { popis: 'Celkem', hodnota: ea.ep + ea.ek, trida: 'ec' },
    ], maxE);

    if (!this.pusteno)
      hlaska('Kyvadlo je nachystané v počáteční poloze. Nastav si délku a hmotnost a pak stiskni <b>▶️ Pustit</b>.', 'klid');
    else if (this.dve && this.a.L === this.b.L && this.a.m === this.b.m)
      hlaska('Obě kyvadla jsou stejná — kývají naprosto souhlasně. Změň u <b>B</b> jednu hodnotu a sleduj rozdíl.', 'jede');
    else if (Math.abs(this.a.uhel) > Math.abs(this.a.omega) * 0.05)
      hlaska('Nahoře je energie <b>schovaná ve výšce</b> (fialová). Dole se celá promění na <b>pohyb</b> (oranžová).', 'jede');
    else hlaska('Právě teď je závaží nejrychlejší — všechna energie je v pohybu.', 'jede');
  }
};

/* =====================================================================
   NAKLONĚNÁ ROVINA
   Klíčová myšlenka: těleso se rozjede, až gravitační složka
   překoná tření. Kritický úhel je arctan(μ).
   ===================================================================== */
const rovina = {
  uhel: 30, mu: 0.2, m: 2, s: 0, v: 0, jede: false, delka: 4,

  reset() { this.s = 0; this.v = 0; this.jede = false; },
  kritickyUhel() { return Math.atan(this.mu) * 180 / Math.PI; },
  udrziSe() { return this.uhel <= this.kritickyUhel() + 1e-9; },
  krok(dt) {
    if (!this.jede) return;
    const th = this.uhel * Math.PI / 180;
    const a = G * (Math.sin(th) - this.mu * Math.cos(th));
    if (a <= 0 && this.v <= 0) { this.v = 0; return; }
    this.v += a * dt;
    this.s += this.v * dt;
    if (this.s >= this.delka) { this.s = this.delka; this.jede = false; }
  },
  kresli() {
    cistiPlochu();
    const w = W(), h = H();
    const th = this.uhel * Math.PI / 180;
    const mer = Math.min((w - 230) / (this.delka * Math.cos(th)), (h - 175) / Math.max(0.4, this.delka * Math.sin(th)));
    // rampu kreslíme o kousek delší než dráha, aby těleso na startu
    // stálo celou plochou na rovině a nepřečnívalo přes vrchol
    const PRESAH = 0.35;
    const dl = (this.delka + PRESAH) * mer;
    const zx = 70, zy = h - 70;                       // pata roviny
    const vx = zx + dl * Math.cos(th), vy = zy - dl * Math.sin(th);

    // klín
    ctx.fillStyle = B.akcent; ctx.globalAlpha = .10;
    ctx.beginPath(); ctx.moveTo(zx, zy); ctx.lineTo(vx, vy); ctx.lineTo(vx, zy); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = B.cara; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(zx, zy); ctx.lineTo(vx, vy); ctx.lineTo(vx, zy); ctx.closePath(); ctx.stroke();

    // vyznačení úhlu
    ctx.strokeStyle = B.tlumene; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(zx, zy, 46, -th, 0); ctx.stroke();
    stitek(zx + 66 * Math.cos(th / 2), zy - 66 * Math.sin(th / 2), this.uhel.toFixed(0) + '°', B.tlumene);

    // kritický úhel jako přerušovaná čára – hranice, kdy se to rozjede
    const kth = Math.atan(this.mu);
    ctx.strokeStyle = B.varovani; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(zx, zy); ctx.lineTo(zx + dl * 0.62 * Math.cos(kth), zy - dl * 0.62 * Math.sin(kth)); ctx.stroke();
    ctx.setLineDash([]);
    stitek(zx + dl * 0.68 * Math.cos(kth), zy - dl * 0.68 * Math.sin(kth) + 2,
      'mez ' + this.kritickyUhel().toFixed(0) + '°', B.varovani);

    // těleso
    const ujeto = (this.s + PRESAH) * mer;
    const bx = vx - ujeto * Math.cos(th), by = vy + ujeto * Math.sin(th);
    const a = 34;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(-th);
    ctx.fillStyle = B.teleso; ctx.fillRect(-a / 2, -a, a, a);
    ctx.strokeStyle = B.akcent; ctx.lineWidth = 2; ctx.strokeRect(-a / 2, -a, a, a);
    ctx.restore();

    const stred = { x: bx - a / 2 * Math.sin(th), y: by - a / 2 * Math.cos(th) };
    if (ukazSily) {
      // Šipka roste s hmotností, ale je omezená, aby nepřerostla scénu.
      // Čísla v newtonech jsou v panelu vpravo, na plátně by se popisky pletly.
      const tiha = this.m * G;
      const sk = Math.min(2.2, 92 / tiha);
      sipka(stred.x, stred.y, 0, tiha * sk, B.tiha, 'Fɡ');
      const podel = tiha * Math.sin(th);
      sipka(stred.x, stred.y, -podel * sk * Math.cos(th), podel * sk * Math.sin(th), B.slozka, 'F∥', 2.5, -20);
      const normala = tiha * Math.cos(th);
      sipka(bx, by, normala * sk * Math.sin(th), normala * sk * Math.cos(th), B.normala, 'F⊥', 2.5);
      // tření působí proti pohybu (v klidu nanejvýš vyrovná složku tíhy)
      const treni = this.jede && this.v > 0 ? this.mu * normala : Math.min(this.mu * normala, podel);
      sipka(bx, by, treni * sk * Math.cos(th), -treni * sk * Math.sin(th), B.treni, 'Ft', 2.5, 20);
      if (this.v > 0) {
        // odsazení kolmo k rovině, aby šipka rychlosti nesplývala s F∥
        const odsazeni = a + 30;
        sipka(bx + odsazeni * Math.sin(th), by - odsazeni * Math.cos(th),
          -this.v * 20 * Math.cos(th), this.v * 20 * Math.sin(th), B.rychlost, 'v', 2.5);
      }
    }

    // panel
    const th_ = th;
    const podel = this.m * G * Math.sin(th_), maxTreni = this.mu * this.m * G * Math.cos(th_);
    const vyska = (this.delka - this.s) * Math.sin(th_);
    const ep = this.m * G * vyska, ek = 0.5 * this.m * this.v * this.v;
    const epStart = this.m * G * this.delka * Math.sin(th_);
    vypisMereni([
      { popis: 'Sklon', hodnota: this.uhel.toFixed(0) + '°' },
      { popis: 'Kritický (mezní) úhel', hodnota: this.kritickyUhel().toFixed(1) + '°', duraz: true },
      { popis: 'Tíha Fɡ', hodnota: (this.m * G).toFixed(1) + ' N' },
      { popis: 'F∥ — táhne dolů', hodnota: podel.toFixed(1) + ' N' },
      { popis: 'F⊥ — tlačí do roviny', hodnota: (this.m * G * Math.cos(th_)).toFixed(1) + ' N' },
      { popis: 'Největší možné tření Ft', hodnota: maxTreni.toFixed(1) + ' N' },
      { popis: 'Rychlost', hodnota: this.v.toFixed(2) + ' m/s' },
      { popis: 'Ujetá dráha', hodnota: this.s.toFixed(2) + ' m' },
    ]);
    vypisEnergie([
      { popis: 'Polohová Ep', hodnota: ep, trida: 'ep' },
      { popis: 'Pohybová Ek', hodnota: ek, trida: 'ek' },
      { popis: 'Spotřebovalo tření', hodnota: Math.max(0, epStart - ep - ek), trida: 'ztrata' },
    ], epStart || 1);

    if (this.udrziSe())
      hlaska(`Sklon ${this.uhel.toFixed(0)}° <b>nestačí</b> — tření (${maxTreni.toFixed(0)} N) je silnější než tah dolů (${podel.toFixed(0)} N). Přidej sklon nad <b>${this.kritickyUhel().toFixed(0)}°</b>.`, 'klid');
    else if (this.s >= this.delka) hlaska('Těleso dojelo dolů. Čím větší sklon, tím rychleji.', 'jede');
    else if (this.jede) hlaska(`Tah dolů (${podel.toFixed(0)} N) <b>přemohl</b> tření (${maxTreni.toFixed(0)} N) — těleso zrychluje.`, 'jede');
    else hlaska(`Sklon už stačí (přes ${this.kritickyUhel().toFixed(0)}°). Stiskni <b>Pustit</b>.`, 'jede');
  }
};

/* =====================================================================
   SRÁŽKY
   Klíčová myšlenka: hybnost se zachová vždycky,
   pohybová energie jen při dokonale pružné srážce.
   ===================================================================== */
const srazky = {
  m1: 2, m2: 1, u1: 2, u2: -1, e: 1,
  x1: 0, x2: 0, v1: 0, v2: 0, srazilo: false, pred: null, po: null,

  reset() {
    this.m1 = Number($('sM1').value); this.m2 = Number($('sM2').value);
    this.u1 = Number($('sV1').value); this.u2 = Number($('sV2').value);
    this.e = Number($('sE').value) / 100;
    this.v1 = this.u1; this.v2 = this.u2;
    this.x1 = 1.5; this.x2 = 6.5;
    this.srazilo = false;
    this.pred = { p: this.m1 * this.u1 + this.m2 * this.u2, ek: 0.5 * this.m1 * this.u1 ** 2 + 0.5 * this.m2 * this.u2 ** 2 };
    this.po = null;
  },
  polomer(m) { return 0.12 + Math.cbrt(m) * 0.10; },
  krok(dt) {
    this.x1 += this.v1 * dt;
    this.x2 += this.v2 * dt;
    const r1 = this.polomer(this.m1), r2 = this.polomer(this.m2);
    // mantinely, aby koule nezmizely ze scény
    if (this.x1 - r1 < 0.2) { this.x1 = 0.2 + r1; this.v1 = Math.abs(this.v1); }
    if (this.x2 + r2 > 7.8) { this.x2 = 7.8 - r2; this.v2 = -Math.abs(this.v2); }
    if (this.x2 - this.x1 < r1 + r2 && this.v1 > this.v2) {
      // obecná srážka s koeficientem restituce e (1 = pružná, 0 = dokonale nepružná)
      const { m1, m2, v1: a, v2: b, e } = this;
      const p = m1 * a + m2 * b;
      this.v1 = (p + m2 * e * (b - a)) / (m1 + m2);
      this.v2 = (p + m1 * e * (a - b)) / (m1 + m2);
      const prekryv = (r1 + r2) - (this.x2 - this.x1);
      this.x1 -= prekryv / 2; this.x2 += prekryv / 2;
      this.srazilo = true;
      this.po = { p: m1 * this.v1 + m2 * this.v2, ek: 0.5 * m1 * this.v1 ** 2 + 0.5 * m2 * this.v2 ** 2 };
    }
  },
  kresli() {
    cistiPlochu();
    const w = W(), h = H();
    const mer = w / 8;                     // scéna je 8 metrů široká
    const podlahaY = h * 0.62;

    // podlaha a měřítko
    ctx.strokeStyle = B.cara; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, podlahaY + 46); ctx.lineTo(w, podlahaY + 46); ctx.stroke();
    ctx.strokeStyle = B.slabe; ctx.lineWidth = 1; ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = B.slabe;
    for (let i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(i * mer, podlahaY + 46); ctx.lineTo(i * mer, podlahaY + 54); ctx.stroke();
      if (i % 2 === 0) {
        ctx.textAlign = i === 0 ? 'left' : i === 8 ? 'right' : 'center';
        ctx.fillText(i + ' m', i === 0 ? 3 : i === 8 ? w - 3 : i * mer, podlahaY + 68);
      }
    }

    // Popisky se u blízkých koulí překrývaly – druhý proto posuneme výš.
    const blizko = Math.abs(this.x2 - this.x1) * mer < 150;
    const kresliKouli = (x, v, m, barva, jmeno, vyssiStitek) => {
      const r = this.polomer(m) * mer;
      const px = x * mer;
      ctx.fillStyle = barva;
      ctx.beginPath(); ctx.arc(px, podlahaY, r, 0, Math.PI * 2); ctx.fill();
      if (ukazSily) {
        // stojící koule je taky informace – jinak to vypadá, že se šipka ztratila
        if (Math.abs(v) < 0.05) stitek(px, podlahaY + r + 16, 'v = 0', B.rychlost);
        else sipka(px, podlahaY, v * 30, 0, B.rychlost, v.toFixed(1).replace('.', ',') + ' m/s', 3);
      }
      stitek(px, podlahaY - r - (vyssiStitek ? 40 : 18),
        jmeno + ' ' + m.toFixed(1).replace('.', ',') + ' kg', barva);
      return r;
    };
    kresliKouli(this.x1, this.v1, this.m1, B.teleso2, 'modrá', false);
    kresliKouli(this.x2, this.v2, this.m2, B.chyba, 'červená', blizko);

    /* Hybnost před a teď kreslíme nad sebe stejným měřítkem.
       Že jsou šipky pořád stejně dlouhé, je názornější než číslo v tabulce. */
    if (ukazSily) {
      const pTed = this.m1 * this.v1 + this.m2 * this.v2;
      const skalaP = Math.min(26, (w * 0.32) / Math.max(0.5, Math.abs(this.pred.p)));
      const x0 = w * 0.5, y0 = h * 0.14;
      ctx.font = '600 12px system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = B.tlumene;
      ctx.fillText('hybnost před srážkou', 16, y0);
      ctx.fillText('hybnost teď', 16, y0 + 34);
      ctx.strokeStyle = B.slabe; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(x0, y0 - 14); ctx.lineTo(x0, y0 + 48); ctx.stroke();
      ctx.setLineDash([]);
      sipka(x0, y0, this.pred.p * skalaP, 0, B.tlumene, this.pred.p.toFixed(1).replace('.', ',') + ' kg·m/s', 3);
      sipka(x0, y0 + 34, pTed * skalaP, 0,
        Math.abs(pTed - this.pred.p) < 1e-6 ? B.ok : B.chyba,
        pTed.toFixed(1).replace('.', ',') + ' kg·m/s', 3);
    }

    const p = this.m1 * this.v1 + this.m2 * this.v2;
    const ek = 0.5 * this.m1 * this.v1 ** 2 + 0.5 * this.m2 * this.v2 ** 2;
    vypisMereni([
      { popis: 'Rychlost modré', hodnota: this.v1.toFixed(2) + ' m/s' },
      { popis: 'Rychlost červené', hodnota: this.v2.toFixed(2) + ' m/s' },
      { popis: 'Hybnost před', hodnota: this.pred.p.toFixed(2) + ' kg·m/s' },
      { popis: 'Hybnost teď', hodnota: p.toFixed(2) + ' kg·m/s', duraz: true },
      { popis: 'Pohyb. energie před', hodnota: this.pred.ek.toFixed(2) + ' J' },
      { popis: 'Pohyb. energie teď', hodnota: ek.toFixed(2) + ' J', duraz: true },
    ]);
    vypisEnergie([
      { popis: 'Energie před srážkou', hodnota: this.pred.ek, trida: 'ec' },
      { popis: 'Energie teď', hodnota: ek, trida: 'ek' },
      { popis: 'Ztraceno (teplo, zvuk)', hodnota: Math.max(0, this.pred.ek - ek), trida: 'ztrata' },
    ], this.pred.ek || 1);

    if (!this.srazilo) hlaska('Sleduj čísla vlevo. <b>Hybnost</b> zůstane po srážce stejná — vždycky.', 'jede');
    else if (this.e >= 0.99) hlaska('Dokonale <b>pružná</b> srážka: hybnost i pohybová energie zůstaly stejné.', 'jede');
    else if (this.e <= 0.01) hlaska('Dokonale <b>nepružná</b> srážka: koule pokračují společně a část energie se proměnila v teplo. Hybnost se ale zachovala!', 'klid');
    else hlaska('Částečně pružná srážka: hybnost se zachovala, kus energie se ztratil.', 'klid');
  }
};

  rovina: {

    legenda: [
      { barva: '#ef5350', popis: 'Fɡ — tíha' },
      { barva: '#ab47bc', popis: 'F∥ — táhne dolů po rovině' },
      { barva: '#26a69a', popis: 'F⊥ — tlačí do roviny' },
      { barva: '#8d6e63', popis: 'Ft — tření' },
      { barva: '#42a5f5', popis: 'v — rychlost' },
    ],
  },
  srazky: {
    vyklad: '<b>Srážka dvou těles.</b> <b>Hybnost</b> (hmotnost × rychlost) se zachová při <i>každé</i> srážce. ' +
      '<b>Pohybová energie</b> se zachová jen u dokonale pružné srážky — jinak se část promění v teplo a zvuk.',
    otazka: '<div class="nadpis">🤔 Zkus si</div>Dej oběma koulím <b>stejnou hmotnost</b> a nech je srazit ' +
      'při plné pružnosti. Co se stane s jejich rychlostmi? A co když stáhneš pružnost na nulu?',
    legenda: [
      { barva: '#42a5f5', popis: 'rychlost' }, { barva: '#6aa6fd', popis: 'modrá koule' },
      { barva: '#e05d5d', popis: 'červená koule' },
    ],
  },
};

function postavOvladani() {
  const o = $('ovladani');
  if (sim === 'kyvadlo') {
    o.innerHTML = `
      <div class="kyvadla jedno" id="kMrizka">
        <label class="delka-a"><span class="znacka a" aria-hidden="true">A</span> Délka závěsu
          <input type="range" id="kDelka" min="30" max="200" value="120"><b id="kDelkaV">1,20 m</b></label>
        <label class="hmota-a"><span class="znacka a" aria-hidden="true">A</span> Hmotnost
          <input type="range" id="kHmota" min="1" max="80" value="10"><b id="kHmotaV">1,0 kg</b></label>
        <label class="delka-b radek-b"><span class="znacka b" aria-hidden="true">B</span> Délka závěsu
          <input type="range" id="kDelkaB" min="30" max="200" value="60"><b id="kDelkaBV">0,60 m</b></label>
        <label class="hmota-b radek-b"><span class="znacka b" aria-hidden="true">B</span> Hmotnost
          <input type="range" id="kHmotaB" min="1" max="80" value="30"><b id="kHmotaBV">3,0 kg</b></label>
      </div>
      <label>Počáteční úhel <input type="range" id="kUhel" min="5" max="80" value="60"><b id="kUhelV">60°</b></label>
      <div class="oddel"></div>
      <button id="kDve">🪀🪀 Porovnat dvě kyvadla</button>
      <button id="kStejne" style="display:none"
        title="Nastaví kyvadlu B stejnou délku i hmotnost jako A – dobrý výchozí bod, než začneš měnit jednu věc">⧉ B jako A</button>
      <button id="kTlum" class="zap">💨 Tlumení</button>
      <div class="oddel"></div>
      <button id="kPustit" class="hlavni"
        title="Pustí nebo zastaví kyvadlo. (Pauza v liště níž zmrazí celou scénu včetně času.)">▶️ Pustit</button>
      <button id="kReset" title="Vrátí závaží do počáteční polohy">🔄 Nahoru</button>`;
    const obnov = () => {
      kyvadlo.a.L = Number($('kDelka').value) / 100;
      kyvadlo.a.m = Number($('kHmota').value) / 10;
      kyvadlo.b.L = Number($('kDelkaB').value) / 100;
      kyvadlo.b.m = Number($('kHmotaB').value) / 10;
      $('kDelkaV').textContent = kyvadlo.a.L.toFixed(2).replace('.', ',') + ' m';
      $('kHmotaV').textContent = kyvadlo.a.m.toFixed(1).replace('.', ',') + ' kg';
      $('kUhelV').textContent = $('kUhel').value + '°';
      $('kDelkaBV').textContent = kyvadlo.b.L.toFixed(2).replace('.', ',') + ' m';
      $('kHmotaBV').textContent = kyvadlo.b.m.toFixed(1).replace('.', ',') + ' kg';
    };
    // změna kteréhokoli parametru kyvadlo jen připraví, nespustí
    const prekresliTlacitko = () => {
      $('kPustit').textContent = kyvadlo.pusteno ? '✋ Zastavit' : '▶️ Pustit';
      $('kPustit').classList.toggle('hlavni', !kyvadlo.pusteno);
    };
    const znovuPriprav = () => { obnov(); kyvadlo.reset(); prekresliTlacitko(); };
    ['kDelka', 'kHmota', 'kDelkaB', 'kHmotaB', 'kUhel'].forEach(id => $(id).oninput = znovuPriprav);
    $('kDve').onclick = () => {
      kyvadlo.dve = !kyvadlo.dve;
      $('kDve').classList.toggle('zap', kyvadlo.dve);
      $('kMrizka').classList.toggle('jedno', !kyvadlo.dve);
      $('kStejne').style.display = kyvadlo.dve ? '' : 'none';
      kyvadlo.reset();
      prekresliTlacitko();
    };
    $('kStejne').onclick = () => {
      // úhel mají obě kyvadla společný, takže zkopírováním délky a hmotnosti
      // se z nich stanou naprosto shodná kyvadla
      $('kDelkaB').value = $('kDelka').value;
      $('kHmotaB').value = $('kHmota').value;
      znovuPriprav();
    };
    $('kTlum').onclick = () => {
      kyvadlo.tlumeni = kyvadlo.tlumeni > 0 ? 0 : 0.08;
      $('kTlum').classList.toggle('zap', kyvadlo.tlumeni > 0);
    };
    $('kPustit').onclick = () => { kyvadlo.pusteno = !kyvadlo.pusteno; prekresliTlacitko(); };
    $('kReset').onclick = () => { kyvadlo.reset(); prekresliTlacitko(); };
    obnov(); kyvadlo.reset(); prekresliTlacitko();
  } else if (sim === 'rovina') {
    o.innerHTML = `
      <label>Sklon <input type="range" id="rUhel" min="0" max="60" value="30"><b id="rUhelV">30°</b></label>
      <label>Tření <input type="range" id="rMu" min="0" max="90" value="20"><b id="rMuV">0,20</b></label>
      <label>Hmotnost <input type="range" id="rHmota" min="5" max="100" value="20"><b id="rHmotaV">2,0 kg</b></label>
      <div class="oddel"></div>
      <button id="rStart">▶️ Pustit</button>
      <button id="rReset">🔄 Nahoru</button>`;
    const obnov = () => {
      rovina.uhel = Number($('rUhel').value);
      rovina.mu = Number($('rMu').value) / 100;
      rovina.m = Number($('rHmota').value) / 10;
      $('rUhelV').textContent = rovina.uhel + '°';
      $('rMuV').textContent = rovina.mu.toFixed(2).replace('.', ',');
      $('rHmotaV').textContent = rovina.m.toFixed(1).replace('.', ',') + ' kg';
    };
    ['rUhel', 'rMu', 'rHmota'].forEach(id => $(id).oninput = () => { obnov(); rovina.reset(); });
    $('rStart').onclick = () => { rovina.jede = true; };
    $('rReset').onclick = () => rovina.reset();
    obnov(); rovina.reset();
  } else {
    o.innerHTML = `
      <label>Modrá m₁ <input type="range" id="sM1" min="0.5" max="5" step="0.5" value="2"><b id="sM1V">2,0 kg</b></label>
      <label>Modrá v₁ <input type="range" id="sV1" min="0" max="4" step="0.5" value="2"><b id="sV1V">2,0 m/s</b></label>
      <label>Červená m₂ <input type="range" id="sM2" min="0.5" max="5" step="0.5" value="1"><b id="sM2V">1,0 kg</b></label>
      <label>Červená v₂ <input type="range" id="sV2" min="-4" max="0" step="0.5" value="-1"><b id="sV2V">−1,0 m/s</b></label>
      <label>Pružnost <input type="range" id="sE" min="0" max="100" value="100"><b id="sEV">100 %</b></label>
      <div class="oddel"></div>
      <button id="sReset">🔄 Znovu</button>`;
    const obnov = () => {
      $('sM1V').textContent = Number($('sM1').value).toFixed(1).replace('.', ',') + ' kg';
      $('sM2V').textContent = Number($('sM2').value).toFixed(1).replace('.', ',') + ' kg';
      $('sV1V').textContent = Number($('sV1').value).toFixed(1).replace('.', ',') + ' m/s';
      $('sV2V').textContent = Number($('sV2').value).toFixed(1).replace('.', ',').replace('-', '−') + ' m/s';
      $('sEV').textContent = $('sE').value + ' %';
    };
    ['sM1', 'sV1', 'sM2', 'sV2', 'sE'].forEach(id => $(id).oninput = () => { obnov(); srazky.reset(); });
    $('sReset').onclick = () => srazky.reset();
    obnov(); srazky.reset();
  }
  $('vyklad').innerHTML = VYKLADY[sim].vyklad;
  $('otazka').innerHTML = VYKLADY[sim].otazka;
  legenda(VYKLADY[sim].legenda);
}

/* ---------- běh ---------- */
const SIMY = { kyvadlo, rovina, srazky };
let posledni = null;

function smycka(t) {
  if (posledni === null) posledni = t;
  let dt = Math.min(0.033, (t - posledni) / 1000);
  posledni = t;
  if (!bezi) { if (krokuj > 0) { krokuj--; dt = 0.016; } else dt = 0; }
  SIMY[sim].krok(dt * tempo);
  SIMY[sim].kresli();
  requestAnimationFrame(smycka);
}

$('tabs').onclick = e => {
  const b = e.target.closest('button[data-sim]');
  if (!b) return;
  $('tabs').querySelectorAll('button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  sim = b.dataset.sim;
  postavOvladani();
};
$('btnPauza').onclick = () => {
  bezi = !bezi;
  $('btnPauza').textContent = bezi ? '⏸️ Pauza' : '▶️ Pokračovat';
  $('btnPauza').classList.toggle('zap', !bezi);
};
$('btnKrok').onclick = () => { bezi = false; $('btnPauza').textContent = '▶️ Pokračovat'; $('btnPauza').classList.add('zap'); krokuj = 6; };
$('tempo').onclick = e => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  tempo = Number(b.dataset.t);
  $('tempo').querySelectorAll('button').forEach(x => x.classList.toggle('zap', x === b));
};
const prepni = (id, nastav) => $(id).onclick = () => { nastav(); $(id).classList.toggle('zap'); };
prepni('btnSily', () => ukazSily = !ukazSily);
prepni('btnStopa', () => { ukazStopu = !ukazStopu; kyvadlo.a.stopa = []; kyvadlo.b.stopa = []; });
prepni('btnStitky', () => ukazStitky = !ukazStitky);
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); $('btnPauza').click(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); $('btnKrok').click(); }
});

window.addEventListener('DOMContentLoaded', () => {
  rozmer();
  ustalVyskuHlasky();
  if (window.ResizeObserver) new ResizeObserver(ustalVyskuHlasky).observe($('hlaska'));
  postavOvladani();
  requestAnimationFrame(smycka);
});
</script>
</body>
</html>
