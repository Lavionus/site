<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jehlan, kužel a koule</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../uloha.js"></script>
  <style>
    .teleso { width: min(280px, 74%); }
    .teleso .plocha3d { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
    .teleso .zadni { fill: none; stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 5 4; }
    .teleso .vyska { stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: 6 4; }
    .teleso .popis { fill: var(--text-muted); font-size: 13px; text-anchor: middle; }
    .uloha-text { max-width: 640px; font-size: 1.02rem; line-height: 1.6; }
    .uloha-text b { color: var(--accent); }
    .vzorec { font-family: 'Courier New', monospace; color: var(--text-muted); font-size: 0.93rem; line-height: 1.7; }

    /* ---- interaktivní režimy ---- */
    .scena { width: min(520px, 100%); touch-action: none; }
    .scena .plast { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
    .scena .podstava { fill: rgba(230,170,60,0.28); stroke: var(--warn); stroke-width: 2.5; }
    .scena .zadni { fill: none; stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 5 4; }
    .scena .vyska { stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: 6 4; }
    .scena .strana { stroke: var(--ok); stroke-width: 2.5; }
    .scena .obal { fill: none; stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 4 4; }
    .scena .voda { fill: rgba(70,150,250,0.5); }
    .scena .hladina { fill: rgba(150,205,255,0.8); }
    .scena .hladina-pruh { fill: rgba(170,215,255,0.85); }
    .scena .proud { fill: rgba(95,170,255,0.7); }
    .scena .kapka { fill: rgba(160,210,255,0.9); }
    .scena .cakanec { fill: none; stroke: rgba(160,210,255,0.7); stroke-width: 1.6; }
    .scena .kohout { fill: var(--border-strong); }
    .scena .ryska { stroke: var(--text-faint); stroke-width: 1.4; stroke-dasharray: 3 4; }
    .scena .ryska-text { fill: var(--text-faint); font-size: 11px; }
    .scena .mira { stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 5; opacity: 0.7; }
    .ovladace button:disabled { opacity: 0.42; cursor: default; border-color: var(--border); }
    .vypocet .pomer .vysledek { color: var(--warn); }
    .scena .popis { fill: var(--text-muted); font-size: 12px; text-anchor: middle; }
    .scena .popis.v { fill: var(--warn); }
    .scena .popis.s { fill: var(--ok); }
    .scena .popis.vlevo { text-anchor: start; }

    .ovladace {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      align-items: center; justify-content: center; max-width: 560px;
    }
    .ovladace label {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px; font-size: 0.8rem; color: var(--text-muted);
    }
    .ovladace input[type=range] { width: 120px; accent-color: var(--accent); }
    .ovladace .hodnota {
      color: var(--text); font-weight: 600; min-width: 3.2em;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .ovladace button {
      background: var(--bg-control); border: 1px solid var(--border-strong); color: var(--text);
      border-radius: 8px; padding: 7px 14px; font-size: 0.82rem; font-family: inherit; cursor: pointer;
    }
    .ovladace button:hover { border-color: var(--accent); }

    .prepinac-tvar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .prepinac-tvar button {
      background: var(--bg-control); border: 1px solid var(--border-strong); color: var(--text-muted);
      border-radius: 6px; padding: 5px 12px; font-size: 0.8rem; font-family: inherit; cursor: pointer;
    }
    .prepinac-tvar button:hover { border-color: var(--accent); color: var(--text); }
    .prepinac-tvar button.zap { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Živý výpočet – dosazení do vzorce krok za krokem */
    .vypocet {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px; width: min(520px, 100%);
    }
    .vypocet .karticka {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px; text-align: left;
    }
    .vypocet .nadpis { color: var(--text-faint); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .vypocet .radek {
      font-family: 'Courier New', monospace; font-size: 0.85rem;
      color: var(--text-muted); margin-top: 3px; word-break: break-word;
    }
    .vypocet .vysledek { color: var(--text); font-weight: 700; font-size: 1.05rem; }
    .vypocet .objem .vysledek { color: var(--accent); }
    .vypocet .povrch .vysledek { color: var(--ok); }
    @media (max-width: 520px) { .vypocet { grid-template-columns: 1fr; } }

    .vysvetlivka { color: var(--text-faint); font-size: 0.8rem; max-width: 520px; line-height: 1.5; }
    .vysvetlivka b { color: var(--text-muted); }
  </style>
</head>
<body>
  <h1>🔻 Jehlan, kužel a koule</h1>
  <p class="podtitul">Pro 9. ročník: objem a povrch prostorových těles.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="modelarna" class="active">🔬 Modelárna</button>
    <button data-rezim="site">📐 Rozbal síť</button>
    <button data-rezim="tretina">💧 Proč třetina</button>
    <button data-rezim="jehlan">🔻 Jehlan</button>
    <button data-rezim="kuzel">🍦 Kužel</button>
    <button data-rezim="koule">⚽ Koule</button>
    <button data-rezim="vzorce">📋 Poznej vzorec</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Jehlan: <b>V = ⅓ · S<sub>p</sub> · v</b> &nbsp;·&nbsp; kužel: <b>V = ⅓ · πr² · v</b>,
    <b>S = πr² + πrs</b> &nbsp;·&nbsp; koule: <b>V = 4/3 · πr³</b>, <b>S = 4πr²</b>.
    Písmeno <b>s</b> značí stranu (výšku pláště) kužele, <b>v</b> je kolmá výška tělesa.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_m9_jehlan_kuzel', $('skore'));
let rezim = 'modelarna';
const PI = 3.14;
const fmt = x => Number(Number(x).toFixed(2)).toLocaleString('cs-CZ');
const fmt1 = x => Number(Number(x).toFixed(1)).toLocaleString('cs-CZ');
function odezvaEl() { const d = document.createElement('div'); d.className = 'odezva'; return d; }

/* ============================================================
   Režim 1: Modelárna – posuvníky mění těleso i dosazení do vzorce.
   ============================================================ */
const model = { tvar: 'kuzel', r: 5, v: 9 };

function modelarna() {
  const p = $('plocha');
  p.innerHTML = `
    <div class="zadani uloha-text">Posuvníky měň rozměry tělesa. Obrázek i dosazení
      do vzorce se přepočítají <b>okamžitě</b> — zkus najít, kdy vyjde objem větší než povrch.</div>
    <div class="prepinac-tvar" id="tvary">
      <button data-tvar="jehlan">🔻 Jehlan</button>
      <button data-tvar="kuzel" class="zap">🍦 Kužel</button>
      <button data-tvar="koule">⚽ Koule</button>
    </div>
    <svg class="scena" id="scena" viewBox="0 0 420 260" role="img" aria-label="Model telesa"></svg>
    <div class="ovladace" id="posuvniky"></div>
    <div class="vypocet">
      <div class="karticka objem"><div class="nadpis">Objem V</div>
        <div class="radek" id="vzorecV"></div>
        <div class="radek" id="dosazeniV"></div>
        <div class="radek vysledek" id="vysledekV"></div></div>
      <div class="karticka povrch"><div class="nadpis">Povrch S</div>
        <div class="radek" id="vzorecS"></div>
        <div class="radek" id="dosazeniS"></div>
        <div class="radek vysledek" id="vysledekS"></div></div>
    </div>
    <p class="vysvetlivka">Počítáme s <b>π = 3,14</b>. Výška <b>v</b> je oranžová,
      strana kužele <b>s</b> zelená — a dopočítá se Pythagorovou větou z r a v.</p>`;

  $('tvary').addEventListener('click', e => {
    const b = e.target.closest('button[data-tvar]');
    if (!b) return;
    model.tvar = b.dataset.tvar;
    $('tvary').querySelectorAll('button').forEach(x => x.classList.toggle('zap', x === b));
    postavPosuvniky();
    prekresliModel();
  });
  postavPosuvniky();
  prekresliModel();
}

function postavPosuvniky() {
  const jeKoule = model.tvar === 'koule';
  const popisR = model.tvar === 'jehlan' ? '📏 Hrana a' : '📏 Poloměr r';
  // koule se kreslí celá, takže se do plátna vejde menší poloměr než u ostatních těles
  const maxR = jeKoule ? 10 : 12;
  if (model.r > maxR) model.r = maxR;
  $('posuvniky').innerHTML =
    `<label>${popisR}
       <input type="range" id="posR" min="2" max="${maxR}" step="0.5" value="${model.r}">
       <span class="hodnota" id="hodR"></span></label>` +
    (jeKoule ? '' :
    `<label>📐 Výška v
       <input type="range" id="posV" min="2" max="16" step="0.5" value="${model.v}">
       <span class="hodnota" id="hodV"></span></label>`);
  $('posR').addEventListener('input', e => { model.r = +e.target.value; prekresliModel(); });
  if (!jeKoule) $('posV').addEventListener('input', e => { model.v = +e.target.value; prekresliModel(); });
}

/* Kreslení drží stálé měřítko, aby bylo poznat, že se těleso opravdu zvětšuje. */
const MER = 11, ZEM = 214, STRED = 200;

function prekresliModel() {
  const { tvar, r, v } = model;
  const rp = r * MER, vp = v * MER;
  let svg = '', vzorecV, dosazeniV, hodnotaV, vzorecS, dosazeniS, hodnotaS;

  if (tvar === 'jehlan') {
    const a = r, ap = rp;                       // u jehlanu je „r“ hrana podstavy a
    const hs = Math.sqrt((a / 2) * (a / 2) + v * v);   // výška stěny (apotéma)
    const V = a * a * v / 3, S = a * a + 2 * a * hs;
    const x1 = STRED - ap / 2, x2 = STRED + ap / 2;
    const hloubka = ap * 0.42;
    svg = `<polygon class="podstava" points="${x1},${ZEM} ${x2},${ZEM}
             ${x2 + hloubka},${ZEM - hloubka * 0.55} ${x1 + hloubka},${ZEM - hloubka * 0.55}"/>
      <polygon class="plast" points="${STRED + hloubka / 2},${ZEM - vp - hloubka * 0.28}
             ${x1},${ZEM} ${x2},${ZEM}"/>
      <line class="zadni" x1="${STRED + hloubka / 2}" y1="${ZEM - vp - hloubka * 0.28}"
            x2="${x2 + hloubka}" y2="${ZEM - hloubka * 0.55}"/>
      <line class="zadni" x1="${STRED + hloubka / 2}" y1="${ZEM - vp - hloubka * 0.28}"
            x2="${x1 + hloubka}" y2="${ZEM - hloubka * 0.55}"/>
      <line class="vyska" x1="${STRED + hloubka / 2}" y1="${ZEM - vp - hloubka * 0.28}"
            x2="${STRED + hloubka / 2}" y2="${ZEM - hloubka * 0.28}"/>
      <text class="popis v" x="${STRED + hloubka / 2 + 22}" y="${ZEM - vp / 2}">v = ${fmt1(v)}</text>
      <text class="popis" x="${STRED}" y="${ZEM + 20}">a = ${fmt1(a)}</text>`;
    vzorecV = 'V = ⅓ · a² · v';
    dosazeniV = `= ⅓ · ${fmt1(a)}² · ${fmt1(v)}`;
    hodnotaV = `V = ${fmt(V)} cm³`;
    vzorecS = 'S = a² + 2 · a · v_s';
    dosazeniS = `= ${fmt1(a)}² + 2 · ${fmt1(a)} · ${fmt(hs)}`;
    hodnotaS = `S = ${fmt(S)} cm²`;
  } else if (tvar === 'kuzel') {
    const s = Math.sqrt(r * r + v * v);
    const V = PI * r * r * v / 3, S = PI * r * r + PI * r * s;
    const ry = rp * 0.3;
    svg = `<path class="plast" d="M${STRED} ${ZEM - vp} L${STRED - rp} ${ZEM}
             A${rp} ${ry} 0 0 0 ${STRED + rp} ${ZEM} Z"/>
      <ellipse class="zadni" cx="${STRED}" cy="${ZEM}" rx="${rp}" ry="${ry}"/>
      <line class="vyska" x1="${STRED}" y1="${ZEM - vp}" x2="${STRED}" y2="${ZEM}"/>
      <line class="strana" x1="${STRED}" y1="${ZEM - vp}" x2="${STRED + rp}" y2="${ZEM}"/>
      <line class="podstava" x1="${STRED}" y1="${ZEM}" x2="${STRED + rp}" y2="${ZEM}"/>
      <text class="popis v" x="${STRED - 42}" y="${ZEM - vp / 2}">v = ${fmt1(v)}</text>
      <text class="popis s" x="${STRED + rp / 2 + 30}" y="${ZEM - vp / 2 - 4}">s = ${fmt(s)}</text>
      <text class="popis" x="${STRED + rp / 2}" y="${ZEM + 32}">r = ${fmt1(r)}</text>`;
    vzorecV = 'V = ⅓ · π · r² · v';
    dosazeniV = `= ⅓ · 3,14 · ${fmt1(r)}² · ${fmt1(v)}`;
    hodnotaV = `V = ${fmt(V)} cm³`;
    vzorecS = 'S = πr² + πrs';
    dosazeniS = `= 3,14·${fmt1(r)}² + 3,14·${fmt1(r)}·${fmt(s)}`;
    hodnotaS = `S = ${fmt(S)} cm²`;
  } else {
    const V = 4 / 3 * PI * r * r * r, S = 4 * PI * r * r;
    const cy = ZEM - rp;
    svg = `<circle class="plast" cx="${STRED}" cy="${cy}" r="${rp}"/>
      <ellipse class="zadni" cx="${STRED}" cy="${cy}" rx="${rp}" ry="${rp * 0.3}"/>
      <line class="strana" x1="${STRED}" y1="${cy}" x2="${STRED + rp}" y2="${cy}"/>
      <text class="popis s" x="${STRED + rp / 2}" y="${cy - 8}">r = ${fmt1(r)}</text>`;
    vzorecV = 'V = 4/3 · π · r³';
    dosazeniV = `= 4/3 · 3,14 · ${fmt1(r)}³`;
    hodnotaV = `V = ${fmt(V)} cm³`;
    vzorecS = 'S = 4 · π · r²';
    dosazeniS = `= 4 · 3,14 · ${fmt1(r)}²`;
    hodnotaS = `S = ${fmt(S)} cm²`;
  }

  $('scena').innerHTML = svg;
  $('vzorecV').textContent = vzorecV;
  $('dosazeniV').textContent = dosazeniV;
  $('vysledekV').textContent = hodnotaV;
  $('vzorecS').textContent = vzorecS;
  $('dosazeniS').textContent = dosazeniS;
  $('vysledekS').textContent = hodnotaS;
  $('hodR').textContent = fmt1(model.r) + ' cm';
  if ($('hodV')) $('hodV').textContent = fmt1(model.v) + ' cm';
}

/* ============================================================
   Režim 2: Rozbal síť – plášť se posuvníkem odklopí do roviny.
   ============================================================ */
const sit = { tvar: 'kuzel', rozbaleni: 0 };

function site() {
  const p = $('plocha');
  p.innerHTML = `
    <div class="zadani uloha-text">Posuvníkem těleso <b>rozbal do sítě</b> a podívej se,
      z čeho je vlastně složený jeho povrch.</div>
    <div class="prepinac-tvar" id="tvarySite">
      <button data-tvar="jehlan">🔻 Jehlan</button>
      <button data-tvar="kuzel" class="zap">🍦 Kužel</button>
    </div>
    <svg class="scena" id="scenaSit" viewBox="0 0 420 300" role="img" aria-label="Sit telesa"></svg>
    <div class="ovladace">
      <label>📐 Rozbalení
        <input type="range" id="posSit" min="0" max="100" step="1" value="${sit.rozbaleni}">
        <span class="hodnota" id="hodSit"></span>
      </label>
      <button id="btnAnimace">▶️ Rozbalit</button>
    </div>
    <p class="vysvetlivka" id="popisSite"></p>`;

  $('tvarySite').addEventListener('click', e => {
    const b = e.target.closest('button[data-tvar]');
    if (!b) return;
    sit.tvar = b.dataset.tvar;
    $('tvarySite').querySelectorAll('button').forEach(x => x.classList.toggle('zap', x === b));
    prekresliSit();
  });
  $('posSit').addEventListener('input', e => { sit.rozbaleni = +e.target.value; prekresliSit(); });
  $('btnAnimace').addEventListener('click', animujSit);
  prekresliSit();
}

let animaceId = null;
function animujSit() {
  if (animaceId) { cancelAnimationFrame(animaceId); animaceId = null; }
  const zpet = sit.rozbaleni > 50;
  const cil = zpet ? 0 : 100;
  const krok = () => {
    if (!$('posSit')) { animaceId = null; return; }        // uživatel mezitím přepnul režim
    sit.rozbaleni += (cil - sit.rozbaleni) * 0.12;
    if (Math.abs(cil - sit.rozbaleni) < 0.6) { sit.rozbaleni = cil; animaceId = null; }
    $('posSit').value = sit.rozbaleni;
    prekresliSit();
    if (animaceId !== null) animaceId = requestAnimationFrame(krok);
  };
  animaceId = requestAnimationFrame(krok);
}

function prekresliSit() {
  if (!$('scenaSit')) return;
  const t = sit.rozbaleni / 100;
  let svg = '', popis = '';

  if (sit.tvar === 'kuzel') {
    const vrchol = { x: 150, y: 92 };
    const r = 46, v = 108;
    const s = Math.sqrt(r * r + v * v);
    const stred = vrchol.y + v;

    // složený kužel (vidíme ho z boku) – slábne, jak se rozbaluje
    const kuzelObrys = `M${vrchol.x},${vrchol.y} L${vrchol.x - r},${stred} `
      + `A${r},${r * 0.3} 0 0 0 ${vrchol.x + r},${stred} Z`;

    // rozbalený plášť = kruhová výseč o poloměru s a úhlu 2π·r/s
    const uhel = 2 * Math.PI * r / s;
    const uhelT = uhel * (0.18 + 0.82 * t);
    const zac = Math.PI / 2 - uhelT / 2;
    const bod = a => `${vrchol.x + Math.cos(a) * s},${vrchol.y + Math.sin(a) * s}`;
    const vysec = `M${vrchol.x},${vrchol.y} L${bod(zac)} `
      + `A${s},${s} 0 0 1 ${bod(zac + uhelT)} Z`;

    // podstava se odsune stranou a „otevře“ z elipsy do kruhu
    // podstava odjíždí doprava a zároveň se zvedne, aby se popisek vešel do plátna
    const px = 150 + t * 185, py = stred + 34 - t * 24;
    const pry = r * (0.3 + 0.7 * t);

    svg = `<path class="plast" d="${kuzelObrys}" opacity="${Math.max(0, 1 - t * 1.7).toFixed(3)}"/>
      <ellipse class="zadni" cx="${vrchol.x}" cy="${stred}" rx="${r}" ry="${r * 0.3}"
               opacity="${Math.max(0, 1 - t * 1.7).toFixed(3)}"/>
      <path class="plast" d="${vysec}" opacity="${Math.min(1, Math.max(0, (t - 0.12) / 0.5)).toFixed(3)}"/>
      <line class="strana" x1="${vrchol.x}" y1="${vrchol.y}" x2="${bod(zac).split(',')[0]}"
            y2="${bod(zac).split(',')[1]}"
            opacity="${Math.min(1, Math.max(0, (t - 0.12) / 0.5)).toFixed(3)}"/>
      <ellipse class="podstava" cx="${px}" cy="${py}" rx="${r}" ry="${pry}"/>
      <text class="popis" x="${px}" y="${py + pry + 17}">podstava πr²</text>
      <text class="popis s" x="${vrchol.x}" y="${vrchol.y - 14}">${
        t > 0.55 ? 'plášť = výseč o poloměru s' : 'plášť kužele'}</text>`;
    popis = t > 0.55
      ? 'Plášť je <b>kruhová výseč</b> o poloměru s (ne v!). Celý povrch je '
        + '<b>πr² + πrs</b>.'
      : 'Posuň posuvník a uvidíš, do jakého tvaru se plášť rozvine.';
  } else {
    const cx = 210, cy = 148;
    const a = 76, hs = 96, p2 = a / 2;
    // Stěna se odklápí kolem hrany podstavy. Ve složeném stavu (t = 0) míří
    // vrchol do středu čtverce, v rozvinutém leží ve vzdálenosti p2 + hs.
    const fi0 = Math.acos(Math.max(-1, -p2 / hs));
    const fi = fi0 * (1 - t);
    const d = p2 + hs * Math.cos(fi);

    const steny = [[0, -1], [1, 0], [0, 1], [-1, 0]].map(([dx, dy]) => {
      const x1 = cx + dx * p2 - dy * p2, y1 = cy + dy * p2 + dx * p2;
      const x2 = cx + dx * p2 + dy * p2, y2 = cy + dy * p2 - dx * p2;
      const vx = cx + dx * d, vy = cy + dy * d;
      return `<polygon class="plast" points="${x1},${y1} ${x2},${y2} ${vx},${vy}"/>`;
    }).join('');

    svg = steny
      + `<rect class="podstava" x="${cx - p2}" y="${cy - p2}" width="${a}" height="${a}"/>
         <text class="popis" x="${cx}" y="${cy + 5}">podstava a²</text>`
      // výška stěny vede od STŘEDU hrany podstavy k vrcholu, ne od rohu
      + (t > 0.6 ? `<line class="strana" x1="${cx + p2}" y1="${cy}"
                          x2="${cx + d}" y2="${cy}"/>
                    <text class="popis s" x="${cx + (p2 + d) / 2}" y="${cy - 10}">výška stěny</text>` : '');
    popis = t > 0.6
      ? 'Síť je <b>čtverec a čtyři trojúhelníky</b>. Pozor: výška trojúhelníku '
        + 'je <b>výška stěny</b>, ne výška jehlanu.'
      : 'Při 0 % se díváš na jehlan shora — stěny míří do jednoho vrcholu. Rozbal ho.';
  }

  $('scenaSit').innerHTML = svg;
  $('hodSit').textContent = Math.round(sit.rozbaleni) + ' %';
  $('popisSite').innerHTML = popis;
}

/* ============================================================
   Režim 3: Proč třetina – těleso se přelije do opsané nádoby.
   Zdroj se nejdřív napustí vodou, pak se zvedne, nakloní,
   proudem vyleje do nádoby a vrátí se zpět.
   ============================================================ */
const TVARY_TRETINA = {
  kuzel: {
    zdroj: 'kuzel', nadoba: 'valec', podil: 1 / 3, davek: 3, R: 38, V: 120,
    nazevZ: 'kužel', nazevN: 'válec',
    rozmery: 'r = 3 cm, v = 6 cm',
    vzorecZ: 'V = ⅓ · πr² · v = ⅓ · 3,14 · 3² · 6', hodnotaZ: 56.52,
    vzorecN: 'V = πr² · v = 3,14 · 3² · 6', hodnotaN: 169.56,
  },
  jehlan: {
    zdroj: 'jehlan', nadoba: 'hranol', podil: 1 / 3, davek: 3, R: 38, V: 120,
    nazevZ: 'jehlan', nazevN: 'hranol',
    rozmery: 'a = 5 cm, v = 6 cm',
    vzorecZ: 'V = ⅓ · a² · v = ⅓ · 5² · 6', hodnotaZ: 50,
    vzorecN: 'V = a² · v = 5² · 6', hodnotaN: 150,
  },
  koule: {
    zdroj: 'koule', nadoba: 'valec', podil: 2 / 3, davek: 1, R: 58, V: 116,
    nazevZ: 'koule', nazevN: 'opsaný válec',
    rozmery: 'r = 4 cm, výška válce = 2r = 8 cm',
    vzorecZ: 'V = 4/3 · πr³ = 4/3 · 3,14 · 4³', hodnotaZ: 267.95,
    vzorecN: 'V = πr² · 2r = 3,14 · 4² · 8', hodnotaN: 401.92,
  },
};
/* fáze jedné dávky: název a délka v sekundách */
const FAZE_TRETINA = [
  ['napousteni', 1.5], ['prenos', 0.9], ['liti', 1.9], ['navrat', 0.7],
];
const tretina = {
  tvar: 'kuzel', faze: -1, t: 0, davky: 0, zaklad: 0,
  rychlost: 1, auto: false, bezi: false, cas: 0, vlna: 0, gen: 0,
};

const hladkost = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const svgBod = (x, y) => `${Math.round(x * 100) / 100} ${Math.round(y * 100) / 100}`;

function tretinaRezim() {
  const p = $('plocha');
  tretina.gen++;
  tretina.faze = -1; tretina.t = 0; tretina.davky = 0;
  tretina.zaklad = 0; tretina.auto = false; tretina.bezi = false; tretina.vlna = 0;
  p.innerHTML = `
    <div class="zadani uloha-text" id="zadaniTretina"></div>
    <div class="prepinac-tvar" id="tvaryTretina">
      <button data-tvar="kuzel" class="zap">🍦 Kužel → válec</button>
      <button data-tvar="jehlan">🔻 Jehlan → hranol</button>
      <button data-tvar="koule">⚽ Koule → válec</button>
    </div>
    <svg class="scena" id="scenaTretina" viewBox="0 0 430 300" role="img"
         aria-label="Přelévání vody z tělesa do nádoby"></svg>
    <div class="ovladace">
      <button id="btnNalij">💧 Napustit a přelít</button>
      <button id="btnVse">⏩ Nalít vše</button>
      <button id="btnReset2">↺ Vylít</button>
      <label>Rychlost
        <input type="range" id="posRychlost" min="0.4" max="3" step="0.1" value="1">
        <span class="hodnota" id="hodRychlost">1×</span></label>
      <label>Naplněno <span class="hodnota" id="hodNaplneno">0 %</span></label>
    </div>
    <div class="vypocet" id="vypocetTretina"></div>
    <p class="vysvetlivka" id="popisTretina"></p>`;

  $('tvaryTretina').addEventListener('click', e => {
    const b = e.target.closest('button[data-tvar]');
    if (!b || b.dataset.tvar === tretina.tvar) return;
    tretina.tvar = b.dataset.tvar;
    $('tvaryTretina').querySelectorAll('button').forEach(x => x.classList.toggle('zap', x === b));
    resetTretiny();
  });
  $('btnNalij').addEventListener('click', () => spustDavku(false));
  $('btnVse').addEventListener('click', () => spustDavku(true));
  $('btnReset2').addEventListener('click', resetTretiny);
  $('posRychlost').addEventListener('input', e => {
    tretina.rychlost = +e.target.value;
    $('hodRychlost').textContent = fmt1(tretina.rychlost) + '×';
  });
  prekresliTretinu();
}

function resetTretiny() {
  if (!$('scenaTretina')) return;
  tretina.gen++;
  tretina.faze = -1; tretina.t = 0; tretina.davky = 0;
  tretina.zaklad = 0; tretina.auto = false; tretina.bezi = false;
  prekresliTretinu();
}

function spustDavku(auto) {
  const T = TVARY_TRETINA[tretina.tvar];
  tretina.auto = auto;
  if (tretina.bezi || tretina.davky >= T.davek) return;
  tretina.faze = 0; tretina.t = 0;
  tretina.zaklad = tretina.davky * T.podil;
  tretina.bezi = true;
  tretina.cas = 0;
  const moje = tretina.gen;
  requestAnimationFrame(ts => tretinaKrok(ts, moje));
}

function tretinaKrok(ts, moje) {
  if (!$('scenaTretina') || moje !== tretina.gen) return;
  if (!tretina.cas) tretina.cas = ts;
  const dt = Math.min(0.06, (ts - tretina.cas) / 1000) * tretina.rychlost;
  tretina.cas = ts;
  tretina.vlna += dt;
  tretina.t += dt / FAZE_TRETINA[tretina.faze][1];
  if (tretina.t >= 1) {
    const T = TVARY_TRETINA[tretina.tvar];
    if (FAZE_TRETINA[tretina.faze][0] === 'liti') {
      tretina.davky++;
      tretina.zaklad = tretina.davky * T.podil;
    }
    tretina.t = 0;
    tretina.faze++;
    if (tretina.faze >= FAZE_TRETINA.length) {
      tretina.faze = -1;
      tretina.bezi = false;
      prekresliTretinu();
      if (tretina.auto && tretina.davky < T.davek) spustDavku(true);
      return;
    }
  }
  prekresliTretinu();
  requestAnimationFrame(t2 => tretinaKrok(t2, moje));
}

/* stav (q = naplnění zdroje, f = naplnění nádoby, ang/posun = poloha zdroje) */
function stavTretiny() {
  const T = TVARY_TRETINA[tretina.tvar];
  const nazev = tretina.faze >= 0 ? FAZE_TRETINA[tretina.faze][0] : 'klid';
  const t = hladkost(Math.min(1, Math.max(0, tretina.t)));
  let q = 0, f = tretina.zaklad, prenos = 0;
  if (nazev === 'napousteni') q = t;
  else if (nazev === 'prenos') { q = 1; prenos = t; }
  else if (nazev === 'liti') { q = 1 - t; f = tretina.zaklad + T.podil * t; prenos = 1; }
  else if (nazev === 'navrat') { q = 0; prenos = 1 - t; }
  return { T, nazev, q, f: Math.min(1, f), prenos };
}

/* výška hladiny ve zdroji podle objemového podílu q (přesně) */
function hladinaZdroje(T, q) {
  const R = T.R, V = T.V;
  if (q <= 0) return { h: 0, r: 0 };
  if (T.zdroj === 'koule') {
    // q = h²(3R−h) / (4R³) – převrátíme půlením intervalu
    let a = 0, b = 2 * R;
    for (let i = 0; i < 40; i++) {
      const m = (a + b) / 2;
      if (m * m * (3 * R - m) / (4 * R * R * R) < q) a = m; else b = m;
    }
    const h = (a + b) / 2;
    return { h, r: Math.sqrt(Math.max(0, h * (2 * R - h))) };
  }
  const h = V * (1 - Math.cbrt(1 - q));      // od podstavy nahoru
  return { h, r: R * Math.cbrt(1 - q) };
}

/* Čtyřboký jehlan v kosoúhlé projekci: podstava ABCD (D je zadní, skrytý roh),
   vrchol přesně nad jejím středem. Řez ve výšce hladiny je podobný rovnoběžník,
   proto hladina vždy leží uvnitř tělesa. */
function jehlanGeom(xK, ZEM, R, V) {
  const d = R * 0.42, dy = d * 0.55;
  return {
    A: [xK - R, ZEM], B: [xK + R, ZEM],
    C: [xK + R + d, ZEM - dy], D: [xK - R + d, ZEM - dy],
    vrch: [xK + d / 2, ZEM - dy / 2 - V], d, dy,
  };
}

/* obrys zdrojového tělesa v klidové poloze */
function siluetaZdroje(T, xK, ZEM) {
  const R = T.R, V = T.V, ry = R * 0.3;
  if (T.zdroj === 'kuzel') {
    return `M${svgBod(xK, ZEM - V)} L${svgBod(xK - R, ZEM)}
            A${R} ${ry} 0 0 0 ${svgBod(xK + R, ZEM)} Z`;
  }
  if (T.zdroj === 'jehlan') {
    const g = jehlanGeom(xK, ZEM, R, V);
    return `M${svgBod(...g.A)} L${svgBod(...g.B)} L${svgBod(...g.C)} L${svgBod(...g.vrch)} Z`;
  }
  const cy = ZEM - R;
  return `M${svgBod(xK - R, cy)} A${R} ${R} 0 1 0 ${svgBod(xK + R, cy)}
          A${R} ${R} 0 1 0 ${svgBod(xK - R, cy)} Z`;
}

/* svislý proud vody s vlnkou a kapkami */
function proudVody(x, y1, y2, sirka, faze) {
  if (y2 - y1 < 2) return '';
  const n = 12, L = [], P = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, y = y1 + (y2 - y1) * t;
    const posun = Math.sin(faze * 7 + t * 9) * 1.8 * t;
    const w = sirka * (0.55 + 0.45 * Math.abs(Math.sin(faze * 6 + t * 7))) * (1 - 0.25 * t);
    L.push(`${svgBod(x + posun - w / 2, y)}`);
    P.unshift(`${svgBod(x + posun + w / 2, y)}`);
  }
  let kapky = '';
  for (let k = 0; k < 3; k++) {
    const t = ((faze * 1.3 + k / 3) % 1);
    const y = y1 + (y2 - y1) * t;
    const cx = x + Math.sin(faze * 7 + t * 9) * 2.6;
    if (y < y2 - 3) {
      kapky += `<ellipse class="kapka" cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" rx="2.2" ry="3.2"/>`;
    }
  }
  return `<path class="proud" d="M${L.join(' L')} L${P.join(' L')} Z"/>` + kapky;
}

function prekresliTretinu() {
  const sc = $('scenaTretina');
  if (!sc) return;
  const { T, nazev, q, f, prenos } = stavTretiny();
  const ZEM = 250, V = T.V, R = T.R, ry = R * 0.3;
  const xK = 108, xN = 306;
  const jeHranol = T.nadoba === 'hranol';
  const skos = R * 0.42;

  /* --- poloha zdroje: zvednutí a naklonění nad nádobu --- */
  const uhelMax = T.zdroj === 'koule' ? 0 : 148;
  const ang = uhelMax * prenos;
  const px = xK, py = ZEM - V / 2;                    // střed otáčení
  const otoc = (x, y) => {
    const a = ang * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return [px + (x - px) * c - (y - py) * s, py + (x - px) * s + (y - py) * c];
  };
  const geoJ = T.zdroj === 'jehlan' ? jehlanGeom(xK, ZEM, R, V) : null;
  const vrchol = geoJ ? geoJ.vrch : [xK, ZEM - V];    // otvor tělesa
  // hubička = nejnižší bod tělesa po naklonění (u koule spodek koule)
  const kandidati = T.zdroj === 'koule'
    ? [[xK, ZEM]]
    : [otoc(xK - R, ZEM), otoc(xK + R, ZEM), otoc(...vrchol)];
  const hubicka = kandidati.reduce((a, b) => (b[1] > a[1] ? b : a));
  const cilH = [xN - (T.zdroj === 'koule' ? 0 : 6), ZEM - V - (T.zdroj === 'koule' ? 30 : 24)];
  const tx = (cilH[0] - hubicka[0]) * prenos;
  const ty = (cilH[1] - hubicka[1]) * prenos;
  const transf = `translate(${svgBod(tx, ty).replace(' ', ',')}) rotate(${ang.toFixed(2)} ${svgBod(px, py)})`;
  const hub = [hubicka[0] + tx, hubicka[1] + ty];

  /* --- hladina ve zdroji --- */
  const hz = hladinaZdroje(T, q);
  let yHl;                                            // y hladiny ve scéně
  const k = hz.r / R;                                 // zmenšení řezu proti podstavě
  if (ang < 0.5) {
    // u jehlanu leží hladina na přední hraně řezu, u ostatních na ose
    yHl = (geoJ ? geoJ.vrch[1] + k * (ZEM - geoJ.vrch[1]) : ZEM - hz.h) + ty;
  } else {                                            // nakloněno: lineárně mezi obalem
    const rohy = [otoc(xK - R, ZEM), otoc(xK + R, ZEM), otoc(...vrchol), otoc(xK, ZEM)]
      .map(b => b[1] + ty);
    const yMin = Math.min(...rohy) - ry, yMax = Math.max(...rohy) + ry;
    yHl = yMax - (yMax - yMin) * q;
  }

  const sil = siluetaZdroje(T, xK, ZEM);
  const vlnkaZ = ang < 0.5 ? Math.sin(tretina.vlna * 5) * 0.6 : 0;

  let zdroj = `<clipPath id="clipZdroj"><path d="${sil}" transform="${transf}"/></clipPath>`;
  if (q > 0.001) {
    zdroj += `<rect class="voda" x="0" y="${yHl.toFixed(1)}" width="430"
                height="${Math.max(0, 300 - yHl).toFixed(1)}" clip-path="url(#clipZdroj)"/>
              <rect class="hladina-pruh" x="0" y="${yHl.toFixed(1)}" width="430" height="2.5"
                clip-path="url(#clipZdroj)"/>`;
    if (ang < 0.5 && hz.r > 1) {
      if (geoJ) {
        const rez = b => svgBod(geoJ.vrch[0] + k * (b[0] - geoJ.vrch[0]) + tx,
                                geoJ.vrch[1] + k * (b[1] - geoJ.vrch[1]) + ty).replace(' ', ',');
        zdroj += `<polygon class="hladina" points="${[geoJ.A, geoJ.B, geoJ.C, geoJ.D].map(rez).join(' ')}"/>`;
      } else {
        zdroj += `<ellipse class="hladina" cx="${(xK + tx).toFixed(1)}" cy="${yHl.toFixed(1)}"
                    rx="${hz.r.toFixed(1)}" ry="${(hz.r * 0.3 + vlnkaZ).toFixed(1)}"/>`;
      }
    }
  }
  zdroj += `<path class="plast" d="${sil}" transform="${transf}"/>`;
  if (T.zdroj === 'kuzel') {
    zdroj += `<ellipse class="zadni" cx="${xK}" cy="${ZEM}" rx="${R}" ry="${ry}"
                transform="${transf}"/>`;
  } else if (T.zdroj === 'jehlan') {
    const b2 = p2 => svgBod(...p2).replace(' ', ',');
    zdroj += `<polygon class="podstava" transform="${transf}"
                points="${[geoJ.A, geoJ.B, geoJ.C, geoJ.D].map(b2).join(' ')}"/>
              <line class="plast" transform="${transf}" x1="${geoJ.B[0]}" y1="${geoJ.B[1]}"
                x2="${geoJ.vrch[0]}" y2="${geoJ.vrch[1]}"/>
              <path class="zadni" transform="${transf}" d="M${svgBod(...geoJ.A)} L${svgBod(...geoJ.D)}
                L${svgBod(...geoJ.C)} M${svgBod(...geoJ.D)} L${svgBod(...geoJ.vrch)}"/>`;
  } else {
    zdroj += `<ellipse class="zadni" cx="${xK}" cy="${ZEM - R}" rx="${R}" ry="${R * 0.32}"
                transform="${transf}"/>`;
  }

  /* --- nádoba a její hladina --- */
  const yHlN = ZEM - V * f;
  const vlnkaN = (nazev === 'liti' ? Math.sin(tretina.vlna * 9) * 1.4 : Math.sin(tretina.vlna * 2) * 0.4);
  const dyN = skos * 0.55;
  const clipN = jeHranol
    ? `<polygon points="${xN - R},${ZEM - V} ${xN - R + skos},${ZEM - V - dyN}
         ${xN + R + skos},${ZEM - V - dyN} ${xN + R + skos},${(ZEM - dyN).toFixed(1)}
         ${xN + R},${ZEM} ${xN - R},${ZEM}"/>`
    : `<path d="M${svgBod(xN - R, ZEM - V)} L${svgBod(xN - R, ZEM)}
         A${R} ${ry} 0 0 0 ${svgBod(xN + R, ZEM)} L${svgBod(xN + R, ZEM - V)} Z"/>`;
  let nadoba = `<clipPath id="clipNadoba">${clipN}</clipPath>`;
  if (f > 0.0005) {
    nadoba += `<rect class="voda" x="${xN - R - 2}" y="${yHlN.toFixed(1)}" width="${R * 2 + 4}"
                 height="${(V * f + 4).toFixed(1)}" clip-path="url(#clipNadoba)"/>`;
    nadoba += jeHranol
      ? `<polygon class="hladina" points="${xN - R},${yHlN.toFixed(1)} ${xN + R},${yHlN.toFixed(1)}
           ${xN + R + skos},${(yHlN - skos * 0.55).toFixed(1)} ${xN - R + skos},${(yHlN - skos * 0.55).toFixed(1)}"/>`
      : `<ellipse class="hladina" cx="${xN}" cy="${yHlN.toFixed(1)}" rx="${R}"
           ry="${(ry + vlnkaN).toFixed(1)}"/>`;
  }
  // rysky po dávkách
  for (let i = 1; i <= T.davek; i++) {
    const podil = Math.min(1, i * T.podil);
    const y = ZEM - V * podil;
    const popis = T.podil === 1 / 3 ? ['⅓', '⅔', '1'][i - 1] : '⅔';
    const kraj = xN + R + (jeHranol ? skos : 0);
    nadoba += `<line class="ryska" x1="${xN - R - 6}" y1="${y.toFixed(1)}" x2="${kraj + 6}" y2="${y.toFixed(1)}"/>
      <text class="ryska-text" x="${kraj + 12}" y="${(y + 4).toFixed(1)}">${popis}</text>`;
  }
  nadoba += jeHranol
    ? `<rect class="obal" x="${xN - R}" y="${ZEM - V}" width="${R * 2}" height="${V}"/>
       <polygon class="obal" points="${xN - R},${ZEM - V} ${xN + R},${ZEM - V}
         ${xN + R + skos},${(ZEM - V - dyN).toFixed(1)} ${xN - R + skos},${(ZEM - V - dyN).toFixed(1)}"/>
       <polygon class="obal" points="${xN + R},${ZEM - V} ${xN + R + skos},${(ZEM - V - dyN).toFixed(1)}
         ${xN + R + skos},${(ZEM - dyN).toFixed(1)} ${xN + R},${ZEM}"/>`
    : `<ellipse class="obal" cx="${xN}" cy="${ZEM - V}" rx="${R}" ry="${ry}"/>
       <line class="obal" x1="${xN - R}" y1="${ZEM - V}" x2="${xN - R}" y2="${ZEM}"/>
       <line class="obal" x1="${xN + R}" y1="${ZEM - V}" x2="${xN + R}" y2="${ZEM}"/>
       <ellipse class="obal" cx="${xN}" cy="${ZEM}" rx="${R}" ry="${ry}"/>`;

  /* --- kohoutek a proudy vody --- */
  const yUsti = 44, xUsti = vrchol[0];
  const kohout = prenos > 0.02 ? '' : `<g class="kohout">
      <rect x="0" y="14" width="13" height="28" rx="4"/>
      <rect x="8" y="24" width="${(xUsti - 4).toFixed(1)}" height="9" rx="4"/>
      <rect x="${(xUsti - 4.5).toFixed(1)}" y="24" width="9" height="${yUsti - 24}" rx="3"/>
      <circle cx="24" cy="21" r="6"/>
    </g>`;
  let voda = '';
  if (nazev === 'napousteni') {
    voda += proudVody(xUsti, yUsti, yHl - 1, 9, tretina.vlna);
    voda += `<ellipse class="cakanec" cx="${xUsti.toFixed(1)}" cy="${yHl.toFixed(1)}"
      rx="${(6 + 8 * ((tretina.vlna * 2) % 1)).toFixed(1)}"
      ry="${(2 + 2.4 * ((tretina.vlna * 2) % 1)).toFixed(1)}"/>`;
  }
  if (nazev === 'liti' && q > 0.004) {
    voda += proudVody(hub[0], hub[1], yHlN - 1, 9, tretina.vlna + 0.4);
    voda += `<ellipse class="cakanec" cx="${hub[0].toFixed(1)}" cy="${yHlN.toFixed(1)}"
      rx="${(7 + 9 * ((tretina.vlna * 2.4) % 1)).toFixed(1)}"
      ry="${(2 + 2.6 * ((tretina.vlna * 2.4) % 1)).toFixed(1)}"/>`;
  }

  /* --- popisky --- */
  const hotovo = tretina.davky >= T.davek && !tretina.bezi;
  const popisky = `
    <line class="mira" x1="${xK - R - 26}" y1="${ZEM - V}" x2="${xN + R + 4}" y2="${ZEM - V}"/>
    <text class="popis v vlevo" x="${xK - R - 26}" y="${ZEM - V - 8}">${T.zdroj === 'koule' ? 'výška válce = 2r' : 'stejná výška v'}</text>
    <text class="popis" x="${xK}" y="${ZEM + 26}">${T.nazevZ}</text>
    <text class="popis" x="${xN}" y="${ZEM + 26}">${T.nazevN}</text>
    <text class="popis s" x="${xN}" y="${ZEM + 43}">nalito ${tretina.davky}× z ${T.davek}</text>`;

  sc.innerHTML = kohout + zdroj + nadoba + voda + popisky;

  /* --- čísla a texty pod scénou --- */
  const cil = T.davek * T.podil;
  $('hodNaplneno').textContent = Math.round(f * 100) + ' %';
  $('zadaniTretina').innerHTML = T.zdroj === 'koule'
    ? 'Jakou část <b>opsaného válce</b> (stejný poloměr, výška 2r) zaplní voda z <b>koule</b>? '
      + 'Napusť kouli a přelij ji.'
    : `Kolikrát se musí <b>${T.nazevZ}</b> vylít do <b>${T.nazevN === 'hranol' ? 'hranolu' : 'válce'}</b> `
      + 'se <b>stejnou podstavou i výškou</b>, než ho naplní? Napusť těleso vodou a přelij ji.';
  $('btnNalij').disabled = tretina.bezi || tretina.davky >= T.davek;
  $('btnVse').disabled = tretina.bezi || tretina.davky >= T.davek || T.davek < 2;
  $('btnReset2').disabled = tretina.bezi || (tretina.davky === 0 && f < 0.001);

  $('vypocetTretina').innerHTML = `
    <div class="karticka objem">
      <div class="nadpis">${T.nazevZ} (${T.rozmery})</div>
      <div class="radek">${T.vzorecZ}</div>
      <div class="radek vysledek">${fmt(T.hodnotaZ)} cm³</div>
    </div>
    <div class="karticka povrch">
      <div class="nadpis">${T.nazevN}</div>
      <div class="radek">${T.vzorecN}</div>
      <div class="radek vysledek">${fmt(T.hodnotaN)} cm³</div>
    </div>
    <div class="karticka pomer">
      <div class="nadpis">Nalito</div>
      <div class="radek">${tretina.davky} × ${fmt(T.hodnotaZ)} = ${fmt(tretina.davky * T.hodnotaZ)} cm³
        z ${fmt(T.hodnotaN)} cm³</div>
      <div class="radek vysledek">${Math.round(f * 100)} % nádoby</div>
    </div>
    <div class="karticka pomer">
      <div class="nadpis">Poměr objemů</div>
      <div class="radek">${fmt(T.hodnotaZ)} : ${fmt(T.hodnotaN)}</div>
      <div class="radek vysledek">= ${T.podil === 1 / 3 ? '1 : 3  →  ⅓' : '2 : 3  →  ⅔'}</div>
    </div>`;

  let text;
  if (hotovo && T.zdroj === 'koule') {
    text = 'Koule zaplnila přesně <b>dvě třetiny</b> opsaného válce (stejný poloměr, výška 2r). '
      + 'Proto V<sub>koule</sub> = ⅔ · πr² · 2r = <b>4/3 · πr³</b>. '
      + 'A zbylá třetina válce? To je právě kužel se stejnou podstavou a výškou.';
  } else if (hotovo) {
    text = `Přesně <b>třikrát</b> — proto je ve vzorci ta <b>jedna třetina</b>: `
      + `V<sub>${T.zdroj === 'kuzel' ? 'kužele' : 'jehlanu'}</sub> = ⅓ · S<sub>p</sub> · v. `
      + `Zkus i ostatní tělesa.`;
  } else if (nazev === 'napousteni') {
    text = `Napouštím ${T.nazevZ} — voda stoupá, ale u špičatého tělesa <b>nerovnoměrně</b>: `
      + 'dole je ho víc než nahoře.';
  } else if (nazev === 'prenos') text = 'Zvedám plné těleso nad nádobu…';
  else if (nazev === 'liti') text = `Přelévám do ${T.nazevN === 'hranol' ? 'hranolu' : 'válce'} — sleduj rysky.`;
  else if (nazev === 'navrat') text = 'Hotovo, vracím prázdné těleso zpět.';
  else if (tretina.davky === 0) text = 'Zmáčkni <b>„Napustit a přelít“</b> a počítej dávky. '
    + `Kolik jich bude potřeba na ${T.davek === 1 ? 'celý' : 'celou'} nádobu?`;
  else text = `Nalito ${tretina.davky}× z ${T.davek}. Zkus další dávku.`;
  $('popisTretina').innerHTML = text;
}

/* ============================================================
   Procvičovací režimy
   ============================================================ */
function svgJehlan(a, v) {
  return `<svg class="teleso" viewBox="0 0 220 200">
    <polygon class="plocha3d" points="110,20 30,150 150,150"/>
    <polygon class="zadni" points="30,150 150,150 190,120 70,120"/>
    <line class="zadni" x1="110" y1="20" x2="190" y2="120"/>
    <line class="vyska" x1="110" y1="20" x2="110" y2="135"/>
    <text class="popis" x="128" y="86">v = ${v}</text>
    <text class="popis" x="90" y="168">a = ${a}</text>
  </svg>`;
}
function svgKuzel(r, v) {
  return `<svg class="teleso" viewBox="0 0 220 200">
    <path class="plocha3d" d="M110 20 L40 150 A70 20 0 0 0 180 150 Z"/>
    <ellipse class="zadni" cx="110" cy="150" rx="70" ry="20"/>
    <line class="vyska" x1="110" y1="20" x2="110" y2="150"/>
    <line class="zadni" x1="110" y1="150" x2="180" y2="150"/>
    <text class="popis" x="128" y="92">v = ${v}</text>
    <text class="popis" x="148" y="143">r = ${r}</text>
  </svg>`;
}
function svgKoule(r) {
  return `<svg class="teleso" viewBox="0 0 220 200">
    <circle class="plocha3d" cx="110" cy="100" r="72"/>
    <ellipse class="zadni" cx="110" cy="100" rx="72" ry="22"/>
    <line class="vyska" x1="110" y1="100" x2="182" y2="100"/>
    <text class="popis" x="146" y="92">r = ${r}</text>
  </svg>`;
}

function jehlan() {
  const p = $('plocha');
  const a = Uloha.nahodneCislo(3, 12), v = Uloha.nahodneCislo(3, 15);
  const Sp = a * a, V = Sp * v / 3;
  const jine = new Set([fmt(Sp * v), fmt(V * 3), fmt(Sp), fmt(a * v / 3)]);
  jine.delete(fmt(V));

  p.innerHTML = `<div class="zadani uloha-text">Jehlan má čtvercovou podstavu se stranou
      <b>a = ${a} cm</b> a výšku <b>v = ${v} cm</b>. Jaký má objem?</div>
    <div class="karta">${svgJehlan(a, v)}<div class="vzorec">V = ⅓ · S<sub>p</sub> · v</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(V), ...[...jine].slice(0, 3)]).map(t => ({ klic: t, popis: t + ' cm³' })),
    spravnyKlic: fmt(V),
    zpravaOk: `✅ V = ⅓ · ${Sp} · ${v} = ${fmt(V)} cm³`,
    zpravaChyba: 'Nezapomeň na jednu třetinu – jehlan má třetinový objem oproti hranolu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

function kuzel() {
  const p = $('plocha');
  const r = Uloha.nahodneCislo(2, 10), v = Uloha.nahodneCislo(3, 15);
  const s = Math.sqrt(r * r + v * v);
  const V = PI * r * r * v / 3, S = PI * r * r + PI * r * s;
  const naObjem = Math.random() < 0.6;
  const vysledek = naObjem ? V : S;
  const jine = new Set([fmt(naObjem ? S : V), fmt(vysledek * 3), fmt(PI * r * r), fmt(vysledek / 2)]);
  jine.delete(fmt(vysledek));

  p.innerHTML = `<div class="zadani uloha-text">Kužel má poloměr podstavy <b>r = ${r} cm</b>
      a výšku <b>v = ${v} cm</b>. ${naObjem ? 'Jaký má objem?' :
      `Strana kužele měří <b>s = ${fmt(s)} cm</b>. Jaký má povrch?`} (π = 3,14)</div>
    <div class="karta">${svgKuzel(r, v)}
      <div class="vzorec">V = ⅓ · πr² · v<br>S = πr² + πrs</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(vysledek), ...[...jine].slice(0, 3)])
      .map(t => ({ klic: t, popis: t + (naObjem ? ' cm³' : ' cm²') })),
    spravnyKlic: fmt(vysledek),
    zpravaOk: naObjem
      ? `✅ V = ⅓ · 3,14 · ${r}² · ${v} = ${fmt(V)} cm³`
      : `✅ S = 3,14 · ${r}² + 3,14 · ${r} · ${fmt(s)} = ${fmt(S)} cm²`,
    zpravaChyba: naObjem ? 'Objem kužele je třetina objemu válce se stejnou podstavou a výškou.'
      : 'Povrch = podstava + plášť; plášť počítáme se stranou s, ne s výškou.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

function koule() {
  const p = $('plocha');
  const r = Uloha.nahodneCislo(2, 12);
  const V = 4 / 3 * PI * r * r * r, S = 4 * PI * r * r;
  const naObjem = Math.random() < 0.5;
  const vysledek = naObjem ? V : S;
  const jine = new Set([fmt(naObjem ? S : V), fmt(PI * r * r), fmt(vysledek / 2), fmt(vysledek * 2)]);
  jine.delete(fmt(vysledek));

  p.innerHTML = `<div class="zadani uloha-text">Koule má poloměr <b>r = ${r} cm</b>.
      Jaký má ${naObjem ? 'objem' : 'povrch'}? (π = 3,14)</div>
    <div class="karta">${svgKoule(r)}<div class="vzorec">V = 4/3 · πr³ &nbsp;·&nbsp; S = 4πr²</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(vysledek), ...[...jine].slice(0, 3)])
      .map(t => ({ klic: t, popis: t + (naObjem ? ' cm³' : ' cm²') })),
    spravnyKlic: fmt(vysledek),
    zpravaOk: naObjem
      ? `✅ V = 4/3 · 3,14 · ${r}³ = ${fmt(V)} cm³`
      : `✅ S = 4 · 3,14 · ${r}² = ${fmt(S)} cm²`,
    zpravaChyba: 'U objemu je poloměr na třetí, u povrchu na druhou.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const VZORCE = [
  { q: 'Který vzorec počítá objem jehlanu?', a: 'V = ⅓ · S_p · v', b: ['V = S_p · v', 'V = 4/3 · πr³', 'S = 4πr²'] },
  { q: 'Který vzorec počítá povrch koule?', a: 'S = 4πr²', b: ['S = πr² + πrs', 'V = 4/3 · πr³', 'S = 2πr² + 2πrv'] },
  { q: 'Který vzorec počítá objem kužele?', a: 'V = ⅓ · πr² · v', b: ['V = πr² · v', 'V = ⅓ · a² · v', 'S = πrs'] },
  { q: 'Co znamená ve vzorcích písmeno s u kužele?', a: 'strana kužele – vzdálenost od vrcholu k okraji podstavy', b: ['výška kužele', 'poloměr podstavy', 'obsah podstavy'] },
  { q: 'Jak souvisí objem kužele a válce se stejnou podstavou i výškou?', a: 'kužel má třetinový objem', b: ['mají stejný objem', 'kužel má dvojnásobný', 'kužel má poloviční'] },
  { q: 'Jak spočítáš stranu kužele, když znáš r a v?', a: 'Pythagorovou větou: s² = r² + v²', b: ['s = r + v', 's = r · v', 's = v − r'] },
  { q: 'Kolikrát vzroste objem koule, když zdvojnásobíme poloměr?', a: 'osmkrát', b: ['dvakrát', 'čtyřikrát', 'šestnáctkrát'] },
  { q: 'Co tvoří síť jehlanu se čtvercovou podstavou?', a: 'čtverec a čtyři trojúhelníky', b: ['dva čtverce a obdélník', 'kruh a výseč', 'čtyři obdélníky'] },
  { q: 'Jaký tvar má rozbalený plášť kužele?', a: 'kruhová výseč', b: ['obdélník', 'trojúhelník', 'mezikruží'] },
];
function vzorce() {
  const p = $('plocha');
  const u = Uloha.nahodne(VZORCE);
  p.innerHTML = `<div class="zadani uloha-text">${u.q}</div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.a, ...u.b]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.a,
    zpravaOk: `✅ ${u.a}`,
    zpravaChyba: 'Jehlan a kužel mají třetinu, koule pracuje s r³ (objem) a r² (povrch).',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ============================================================ */
const REZIMY = { modelarna, site, tretina: tretinaRezim, jehlan, kuzel, koule, vzorce };
/* V bádacích režimech se neodpovídá, tlačítko v liště tam dělá něco jiného. */
const POPIS_TLACITKA = {
  modelarna: '🎲 Náhodné rozměry',
  site: '🔄 Přepnout těleso',
  tretina: '↺ Vylít a začít znovu',
};

function novaUloha() {
  if (rezim === 'modelarna') {
    model.r = Uloha.nahodneCislo(4, 22) / 2;
    model.v = Uloha.nahodneCislo(6, 30) / 2;
    if ($('posR')) $('posR').value = model.r;
    if ($('posV')) $('posV').value = model.v;
    prekresliModel();
    return;
  }
  if (rezim === 'site') {
    sit.tvar = sit.tvar === 'kuzel' ? 'jehlan' : 'kuzel';
    $('tvarySite').querySelectorAll('button')
      .forEach(x => x.classList.toggle('zap', x.dataset.tvar === sit.tvar));
    prekresliSit();
    return;
  }
  if (rezim === 'tretina') { resetTretiny(); return; }
  REZIMY[rezim]();
}

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  $('btnDalsi').textContent = POPIS_TLACITKA[rezim] || 'Přeskočit →';
  REZIMY[rezim]();
}));
$('btnDalsi').addEventListener('click', novaUloha);
$('btnDalsi').textContent = POPIS_TLACITKA[rezim] || 'Přeskočit →';
REZIMY[rezim]();
</script>
