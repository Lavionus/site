<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krychle a kvádr – povrch a objem</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .teleso3d { width: min(280px, 70vw); }
    .teleso3d .stena { fill: var(--accent); fill-opacity: 0.35; stroke: var(--accent); stroke-width: 2.5; }
    .teleso3d .stena.tmava { fill-opacity: 0.6; }
    .teleso3d .kota { fill: var(--text-muted); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .rozmery { font-size: clamp(1.2rem, 4.5vw, 1.7rem); font-weight: 700; font-variant-numeric: tabular-nums; }
    .vzorec { color: var(--text-faint); font-size: 0.88rem; }
  </style>
</head>
<body>
  <h1>📦 Krychle a kvádr – povrch a objem</h1>
  <p class="podtitul">Pro 6.–7. ročník: výpočet povrchu a objemu, jednotky a slovní úlohy.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="objem" class="active">🧊 Objem</button>
    <button data-rezim="povrch">📐 Povrch</button>
    <button data-rezim="jednotky">📏 Převody jednotek</button>
    <button data-rezim="slovni">🧠 Slovní úloha</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Krychle:</b> V = a³, S = 6 × a². <b>Kvádr:</b> V = a × b × c, S = 2 × (ab + bc + ac).
    Objem se udává v krychlových jednotkách (cm³, m³), povrch ve čtverečních (cm², m²).
    Platí 1 l = 1 dm³ a 1 m³ = 1000 l.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_m6_krychle', $('skore'));
let rezim = 'objem';

function svgKvadr(a, b, c, krychle) {
  const s = krychle ? 'a' : 'a', popisky = krychle
    ? `<text class="kota" x="120" y="168">a = ${a} cm</text>`
    : `<text class="kota" x="110" y="168">a = ${a} cm</text>
       <text class="kota" x="205" y="150">b = ${b} cm</text>
       <text class="kota" x="30" y="80">c = ${c} cm</text>`;
  return `<svg class="teleso3d" viewBox="0 0 240 180">
    <polygon class="stena" points="40,50 160,50 160,140 40,140"/>
    <polygon class="stena tmava" points="40,50 80,20 200,20 160,50"/>
    <polygon class="stena tmava" points="160,50 200,20 200,110 160,140"/>
    ${popisky}</svg>`;
}

/* ---- Objem --------------------------------------------------------------------------- */
function objem() {
  const p = $('plocha');
  const krychle = Math.random() < 0.4;
  const a = Uloha.nahodneCislo(2, 12);
  const b = krychle ? a : Uloha.nahodneCislo(2, 12);
  const c = krychle ? a : Uloha.nahodneCislo(2, 12);
  const V = a * b * c;

  p.innerHTML = `<div class="zadani">Vypočítej objem tělesa:</div>
    ${svgKvadr(a, b, c, krychle)}
    <div class="rozmery">${krychle ? `krychle: a = ${a} cm` : `kvádr: a = ${a} cm, b = ${b} cm, c = ${c} cm`}</div>
    <div class="vzorec">${krychle ? 'V = a × a × a' : 'V = a × b × c'}</div>`;

  const jine = new Set([a * b, 2 * (a * b + b * c + a * c), V + a * b, Math.round(V / 2)]);
  jine.delete(V);
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([V, ...[...jine].slice(0, 3)]).map(v => ({ klic: String(v), popis: v + ' cm³' })),
    spravnyKlic: String(V),
    zpravaOk: `✅ V = ${a} × ${b} × ${c} = ${V} cm³`,
    zpravaChyba: 'Objem je součin všech tří rozměrů.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Povrch --------------------------------------------------------------------------- */
function povrch() {
  const p = $('plocha');
  const krychle = Math.random() < 0.4;
  const a = Uloha.nahodneCislo(2, 10);
  const b = krychle ? a : Uloha.nahodneCislo(2, 10);
  const c = krychle ? a : Uloha.nahodneCislo(2, 10);
  const S = 2 * (a * b + b * c + a * c);

  p.innerHTML = `<div class="zadani">Vypočítej povrch tělesa:</div>
    ${svgKvadr(a, b, c, krychle)}
    <div class="rozmery">${krychle ? `krychle: a = ${a} cm` : `kvádr: a = ${a} cm, b = ${b} cm, c = ${c} cm`}</div>
    <div class="vzorec">${krychle ? 'S = 6 × a × a' : 'S = 2 × (ab + bc + ac)'}</div>`;

  const jine = new Set([a * b * c, S / 2, a * b + b * c + a * c, S + 2 * a * b]);
  jine.delete(S);
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([S, ...[...jine].slice(0, 3)]).map(v => ({ klic: String(v), popis: v + ' cm²' })),
    spravnyKlic: String(S),
    zpravaOk: `✅ S = 2 × (${a}×${b} + ${b}×${c} + ${a}×${c}) = ${S} cm²`,
    zpravaChyba: 'Sečti obsahy tří různých stěn a vynásob dvěma.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Převody jednotek ------------------------------------------------------------------ */
const PREVODY = [
  { z: '1 dm³', na: 'litrů', k: 1 }, { z: '1 m³', na: 'litrů', k: 1000 },
  { z: '1 m³', na: 'dm³', k: 1000 }, { z: '1 dm³', na: 'cm³', k: 1000 },
  { z: '5 litrů', na: 'dm³', k: 5 }, { z: '2 m³', na: 'litrů', k: 2000 },
  { z: '3 dm³', na: 'cm³', k: 3000 }, { z: '500 cm³', na: 'dm³', k: 0.5 },
  { z: '1 hl', na: 'litrů', k: 100 }, { z: '250 litrů', na: 'm³', k: 0.25 },
];

function jednotky() {
  const p = $('plocha');
  const u = Uloha.nahodne(PREVODY);
  p.innerHTML = `<div class="zadani">Kolik je to?</div>
    <div class="karta"><div class="rozmery">${u.z} = ? ${u.na}</div></div>`;
  const jine = new Set([u.k * 10, u.k / 10, u.k * 100].filter(x => x > 0 && x !== u.k));
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([u.k, ...[...jine].slice(0, 3)])
      .map(v => ({ klic: String(v), popis: v + ' ' + u.na })),
    spravnyKlic: String(u.k),
    zpravaOk: `✅ ${u.z} = ${u.k} ${u.na}`,
    zpravaChyba: 'Pamatuj: 1 l = 1 dm³, 1 m³ = 1000 dm³ = 1000 l, 1 dm³ = 1000 cm³.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Slovní úloha ------------------------------------------------------------------------ */
function slovni() {
  const p = $('plocha');
  const typ = Uloha.nahodne(['akvarium', 'krabice', 'bazen']);
  let text, spravny, jednotka, vysvetleni;

  if (typ === 'akvarium') {
    const a = Uloha.nahodneCislo(4, 10), b = Uloha.nahodneCislo(3, 6), c = Uloha.nahodneCislo(3, 6);
    text = `Akvárium má rozměry ${a} dm × ${b} dm × ${c} dm. Kolik litrů vody se do něj vejde?`;
    spravny = a * b * c; jednotka = 'l';
    vysvetleni = `${a} × ${b} × ${c} = ${spravny} dm³, a 1 dm³ = 1 litr`;
  } else if (typ === 'krabice') {
    const a = Uloha.nahodneCislo(3, 9);
    text = `Kolik čtverečních centimetrů papíru je potřeba na krychlovou krabici o hraně ${a} cm?`;
    spravny = 6 * a * a; jednotka = 'cm²';
    vysvetleni = `6 × ${a} × ${a} = ${spravny} cm²`;
  } else {
    const a = Uloha.nahodneCislo(5, 12), b = Uloha.nahodneCislo(3, 8), c = Uloha.nahodneCislo(1, 3);
    text = `Bazén je ${a} m dlouhý, ${b} m široký a ${c} m hluboký. Kolik m³ vody pojme?`;
    spravny = a * b * c; jednotka = 'm³';
    vysvetleni = `${a} × ${b} × ${c} = ${spravny} m³`;
  }

  const jine = new Set([spravny * 2, Math.round(spravny / 2), spravny + 10].filter(x => x !== spravny && x > 0));
  p.innerHTML = `<div class="zadani">Vyřeš slovní úlohu:</div>
    <div class="karta"><div class="obrazek">${typ === 'akvarium' ? '🐠' : typ === 'krabice' ? '📦' : '🏊'}</div>
    <div class="rozmery" style="font-size:1.05rem;font-weight:600;max-width:520px;line-height:1.5">${text}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([spravny, ...[...jine].slice(0, 3)])
      .map(v => ({ klic: String(v), popis: v + ' ' + jednotka })),
    spravnyKlic: String(spravny),
    zpravaOk: `✅ ${vysvetleni}`,
    zpravaChyba: 'Rozmysli si, jestli počítáš objem (tři rozměry), nebo povrch (obsahy stěn).',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { objem, povrch, jednotky, slovni };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
