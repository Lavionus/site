<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>20. století v našich dějinách</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .udalost { max-width: 560px; font-size: 1.05rem; line-height: 1.55; }
    .rok { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 700; color: var(--accent); }
    .osoba { font-size: 1.3rem; font-weight: 700; }
    .osa { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; min-height: 46px; }
    .osa .bod {
      background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 8px;
      padding: 7px 11px; font-size: 0.84rem; font-weight: 600;
    }
    .osa .sipka { color: var(--text-faint); }
  </style>
</head>
<body>
  <h1>🕰️ 20. století v našich dějinách</h1>
  <p class="podtitul">Pro 5. ročník: od vzniku Československa po sametovou revoluci.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="rokUdalost" class="active">📅 Kdy se to stalo</button>
    <button data-rezim="coSeStalo">📜 Co se tehdy stalo</button>
    <button data-rezim="osobnosti">👤 Kdo to byl</button>
    <button data-rezim="poradi">↕️ Seřaď události</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Hlavní mezníky: <b>1918</b> vznik Československa · <b>1939–1945</b> druhá světová válka ·
    <b>1948</b> nástup komunistické vlády · <b>1968</b> okupace vojsky Varšavské smlouvy ·
    <b>1989</b> sametová revoluce · <b>1993</b> vznik České republiky.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_prv5_dejiny20', $('skore'));
let rezim = 'rokUdalost';

const UDALOSTI = [
  { rok: '1914', t: 'začala první světová válka', poradi: 1 },
  { rok: '1918', t: 'vzniklo samostatné Československo', poradi: 2 },
  { rok: '1938', t: 'Mnichovská dohoda odtrhla pohraničí', poradi: 3 },
  { rok: '1939', t: 'začala druhá světová válka a vznikl protektorát', poradi: 4 },
  { rok: '1945', t: 'skončila druhá světová válka', poradi: 5 },
  { rok: '1948', t: 'moc ve státě převzali komunisté', poradi: 6 },
  { rok: '1968', t: 'vojska Varšavské smlouvy obsadila Československo', poradi: 7 },
  { rok: '1989', t: 'sametová revoluce ukončila vládu jedné strany', poradi: 8 },
  { rok: '1993', t: 'Československo se rozdělilo na Česko a Slovensko', poradi: 9 },
  { rok: '2004', t: 'Česká republika vstoupila do Evropské unie', poradi: 10 },
];

const OSOBNOSTI = [
  { n: 'Tomáš Garrigue Masaryk', e: '🎩', cin: 'první československý prezident, zasloužil se o vznik republiky v roce 1918' },
  { n: 'Edvard Beneš', e: '📜', cin: 'prezident, který podepsal Mnichovskou dohodu a vedl exilovou vládu v Londýně' },
  { n: 'Václav Havel', e: '✌️', cin: 'dramatik a disident, po sametové revoluci se stal prezidentem' },
  { n: 'Alexander Dubček', e: '🌸', cin: 'vedl reformy pražského jara v roce 1968' },
  { n: 'Jan Palach', e: '🕯️', cin: 'student, který se v lednu 1969 upálil na protest proti okupaci' },
  { n: 'Emil Zátopek', e: '🏃', cin: 'běžec, který získal tři zlaté olympijské medaile v roce 1952' },
];

/* ---- Kdy se to stalo -------------------------------------------------------------- */
function rokUdalost() {
  const p = $('plocha');
  const u = Uloha.nahodne(UDALOSTI);
  const jine = Uloha.zamichej(UDALOSTI.filter(x => x.rok !== u.rok)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Ve kterém roce se to stalo?</div>
    <div class="karta"><div class="obrazek">📜</div><div class="udalost">${u.t}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.rok, popis: x.rok })),
    spravnyKlic: u.rok,
    zpravaOk: `✅ ${u.rok} – ${u.t}.`,
    zpravaChyba: 'To je rok jiné události – zkus to znovu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Co se tehdy stalo ------------------------------------------------------------- */
function coSeStalo() {
  const p = $('plocha');
  const u = Uloha.nahodne(UDALOSTI);
  const jine = Uloha.zamichej(UDALOSTI.filter(x => x.t !== u.t)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Co se stalo v tomto roce?</div>
    <div class="karta"><div class="rok">${u.rok}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.t, popis: x.t })),
    spravnyKlic: u.t,
    zpravaOk: `✅ V roce ${u.rok} ${u.t}.`,
    zpravaChyba: 'To se stalo v jiném roce.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Kdo to byl --------------------------------------------------------------------- */
function osobnosti() {
  const p = $('plocha');
  const o = Uloha.nahodne(OSOBNOSTI);
  const jine = Uloha.zamichej(OSOBNOSTI.filter(x => x.n !== o.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O koho jde?</div>
    <div class="karta"><div class="obrazek">${o.e}</div><div class="udalost">${o.cin}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([o, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: o.n,
    zpravaOk: `✅ ${o.n} – ${o.cin}.`,
    zpravaChyba: 'To byl někdo jiný.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Seřaď události ------------------------------------------------------------------ */
function poradi() {
  const p = $('plocha');
  const vyber = Uloha.zamichej(UDALOSTI).slice(0, 4).sort((a, b) => a.poradi - b.poradi);
  p.innerHTML = '<div class="zadani">Seřaď události od nejstarší po nejnovější.</div>';
  const osa = document.createElement('div');
  osa.className = 'osa';
  const nabidka = document.createElement('div');
  nabidka.className = 'nabidka';
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  let dalsiIndex = 0, chyboval = false;

  Uloha.zamichej(vyber).forEach(u => {
    const b = document.createElement('button');
    b.textContent = u.t;
    b.dataset.t = u.t;
    b.addEventListener('click', () => {
      if (b.disabled) return;
      if (u.t === vyber[dalsiIndex].t) {
        if (dalsiIndex > 0) {
          const s = document.createElement('span');
          s.className = 'sipka';
          s.textContent = '→';
          osa.appendChild(s);
        }
        const el = document.createElement('span');
        el.className = 'bod';
        el.textContent = `${u.rok}: ${u.t}`;
        osa.appendChild(el);
        b.disabled = true;
        dalsiIndex++;
        odezva.className = 'odezva ok';
        odezva.textContent = '✅ Správně!';
        if (dalsiIndex === vyber.length) {
          odezva.textContent = '🎉 Časová osa je hotová!';
          skore.vyhodnot(!chyboval);
          setTimeout(novaUloha, Uloha.PRODLEVA + 600);
        }
      } else {
        chyboval = true;
        Uloha.trhni(b);
        odezva.className = 'odezva chyba';
        odezva.textContent = 'Tahle událost je pozdější – hledej starší.';
      }
    });
    nabidka.appendChild(b);
  });
  p.append(osa, nabidka, odezva);
}

const REZIMY = { rokUdalost, coSeStalo, osobnosti, poradi };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
