<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ptáci a savci</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../uloha.js"></script>
  <style>
    .uloha-text { max-width: 620px; font-size: 1.02rem; line-height: 1.6; }
    .uloha-text b { color: var(--accent); }
    .druh { font-size: 1.15rem; font-weight: 700; }
    .zobak { width: min(220px, 60%); }
    .zobak path, .zobak polygon { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
  </style>
</head>
<body>
  <h1>🦅 Ptáci a savci</h1>
  <p class="podtitul">Pro 7. ročník: přizpůsobení stavby těla způsobu života a naši zástupci.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="zobaky" class="active">🐦 Zobák a potrava</button>
    <button data-rezim="koncetiny">🦶 Končetiny a způsob života</button>
    <button data-rezim="poznavacka">🔍 Poznávačka</button>
    <button data-rezim="rady">🗂️ Řády savců</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Tvar zobáku, končetin i chrupu prozradí, <b>čím se živočich živí a kde žije</b>.
    Ptáci i savci jsou <b>teplokrevní</b> – udržují si stálou tělesnou teplotu.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_pr7_ptaci_savci', $('skore'));
let rezim = 'zobaky';
function odezvaEl() { const d = document.createElement('div'); d.className = 'odezva'; return d; }

/* Zjednodušené tvary zobáků – tvar prozradí potravu */
const ZOBAKY = [
  { klic: 'dravec', popis: 'hákovitý zobák', potrava: 'trhá maso ulovené kořisti', priklad: 'káně, orel, sokol',
    tvar: '<path d="M20 60 L110 40 C140 40 150 55 130 70 C150 74 120 96 90 84 Z"/>' },
  { klic: 'zrnozravec', popis: 'krátký kuželovitý zobák', potrava: 'louská semena a zrní', priklad: 'zvonek, dlask, vrabec',
    tvar: '<polygon points="20,50 90,40 90,80 20,70"/><polygon points="90,40 130,60 90,80"/>' },
  { klic: 'hmyzozravec', popis: 'tenký špičatý zobák', potrava: 'sbírá drobný hmyz', priklad: 'sýkora, střízlík, rehek',
    tvar: '<polygon points="20,50 90,55 145,60 90,68 20,70"/>' },
  { klic: 'kachna', popis: 'plochý široký zobák', potrava: 'cedí potravu z vody a bahna', priklad: 'kachna, husa, labuť',
    tvar: '<path d="M20 50 L120 48 C145 50 145 72 120 74 L20 72 Z"/>' },
  { klic: 'brodivy', popis: 'dlouhý dýkovitý zobák', potrava: 'loví ryby a žáby v mělké vodě', priklad: 'volavka, čáp',
    tvar: '<polygon points="20,52 170,58 170,64 20,70"/>' },
  { klic: 'datel', popis: 'silný rovný zobák jako dláto', potrava: 'tesá do dřeva a hledá larvy', priklad: 'strakapoud, datel',
    tvar: '<polygon points="20,48 140,56 140,66 20,72"/>' },
];
function zobaky() {
  const p = $('plocha');
  const z = Uloha.nahodne(ZOBAKY);
  const ptameSeNaPotravu = Math.random() < 0.5;
  p.innerHTML = `<div class="zadani">${ptameSeNaPotravu
    ? 'Čím se živí pták s takovým zobákem?' : 'Který zobák patří ptákovi, který ' + z.potrava + '?'}</div>
    ${ptameSeNaPotravu ? `<div class="karta"><svg class="zobak" viewBox="0 0 190 120">${z.tvar}</svg>
      <div class="popis">${z.popis}</div></div>` : ''}`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: ptameSeNaPotravu
      ? Uloha.zamichej([z, ...Uloha.zamichej(ZOBAKY.filter(x => x.klic !== z.klic)).slice(0, 3)])
        .map(x => ({ klic: x.klic, popis: x.potrava }))
      : Uloha.zamichej([z, ...Uloha.zamichej(ZOBAKY.filter(x => x.klic !== z.klic)).slice(0, 3)])
        .map(x => ({ klic: x.klic, popis: x.popis })),
    spravnyKlic: z.klic,
    zpravaOk: `✅ ${z.popis} – ${z.potrava} (${z.priklad})`,
    zpravaChyba: 'Tvar zobáku je nástroj: hák trhá, dláto tesá, plochý zobák cedí vodu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const PRIZPUSOBENI = [
  { q: 'K čemu má kachna plovací blány mezi prsty?', a: 'k plavání – noha funguje jako veslo', b: ['k hrabání v zemi', 'k uchopení kořisti', 'k šplhání po stromech'] },
  { q: 'Proč má datel dva prsty dopředu a dva dozadu?', a: 'aby se udržel na svislém kmeni', b: ['aby lépe plaval', 'aby rychleji běhal', 'aby unesl kořist'] },
  { q: 'K čemu slouží dravci ostré zahnuté drápy?', a: 'k uchopení a usmrcení kořisti', b: ['k hrabání nory', 'k šplhání', 'k čištění peří'] },
  { q: 'Proč má krtek lopatovité přední končetiny?', a: 'hrabe jimi podzemní chodby', b: ['plave s nimi', 'šplhá po stromech', 'brání se jimi'] },
  { q: 'Čím se pohybuje netopýr?', a: 'létá – blána je napjatá mezi prsty', b: ['plachtí bez blány', 'jen leze', 'skáče'] },
  { q: 'Proč má zajíc dlouhé zadní nohy?', a: 'k rychlému běhu a skokům', b: ['k hrabání', 'k plavání', 'k držení potravy'] },
  { q: 'K čemu slouží veverce dlouhý huňatý ocas?', a: 'k udržení rovnováhy při skocích', b: ['k obraně', 'k plavání', 'k hledání potravy'] },
  { q: 'Proč mají kopytníci na nohou kopyta?', a: 'chrání prsty při rychlém běhu po tvrdé zemi', b: ['pomáhají plavat', 'slouží k hrabání', 'brání se jimi predátorům'] },
  { q: 'K čemu slouží šelmám špičáky?', a: 'k uchopení a usmrcení kořisti', b: ['k žvýkání trávy', 'k drcení semen', 'k hrabání'] },
  { q: 'Proč má sova měkké peří na okrajích křídel?', a: 'aby letěla téměř neslyšně', b: ['aby se udržela ve vodě', 'aby lépe viděla', 'aby se zahřála'] },
];
function koncetiny() {
  const p = $('plocha');
  const u = Uloha.nahodne(PRIZPUSOBENI);
  p.innerHTML = `<div class="zadani uloha-text">${u.q}</div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.a, ...u.b]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.a,
    zpravaOk: `✅ ${u.a}`,
    zpravaChyba: 'Stavba těla vždy odpovídá prostředí a způsobu obživy.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const RADY = {
  hmyzozravci: 'hmyzožravci', letouni: 'letouni', hlodavci: 'hlodavci',
  selmy: 'šelmy', sudokopytnici: 'sudokopytníci', zajici: 'zajícovci',
};
const SAVCI = [
  { n: 'ježek západní', r: 'hmyzozravci', i: '🦔', popis: 'bodliny na hřbetě, loví hmyz a plže' },
  { n: 'krtek obecný', r: 'hmyzozravci', i: '🕳️', popis: 'hrabe podzemní chodby, živí se žížalami' },
  { n: 'netopýr velký', r: 'letouni', i: '🦇', popis: 'jediný savec schopný aktivního letu, orientuje se echolokací' },
  { n: 'veverka obecná', r: 'hlodavci', i: '🐿️', popis: 'hlodavé zuby, sbírá oříšky a semena' },
  { n: 'bobr evropský', r: 'hlodavci', i: '🦫', popis: 'staví hráze, kácí stromy zuby' },
  { n: 'myšice lesní', r: 'hlodavci', i: '🐭', popis: 'drobný noční hlodavec lesů' },
  { n: 'liška obecná', r: 'selmy', i: '🦊', popis: 'šelma s huňatým ocasem, loví hraboše' },
  { n: 'kuna lesní', r: 'selmy', i: '🦡', popis: 'štíhlá lasicovitá šelma, šplhá po stromech' },
  { n: 'rys ostrovid', r: 'selmy', i: '🐆', popis: 'naše největší kočkovitá šelma se štětičkami na uších' },
  { n: 'srnec obecný', r: 'sudokopytnici', i: '🦌', popis: 'přežvýkavec s parůžky, žije v lesích a na polích' },
  { n: 'prase divoké', r: 'sudokopytnici', i: '🐗', popis: 'všežravec s rypákem, ryje v zemi' },
  { n: 'jelen lesní', r: 'sudokopytnici', i: '🫎', popis: 'velký přežvýkavec s mohutným parožím' },
  { n: 'zajíc polní', r: 'zajici', i: '🐇', popis: 'dlouhé uši i zadní nohy, mláďata se rodí vidoucí' },
  { n: 'králík divoký', r: 'zajici', i: '🐰', popis: 'žije v norách v koloniích' },
];
function rady() {
  const p = $('plocha');
  const s = Uloha.nahodne(SAVCI);
  p.innerHTML = `<div class="zadani">Do kterého řádu savců patří?</div>
    <div class="karta"><div class="obrazek">${s.i}</div><div class="druh">${s.n}</div>
      <div class="popis" style="color:var(--text-faint);font-weight:400">${s.popis}</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([s.r, ...Uloha.zamichej(Object.keys(RADY).filter(k => k !== s.r)).slice(0, 3)])
      .map(k => ({ klic: k, popis: RADY[k] })),
    spravnyKlic: s.r,
    zpravaOk: `✅ ${s.n} – ${RADY[s.r]}`,
    zpravaChyba: 'Pomůže chrup a potrava: hlodavé zuby, špičáky šelem, přežvýkavci bez horních řezáků.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const PTACI = [
  { n: 'sýkora koňadra', i: '🐦', popis: 'černý pruh na žlutém bříšku, běžná u krmítek' },
  { n: 'vrabec domácí', i: '🐦', popis: 'hnědý pěvec žijící u lidských sídel' },
  { n: 'kos černý', i: '🐦‍⬛', popis: 'samec je černý s oranžovým zobákem' },
  { n: 'strakapoud velký', i: '🪶', popis: 'černobílý pták, bubnuje do kmenů' },
  { n: 'káně lesní', i: '🦅', popis: 'dravec často sedící na sloupech u polí' },
  { n: 'poštolka obecná', i: '🦅', popis: 'dravec, který se při lovu třepotá na místě' },
  { n: 'sova pálená', i: '🦉', popis: 'srdčitý závoj v obličeji, loví v noci' },
  { n: 'labuť velká', i: '🦢', popis: 'velký bílý vodní pták s dlouhým krkem' },
  { n: 'čáp bílý', i: '🕊️', popis: 'hnízdí na komínech, na zimu odlétá do Afriky' },
  { n: 'vlaštovka obecná', i: '🐦', popis: 'vidličnatý ocas, hnízdí ve stájích' },
];
function poznavacka() {
  const p = $('plocha');
  const ptak = Math.random() < 0.5;
  const sada = ptak ? PTACI : SAVCI;
  const z = Uloha.nahodne(sada);
  const jine = Uloha.zamichej(sada.filter(x => x.n !== z.n)).slice(0, 3).map(x => x.n);
  p.innerHTML = `<div class="zadani">Který druh to je?</div>
    <div class="karta"><div class="obrazek">${z.i}</div>
      <div class="popis" style="font-weight:400">${z.popis}</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([z.n, ...jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: z.n,
    zpravaOk: `✅ ${z.n}`,
    zpravaChyba: 'Popis obsahuje typický poznávací znak – zbarvení, chování nebo prostředí.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { zobaky, koncetiny, poznavacka, rady };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
novaUloha();
</script>
</body>
</html>
