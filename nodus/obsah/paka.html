    const S=this.STUPNE;
    const sirkaZubu=S.reduce((a,s)=>a+Math.max(s.zh,s.zd)+3,0);
    const modul=Math.min(3.4,(w*0.90)/sirkaZubu,(h*0.62)/64);
    const rozt=modul*60/2;                       // všechny dvojice mají stejnou osovou vzdálenost
    const yH=h*0.36, yD=yH+rozt;
    let x=(w-modul*sirkaZubu)/2;
    // hřídele
    ctx.strokeStyle=C.silny; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(20,yH); ctx.lineTo(w-20,yH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20,yD); ctx.lineTo(w-20,yD); ctx.stroke();
    popis('hřídel od motoru',24,yH-modul*24-14,C.muted,'11px sans-serif','left');
    popis('hřídel ke kolům',24,yD+modul*24+16,C.muted,'11px sans-serif','left');
    S.forEach((s,i)=>{
      const sirka=modul*(Math.max(s.zh,s.zd)+3);
      const sx=x+sirka/2; x+=sirka;
      const zarazen=this.stupen===i+1;
      const slabe=zarazen?1:0.28;
      const fH=this.faze;
      let fD;
      if(s.zpet){
        // zpátečka: mezikolo mimo osu obou hřídelí, proto se smysl otáčení obrátí
        const zi=15, d=rozt, a=modul*(s.zh+zi)/2, b=modul*(s.zd+zi)/2;
        const py=(a*a-b*b+d*d)/(2*d), px=Math.sqrt(Math.max(0,a*a-py*py));
        const bx=sx+px, by=yH+py;
        const fI=this.fazeSouseda(fH,s.zh,zi,Math.atan2(by-yH,bx-sx));
        fD=this.fazeSouseda(fI,zi,s.zd,Math.atan2(yD-by,sx-bx));
        this.kresliKolo(bx,by,zi,modul,fI,C.danger,'',{slabe,tenke:true});
        if(zarazen) popis('mezikolo',bx+modul*zi/2+8,by,C.danger,'11px sans-serif','left');
      }else{
        fD=this.fazeSouseda(fH,s.zh,s.zd,Math.PI/2);
      }
      this.kresliKolo(sx,yH,s.zh,modul,fH,zarazen?C.akcent:C.faint,'',{slabe,tenke:!zarazen});
      this.kresliKolo(sx,yD,s.zd,modul,fD,zarazen?C.ok:C.faint,'',{slabe,tenke:!zarazen});
      popis(s.n,sx,yD+modul*s.zd/2+16,zarazen?C.text:C.faint,zarazen?'bold 13px sans-serif':'12px sans-serif');
      popis(s.zh+'/'+s.zd,sx,yH-modul*s.zh/2-14,zarazen?C.muted:C.faint,'11px sans-serif');
      if(zarazen){
        // objímka spojuje kolo napevno s hřídelí – jen tudy jde výkon
        ctx.fillStyle=C.warn;
        ctx.fillRect(sx-modul*s.zd/2-14,yD-7,10,14);
        popis('objímka',sx-modul*s.zd/2-18,yD-18,C.warn,'10px sans-serif','right');
      }
    });
    if(this.stupen===0) popis('Neutrál – soukolí se točí, ale k hřídeli ke kolům není nic připojené',w/2,26,C.warn,'bold 13px sans-serif');
  },

  /* ---------- 5) diferenciál ----------
     Diferenciál je v jádru geometrie: v zatáčce opíše vnější kolo delší oblouk
     než vnitřní, a proto se musí točit rychleji. Hlavní obrázek je tedy pohled
     shora na auto v zatáčce se stopami obou kol – bez něj je diferenciál jen
     krabice s koly. Mechanismus je vedle jako výřez, ve stejném pohledu shora. */
  ROZCHOD: 1.5,        // rozchod kol v metrech

  /* Posuvník neznamená abstraktní podíl, ale skutečný poloměr zatáčky:
     0 = rovně, krajní poloha = nejostřejší zatáčka, jakou auto svede (4 m). */
  polomerZatacky(){
    const z=Math.abs(this.zatacka)/100;
    return z<0.01?Infinity:4+(1-z)*26;
  },
  /* O kolik se kola liší: r = rozchod / (2 · poloměr zatáčky). */
  podilRozdilu(){
    if(this.naLedu) return 1;
    const R=this.polomerZatacky();
    return R===Infinity?0:this.ROZCHOD/(2*R);
  },

  diferencial(w,h){
    const nk=this.otackyKardan, r=this.podilRozdilu(), doprava=this.zatacka>=0;
    const nVnitrni=nk*(1-r), nVnejsi=nk*(1+r);
    // na ledu stojí kolo bez přilnavosti a druhé se protáčí dvojnásobnými otáčkami
    const nL=this.naLedu?0:(doprava?nVnitrni:nVnejsi);
    const nP=this.naLedu?nk*2:(doprava?nVnejsi:nVnitrni);

    const uzke=w<760;
    this.kresliZatacku(uzke?w:w*0.60,h*0.72,doprava,nL,nP);
    if(!uzke) this.kresliMechanismus(w*0.60,0,w*0.40,h*0.72,nL,nP);
    this.kresliHoupacku(w,h,nL,nP,nk);
  },

  /* --- pohled shora: auto a stopy obou kol --- */
  kresliZatacku(w,h,doprava,nL,nP){
    const Rz=this.polomerZatacky();
    const textY=h-52;                       // spodní pruh patří popiskům, scéna do něj nesmí
    const cx=w*0.5, cy=(textY)*0.5;
    const R=Math.min(w,textY)*0.32;

    if(!this.naLedu) this.ujeto=(this.ujeto+(nL+nP)/2*0.00012)%(Math.PI*0.6);
    const uhel=this.naLedu?0.0001:this.ujeto;

    if(Rz===Infinity||this.naLedu){
      /* Jízda rovně (a stání na ledu): žádný oblouk, obě stopy jsou rovnoběžky
         stejné délky – jinak by obrázek odporoval popisku „rovně“. */
      const rozchodPx=30, delka=R*1.4;
      const y0=cy+delka/2, y1=y0-delka*(this.naLedu?0.02:uhel/(Math.PI*0.6));
      const stopa=(x,barva)=>{
        ctx.setLineDash([5,6]); ctx.strokeStyle=C.border; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,cy-delka/2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle=barva; ctx.lineWidth=6; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
      };
      stopa(cx-rozchodPx/2,C.warn);
      stopa(cx+rozchodPx/2,C.ok);
      this.kresliAuto(cx,y1,-Math.PI/2,rozchodPx,doprava,this.naLedu?'led':'rovne');
    }else{
      // v poměru: rozchod na obrazovce odpovídá skutečnému poměru rozchod : poloměr
      const rozchodPx=Math.max(7,Math.min(44,R*this.ROZCHOD/Rz));
      const Sx=cx+(doprava?R*0.62:-R*0.62), Sy=cy;
      const zacU=doprava?Math.PI:0, smer=doprava?-1:1;
      const oblouk=(polomer,barva,sirka,cely)=>{
        ctx.strokeStyle=barva; ctx.lineWidth=sirka; ctx.lineCap='round';
        if(cely) ctx.setLineDash([5,6]);
        ctx.beginPath();
        ctx.arc(Sx,Sy,polomer,zacU,zacU+smer*(cely?Math.PI*0.6:uhel),doprava);
        ctx.stroke(); ctx.setLineDash([]);
      };
      oblouk(R-rozchodPx/2,C.border,2,true);
      oblouk(R+rozchodPx/2,C.border,2,true);
      oblouk(R-rozchodPx/2,C.warn,6);        // vnitřní stopa
      oblouk(R+rozchodPx/2,C.ok,6);          // vnější stopa

      ctx.setLineDash([4,5]); ctx.strokeStyle=C.border; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(Sx,Sy,4,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      popis('střed zatáčky',Sx,Sy-13,C.faint,'10px sans-serif');

      const a=zacU+smer*uhel;
      this.kresliAuto(Sx+Math.cos(a)*R,Sy+Math.sin(a)*R,a+Math.PI/2,rozchodPx,doprava,'zatacka');
    }

    // popisky dole – délky se počítají ze skutečných poloměrů v metrech
    if(this.naLedu){
      popis('🧊 Levé kolo stojí na ledu – protáčí se pravé a auto se nerozjede.',
        w*0.5,h-34,C.danger,'bold 13px sans-serif');
      popis('Diferenciál pošle moment tam, kde je menší odpor. Proto se do aut dává uzávěrka.',
        w*0.5,h-14,C.faint,'11px sans-serif');
    }else if(Rz===Infinity){
      popis('Rovně: obě kola opisují stejně dlouhou dráhu, takže se točí stejně rychle.',
        w*0.5,h-34,C.muted,'12px sans-serif');
      popis('Posuň jezdcem Zatáčka a sleduj, jak se stopy kol rozejdou.',
        w*0.5,h-14,C.faint,'11px sans-serif');
    }else{
      const dVn=(Rz-this.ROZCHOD/2)*uhel, dVe=(Rz+this.ROZCHOD/2)*uhel;
      popis(`vnitřní kolo ujelo ${cz(dVn,1)} m`,w*0.5,h-46,C.warn,'bold 12px sans-serif');
      popis(`vnější kolo ujelo ${cz(dVe,1)} m – o ${cz(dVe-dVn,1)} m víc`,
        w*0.5,h-28,C.ok,'bold 12px sans-serif');
      popis(`poloměr zatáčky ${cz(Rz,1)} m · rozchod kol ${cz(this.ROZCHOD,1)} m`,
        w*0.5,h-10,C.faint,'10px sans-serif');
    }
  },

  /* Auto shora: karoserie je vždy čitelně velká, kola sedí na skutečném rozchodu. */
  kresliAuto(x,y,natoceni,rozchodPx,doprava,stav){
    ctx.save(); ctx.translate(x,y); ctx.rotate(natoceni);
    const sir=Math.max(26,rozchodPx), dl=sir*1.7;
    ctx.fillStyle=C.panel; ctx.strokeStyle=C.text; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.rect(-sir/2,-dl/2,sir,dl); ctx.fill(); ctx.stroke();
    ctx.strokeStyle=C.faint; ctx.lineWidth=1.5;      // čelní sklo napoví, kam auto míří
    ctx.beginPath(); ctx.moveTo(-sir/2+3,-dl*0.22); ctx.lineTo(sir/2-3,-dl*0.22); ctx.stroke();
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([kx,ky])=>{
      const vnitrni = doprava ? kx>0 : kx<0;         // v pravotočivé je vnitřní pravé kolo
      ctx.fillStyle = stav==='zatacka' ? (vnitrni?C.warn:C.ok)
        : stav==='led' ? (kx>0?C.danger:C.silny)     // vpravo se protáčí, vlevo stojí na ledu
        : C.muted;
      ctx.fillRect(kx*rozchodPx/2-2.5,ky*dl*0.3-6,5,13);
    });
    // na ledu odlišíme protáčející se kolo čárkami pohybu
    if(stav==='led'){
      ctx.strokeStyle=C.danger; ctx.lineWidth=1.5;
      for(let i=0;i<3;i++){
        const yy=dl*0.3-6+i*5;
        ctx.beginPath(); ctx.moveTo(rozchodPx/2+6,yy); ctx.lineTo(rozchodPx/2+13,yy); ctx.stroke();
      }
    }
    ctx.restore();
  },

  /* --- výřez: co se přitom děje uvnitř skříně --- */
  kresliMechanismus(x0,y0,w,h,nL,nP){
    const cx=x0+w/2, cy=y0+h*0.52;
    const R=Math.min(w*0.30,h*0.26);
    ctx.strokeStyle=C.border; ctx.lineWidth=1.5; ctx.setLineDash([5,5]);
    ctx.strokeRect(x0+10,y0+22,w-20,h-46); ctx.setLineDash([]);
    popis('uvnitř skříně diferenciálu',cx,y0+38,C.faint,'11px sans-serif');

    ctx.strokeStyle=C.silny; ctx.lineWidth=7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx-w*0.34,cy); ctx.lineTo(cx+w*0.34,cy); ctx.stroke();

    const modul=Math.min(4,R*2/38);
    this.kresliKolo(cx,cy,36,modul,this.faze,C.akcent,'',{bezNaboje:true});
    popis('koš (talířové kolo)',cx,cy-R-14,C.akcent,'11px sans-serif');

    const okno=R*0.7;
    ctx.fillStyle=C.deep; ctx.strokeStyle=C.border; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,okno,0,Math.PI*2); ctx.fill(); ctx.stroke();

    // satelit obíhá s košem a NAVÍC se točí kolem sebe – o polovinu rozdílu kol
    const nSat=Math.abs(nP-nL)/2;
    const rs=okno*0.5;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(this.faze);
    ctx.strokeStyle=C.warn; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-rs,0); ctx.lineTo(rs,0); ctx.stroke();
    ctx.restore();
    const sx=cx+Math.cos(this.faze)*rs, sy=cy+Math.sin(this.faze)*rs;
    const fSat=this.faze*(1+nSat*0.05);
    this.kresliKolo(sx,sy,11,modul*0.75,fSat,C.warn,'',{tenke:true,vypln:C.panel});
    // červená ručička ukáže, jestli se satelit točí kolem sebe, nebo jen obíhá
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(fSat);
    ctx.strokeStyle=C.danger; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(modul*0.75*5,0); ctx.stroke();
    ctx.restore();

    popis(nSat<0.5?'satelit se netočí, jen obíhá s košem':`satelit se točí ${cz(nSat,0)} /min`,
      cx,cy+R+20,nSat<0.5?C.faint:C.warn,'bold 11px sans-serif');
    popis(nSat<0.5?'obě kola mají stejné otáčky':'to je přesně polovina rozdílu kol',
      cx,cy+R+36,C.faint,'10px sans-serif');
  },

  /* --- houpačka: proč je průměr otáček pořád stejný --- */
  kresliHoupacku(w,h,nL,nP,nk){
    const y=h-52, sirka=Math.min(w*0.6,500), cx=w/2;
    // Náklon zvětšujeme, aby i desetiprocentní rozdíl byl vidět; čísla u konců
    // zůstávají přesná, houpačka ukazuje jen to, že se střed nehne.
    const rozdil=Math.max(Math.abs(nL-nk),Math.abs(nP-nk));
    const naY=n=>y-(rozdil<0.5?0:(n-nk)/rozdil*34);
    const xL=cx-sirka/2, xP=cx+sirka/2;

    ctx.setLineDash([4,4]); ctx.strokeStyle=C.border; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(xL-24,y); ctx.lineTo(xP+24,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=C.akcent; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(cx,y+8); ctx.lineTo(cx-12,y+26); ctx.lineTo(cx+12,y+26); ctx.closePath(); ctx.stroke();

    ctx.strokeStyle=C.text; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(xL,naY(nL)); ctx.lineTo(xP,naY(nP)); ctx.stroke();
    const konec=(x,n,barva,jmeno)=>{
      ctx.fillStyle=barva;
      ctx.beginPath(); ctx.arc(x,naY(n),8,0,Math.PI*2); ctx.fill();
      popis(jmeno,x,naY(n)-19,barva,'11px sans-serif');
      popis(cz(n,0)+' /min',x,naY(n)+24,C.text,'bold 12px sans-serif');
    };
    konec(xL,nL,C.warn,'levé kolo');
    konec(xP,nP,C.ok,'pravé kolo');
    ctx.fillStyle=C.akcent;
    ctx.beginPath(); ctx.arc(cx,y,6,0,Math.PI*2); ctx.fill();
    popis(`koš ${cz(nk,0)} /min`,cx,y+42,C.akcent,'bold 12px sans-serif');
    popis('Střed houpačky se nehne: o kolik jedno kolo přidá, o tolik druhé ubere.',
      cx,y-40,C.muted,'12px sans-serif');
  },

  tahni(typ,x,y,vych){
    const kolo=this.geo[+typ.slice(4)];
    if(!kolo) return;
    const uhel=Math.atan2(y-kolo.y,x-kolo.x);
    let d=uhel-vych.uhel;
    while(d>Math.PI) d-=2*Math.PI;
    while(d<-Math.PI) d+=2*Math.PI;
    this.faze=vych.faze+d*(kolo.prevod||1);
    vych.uhel=uhel; vych.faze=this.faze;
  },

  /* obsah pravého sloupce – stejný styl jako u páky a kladek */
  vypocet(){
    const R=[];
    if(this.rezim==='dvojice'){
      const i=this.z2/this.z1, n2=this.otacky/i, M2=this.moment*i;
      const maxN=Math.max(this.otacky,n2,1), maxM=Math.max(this.moment,M2,1);
      R.push(['h','📐 Dvě kola v záběru'],
        ['v','n₁ · z₁ = n₂ · z₂   (zuby zabírají stejně rychle)'],
        ['v','i = z₂ / z₁ = '+this.z2+' / '+this.z1+' = '+cz(i,2)],null,
        ['v','n₂ = n₁ / i = '+this.otacky+' / '+cz(i,2)+' = '+cz(n2,1)+' /min',C.akcent],
        ['b','n₁ = '+this.otacky+' /min (hnací)',this.otacky/maxN,C.warn],
        ['b','n₂ = '+cz(n2,1)+' /min (hnané)',n2/maxN,C.akcent],null,
        ['v','M₂ = M₁ · i = '+this.moment+' · '+cz(i,2)+' = '+cz(M2,1)+' N·m',C.ok],
        ['b','M₁ = '+this.moment+' N·m',this.moment/maxM,C.warn],
        ['b','M₂ = '+cz(M2,1)+' N·m',M2/maxM,C.ok],null,
        ['h','💡 Co se děje a proč'],
        ['p',i>1?'Hnané kolo má víc zubů, proto se otočí jednou za '+cz(i,2)+' otáčky malého. Je to převod do pomala: otáčky klesnou '+cz(i,2)+'× a moment o tolikrát vzroste – jako lehký převod na kole do kopce.'
             :i<1?'Hnané kolo má míň zubů, proto se točí '+cz(1/i,2)+'× rychleji. Je to převod do rychla: za rychlost platíš menším momentem.'
             :'Stejný počet zubů znamená stejné otáčky i stejný moment – kola jen přenášejí pohyb dál.'],
        ['p',this.mezi?'Mezikolo do počtu zubů nezasahuje, převodový poměr zůstává '+cz(i,2)+'. Mění jen smysl otáčení – obě krajní kola se teď točí stejným směrem.'
                      :'Kola v přímém záběru se točí proti sobě. Zapni mezikolo: poměr se nezmění, ale smysl otáčení se obrátí.']);
      return R;
    }
    if(this.rezim==='soukoli'){
      const i1=this.z2/this.z1, i2=this.z4/this.z3, i=i1*i2, nv=this.otacky/i;
      R.push(['h','📐 Vícestupňové soukolí'],
        ['v','i₁ = z₂/z₁ = '+this.z2+'/'+this.z1+' = '+cz(i1,2)],
        ['v','i₂ = z₄/z₃ = '+this.z4+'/'+this.z3+' = '+cz(i2,2)],
        ['v','i = i₁ · i₂ = '+cz(i,2)+'   ← převody se násobí',C.ok],null,
        ['v','n = '+this.otacky+' / '+cz(i,2)+' = '+cz(nv,2)+' /min',C.akcent],
        ['v','M = '+this.moment+' · '+cz(i,2)+' = '+cz(this.moment*i,1)+' N·m',C.ok],
        ['b','vstup '+this.otacky+' /min',1,C.warn],
        ['b','výstup '+cz(nv,2)+' /min',nv/Math.max(this.otacky,nv,1),C.akcent],null,
        ['h','💡 Co se děje a proč'],
        ['p','Dva stupně za sebou se nesčítají, ale násobí: první zpomalí '+cz(i1,2)+'× a druhý ještě '+cz(i2,2)+'×. Proto se i z malých kol dá poskládat obrovské zpomalení.'],
        ['p','Prostřední hřídel nese dvě kola napevno, takže se točí jako jeden kus – co na ni přijde z prvního stupně, to předá do druhého.']);
      return R;
    }
    if(this.rezim==='hodiny'){
      const c=this.cas, dve=n=>String(n).padStart(2,'0');
      R.push(['h','📐 Hodinový strojek'],
        ['v','čas '+dve(Math.floor(c/3600)%12||12)+':'+dve(Math.floor(c/60)%60)+':'+dve(Math.floor(c%60))+'   (zrychleno '+this.rychlost+'×)'],null,
        ['v','sekundová  1 otáčka / min'],
        ['v','minutová   1 otáčka / hod   = 60× pomaleji',C.akcent],
        ['v','hodinová   1 otáčka / 12 h  = 720× pomaleji',C.ok],null,
        ['v','1 : 60 = 1 : 6  ×  1 : 10'],
        ['h','💡 Co se děje a proč'],
        ['p','Poměr 1:60 se nedělá jedním kolem – to by muselo mít 60× víc zubů než pastorek. Rozloží se proto na dvě soukolí za sebou (1:6 a 1:10), jejichž převody se násobí.'],
        ['p','Ručičky jsou napevno na hřídelích jednotlivých kol, takže poměr jejich otáček je přesně daný počty zubů – hodiny proto nejdou „rozladit".']);
      return R;
    }
    if(this.rezim==='prevodovka'){
      const i=this.prevod();
      if(!i){
        R.push(['h','📐 Převodovka – neutrál'],
          ['v','objímka nespojuje žádné kolo s hřídelí'],
          ['v','motor '+this.otackyMotor+' /min → kola 0 /min'],null,
          ['h','💡 Co se děje a proč'],
          ['p','Kola na výstupní hřídeli se volně protáčejí, ale žádné z nich není spojené s hřídelí. Motor se točí naprázdno a k kolům auta nejde nic.']);
        return R;
      }
      const st=this.STUPNE[this.stupen-1], celkem=Math.abs(i)*this.ROZVOD;
      const nKol=this.otackyMotor/celkem, v=nKol/60*this.OBVOD_KOLA*3.6;
      R.push(['h','📐 Převodovka – '+st.n+' stupeň'],
        ['v','i = z_hnané / z_hnací = '+st.zd+' / '+st.zh+' = '+cz(Math.abs(i),2)],
        ['v','celkem = i · stálý převod 3,9 = '+cz(celkem,2),C.ok],null,
        ['v','n_kol = '+this.otackyMotor+' / '+cz(celkem,2)+' = '+cz(nKol,0)+' /min',C.akcent],
        ['v','v = n_kol · obvod 1,95 m = '+cz(v,0)+' km/h'+(i<0?' vzad':''),C.akcent],
        ['v','moment na kolech '+cz(celkem,1)+'× větší než na motoru',C.ok],null,
        ['h','💡 Co se děje a proč'],
        ['p',Math.abs(i)>1?'Zařazený stupeň zpomaluje: kola se točí '+cz(Math.abs(i),2)+'× pomaleji než hřídel motoru, zato mají o tolikrát větší moment. Proto se z místa rozjíždí jedničkou.'
                          :'Tenhle stupeň má převod pod 1 – kola se točí rychleji než hřídel motoru. Moment je menší, hodí se proto jen na rovinu a vyšší rychlost.'],
        ['p','Stálý převod 3,9 v rozvodovce platí pro všechny stupně, proto se s ním převod stupně vždycky vynásobí.'+(i<0?' Zpátečka přidává mezikolo, které obrátí smysl otáčení.':'')]);
      return R;
    }
    const nk=this.otackyKardan, r=this.podilRozdilu(), doprava=this.zatacka>=0, Rz=this.polomerZatacky();
    const nL=this.naLedu?0:(doprava?nk*(1-r):nk*(1+r));
    const nP=this.naLedu?nk*2:(doprava?nk*(1+r):nk*(1-r));
    const maxN=Math.max(nL,nP,1);
    R.push(['h','📐 Diferenciál'],
      ['v','n_levé + n_pravé = 2 · n_koš'],
      ['v',cz(nL,0)+' + '+cz(nP,0)+' = '+cz(nL+nP,0)+' = 2 · '+cz(nk,0),C.ok],null,
      ['b','levé kolo '+cz(nL,0)+' /min',nL/maxN,C.warn],
      ['b','pravé kolo '+cz(nP,0)+' /min',nP/maxN,C.akcent],null);
    if(this.naLedu)
      R.push(['v','kolo na ledu se protáčí 2× rychleji',C.danger],
        ['v','druhé kolo stojí → auto se nerozjede',C.danger],null,
        ['h','💡 Co se děje a proč'],
        ['p','Diferenciál rozdělí moment na obě kola stejně. Kolo na ledu ale unese jen mizivý moment – a stejně malý proto zbude i na kolo s trakcí. Všechny otáčky spolkne protáčející se kolo.'],
        ['p','Proto se auto na ledu nerozjede, i když motor točí. Pomůže uzávěrka diferenciálu nebo brzda protáčejícího se kola.']);
    else if(Rz===Infinity)
      R.push(['v','rovně: obě kola '+cz(nk,0)+' /min'],
        ['v','satelit se netočí, koš jede jako jeden kus'],null,
        ['h','💡 Co se děje a proč'],
        ['p','Když jedou obě kola stejně, satelity se kolem své osy netočí a diferenciál se chová jako pevná spojka.'],
        ['p','Zatoč posuvníkem: vnější kolo musí opsat delší oblouk, takže se musí točit rychleji než vnitřní.']);
    else
      R.push(['v','poloměr zatáčky R = '+cz(Rz,1)+' m'],
        ['v','rozdíl = rozchod / (2·R) = '+cz(r*100,1)+' %'],
        ['v','vnější kolo je o '+cz(r*200,0)+' % rychlejší',C.akcent],null,
        ['h','💡 Co se děje a proč'],
        ['p','V zatáčce opíše vnější kolo delší dráhu než vnitřní. Satelit se pootočí přesně o polovinu jejich rozdílu a rozdělí otáčky nesouměrně.'],
        ['p','Součet otáček obou kol ale zůstává stejný – rovná se dvojnásobku otáček koše. Proto se rychlost auta zatáčením nezmění.']);
    return R;
  },

  napoveda(){
    const spolecne='<br><br><b>Zkus si</b><br>• U kol s tečkovanou <b>roztečnou kružnicí</b> si všimni, že se obě kružnice dotýkají v jednom bodě – po nich se kola odvalují.';
    return {
      dvojice:`<b>Dvě kola v záběru</b><br>Zuby zabírají do sebe, takže obvodová rychlost je stejná: n₁·z₁ = n₂·z₂.
        Malé kolo se točí rychleji.<br><br><b>Zkus si</b><br>• Chyť kolo myší a otoč jím.<br>
        • Malé hnací + velké hnané = <b>převod do pomala</b>: menší otáčky, větší moment (lehký převod do kopce).<br>
        • Zapni <b>mezikolo</b> – převod se nezmění, ale obrátí se smysl otáčení.`,
      soukoli:`<b>Vícestupňové soukolí</b><br>Kola z₂ a z₃ sedí na jedné hřídeli, takže se otáčejí stejně rychle.

        • Dvakrát převod 5 dá dohromady 25 – tak se dá i malým soukolím dosáhnout obrovského zpomalení.<br>
        • Takhle se řetězí převodovky v jeřábech, mixérech i v hodinkách.`,
      hodiny:`<b>Hodinový strojek</b><br>Sekundová hřídel se otočí jednou za minutu. Dvě soukolí (1:6 a 1:10)
        ji zpomalí na 1:60, takže minutová ručička se otočí jednou za hodinu. Další soukolí 1:12 pohání hodinovou.<br><br>
        <b>Zkus si</b><br>• Zrychli čas a sleduj, o kolik pomaleji se točí velké kolo.<br>
        • Proč dvě soukolí a ne jedno? Kolo se 600 zuby by se do hodinek nevešlo.`,
      prevodovka:`<b>Převodovka v autě</b><br>Všechny dvojice kol jsou trvale v záběru a mají <b>stejnou osovou vzdálenost</b>
        (součet zubů je vždy 60). Řadicí <b>objímka</b> spojí s hřídelí právě jedno kolo – tudy pak jde výkon.<br><br>
        <b>Zkus si</b><br>• Zařaď jedničku: velký převod = malá rychlost, ale velký moment na kolech.<br>
        • Zpátečka má menší kola, aby se přímo nedotýkala – výkon jde přes <b>mezikolo</b> mimo osu obou hřídelí.<br>
        • Pátý stupěň má převod pod 1 – kola se točí rychleji než motor.<br>
        • <b>Zpátečka</b> přidává mezikolo, které obrátí smysl otáčení.<br>
        • V <b>neutrálu</b> se soukolí točí naprázdno.`,
      diferencial:`<b>Diferenciál</b><br>V zatáčce opíše vnější kolo <b>delší oblouk</b> než vnitřní – proto se
        musí točit rychleji. Diferenciál to umožní: koš (talířové kolo) se točí průměrnou rychlostí
        a satelit rozdíl vyrovná. Vždy platí <b>n(levé) + n(pravé) = 2 · n(koš)</b>.<br><br>
        Na obrázku vlevo jsou <b>stopy obou kol</b> – oranžová vnitřní, zelená vnější; jejich délky
        se počítají ze skutečného poloměru zatáčky. Vpravo je výřez skříně: <b>satelit</b> se točí
        kolem sebe jen tehdy, když se kola liší, a to přesně o polovinu jejich rozdílu.
        Dole je <b>houpačka</b> – její střed (otáčky koše) se nehne, ať kola dělají cokoliv.<br><br><b>Zkus si</b><br>
        • Jeď rovně – satelit se netočí, koš jede jako jeden kus.<br>
        • Zatoč – vnitřní kolo zpomalí přesně o tolik, o kolik vnější zrychlí.<br>
        • Klikni na <b>Kolo na ledu</b>: kolo bez tření se točí dvojnásobně a druhé stojí. Proto se auto na ledu nerozjede.`
    }[this.rezim]+(this.rezim==='dvojice'||this.rezim==='soukoli'?spolecne:'');
  },
  dole(){
    return {
      dvojice:'Chyť kolo a otoč jím – druhé se roztočí s ním · kolečkem myši měníš počet zubů.',
      soukoli:'Chyť kterékoli kolo a otoč jím · kolečkem myši nad kolem měníš jeho počet zubů.',
      hodiny:'Posuvníkem zrychli čas a sleduj poměr otáček jednotlivých kol.',
      prevodovka:'Přepínej stupně a sleduj, které kolo objímka spojí s hřídelí.',
      diferencial:'Posuvníkem zatáčej a sleduj, jak se rozdělí otáčky mezi kola.'
    }[this.rezim];
  },
  stav(){
    if(this.rezim==='dvojice'){
      const i=this.z2/this.z1, n2=this.otacky/i, M2=this.moment*i;
      return `Převodový poměr <b>i = z₂/z₁ = ${cz(i,2)}</b> `+
        `<span class="znak">•</span> Otáčky hnaného kola <b>${cz(n2,1)} /min</b> `+
        `<span class="znak">•</span> Moment na hnaném <b>${cz(M2,1)} N·m</b> `+
        `<span class="znak">•</span> Smysl otáčení <b>${this.mezi?'stejný':'opačný'}</b> `+
        `<span class="znak">•</span> ${i>1?'převod do pomala – větší síla':i<1?'převod do rychla – menší síla':'stejné otáčky i moment'}`;
    }
    if(this.rezim==='soukoli'){
      const i1=this.z2/this.z1, i2=this.z4/this.z3, i=i1*i2;
      return `1. stupeň <b>i₁ = ${cz(i1,2)}</b> <span class="znak">•</span> 2. stupeň <b>i₂ = ${cz(i2,2)}</b> `+
        `<span class="znak">•</span> Celkem <b>i = ${cz(i,2)}×</b> `+
        `<span class="znak">•</span> Otáčky na výstupu <b>${cz(this.otacky/i,2)} /min</b> `+
        `<span class="znak">•</span> Moment <b>${cz(this.moment*i,1)} N·m</b> `+
        `<span class="znak">•</span> převody se násobí, ne sčítají`;
    }
    if(this.rezim==='hodiny'){
      const c=this.cas;
      return `Čas <b>${String(Math.floor(c/3600)%12||12).padStart(2,'0')}:${String(Math.floor(c/60)%60).padStart(2,'0')}:${String(Math.floor(c%60)).padStart(2,'0')}</b> `+
        `<span class="znak">•</span> sekundová <b>1 ot/min</b> <span class="znak">•</span> minutová <b>1 ot/hod</b> `+
        `<span class="znak">•</span> hodinová <b>1 ot/12 hod</b> `+
        `<span class="znak">•</span> soukolí 1:6 a 1:10 dá dohromady <b>1:60</b>`;
    }
    if(this.rezim==='prevodovka'){
      const i=this.prevod();
      if(!i) return `Zařazen <b>neutrál</b> <span class="znak">•</span> motor <b>${this.otackyMotor} /min</b> `+
        `<span class="znak">•</span> kola se netočí – objímka nespojuje žádné kolo s hřídelí`;
      const celkem=Math.abs(i)*this.ROZVOD;
      const nKol=this.otackyMotor/celkem;
      const v=nKol/60*this.OBVOD_KOLA*3.6;
      const s=this.STUPNE[this.stupen-1];
      return `Stupeň <b>${s.n}</b> (${s.zh}/${s.zd}) <span class="znak">•</span> převod <b>${cz(Math.abs(i),2)}</b> `+
        `<span class="znak">•</span> se stálým převodem 3,9 celkem <b>${cz(celkem,2)}</b> `+
        `<span class="znak">•</span> otáčky kol <b>${cz(nKol,0)} /min</b> `+
        `<span class="znak">•</span> rychlost <b>${cz(v,0)} km/h</b>${i<0?' vzad':''} `+
        `<span class="znak">•</span> moment na kolech <b>${cz(celkem,1)}×</b> větší než na motoru`;
    }
    const nk=this.otackyKardan, r=this.podilRozdilu(), doprava=this.zatacka>=0;
    const nL=this.naLedu?0:(doprava?nk*(1-r):nk*(1+r));
    const nP=this.naLedu?nk*2:(doprava?nk*(1+r):nk*(1-r));
    const Rz=this.polomerZatacky();
    return `Koš <b>${cz(nk,0)} /min</b> <span class="znak">•</span> levé kolo <b>${cz(nL,0)} /min</b> `+
      `<span class="znak">•</span> pravé kolo <b>${cz(nP,0)} /min</b> `+
      `<span class="znak">•</span> součet <b>${cz(nL+nP,0)} /min</b> = 2 × otáčky koše `+
      `<span class="znak">•</span> `+
      (this.naLedu?'🧊 <b>kolo na ledu</b> – veškeré otáčky jdou do protáčejícího se kola'
        :Rz===Infinity?'rovně – satelit se netočí'
        :`zatáčka o poloměru <b>${cz(Rz,1)} m</b>, vnější kolo je o <b>${cz(r*200,0)} %</b> rychlejší`);
  }
};

/* ================= přepínání a smyčka ================= */
const NAPOVEDA={
  paka:druh=>druh==='kamen'||druh==='parez'?`<b>Páka v praxi – ${druh==='kamen'?'odvalení kamene':'vytržení pařezu'}</b><br>
    Platí pořád stejný zákon: <b>F · r₂ = odpor · r₁</b>, tedy <b>F = odpor · r₁/r₂</b>.<br><br>
    <b>Dvě provedení</b><br>
    • <b>S podpěrou (dvojzvratná)</b> – tyč zasuneš pod břemeno a podložíš <b>polenem</b>, které je osou.
      Tlačíš <b>dolů</b>. Poleno chytni myší a posuň: čím blíž je k břemenu, tím kratší r₁ a tím menší síla.<br>
    • <b>Bez podpěry (jednozvratná)</b> – tyč je také zasunutá pod břemeno, ale osou je
      <b>konec tyče opřený o zem</b>; břemeno je mezi osou a rukama a ty táhneš <b>nahoru</b>
      (jako u koleček). Osu (konec tyče) jde posunout taky.<br><br>
    <b>Zkus si</b><br>
    • <b>Chyť tyč kdekoliv</b> – to místo se stane úchopem. Čísla podél tyče ukazují, jakou silou bys
      musel v daném místě zabrat: <b>čím dál od osy, tím menší síla</b>.<br>
    • <b>Délka šipky odpovídá potřebné síle</b> a zelená čárka je tvoje síla. Posuň úchop dál od osy –
      šipka se zkrátí a schová se pod značku; přisuň ho k ose a šipka přeroste přes ni a zčervená.<br>
    • Chyť tyč blízko osy – síla nestačí a ${druh==='kamen'?'kámen se ani nehne':'pařez drží'}. Pak posuň úchop na konec.<br>
    • Porovnej dráhy: ruka opíše dlouhý oblouk, břemeno se zvedne jen o pár centimetrů.
      Co ušetříš na síle, zaplatíš dráhou – <b>práce se nešetří</b> (zlaté pravidlo mechaniky).<br>
    • Zvětši ${druh==='kamen'?'hmotnost kamene':'průměr pařezu'} (tažením za něj nebo kolečkem myši) a hledej,
      jak dlouhá tyč a jak blízká osa na něj ještě stačí.`
  :`<b>Páka</b><br>Páka je v rovnováze, když se rovnají <b>momenty sil</b>: F₁·r₁ = F₂·r₂.
    Moment je součin síly a jejího ramene (kolmé vzdálenosti od osy otáčení).<br>
    Pruhy vlevo nahoře ukazují oba momenty – <b>rovnováha je tehdy, když jsou stejně dlouhé</b>.<br><br>
    <b>Zkus si</b><br>• Nastav krátké rameno břemenu a dlouhé rameno síle – zvedneš těžké břemeno malou silou.<br>
    • <b>Táhni myší</b> za závaží – do stran měníš rameno, nahoru a dolů jeho tíhu. Za modrou šipku vytáhneš velikost síly;
      její délka je přímo úměrná síle (2 px na newton).<br>
    • Zelená čárka na šipce ukazuje, <b>jak dlouhá by šipka byla při rovnováze</b>. Prodluž rameno r₂ a značka
      se posune blíž k trámu – na delším rameni stačí menší síla.<br>
    • Klikni na <b>Nový úkol</b> a zkus páku vyvážit sám; při rovnováze se úkol započítá.<br>
    • Klikni na <b>Ukázat zdvih</b> – páka se zhoupne a vykreslí oblouky obou konců. Kolikrát je delší
      rameno síly, tolikrát delší dráhu ruka opíše: <b>co ušetříš na síle, zaplatíš dráhou</b>
      (zlaté pravidlo mechaniky, práce zůstává stejná).<br>
    • Přepni na <b>jednozvratnou</b> páku – osa je na kraji, břemeno i síla působí na stejné straně (kolečko, otvírák).<br>
    • Přepni na <b>kámen</b> nebo <b>pařez</b> a vyzkoušej stejný zákon v praxi.`,
  kladka:`<b>Kladky</b><br><b>Pevná kladka</b> jen mění směr síly – táhneš stejnou silou, jako je tíha břemene.
    Každá <b>volná kladka</b> sílu půlí, protože břemeno visí na dvou pramenech lana.<br><br>
    <b>Zkus si</b><br>• <b>Zatáhni za lano</b> (nebo rovnou za břemeno) a zvedej náklad – siloměr ukazuje, jakou silou taháš.<br>
    • Spočítej <b>očíslované prameny</b> mezi bloky: kolik jich je, tolikrát je síla menší.<br>
    • V přehledu vpravo porovnej pruhy: síla klesá, dráha lana roste, ale <b>práce zůstává stejná</b>.<br>

    • Podívej se na délku vytaženého lana: kolikrát ušetříš na síle, tolikrát delší lano musíš vytáhnout.<br>
    • <b>Zlaté pravidlo mechaniky:</b> práce zůstává stejná, žádný stroj ji neušetří.`,
  kola:`<b>Ozubená kola</b><br>Kola se zabírají zuby, takže obvodová rychlost je stejná.
    Menší kolo se proto točí rychleji: n₁·z₁ = n₂·z₂.<br><br>
    <b>Zkus si</b><br>• <b>Chyť kolo myší a otoč jím</b> – uvidíš, o kolik se pootočí to druhé.<br>
    • Malé hnací a velké hnané kolo = <b>převod do pomala</b>: pomalejší otáčky, ale větší moment (jako lehký převod na kole do kopce).<br>
    • Obráceně vznikne <b>převod do rychla</b>.<br>
    • Zapni <b>mezikolo</b> – převodový poměr se nezmění, ale obrátí se smysl otáčení.`
};
const DOLE={
  paka:druh=>druh==='kamen'||druh==='parez'
    ?'Klepni na tyč kdekoliv – tam ji chytíš ✊ – a zapáč · osu i břemeno jde posunout tažením · kolečkem myši nad tyčí posouváš úchop.'
    :'Táhni za závaží (poloha i váha) nebo za modrou šipku síly · tlačítko ▶️ ukáže dráhy obou konců · kolečkem myši doladíš hodnotu pod kurzorem.',
  kladka:'Táhni za lano (siloměr ukazuje sílu) nebo přímo za břemeno · kolečkem myši zvedáš po centimetrech.',
  kola:'Chyť kolo a otoč jím – druhé se roztočí s ním · kolečkem myši nad kolem měníš počet zubů.'
};
let rezim='paka', lastT=null;

function prepni(r){
  rezim=r; tahne=null; kola.rucne=false; uchopy=[]; canvas.style.cursor='default';
  for(const [id,tab] of [['tabPaka','paka'],['tabKladka','kladka'],['tabKola','kola']])
    $(id).classList.toggle('zap',tab===r);
  $('panelPaka').classList.toggle('skryto',r!=='paka');
  $('panelKladka').classList.toggle('skryto',r!=='kladka');
  $('panelKola').classList.toggle('skryto',r!=='kola');
  $('infoText').innerHTML=r==='kola'?kola.napoveda():r==='paka'?NAPOVEDA.paka(paka.druh):NAPOVEDA[r];
  $('napoveda').textContent=r==='kola'?kola.dole():r==='paka'?DOLE.paka(paka.druh):DOLE[r];
  if(r==='paka'){ paka.uhel=0; praxe.prekresli(); }
}
$('tabPaka').onclick=()=>prepni('paka');
$('tabKladka').onclick=()=>prepni('kladka');
$('tabKola').onclick=()=>prepni('kola');
$('btnInfo').onclick=()=>$('infoBox').classList.toggle('skryto');
$('zavriInfo').onclick=()=>$('infoBox').classList.add('skryto');

['druhPaky','f1','r1','f2','r2'].forEach(id=>$(id).oninput=()=>paka.nacti());
$('btnDopocti').onclick=()=>{
  const f=Math.round(paka.F1*paka.r1/paka.r2);
  $('f2').value=Math.max(1,Math.min(60,f));
  paka.nacti();
};
['mKamen','dParez','dPodpera','dPaka','silaClovek','typPaky'].forEach(id=>$(id).oninput=$(id).onchange=()=>{
  // po změně zadání se rozpáčené břemeno vrací na začátek, ať se nová situace zkouší od nuly
  if(id==='typPaky'){ praxe.rGrip=0; praxe.prekresli(); }   // úchop se dopočítá na konec nové tyče
  praxe.nacti();
  if(id!=='silaClovek') praxe.vratit();
});
$('druhPaky').addEventListener('change',()=>{ praxe.rGrip=0; praxe.prekresli(); praxe.nacti(); });
$('btnKamenReset').onclick=()=>praxe.vratit();
$('btnKamenNovy').onclick=()=>praxe.novy();
['druhKladky','pocetKladek','brem','zvednuti'].forEach(id=>$(id).oninput=()=>kladka.nacti());
$('btnTahni').onclick=()=>animujKladku(50);
$('btnDolu').onclick=()=>animujKladku(0);
$('btnUkolK').onclick=()=>{ prepni('kladka'); kladka.zadejUkol(); };
let animId=null;
function animujKladku(cil){
  cancelAnimationFrame(animId);
  const krok=()=>{
    const h=+$('zvednuti').value;
    if(Math.abs(h-cil)<1){ $('zvednuti').value=cil; kladka.nacti(); return; }
    $('zvednuti').value=h+(cil>h?1:-1);
    kladka.nacti();
    animId=requestAnimationFrame(krok);
  };
  krok();
}
['rezimKol','z1','z2','z3','z4','otacky','mom','mezikolo','hodRychlost','stupen','otackyMotor','otackyKardan','zatacka']
  .forEach(id=>$(id).oninput=$(id).onchange=()=>kola.nacti());
$('btnHodReset').onclick=()=>{ kola.cas=10*3600+8*60; };
/* Kolo na ledu není „ostrá zatáčka“ – je to prokluz, při kterém auto stojí.
   Dřív tlačítko jen přehodilo posuvník zatáčky na maximum, což mátlo. */
$('btnLed').onclick=()=>{
  kola.naLedu=!kola.naLedu;
  kola.ujeto=0;
  $('btnLed').textContent=kola.naLedu?'🛣️ Zpět na asfalt':'🧊 Kolo na ledu';
  $('btnLed').classList.toggle('zap',kola.naLedu);
};
$('btnUkol').onclick=()=>{ prepni('paka'); paka.zadejUkol(); };
$('btnZdvih').onclick=()=>{
  paka.zdvih={t:0,u:0};
  $('btnZdvih').classList.add('zap');
};

/* ---------- tažení přímo v obrázku ---------- */
function poloha(e){
  const r=canvas.getBoundingClientRect();
  return [e.clientX-r.left,e.clientY-r.top];
}
canvas.addEventListener('pointerdown',e=>{
  const [x,y]=poloha(e);
  const u=najdiUchop(x,y);
  if(!u) return;
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  // dx,dy = odstup kurzoru od středu úchopu. Bez něj prvek při stisku poskočí
  // pod kurzor; s ním zůstane přesně tam, kde ho uživatel chytil.
  tahne={typ:u.typ,x,y,ux:u.x,uy:u.y,dx:u.x-x,dy:u.y-y,
         F1:paka.F1,F2:paka.F2,h:kladka.h,m:praxe.m,d:praxe.dPar,
         faze:kola.faze,uhel:Math.atan2(y-u.y,x-u.x)};
  if(u.typ.startsWith('kolo')) kola.rucne=true;
  if(u.typ==='tyc') praxe.chytni(u.data);   // klepnutím se volí rameno r₂
  canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointermove',e=>{
  const [x,y]=poloha(e);
  if(!tahne){
    const u=najdiUchop(x,y);
    podKurzorem=u?u.typ:null;
    canvas.style.cursor=u?'grab':'default';
    return;
  }
  if(rezim==='paka') (paka.prakticka()?praxe:paka).tahni(tahne.typ,x+tahne.dx,y+tahne.dy,tahne);
  else if(rezim==='kladka') kladka.tahni(tahne.typ,x,y,tahne);
  else kola.tahni(tahne.typ,x,y,tahne);
});
function pusti(){ tahne=null; podKurzorem=null; kola.rucne=false; canvas.style.cursor='default'; }

// kolečko myši mění veličinu prvku pod kurzorem
const KOLECKO={bremeno:'f1',sila:'f2',lano:'zvednuti',bremeno2:'zvednuti',
               osa:'dPodpera'};
canvas.addEventListener('wheel',e=>{
  const [x,y]=poloha(e);
  const u=najdiUchop(x,y);
  if(u&&(u.typ==='tyc'||u.typ==='breme')){        // nad tyčí kolečko posouvá úchop, nad břemenem mění velikost
    if(u.typ==='tyc'){ praxe.chytni(praxe.rGrip+(e.deltaY<0?5:-5)); }
    else{ const el=$(praxe.uloha==='kamen'?'mKamen':'dParez');
          el.value=+el.value+(+el.step||1)*(e.deltaY<0?1:-1)*(e.shiftKey?5:1);
          el.dispatchEvent(new Event('input',{bubbles:true})); }
    e.preventDefault(); return;
  }
  let id=u&&KOLECKO[u.typ];
  if(!id&&u&&u.typ.startsWith('kolo')) id=(kola.geo[+u.typ.slice(4)]||{}).posuvnik;
  if(!id) id={paka:paka.prakticka()?'dPodpera':'f2',kladka:'zvednuti',
              kola:{dvojice:'z1',soukoli:'z1',hodiny:'hodRychlost',prevodovka:'otackyMotor',diferencial:'zatacka'}[kola.rezim]}[rezim];
  if(!id) return;
  const el=$(id), krok=(+el.step||1)*(e.deltaY<0?1:-1)*(e.shiftKey?5:1);
  el.value=Math.max(+el.min,Math.min(+el.max,+el.value+krok));
  el.dispatchEvent(new Event('input',{bubbles:true}));
  e.preventDefault();
},{passive:false});

// šipky ←/→ ladí hlavní veličinu záložky
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  const krok=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;
  if(!krok) return;
  const el=$({paka:paka.prakticka()?'dPodpera':'f2',kladka:'zvednuti',
              kola:{dvojice:'z1',soukoli:'z1',hodiny:'hodRychlost',prevodovka:'stupen',diferencial:'zatacka'}[kola.rezim]}[rezim]);
  el.value=Math.max(+el.min,Math.min(+el.max,+el.value+krok*(+el.step||1)*(e.shiftKey?5:1)));
  el.dispatchEvent(new Event('input',{bubbles:true}));
  e.preventDefault();
});
canvas.addEventListener('pointerup',pusti);
canvas.addEventListener('pointercancel',pusti);

function smycka(t){
  if(lastT===null) lastT=t;
  const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  resize();
  const w=canvas.clientWidth, h=canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  uchopy=[];   // uchopovací body registruje kreslení znovu v každém snímku
  if(rezim==='paka'){
    const p=paka.prakticka()?praxe:paka, pw=panelSirka(w,h);
    p.krok(dt); p.kresli(w-pw,h);        // kreslí se jen do volné části plátna
    kresliPanel(w,h,pw,p.vypocet());
    $('stav').innerHTML=p.stav();
  }
  else if(rezim==='kladka'){
    const pw=panelSirka(w,h);
    kladka.sPanelem=pw>0;
    kladka.kresli(w-pw,h);
    kresliPanel(w,h,pw,kladka.vypocet());
    $('stav').innerHTML=kladka.stav();
  }
  else {
    const pw=panelSirka(w,h);
    kola.krok(dt); kola.kresli(w-pw,h);
    kresliPanel(w,h,pw,kola.vypocet());
    $('stav').innerHTML=kola.stav();
  }
  requestAnimationFrame(smycka);
}

resize(); praxe.nacti(); paka.nacti(); kladka.nacti(); kola.nacti(); prepni('paka');
requestAnimationFrame(smycka);
/* rozbalovací seznamy nahrazujeme řadou tlačítek – míň klikání, všechny volby na očích */
function prepinace(){
  document.querySelectorAll('select.jakoTlacitka').forEach(sel=>{
    const box=document.createElement('div');
    box.className='prepinac';
    const obnov=()=>[...sel.options].forEach(o=>o.tlacitko.classList.toggle('zap',o.value===sel.value));
    [...sel.options].forEach(o=>{
      const b=document.createElement('button');
      b.textContent=o.dataset.krat||o.text;
      b.onclick=()=>{
        sel.value=o.value;
        sel.dispatchEvent(new Event('input',{bubbles:true}));
        sel.dispatchEvent(new Event('change',{bubbles:true}));
        obnov();
      };
      o.tlacitko=b; box.appendChild(b);
    });
    sel.after(box); sel.classList.add('skryto'); sel.obnovPrepinac=obnov; obnov();
    sel.addEventListener('change',obnov);
  });
}
prepinace();
