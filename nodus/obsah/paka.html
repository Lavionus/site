<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ Páka a jednoduché stroje</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<style>
body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.horni{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--bg-elevated);border-bottom:1px solid var(--border);flex-wrap:wrap}
.horni h1{font-size:1.05rem;font-weight:600;margin-right:auto}
.zalozky{display:flex;gap:6px;flex-wrap:wrap}
.panel{display:flex;gap:14px;align-items:center;padding:9px 16px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel label{font-size:.78rem;color:var(--text-muted);display:flex;align-items:center;gap:7px}
.panel .hodnota{color:var(--text-faint);min-width:3.2em;font-variant-numeric:tabular-nums}
input[type=range]{width:110px;accent-color:var(--accent)}
select{background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:.8rem}
button{background:var(--bg-control);border:1px solid var(--border-strong);color:var(--text);border-radius:6px;padding:7px 13px;font-size:.82rem;cursor:pointer}
button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
button.zap{background:var(--accent);color:#fff;border-color:var(--accent)}
.plocha{flex:1;position:relative;overflow:hidden;background:var(--bg-deep);min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.stav{background:var(--bg-panel);border-top:1px solid var(--border);padding:8px 16px;font-size:.8rem;color:var(--text-muted);display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}
.stav b{color:var(--text);font-variant-numeric:tabular-nums}
.stav .znak{font-size:1rem}
.info{position:absolute;top:12px;right:12px;width:270px;max-width:calc(100% - 24px);background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;padding:11px 14px;font-size:.78rem;line-height:1.6;color:var(--text-muted);box-shadow:var(--shadow)}
.info b{color:var(--text)}
.info .zavri{position:absolute;top:5px;right:7px;background:none;border:none;color:var(--text-faint);font-size:1rem;padding:0 4px;cursor:pointer}
.info .zavri:hover{background:none;color:var(--accent)}
.napoveda{position:absolute;left:12px;bottom:10px;font-size:.74rem;color:var(--text-faint);pointer-events:none}
.skryto{display:none !important}
/* Na mobilu se nápověda zobrazí jako panel u spodní hrany – dřív byla schovaná
   napevno, takže tlačítko ❓ na telefonu zdánlivě nedělalo nic. */
@media(max-width:760px){
  .info{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:62%;overflow:auto}
  .panel{gap:10px;padding:8px 10px}input[type=range]{width:88px}
}

/* ovládací prvky jako přehledné dlaždice v panelu */
.panel{gap:8px}
.panel label{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:4px 9px;gap:6px}
.panel input[type=range]{width:88px}
.panel label:has(input[type=checkbox]){background:var(--bg-control);border-color:var(--border-strong);cursor:pointer;color:var(--text-muted)}
.panel label:has(input[type=checkbox]:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.panel .hodnota{color:var(--text);font-weight:600}
.panel label:has(.prepinac){background:none;border:none;padding:0;gap:8px}
/* Pět režimů se na mobilu do jedné řádky nevejde – musí se zalomit,
   jinak stránka přetéká do strany. */
.prepinac{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;max-width:100%}
.prepinac button{border:none;border-radius:0;padding:6px 12px;font-size:.8rem;background:var(--bg-control);color:var(--text-muted)}
.prepinac button+button{border-left:1px solid var(--border)}
.prepinac button:hover{background:var(--bg-hover);color:var(--text)}
.prepinac button.zap,.prepinac button.zap:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="horni">
  <h1>⚖️ Páka a jednoduché stroje</h1>
  <div class="zalozky">
    <button id="tabPaka" class="zap">⚖️ Páka</button>
    <button id="tabKladka">🏗️ Kladky</button>
    <button id="tabKola">⚙️ Ozubená kola</button>
  </div>
  <button id="btnInfo">❓ Nápověda</button>
</div>

<div class="panel" id="panelPaka">
  <label>🔧 <select id="druhPaky" class="jakoTlacitka">
      <option value="dvoj" data-krat="⚖️ Dvojzvratná">Dvojzvratná (houpačka, nůžky)</option>
      <option value="jedno" data-krat="🔩 Jednozvratná">Jednozvratná (kolečko, otvírák)</option>
      <option value="kamen" data-krat="🪨 Kámen">Páčidlo – odvalení kamene</option>
      <option value="parez" data-krat="🌳 Pařez">Páka – vytržení pařezu</option>
    </select></label>
  <label data-druh="kamen parez">⚙️ <select id="typPaky" class="jakoTlacitka">
      <option value="dvoj" data-krat="🪵 S podpěrou">S podpěrou – tyč přes poleno (dvojzvratná)</option>
      <option value="jedno" data-krat="🙌 Bez podpěry">Bez podpěry (jednozvratná)</option>
    </select></label>
  <label data-druh="dvoj jedno">🧱 Břemeno F₁ <input type="range" id="f1" min="1" max="60" step="1" value="30"><span class="hodnota" id="f1V">30 N</span></label>
  <label data-druh="dvoj jedno">📏 Rameno r₁ <input type="range" id="r1" min="5" max="60" step="1" value="20"><span class="hodnota" id="r1V">20 cm</span></label>
  <label data-druh="dvoj jedno">💪 Síla F₂ <input type="range" id="f2" min="1" max="60" step="1" value="15"><span class="hodnota" id="f2V">15 N</span></label>
  <label data-druh="dvoj jedno">📏 Rameno r₂ <input type="range" id="r2" min="5" max="60" step="1" value="40"><span class="hodnota" id="r2V">40 cm</span></label>
  <button data-druh="dvoj jedno" id="btnDopocti">⚖️ Dopočítat rovnováhu</button>
  <button data-druh="dvoj jedno" id="btnZdvih">▶️ Ukázat zdvih</button>
  <button data-druh="dvoj jedno" id="btnUkol">🎯 Nový úkol</button>
  <label data-druh="kamen">🪨 Kámen <input type="range" id="mKamen" min="20" max="600" step="10" value="150"><span class="hodnota" id="mKamenV">150 kg</span></label>
  <label data-druh="parez">🌳 Pařez ⌀ <input type="range" id="dParez" min="10" max="60" step="2" value="30"><span class="hodnota" id="dParezV">30 cm</span></label>
  <label data-druh="kamen parez"><span id="lblOsaText">🔺 Podpěra r₁</span> <input type="range" id="dPodpera" min="5" max="80" step="1" value="25"><span class="hodnota" id="dPodperaV">25 cm</span></label>
  <label data-druh="kamen parez">📏 Délka tyče <input type="range" id="dPaka" min="60" max="300" step="5" value="180"><span class="hodnota" id="dPakaV">180 cm</span></label>
  <label data-druh="kamen parez">✊ Úchop r₂ <span class="hodnota" id="rGripV">155 cm</span></label>
  <label data-druh="kamen parez">💪 Tvoje síla <input type="range" id="silaClovek" min="50" max="900" step="10" value="400"><span class="hodnota" id="silaClovekV">400 N</span></label>
  <button data-druh="kamen parez" id="btnKamenReset">↺ Vrátit</button>
  <button data-druh="kamen parez" id="btnKamenNovy">🎲 Nový</button>
</div>

<div class="panel skryto" id="panelKladka">
  <label>🔧 <select id="druhKladky" class="jakoTlacitka">
      <option value="pevna" data-krat="Pevná kladka">Pevná kladka</option>
      <option value="kladkostroj" selected data-krat="Kladkostroj">Kladkostroj (volné kladky)</option>
    </select></label>
  <label id="lblPocet">🎡 Volné kladky <input type="range" id="pocetKladek" min="1" max="4" step="1" value="1"><span class="hodnota" id="pocetKladekV">1</span></label>
  <label>🧱 Břemeno <input type="range" id="brem" min="20" max="400" step="10" value="200"><span class="hodnota" id="bremV">200 N</span></label>
  <label>⬆️ Zvednutí <input type="range" id="zvednuti" min="0" max="50" step="1" value="0"><span class="hodnota" id="zvednutiV">0 cm</span></label>
  <button id="btnTahni">▶️ Táhnout</button>
  <button id="btnDolu">🔄 Spustit dolů</button>
  <button id="btnUkolK">🎯 Nový úkol</button>
</div>

<div class="panel skryto" id="panelKola">
  <label>🔧 <select id="rezimKol" class="jakoTlacitka">
      <option value="dvojice" selected data-krat="⚙️ Dvojice">Dvě kola v záběru</option>
      <option value="soukoli" data-krat="🔗 Soukolí">Vícestupňové soukolí</option>
      <option value="hodiny" data-krat="🕐 Hodiny">Hodinový strojek</option>
      <option value="prevodovka" data-krat="🚗 Převodovka">Převodovka v autě</option>
      <option value="diferencial" data-krat="🛞 Diferenciál">Diferenciál</option>
    </select></label>
  <label data-rezim="dvojice soukoli">⚙️ z₁ <input type="range" id="z1" min="8" max="40" step="1" value="12"><span class="hodnota" id="z1V">12</span></label>
  <label data-rezim="dvojice soukoli">⚙️ z₂ <input type="range" id="z2" min="8" max="40" step="1" value="30"><span class="hodnota" id="z2V">30</span></label>
  <label data-rezim="soukoli">⚙️ z₃ <input type="range" id="z3" min="8" max="40" step="1" value="10"><span class="hodnota" id="z3V">10</span></label>
  <label data-rezim="soukoli">⚙️ z₄ <input type="range" id="z4" min="8" max="40" step="1" value="28"><span class="hodnota" id="z4V">28</span></label>
  <label data-rezim="dvojice soukoli">🔁 Otáčky <input type="range" id="otacky" min="0" max="120" step="5" value="60"><span class="hodnota" id="otackyV">60/min</span></label>
  <label data-rezim="dvojice soukoli">💪 Moment <input type="range" id="mom" min="1" max="30" step="1" value="10"><span class="hodnota" id="momV">10 N·m</span></label>
  <label data-rezim="dvojice"><input type="checkbox" id="mezikolo"> ➕ Mezikolo</label>
  <label data-rezim="hodiny">⏩ Rychlost času <input type="range" id="hodRychlost" min="1" max="600" step="1" value="60"><span class="hodnota" id="hodRychlostV">60×</span></label>
  <button data-rezim="hodiny" id="btnHodReset">⏱️ Nastavit na 10:08</button>
  <label data-rezim="prevodovka">🎚️ <select id="stupen" class="jakoTlacitka">
      <option value="0" data-krat="N">Neutrál</option>
      <option value="1" selected data-krat="1">1. stupeň</option>
      <option value="2" data-krat="2">2. stupeň</option>
      <option value="3" data-krat="3">3. stupeň</option>
      <option value="4" data-krat="4">4. stupeň</option>
      <option value="5" data-krat="5">5. stupeň</option>
      <option value="6" data-krat="R">Zpátečka</option>
    </select></label>
  <label data-rezim="prevodovka">🏎️ Otáčky motoru <input type="range" id="otackyMotor" min="800" max="6000" step="100" value="2500"><span class="hodnota" id="otackyMotorV">2500/min</span></label>
  <label data-rezim="diferencial">🛞 Otáčky kardanu <input type="range" id="otackyKardan" min="0" max="400" step="10" value="200"><span class="hodnota" id="otackyKardanV">200/min</span></label>
  <label data-rezim="diferencial">↩️ Zatáčka <input type="range" id="zatacka" min="-100" max="100" step="5" value="0"><span class="hodnota" id="zatackaV">rovně</span></label>
  <button data-rezim="diferencial" id="btnLed">🧊 Kolo na ledu</button>
</div>

<div class="plocha">
  <canvas id="c"></canvas>
  <div class="info skryto" id="infoBox">
    <button class="zavri" id="zavriInfo" title="Zavřít">✕</button>
    <div id="infoText"></div>
  </div>
  <div class="napoveda" id="napoveda"></div>
</div>

<div class="stav" id="stav"></div>

<script>
const $=id=>document.getElementById(id);
const canvas=$('c'), ctx=canvas.getContext('2d');
const cz=(x,d=1)=>(Math.abs(x)<1e-9?0:x).toFixed(d).replace('.',',');

/* ---------- barvy podle aktuálního tématu ---------- */
let C={};
function nactiBarvy(){
  const s=getComputedStyle(document.documentElement), g=n=>s.getPropertyValue(n).trim();
  C={text:g('--text'),muted:g('--text-muted'),faint:g('--text-faint'),border:g('--border'),
     silny:g('--border-strong'),akcent:g('--accent'),ok:g('--ok'),warn:g('--warn'),
     danger:g('--danger'),panel:g('--bg-panel'),elev:g('--bg-elevated'),deep:g('--bg-deep')};
}
nactiBarvy();
new MutationObserver(nactiBarvy).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// plátno musí sledovat i změnu výšky panelu při přepnutí záložky,
// jinak zůstane starý obsah pod nově kreslenou plochou
function resize(){
  const r=devicePixelRatio||1;
  const w=Math.round(canvas.clientWidth*r), h=Math.round(canvas.clientHeight*r);
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
  ctx.setTransform(r,0,0,r,0,0);
}
new ResizeObserver(resize).observe(canvas);

/* ---------- uchopovací body: kreslení je registruje, myš je hledá ---------- */
let uchopy=[], tahne=null, podKurzorem=null;
function uchop(x,y,r,typ,bezObrysu,data){
  uchopy.push({x,y,r,typ,data});
  if(bezObrysu) return;
  // obrys ukazuje, za co se dá vzít; pod kurzorem a při tažení zesílí
  const akt=(tahne&&tahne.typ===typ)||podKurzorem===typ;
  ctx.save();
  ctx.strokeStyle=akt?C.akcent:C.faint;
  ctx.setLineDash(akt?[]:[3,4]);
  ctx.lineWidth=akt?2:1;
  ctx.beginPath(); ctx.arc(x,y,akt?r+3:r,0,Math.PI*2);
  if(akt){ ctx.fillStyle='rgba(106,166,253,.13)'; ctx.fill(); }
  ctx.stroke();
  ctx.restore();
}
function najdiUchop(x,y){
  let nej=null, nd=1e9;
  for(const u of uchopy){
    const d=Math.hypot(x-u.x,y-u.y);
    if(d<u.r&&d<nd){ nd=d; nej=u; }
  }
  return nej;
}

/* ---------- kreslicí pomůcky ---------- */
function sipka(x1,y1,x2,y2,barva,sirka=3){
  ctx.strokeStyle=barva; ctx.fillStyle=barva; ctx.lineWidth=sirka;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1), d=9+sirka;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-d*Math.cos(a-0.4),y2-d*Math.sin(a-0.4));
  ctx.lineTo(x2-d*Math.cos(a+0.4),y2-d*Math.sin(a+0.4));
  ctx.closePath(); ctx.fill();
}
function popis(text,x,y,barva=C.muted,font='12px sans-serif',zarovnani='center'){
  ctx.fillStyle=barva; ctx.font=font; ctx.textAlign=zarovnani; ctx.textBaseline='middle';
  ctx.fillText(text,x,y);
}
function kotoucKladky(x,y,r,barva,faze=0){
  ctx.fillStyle=C.elev; ctx.strokeStyle=barva; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle=C.faint; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(x,y,r*0.25,0,Math.PI*2); ctx.stroke();
  // paprsky: podle nich je vidět, že lano kladkou probíhá
  ctx.strokeStyle=barva; ctx.lineWidth=2; ctx.globalAlpha=.65;
  for(let i=0;i<6;i++){
    const a=faze+i*Math.PI*2/6;
    ctx.beginPath();
    ctx.moveTo(x+r*0.30*Math.cos(a),y+r*0.30*Math.sin(a));
    ctx.lineTo(x+r*0.82*Math.cos(a),y+r*0.82*Math.sin(a));
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
/* ---------- pravý sloupec s výpočtem ---------- */
/* Kreslicí kód dostane zmenšenou šířku plátna, takže scéna do panelu nezasahuje. */
function panelSirka(w,h){ return (w>=900&&h>=330)?Math.max(258,Math.min(330,Math.round(w*0.26))):0; }
function zalom(text,maxSirka){
  const slova=text.split(' '), radky=[]; let r='';
  for(const sl of slova){
    const zkus=r?r+' '+sl:sl;
    if(ctx.measureText(zkus).width>maxSirka&&r){ radky.push(r); r=sl; } else r=zkus;
  }
  if(r) radky.push(r);
  return radky;
}
function zaobleny(x,y,sir,vys,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+sir-r,y); ctx.quadraticCurveTo(x+sir,y,x+sir,y+r);
  ctx.lineTo(x+sir,y+vys-r); ctx.quadraticCurveTo(x+sir,y+vys,x+sir-r,y+vys);
  ctx.lineTo(x+r,y+vys); ctx.quadraticCurveTo(x,y+vys,x,y+vys-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
/* radky: ['h',text] nadpis · ['v',text,barva] vzorec · ['p',text,barva] odstavec · null mezera */
function kresliPanel(w,h,pw,radky){
  if(!pw||!radky) return;
  const x0=w-pw+8, sir=pw-20, textSir=sir-22;
  // nejdřív spočítáme výšku, aby karta obepnula obsah
  const kroky=[];
  for(const r of radky){
    if(!r){ kroky.push(['mezera',null,8]); continue; }
    if(r[0]==='h') kroky.push([r[0],r,21]);
    else if(r[0]==='v') kroky.push([r[0],r,17]);
    else if(r[0]==='b') kroky.push([r[0],r,20]);
    else {
      ctx.font='11.5px sans-serif';
      const ls=zalom(r[1],textSir);
      kroky.push(['p',[r[0],ls,r[2]],ls.length*15+4]);
    }
  }
  let vys=26+kroky.reduce((a,k)=>a+k[2],0);
  vys=Math.min(vys,h-20);
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='middle';
  zaobleny(x0,10,sir,vys,10);
  ctx.fillStyle=C.elev; ctx.globalAlpha=.97; ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle=C.border; ctx.lineWidth=1; ctx.stroke();
  let y=10+18;
  for(const [typ,r,dy] of kroky){
    if(y+dy>10+vys-4) break;                 // co se nevejde, radši vynecháme
    if(typ==='h'){ ctx.font='bold 12.5px sans-serif'; ctx.fillStyle=r[2]||C.text; ctx.fillText(r[1],x0+11,y+4); }
    else if(typ==='v'){
      // dlouhý vzorec se v užším panelu jen zmenší, ať se nikde neořeže
      const pismo=v=>v+'px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
      ctx.font=pismo(12);
      const sirTxt=ctx.measureText(r[1]).width;
      if(sirTxt>textSir) ctx.font=pismo(Math.max(9,12*textSir/sirTxt));
      ctx.fillStyle=r[2]||C.text; ctx.fillText(r[1],x0+11,y+3);
    }
    else if(typ==='b'){                        // porovnávací pruh: podíl 0–1 a popisek
      const sirP=Math.round(textSir*0.4), yb=y-3;
      ctx.fillStyle=C.panel; ctx.fillRect(x0+11,yb,sirP,14);
      ctx.fillStyle=r[3]||C.akcent; ctx.fillRect(x0+11,yb,Math.max(2,sirP*Math.min(1,r[2])),14);
      ctx.strokeStyle=C.border; ctx.lineWidth=1; ctx.strokeRect(x0+11.5,yb+.5,sirP-1,13);
      ctx.font='11px sans-serif'; ctx.fillStyle=C.text;
      ctx.fillText(r[1],x0+11+sirP+8,yb+8);
    }
    else if(typ==='p'){ ctx.font='11.5px sans-serif'; ctx.fillStyle=r[2]||C.muted;
      r[1].forEach((l,i)=>ctx.fillText(l,x0+11,y+3+i*15)); }
    y+=dy;
  }
  ctx.restore();
}

function strop(y,x1,x2){
  ctx.fillStyle=C.panel; ctx.fillRect(x1,y-14,x2-x1,14);
  ctx.strokeStyle=C.silny; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
  ctx.strokeStyle=C.border; ctx.lineWidth=1;
  for(let x=x1;x<x2;x+=12){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-9,y-13); ctx.stroke(); }
}

/* ================= 1) PÁKA ================= */
const paka={
  druh:'dvoj', F1:30, r1:20, F2:15, r2:40, uhel:0,
  nacti(){
    this.druh=$('druhPaky').value;
    this.F1=+$('f1').value; this.r1=+$('r1').value;
    this.F2=+$('f2').value; this.r2=+$('r2').value;
    $('f1V').textContent=this.F1+' N'; $('r1V').textContent=this.r1+' cm';
    $('f2V').textContent=this.F2+' N'; $('r2V').textContent=this.r2+' cm';
    // páčidlo má vlastní veličiny, proto se sada ovladačů podle druhu páky přepíná
    document.querySelectorAll('#panelPaka [data-druh]').forEach(el=>
      el.classList.toggle('skryto',!el.dataset.druh.split(' ').includes(this.druh)));
    praxe.nacti();
    if(rezim==='paka'){
      $('infoText').innerHTML=NAPOVEDA.paka(this.druh);
      $('napoveda').textContent=DOLE.paka(this.druh);
    }
  },
  momenty(){ return [this.F1*this.r1/100, this.F2*this.r2/100]; },
  // Posuvník síly má krok 1 N, takže momenty často nejdou srovnat úplně přesně
  // (F₁·r₁/r₂ vyjde třeba 18,75 N). Za rovnováhu proto bereme rozdíl menší, než
  // kolik dělá půl kroku posuvníku – jinak by trám po „Dopočítat" zůstal nakřivo.
  rovnovaha(){
    const [M1,M2]=this.momenty();
    return Math.abs(M1-M2)<=0.5*(+$('f2').step||1)*this.r2/100+1e-9;
  },
  prakticka(){ return this.druh==='kamen'||this.druh==='parez'; },
  ZDVIH_UHEL:14*Math.PI/180,          // o kolik se páka při ukázce zhoupne
  zdvih:null,
  krok(dt){
    // ukázka zdvihu: páka se zhoupne, chvíli podrží a vrátí se – mezitím kreslíme dráhy konců
    if(this.zdvih){
      const T=this.zdvih.t+=dt;
      const u=T<1.1?T/1.1:(T<2.0?1:Math.max(0,1-(T-2.0)/0.8));
      this.zdvih.u=u<0.5?2*u*u:1-Math.pow(2-2*u,2)/2;
      this.uhel=-this.ZDVIH_UHEL*this.zdvih.u;
      if(T>2.9){ this.zdvih=null; $('btnZdvih').classList.remove('zap'); }
      return;
    }
    // Při tažení za závaží nebo za šipku síly páku nenatáčíme. Náklon totiž posouvá
    // právě ten bod, ze kterého se hodnota počítá – a zpětná vazba páku rozkmitá.
    // Po puštění se rovnou dohoupe do nové polohy.
    if(tahne&&(tahne.typ==='bremeno'||tahne.typ==='sila')) return;
    const [M1,M2]=this.momenty();
    const max=(this.druh==='dvoj'?21:16)*Math.PI/180;
    const cil=this.rovnovaha()?0:max*Math.tanh(3*(M1-M2)/(1+(M1+M2)/2));   // kladné = břemeno klesá
    this.uhel+=(cil-this.uhel)*Math.min(1,dt*3.2);
  },
  kresli(w,h){
    const dvoj=this.druh==='dvoj';
    // stupnice se roztáhne přes celou plochu, ať je páka co největší
    const odCm=dvoj?-68:-7, doCm=dvoj?68:74;
    const mer=Math.max(2.2,Math.min((w-70)/(doCm-odCm),11));   // px na cm
    // u jednozvratné je osa na kraji trámu, scénu proto vystředíme podle jeho délky
    const ox=dvoj?w/2:(w-(doCm-odCm)*mer)/2-odCm*mer;
    // dvojzvratná má šipku síly nad trámem, jednozvratná pod ním – podle toho se posune výška
    const oy=h*(dvoj?0.52:0.44);
    // kladný úhel = břemeno klesá; břemeno je u dvojzvratné vlevo, u jednozvratné vpravo
    const a=dvoj?-this.uhel:this.uhel;
    const zemY=Math.min(h-24,oy+Math.min(150,Math.max(90,h*0.28)));
    // bod na trámu: znamenko -1 = vlevo od osy, +1 = vpravo
    const bod=(r,zn)=>[ox+zn*r*mer*Math.cos(a), oy+zn*r*mer*Math.sin(a)];

    // podlaha
    ctx.strokeStyle=C.border; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,zemY); ctx.lineTo(w,zemY); ctx.stroke();

    // trám se stupnicí
    ctx.save(); ctx.translate(ox,oy); ctx.rotate(a);
    ctx.fillStyle=C.silny;
    ctx.fillRect(odCm*mer,-6,(doCm-odCm)*mer,12);
    ctx.strokeStyle=C.faint; ctx.lineWidth=1;
    ctx.strokeRect(odCm*mer,-6,(doCm-odCm)*mer,12);
    ctx.fillStyle=C.faint; ctx.font='9px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let r=10;r<=(dvoj?60:70);r+=10){
      for(const zn of (dvoj?[-1,1]:[1])){
        ctx.fillRect(zn*r*mer-0.5,-6,1,4);
        ctx.fillText(r,zn*r*mer,-14);
      }
    }
    // ramena obarvená přímo na trámu – délku ramene je pak vidět na první pohled
    const znB=dvoj?-1:1;
    const rameno=(delka,zn,posun,barva)=>{
      ctx.fillStyle=barva; ctx.globalAlpha=.9;
      ctx.fillRect(Math.min(0,zn*delka*mer),posun,delka*mer,6);
      ctx.globalAlpha=1;
    };
    // u jednozvratné leží obě ramena na stejné straně, proto pod sebou ve dvou řádcích
    if(!this.zdvih){ rameno(this.r1,znB,9,C.warn); rameno(this.r2,1,dvoj?9:19,C.akcent); }
    ctx.restore();

    // podpěra (osa otáčení)
    const zaklad=Math.max(24,(zemY-oy)*0.26);
    ctx.fillStyle=C.akcent;
    ctx.beginPath(); ctx.moveTo(ox,oy+3); ctx.lineTo(ox-zaklad,zemY); ctx.lineTo(ox+zaklad,zemY); ctx.closePath(); ctx.fill();
    popis('osa otáčení',ox,zemY+16,C.faint,'11px sans-serif');

    // údaje pro tažení myší
    this.geo={mer,ox,oy,dvoj};

    // břemeno F₁ (vlevo u dvojzvratné, vpravo u jednozvratné)
    const [bx,by]=bod(this.r1,dvoj?-1:1);
    const s1=Math.max(22,Math.min(58,16+this.F1*0.7));
    uchop(bx,by+16+s1*0.35,Math.max(24,s1*0.62),'bremeno');
    ctx.strokeStyle=C.faint; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx,by+16); ctx.stroke();
    ctx.fillStyle=C.warn; ctx.fillRect(bx-s1/2,by+16,s1,s1*0.7);
    popis('F₁ = '+this.F1+' N',bx,by+16+s1*0.7+13,C.warn,'bold 12px sans-serif');
    if(!this.zdvih) popis('r₁ = '+this.r1+' cm',bx,by-34,C.faint,'11px sans-serif');

    // působící síla F₂ – u dvojzvratné tlačí dolů, u jednozvratné táhne nahoru
    const [sx,sy]=bod(this.r2,1);
    // délka šipky je přímo úměrná síle (2 px na newton), takže je vidět i její velikost
    const delka=Math.max(18,this.F2*2);
    const konecY=dvoj?sy-8-delka:sy+8+delka;
    sipka(sx,konecY,sx,dvoj?sy-8:sy+8,C.akcent,Math.max(2.5,Math.min(6,2+this.F2/16)));
    // zelená značka ukazuje, jak dlouhá by šipka byla při rovnováze – prodluž rameno
    // a značka se posune blíž k trámu: na delším rameni stačí menší síla
    const Fpotr=this.F1*this.r1/this.r2;
    if(Math.abs(Fpotr-this.F2)>0.02*Math.max(Fpotr,this.F2)&&Fpotr<160){
      const dp=Math.max(18,Fpotr*2), py=dvoj?sy-8-dp:sy+8+dp;
      ctx.save(); ctx.strokeStyle=C.ok; ctx.lineWidth=2; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(sx-12,py); ctx.lineTo(sx+12,py); ctx.stroke(); ctx.restore();
      popis('stačí '+cz(Fpotr,1)+' N',sx+16,py,C.ok,'10px sans-serif','left');
    }
    popis('F₂ = '+this.F2+' N',sx,konecY+(dvoj?-16:16),C.akcent,'bold 12px sans-serif');
    if(!this.zdvih) popis('r₂ = '+this.r2+' cm',sx,dvoj?sy+24:sy-28,C.faint,'11px sans-serif');
    uchop(sx,konecY,22,'sila');

    // dráhy konců při ukázce zdvihu: oba opíší stejný úhel, ale jinak dlouhý oblouk
    if(this.zdvih){
      // výchozí (vodorovná) poloha trámu, aby bylo od čeho dráhy měřit
      ctx.save(); ctx.strokeStyle=C.faint; ctx.setLineDash([6,5]); ctx.lineWidth=1.5; ctx.globalAlpha=.8;
      ctx.beginPath(); ctx.moveTo(ox+odCm*mer,oy); ctx.lineTo(ox+doCm*mer,oy); ctx.stroke(); ctx.restore();
      const oblouk=(r,zn,barva,popisek)=>{
        const R=r*mer, t0=zn<0?Math.PI:0, t1=t0+a;
        ctx.save(); ctx.strokeStyle=barva; ctx.lineWidth=4; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(ox,oy,R,Math.min(t0,t1),Math.max(t0,t1)); ctx.stroke();
        ctx.restore();
        // prázdné kolečko = odkud, šipka = kam se konec za tu chvíli dostal
        ctx.save(); ctx.strokeStyle=barva; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(ox+R*Math.cos(t0),oy+R*Math.sin(t0),4,0,Math.PI*2); ctx.stroke(); ctx.restore();
        const x1=ox+R*Math.cos(t1), y1=oy+R*Math.sin(t1);
        const sm=Math.sign(a)||1, uh=Math.atan2(Math.cos(t1),-Math.sin(t1))+(sm<0?Math.PI:0);
        ctx.fillStyle=barva; ctx.beginPath();
        ctx.moveTo(x1+9*Math.cos(uh),y1+9*Math.sin(uh));
        ctx.lineTo(x1+9*Math.cos(uh+2.5),y1+9*Math.sin(uh+2.5));
        ctx.lineTo(x1+9*Math.cos(uh-2.5),y1+9*Math.sin(uh-2.5));
        ctx.closePath(); ctx.fill(); ctx.restore();
        if(popisek) popis(popisek,x1+26*Math.cos(uh),y1+26*Math.sin(uh),barva,'bold 11px sans-serif');
      };
      const u=Math.abs(a);
      oblouk(this.r1,dvoj?-1:1,C.warn,'s₁ = '+cz(this.r1*u,1)+' cm');
      oblouk(this.r2,1,C.akcent,'s₂ = '+cz(this.r2*u,1)+' cm');
    }

    // pruhy momentů: rovnováha = stejně dlouhé pruhy, což je vidět dřív než z čísel
    const [Ma,Mb]=this.momenty();
    const sirka=Math.min(150,Math.max(70,w*0.19)), px0=14, py0=Math.max(30,h*0.06);
    const meritko=sirka/Math.max(Ma,Mb,0.01);
    ctx.save(); ctx.textBaseline='middle';
    [[Ma,C.warn,'M₁ = F₁·r₁'],[Mb,C.akcent,'M₂ = F₂·r₂']].forEach(([M,barva,jm],i)=>{
      const y=py0+i*24;
      ctx.fillStyle=C.border; ctx.fillRect(px0,y,sirka,12);
      ctx.fillStyle=barva; ctx.fillRect(px0,y,Math.max(2,M*meritko),12);
      popis(jm,px0,y-9,barva,'10px sans-serif','left');
      popis(cz(M,2)+' N·m',px0+sirka+8,y+6,C.muted,'11px sans-serif','left');
    });
    ctx.restore();
    popis(dvoj?'🛝 houpačka, nůžky, kleště':'🛒 kolečko, otvírák, louskáček',
      w-14,h-14,C.faint,'11px sans-serif','right');

    // rovnováha se zvýrazní, ať je zpětná vazba okamžitá
    const [M1,M2]=this.momenty();
    if(this.rovnovaha()){
      popis('⚖️ rovnováha',w/2,26,C.ok,'bold 15px sans-serif');
      if(this.ukol){ this.ukol=false; this.splneno++; }
    }
    if(this.ukol) popis('🎯 Úkol: vyvaž páku – táhni za modrou šipku',w/2,26,C.warn,'bold 14px sans-serif');
  },
  /* obsah pravého sloupce: vzorce s dosazenými čísly a slovní vysvětlení */
  vypocet(){
    const [M1,M2]=this.momenty();
    const rovn=this.rovnovaha();
    const Fp=this.F1*this.r1/this.r2, zisk=this.r2/this.r1;
    const dvoj=this.druh==='dvoj';
    const r=[['h','📐 Momentová rovnováha'],
      ['v','M = F · r   (síla × rameno)'],null,
      ['v','M₁ = '+this.F1+' N · '+cz(this.r1/100,2)+' m = '+cz(M1,2)+' N·m',C.warn],
      ['v','M₂ = '+this.F2+' N · '+cz(this.r2/100,2)+' m = '+cz(M2,2)+' N·m',C.akcent],null,
      ['v',rovn?'M₁ = M₂  →  rovnováha'
            :(M1>M2?'M₁ > M₂  →  klesá břemeno':'M₁ < M₂  →  břemeno stoupá'),rovn?C.ok:C.warn],null,
      ['h','🎯 Kolik síly by stačilo'],
      ['v','F₂ = F₁·r₁ / r₂ = '+this.F1+'·'+this.r1+' / '+this.r2],
      ['v','   = '+cz(Fp,1)+' N   (teď táhneš '+this.F2+' N)',C.ok],
      ['v','zisk na síle r₂ / r₁ = '+cz(zisk,2)+'×'],null,
      ['h','💡 Co se děje a proč']];
    if(this.zdvih){
      const u=Math.abs(this.uhel), s1=this.r1*u/100, s2=this.r2*u/100;
      r.push(['v','s = r · φ   (dráha = rameno × úhel)'],
        ['v','s₁ = '+cz(s1*100,1)+' cm   s₂ = '+cz(s2*100,1)+' cm'],
        ['v','W = F·s = '+cz(this.F1*s1,2)+' J  vs  '+cz(this.F2*s2,2)+' J',C.ok],
        ['p','Oba konce opíšou stejný úhel, ale různě dlouhý oblouk – v poměru ramen '+cz(zisk,2)+'×. '+
             'Kolikrát menší silou tlačíš, tolikrát delší dráhu ruka ujede, takže práce zůstává stejná.']);
      return r;
    }
    r.push(['p',dvoj
      ?'Dvojzvratná páka: osa je mezi břemenem a silou. Obě síly míří stejným směrem dolů, ale otáčejí páku proti sobě – jako na houpačce.'
      :'Jednozvratná páka: osa je na kraji, břemeno i síla jsou na téže straně. Síla míří nahoru proti tíze břemene – jako u koleček nebo otvíráku.']);
    r.push(['p',rovn
      ?'Momenty jsou stejné, páka se sama neotočí. Menší sílu vyrovnává delší rameno: '+this.F2+' N na '+this.r2+' cm udrží '+this.F1+' N na '+this.r1+' cm.'
      :(M1>M2?'Moment břemene je větší, proto břemeno klesá. Pomůže větší síla F₂, nebo její delší rameno r₂ – v součinu F₂·r₂ je jedno které.'
             :'Moment síly je větší, proto břemeno stoupá. Ubereš-li sílu na '+cz(Fp,1)+' N, páka se zastaví v rovnováze.')]);
    return r;
  },
  zadejUkol(){
    const nahodne=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
    // zadání volíme tak, aby vycházela celá hodnota F₂ v rozsahu posuvníku
    let F1,r1,r2,F2;
    do{ F1=nahodne(2,12)*5; r1=nahodne(1,6)*5; r2=nahodne(2,12)*5; F2=F1*r1/r2; }
    while(!Number.isInteger(F2)||F2<1||F2>60||F2===this.F2);
    $('f1').value=F1; $('r1').value=r1; $('r2').value=r2;
    $('f2').value=Math.max(1,Math.min(60,F2>30?F2-nahodne(5,15):F2+nahodne(5,15)));
    this.ukol=true; this.nacti();
  },
  ukol:false, splneno:0,
  tahni(typ,x,y,vych){
    const {mer,ox,oy,dvoj}=this.geo;
    const a=dvoj?-this.uhel:this.uhel;
    if(typ==='bremeno'){
      $('r1').value=Math.max(5,Math.min(60,Math.round(Math.abs(x-ox)/mer)));
      $('f1').value=Math.max(1,Math.min(60,Math.round(vych.F1+(y-vych.uy)*0.35)));
    }else{
      const r=Math.max(5,Math.min(60,Math.round((dvoj?Math.abs(x-ox):Math.max(0,x-ox))/mer)));
      $('r2').value=r;
      // délka šipky přímo odpovídá velikosti síly, takže se dá „vytáhnout"
      const sy=oy+r*mer*Math.sin(a);
      $('f2').value=Math.max(1,Math.min(60,Math.round(((dvoj?sy-y:y-sy)-8)/2)));
    }
    this.nacti();
  },
  stav(){
    const [M1,M2]=this.momenty();
    const rovnovaha=this.rovnovaha();
    if(this.zdvih){
      const u=Math.abs(this.uhel), s1=this.r1*u/100, s2=this.r2*u/100;   // dráhy v metrech
      return `⤴️ Zdvih o <b>${cz(u*180/Math.PI,1)}°</b> `+
        `<span class="znak">•</span> dráha břemene <b>s₁ = ${cz(s1*100,1)} cm</b>, dráha síly <b>s₂ = ${cz(s2*100,1)} cm</b> `+
        `<span class="znak">•</span> práce břemene <b>F₁·s₁ = ${cz(this.F1*s1,2)} J</b> `+
        `<span class="znak">•</span> práce ruky <b>F₂·s₂ = ${cz(this.F2*s2,2)} J</b> `+
        `<span class="znak">•</span> ${rovnovaha?'⚖️ <b>stejná práce – páka ji jen rozloží na jinou sílu a dráhu</b>'
          :'páka není v rovnováze, proto se práce liší – vyvaž ji a zkus znovu'}`;
    }
    const zisk=this.r2/this.r1;
    if(this.splneno) return `🎯 Splněných úkolů: <b>${this.splneno}</b> `+
      `<span class="znak">•</span> M₁ = <b>${cz(M1,2)} N·m</b>, M₂ = <b>${cz(M2,2)} N·m</b> `+
      `<span class="znak">•</span> ${rovnovaha?'⚖️ <b>Rovnováha!</b>':(M1>M2?'⬇️ klesá břemeno':'⬆️ břemeno stoupá')} `+
      `<span class="znak">•</span> Poměr ramen <b>${cz(zisk,2)}×</b> `+
      `<span class="znak">•</span> Na rovnováhu stačí síla <b>${cz(this.F1*this.r1/this.r2,1)} N</b>`;
    return `Moment břemene <b>M₁ = ${cz(M1,2)} N·m</b> `+
      `<span class="znak">•</span> Moment síly <b>M₂ = ${cz(M2,2)} N·m</b> `+
      `<span class="znak">•</span> ${rovnovaha?'⚖️ <b>Rovnováha</b>':(M1>M2?'⬇️ klesá břemeno':'⬆️ břemeno stoupá')} `+
      `<span class="znak">•</span> Poměr ramen <b>${cz(zisk,2)}×</b> `+
      `<span class="znak">•</span> Na rovnováhu stačí síla <b>${cz(this.F1*this.r1/this.r2,1)} N</b>`;
  }
};

/* ================= 1b) PÁKA V PRAXI – kámen a pařez ================= */
/* Dvě úlohy (odvalit kámen, vytrhnout pařez) ve dvou provedeních:
     • s podpěrou (dvojzvratná)  – osa je mezi břemenem a rukama, tlačí se dolů,
     • bez podpěry (jednozvratná)– osou je konec tyče opřený o zem, břemeno je
       mezi osou a rukama, táhne se nahoru.
   V obou případech platí totéž: F·r₂ = odpor·r₁. Úchop si volí uživatel klepnutím
   kamkoli na tyč, takže je vidět, že vzdálenější úchop = menší síla. */
const praxe={
  uloha:'kamen', typ:'dvoj',
  m:150, dPar:30, r1:25, L:180, Fclovek:400, rGrip:0,
  fi:0, faze:'klid', s:0, v:0, splKamen:0, splParez:0, geo:null,
  // nepravidelný obrys balvanu – při odvalování je pak vidět, že se opravdu točí
  tvar:[1,.93,1.04,.9,1.02,.88,1.05,.95,1.01,.9,1.06,.92,1.03,.94],

  nacti(){
    this.uloha=paka.druh==='parez'?'parez':'kamen';
    this.typ=$('typPaky').value;
    this.m=+$('mKamen').value; this.dPar=+$('dParez').value;
    this.L=+$('dPaka').value; this.Fclovek=+$('silaClovek').value;
    // krátké rameno musí nechat dost místa na to dlouhé, jinak by páka ztratila smysl
    this.r1=Math.min(+$('dPodpera').value,this.L-(this.typ==='dvoj'?40:30));
    if(+$('dPodpera').value!==this.r1) $('dPodpera').value=this.r1;
    this.rGrip=Math.max(this.minGrip(),Math.min(this.maxGrip(),this.rGrip||this.maxGrip()));
    $('mKamenV').textContent=this.m+' kg';
    $('dParezV').textContent=this.dPar+' cm';
    $('dPodperaV').textContent=this.r1+' cm';
    $('dPakaV').textContent=this.L+' cm';
    $('rGripV').textContent=Math.round(this.rGrip)+' cm';
    $('silaClovekV').textContent=this.Fclovek+' N';
    $('lblOsaText').textContent=this.typ==='dvoj'?'🪵 Poleno r₁':'📍 Osa r₁';
    if(this.faze==='klid') this.fi=Math.min(this.fi,this.fmax());
  },

  /* ---- veličiny úlohy ---- */
  polomer(){ return Math.cbrt(3*(this.m/2600)/(4*Math.PI))*100; },   // žula 2600 kg/m³, v cm
  odpor(){ return this.uloha==='kamen'?this.m*9.81:60*this.dPar; },  // N (kořeny ~60 N na cm průměru)
  cil(){ return this.uloha==='kamen'?0.55*this.polomer():Math.min(15,0.35*this.dPar); },
  fmax(){ return Math.max(0.21,Math.min(1.25,Math.asin(Math.max(0.05,Math.min(0.95,this.cil()/this.r1))))); },
  alfa0(){ return this.typ==='dvoj'?-this.fmax():0; },
  minGrip(){ return this.typ==='dvoj'?15:this.r1+15; },
  maxGrip(){ return this.typ==='dvoj'?this.L-this.r1:this.L; },
  potreba(){ return this.odpor()*this.r1/this.rGrip; },
  zvladne(){ return this.potreba()<=this.Fclovek; },
  zdvih(){ return this.r1*(Math.sin(this.alfa0()+this.fi)-Math.sin(this.alfa0())); },  // cm

  vratit(){ this.fi=0; this.faze='klid'; this.s=0; this.v=0; },
  // úplně jiná scéna (jiná úloha nebo provedení) se nemá „přijíždět", ale rovnou sednout
  prekresli(){ this.plyn=null; this.alfaZ=undefined; this.vratit(); },
  novy(){
    if(this.uloha==='kamen') $('mKamen').value=(2+Math.floor(Math.random()*20))*25;
    else $('dParez').value=(5+Math.floor(Math.random()*13))*4;
    this.nacti(); this.vratit();
  },
  chytni(rcm){ this.rGrip=Math.max(this.minGrip(),Math.min(this.maxGrip(),rcm)); this.nacti(); },
  povolit(){
    this.faze='vali'; this.s=0;
    if(this.uloha==='kamen'){ this.v=130; this.s=0.6*this.zdvih(); this.splKamen++; }
    else { this.v=0.8; this.splParez++; }
  },
  krok(dt){
    if(this.faze==='vali'){
      if(this.uloha==='kamen'){
        this.s+=this.v*dt; this.v-=75*dt;
        if(this.v<=0){ this.v=0; this.faze='hotovo'; }
      }else{
        this.s=Math.min(1,this.s+this.v*dt);
        if(this.s>=1) this.faze='hotovo';
      }
    }
    const drzi=tahne&&tahne.typ==='tyc'&&this.faze==='klid'&&this.zvladne();
    if(!drzi) this.fi+=(0-this.fi)*Math.min(1,dt*4);
  },

  /* ---- kreslení ---- */
  kresli(w,h){
    const jedno=this.typ==='jedno', parez=this.uloha==='parez';
    const fmax=this.fmax(), a0=this.alfa0();
    let alfa=a0+this.fi;
    const Rcm=parez?this.dPar*0.75:this.polomer();     // poloviční šířka objektu v cm
    const zemY=Math.min(h-40,Math.max(h*0.70,110));
    // měřítko hlídá šířku scény i výšku, do které tyč vystoupá
    const merS=(w-100)/(this.L+Rcm+(parez?70:150));
    const vysCm=this.L*Math.sin(fmax)+(jedno?0:(parez?0.14*this.dPar:0.4*Rcm)+this.r1*Math.sin(fmax));
    const merCil=Math.max(0.35,Math.min(3.2,merS,(zemY-80)/Math.max(1,vysCm)));
    // Měřítko i posun scény závisí na tom, co se právě táhne (r₁, hmotnost…). Kdyby se
    // přepočítaly hned, celý obrázek by se pod kurzorem překreslil jinak a tažení by
    // poskakovalo. Během tažení proto layout zamrzne a po puštění se plynule dorovná.
    const drzim=tahne&&(tahne.typ==='osa'||tahne.typ==='breme'||tahne.typ==='tyc');
    if(!this.plyn||this.plyn.w!==w||this.plyn.h!==h) this.plyn={mer:merCil,ox:null,w,h};
    if(!drzim) this.plyn.mer+=(merCil-this.plyn.mer)*0.2;
    const mer=this.plyn.mer;
    const Rpx=Rcm*mer, tw=this.dPar*mer/2;      // tw = poloviční šířka kmene
    // kolik místa zabere scéna vlevo od břemene (podle provedení se osa i tyč posunou jinam)
    const levo=jedno?(this.L-this.r1)*mer:(this.L+(parez?this.dPar*0.45:0.8*Rcm))*mer;
    const oxCil=Math.min(w-Rpx-30,24+levo);     // px: střed objektu
    if(this.plyn.ox===null) this.plyn.ox=oxCil;
    if(!drzim) this.plyn.ox+=(oxCil-this.plyn.ox)*0.2;
    const ox=this.plyn.ox;
    const cmx=c=>ox+c*mer;

    // Tyč je vždy zasunutá pod břemeno: u kamene pod jeho bok, u pařezu pod kořenový
    // krček. Bez podpěry leží konec tyče na zemi za břemenem, s podpěrou je hrot na
    // straně břemene a podpěra (poleno) je mezi ním a rukama.
    const bok=parez?this.dPar*0.45:0.8*Rcm;            // jak daleko od středu hrot podebírá
    const hrotCm=parez?this.dPar*0.14:0.4*Rcm;         // výška hrotu nad zemí v klidu
    const zatezX=jedno?cmx(0):cmx(-bok);
    const hpx=jedno?0:(hrotCm+this.r1*Math.sin(fmax))*mer;   // výška polena pod tyčí
    const Ax=zatezX+(jedno?this.r1*mer:-this.r1*mer), Ay=zemY-hpx;
    const alfaCil=alfa;
    if(this.alfaZ===undefined) this.alfaZ=alfaCil;
    this.alfaZ+=(alfaCil-this.alfaZ)*(drzim&&tahne.typ==='tyc'?1:0.3);
    alfa=this.alfaZ;
    const cs=Math.cos(alfa), sn=Math.sin(alfa);
    const dirZ=jedno?[-cs,-sn]:[cs,-sn];               // od osy k břemenu
    const dirU=jedno?[-cs,-sn]:[-cs,sn];               // od osy k úchopu
    const bod=(dir,rcm)=>[Ax+rcm*mer*dir[0],Ay+rcm*mer*dir[1]];
    const [Zx,Zy]=bod(dirZ,this.r1);                   // působiště na břemeni
    const [Gx,Gy]=bod(dirU,this.rGrip);                // úchop
    const konec=bod(dirU,jedno?this.L:this.L-this.r1); // volný konec tyče
    const zdvihPx=Math.max(0,this.r1*mer*(Math.sin(alfa)-Math.sin(a0)));
    const vali=this.faze!=='klid';
    this.geo={mer,Ax,Ay,zatezX,zemY,jedno,dirU,Rcm};

    // podlaha
    ctx.strokeStyle=C.border; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,zemY); ctx.lineTo(w,zemY); ctx.stroke();
    ctx.strokeStyle=C.border; ctx.lineWidth=1;
    for(let x=6;x<w;x+=16){ ctx.beginPath(); ctx.moveTo(x,zemY); ctx.lineTo(x-8,zemY+9); ctx.stroke(); }

    // jáma po vytrženém pařezu
    if(parez&&vali){
      ctx.save(); ctx.fillStyle=C.silny; ctx.globalAlpha=.4;
      ctx.beginPath(); ctx.ellipse(cmx(0),zemY,this.dPar*mer*0.8,this.dPar*mer*0.24,0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.strokeStyle=C.faint; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
    }

    // poloha břemene
    let objX=cmx(0), objY=zemY, otoc=0;
    if(parez){
      const t=this.faze==='klid'?0:this.s;
      // po povolení kořenů pařez vyletí obloukem a padne vedle jámy
      objY=zemY-(vali?(this.cil()*(1-t)+16*Math.sin(Math.PI*t))*mer:zdvihPx);
      objX=cmx(0)+(vali?45*mer*t:0);
      otoc=vali?t*1.5:zdvihPx*0.006;      // páčením se pařez lehce nakloní od tyče
    }else if(jedno){
      objX=cmx(0)+(vali?this.s*mer:0);
      objY=zemY-(vali?0:zdvihPx);
      otoc=vali?this.s*mer/Rpx:0;
    }else{
      objX=cmx(0)+(vali?this.s*mer:zdvihPx*0.6);
      objY=zemY-(vali?0:zdvihPx*0.5);
      otoc=(vali?this.s*mer:zdvihPx*0.6)/Rpx;
    }
    objX=Math.min(w-Rpx-8,objX);

    const kresliTyc=()=>{
      ctx.save(); ctx.lineCap='round';
      ctx.strokeStyle=C.akcent; ctx.lineWidth=7;
      const zadni=bod(dirZ,jedno?0:this.r1+8/mer);
      ctx.beginPath(); ctx.moveTo(konec[0],konec[1]); ctx.lineTo(zadni[0],zadni[1]); ctx.stroke();
      ctx.restore();
    };
    const kresliObjekt=()=> parez?this.kresliParez(objX,objY,otoc,mer):this.kresliKamen(objX,objY,otoc,Rpx);

    // podpěrou je poleno – tyč přes něj leží, proto se kreslí dřív než tyč
    const kresliPoleno=()=>{
      const r=hpx/2;
      ctx.save(); ctx.translate(Ax,zemY-r);
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
      ctx.fillStyle=C.elev; ctx.fill();                       // čelo řezu
      ctx.strokeStyle=C.silny; ctx.lineWidth=Math.max(3,r*0.22); ctx.stroke();   // kůra
      ctx.strokeStyle=C.faint; ctx.lineWidth=1; ctx.globalAlpha=.75;
      for(let i=1;i<=3;i++){ ctx.beginPath(); ctx.arc(0,0,r*(0.17+0.21*i),0,Math.PI*2); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(-r*0.55,0); ctx.lineTo(r*0.6,-r*0.12); ctx.stroke();   // prasklina
      ctx.globalAlpha=1; ctx.restore();
    };
    // Pořadí kreslení dělá „zastrčení": co má být pod břemenem, kreslí se dřív.
    if(jedno) { kresliTyc(); kresliObjekt(); }
    else if(parez){ kresliPoleno(); kresliTyc(); kresliObjekt(); }
    else { kresliObjekt(); kresliPoleno(); kresliTyc(); }

    // označení osy otáčení
    if(!jedno){
      ctx.fillStyle=C.ok;
      ctx.beginPath(); ctx.arc(Ax,Ay,5,0,Math.PI*2); ctx.fill();
      uchop(Ax,zemY-hpx*0.5,Math.max(18,Math.min(34,hpx*0.5)),'osa');
      popis('poleno = osa otáčení',Ax,zemY+22,C.ok,'11px sans-serif');
    }else{
      ctx.fillStyle=C.ok;
      ctx.beginPath(); ctx.arc(Ax,zemY-3,7,0,Math.PI*2); ctx.fill();
      uchop(Ax,zemY-6,20,'osa');
      popis('konec tyče = osa otáčení',Ax,zemY+22,C.ok,'11px sans-serif');
    }

    // odpor břemene
    const odpor=this.odpor();
    const sipY=parez?objY-this.dPar*mer*0.55:objY-Rpx;
    const sipKon=Math.min(h-16,parez?objY+this.dPar*mer*0.35+30:objY+40);
    sipka(objX,sipY,objX,sipKon,C.warn,3);
    if(parez) popis('odpor kořenů ≈ '+cz(odpor,0)+' N',objX+10,sipKon,C.warn,'bold 12px sans-serif','left');
    else popis('G = '+cz(odpor,0)+' N',objX,Math.min(h-6,sipKon+14),C.warn,'bold 12px sans-serif');

    // cílová čára: kam musí působiště vystoupat
    if(!vali){
      const cilY=Ay-this.r1*mer*Math.sin(a0+fmax);
      ctx.save(); ctx.strokeStyle=C.ok; ctx.setLineDash([5,5]); ctx.lineWidth=1.5;
      const zac=jedno?Ax:Ax+hpx/2+6;                  // u podpěry začíná až za polenem
      const kon=Zx+(jedno?-Rpx*0.3:Rpx*0.35);
      ctx.beginPath(); ctx.moveTo(zac,cilY); ctx.lineTo(kon,cilY); ctx.stroke();
      ctx.restore();
      // u podpěry je mezi polenem a břemenem málo místa, tam stačí krátký popisek
      if(zdvihPx<this.r1*mer*Math.sin(fmax)*0.55){
        if(jedno) popis(parez?'sem a kořeny povolí':'sem a kámen se překlopí',
          Zx-Rpx*1.05,cilY-4,C.ok,'11px sans-serif','right');
        else popis('sem musí hrot',zac+3,cilY-10,C.ok,'10px sans-serif','left');
      }
    }

    // stupnice úchopů: u každé značky je síla, kterou by tam bylo potřeba vyvinout
    const krok=this.L>200?40:20;
    let posl=-1e9;
    for(let r=krok;r<=this.maxGrip()+0.5;r+=krok){
      if(r<this.minGrip()) continue;
      const [tx,ty]=bod(dirU,r);
      ctx.save(); ctx.strokeStyle=C.faint; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(tx-dirU[1]*5,ty+dirU[0]*5); ctx.lineTo(tx+dirU[1]*5,ty-dirU[0]*5); ctx.stroke();
      ctx.restore();
      if(w>560&&h>240&&Math.abs(tx-posl)>52&&Math.abs(r-this.rGrip)>krok*0.4){
        posl=tx;
        popis(cz(odpor*this.r1/r,0)+' N',tx,ty+(jedno?-14:17),C.faint,'9px sans-serif');
      }
    }
    // úchopové body po celé tyči – klepnutím se vybírá rameno r₂
    for(let r=this.minGrip();r<=this.maxGrip()+0.5;r+=Math.max(6,10/mer)){
      const [tx,ty]=bod(dirU,r);
      uchop(tx,ty,Math.max(9,5*mer),'tyc',true,r);
    }

    // Ruka a potřebná síla. Délka šipky je úměrná síle a měřítkem je tvoje síla –
    // posun úchopu dál od osy tak šipku viditelně zkrátí (a naopak).
    const mocny=this.zvladne(), barvaF=mocny?C.akcent:C.danger;
    // Šipka roste nad rukou (tam je vždy místo): u dvojzvratné míří dolů na ruku,
    // u jednozvratné vzhůru, protože se táhne nahoru.
    const refPx=Math.max(38,Math.min(88,h*0.13));            // délka odpovídající tvé síle
    const mistoPx=Math.max(30,Gy-30);                        // co se ještě vejde nad ruku
    const pomer=this.potreba()/this.Fclovek;
    const delka=Math.max(14,Math.min(mistoPx,pomer*refPx));
    const pata=Gy-10-delka, sirkaF=Math.max(2.5,Math.min(6,2+3*pomer));
    if(jedno) sipka(Gx,Gy-10,Gx,pata,barvaF,sirkaF);
    else sipka(Gx,pata,Gx,Gy-10,barvaF,sirkaF);
    // značka „tvoje síla" – dokud šipka nepřeroste přes ni, břemeno zvedneš
    if(refPx<mistoPx){
      const ry=Gy-10-refPx;
      ctx.save(); ctx.strokeStyle=C.ok; ctx.lineWidth=2; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(Gx-13,ry); ctx.lineTo(Gx+13,ry); ctx.stroke(); ctx.restore();
      popis('tvoje síla '+this.Fclovek+' N',Gx+17,ry,C.ok,'10px sans-serif','left');
    }
    const Lx=Math.max(50,Math.min(w-50,Gx));   // popisky u ruky se nesmí utnout o okraj
    popis('F = '+cz(this.potreba(),0)+' N',Lx,Math.max(14,pata-13),barvaF,'bold 12px sans-serif');
    if(!jedno&&zdvihPx<=2) popis('r₂ = '+Math.round(this.rGrip)+' cm',Lx,Gy+26,C.akcent,'11px sans-serif');
    ctx.save(); ctx.globalAlpha=.9; ctx.strokeStyle=barvaF; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(Gx,Gy,15,0,Math.PI*2); ctx.stroke(); ctx.restore();
    ctx.font='19px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('✊',Gx,Gy);

    // kóty ramen pod zemí
    if(h>300){
      const kota=(x1,x2,y,barva,text)=>{
        ctx.save(); ctx.strokeStyle=barva; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y);
        ctx.moveTo(x1,y-5); ctx.lineTo(x1,y+5); ctx.moveTo(x2,y-5); ctx.lineTo(x2,y+5);
        ctx.stroke(); ctx.restore();
        if(Math.abs(x2-x1)>44) popis(text,(x1+x2)/2,y+13,barva,'bold 11px sans-serif');
      };
      const kY=Math.min(h-12,zemY+40);
      kota(Ax,zatezX,kY,C.warn,'r₁ = '+this.r1+' cm');
      kota(Ax-this.rGrip*mer,Ax,jedno?kY+26:kY,C.akcent,'r₂ = '+Math.round(this.rGrip)+' cm');
    }

    // hlášky
    if(this.faze==='hotovo')
      popis(parez?'✅ Pařez povolil! Dlouhé rameno udělá práci za tebe'
                 :'✅ Kámen se odvalil! Malá síla + dlouhé rameno = velký účinek',
        w/2,26,C.ok,'bold 15px sans-serif');
    else if(!mocny){
      popis('❌ Takhle to nezvedneš – potřebuješ '+cz(this.potreba(),0)+' N, zvládneš '+this.Fclovek+' N',w/2,26,C.danger,'bold 14px sans-serif');
      popis('Chyť tyč dál od osy, posuň osu blíž k břemeni nebo vezmi delší tyč',w/2,46,C.muted,'12px sans-serif');
    }
    else if(this.faze==='klid'&&this.fi<0.02)
      popis(jedno?'⬆️ Chyť tyč ✊ kdekoliv a zvedni ji nahoru':'⬇️ Chyť tyč ✊ kdekoliv a zatlač ji dolů',
        w/2,26,C.akcent,'bold 14px sans-serif');

    // Dráhy obou konců: ruka opíše dlouhý oblouk, břemeno krátký. Poměr je stejný
    // jako poměr ramen – zlaté pravidlo mechaniky přímo v obrázku.
    if(zdvihPx>2&&!vali){
      const pom=Math.sin(alfa)-Math.sin(a0);
      const c0=Math.cos(a0), s0=Math.sin(a0);
      const dirZ0=jedno?[-c0,-s0]:[c0,-s0], dirU0=jedno?[-c0,-s0]:[-c0,s0];
      const oblouk=(rcm,d0,d1,barva,text)=>{
        const R=rcm*mer, t0=Math.atan2(d0[1],d0[0]);
        let dt=Math.atan2(d1[1],d1[0])-t0;
        while(dt>Math.PI) dt-=2*Math.PI;
        while(dt<-Math.PI) dt+=2*Math.PI;
        if(Math.abs(dt)<0.004) return;
        ctx.save(); ctx.lineCap='round';
        ctx.strokeStyle=barva; ctx.lineWidth=3.5;
        ctx.beginPath(); ctx.arc(Ax,Ay,R,t0,t0+dt,dt<0); ctx.stroke();
        ctx.lineWidth=2;                      // prázdné kolečko = odkud se vyšlo
        ctx.beginPath(); ctx.arc(Ax+R*Math.cos(t0),Ay+R*Math.sin(t0),4,0,Math.PI*2); ctx.stroke();
        const t1=t0+dt, x1=Ax+R*Math.cos(t1), y1=Ay+R*Math.sin(t1);
        const sm=dt<0?-1:1, uh=Math.atan2(Math.cos(t1),-Math.sin(t1))+(sm<0?Math.PI:0);
        ctx.fillStyle=barva; ctx.beginPath();
        ctx.moveTo(x1+9*Math.cos(uh),y1+9*Math.sin(uh));
        ctx.lineTo(x1+9*Math.cos(uh+2.5),y1+9*Math.sin(uh+2.5));
        ctx.lineTo(x1+9*Math.cos(uh-2.5),y1+9*Math.sin(uh-2.5));
        ctx.closePath(); ctx.fill(); ctx.restore();
        if(text) popis(text,Math.max(46,Math.min(w-46,x1+28*Math.cos(uh))),
                       Math.max(12,Math.min(h-8,y1+28*Math.sin(uh))),barva,'bold 11px sans-serif');
      };
      oblouk(this.rGrip,dirU0,dirU,C.akcent,'ruka '+cz(this.rGrip*pom,0)+' cm');
      oblouk(this.r1,dirZ0,dirZ,C.warn,zdvihPx>14?'břemeno '+cz(this.r1*pom,1)+' cm':'');
    }
  },

  kresliKamen(x,y,otoc,Rpx){
    ctx.save(); ctx.translate(x,y-Rpx); ctx.rotate(otoc);
    ctx.beginPath();
    this.tvar.forEach((r,i)=>{
      const u=i/this.tvar.length*Math.PI*2, X=Math.cos(u)*Rpx*r, Y=Math.sin(u)*Rpx*r;
      i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
    });
    ctx.closePath();
    ctx.fillStyle=C.silny; ctx.fill();
    ctx.strokeStyle=C.faint; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=C.text; ctx.globalAlpha=.22;   // skvrny v obou motivech, jen jinak světlé
    for(const [dx,dy,dr] of [[-.35,-.3,.17],[.32,-.12,.12],[.02,.44,.1],[.46,.34,.08]]){
      ctx.beginPath(); ctx.arc(dx*Rpx,dy*Rpx,dr*Rpx,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
    uchop(x,y-Rpx,Rpx*0.8,'breme',true);
    popis(this.m+' kg',x,y-2*Rpx-14,C.muted,'bold 12px sans-serif');
  },

  kresliParez(x,y,otoc,mer){
    const d=this.dPar*mer, vys=d*0.55, hloub=d*0.8;
    ctx.save(); ctx.translate(x,y); ctx.rotate(otoc);
    // kořeny – kreslí se přes šrafuru země, aby bylo vidět, co drží
    ctx.strokeStyle=C.faint; ctx.lineWidth=Math.max(2,d*0.1); ctx.globalAlpha=.6; ctx.lineCap='round';
    for(const [dx,dy] of [[-1,.75],[-.5,1],[0,1.1],[.5,1],[1,.75]]){
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(dx*d*0.35,d*0.3,dx*d*0.8,dy*hloub); ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=C.silny; ctx.strokeStyle=C.faint; ctx.lineWidth=2;
    ctx.beginPath(); ctx.rect(-d/2,-vys,d,vys+d*0.2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-vys,d/2,d*0.15,0,0,Math.PI*2);
    ctx.fillStyle=C.elev; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-vys,d/4,d*0.075,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
    uchop(x,y-vys,Math.max(16,d*0.5),'breme',true);
    popis('⌀ '+this.dPar+' cm',x+d*0.62,y-vys-d*0.22,C.muted,'bold 12px sans-serif','left');
  },

  /* ---- tažení myší ---- */
  tahni(typ,x,y,vych){
    const g=this.geo; if(!g) return;
    if(typ==='osa'){
      const r=Math.round(g.jedno?(x-g.zatezX)/g.mer:(g.zatezX-x)/g.mer);
      $('dPodpera').value=Math.max(5,Math.min(80,r));
      this.nacti(); return;
    }
    if(typ==='breme'){                       // tažením dolů roste hmotnost / průměr
      if(this.uloha==='kamen'){
        const m=Math.round((vych.m+(y-vych.uy)*2)/10)*10;
        $('mKamen').value=Math.max(20,Math.min(600,m));
      }else{
        const d=Math.round((vych.d+(y-vych.uy)*0.4)/2)*2;
        $('dParez').value=Math.max(10,Math.min(60,d));
      }
      this.nacti(); this.vratit(); return;
    }
    if(typ!=='tyc'||this.faze!=='klid') return;
    if(!this.zvladne()){ this.fi=Math.min(this.fi,0.025); return; }
    const fm=this.fmax(), a0=this.alfa0();
    // úhel tyče podle polohy kurzoru vůči ose (u jednozvratné jde ruka nahoru)
    const alfa=g.jedno?Math.atan2(g.Ay-y,Math.max(1,g.Ax-x)):Math.atan2(y-g.Ay,Math.max(1,g.Ax-x));
    this.fi=Math.max(0,Math.min(fm,alfa-a0));
    if(this.fi>=fm-0.002) this.povolit();
  },

  /* obsah pravého sloupce: vzorce s dosazenými čísly a slovní vysvětlení */
  vypocet(){
    const parez=this.uloha==='parez', jedno=this.typ==='jedno';
    const odpor=this.odpor(), F=this.potreba(), zisk=this.rGrip/this.r1;
    const pom=Math.sin(this.alfa0()+this.fi)-Math.sin(this.alfa0());
    const s1=this.r1*pom, s2=this.rGrip*pom;          // dráhy v cm
    const r=[['h',parez?'📐 Vytržení pařezu':'📐 Odvalení kamene'],
      ['v','F · r₂ = odpor · r₁  →  F = odpor·r₁/r₂'],null,
      ['v',parez?'odpor ≈ 60 N/cm · '+this.dPar+' cm = '+cz(odpor,0)+' N'
                :'G = m·g = '+this.m+' · 9,81 = '+cz(odpor,0)+' N',C.warn],
      ['v','r₁ = '+this.r1+' cm   (osa → břemeno)',C.warn],
      ['v','r₂ = '+Math.round(this.rGrip)+' cm   (osa → ruce)',C.akcent],null,
      ['v','F = '+cz(odpor,0)+'·'+this.r1+' / '+Math.round(this.rGrip)+' = '+cz(F,0)+' N',
        this.zvladne()?C.ok:C.danger],
      ['v',(this.zvladne()?'✅ ':'❌ ')+'tvoje síla '+this.Fclovek+' N '+(this.zvladne()?'stačí':'nestačí'),
        this.zvladne()?C.ok:C.danger],null,
      ['h','⚖️ Zisk a zlaté pravidlo'],
      ['v','zisk na síle r₂ / r₁ = '+cz(zisk,1)+'×']];
    if(s1>0.05) r.push(['v','ruka '+cz(s2,0)+' cm × F = '+cz(F*s2/100,0)+' J'],
                       ['v','břemeno '+cz(s1,1)+' cm × odpor = '+cz(odpor*s1/100,0)+' J',C.ok]);
    else r.push(['v','dráhy jsou v témže poměru: '+cz(zisk,1)+'×']);
    r.push(null,['h','💡 Co se děje a proč']);
    r.push(['p',jedno
      ?'Bez podpěry: tyč je zasunutá pod břemeno a její konec se opírá o zem – ten je osou otáčení. Břemeno leží mezi osou a rukama, proto se táhne nahoru – jako u koleček.'
      :'S podpěrou: tyč je zasunutá pod břemeno a leží přes poleno, které je osou otáčení. Konce jdou proti sobě, proto se tlačí dolů – jako na houpačce.']);
    if(this.faze==='hotovo')
      r.push(['p','Hotovo. Malá síla po dlouhé dráze udělala stejnou práci jako velká síla po krátké – páka práci neušetří, jen ji rozloží.']);
    else if(!this.zvladne())
      r.push(['p','Potřebná síla je větší než tvoje. Ve zlomku odpor·r₁/r₂ pomůže obojí: chytit tyč dál od osy (roste r₂ ve jmenovateli) nebo posunout osu blíž k břemenu (klesá r₁ v čitateli).']);
    else
      r.push(['p','Sílu na to máš. Zapáč: '+(parez?'kořeny povolí':'kámen se překlopí')+', až se břemeno zvedne o '+
        cz(this.cil(),1)+' cm – ruka přitom musí opsat '+cz(this.cil()*zisk,0)+' cm, tedy '+cz(zisk,1)+'× víc.']);
    return r;
  },
  stav(){
    const F=this.potreba(), zisk=this.rGrip/this.r1, pom=Math.sin(this.alfa0()+this.fi)-Math.sin(this.alfa0());
    return `${this.uloha==='kamen'?'Tíha kamene <b>G':'Odpor kořenů <b>'} = ${cz(this.odpor(),0)} N</b> `+
      `<span class="znak">•</span> ${this.typ==='dvoj'?'s podpěrou (dvojzvratná)':'bez podpěry (jednozvratná)'} `+
      `<span class="znak">•</span> <b>F = odpor·r₁/r₂ = ${cz(F,0)} N</b> (r₁ = ${this.r1} cm, r₂ = ${Math.round(this.rGrip)} cm) `+
      `<span class="znak">•</span> tvoje síla <b>${this.Fclovek} N</b> → ${this.zvladne()?'✅ <b>zvedneš</b>':'❌ <b>nezvedneš</b>'} `+
      `<span class="znak">•</span> zisk na síle <b>${cz(zisk,1)}×</b> `+
      `<span class="znak">•</span> ruka ujde <b>${cz(this.rGrip*pom,0)} cm</b>, břemeno se zvedne o <b>${cz(this.r1*pom,1)} cm</b> `+
      `<span class="znak">•</span> 🪨 ${this.splKamen} <span class="znak">•</span> 🌳 ${this.splParez}`;
  }
};

/* ================= 2) KLADKY ================= */
const kladka={
  druh:'kladkostroj', n:1, G:200, h:0, geo:{mer:2.4,k:2}, ukol:null, splneno:0,
  nacti(){
    this.druh=$('druhKladky').value;
    this.n=+$('pocetKladek').value; this.G=+$('brem').value; this.h=+$('zvednuti').value;
    $('pocetKladekV').textContent=this.n===1?'1 (volná kladka)':this.n;
    $('bremV').textContent=this.G+' N'; $('zvednutiV').textContent=this.h+' cm';
    $('lblPocet').classList.toggle('skryto',this.druh==='pevna');
  },
  prevod(){ return this.druh==='pevna'?1:2*this.n; },
  sila(){ return this.G/this.prevod(); },
  zadejUkol(){
    const nahodne=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
    const potreba=nahodne(2,4), G=nahodne(8,20)*20;
    // mez volíme tak, aby o jednu kladku míň už nestačilo
    this.ukol={G,mez:Math.ceil(G/(2*potreba))};
    $('brem').value=G; $('pocetKladek').value=1; $('druhKladky').value='kladkostroj';
    $('druhKladky').dispatchEvent(new Event('change',{bubbles:true}));
    this.nacti();
  },

  kresli(w,h){
    const k=this.prevod();
    const uzky=this.sPanelem||w<780;        // s postranním panelem (nebo na úzké ploše) se přehled vynechá
    const mer=Math.max(2.4,Math.min(4.4,(h*0.44)/50));
    const R=Math.max(20,Math.min(30,w/48));
    const stropY=Math.max(38,h*0.07);
    const cx=uzky?w/2:w*0.33;
    const zdvih=this.h*mer;
    const zakladBlok=stropY+Math.max(150,Math.min(275,h*0.50));
    const blokY=zakladBlok-zdvih;
    // Otáčení kladek. Kladné faze = po směru hodinových ručiček (y roste dolů).
    // Lano teče od kotvy k ruce, takže:
    //  – pevné kladky nahoře lano přebíhá zleva doprava PŘES vršek → po směru,
    //  – volné kladky dole zleva doprava POD spodkem → proti směru.
    // Kolik lana kterou kladkou proběhne: po řetězci od kotvy přibývá vždy jedno
    // zvednutí (1·h přes první volnou, 2·h přes první pevnou, 3·h přes druhou volnou …),
    // až poslední pevná odvine celých k·h do ruky.
    const obrat=zdvih/R;                    // pootočení na jedno zvednutí břemene
    this.otoceni={horni:[],dolni:[]};       // ukládáme kvůli kontrole směru
    this.geo={mer,k};

    strop(stropY,0,uzky?w:w*0.62);

    ctx.lineWidth=2.5; ctx.strokeStyle=C.ok;
    const lano=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
    const oblouk=(x,y,r,a1,a2)=>{ctx.beginPath();ctx.arc(x,y,r,a1,a2);ctx.stroke();};
    const nosne=[];                         // x-ové polohy pramenů, které nesou břemeno

    let rukaX,rukaY;
    if(this.druh==='pevna'){
      const py=stropY+42;
      ctx.strokeStyle=C.silny; ctx.lineWidth=3; lano(cx,stropY,cx,py-R);
      ctx.strokeStyle=C.ok; ctx.lineWidth=2.5;
      oblouk(cx,py,R,Math.PI,0);
      lano(cx+R,py,cx+R,blokY);
      // u pevné kladky jde lano od břemene vpravo přes vršek k ruce vlevo → proti směru
      this.otoceni.horni.push(-obrat);
      kotoucKladky(cx,py,R,C.akcent,-obrat);
      nosne.push([cx+R,(py+blokY)/2]);
      this.bremeno(cx+R,blokY,w);
      rukaX=cx-R; rukaY=Math.min(h-42,py+90+this.h*k*mer);
      ctx.strokeStyle=C.ok; ctx.lineWidth=2.5;
      lano(rukaX,py,rukaX,rukaY);
    }else{
      const n=this.n, L=cx-2*R*n;
      const topY=stropY+36;
      const xB=i=>L+R+4*R*i, xT=i=>xB(i)+2*R;
      ctx.strokeStyle=C.silny; ctx.lineWidth=3;
      for(let i=0;i<n;i++) lano(xT(i),stropY,xT(i),topY-R);
      ctx.strokeStyle=C.warn; ctx.lineWidth=3;
      lano(xB(0)-R,blokY+R+4,xB(n-1)+R,blokY+R+4);
      ctx.strokeStyle=C.ok; ctx.lineWidth=2.5;
      lano(L,stropY,L,blokY);                                  // kotva → první volná kladka
      ctx.fillStyle=C.silny; ctx.fillRect(L-5,stropY-2,10,8);
      nosne.push([L,(topY+blokY)/2]);
      for(let i=0;i<n;i++){
        ctx.strokeStyle=C.ok; ctx.lineWidth=2.5;
        oblouk(xB(i),blokY,R,0,Math.PI);
        lano(xB(i)+R,blokY,xB(i)+R,topY);
        nosne.push([xB(i)+R,(topY+blokY)/2]);
        oblouk(xT(i),topY,R,Math.PI,0);
        if(i<n-1){ lano(xT(i)+R,topY,xT(i)+R,blokY); nosne.push([xT(i)+R,(topY+blokY)/2]); }
      }
      for(let i=0;i<n;i++){
        const f=(2*i+2)*obrat;              // pevná kladka: lano přes vršek doprava
        this.otoceni.horni.push(f);
        kotoucKladky(xT(i),topY,R,C.akcent,f);
      }
      for(let i=0;i<n;i++){
        const f=-(2*i+1)*obrat;             // volná kladka: lano spodkem doprava
        this.otoceni.dolni.push(f);
        kotoucKladky(xB(i),blokY,R,C.warn,f);
      }
      this.bremeno((xB(0)+xB(n-1))/2,blokY+R+4,w);
      popis('kotva lana',L-8,stropY+16,C.faint,'10px sans-serif','right');
      rukaX=xT(n-1)+R; rukaY=Math.min(h-42,topY+110+this.h*k*mer);
      ctx.strokeStyle=C.ok; ctx.lineWidth=2.5;
      lano(rukaX,topY,rukaX,rukaY);
    }

    // očíslované prameny – právě ony dělí tíhu mezi sebe
    nosne.forEach(([px,py],i)=>{
      ctx.fillStyle=C.bg||C.elev; ctx.strokeStyle=C.ok; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(px,py,9,0,Math.PI*2); ctx.fill(); ctx.stroke();
      popis(String(i+1),px,py,C.ok,'bold 10px sans-serif');
    });
    const p=nosne.length;
    popis(p===1?'① 1 pramen nese celou tíhu – pevná kladka mění jen směr'
          :'①–'+String.fromCharCode(9311+p)+' '+p+(p<5?' prameny nesou':' pramenů nese')+
           ' břemeno → na každý připadá '+cz(this.G/p,1)+' N',
          16, stropY+40, C.ok,'12px sans-serif','left');

    // siloměr s rukou na konci lana
    this.silomer(rukaX,rukaY);
    uchop(rukaX,rukaY+6,24,'lano');

    // svislé měřítko zvednutí vlevo
    this.merítko(24,zakladBlok+(this.druh==='pevna'?0:R+4)+18+this.vyskaBremene()+16,mer,w);

    // přehled sil, drah a práce vpravo
    if(!uzky) this.prehled(w*0.63,stropY+34,w-24-w*0.63,k);

    // zadání úkolu
    if(this.ukol){
      const hotovo=this.sila()<=this.ukol.mez+1e-9;
      popis(hotovo?'✅ Zvládnuto! Stačí '+this.n+(this.n===1?' volná kladka':' volné kladky')
                  :'🎯 Úkol: zvedni '+this.ukol.G+' N silou nejvýš '+this.ukol.mez+' N – kolik kladek potřebuješ?',
            w/2,20,hotovo?C.ok:C.warn,'bold 14px sans-serif');
      if(hotovo){ this.ukol=null; this.splneno++; }
    }
  },

  silomer(x,y){
    ctx.fillStyle=C.elev; ctx.strokeStyle=C.akcent; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(x-30,y-34,60,30,7); ctx.fill(); ctx.stroke();
    popis(cz(this.sila(),1)+' N',x,y-19,C.akcent,'bold 13px sans-serif');
    popis('🤚',x,y+8,C.text,'22px sans-serif');
    popis('siloměr – táhni dolů',x+38,y-19,C.faint,'11px sans-serif','left');
  },

  merítko(x,nulaY,mer,w){
    const vyska=50*mer;
    ctx.strokeStyle=C.border; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x,nulaY); ctx.lineTo(x,nulaY-vyska); ctx.stroke();
    ctx.fillStyle=C.faint; ctx.font='9px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    for(let cm=0;cm<=50;cm+=10){
      const y=nulaY-cm*mer;
      ctx.fillRect(x-4,y-0.5,8,1);
      ctx.fillText(cm,x+8,y);
    }
    // nulová hladina a aktuální výška břemene
    ctx.strokeStyle=C.faint; ctx.setLineDash([4,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,nulaY); ctx.lineTo(w-20,nulaY); ctx.stroke();
    ctx.setLineDash([]);
    popis('výchozí poloha břemene',w-24,nulaY-10,C.faint,'10px sans-serif','right');
    if(this.h>0){
      const y=nulaY-this.h*mer;
      ctx.strokeStyle=C.warn; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x-6,y); ctx.lineTo(x+6,y); ctx.stroke();
      popis('h = '+this.h+' cm',x+26,y-1,C.warn,'bold 11px sans-serif','left');
    }
  },

  /* obsah pravého sloupce – stejný styl jako u páky */
  vypocet(){
    const k=this.prevod(), F=this.sila(), s=this.h*k, A=F*s/100;
    const pevna=this.druh==='pevna';
    const r=[['h','📐 '+(pevna?'Pevná kladka':'Kladkostroj')],
      ['v','n = počet nosných pramenů = '+k],
      ['v','F = G / n = '+this.G+' / '+k+' = '+cz(F,1)+' N',C.akcent],null,
      ['b','F = '+cz(F,1)+' N (táhneš ty)',F/this.G,C.akcent],
      ['b','G = '+this.G+' N (břemeno)',1,C.warn],null,
      ['h','📏 Dráha a práce'],
      ['v','s = n · h = '+k+' · '+this.h+' = '+cz(s,0)+' cm'],
      ['b','lano s = '+cz(s,0)+' cm',s/Math.max(s,this.h,1),C.akcent],
      ['b','břemeno h = '+this.h+' cm',this.h/Math.max(s,this.h,1),C.warn],
      ['v','F·s = '+cz(A,2)+' J   =   G·h = '+cz(this.G*this.h/100,2)+' J',C.ok],null,
      ['h','💡 Co se děje a proč']];
    r.push(['p',pevna
      ?'Pevná kladka visí na stropě a jen mění směr síly – lano na obou stranách nese stejnou tíhu, takže táhneš celých '+this.G+' N. Zato můžeš táhnout dolů, což je pohodlnější.'
      :'Břemeno visí na '+k+' pramenech lana a každý nese stejný díl tíhy. Proto stačí '+this.G+' / '+k+' = '+cz(F,1)+' N. Spočítej si prameny mezi bloky – kolik jich je, tolikrát je síla menší.']);
    r.push(['p',pevna
      ?'Dráha se nemění: o kolik vytáhneš lano, o tolik stoupne břemeno. Práce je proto stejná na obou stranách.'
      :'Zaplatíš to dráhou: aby břemeno stouplo o '+this.h+' cm, musí se každý z '+k+' pramenů zkrátit o '+this.h+' cm – vytáhneš '+cz(s,0)+' cm lana. Práce F·s se rovná G·h, žádný stroj ji neušetří.']);
    if(this.ukol) r.push(['p','🎯 Úkol: zvedni '+this.ukol.G+' N tak, abys táhl nejvýš '+cz(this.ukol.G/(2*this.ukol.mez),0)+' N.',C.warn]);
    return r;
  },
  prehled(x0,y0,sirka,k){
    const F=this.sila(), s=this.h*k, A=F*s/100;
    const sirkaPruhu=Math.max(110,sirka-170);
    popis('📊 Co kladkostroj mění',x0,y0,C.text,'bold 13px sans-serif','left');
    let y=y0+30;
    const nadpis=t=>{ popis(t,x0,y,C.faint,'11px sans-serif','left'); y+=17; };
    const pruh=(podil,barva,text)=>{
      ctx.fillStyle=C.panel; ctx.fillRect(x0,y-9,sirkaPruhu,18);
      ctx.fillStyle=barva; ctx.fillRect(x0,y-9,Math.max(1,sirkaPruhu*Math.min(1,podil)),18);
      ctx.strokeStyle=C.border; ctx.lineWidth=1; ctx.strokeRect(x0,y-9,sirkaPruhu,18);
      popis(text,x0+sirkaPruhu+10,y,C.text,'12px sans-serif','left');
      y+=24;
    };
    nadpis('SÍLA – kolikrát míň zabereš');
    pruh(F/this.G,C.akcent,'F = '+cz(F,1)+' N (táhneš ty)');
    pruh(1,C.warn,'G = '+this.G+' N (břemeno)');
    y+=8;
    nadpis('DRÁHA – o kolik víc lana');
    const maxD=Math.max(s,this.h,1);
    pruh(s/maxD,C.akcent,'lano s = '+cz(s,0)+' cm');
    pruh(this.h/maxD,C.warn,'břemeno h = '+this.h+' cm');
    y+=8;
    nadpis('PRÁCE – ta zůstává stejná');
    pruh(A>0?1:0,C.akcent,'F · s = '+cz(A,2)+' J');
    pruh(A>0?1:0,C.warn,'G · h = '+cz(this.G*this.h/100,2)+' J');
  },

  vyskaBremene(){ return Math.max(34,Math.min(78,26+this.G*0.12))*0.72; },
  tahni(typ,x,y,vych){
    const {mer,k}=this.geo;
    // lano táhneš k·h, břemeno stoupá h – oba směry vedou na stejný posuvník
    const h=typ==='lano' ? vych.h+(y-vych.y)/(k*mer) : vych.h-(y-vych.y)/mer;
    $('zvednuti').value=Math.max(0,Math.min(50,Math.round(h)));
    this.nacti();
  },
  bremeno(x,y,w){
    const s=Math.max(34,Math.min(78,26+this.G*0.12));
    uchop(x,y+18+s*0.36,Math.max(26,s*0.55),'bremeno2');
    ctx.strokeStyle=C.faint; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+18); ctx.stroke();
    ctx.fillStyle=C.warn; ctx.fillRect(x-s/2,y+18,s,s*0.72);
    ctx.fillStyle=C.text; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(this.G+' N',x,y+18+s*0.36);
    // tíha působí dolů
    sipka(x,y+18+s*0.72+6,x,y+18+s*0.72+30,C.warn,2.5);
  },
  stav(){
    const k=this.prevod(), F=this.sila(), s=this.h*k;
    const uvod=this.splneno?`🎯 Splněno: <b>${this.splneno}</b> <span class="znak">•</span> `:'';
    return uvod+`Potřebná síla <b>F = ${cz(F,1)} N</b> (místo ${this.G} N) `+
      `<span class="znak">•</span> Ušetříš <b>${k}×</b> na síle `+
      `<span class="znak">•</span> Vytažené lano <b>${cz(s,0)} cm</b> na zvednutí o <b>${this.h} cm</b> `+
      `<span class="znak">•</span> Práce <b>${cz(F*s/100,2)} J = ${cz(this.G*this.h/100,2)} J</b> — na práci neušetříš nic`;
  }
};

/* ================= 3) OZUBENÁ KOLA ================= */
const kola={
  rezim:'dvojice',
  z1:12, z2:30, z3:10, z4:28, otacky:60, moment:10, mezi:false,
  stupen:1, otackyMotor:2500, otackyKardan:200, zatacka:0, naLedu:false, ujeto:0,
  faze:0, cas:10*3600+8*60, rychlost:60, rucne:false, geo:[], vsechnaKola:[],

  nacti(){
    this.rezim=$('rezimKol').value;
    this.z1=+$('z1').value; this.z2=+$('z2').value; this.z3=+$('z3').value; this.z4=+$('z4').value;
    this.otacky=+$('otacky').value; this.moment=+$('mom').value; this.mezi=$('mezikolo').checked;
    this.rychlost=+$('hodRychlost').value; this.stupen=+$('stupen').value;
    this.otackyMotor=+$('otackyMotor').value; this.otackyKardan=+$('otackyKardan').value;
    this.zatacka=+$('zatacka').value;
    $('z1V').textContent=this.z1; $('z2V').textContent=this.z2;
    $('z3V').textContent=this.z3; $('z4V').textContent=this.z4;
    $('otackyV').textContent=this.otacky+'/min'; $('momV').textContent=this.moment+' N·m';
    $('hodRychlostV').textContent=this.rychlost+'×';
    $('otackyMotorV').textContent=this.otackyMotor+'/min';
    $('otackyKardanV').textContent=this.otackyKardan+'/min';
    $('zatackaV').textContent=this.zatacka===0?'rovně'
      :`${cz(this.polomerZatacky(),1)} m ${this.zatacka<0?'vlevo':'vpravo'}`;
    document.querySelectorAll('#panelKola [data-rezim]').forEach(el=>
      el.classList.toggle('skryto',!el.dataset.rezim.split(' ').includes(this.rezim)));
    if(rezim==='kola') $('infoText').innerHTML=this.napoveda();
    if(rezim==='kola') $('napoveda').textContent=this.dole();
  },

  /* ---- evolventní profil zubu (r = m·z/2, hlava +m, pata −1,25m, záběr 20°) ---- */
  UHEL_ZABERU:20*Math.PI/180,
  cachePaty:new Map(),
  tvarKola(z,m){
    const klic=z+'|'+m.toFixed(2);
    if(this.cachePaty.has(klic)) return this.cachePaty.get(klic);
    const alfa=this.UHEL_ZABERU;
    const r=m*z/2, rb=r*Math.cos(alfa), ra=r+m, rf=Math.max(r*0.3,r-1.25*m);
    const inv=a=>Math.tan(a)-a;
    const pul=rho=>{
      const a=rho<=rb?0:Math.acos(Math.min(1,rb/rho));
      return Math.max(0,Math.PI/(2*z)+inv(alfa)-inv(a));
    };
    const odkud=Math.max(rf,rb), bok=[];
    for(let i=0;i<=10;i++){ const rho=odkud+(ra-odkud)*i/10; bok.push([rho,pul(rho)]); }
    const pataUhel=pul(odkud), p=new Path2D();
    for(let t=0;t<z;t++){
      const stred=t*2*Math.PI/z;
      const bod=(rho,a)=>[rho*Math.cos(stred+a),rho*Math.sin(stred+a)];
      if(rf<odkud){ const [x,y]=bod(rf,-pataUhel); t===0?p.moveTo(x,y):p.lineTo(x,y); }
      bok.forEach(([rho,a],i)=>{ const [x,y]=bod(rho,-a);
        (t===0&&i===0&&rf>=odkud)?p.moveTo(x,y):p.lineTo(x,y); });
      p.arc(0,0,ra,stred-pul(ra),stred+pul(ra));
      for(let i=bok.length-1;i>=0;i--){ const [x,y]=bod(bok[i][0],bok[i][1]); p.lineTo(x,y); }
      if(rf<odkud){ const [x,y]=bod(rf,pataUhel); p.lineTo(x,y); }
      p.arc(0,0,rf,stred+pataUhel,stred+2*Math.PI/z-pataUhel);
    }
    p.closePath();
    const tvar={cesta:p,r,ra,rf};
    this.cachePaty.set(klic,tvar);
    return tvar;
  },
  /* Natočení zabírajícího souseda. beta = směr od středu A ke středu B.
     Konstanta β+π−π/z_B postaví sousedovi na spojnici středů mezeru proti zubu. */
  fazeSouseda(fazeA,zA,zB,beta=0){
    return beta+Math.PI-Math.PI/zB-(zA/zB)*(fazeA-beta);
  },
  kresliKolo(x,y,z,m,faze,barva,popisek,volby={}){
    const t=this.tvarKola(z,m), r=t.r;
    this.vsechnaKola.push({x,y,z,modul:m,faze});   // pro kontrolu záběru
    ctx.save();
    if(volby.slabe) ctx.globalAlpha=volby.slabe;
    ctx.save(); ctx.translate(x,y); ctx.rotate(faze);
    ctx.fillStyle=volby.vypln||C.elev; ctx.fill(t.cesta);
    ctx.strokeStyle=barva; ctx.lineWidth=volby.tenke?1.2:2; ctx.stroke(t.cesta);
    if(!volby.bezNaboje){
      ctx.strokeStyle=C.faint; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(0,0,Math.max(4,r*0.18),0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle=barva; ctx.lineWidth=volby.tenke?2:3;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r*0.72,0); ctx.stroke();
    }
    ctx.restore();
    if(volby.roztecna){
      ctx.strokeStyle=C.faint; ctx.setLineDash([3,4]); ctx.lineWidth=1; ctx.globalAlpha=(volby.slabe||1)*.6;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
    if(popisek) popis(popisek,x,volby.nahore?y-t.ra-14:y+t.ra+16,barva,'bold 12px sans-serif');
    return t;
  },
  sipkaOtaceni(x,y,r,kladne,barva){
    ctx.strokeStyle=barva; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,r,-2.5,-0.7); ctx.stroke();
    const a=kladne?-0.7:-2.5, sm=kladne?1:-1;
    const px=x+r*Math.cos(a), py=y+r*Math.sin(a);
    ctx.fillStyle=barva;
    ctx.beginPath();
    ctx.moveTo(px,py);
    ctx.lineTo(px-sm*7*Math.cos(a-1.2),py-sm*7*Math.sin(a-1.2));
    ctx.lineTo(px-sm*7*Math.cos(a-2.2),py-sm*7*Math.sin(a-2.2));
    ctx.closePath(); ctx.fill();
  },

  krok(dt){
    if(this.rezim==='hodiny'){ this.cas+=dt*this.rychlost; return; }
    if(this.rucne) return;
    let ot=this.otacky;
    if(this.rezim==='prevodovka') ot=this.otackyMotor/28;      // zpomaleno, ať jde záběr sledovat
    if(this.rezim==='diferencial') ot=this.otackyKardan/4;
    this.faze+=dt*ot/60*Math.PI*2;
  },
  kresli(w,h){
    this.geo=[]; this.vsechnaKola=[];
    if(this.rezim==='dvojice') this.dvojice(w,h);
    else if(this.rezim==='soukoli') this.soukoli(w,h);
    else if(this.rezim==='hodiny') this.hodiny(w,h);
    else if(this.rezim==='prevodovka') this.prevodovka(w,h);
    else this.diferencial(w,h);
  },

  /* ---------- 1) dvě kola v záběru ---------- */
  dvojice(w,h){
    const cy=h*0.48;
    const seznam=this.mezi?[this.z1,18,this.z2]:[this.z1,this.z2];
    const soucet=seznam.reduce((a,b)=>a+b,0);
    const modul=Math.min(11,(w*0.88)/(soucet+2*seznam.length),(h*0.74)/(Math.max(...seznam)+2));
    let x=(w-soucet*modul)/2;
    const barvy=this.mezi?[C.akcent,C.faint,C.ok]:[C.akcent,C.ok];
    const jmena=this.mezi?['hnací z₁='+this.z1,'mezikolo z=18','hnané z₂='+this.z2]
                         :['hnací z₁='+this.z1,'hnané z₂='+this.z2];
    const posuvniky=this.mezi?['z1',null,'z2']:['z1','z2'];
    let faze=this.faze, smer=1;
    seznam.forEach((z,i)=>{
      const r=z*modul/2;
      x+=r;
      if(i>0){ faze=this.fazeSouseda(faze,seznam[i-1],z); smer=-smer; }
      this.geo.push({x,y:cy,prevod:(i%2?-1:1)*z/seznam[0],z,modul,faze,posuvnik:posuvniky[i]});
      uchop(x,cy,r,'kolo'+i,true);
      this.kresliKolo(x,cy,z,modul,faze,barvy[i]||C.ok,jmena[i],{roztecna:true});
      this.sipkaOtaceni(x,cy,r*0.45,smer>0,C.muted);
      x+=r;
    });
  },

  /* ---------- 2) vícestupňové soukolí ---------- */
  /* Dva stupně nejdou nakreslit do jedné roviny: kolo z₂ je vždycky větší než pastorek z₃,
     takže by zasahovalo do kola z₄. Na hřídeli jsou ve skutečnosti za sebou – proto
     kreslíme každý stupeň do vlastní řady a hřídel mezi nimi svisle. */
  dveRoviny(w,h,z,mezera){
    const rada1=Math.max(z[0],z[1])/2+1, rada2=Math.max(z[2],z[3])/2+1;
    const dx1=(z[0]+z[1])/2, dxK=(z[2]+z[3])/2;
    // svislý odstup musí odklidit z₁ od z₃, z₂ od z₄ i z₁ od z₄
    const potreba=(soucet,vodorovne)=>Math.max(0,Math.pow(soucet/2+mezera,2)-vodorovne*vodorovne);
    // a hlavně kola z₂ a z₃ na společné hřídeli nesmí splynout – ta leží nad sebou
    const dyK=Math.max((z[1]+z[2])/2+mezera, Math.sqrt(Math.max(4,
      potreba(z[0]+z[2],dx1), potreba(z[1]+z[3],dxK), potreba(z[0]+z[3],dx1+dxK))));
    const sirkaK=z[0]/2+(z[0]+z[1])/2+dxK+z[3]/2;
    const modul=Math.min(7,(w*0.86)/(sirkaK+4),(h*0.76)/(rada1+rada2+dyK));
    const celkem=modul*(rada1+dyK+rada2);
    const y1=(h-celkem)/2+modul*rada1, y2=y1+modul*dyK;
    const xA=(w-modul*sirkaK)/2+modul*z[0]/2;
    const xB=xA+modul*(z[0]+z[1])/2, xC=xB+modul*dxK;
    return {modul,xA,xB,xC,y1,y2};
  },
  kresliHridel(x,y1,y2){
    ctx.strokeStyle=C.silny; ctx.lineWidth=7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2); ctx.stroke();
  },
  soukoli(w,h){
    const z=[this.z1,this.z2,this.z3,this.z4];
    const g=this.dveRoviny(w,h,z,6);
    const f1=this.faze;
    const f2=this.fazeSouseda(f1,z[0],z[1]);
    const f4=this.fazeSouseda(f2,z[2],z[3]);
    const kola=[[g.xA,g.y1,z[0],f1,C.akcent,'hnací z₁='+z[0],'z1',true],
                [g.xB,g.y1,z[1],f2,C.ok,'z₂='+z[1],'z2',true],
                [g.xB,g.y2,z[2],f2,C.danger,'z₃='+z[2],'z3',false],
                [g.xC,g.y2,z[3],f4,C.warn,'hnané z₄='+z[3],'z4',false]];
    kola.forEach(([x,y,zz,f,barva,jm,pos,nahore],i)=>{
      this.geo.push({x,y,z:zz,modul:g.modul,faze:f,posuvnik:pos,prevod:1});
      uchop(x,y,zz*g.modul/2,'kolo'+i,true);
      this.kresliKolo(x,y,zz,g.modul,f,barva,jm,{roztecna:true,nahore});
    });
    this.kresliHridel(g.xB,g.y1,g.y2);
    popis('⟊ z₂ a z₃ sedí na jedné hřídeli – otáčejí se stejně rychle',16,22,C.faint,'12px sans-serif','left');
    const i1=z[1]/z[0], i2=z[3]/z[2];
    popis('1. stupeň  i₁ = '+cz(i1,2),(g.xA+g.xB)/2,g.y1-g.modul*(Math.max(z[0],z[1])/2+1)-34,C.ok,'12px sans-serif');
    popis('2. stupeň  i₂ = '+cz(i2,2),(g.xB+g.xC)/2,g.y2+g.modul*(Math.max(z[2],z[3])/2+1)+36,C.warn,'12px sans-serif');
    popis('celkem i = i₁ · i₂ = '+cz(i1*i2,2)+'×',16,44,C.text,'bold 14px sans-serif','left');
  },

  /* ---------- 3) hodinový strojek ---------- */
  hodiny(w,h){
    const Z=[10,60,8,80];                        // 1:6 a 1:10 → dohromady 1:60
    const g=this.dveRoviny(w*0.56,h,Z,6);
    const fS=this.cas/60*2*Math.PI;              // sekundová hřídel: 1 otáčka za minutu
    const f2=this.fazeSouseda(fS,Z[0],Z[1]);
    const f4=this.fazeSouseda(f2,Z[2],Z[3]);
    this.kresliKolo(g.xA,g.y1,Z[0],g.modul,fS,C.akcent,'sekundová z='+Z[0],{roztecna:true,nahore:true});
    this.kresliKolo(g.xB,g.y1,Z[1],g.modul,f2,C.ok,'z='+Z[1],{roztecna:true,nahore:true});
    this.kresliKolo(g.xB,g.y2,Z[2],g.modul,f2,C.danger,'z='+Z[2],{roztecna:true});
    this.kresliKolo(g.xC,g.y2,Z[3],g.modul,f4,C.warn,'minutová z='+Z[3],{roztecna:true});
    this.kresliHridel(g.xB,g.y1,g.y2);
    popis('⟊ obě kola sedí na jedné hřídeli',16,22,C.faint,'12px sans-serif','left');
    popis('1 : 6',(g.xA+g.xB)/2,g.y1-g.modul*(Z[1]/2+1)-34,C.ok,'12px sans-serif');
    popis('1 : 10',(g.xB+g.xC)/2,g.y2+g.modul*(Z[3]/2+1)+36,C.warn,'12px sans-serif');
    popis('celkem 1 : 60 → z otáčky za minutu je otáčka za hodinu',16,44,C.text,'bold 13px sans-serif','left');

    const cx=w*0.79, cy=h*0.48, R=Math.min(w*0.17,h*0.38);
    ctx.fillStyle=C.elev; ctx.strokeStyle=C.silny; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill(); ctx.stroke();
    for(let i=0;i<60;i++){
      const a=i*Math.PI/30-Math.PI/2, velka=i%5===0;
      ctx.strokeStyle=velka?C.text:C.faint; ctx.lineWidth=velka?2:1;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*R*(velka?0.86:0.92),cy+Math.sin(a)*R*(velka?0.86:0.92));
      ctx.lineTo(cx+Math.cos(a)*R*0.97,cy+Math.sin(a)*R*0.97);
      ctx.stroke();
    }
    for(let i=1;i<=12;i++){
      const a=i*Math.PI/6-Math.PI/2;
      popis(String(i),cx+Math.cos(a)*R*0.74,cy+Math.sin(a)*R*0.74,C.muted,'bold 12px sans-serif');
    }
    const rucicka=(uhel,delka,sirkaC,barva)=>{
      ctx.strokeStyle=barva; ctx.lineWidth=sirkaC; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(uhel-Math.PI/2)*delka,cy+Math.sin(uhel-Math.PI/2)*delka);
      ctx.stroke();
    };
    const s=this.cas%60, mi=(this.cas/60)%60, ho=(this.cas/3600)%12;
    rucicka(ho*Math.PI/6,R*0.52,5,C.text);
    rucicka(mi*Math.PI/30,R*0.76,4,C.warn);
    rucicka(s*Math.PI/30,R*0.86,2,C.danger);
    ctx.fillStyle=C.text; ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fill();
    const dvoj=n=>String(Math.floor(n)).padStart(2,'0');
    popis(dvoj(ho<1?12:ho)+':'+dvoj(mi)+':'+dvoj(s),cx,cy+R+26,C.text,'bold 15px sans-serif');
    popis('hodinovou ručičku pohání ještě další soukolí 1 : 12',cx,cy+R+46,C.faint,'11px sans-serif');
  },

  STUPNE:[{n:'1.',zh:13,zd:47},{n:'2.',zh:19,zd:41},{n:'3.',zh:25,zd:35},
          {n:'4.',zh:30,zd:30},{n:'5.',zh:36,zd:24},{n:'R',zh:13,zd:42,zpet:true}],
  ROZVOD:3.9, OBVOD_KOLA:1.95,
  prevod(){
    if(this.stupen===0) return 0;
    const s=this.STUPNE[this.stupen-1];
    return (s.zpet?-1:1)*s.zd/s.zh;
  },

  /* ---------- 4) převodovka ---------- */
  prevodovka(w,h){
