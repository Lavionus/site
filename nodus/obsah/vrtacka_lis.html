<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ Vrtačka a lis: síly při práci</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<style>
body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.horni{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--bg-elevated);border-bottom:1px solid var(--border);flex-wrap:wrap}
.horni h1{font-size:1.05rem;font-weight:600;margin-right:auto}
.zalozky{display:flex;gap:6px}
.panel{display:flex;gap:8px;align-items:center;padding:9px 16px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel label{font-size:.78rem;color:var(--text-muted);display:flex;align-items:center;gap:6px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:4px 9px}
.panel .hodnota{color:var(--text);font-weight:600;min-width:4.4em;font-variant-numeric:tabular-nums}
input[type=range]{width:96px;accent-color:var(--accent)}
select{background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:.8rem}
button{background:var(--bg-control);border:1px solid var(--border-strong);color:var(--text);border-radius:6px;padding:7px 13px;font-size:.82rem;cursor:pointer}
button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
button.zap{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel label:has(input[type=checkbox]){background:var(--bg-control);border-color:var(--border-strong);cursor:pointer;color:var(--text-muted)}
.panel label:has(input[type=checkbox]:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.plocha{flex:1;position:relative;overflow:hidden;background:var(--bg-deep);min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.stav{background:var(--bg-panel);border-top:1px solid var(--border);padding:8px 16px;font-size:.8rem;color:var(--text-muted);display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}
.stav b{color:var(--text);font-variant-numeric:tabular-nums}
.stav .vzkaz{margin-left:auto;font-weight:600}
.stav .vzkaz.ok{color:var(--ok)}
.stav .vzkaz.varuj{color:var(--warn)}
.stav .vzkaz.zle{color:var(--danger)}
.info{position:absolute;top:12px;right:12px;width:290px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);overflow:auto;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;padding:11px 14px;font-size:.78rem;line-height:1.6;color:var(--text-muted);box-shadow:var(--shadow)}
.info b{color:var(--text)}
.info ul{margin:5px 0 5px 16px}
.info .zavri{position:absolute;top:5px;right:7px;background:none;border:none;color:var(--text-faint);font-size:1rem;padding:0 4px;cursor:pointer}
.info .zavri:hover{background:none;color:var(--accent)}
.ukol{position:absolute;left:12px;top:12px;width:290px;max-width:calc(100% - 24px);background:var(--bg-elevated);border:1px solid var(--accent);border-radius:10px;padding:10px 13px;font-size:.8rem;line-height:1.55;color:var(--text);box-shadow:var(--shadow)}
.ukol .vysledek{margin-top:6px;font-weight:600}
.ukol .vysledek.ok{color:var(--ok)}
.ukol .vysledek.zle{color:var(--danger)}
.napoveda{position:absolute;left:12px;bottom:10px;font-size:.74rem;color:var(--text-faint);pointer-events:none}
.skryto{display:none !important}
@media(max-width:820px){.info{display:none}.ukol{position:static;width:auto;margin:8px 10px 0}.panel{gap:6px;padding:8px 10px}input[type=range]{width:80px}}
</style>
</head>
<body>
<div class="horni">
  <h1>🛠️ Vrtačka a lis: síly při práci</h1>
  <div class="zalozky">
    <button id="tabVrtacka" class="zap">🌀 Vrtačka</button>
    <button id="tabLis">🗜️ Hydraulický lis</button>
  </div>
  <button id="btnInfo">❓ Nápověda</button>
</div>

<!-- ============ ovládání vrtačky ============ -->
<div class="panel" id="panelVrtacka">
  <label>🧱 <select id="material">
      <option value="drevo">Dřevo</option>
      <option value="plast">Plast</option>
      <option value="hlinik">Hliník</option>
      <option value="ocel" selected>Ocel</option>
      <option value="nerez">Nerez</option>
    </select></label>
  <label>⌀ Vrták <input type="range" id="prumer" min="2" max="20" step="0.5" value="8"><span class="hodnota" id="prumerV">8 mm</span></label>
  <label>🔄 Otáčky <input type="range" id="otacky" min="100" max="3000" step="25" value="700"><span class="hodnota" id="otackyV">700 min⁻¹</span></label>
  <label>⬇️ Posuv <input type="range" id="posuv" min="0.02" max="0.4" step="0.01" value="0.1"><span class="hodnota" id="posuvV">0,10 mm/ot</span></label>
  <label>📏 Tloušťka <input type="range" id="tloustka" min="5" max="40" step="1" value="20"><span class="hodnota" id="tloustkaV">20 mm</span></label>
  <button id="btnVrtej">▶️ Vrtat</button>
  <button id="btnZnovu">🔄 Nový kus</button>
  <button id="btnDoporuc">💡 Doporučené otáčky</button>
  <button id="btnUkolV">🎯 Úkol</button>
</div>

<!-- ============ ovládání lisu ============ -->
<div class="panel skryto" id="panelLis">
  <label>✋ Síla ruky <input type="range" id="sila" min="20" max="400" step="10" value="150"><span class="hodnota" id="silaV">150 N</span></label>
  <label>⚖️ Páka <input type="range" id="paka" min="1" max="12" step="0.5" value="6"><span class="hodnota" id="pakaV">6 : 1</span></label>
  <label>⌀ Malý píst <input type="range" id="d1" min="8" max="40" step="1" value="16"><span class="hodnota" id="d1V">16 mm</span></label>
  <label>⌀ Velký píst <input type="range" id="d2" min="40" max="320" step="5" value="160"><span class="hodnota" id="d2V">160 mm</span></label>
  <label>🧱 <select id="predmet">
      <option value="lozisko">Nalisovat ložisko (3 kN)</option>
      <option value="plech" selected>Ohnout plech (12 kN)</option>
      <option value="trubka">Narovnat hřídel (30 kN)</option>
      <option value="klec">Slisovat plechovku (0,6 kN)</option>
    </select></label>
  <button id="btnPumpuj">▶️ Pumpovat</button>
  <button id="btnZpet">🔄 Povolit tlak</button>
  <button id="btnUkolL">🎯 Úkol</button>
</div>

<!-- ============ společné přepínače zobrazení ============ -->
<div class="panel">
  <label><input type="checkbox" id="zobSily" checked> 🧭 Síly</label>
  <label><input type="checkbox" id="zobMoment" checked> 🌀 Moment / tlak</label>
  <label><input type="checkbox" id="zobPrace"> ⚡ Práce a dráhy</label>
  <label><input type="checkbox" id="zobCisla" checked> 🔢 Čísla u šipek</label>
  <label>🐢 Zpomalení <input type="range" id="zpomal" min="1" max="10" step="1" value="1"><span class="hodnota" id="zpomalV">1×</span></label>
</div>

<div class="plocha">
  <canvas id="c"></canvas>
  <div class="ukol skryto" id="ukolBox"><div id="ukolText"></div><div class="vysledek" id="ukolVysledek"></div></div>
  <div class="info skryto" id="infoBox"><button class="zavri" id="infoZavri">✕</button><div id="infoText"></div></div>
  <div class="napoveda" id="napoveda"></div>
</div>

<div class="stav" id="stavRadek"></div>

<script>
'use strict';
/* =======================================================================
   Vrtačka a lis — dvě scény na jednom plátně.

   Obě počítají ze skutečných strojnických vztahů, ne od oka:
   vrtačka z měrné řezné síly materiálu (kc), lis z Pascalova zákona.
   Kresba je ve virtuálních souřadnicích 1000 × 700 a do plochy se
   jen zvětší — díky tomu drží scéna proporce na plátně i na mobilu.
   ======================================================================= */
const $ = id => document.getElementById(id);
const plat = $('c'), ctx = plat.getContext('2d');
const VW = 1000, VH = 700;              // virtuální plátno
let W = 0, H = 0, M = 1, OX = 0, OY = 0; // měřítko a posun do středu

/* --- materiály: kc = měrná řezná síla (N/mm²), vc = doporučená řezná rychlost --- */
const MATERIALY = {
  drevo:  { nazev: 'dřevo',  kc: 40,   vcMin: 60, vcMax: 250, barva: '#8a5a2b', triska: '#d7a55a' },
  plast:  { nazev: 'plast',  kc: 110,  vcMin: 40, vcMax: 140, barva: '#3f6d7a', triska: '#8fd0e0' },
  hlinik: { nazev: 'hliník', kc: 700,  vcMin: 60, vcMax: 180, barva: '#8b9199', triska: '#d8dde3' },
  ocel:   { nazev: 'ocel',   kc: 2000, vcMin: 15, vcMax: 35,  barva: '#5c6068', triska: '#9aa3ad' },
  nerez:  { nazev: 'nerez',  kc: 2600, vcMin: 8,  vcMax: 18,  barva: '#6b7078', triska: '#b9c2cc' },
};

/* --- co se dá lisovat: F = síla potřebná k práci, drah = dráha deformace (mm) --- */
const PREDMETY = {
  lozisko: { nazev: 'nalisovat ložisko', F: 3000,  drah: 6,  popis: 'ložisko na hřídel' },
  plech:   { nazev: 'ohnout plech',      F: 12000, drah: 8,  popis: 'plech 3 mm' },
  trubka:  { nazev: 'narovnat hřídel',   F: 30000, drah: 3,  popis: 'ohnutá hřídel' },
  klec:    { nazev: 'slisovat plechovku', F: 600,  drah: 14, popis: 'plechovka' },
};

const stav = {
  rezim: 'vrtacka',
  /* vrtačka */
  faze: 0, hloubka: 0, vrta: false, prehrati: 0, trisky: [], casVrtani: 0, praceVrtani: 0,
  /* lis */
  pumpuje: false, fazePumpy: 0, zdvihPistu: 0, stlaceni: 0, zdvihu: 0, pracePumpy: 0, prasklo: false,
  /* úkol */
  ukol: null,
};

/* ---------------------------------------------------------------- pomůcky */
const P = {};                       // paleta z motivu, obnovuje se každý snímek
function paleta() {
  const s = getComputedStyle(document.documentElement);
  for (const k of ['text', 'text-muted', 'text-faint', 'border', 'border-strong', 'accent', 'ok', 'warn', 'danger',
                   'bg-deep', 'bg-panel', 'bg-elevated', 'bg-control', 'bg-input'])
    P[k] = s.getPropertyValue('--' + k).trim();
}
const cislo = (x, d = 0) => x.toLocaleString('cs', { minimumFractionDigits: d, maximumFractionDigits: d });
function sila(n) {                  // N nebo kN podle velikosti
  return n >= 1000 ? cislo(n / 1000, 1) + ' kN' : cislo(n, 0) + ' N';
}

function velikost() {
  const r = plat.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  plat.width = Math.round(W * dpr); plat.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  M = Math.min(W / VW, H / VH);
  OX = (W - VW * M) / 2; OY = (H - VH * M) / 2;
}

/* šipka síly: od (x,y) ve směru (dx,dy), délka v obrazových bodech */
function sipka(x, y, dx, dy, delka, barva, popis, tloustka = 3.5) {
  const l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const x2 = x + ux * delka, y2 = y + uy * delka;
  ctx.strokeStyle = barva; ctx.fillStyle = barva; ctx.lineWidth = tloustka; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2 - ux * 9, y2 - uy * 9); ctx.stroke();
  ctx.beginPath();                                   // hrot
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ux * 14 - uy * 6, y2 - uy * 14 + ux * 6);
  ctx.lineTo(x2 - ux * 14 + uy * 6, y2 - uy * 14 - ux * 6);
  ctx.closePath(); ctx.fill();
  if (popis && $('zobCisla').checked) stitek(x2 + ux * 8, y2 + uy * 8, popis, barva);
}

/* šipka momentu / otáčení: oblouk se šipkou na konci */
function oblouk(x, y, r, od, do_, barva, popis) {
  ctx.strokeStyle = barva; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, r, od, do_); ctx.stroke();
  const ax = x + Math.cos(do_) * r, ay = y + Math.sin(do_) * r;
  const tx = -Math.sin(do_), ty = Math.cos(do_);
  ctx.fillStyle = barva; ctx.beginPath();
  ctx.moveTo(ax + tx * 12, ay + ty * 12);
  ctx.lineTo(ax - tx * 3 + Math.cos(do_) * 7, ay - ty * 3 + Math.sin(do_) * 7);
  ctx.lineTo(ax - tx * 3 - Math.cos(do_) * 7, ay - ty * 3 - Math.sin(do_) * 7);
  ctx.closePath(); ctx.fill();
  if (popis && $('zobCisla').checked) stitek(x, y - r - 12, popis, barva, 'center');
}

/* popiska s podkladem, aby se neztratila v kresbě */
function stitek(x, y, text, barva, zarovnani = 'left') {
  ctx.font = '600 13px ' + getComputedStyle(document.body).fontFamily;
  const w = ctx.measureText(text).width + 10;
  const lx = zarovnani === 'center' ? x - w / 2 : zarovnani === 'right' ? x - w : x;
  ctx.fillStyle = P['bg-elevated']; ctx.globalAlpha = .85;
  ctx.beginPath(); ctx.roundRect(lx, y - 10, w, 20, 5); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = barva; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(lx, y - 10, w, 20, 5); ctx.stroke();
  ctx.fillStyle = barva; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, lx + 5, y + 1);
}

function popisek(x, y, text, barva, velikost = 13, zarovnani = 'left') {
  ctx.font = velikost + 'px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillStyle = barva; ctx.textAlign = zarovnani; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function obdelnik(x, y, w, h, vypln, obrys, r = 0) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (vypln) { ctx.fillStyle = vypln; ctx.fill(); }
  if (obrys) { ctx.strokeStyle = obrys; ctx.lineWidth = 1.5; ctx.stroke(); }
}

/* =====================================================================
   VRTAČKA
   vc = π·d·n/1000            řezná rychlost (m/min)
   Mk = kc·f·d²/8000          krouticí moment na vrtáku (N·m)
   Ff = 0,25·kc·f·d           přítlačná (posuvová) síla (N)
   P  = Mk·ω                  řezný výkon (W)
   ===================================================================== */
function vypocetVrtacky() {
  const m = MATERIALY[$('material').value];
  const d = +$('prumer').value, n = +$('otacky').value, f = +$('posuv').value, t = +$('tloustka').value;
  const vc = Math.PI * d * n / 1000;
  const Mk = m.kc * f * d * d / 8000;
  const Ff = 0.25 * m.kc * f * d;
  const om = 2 * Math.PI * n / 60;
  const vykon = Mk * om;
  const vf = f * n;                       // rychlost posuvu mm/min
  const cas = vf > 0 ? t / vf * 60 : 0;   // čas provrtání (s)
  const prace = vykon * cas + Ff * t / 1000;
  const nDop = m.vcMax * 0.75 * 1000 / (Math.PI * d);   // doporučené otáčky
  return { m, d, n, f, t, vc, Mk, Ff, vykon, vf, cas, prace, nDop, prehrati: vc / m.vcMax };
}

/* Stroje mají vlastní kovové barvy nezávislé na motivu — v světlém režimu by
   se rám z --bg-panel slil s podkladem a lis by zmizel. Text a šipky si barvu
   z motivu berou dál. */
const KOV = { ram: '#3f454c', telo: '#596069', pist: '#98a0a9', linka: '#2b2f34' };

const MMPX = 4;                              // 1 mm = 4 body virtuálního plátna
const OSA = 440, STUL = 520;                 // osa vrtání a horní hrana stolu

function kresliVrtacku(dt) {
  const v = vypocetVrtacky();
  const dpx = v.d * MMPX, tpx = v.t * MMPX;
  const hornihrana = STUL - tpx;             // horní plocha obrobku
  const spicka = hornihrana + stav.hloubka * MMPX;

  /* --- stroj: podstavec, sloup, hlava --- */
  obdelnik(300, 650, 420, 30, KOV.telo, KOV.linka, 4);
  obdelnik(660, 150, 40, 500, KOV.telo, KOV.linka, 3);
  obdelnik(330, 140, 350, 100, KOV.ram, KOV.linka, 8);
  obdelnik(350, 96, 150, 46, KOV.telo, KOV.linka, 6);
  popisek(425, 119, '⚡ motor', P['text-faint'], 13, 'center');
  popisek(505, 190, 'převodovka / řemenice', P['text-faint'], 12);
  obdelnik(330, STUL, 300, 22, KOV.telo, KOV.linka, 3);
  obdelnik(600, STUL, 80, 22, KOV.telo, KOV.linka, 3);
  popisek(336, STUL + 56, 'stůl vrtačky', P['text-faint'], 12);

  /* --- vřeteno a sklíčidlo --- */
  obdelnik(OSA - 14, 240, 28, 30, KOV.pist, KOV.linka, 3);
  ctx.beginPath();
  ctx.moveTo(OSA - 26, 270); ctx.lineTo(OSA + 26, 270);
  ctx.lineTo(OSA + 18, 320); ctx.lineTo(OSA - 18, 320); ctx.closePath();
  ctx.fillStyle = KOV.pist; ctx.fill();
  ctx.strokeStyle = KOV.linka; ctx.lineWidth = 1.5; ctx.stroke();
  popisek(OSA + 34, 296, 'sklíčidlo', P['text-faint'], 12);

  /* --- obrobek, díra a svěrka --- */
  obdelnik(330, hornihrana, 300, tpx, v.m.barva, P['border-strong'], 2);
  if (stav.hloubka > 0) {
    const h = Math.min(stav.hloubka, v.t) * MMPX;
    obdelnik(OSA - dpx / 2, hornihrana, dpx, h, '#141618', null, 0);
  }
  popisek(346, hornihrana + tpx - 16, v.m.nazev + ' • ' + v.t + ' mm', 'rgba(255,255,255,.85)', 13);
  obdelnik(336, hornihrana - 10, 26, 14, KOV.pist, KOV.linka, 3);
  obdelnik(598, hornihrana - 10, 26, 14, KOV.pist, KOV.linka, 3);

  /* --- vrták: tělo, šroubovité drážky, špička 118° --- */
  const telo = Math.max(60, spicka - 320);
  const hrot = dpx * 0.3;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(OSA - dpx / 2, 320);
  ctx.lineTo(OSA + dpx / 2, 320);
  ctx.lineTo(OSA + dpx / 2, 320 + telo - hrot);
  ctx.lineTo(OSA, 320 + telo);
  ctx.lineTo(OSA - dpx / 2, 320 + telo - hrot);
  ctx.closePath();
  ctx.fillStyle = '#8d949c'; ctx.fill();
  ctx.strokeStyle = '#5e646b'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = Math.max(2, dpx * .18);
  const krok = Math.max(14, dpx * 1.6);
  for (let y = 320 - krok * 2; y < 320 + telo + krok; y += krok) {
    const p = y + (stav.faze / (2 * Math.PI)) % 1 * krok;
    ctx.beginPath(); ctx.moveTo(OSA - dpx, p); ctx.lineTo(OSA + dpx, p + krok * .8); ctx.stroke();
  }
  ctx.restore();

  /* --- třísky --- */
  for (const t of stav.trisky) {
    ctx.globalAlpha = Math.max(0, t.zivot);
    ctx.fillStyle = t.zhaveni > 0.9 ? '#ff9a3c' : v.m.triska;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* --- přehřátí: špička rudne, nad dírou se kouří --- */
  if (v.prehrati > 0.85 && stav.vrta) {
    const z = Math.min(1, (v.prehrati - 0.85) / 0.6);
    const g = ctx.createRadialGradient(OSA, spicka, 2, OSA, spicka, 26 + dpx);
    g.addColorStop(0, 'rgba(255,120,40,' + (0.25 + 0.6 * z) + ')');
    g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(OSA, spicka, 26 + dpx, 0, 7); ctx.fill();
  }

  /* ================= síly ================= */
  const cisla = $('zobCisla').checked;
  if ($('zobSily').checked) {
    /* přítlačná síla — čím větší, tím delší šipka (odmocninová škála, ať se vejde) */
    const dl = 30 + 60 * Math.min(1, Math.sqrt(v.Ff / 1500));
    sipka(OSA + 120, hornihrana - 40 - dl, 0, 1, dl, P['accent'], 'F posuvu ' + sila(v.Ff));
    /* reakce obrobku proti vrtáku */
    sipka(OSA - 130, hornihrana - 30, 0, -1, dl, P['ok'], 'reakce ' + sila(v.Ff));
    popisek(OSA - 130, hornihrana - 12, 'obrobek tlačí zpět', P['text-faint'], 12, 'center');
    /* řezné síly na dvou břitech – kolmo k nákresně (⊙ ven, ⊗ dovnitř) */
    const Fc = v.Mk * 2 / (v.d / 1000 / 2) / 2;      // síla na jeden břit
    const yb = Math.min(spicka, STUL) - 4;
    for (const s of [-1, 1]) {
      const x = OSA + s * dpx / 2, ven = s < 0;
      ctx.strokeStyle = P['danger']; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, yb, 9, 0, 7); ctx.stroke();
      ctx.beginPath();
      if (ven) { ctx.arc(x, yb, 3, 0, 7); ctx.fillStyle = P['danger']; ctx.fill(); }
      else { ctx.moveTo(x - 6, yb - 6); ctx.lineTo(x + 6, yb + 6); ctx.moveTo(x + 6, yb - 6); ctx.lineTo(x - 6, yb + 6); ctx.stroke(); }
    }
    if (cisla) stitek(OSA + dpx / 2 + 16, yb + 26, 'řezná síla na břitu ' + sila(Fc), P['danger']);
  }

  /* ================= moment ================= */
  if ($('zobMoment').checked) {
    oblouk(OSA, 300, 46 + dpx / 2, -Math.PI * 0.95, Math.PI * 0.15 + (stav.vrta ? 0.25 : 0), P['warn'],
      'Mk = ' + cislo(v.Mk, 2) + ' N·m');
    /* stejně velký moment působí zpět na obrobek */
    oblouk(OSA, hornihrana + tpx / 2, 96, Math.PI * 0.18, Math.PI * 1.02, P['warn'], null);
    popisek(OSA + 130, 618, 'stejný moment strhává obrobek → upnout!', P['warn'], 12, 'center');
  }

  /* ================= práce a dráhy ================= */
  if ($('zobPrace').checked) {
    const y0 = 300, x0 = 760;
    popisek(x0, y0, '⚡ Práce a dráhy', P['text'], 14);
    popisek(x0, y0 + 24, 'posuv vf = ' + cislo(v.vf, 0) + ' mm/min', P['text-muted'], 13);
    popisek(x0, y0 + 44, 'čas provrtání ' + cislo(v.cas, 1) + ' s', P['text-muted'], 13);
    popisek(x0, y0 + 64, 'řezný výkon ' + cislo(v.vykon, 0) + ' W', P['text-muted'], 13);
    popisek(x0, y0 + 84, 'práce W = ' + cislo(v.prace, 0) + ' J', P['text-muted'], 13);
    popisek(x0, y0 + 112, 'odvrtáno ' + cislo(stav.hloubka, 1) + ' / ' + v.t + ' mm', P['accent'], 13);
    obdelnik(x0, y0 + 124, 190, 10, P['bg-panel'], P['border'], 5);
    obdelnik(x0, y0 + 124, 190 * Math.min(1, stav.hloubka / v.t), 10, P['accent'], null, 5);
    /* dráha posuvu na obrobku */
    ctx.strokeStyle = P['accent']; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(OSA + dpx / 2 + 12, hornihrana); ctx.lineTo(OSA + dpx / 2 + 12, spicka); ctx.stroke();
    ctx.setLineDash([]);
  }
  return v;
}

/* pohyb vrtačky v čase */
function krokVrtacky(dt) {
  const v = vypocetVrtacky();
  stav.faze += 2 * Math.PI * v.n / 60 * dt;
  if (stav.vrta) {
    stav.casVrtani += dt;
    stav.hloubka = Math.min(v.t, stav.hloubka + v.vf / 60 * dt);
    if (stav.hloubka >= v.t) stav.vrta = false;
    /* třísky vylétají z díry, dokud se vrtá */
    if (Math.random() < Math.min(0.9, 0.25 + v.vf / 200)) {
      const s = Math.random() < 0.5 ? -1 : 1;
      stav.trisky.push({
        x: OSA + s * v.d * MMPX / 2, y: STUL - v.t * MMPX,
        vx: s * (40 + Math.random() * 90), vy: -(60 + Math.random() * 90),
        r: 1.5 + Math.random() * 2.5, zivot: 1, zhaveni: v.prehrati,
      });
    }
  }
  for (const t of stav.trisky) {
    t.x += t.vx * dt; t.y += t.vy * dt; t.vy += 420 * dt; t.zivot -= dt * 0.8;
  }
  stav.trisky = stav.trisky.filter(t => t.zivot > 0 && t.y < VH);
}

/* =====================================================================
   HYDRAULICKÝ LIS
   F1 = Fruka · i             páka násobí sílu ruky
   p  = F1 / S1               Pascalův zákon – tlak je všude stejný
   F2 = p · S2                velký píst dá tolikrát větší sílu, kolikrát má větší plochu
   h2 = h1 · S1 / S2          …a zato se posune tolikrát méně (zlaté pravidlo mechaniky)
   ===================================================================== */
const MEZERA = 6;        // mm volného zdvihu, než se velký píst opře o předmět
const ZDVIH1 = 40;       // mm zdvih malého pístu na jedno stlačení páky
const PMM = 3;           // body na mm zdvihu (kresba)
/* geometrie kresby drží pohromadě: mezera nad předmětem je přesně MEZERA·PMM bodů */
const TRAM = 184, RAM = 120, DESKA_H = 20, KUS_H = 70, CX2 = 420, CX1 = 800;
const PIST0 = TRAM + MEZERA * PMM + KUS_H + DESKA_H + RAM;

function vypocetLisu() {
  const Fr = +$('sila').value, i = +$('paka').value;
  const d1 = +$('d1').value, d2 = +$('d2').value;
  const pr = PREDMETY[$('predmet').value] || PREDMETY.plech;
  const F1 = Fr * i;
  const S1 = Math.PI * d1 * d1 / 4, S2 = Math.PI * d2 * d2 / 4;   // mm²
  const p = F1 / S1;                       // N/mm² = MPa
  const F2 = p * S2;
  const pomer = S2 / S1;
  const h2 = ZDVIH1 / pomer;
  const W1 = F1 * ZDVIH1 / 1000;           // J na jedno stlačení páky
  const W2 = F2 * h2 / 1000;               // stejná práce – jen jinak rozdělená
  const potreba = Math.ceil((MEZERA + pr.drah) / h2);   // kolik stlačení páky práce zabere
  return { Fr, i, d1, d2, S1, S2, p, F1, F2, pomer, h2, W1, W2, pr, potreba, staci: F2 >= pr.F, pretlak: p > 70 };
}

  /* --- lisovaný předmět --- */

  /* páka: otočný čep vpravo, ruka na konci vlevo */

  ctx.strokeStyle = P['border-strong']; ctx.lineWidth = 10; ctx.lineCap = 'round';

  ctx.fillStyle = P['text-faint']; ctx.beginPath(); ctx.arc(cepX, cepY, 7, 0, 7); ctx.fill();
  popisek(cepX + 12, cepY, 'čep', P['text-faint'], 12);

  /* ================= síly ================= */

    popisek(CX1 + 96, 268, 'páka ' + cislo(v.i, 1) + '× ', P['text-muted'], 13);
    const dl2 = 40 + 70 * Math.min(1, Math.sqrt(v.F2 / 60000));

  }

  /* ================= tlak v kapalině (Pascal) ================= */
  if ($('zobMoment').checked) {

  }

  /* ================= práce a dráhy ================= */
  if ($('zobPrace').checked) {
    const x0 = 60, y0 = 210;
    popisek(x0, y0, '⚡ Zlaté pravidlo mechaniky', P['text'], 14);
    popisek(x0, y0 + 24, 'malý píst: ' + sila(v.F1) + ' × ' + cislo(ZDVIH1, 0) + ' mm', P['accent'], 13);
    popisek(x0, y0 + 44, 'velký píst: ' + sila(v.F2) + ' × ' + cislo(v.h2, 2) + ' mm', P['ok'], 13);
    popisek(x0, y0 + 68, 'práce W = ' + cislo(v.W1, 1) + ' J = ' + cislo(v.W2, 1) + ' J', P['text-muted'], 13);
    popisek(x0, y0 + 88, 'co se získá na síle,', P['text-faint'], 12);
    popisek(x0, y0 + 104, 'to se ztratí na dráze', P['text-faint'], 12);
    obdelnik(x0, y0 + 122, 24, 70, P['accent'], null, 3);        // úzký vysoký = malá síla, velká dráha
    obdelnik(x0 + 44, y0 + 168, 96, 24, P['ok'], null, 3);       // široký nízký = velká síla, malá dráha
    popisek(x0, y0 + 208, 'zdvihů pákou: ' + stav.zdvihu + ' z ' + v.potreba, P['text-muted'], 13);
    popisek(x0, y0 + 228, 'vykonaná práce ' + cislo(stav.pracePumpy, 0) + ' J', P['text-muted'], 13);
  }
  return v;
}

function krokLisu(dt) {
  const v = vypocetLisu();
  if (!stav.pumpuje) return;
  /* Jediná úleva oku v celé scéně: čím víc zdvihů práce potřebuje, tím rychleji
     se pumpuje, aby lisování netrvalo minuty. Počet zdvihů i dráhy zůstávají
     skutečné — zrychluje se jen kreslení ruky na páce. */
  const doba = Math.max(0.04, Math.min(0.35, 8 / v.potreba));
  stav.fazePumpy += dt / doba;
  while (stav.fazePumpy >= 1) {
    stav.fazePumpy -= 1;
    stav.zdvihu++;
    stav.pracePumpy += v.W1;
    if (stav.zdvihPistu < MEZERA) {                       // volný zdvih, kapalina jen doplňuje válec
      stav.zdvihPistu = Math.min(MEZERA, stav.zdvihPistu + v.h2);
    } else if (v.staci && stav.stlaceni < v.pr.drah) {    // lisuje se
      stav.stlaceni = Math.min(v.pr.drah, stav.stlaceni + v.h2);
      stav.zdvihPistu = MEZERA + stav.stlaceni;
    } else {                                              // síla nestačí nebo je hotovo
      stav.pumpuje = false; stav.fazePumpy = 0;
      $('btnPumpuj').classList.remove('zap');
      break;
    }
  }
}

/* ==================================================================
   Stavový řádek, hlášky a úkoly
   ================================================================== */
function stavRadek() {
  const r = $('stavRadek');
  if (stav.rezim === 'vrtacka') {
    const v = vypocetVrtacky();
    let t = 'ok', z = '✅ řezné podmínky sedí';
    if (v.vc > v.m.vcMax) { t = 'zle'; z = '🔥 příliš vysoká řezná rychlost – vrták se přepálí (max ' + cislo(v.m.vcMax, 0) + ' m/min)'; }
    else if (v.vc < v.m.vcMin) { t = 'varuj'; z = '🐌 málo otáček – vrták hladí a tupí se (min ' + cislo(v.m.vcMin, 0) + ' m/min)'; }
    else if (v.Ff > 900) { t = 'varuj'; z = '💪 přítlak ' + sila(v.Ff) + ' – rukou už nedotlačíš, uber posuv'; }
    else if (v.Mk > 6) { t = 'varuj'; z = '🌀 velký moment – obrobek musí být pevně upnutý'; }
    r.innerHTML =
      '<span>řezná rychlost <b>' + cislo(v.vc, 1) + ' m/min</b></span>' +
      '<span>moment <b>' + cislo(v.Mk, 2) + ' N·m</b></span>' +
      '<span>přítlak <b>' + sila(v.Ff) + '</b></span>' +
      '<span>výkon <b>' + cislo(v.vykon, 0) + ' W</b></span>' +
      '<span>posuv <b>' + cislo(v.vf, 0) + ' mm/min</b></span>' +
      '<span>provrtání <b>' + cislo(v.cas, 1) + ' s</b></span>' +
      '<span class="vzkaz ' + t + '">' + z + '</span>';
  } else {
    const v = vypocetLisu();
    let t = 'ok', z = '✅ síla stačí – ' + v.pr.nazev + ' zvládneš';
    if (v.pretlak) { t = 'zle'; z = '💥 tlak ' + cislo(v.p, 0) + ' MPa – přes 70 MPa pustí pojistný ventil'; }
    else if (!v.staci) { t = 'varuj'; z = '🚫 síla nestačí (' + sila(v.F2) + ' z ' + sila(v.pr.F) + ') – přidej páku nebo větší píst'; }
    else if (stav.stlaceni >= v.pr.drah) { t = 'ok'; z = '🏁 hotovo za ' + stav.zdvihu + ' zdvihů'; }
    r.innerHTML =
      '<span>síla na malý píst <b>' + sila(v.F1) + '</b></span>' +
      '<span>tlak <b>' + cislo(v.p, 1) + ' MPa</b></span>' +
      '<span>síla velkého pístu <b>' + sila(v.F2) + '</b></span>' +
      '<span>zvětšení <b>' + cislo(v.pomer, 1) + '×</b></span>' +
      '<span>zdvih velkého pístu <b>' + cislo(v.h2, 2) + ' mm</b></span>' +
      '<span>zdvihů <b>' + stav.zdvihu + ' / ' + v.potreba + '</b></span>' +
      '<span class="vzkaz ' + t + '">' + z + '</span>';
  }
}

    '<li>Stejný moment, jakým motor točí vrtákem, se snaží <b>roztočit obrobek</b> — proto se upíná.</li></ul>' +
    'Mezerník = vrtat, R = nový kus.',
  lis: '<b>🗜️ Hydraulický lis</b><br>Malý píst tlačí do kapaliny, kapalina tlačí na velký píst.' +
    '<ul><li><b>Pascalův zákon:</b> tlak p = F₁/S₁ je v celé kapalině stejný a působí kolmo na stěny.</li>' +
    '<li>Na velkém pístu z něj vyjde F₂ = p·S₂ — síla se zvětší tolikrát, kolikrát je větší plocha.</li>' +
    '<li><b>Zlaté pravidlo mechaniky:</b> velký píst se posune tolikrát méně. Práce zůstává stejná: F₁·h₁ = F₂·h₂.</li>' +
    '<li>Páka na malém pístu násobí sílu ruky ještě před kapalinou.</li></ul>' +
    'Mezerník = pumpovat, R = povolit tlak.',
};

/* ==================================================================
   Přepínání, ovládání, hlavní smyčka
   ================================================================== */
function prepni(rezim) {
  stav.rezim = rezim;
  const v = rezim === 'vrtacka';
  $('tabVrtacka').classList.toggle('zap', v);
  $('tabLis').classList.toggle('zap', !v);
  $('panelVrtacka').classList.toggle('skryto', !v);
  $('panelLis').classList.toggle('skryto', v);
  $('infoText').innerHTML = NAPOVEDA[v ? 'vrtacka' : 'lis'];
  $('napoveda').textContent = v ? 'mezerník = vrtat · R = nový kus · H = nápověda'
                                : 'mezerník = pumpovat · R = povolit tlak · H = nápověda';
  $('ukolBox').classList.add('skryto'); stav.ukol = null;
  osvez();
}

function osvez() {
  $('prumerV').textContent = cislo(+$('prumer').value, 1) + ' mm';
  $('otackyV').textContent = cislo(+$('otacky').value, 0) + ' min⁻¹';
  $('posuvV').textContent = cislo(+$('posuv').value, 2) + ' mm/ot';
  $('tloustkaV').textContent = $('tloustka').value + ' mm';
  $('silaV').textContent = $('sila').value + ' N';
  $('pakaV').textContent = cislo(+$('paka').value, 1) + ' : 1';
  $('d1V').textContent = $('d1').value + ' mm';
  $('d2V').textContent = $('d2').value + ' mm';
  $('zpomalV').textContent = $('zpomal').value + '×';
  stavRadek(); ukolKontrola();
}

function novyKus() {
  stav.hloubka = 0; stav.vrta = false; stav.trisky = []; stav.casVrtani = 0;
  $('btnVrtej').classList.remove('zap');
  osvez();
}
function povolTlak() {
  stav.zdvihPistu = 0; stav.stlaceni = 0; stav.zdvihu = 0; stav.pracePumpy = 0;
  stav.pumpuje = false; stav.fazePumpy = 0;
  $('btnPumpuj').classList.remove('zap');
  osvez();
}

$('tabVrtacka').onclick = () => prepni('vrtacka');
$('tabLis').onclick = () => prepni('lis');
$('btnInfo').onclick = () => $('infoBox').classList.toggle('skryto');
$('infoZavri').onclick = () => $('infoBox').classList.add('skryto');
$('btnVrtej').onclick = () => {
  const v = vypocetVrtacky();
  if (stav.hloubka >= v.t) novyKus();
  stav.vrta = !stav.vrta;
  $('btnVrtej').classList.toggle('zap', stav.vrta);
};
$('btnZnovu').onclick = novyKus;
$('btnDoporuc').onclick = () => {
  const v = vypocetVrtacky();
  $('otacky').value = Math.max(100, Math.min(3000, Math.round(v.nDop / 25) * 25));
  osvez();
};
$('btnUkolV').onclick = novyUkol;
$('btnUkolL').onclick = novyUkol;
$('btnPumpuj').onclick = () => {
  const v = vypocetLisu();
  if (stav.stlaceni >= v.pr.drah) povolTlak();
  stav.pumpuje = !stav.pumpuje;
  $('btnPumpuj').classList.toggle('zap', stav.pumpuje);
};
$('btnZpet').onclick = povolTlak;
$('predmet').onchange = povolTlak;

for (const el of document.querySelectorAll('input, select')) {
  el.addEventListener('input', osvez);
  el.addEventListener('change', osvez);
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); (stav.rezim === 'vrtacka' ? $('btnVrtej') : $('btnPumpuj')).click(); }
  else if (k === 'r') (stav.rezim === 'vrtacka' ? $('btnZnovu') : $('btnZpet')).click();
  else if (k === 'h') $('btnInfo').click();
});

addEventListener('resize', velikost);

let posledni = 0;
function snimek(t) {
  const dt = Math.min(0.05, (t - posledni) / 1000 || 0) / +$('zpomal').value;
  posledni = t;
  paleta();
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(OX, OY); ctx.scale(M, M);
  if (stav.rezim === 'vrtacka') { krokVrtacky(dt); kresliVrtacku(dt); }
  else { krokLisu(dt); kresliLis(); }
  ctx.restore();
  stavRadek(); ukolKontrola();
  requestAnimationFrame(snimek);
}

velikost();
prepni('vrtacka');
requestAnimationFrame(snimek);

/* pro testy v _test/ */
window.VL = { stav, vypocetVrtacky, vypocetLisu, MATERIALY, PREDMETY, prepni, novyKus, povolTlak };
</script>
</body>
</html>
