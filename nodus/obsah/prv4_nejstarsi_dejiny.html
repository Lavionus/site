<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nejstarší české dějiny</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .udalost { max-width: 560px; font-size: 1.05rem; line-height: 1.5; }
    .letopocet { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 700; color: var(--accent); }
    .osoba { font-size: 1.35rem; font-weight: 700; }
    .osa { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; min-height: 46px; }
    .osa .bod {
      background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 8px;
      padding: 7px 11px; font-size: 0.86rem; font-weight: 600;
    }
    .osa .sipka { color: var(--text-faint); }
  </style>
</head>
<body>
  <h1>🏰 Nejstarší české dějiny</h1>
  <p class="podtitul">Pro 4.–5. ročník: od příchodu Slovanů po Karla IV.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="kdoTo" class="active">👑 Kdo to byl?</button>
    <button data-rezim="letopocty">📅 Kdy to bylo?</button>
    <button data-rezim="poradi">↕️ Seřaď události</button>
    <button data-rezim="povesti">📖 Staré pověsti</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Přehled: Sámova říše (7. století) → Velká Morava (9. století) → Přemyslovci →
    Lucemburkové a Karel IV. (14. století). Letopočty si spoj s tím, co se tehdy stalo.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_prv4_dejiny', $('skore'));
let rezim = 'kdoTo';

const OSOBY = [
  { n: 'Sámo', e: '⚔️', cin: 'sjednotil slovanské kmeny proti Avarům a stal se jejich vůdcem' },
  { n: 'Konstantin a Metoděj', e: '📜', cin: 'přinesli na Velkou Moravu písmo hlaholici a bohoslužbu ve slovanském jazyce' },
  { n: 'svatý Václav', e: '👑', cin: 'přemyslovský kníže, patron české země, zavražděn bratrem Boleslavem' },
  { n: 'Přemysl Otakar II.', e: '🛡️', cin: 'král železný a zlatý, rozšířil české království až k moři' },
  { n: 'Karel IV.', e: '🏰', cin: 'český král a císař, založil univerzitu, Karlův most a Nové Město pražské' },
  { n: 'svatá Anežka Česká', e: '🕊️', cin: 'přemyslovská princezna, která pomáhala nemocným a chudým' },
  { n: 'Boleslav I.', e: '⚔️', cin: 'kníže, který upevnil přemyslovský stát a zavedl daně' },
];

const UDALOSTI = [
  { rok: '7. století', t: 'vznik Sámovy říše', poradi: 1 },
  { rok: '9. století', t: 'Velká Morava a příchod Konstantina a Metoděje', poradi: 2 },
  { rok: '935', t: 'zavraždění svatého Václava', poradi: 3 },
  { rok: '1212', t: 'Zlatá bula sicilská potvrdila dědičný královský titul', poradi: 4 },
  { rok: '1348', t: 'Karel IV. založil pražskou univerzitu', poradi: 5 },
  { rok: '1357', t: 'začala stavba Karlova mostu', poradi: 6 },
];

const POVESTI = [
  { n: 'praotec Čech', e: '⛰️', t: 'přivedl svůj lid na horu Říp a řekl, že tady bude jejich nová země' },
  { n: 'kněžna Libuše', e: '🔮', t: 'věštila slávu Prahy a vybrala si za muže oráče Přemysla' },
  { n: 'Přemysl Oráč', e: '🐂', t: 'oral pole, když pro něj přišli poslové, aby se stal knížetem' },
  { n: 'dívka Vlasta', e: '🏹', t: 'vedla dívčí vojsko v dívčí válce proti mužům' },
  { n: 'Bivoj', e: '🐗', t: 'ulovil divokého kance a přinesl ho na ramenou na Vyšehrad' },
  { n: 'Horymír', e: '🐎', t: 'se svým koněm Šemíkem skočil z vyšehradské skály' },
];

/* ---- Kdo to byl? -------------------------------------------------------------- */
function kdoTo() {
  const p = $('plocha');
  const o = Uloha.nahodne(OSOBY);
  const jine = Uloha.zamichej(OSOBY.filter(x => x.n !== o.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O koho jde?</div>
    <div class="karta"><div class="obrazek">${o.e}</div><div class="udalost">${o.cin}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([o, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: o.n,
    zpravaOk: `✅ ${o.n} – ${o.cin}.`,
    zpravaChyba: 'To byl někdo jiný – zkus to znovu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Kdy to bylo? ------------------------------------------------------------- */
function letopocty() {
  const p = $('plocha');
  const u = Uloha.nahodne(UDALOSTI);
  const jine = Uloha.zamichej(UDALOSTI.filter(x => x.rok !== u.rok)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Kdy se to stalo?</div>
    <div class="karta"><div class="obrazek">📜</div><div class="udalost">${u.t}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.rok, popis: x.rok })),
    spravnyKlic: u.rok,
    zpravaOk: `✅ ${u.rok} – ${u.t}.`,
    zpravaChyba: 'To je letopočet jiné události.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Seřaď události ----------------------------------------------------------- */
function poradi() {
  const p = $('plocha');
  const vyber = Uloha.zamichej(UDALOSTI).slice(0, 4).sort((a, b) => a.poradi - b.poradi);
  p.innerHTML = '<div class="zadani">Seřaď události od nejstarší po nejnovější.</div>';
  const osa = document.createElement('div');
  osa.className = 'osa';
  const nabidka = document.createElement('div');
  nabidka.className = 'nabidka';
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  let dalsiIndex = 0, chyboval = false;

  Uloha.zamichej(vyber).forEach(u => {
    const b = document.createElement('button');
    b.textContent = u.t;
    b.dataset.t = u.t;
    b.addEventListener('click', () => {
      if (b.disabled) return;
      if (u.t === vyber[dalsiIndex].t) {
        if (dalsiIndex > 0) {
          const s = document.createElement('span');
          s.className = 'sipka';
          s.textContent = '→';
          osa.appendChild(s);
        }
        const el = document.createElement('span');
        el.className = 'bod';
        el.textContent = `${u.rok}: ${u.t}`;
        osa.appendChild(el);
        b.disabled = true;
        dalsiIndex++;
        odezva.className = 'odezva ok';
        odezva.textContent = '✅ Správně!';
        if (dalsiIndex === vyber.length) {
          odezva.textContent = '🎉 Časová osa je hotová!';
          skore.vyhodnot(!chyboval);
          setTimeout(novaUloha, Uloha.PRODLEVA + 600);
        }
      } else {
        chyboval = true;
        Uloha.trhni(b);
        odezva.className = 'odezva chyba';
        odezva.textContent = 'Tahle událost je pozdější – hledej starší.';
      }
    });
    nabidka.appendChild(b);
  });
  p.append(osa, nabidka, odezva);
}

/* ---- Staré pověsti ------------------------------------------------------------ */
function povesti() {
  const p = $('plocha');
  const o = Uloha.nahodne(POVESTI);
  const jine = Uloha.zamichej(POVESTI.filter(x => x.n !== o.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O které postavě ze starých pověstí se to vypráví?</div>
    <div class="karta"><div class="obrazek">${o.e}</div><div class="udalost">${o.t}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([o, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: o.n,
    zpravaOk: `✅ ${o.n} – ${o.t}.`,
    zpravaChyba: 'To je jiná postava z pověstí.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { kdoTo, letopocty, poradi, povesti };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
