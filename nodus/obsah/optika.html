<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔦 Optika – odraz, lom a čočky</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<style>
body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.horni{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--bg-elevated);border-bottom:1px solid var(--border);flex-wrap:wrap}
.horni h1{font-size:1.05rem;font-weight:600;margin-right:auto}
.zalozky{display:flex;gap:6px}
.panel{display:flex;gap:14px;align-items:center;padding:9px 16px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel label{font-size:.78rem;color:var(--text-muted);display:flex;align-items:center;gap:7px}
.panel .hodnota{color:var(--text-faint);min-width:3.4em;font-variant-numeric:tabular-nums}
input[type=range]{width:110px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
select{background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:.8rem}
button{background:var(--bg-control);border:1px solid var(--border-strong);color:var(--text);border-radius:6px;padding:7px 13px;font-size:.82rem;cursor:pointer}
button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
button.zap{background:var(--accent);color:#fff;border-color:var(--accent)}
.plocha{flex:1;position:relative;overflow:hidden;background:var(--bg-deep);min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.stav{background:var(--bg-panel);border-top:1px solid var(--border);padding:8px 16px;font-size:.8rem;color:var(--text-muted);display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}
.stav b{color:var(--text);font-variant-numeric:tabular-nums}
.stav .znak{font-size:1rem}
.info{position:absolute;top:12px;right:12px;width:275px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;padding:11px 14px;font-size:.78rem;line-height:1.6;color:var(--text-muted);box-shadow:var(--shadow)}
.info b{color:var(--text)}
.info .zavri{position:sticky;float:right;top:0;margin:-4px -6px 0 6px;background:none;border:none;color:var(--text-faint);font-size:1rem;padding:0 4px;cursor:pointer}
.info .zavri:hover{background:none;color:var(--accent)}
.napoveda{position:absolute;left:12px;bottom:10px;font-size:.74rem;color:var(--text-faint);pointer-events:none}
.skryto{display:none !important}
@media(max-width:760px){.info{display:none}.panel{gap:10px;padding:8px 10px}input[type=range]{width:86px}}

/* ovládací prvky jako přehledné dlaždice v panelu */
.panel{gap:8px}
.panel label{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:4px 9px;gap:6px}
.panel input[type=range]{width:88px}
.panel label:has(input[type=checkbox]){background:var(--bg-control);border-color:var(--border-strong);cursor:pointer;color:var(--text-muted)}
.panel label:has(input[type=checkbox]:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.panel .hodnota{color:var(--text);font-weight:600}
.panel label:has(.prepinac){background:none;border:none;padding:0;gap:8px}
.prepinac{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.prepinac button{border:none;border-radius:0;padding:6px 12px;font-size:.8rem;background:var(--bg-control);color:var(--text-muted)}
.prepinac button+button{border-left:1px solid var(--border)}
.prepinac button:hover{background:var(--bg-hover);color:var(--text)}
.prepinac button.zap,.prepinac button.zap:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="horni">
  <h1>🔦 Optika</h1>
  <div class="zalozky">
    <button id="tabLom" class="zap">🪞 Odraz a lom</button>
    <button id="tabCocka">🔍 Čočky a zrcadla</button>
    <button id="tabHranol">🌈 Hranol</button>
    <button id="tabDalekohled">🔭 Dalekohled</button>
  </div>
  <button id="btnInfo">❓ Nápověda</button>
</div>

<div class="panel" id="panelLom">
  <label>☁️ Nahoře <select id="n1" class="jakoTlacitka">
      <option value="1.0003" selected data-krat="vzduch">vzduch (n = 1,00)</option>
      <option value="1.333" data-krat="voda">voda (n = 1,33)</option>
      <option value="1.52" data-krat="sklo">sklo (n = 1,52)</option>
      <option value="2.417" data-krat="diamant">diamant (n = 2,42)</option>
    </select></label>
  <label>💧 Dole <select id="n2" class="jakoTlacitka">
      <option value="1.0003" data-krat="vzduch">vzduch (n = 1,00)</option>
      <option value="1.333" selected data-krat="voda">voda (n = 1,33)</option>
      <option value="1.52" data-krat="sklo">sklo (n = 1,52)</option>
      <option value="2.417" data-krat="diamant">diamant (n = 2,42)</option>
    </select></label>
  <label>📐 Úhel dopadu <input type="range" id="uhel" min="0" max="89" step="1" value="40"><span class="hodnota" id="uhelV">40°</span></label>
  <label><input type="checkbox" id="zdola"> ⤴️ Paprsek zdola</label>
  <label><input type="checkbox" id="ukazOdraz" checked> ✨ Odražený paprsek</label>
</div>

<div class="panel skryto" id="panelCocka">
  <label>🔍 <select id="typ" class="jakoTlacitka">
      <option value="spojka" selected data-krat="🔍 Spojka">Spojka (spojná čočka)</option>
      <option value="rozptylka" data-krat="🔍 Rozptylka">Rozptylka (rozptylná čočka)</option>
      <option value="dute" data-krat="🪞 Duté zrcadlo">Duté zrcadlo</option>
      <option value="vypukle" data-krat="🪞 Vypuklé zrcadlo">Vypuklé zrcadlo</option>
    </select></label>
  <label>🎯 Ohnisko f <input type="range" id="f" min="4" max="30" step="1" value="12"><span class="hodnota" id="fV">12 cm</span></label>
  <label>📏 Vzdálenost předmětu <input type="range" id="a" min="3" max="55" step="1" value="30"><span class="hodnota" id="aV">30 cm</span></label>
  <label>🕯️ Výška předmětu <input type="range" id="vys" min="2" max="12" step="1" value="6"><span class="hodnota" id="vysV">6 cm</span></label>
  <label><input type="checkbox" id="ukazVse"> 🔦 Více paprsků</label>
</div>

<div class="panel skryto" id="panelHranol">
  <label>📐 Úhel dopadu <input type="range" id="hUhel" min="10" max="80" step="1" value="45"><span class="hodnota" id="hUhelV">45°</span></label>
  <label>⬆️ Místo dopadu <input type="range" id="hPos" min="20" max="80" step="1" value="50"><span class="hodnota" id="hPosV">50 %</span></label>
  <label>🔷 Index lomu <input type="range" id="hN" min="130" max="200" step="1" value="152"><span class="hodnota" id="hNV">1,52</span></label>
  <label>🌈 Disperze <input type="range" id="hDisp" min="0" max="60" step="1" value="14"><span class="hodnota" id="hDispV">14</span></label>
  <label>🔄 Otočení hranolu <input type="range" id="hOtoc" min="-90" max="90" step="1" value="0"><span class="hodnota" id="hOtocV">0°</span></label>
</div>

<div class="panel skryto" id="panelDalekohled">
  <label>🔭 <select id="dTyp" class="jakoTlacitka">
      <option value="kepler" selected data-krat="🔭 Keplerův">Keplerův (hvězdářský)</option>
      <option value="galileo" data-krat="🎭 Galileův">Galileův (divadelní kukátko)</option>
    </select></label>
  <label>🎬 Ukázka <select id="dPreset">
      <option value="" selected>vlastní</option>
      <option value="kukatko">divadelní kukátko 3×</option>
      <option value="galileo1609">Galileo 1609 · 20×</option>
      <option value="skolni">školní hvězdářský 28×</option>
      <option value="velky">velký amatérský 50×</option>
    </select></label>
  <label>🎯 Objektiv f₁ <input type="range" id="dF1" min="20" max="100" step="1" value="60"><span class="hodnota" id="dF1V">60 cm</span></label>
  <label>👁️ Okulár f₂ <input type="range" id="dF2" min="2" max="20" step="0.5" value="6"><span class="hodnota" id="dF2V">6 cm</span></label>
  <label>⭕ Průměr objektivu <input type="range" id="dD" min="2" max="20" step="1" value="8"><span class="hodnota" id="dDV">8 cm</span></label>
  <label>⭐ Úhel hvězdy <input type="range" id="dAlfa" min="0" max="30" step="1" value="12"><span class="hodnota" id="dAlfaV">1,2°</span></label>
  <label><input type="checkbox" id="dOsovy" checked> ➖ I osový svazek</label>
  <label><input type="checkbox" id="dPohled" checked> 🌙 Pohled okulárem</label>
</div>

<div class="plocha">
  <canvas id="c"></canvas>
  <div class="info skryto" id="infoBox">
    <button class="zavri" id="zavriInfo" title="Zavřít">✕</button>
    <div id="infoText"></div>
  </div>
  <div class="napoveda" id="napoveda"></div>
</div>

<div class="stav" id="stav"></div>

<script>
const $=id=>document.getElementById(id);
const canvas=$('c'), ctx=canvas.getContext('2d');
const cz=(x,d=1)=>(Math.abs(x)<1e-9?0:x).toFixed(d).replace('.',',');
const DEG=180/Math.PI;

let C={};
function nactiBarvy(){
  const s=getComputedStyle(document.documentElement), g=n=>s.getPropertyValue(n).trim();
  C={text:g('--text'),muted:g('--text-muted'),faint:g('--text-faint'),border:g('--border'),
     silny:g('--border-strong'),akcent:g('--accent'),ok:g('--ok'),warn:g('--warn'),
     danger:g('--danger'),panel:g('--bg-panel'),elev:g('--bg-elevated')};
}
nactiBarvy();

// plátno musí sledovat i změnu výšky panelu při přepnutí záložky,
// jinak zůstane starý obsah pod nově kreslenou plochou
function resize(){
  const r=devicePixelRatio||1;
  const w=Math.round(canvas.clientWidth*r), h=Math.round(canvas.clientHeight*r);
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
  ctx.setTransform(r,0,0,r,0,0);
}

/* ---------- uchopovací body: kreslení je registruje, myš je hledá ---------- */
let uchopy=[], tahne=null, podKurzorem=null;
function uchop(x,y,r,typ,bezObrysu){
  uchopy.push({x,y,r,typ});
  if(bezObrysu) return;
  // obrys ukazuje, za co se dá vzít; pod kurzorem a při tažení zesílí
  const akt=(tahne&&tahne.typ===typ)||podKurzorem===typ;
  ctx.save();
  ctx.strokeStyle=akt?C.akcent:C.faint;
  ctx.setLineDash(akt?[]:[3,4]);
  ctx.lineWidth=akt?2:1;
  ctx.beginPath(); ctx.arc(x,y,akt?r+3:r,0,Math.PI*2);
  if(akt){ ctx.fillStyle='rgba(106,166,253,.13)'; ctx.fill(); }
  ctx.stroke();
  ctx.restore();
}
function najdiUchop(x,y){
  let nej=null, nd=1e9;
  for(const u of uchopy){
    if(u.obdelnik){
      const [rx,ry,rw,rh]=u.obdelnik;
      if(x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh) return u;
      continue;
    }
    const d=Math.hypot(x-u.x,y-u.y);
    if(d<u.r&&d<nd){ nd=d; nej=u; }
  }
  return nej;
}

function cara(x1,y1,x2,y2,barva,sirka=2,carkovane=false){
  ctx.save();
  if(carkovane) ctx.setLineDash([6,5]);
  ctx.strokeStyle=barva; ctx.lineWidth=sirka;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}
function hrot(x,y,uhel,barva,vel=8){
  ctx.fillStyle=barva;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x-vel*Math.cos(uhel-0.42),y-vel*Math.sin(uhel-0.42));
  ctx.lineTo(x-vel*Math.cos(uhel+0.42),y-vel*Math.sin(uhel+0.42));
  ctx.closePath(); ctx.fill();
}
function popis(text,x,y,barva=C.muted,font='12px sans-serif',zar='center'){
  ctx.fillStyle=barva; ctx.font=font; ctx.textAlign=zar; ctx.textBaseline='middle';
  ctx.fillText(text,x,y);
}
/* popisek s podkladem – čitelný i přes paprsky; k okraji plátna uhne dovnitř */
function chip(text,x,y,barva=C.muted,font='11px sans-serif'){
  ctx.font=font;
  const s=ctx.measureText(text).width, w=canvas.clientWidth;
  const cx=Math.max(s/2+6,Math.min(w-s/2-6,x));
  ctx.save();
  ctx.globalAlpha=.9; ctx.fillStyle=C.panel;
  ctx.beginPath(); ctx.roundRect(cx-s/2-5,y-9,s+10,18,5); ctx.fill();
  ctx.restore();
  popis(text,cx,y,barva,font);
}
/* kóta (rozměrová čára) se šipkami na obou koncích; u krátké kóty popisek uhne pod ni */
function kota(x1,x2,y,text,barva=C.muted){
  const xa=Math.min(x1,x2), xb=Math.max(x1,x2);
  if(xb-xa<4) return;
  ctx.save();
  ctx.strokeStyle=barva; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(xa,y-5); ctx.lineTo(xa,y+5);
  ctx.moveTo(xb,y-5); ctx.lineTo(xb,y+5);
  ctx.moveTo(xa,y);   ctx.lineTo(xb,y);
  ctx.stroke();
  ctx.restore();
  hrot(xa+1,y,Math.PI,barva,6); hrot(xb-1,y,0,barva,6);
  chip(text,(xa+xb)/2,xb-xa<58?y+16:y,barva,'10px sans-serif');
}

/* ================= 1) ODRAZ A LOM ================= */
const lom={
  n1:1.0003, n2:1.333, uhel:40, zdola:false, odraz:true, P:[0,0],
  nacti(){
    this.n1=+$('n1').value; this.n2=+$('n2').value; this.uhel=+$('uhel').value;
    this.zdola=$('zdola').checked; this.odraz=$('ukazOdraz').checked;
    $('uhelV').textContent=this.uhel+'°';
  },
  vysledek(){
    const nIn=this.zdola?this.n2:this.n1, nOut=this.zdola?this.n1:this.n2;
    const th1=this.uhel/DEG;
    const s=nIn*Math.sin(th1)/nOut;
    const uplny=s>1;
    return {nIn,nOut,th1,th2:uplny?null:Math.asin(s),uplny,
            mezni:nIn>nOut?Math.asin(nOut/nIn)*DEG:null};
  },
  kresli(w,h){
    const y0=h*0.5, px=w*0.46, v=this.vysledek();
    // prostředí
    ctx.fillStyle=this.n1>1.05?'rgba(106,166,253,.10)':'transparent';
    ctx.fillRect(0,0,w,y0);
    ctx.fillStyle=this.n2>1.05?'rgba(106,166,253,'+(0.05+Math.min(0.18,(this.n2-1)*0.14))+')':'transparent';
    ctx.fillRect(0,y0,w,h-y0);
    ctx.strokeStyle=C.silny; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w,y0); ctx.stroke();
    // popisky prostředí fungují jako tlačítka – kliknutím se materiál přepne
    for(const [id,yy,typ] of [['n1',y0-20,'prostredi1'],['n2',y0+20,'prostredi2']]){
      const text=cz(+$(id).value,2)+'  '+$(id).selectedOptions[0].text.split(' (')[0];
      const popisek=(id==='n1'?'n₁ = ':'n₂ = ')+text;
      ctx.font='12px sans-serif';
      const sirka=ctx.measureText(popisek).width+22;
      ctx.fillStyle=C.elev; ctx.strokeStyle=C.border; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(12,yy-13,sirka,26,7); ctx.fill(); ctx.stroke();
      popis(popisek,23,yy,C.muted,'12px sans-serif','left');
      popis('↻',12+sirka-11,yy,C.akcent,'12px sans-serif');
      uchopy.push({x:12+sirka/2,y:yy,r:Math.max(sirka,26)/2,typ,obdelnik:[12,yy-13,sirka,26]});
    }

    // kolmice
    cara(px,20,px,h-20,C.faint,1,true);
    popis('kolmice',px+46,26,C.faint,'11px sans-serif');

    const L=Math.min(w,h)*0.42;
    const zn=this.zdola?-1:1;          // +1 = paprsek přichází shora
    // dopadající paprsek
    const qx=px-L*Math.sin(v.th1), qy=y0-zn*L*Math.cos(v.th1);
    cara(qx,qy,px,y0,C.warn,2.5);
    uchop(qx,qy,20,'zdroj');
    popis('🔦',qx,qy,C.text,'17px sans-serif');
    hrot((qx+px)/2+ (px-qx)*0.1,(qy+y0)/2+(y0-qy)*0.1,Math.atan2(y0-qy,px-qx),C.warn);
    popis('dopadající',qx- (this.zdola?0:0),qy-(this.zdola?-16:16),C.warn,'11px sans-serif');

    // odražený
    if(this.odraz){
      const rx=px+L*Math.sin(v.th1), ry=y0-zn*L*Math.cos(v.th1);
      cara(px,y0,rx,ry,v.uplny?C.danger:C.faint,v.uplny?2.5:1.8,false);
      hrot(rx,ry,Math.atan2(ry-y0,rx-px),v.uplny?C.danger:C.faint);
      popis(v.uplny?'úplný odraz':'odražený',rx,ry+(this.zdola?18:-16),v.uplny?C.danger:C.faint,'11px sans-serif');
    }
    // lomený
    if(!v.uplny){
      const lx=px+L*Math.sin(v.th2), ly=y0+zn*L*Math.cos(v.th2);
      cara(px,y0,lx,ly,C.ok,2.5);
      hrot(lx,ly,Math.atan2(ly-y0,lx-px),C.ok);
      popis('lomený',lx+30,ly,C.ok,'11px sans-serif');
      // oblouk úhlu lomu
      ctx.strokeStyle=C.ok; ctx.lineWidth=1;
      ctx.beginPath();
      if(this.zdola) ctx.arc(px,y0,46,-Math.PI/2,-Math.PI/2+v.th2);
      else ctx.arc(px,y0,46,Math.PI/2-v.th2,Math.PI/2);
      ctx.stroke();
      popis(cz(v.th2*DEG,1)+'°',px+42,y0+zn*74,C.ok,'12px sans-serif');
    }
    // oblouk úhlu dopadu
    ctx.strokeStyle=C.warn; ctx.lineWidth=1;
    ctx.beginPath();
    if(this.zdola) ctx.arc(px,y0,60,Math.PI/2,Math.PI/2+v.th1);
    else ctx.arc(px,y0,60,-Math.PI/2-v.th1,-Math.PI/2);
    ctx.stroke();
    popis(this.uhel+'°',px-34,y0-zn*74,C.warn,'12px sans-serif');

    ctx.fillStyle=C.text;
    ctx.beginPath(); ctx.arc(px,y0,4,0,Math.PI*2); ctx.fill();
  },
  stav(){
    const v=this.vysledek();
    let s=`Úhel dopadu <b>${this.uhel}°</b> `+
      `<span class="znak">•</span> ${v.uplny?'<b>úplný odraz</b> – světlo se do druhého prostředí vůbec nedostane'
        :'Úhel lomu <b>'+cz(v.th2*DEG,1)+'°</b>'} `+
      `<span class="znak">•</span> Snellův zákon: ${cz(v.nIn,2)}·sin ${this.uhel}° = ${cz(v.nOut,2)}·sin ${v.uplny?'?':cz(v.th2*DEG,1)+'°'}`;
    if(v.mezni!==null) s+=` <span class="znak">•</span> Mezní úhel <b>${cz(v.mezni,1)}°</b>`;
    s+=` <span class="znak">•</span> ${v.uplny?'':(v.nOut>v.nIn?'do hustšího prostředí → láme se <b>ke</b> kolmici':'do řidšího prostředí → láme se <b>od</b> kolmice')}`;
    return s;
  }
};

/* ================= 2) ČOČKY A ZRCADLA ================= */
const cocka={
  typ:'spojka', f:12, a:30, y:6, vice:false,
  nacti(){
    this.typ=$('typ').value; this.a=+$('a').value; this.y=+$('vys').value; this.vice=$('ukazVse').checked;
    const f=+$('f').value;
    this.f=(this.typ==='rozptylka'||this.typ==='vypukle')?-f:f;
    $('fV').textContent=(this.f<0?'−':'')+f+' cm';
    $('aV').textContent=this.a+' cm'; $('vysV').textContent=this.y+' cm';
  },
  zrcadlo(){ return this.typ==='dute'||this.typ==='vypukle'; },
  obraz(){
    const {a,f}=this;
    if(Math.abs(a-f)<1e-6) return {a2:Infinity,y2:Infinity,z:Infinity};
    const a2=a*f/(a-f);
    return {a2,y2:-this.y*a2/a,z:-a2/a};
  },
  kresli(w,h){
    const cx=w*0.52, osaY=h*0.52;
    const mer=Math.min(w*0.94/120,h*0.9/34,10);   // px na cm
    const sm=this.zrcadlo()?-1:1;                 // kam pokračují paprsky
    const {a,f,y}=this, ob=this.obraz();
    const X=cm=>cx+cm*mer, Y=cm=>osaY-cm*mer;

    // optická osa
    cara(0,osaY,w,osaY,C.border,1.5);
    // ohniska (u zrcadla leží obě význačné body na téže straně)
    const znacky=this.zrcadlo()
      ? [[-f,'F'],[-2*f,'C']]
      : [[-Math.abs(f),'F'],[Math.abs(f),"F'"],[-2*Math.abs(f),'2F'],[2*Math.abs(f),"2F'"]];
    for(const [d,jm] of znacky){
      const x=X(d);
      if(x<4||x>w-4) continue;
      ctx.fillStyle=C.faint;
      ctx.beginPath(); ctx.arc(x,osaY,3,0,Math.PI*2); ctx.fill();
      popis(jm,x,osaY+16,C.faint,'11px sans-serif');
      if(jm==='F') uchop(x,osaY,15,'ohnisko');
    }

    // optický prvek
    const ap=Math.min(h*0.30,Math.max(58,this.y*mer*1.6+30));
    ctx.lineWidth=2.5; ctx.strokeStyle=C.akcent;
    if(!this.zrcadlo()){
      const vyd=this.f>0?12:-12;
      ctx.fillStyle='rgba(106,166,253,.13)';
      ctx.beginPath();
      ctx.moveTo(cx,osaY-ap);
      ctx.quadraticCurveTo(cx+vyd,osaY,cx,osaY+ap);
      ctx.quadraticCurveTo(cx-vyd,osaY,cx,osaY-ap);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      if(this.f<0){ // u rozptylky naznač okraje
        cara(cx-13,osaY-ap,cx+13,osaY-ap,C.akcent,2.5);
        cara(cx-13,osaY+ap,cx+13,osaY+ap,C.akcent,2.5);
      }
    }else{
      const vyd=this.f>0?26:-26;      // duté zrcadlo je vyduté směrem k předmětu
      ctx.beginPath();
      ctx.moveTo(cx,osaY-ap);
      ctx.quadraticCurveTo(cx+vyd,osaY,cx,osaY+ap);
      ctx.stroke();
      ctx.strokeStyle=C.faint; ctx.lineWidth=1;
      for(let t=-ap;t<=ap;t+=9){
        const px=cx+vyd*(1-(t/ap)**2)*0.5;
        ctx.beginPath(); ctx.moveTo(px,osaY+t); ctx.lineTo(px+9,osaY+t-5); ctx.stroke();
      }
    }

    // předmět
    const ox=X(-a);
    ctx.strokeStyle=C.warn; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(ox,osaY); ctx.lineTo(ox,Y(y)); ctx.stroke();
    hrot(ox,Y(y),-Math.PI/2,C.warn,10);
    popis('předmět',ox,Y(y)-18,C.warn,'11px sans-serif');
    uchop(ox,Y(y),18,'predmet');
    this.geo={cx,osaY,mer};

    // paprsky – lomový/odrazový vztah: výstupní směrnice u' = u − h/f
    const vysky=this.vice
      ? [y,0,-y*f/(a-f),y*0.5,-y*0.3]
      : [y,0,-y*f/(a-f)];
    for(const hcm of vysky){
      if(!isFinite(hcm)) continue;
      const hp=Math.max(-ap/mer,Math.min(ap/mer,hcm));
      const u=(hp-y)/a;                 // směrnice dopadajícího paprsku (dy/dx v cm)
      const u2=u-hp/f;                  // po průchodu / odrazu
      // dopadající část
      cara(ox,Y(y),cx,Y(hp),C.ok,1.8);
      // vystupující část
      const dl=(sm>0?(w-cx):cx)/mer;
      cara(cx,Y(hp),cx+sm*dl*mer,Y(hp+u2*dl),C.ok,1.8);
      // zdánlivé prodloužení dozadu, když je obraz neskutečný
      if(ob.a2<0){
        const zl=(sm>0?cx:(w-cx))/mer;
        cara(cx,Y(hp),cx-sm*zl*mer,Y(hp-u2*zl),C.ok,1,true);
      }
    }

    // obraz
    if(isFinite(ob.a2)){
      const ix=X(sm*ob.a2), iy=Y(ob.y2);
      if(ix>2&&ix<w-2){
        const skutecny=ob.a2>0;
        ctx.save();
        if(!skutecny) ctx.setLineDash([6,5]);
        ctx.strokeStyle=skutecny?C.danger:C.akcent; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(ix,osaY); ctx.lineTo(ix,iy); ctx.stroke();
        ctx.restore();
        hrot(ix,iy,ob.y2>0?-Math.PI/2:Math.PI/2,skutecny?C.danger:C.akcent,10);
        popis(skutecny?'skutečný obraz':'zdánlivý obraz',ix,iy+(ob.y2>0?-18:18),skutecny?C.danger:C.akcent,'11px sans-serif');
      }
    }else{
      popis('Předmět je přesně v ohnisku – paprsky vycházejí rovnoběžně, obraz nevznikne.',w/2,26,C.warn,'13px sans-serif');
    }
  },
  stav(){
    const ob=this.obraz();
    if(!isFinite(ob.a2))
      return `a = <b>${this.a} cm</b> = f <span class="znak">•</span> <b>Obraz nevzniká</b> – paprsky vycházejí rovnoběžně (obraz „v nekonečnu").`;
    const z=Math.abs(ob.z);
    const popisObrazu=[
      ob.a2>0?'skutečný':'zdánlivý',
      ob.z<0?'převrácený':'přímý',
      z>1.02?'zvětšený':(z<0.98?'zmenšený':'stejně velký')
    ].join(', ');
    return `Vzdálenost předmětu <b>a = ${this.a} cm</b> `+
      `<span class="znak">•</span> Ohnisko <b>f = ${cz(this.f,0)} cm</b> `+
      `<span class="znak">•</span> Obraz <b>a′ = ${cz(ob.a2,1)} cm</b> `+
      `<span class="znak">•</span> Zvětšení <b>Z = ${cz(ob.z,2)}</b> `+
      `<span class="znak">•</span> Obraz je <b>${popisObrazu}</b> `+
      `<span class="znak">•</span> 1/a + 1/a′ = 1/f`;
  }
};

/* ================= 3) HRANOL ================= */
function barvaVlny(l,alfa=1){
  let r=0,g=0,b=0;
  if(l<440){r=(440-l)/60;b=1;}
  else if(l<490){g=(l-440)/50;b=1;}
  else if(l<510){g=1;b=(510-l)/20;}
  else if(l<580){r=(l-510)/70;g=1;}
  else if(l<645){r=1;g=(645-l)/65;}
  else {r=1;}
  const f=l<420?0.35+0.65*(l-380)/40:(l>700?0.35+0.65*(780-l)/80:1);
  const q=x=>Math.round(255*Math.min(1,Math.max(0,x*f))**0.85);
  return `rgba(${q(r)},${q(g)},${q(b)},${alfa})`;
}
const hranol={
  uhel:45, pos:50, n0:1.52, disp:14, otoc:0,
  nacti(){
    this.uhel=+$('hUhel').value; this.pos=+$('hPos').value;
    this.n0=+$('hN').value/100; this.disp=+$('hDisp').value; this.otoc=+$('hOtoc').value;
    $('hUhelV').textContent=this.uhel+'°'; $('hPosV').textContent=this.pos+' %';
    $('hNV').textContent=cz(this.n0,2); $('hDispV').textContent=this.disp;
    $('hOtocV').textContent=this.otoc+'°';
  },
  index(l){ // Cauchy: n = n₀ + B/λ²  (λ v nm), n₀ dopočteno na 589 nm
    const B=this.disp*300;
    return this.n0-B/(589*589)+B/(l*l);
  },
  geometrie(w,h){
    const L=Math.min(w*0.34,h*0.62);
    const vy=L*Math.sqrt(3)/2, cx=w*0.55, cy=h*0.54;
    const fi=(this.otoc||0)/DEG, cf=Math.cos(fi), sf=Math.sin(fi);
    const otoc=p=>{ const dx=p[0]-cx, dy=p[1]-cy; return [cx+dx*cf-dy*sf, cy+dx*sf+dy*cf]; };
    const A=otoc([cx,cy-vy*2/3]), B=otoc([cx-L/2,cy+vy/3]), Cc=otoc([cx+L/2,cy+vy/3]);
    // vnitřní kolmice levé stěny A–B (otočení hrany o −90°)
    const normalaAB=Math.atan2(-(B[0]-A[0]),B[1]-A[1]);
    return {A,B,C:Cc,hrany:[[A,B],[B,Cc],[Cc,A]],L,normalaAB,stred:[cx,cy]};
  },
  // průsečík polopřímky s úsečkou
  prusecik(o,d,p,q){
    const ex=q[0]-p[0], ey=q[1]-p[1];
    const den=d[0]*ey-d[1]*ex;
    if(Math.abs(den)<1e-9) return null;
    const t=((p[0]-o[0])*ey-(p[1]-o[1])*ex)/den;
    const s=(d[0]*(p[1]-o[1])-d[1]*(p[0]-o[0]))/(-den);
    if(t>1e-6&&s>=-1e-6&&s<=1+1e-6) return {t,s,bod:[o[0]+d[0]*t,o[1]+d[1]*t],hrana:[p,q]};
    return null;
  },
  trasuj(o,d,n,g){
    const body=[o.slice()];
    let uvnitr=false, pos=o.slice(), dir=d.slice();
    for(let krok=0;krok<8;krok++){
      let nej=null;
      for(const [p,q] of g.hrany){
        const h=this.prusecik(pos,dir,p,q);
        if(h&&(!nej||h.t<nej.t)) nej=h;
      }
      if(!nej) break;
      body.push(nej.bod);
      // normála hrany
      const [p,q]=nej.hrana;
      let nx=-(q[1]-p[1]), ny=q[0]-p[0];
      const dl=Math.hypot(nx,ny); nx/=dl; ny/=dl;
      let cosi=-(dir[0]*nx+dir[1]*ny);
      if(cosi<0){ nx=-nx; ny=-ny; cosi=-cosi; }      // normála proti paprsku
      const eta=uvnitr?n/1:1/n;
      const k=1-eta*eta*(1-cosi*cosi);
      if(k<0){                                        // úplný odraz uvnitř
        dir=[dir[0]+2*cosi*nx,dir[1]+2*cosi*ny];
        pos=nej.bod.slice();
        continue;
      }
      dir=[eta*dir[0]+(eta*cosi-Math.sqrt(k))*nx, eta*dir[1]+(eta*cosi-Math.sqrt(k))*ny];
      const dn=Math.hypot(dir[0],dir[1]); dir=[dir[0]/dn,dir[1]/dn];
      pos=nej.bod.slice();
      uvnitr=!uvnitr;
      if(!uvnitr) break;                              // vystoupil ven
    }
    // dokreslit výstup mimo hranol
    body.push([pos[0]+dir[0]*3000,pos[1]+dir[1]*3000]);
    return body;
  },
  kresli(w,h){
    const g=this.geometrie(w,h);
    // těleso hranolu
    ctx.beginPath();
    ctx.moveTo(g.A[0],g.A[1]); ctx.lineTo(g.B[0],g.B[1]); ctx.lineTo(g.C[0],g.C[1]); ctx.closePath();
    ctx.fillStyle='rgba(106,166,253,.10)'; ctx.fill();
    ctx.strokeStyle=C.akcent; ctx.lineWidth=2; ctx.stroke();

    // vstupní bod na levé stěně A–B, úhel dopadu se měří od kolmice ke stěně
    const t=this.pos/100;
    const vx=g.A[0]+(g.B[0]-g.A[0])*t, vy=g.A[1]+(g.B[1]-g.A[1])*t;
    const fi0=g.normalaAB;                           // směr vnitřní kolmice levé stěny
    const smerU=fi0-this.uhel/DEG;
    const dir=[Math.cos(smerU),Math.sin(smerU)];     // směr dopadajícího paprsku
    const start=[vx-dir[0]*Math.min(w,h)*0.55, vy-dir[1]*Math.min(w,h)*0.55];

    // kolmice ke vstupní stěně
    cara(vx-Math.cos(fi0)*54,vy-Math.sin(fi0)*54,vx+Math.cos(fi0)*40,vy+Math.sin(fi0)*40,C.faint,1,true);

    // bílý dopadající paprsek
    cara(start[0],start[1],vx,vy,C.text,3);
    uchop(start[0],start[1],20,'zdroj');
    popis('🔦',start[0],start[1],C.text,'17px sans-serif');
    uchop(vx,vy,15,'vstup');
    uchop(g.stred[0],g.stred[1],Math.min(46,g.L*0.28),'hranol');
    popis('🔄',g.stred[0],g.stred[1],C.faint,'14px sans-serif');
    hrot(vx-dir[0]*3,vy-dir[1]*3,Math.atan2(dir[1],dir[0]),C.text,9);
    popis('bílé světlo',start[0]+34,start[1]-32,C.text,'12px sans-serif','left');

    // spektrum
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,w,h); ctx.clip();
    for(let l=400;l<=700;l+=6){
      const body=this.trasuj(start,dir,this.index(l),g);
      ctx.strokeStyle=barvaVlny(l,0.85); ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(body[1][0],body[1][1]);
      for(let i=2;i<body.length;i++) ctx.lineTo(body[i][0],body[i][1]);
      ctx.stroke();
    }
    ctx.restore();
    popis('🌈 spektrum',w-16,h*0.10,C.muted,'12px sans-serif','right');
  },
  stav(){
    const nf=this.index(400), nc=this.index(700);
    return `Index lomu pro <span style="color:#8a4bff">fialovou 400 nm</span> <b>${cz(nf,3)}</b> `+
      `<span class="znak">•</span> pro <span style="color:#e05d5d">červenou 700 nm</span> <b>${cz(nc,3)}</b> `+
      `<span class="znak">•</span> Rozdíl <b>${cz(nf-nc,3)}</b> `+
      `<span class="znak">•</span> Čím větší index, tím větší lom → fialová se odchýlí nejvíc, červená nejméně`;
  }
};

/* ================= 4) DALEKOHLED =================
   Keplerův (hvězdářský): objektiv s dlouhým ohniskem vytvoří ve své ohniskové
   rovině malý skutečný převrácený obraz a okulár (spojka) se na něj dívá jako
   lupa. Ohniska obou čoček splývají, takže dovnitř i ven letí rovnoběžný
   svazek – mění se jen jeho úhel. Odtud úhlové zvětšení Z = f₁ / f₂.
   Galileův (holandský – divadelní kukátko): v okuláru je rozptylka postavená
   o f₂ *před* ohniskovou rovinu. Ohniska zase splývají a zvětšení vyjde
   stejně, ale obraz se nestihne vytvořit, tubus měří jen f₁ − f₂ a výsledek
   je přímý.

   Schéma se kreslí anamorfně – podél osy a napříč osou platí jiné měřítko.
   Paraxiální optika je v příčné souřadnici lineární (vynásobí-li se všechny
   výšky i sklony stejným číslem, obrázek dál platí), takže svislé roztažení
   nic nerozbije. Bez něj by se svazek pod úhlem kolem jednoho stupně slil
   s osou a nebylo by vidět to hlavní: ven letí pod mnohem větším úhlem. */

/* Obloha pro srovnávací kroužky: posun od středu pole ve stupních a hvězdná
   velikost. Slabší než 6 mag pouhé oko nevidí – ty se objeví, až když je
   objektiv dost velký. */
const NEBE=[
  // jasné hvězdy blízko středu – ty uvidíš okem i okulárem, a je na nich vidět otočení
  {x: 0.90,y: 0.70,m:3.0,b:'#ffbe73'},
  {x:-1.50,y: 0.60,m:4.6},
  {x: 1.10,y:-1.60,m:5.2},
  // jasné hvězdy po celé obloze – ty se vejdou jen do pohledu pouhým okem
  {x: -9.0,y:  6.0,m:2.4},
  {x: 12.0,y: -4.0,m:3.4},
  {x:-14.0,y: -8.0,m:3.9},
  {x:  6.0,y: 13.0,m:4.5},
  {x: 17.0,y:  9.0,m:5.0},
  {x: -5.0,y:-15.0,m:4.2},
  {x:  9.0,y:-12.0,m:5.4},
  // slabé hvězdy – objeví se, teprve když je objektiv dost velký
  {x: 0.55,y:-0.90,m:7.2},
  {x:-0.75,y: 0.50,m:8.1,b:'#a8c8ff'},
  {x: 1.35,y: 0.35,m:9.0},
  {x:-0.50,y:-1.25,m:9.7},
  {x:-1.40,y:-0.40,m:10.5},
  {x: 0.35,y: 1.30,m:11.4},
  {x: 1.20,y:-0.50,m:12.3},
  {x:-1.10,y: 1.10,m:13.0}];
const MESIC_SKVRNY=[[-0.40,0.32,0.26],[0.30,0.10,0.34],[-0.08,-0.48,0.17],[0.48,-0.40,0.12]];

/* Ukázková nastavení skutečných přístrojů – aby bylo poznat, co jsou reálné
   hodnoty. Galileo v roce 1609 brousil objektiv s ohniskem kolem metru a clonil
   ho na pár centimetrů, aby obraz nerozmazaly vady čočky. */
const PRESETY={
  kukatko:    {typ:'galileo',f1:20, f2:6.5,D:3, alfa:20},
  galileo1609:{typ:'galileo',f1:100,f2:5,  D:3, alfa:4},
  skolni:     {typ:'kepler', f1:70, f2:2.5,D:7, alfa:6},
  velky:      {typ:'kepler', f1:100,f2:2,  D:20,alfa:3}};

const dalekohled={
  typ:'kepler', f1:60, f2:6, D:8, alfa:1.2, osovy:true, pohled:true,
  nacti(){
    this.typ=$('dTyp').value;
    this.f1=+$('dF1').value;
    // u Galileova musí okulár zůstat kratší než objektiv, jinak by tubus zmizel
    const el=$('dF2'), max=this.galileo()?Math.max(2,Math.min(20,Math.round(this.f1*0.4*2)/2)):20;
    el.max=max;
    if(+el.value>max) el.value=max;
    this.f2=+el.value;
    this.D=+$('dD').value;
    this.alfa=+$('dAlfa').value/10;
    this.osovy=$('dOsovy').checked; this.pohled=$('dPohled').checked;
    $('dF1V').textContent=this.f1+' cm';
    $('dF2V').textContent=cz(this.f2,this.f2%1?1:0)+' cm';
    $('dDV').textContent=this.D+' cm';
    $('dAlfaV').textContent=cz(this.alfa)+'°';
    // jakmile se hodnoty rozejdou s ukázkou, vrátí se výběr na „vlastní"
    const pr=$('dPreset'), uk=PRESETY[pr.value];
    if(uk&&(uk.typ!==this.typ||uk.f1!==this.f1||uk.f2!==this.f2||uk.D!==this.D
            ||uk.alfa!==+$('dAlfa').value)) pr.value='';
  },
  galileo(){ return this.typ==='galileo'; },
  zvetseni(){ return this.f1/this.f2; },
  tubus(){ return this.galileo()?this.f1-this.f2:this.f1+this.f2; },
  beta(){ return Math.atan(this.zvetseni()*Math.tan(this.alfa/DEG))*DEG; },
  svetelnost(){ return (this.D*10/7)**2; },          // proti zornici oka ≈ 7 mm
  vystupni(){ return this.D*10/this.zvetseni(); },   // výstupní pupila v mm
  mezniMag(){ return 6+5*Math.log10(this.D*10/7); }, // nejslabší viditelná hvězda
  // zdánlivé pole okuláru dělené zvětšením; Galileův má pole citelně menší
  zornePole(){ return (this.galileo()?24:50)/this.zvetseni(); },
  mimoPole(){ return this.alfa>this.zornePole()/2; },

  kresli(w,h){
    const G=this.galileo(), Z=this.zvetseni(), L=this.tubus();
    const a=this.D/2, tg=Math.tan(this.alfa/DEG);
    // dole na ploše leží nápověda – kolik místa ukousne, tolik si musíme nechat
    const rezerva=($('napoveda').offsetHeight||0)+12;
    const pohled=this.pohled&&h-rezerva>250;
    const bandH=pohled?Math.max(140,Math.min(232,(h-rezerva)*0.4)):0;
    const H=h-bandH-(pohled?rezerva:0);                // pásmo pro schéma
    const osaY=Math.round(H*0.46);
    const objX=Math.round(w*0.17), tubW=w*0.54;
    const merX=tubW/(G?this.f1:this.f1+this.f2);       // px na cm podél osy
    const okX=objX+L*merX, fx=objX+this.f1*merX;

    /* paraxiální průchod: y je výška nad osou v cm, u sklon (dy/dz).
       Rozptylka se od spojky liší jenom znaménkem ohniskové vzdálenosti. */
    const f2e=G?-this.f2:this.f2;
    const paprsek=(y0,uIn)=>{
      const u1=uIn-y0/this.f1, yE=y0+u1*L;
      return {y0,uIn,u1,yE,u2:u1-yE/f2e};
    };
    const svazek=[a,0,-a].map(y0=>paprsek(y0,-tg));    // od hvězdy mimo osu
    const osovy=[a,0,-a].map(y0=>paprsek(y0,0));       // ze středu zorného pole

    // okulár kreslíme tak velký, jak ho dělá clona zorného pole
    const okAp=Math.max(a*0.15,Math.min(a*0.95,this.f1*Math.tan(this.zornePole()/2/DEG)+a/Z));
    // svislé měřítko smíme roztáhnout – příčný směr je v paraxiální optice lineární
    const volno=Math.min(H*0.25,145);
    const merY=Math.min(merX*3.4,volno/Math.max(a,okAp,L*tg+a/Z,this.f1*tg));
    const k=merY/merX;                                 // svislé převýšení
    const X=z=>objX+z*merX, Y=y=>osaY-y*merY;
    const ap=a*merY, apOk=Math.max(9,okAp*merY);
    const tubR=Math.max(ap,apOk)+9;

    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,w,H); ctx.clip();

    cara(0,osaY,w,osaY,C.border,1.2,true);             // optická osa

    // tubus
    ctx.save();
    ctx.globalAlpha=.5; ctx.fillStyle=C.elev;
    ctx.beginPath(); ctx.roundRect(objX,osaY-tubR,okX-objX,2*tubR,8); ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle=C.silny; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(objX,osaY-tubR); ctx.lineTo(okX,osaY-tubR);
    ctx.moveTo(objX,osaY+tubR); ctx.lineTo(okX,osaY+tubR);
    ctx.stroke();
    ctx.restore();

    // svazky paprsků: vně dalekohledu, uvnitř a za okulárem
    const zL=-objX/merX, zR=(w+40-okX)/merX;
    const kresliSvazek=(pole,barva,sirka,carkovane)=>{
      for(const p of pole){
        cara(0,Y(p.y0+p.uIn*zL),objX,Y(p.y0),barva,sirka,carkovane);
        cara(objX,Y(p.y0),okX,Y(p.yE),barva,sirka,carkovane);
        cara(okX,Y(p.yE),w+40,Y(p.yE+p.u2*zR),barva,sirka,carkovane);
      }
    };
    if(this.osovy){
      ctx.save(); ctx.globalAlpha=.5;
      kresliSvazek(osovy,C.faint,1,true);
      ctx.restore();
    }
    kresliSvazek(svazek,C.warn,1.8,false);

    // šipky do svazku od hvězdy, ať je poznat, kudy světlo letí
    const stred=svazek[1];
    const yInL=Y(stred.uIn*zL);
    hrot(objX*0.66,yInL+(osaY-yInL)*0.66,Math.atan2(osaY-yInL,objX),C.warn,8);
    const sklonVen=-stred.u2*merY/merX, dxo=(w-okX)*0.62;
    hrot(okX+dxo,Y(stred.yE)+sklonVen*dxo,Math.atan2(sklonVen,1),C.warn,8);

    // ohnisková rovina – ohniska objektivu a okuláru splývají
    cara(fx,osaY-tubR-5,fx,osaY+tubR+5,C.faint,1,true);
    ctx.fillStyle=C.faint;
    ctx.beginPath(); ctx.arc(fx,osaY,3,0,Math.PI*2); ctx.fill();

    // obraz v ohniskové rovině (u Galilea se ho okulár nedočká)
    const yImg=Y(-this.f1*tg);
    if(Math.abs(yImg-osaY)>2){
      ctx.save();
      ctx.strokeStyle=C.ok; ctx.lineWidth=G?2:3.2;
      if(G){ ctx.setLineDash([4,4]); ctx.globalAlpha=.6; }
      ctx.beginPath(); ctx.moveTo(fx,osaY); ctx.lineTo(fx,yImg); ctx.stroke();
      ctx.restore();
      if(!G) hrot(fx,yImg,Math.PI/2,C.ok,9);
      chip(G?'sem už obraz nedojde':'skutečný obraz – vzhůru nohama',fx,osaY+tubR+14,C.ok,'10px sans-serif');
    }

    // čočky
    const cockaTvar=(x,pol,rozptylka)=>{
      ctx.save();
      ctx.lineWidth=2.4; ctx.strokeStyle=C.akcent; ctx.fillStyle='rgba(106,166,253,.18)';
      ctx.beginPath();
      if(rozptylka){
        const v=Math.max(3,pol*0.20), s=Math.max(3,pol*0.09);
        ctx.moveTo(x-s-v,osaY-pol); ctx.lineTo(x+s+v,osaY-pol);
        ctx.quadraticCurveTo(x+s-v,osaY,x+s+v,osaY+pol);
        ctx.lineTo(x-s-v,osaY+pol);
        ctx.quadraticCurveTo(x-s+v,osaY,x-s-v,osaY-pol);
      }else{
        const v=Math.max(5,pol*0.24);
        ctx.moveTo(x,osaY-pol);
        ctx.quadraticCurveTo(x+v,osaY,x,osaY+pol);
        ctx.quadraticCurveTo(x-v,osaY,x,osaY-pol);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    };
    cockaTvar(objX,ap,false);
    cockaTvar(okX,apOk,G);

    // popisky nad tubusem; když ohnisková rovina leží u okuláru, uhne o řádek výš
    // zornice oka nakreslená týmž měřítkem jako objektiv: tenhle rozdíl v ploše
    // je celý rozdíl v tom, kolik světla přístroj nasbírá
    const rzO=0.35*merY, tesno=H<250, uzke=w<720;
    if(ap>rzO*2+18&&!tesno){
      const zx=objX-30, zy=osaY+ap*0.62;
      ctx.save();
      ctx.globalAlpha=.45; ctx.fillStyle=C.warn;
      ctx.beginPath(); ctx.arc(zx,zy,rzO,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.strokeStyle=C.text; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(zx,zy,rzO,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      chip('zornice oka 7 mm · objektiv nasbírá '+Math.round(this.svetelnost())+'× víc světla',
           zx+16,zy+rzO+13,C.muted,'10px sans-serif');
    }

    const yPop=Math.max(12,osaY-tubR-15);
    const f2Txt=cz(this.f2,this.f2%1?1:0);
    chip(uzke?'objektiv f₁ '+this.f1+' cm':'objektiv · f₁ = '+this.f1+' cm · Ø '+this.D+' cm',objX,yPop,C.akcent);
    chip(uzke?'okulár f₂ '+f2Txt+' cm':'okulár · f₂ = '+f2Txt+' cm'+(G?' (rozptylka)':''),okX,yPop,C.akcent);
    if(!tesno)
      chip('ohniska splývají: F₁ = F₂',fx,Math.abs(okX-fx)<150?Math.max(12,yPop-21):yPop,C.faint,'10px sans-serif');

    // hvězda a úhel α
    const hvX=Math.max(26,objX*0.17), hvY=Y(-tg*((hvX-objX)/merX));
    uchop(hvX,hvY,17,'hvezda');
    popis('⭐',hvX,hvY,C.text,'19px sans-serif');
    const thA=Math.atan(tg*k);
    if(thA>0.02){
      ctx.save(); ctx.strokeStyle=C.warn; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.arc(objX,osaY,54,Math.PI,Math.PI+thA); ctx.stroke(); ctx.restore();
    }
    chip('α = '+cz(this.alfa)+'°',objX+74*Math.cos(Math.PI+thA/2),osaY+74*Math.sin(Math.PI+thA/2),C.warn);

    // oko, výstupní pupila a úhel β
    const eyeX=Math.max(okX+apOk+16,Math.min(w-40,X(G?L+this.f2*0.5:L+L/Z)));
    const u2=stred.u2, thB=Math.atan(Math.abs(u2)*k);
    if(thB>0.02){
      ctx.save(); ctx.strokeStyle=C.warn; ctx.lineWidth=1.3;
      ctx.beginPath();
      if(u2>0) ctx.arc(eyeX,osaY,50,Math.PI-thB,Math.PI); else ctx.arc(eyeX,osaY,50,Math.PI,Math.PI+thB);
      ctx.stroke(); ctx.restore();
      cara(eyeX,osaY,eyeX-64,osaY+64*u2*k,C.warn,1.1,true);
    }
    // popisek β patří na vycházející svazek, u oka už je těsno
    const dxB=(w-okX)*0.72;
    chip('β = '+cz(this.beta())+'°',okX+dxB,Y(stred.yE)+sklonVen*dxB-15,C.warn);

    if(G){
      popis('👁️',Math.min(w-16,okX+apOk+22),osaY,C.text,'18px sans-serif');
    }else{
      // výstupní pupila proti zornici oka: co se do zornice nevejde, propadne vedle
      const rz=0.35*merY, rp=Math.max(1.5,Math.min(a/Z*merY,tubR));
      ctx.save();
      ctx.globalAlpha=.45; ctx.fillStyle=C.warn;
      ctx.beginPath(); ctx.arc(eyeX,osaY,rp,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.strokeStyle=C.text; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(eyeX,osaY,rz,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      popis('👁️',Math.min(w-16,eyeX+Math.max(rz,rp)+18),osaY,C.text,'18px sans-serif');
      chip('výstupní pupila '+cz(this.vystupni(),1)+' mm',
           eyeX,osaY+Math.max(rz,rp)+15,C.muted,'10px sans-serif');
    }

    // kóty pod tubusem: A + B = C (jen když na ně dole zbylo místo)
    const yk1=osaY+tubR+36, yk2=yk1+32;
    if(yk2+12<H){
      if(G){
        kota(objX,okX,yk1,'tubus '+cz(L,L%1?1:0)+' cm = f₁ − f₂',C.muted);
        kota(okX,fx,yk1,'f₂',C.akcent);
        kota(objX,fx,yk2,'f₁ = '+this.f1+' cm',C.akcent);
      }else{
        kota(objX,fx,yk1,'f₁ = '+this.f1+' cm',C.akcent);
        kota(fx,okX,yk1,'f₂',C.akcent);
        kota(objX,okX,yk2,'tubus '+cz(L,L%1?1:0)+' cm = f₁ + f₂',C.muted);
      }
    }

    if(this.mimoPole())
      chip('⚠ hvězda je až za okrajem zorného pole (±'+cz(this.zornePole()/2,1)+'°) – dalekohledem by ji vidět nebylo',
           w/2,17,C.danger,'11px sans-serif');

    const uzko=w<720;
    let pozn=uzko?'':'hvězda je nekonečně daleko, proto k objektivu letí rovnoběžný svazek';
    if(k>1.15) pozn+=(pozn?' · ':'')+'svisle zvětšeno '+cz(k,1)+'×';
    if(G&&!uzko) pozn+=' · výstupní pupila leží uvnitř tubusu, proto má kukátko úzké zorné pole';
    popis(pozn,10,Math.min(bandH?H-10:h-rezerva-6,yk2+30),C.faint,'10px sans-serif','left');

    uchop(okX,osaY,20,'okular');
    uchop(objX,osaY-ap,15,'objektiv');
    this.geo={objX,osaY,merX,merY,okX,fx,hvX};

    ctx.restore();
    if(pohled) this.kresliPohled(w,H,bandH,G);
  },

  /* Dva kroužky vedle sebe: co uvidíš okem a co okulárem. Oba mají stejné
     *zdánlivé* zorné pole – tedy stejně velký výsek toho, co oko vnímá – takže
     se dají poctivě srovnat. Vlevo je za tím pole oblohy Z× větší, proto je
     Měsíc jen tečka a hvězd je plno; vpravo je z oblohy vidět jen čárkovaný
     výřez, zato Z× zvětšený, vzhůru nohama a s hvězdami, na které oko nestačí. */
  kresliPohled(w,bandTop,bandH,G){
    cara(0,bandTop,w,bandTop,C.border,1);
    const r=Math.max(28,Math.min((bandH-40)/2,w*0.15,92));
    const cy=bandTop+r+6;
    const mez=Math.max(108,Math.min(w*0.2,180));
    const cx1=w/2-r-mez/2, cx2=w/2+r+mez/2;
    const Z=this.zvetseni(), FOVt=this.zornePole(), W=FOVt*Z;   // zdánlivé pole okuláru
    const limD=this.mezniMag();

    const hvezdicka=(x,y,rad,barva)=>{
      ctx.save();
      ctx.fillStyle=barva; ctx.strokeStyle='#0c1018'; ctx.lineWidth=1.6;
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const t=i*Math.PI/4-Math.PI/2, rr=i%2?rad*0.36:rad;
        const px=x+rr*Math.cos(t), py=y+rr*Math.sin(t);
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
    };

    // sc = kolik pixelů zabere jeden stupeň oblohy; okulár ji zvětší Z×
    const scena=(cx,sc,s,limit)=>{
      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle='#0c1018'; ctx.fill();
      ctx.save(); ctx.clip();
      const rm=Math.max(2.4,0.25*sc);                  // Měsíc má v průměru 0,5°
      ctx.save();
      ctx.globalAlpha=.16; ctx.fillStyle='#e9e3d2';
      ctx.beginPath(); ctx.arc(cx,cy,rm*2.2,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.fillStyle='#e9e3d2';
      ctx.beginPath(); ctx.arc(cx,cy,rm,0,Math.PI*2); ctx.fill();
      if(rm>3.5){
        ctx.fillStyle='rgba(96,90,76,.5)';
        for(const [dx,dy,dr] of MESIC_SKVRNY){
          ctx.beginPath(); ctx.arc(cx+s*dx*rm,cy-s*dy*rm,dr*rm,0,Math.PI*2); ctx.fill();
        }
      }
      for(const hv of NEBE){
        if(hv.m>limit) continue;
        const slaba=hv.m>6, rad=slaba?1.15:Math.max(1.2,2.9-0.3*hv.m);
        const hx=cx+s*hv.x*sc, hy=cy-s*hv.y*sc;
        ctx.fillStyle=hv.b||(slaba?'#b9c6e0':'#ffffff');
        ctx.globalAlpha=slaba?.85:1;
        ctx.beginPath(); ctx.arc(hx,hy,rad,0,Math.PI*2); ctx.fill();
        if(!slaba){ ctx.globalAlpha=.22; ctx.beginPath(); ctx.arc(hx,hy,rad*2.6,0,Math.PI*2); ctx.fill(); }
        ctx.globalAlpha=1;
      }
      // hvězda ze schématu stojí α nad středem pole; okulárem se překlopí
      hvezdicka(cx,cy-s*this.alfa*sc,4.2,C.warn);
      ctx.restore();
      ctx.strokeStyle=C.silny; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    };
    scena(cx1,2*r/W,1,6);
    scena(cx2,2*r/W*Z,G?1:-1,limD);

    // pouhým okem je Měsíc jen puntík, bez odkazu by ho nikdo nenašel
    const rM=Math.max(2.4,0.25*2*r/W), od=Math.max(rM,r/Z)+7;
    cara(cx1+od*0.72,cy-od*0.72,cx1+od+10,cy-od-10,C.faint,1);
    popis('Měsíc',cx1+od+13,cy-od-13,C.faint,'9px sans-serif','left');

    // kousek oblohy, který dalekohled ukáže = jeho skutečné zorné pole
    const rc=Math.max(3,r/Z);
    ctx.save();
    ctx.strokeStyle=C.akcent; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
    if(rc<r*0.96){ ctx.beginPath(); ctx.arc(cx1,cy,rc,0,Math.PI*2); ctx.stroke(); }
    // lupová výseč: z čárkovaného výřezu vlevo se stane celý kroužek vpravo
    for(const zn of [-1,1]){
      const x1=cx1, y1=cy+zn*rc, x2=cx2, y2=cy+zn*r;
      const t=xx=>y1+(y2-y1)*(xx-x1)/(x2-x1);
      const xa=cx1+r*0.75, xb=cx2-r*0.75;
      ctx.beginPath(); ctx.moveTo(xa,t(xa)); ctx.lineTo(xb,t(xb)); ctx.stroke();
    }
    ctx.restore();

    popis(cz(Z,1)+'×',w/2,cy-13,C.akcent,'bold 15px sans-serif');
    popis('zorné pole '+cz(FOVt,1)+'°',w/2,cy+15,C.muted,'10px sans-serif');

    popis('🌙 pouhým okem',cx1,cy+r+15,C.muted,'11px sans-serif');
    popis((G?'🎭':'🔭')+' okulárem · '+(G?'přímo':'vzhůru nohama'),cx2,cy+r+15,C.muted,'11px sans-serif');
    const navic=NEBE.filter(hv=>hv.m>6&&hv.m<=limD&&Math.hypot(hv.x,hv.y)<FOVt/2).length;
    if(navic&&cy+r+32<bandTop+bandH)
      popis('+ '+navic+' slabých hvězd, které okem nevidíš',cx2,cy+r+30,C.ok,'10px sans-serif');
  },

  stav(){
    const Z=this.zvetseni(), G=this.galileo(), L=this.tubus();
    return `<span class="znak">🔭</span> ${G?'Galileův':'Keplerův'}
      · Zvětšení <b>${cz(Z,1)}×</b> = f₁/f₂
      · Tubus <b>${cz(L,L%1?1:0)} cm</b> = f₁ ${G?'−':'+'} f₂
      · Zorné pole <b>${cz(this.zornePole(),1)}°</b>
      · Úhel <b>${cz(this.alfa)}°</b> → <b>${cz(this.beta())}°</b>
      · Světla <b>${Math.round(this.svetelnost())}×</b> víc než oko → hvězdy do <b>${cz(this.mezniMag(),1)} mag</b>
      · Výstupní pupila <b>${cz(this.vystupni(),1)} mm</b>
      · Obraz <b>${G?'přímý':'převrácený'}</b>`;
  }
};

const NAPOVEDA={
  lom:`<b>Odraz a lom světla</b><br>Na rozhraní dvou prostředí se část světla odrazí (úhel odrazu = úhel dopadu)
    a část projde a láme se podle <b>Snellova zákona</b>: n₁·sin α = n₂·sin β.<br><br>
    <b>Zkus si</b><br>• Táhni za <b>🔦 zdroj</b> – měníš úhel dopadu (šipky ←/→ po jednom stupni).<br>
    • <b>Klikni na popisek prostředí</b> vlevo a přepni materiál (vzduch → voda → sklo → diamant).<br>
    • Zapni <b>paprsek zdola</b> a pošli světlo z vody do vzduchu. Nad <b>mezním úhlem</b> už světlo ven neprojde – nastane <b>úplný odraz</b> (tak funguje optické vlákno).<br>
    • Diamant má obrovský index lomu, proto se v něm světlo tolik „chytá" a jiskří.`,
  cocka:`<b>Čočky a zrcadla</b><br>Obraz najdeš třemi význačnými paprsky: rovnoběžný s osou jde po lomu ohniskem,
    paprsek středem se nelomí a paprsek ohniskem vychází rovnoběžně.<br><br>
    <b>Zkus si</b><br>• <b>Chyť hrot předmětu</b> a posunuj ho – doleva a doprava měníš vzdálenost, nahoru a dolů výšku.<br>
    • <b>Táhni za bod F</b> na ose a měň ohniskovou vzdálenost.<br>
    • Posunuj předmět: dál než 2F → obraz zmenšený a převrácený; mezi F a 2F → zvětšený a převrácený; blíž než F → <b>zdánlivý</b>, přímý a zvětšený (lupa).<br>
    • Rozptylka a vypuklé zrcadlo dávají vždy zdánlivý zmenšený obraz (zpětné zrcátko).<br>
    • Platí <b>1/a + 1/a′ = 1/f</b> a zvětšení Z = −a′/a.`,
  hranol:`<b>Rozklad světla hranolem</b><br>Index lomu skla není pro všechny barvy stejný – modrá a fialová se lámou
    víc než červená. Bílé světlo se proto v hranolu rozloží na <b>spektrum</b> (disperze).<br><br>
    <b>Zkus si</b><br>• Táhni za <b>🔦 zdroj</b> – měníš úhel dopadu; za <b>🔄 uprostřed</b> hranolem otáčíš.<br>
    • Otáčej hranolem a hledej polohu, kde je odchýlení paprsku <b>nejmenší</b> (minimum deviace) – tak se měří index lomu skla.<br>
    • Zvyš <b>disperzi</b> a spektrum se roztáhne (skla se opravdu liší, proto se u objektivů kombinují).<br>
    • Při velkém úhlu může na výstupní stěně nastat úplný odraz a paprsek se v hranolu „zalomí".<br>
    • Stejný jev vytváří na obloze <b>duhu</b>, jen roli hranolu hrají kapky vody.`,
  dalekohled:`<b>Dalekohled</b><br>Objektiv s dlouhým ohniskem vytvoří ve své ohniskové rovině malý
    <b>skutečný převrácený obraz</b> a okulár se na něj dívá jako lupa. Ohniska obou čoček splývají,
    takže dovnitř i ven letí <b>rovnoběžný svazek</b> – mění se jen jeho úhel. Odtud
    <b>úhlové zvětšení Z = f₁ / f₂</b>.<br><br>
    <b>Zkus si</b><br>• Táhni za <b>⭐ hvězdu</b> (úhel α), za <b>okulár</b> (ohnisko f₂) nebo za
    <b>okraj objektivu</b> (průměr D).<br>
    • V nabídce <b>🎬 Ukázka</b> jsou čísla skutečných přístrojů – od divadelního kukátka
    přes dalekohled, kterým Galileo v roce 1609 poprvé uviděl měsíce Jupiteru, až po velký
    amatérský přístroj.<br>
    • Zkrať okulár: zvětšení roste, ale <b>zorné pole se úží</b> – čárkovaný výřez v levém
    kroužku se viditelně zmenší.<br>
    • Délka tubusu je <b>f₁ + f₂</b> – proto jsou hvězdářské dalekohledy tak dlouhé.<br>
    • Průměr objektivu zvětšení <b>nemění</b>, rozhoduje o tom, kolik světla dalekohled nasbírá.
    Zvětši D a v pravém kroužku přibudou slabé hvězdy.<br>
    • <b>Výstupní pupila</b> je Z× užší než objektiv. Menší než zornice oka (≈ 7 mm) → obraz
    tmavne; větší → část světla vedle oka propadne.<br>
    • Přepni na <b>🎭 Galileův</b>: okulár je rozptylka postavená ještě <i>před</i> ohniskovou rovinu.
    Obraz se nestihne vytvořit, tubus je jen <b>f₁ − f₂</b> a výsledek je <b>přímý</b> – tak fungují
    divadelní kukátka. Zorné pole je za to hodně úzké.<br>
    • Schéma je svisle roztažené, jinak by svazek pod úhlem kolem jednoho stupně splynul s osou.<br>
    • Kroužky dole srovnávají pohled okem a okulárem: <b>čárkovaný výřez</b> vlevo ukazuje, jak malý
    kousek oblohy dalekohled zabírá.`
};
const NAPOVEDY_DOLE={
  lom:'Táhni za 🔦 (nebo kamkoli nad rozhraní), klikni na popisek prostředí a přepneš materiál · šipky ←/→ a kolečko myši ladí po stupních.',
  cocka:'Táhni za hrot předmětu (vzdálenost i výška) nebo za bod F (ohnisko) · kolečkem myši ladíš hodnotu pod kurzorem.',
  hranol:'Táhni za 🔦 (úhel dopadu), za 🔄 uprostřed hranolu (otáčení) nebo za místo dopadu na stěně · kolečkem myši ladíš hodnotu pod kurzorem.',
  dalekohled:'Táhni za ⭐ hvězdu (úhel α), za okulár (ohnisko f₂) nebo za okraj objektivu (průměr D) · kolečkem myši ladíš hodnotu pod kurzorem.'};
let rezim='lom';

function prepni(r){
  rezim=r;
  for(const [id,t] of [['tabLom','lom'],['tabCocka','cocka'],['tabHranol','hranol'],['tabDalekohled','dalekohled']])
    $(id).classList.toggle('zap',t===r);
  $('panelLom').classList.toggle('skryto',r!=='lom');
  $('panelCocka').classList.toggle('skryto',r!=='cocka');
  $('panelHranol').classList.toggle('skryto',r!=='hranol');
  $('panelDalekohled').classList.toggle('skryto',r!=='dalekohled');
  $('infoText').innerHTML=NAPOVEDA[r];
  $('napoveda').textContent=NAPOVEDY_DOLE[r];
  kresli();
}
$('tabLom').onclick=()=>prepni('lom');
$('tabCocka').onclick=()=>prepni('cocka');
$('tabHranol').onclick=()=>prepni('hranol');
$('tabDalekohled').onclick=()=>prepni('dalekohled');
$('btnInfo').onclick=()=>$('infoBox').classList.toggle('skryto');
$('zavriInfo').onclick=()=>$('infoBox').classList.add('skryto');

['n1','n2','uhel','zdola','ukazOdraz'].forEach(id=>$(id).oninput=$(id).onchange=()=>{lom.nacti();kresli();});
['typ','f','a','vys','ukazVse'].forEach(id=>$(id).oninput=$(id).onchange=()=>{cocka.nacti();kresli();});
['hUhel','hPos','hN','hDisp','hOtoc'].forEach(id=>$(id).oninput=()=>{hranol.nacti();kresli();});
['dTyp','dF1','dF2','dD','dAlfa','dOsovy','dPohled'].forEach(id=>$(id).oninput=$(id).onchange=()=>{dalekohled.nacti();kresli();});
$('dPreset').onchange=()=>{
  const klic=$('dPreset').value, uk=PRESETY[klic];
  if(!uk) return;
  $('dTyp').value=uk.typ; $('dF1').value=uk.f1; $('dD').value=uk.D; $('dAlfa').value=uk.alfa;
  dalekohled.nacti();               // ohlídá strop f₂ podle typu a délky objektivu
  $('dF2').value=uk.f2;
  dalekohled.nacti();
  $('dPreset').value=klic;          // mezikrok výběr shodil, teď už hodnoty sedí
  kresli();
  if($('dTyp').obnovPrepinac) $('dTyp').obnovPrepinac();
};

/* ---------- tažení a klikání přímo v obrázku ---------- */
const MATERIALY=['1.0003','1.333','1.52','2.417'];
function poloha(e){
  const r=canvas.getBoundingClientRect();
  return [e.clientX-r.left,e.clientY-r.top];
}
function tahni(x,y,typ){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  if(rezim==='lom'){
    const px=w*0.46, y0=h*0.5;
    const dy=lom.zdola?(y-y0):(y0-y);
    if(dy<=0) return;
    $('uhel').value=Math.max(0,Math.min(89,Math.round(Math.atan2(Math.abs(px-x),dy)*DEG)));
    lom.nacti();
  }else if(rezim==='cocka'){
    const {cx,osaY,mer}=cocka.geo;
    if(typ==='ohnisko'){
      $('f').value=Math.max(4,Math.min(30,Math.round(Math.abs(cx-x)/mer)));
    }else{
      $('a').value=Math.max(3,Math.min(55,Math.round((cx-x)/mer)));
      $('vys').value=Math.max(2,Math.min(12,Math.round((osaY-y)/mer)));
    }
    cocka.nacti();
  }else if(rezim==='dalekohled'){
    const {objX,osaY,merX,merY,hvX}=dalekohled.geo;
    if(typ==='okular'){
      // posun okuláru mění jeho ohnisko: tubus je vždycky f₁ ± f₂
      const z=(x-objX)/merX;
      const f2=dalekohled.galileo()?dalekohled.f1-z:z-dalekohled.f1;
      const el=$('dF2');
      el.value=Math.max(2,Math.min(+el.max,Math.round(f2*2)/2));
    }else if(typ==='objektiv'){
      $('dD').value=Math.max(2,Math.min(20,Math.round((osaY-y)/merY*2)));
    }else{
      const dz=Math.max(10,(objX-hvX)/merX);
      $('dAlfa').value=Math.max(0,Math.min(30,Math.round(Math.atan((osaY-y)/merY/dz)*DEG*10)));
    }
    dalekohled.nacti();
  }else{
    const g=hranol.geometrie(w,h);
    if(typ==='hranol'){
      // otáčení kolem středu, relativně k místu uchopení (jinak by hranol poskočil)
      const u=Math.atan2(y-g.stred[1],x-g.stred[0])*DEG;
      if(Math.hypot(x-g.stred[0],y-g.stred[1])<14){   // u samotného středu není úhel určený
        tahne.uhel0=u; tahne.otoc0=hranol.otoc; return;
      }
      $('hOtoc').value=Math.max(-90,Math.min(90,Math.round(tahne.otoc0+u-tahne.uhel0)));
    }else if(typ==='vstup'){
      // posun místa dopadu po levé stěně
      const ex=g.B[0]-g.A[0], ey=g.B[1]-g.A[1];
      const t=((x-g.A[0])*ex+(y-g.A[1])*ey)/(ex*ex+ey*ey);
      $('hPos').value=Math.max(20,Math.min(80,Math.round(t*100)));
    }else{
      const t=hranol.pos/100;
      const vx=g.A[0]+(g.B[0]-g.A[0])*t, vy=g.A[1]+(g.B[1]-g.A[1])*t;
      $('hUhel').value=Math.max(10,Math.min(80,Math.round((g.normalaAB-Math.atan2(vy-y,vx-x))*DEG)));
    }
    hranol.nacti();
  }
  kresli();
}
canvas.addEventListener('pointerdown',e=>{
  const [x,y]=poloha(e);
  const u=najdiUchop(x,y);
  // popisky prostředí se chovají jako tlačítka, ne jako táhlo
  if(u&&(u.typ==='prostredi1'||u.typ==='prostredi2')){
    const sel=$(u.typ==='prostredi1'?'n1':'n2');
    sel.value=MATERIALY[(MATERIALY.indexOf(sel.value)+1)%MATERIALY.length];
    lom.nacti(); kresli();
    return;
  }
  tahne={typ:u?u.typ:'plocha',otoc0:hranol.otoc,uhel0:0};
  if(tahne.typ==='hranol'){
    const g=hranol.geometrie(canvas.clientWidth,canvas.clientHeight);
    tahne.uhel0=Math.atan2(y-g.stred[1],x-g.stred[0])*DEG;
  }
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  tahni(x,y,tahne.typ);
});
canvas.addEventListener('pointermove',e=>{
  const [x,y]=poloha(e);
  if(tahne){ tahni(x,y,tahne.typ); return; }
  const u=najdiUchop(x,y);
  if((u?u.typ:null)!==podKurzorem){ podKurzorem=u?u.typ:null; kresli(); }
  canvas.style.cursor=u?'grab':'crosshair';
});
canvas.addEventListener('pointerup',()=>{tahne=null;kresli();});
canvas.addEventListener('pointercancel',()=>{tahne=null;});
// kolečko myši ladí to, nad čím zrovna jsi (jinak hlavní veličinu záložky)
const KOLECKO={zdroj:'uhel',predmet:'a',ohnisko:'f',vstup:'hPos',hranol:'hOtoc',okular:'dF2',hvezda:'dAlfa',objektiv:'dD'};
canvas.addEventListener('wheel',e=>{
  const [x,y]=poloha(e);
  const u=najdiUchop(x,y);
  let id=u?KOLECKO[u.typ]:null;
  if(rezim==='hranol'&&u&&u.typ==='zdroj') id='hUhel';
  if(!id) id={lom:'uhel',cocka:'a',hranol:'hUhel',dalekohled:'dF1'}[rezim];
  const el=$(id), krok=(+el.step||1)*(e.deltaY<0?1:-1)*(e.shiftKey?5:1);
  el.value=Math.max(+el.min,Math.min(+el.max,+el.value+krok));
  el.dispatchEvent(new Event('input',{bubbles:true}));
  e.preventDefault();
},{passive:false});

// klávesnice: šipky doladí hlavní veličinu záložky
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  const posuvnik={lom:'uhel',cocka:'a',hranol:'hUhel',dalekohled:'dF1'}[rezim];
  const krok=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;
  if(!krok) return;
  const el=$(posuvnik);
  el.value=Math.max(+el.min,Math.min(+el.max,+el.value+krok*(e.shiftKey?5:1)));
  el.dispatchEvent(new Event('input',{bubbles:true}));
  e.preventDefault();
});

function kresli(){
  resize();
  const w=canvas.clientWidth, h=canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  uchopy=[];   // uchopovací body registruje kreslení znovu při každém překreslení
  if(rezim==='lom'){ lom.kresli(w,h); $('stav').innerHTML=lom.stav(); }
  else if(rezim==='cocka'){ cocka.kresli(w,h); $('stav').innerHTML=cocka.stav(); }
  else if(rezim==='hranol'){ hranol.kresli(w,h); $('stav').innerHTML=hranol.stav(); }
  else { dalekohled.kresli(w,h); $('stav').innerHTML=dalekohled.stav(); }
}
new ResizeObserver(()=>{resize();kresli();}).observe(canvas);
new MutationObserver(()=>{nactiBarvy();kresli();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

resize(); lom.nacti(); cocka.nacti(); hranol.nacti(); dalekohled.nacti(); prepni('lom');
/* rozbalovací seznamy nahrazujeme řadou tlačítek – míň klikání, všechny volby na očích */
function prepinace(){
  document.querySelectorAll('select.jakoTlacitka').forEach(sel=>{
    const box=document.createElement('div');
    box.className='prepinac';
    const obnov=()=>[...sel.options].forEach(o=>o.tlacitko.classList.toggle('zap',o.value===sel.value));
    [...sel.options].forEach(o=>{
      const b=document.createElement('button');
      b.textContent=o.dataset.krat||o.text;
      b.onclick=()=>{
        sel.value=o.value;
        sel.dispatchEvent(new Event('input',{bubbles:true}));
        sel.dispatchEvent(new Event('change',{bubbles:true}));
        obnov();
      };
      o.tlacitko=b; box.appendChild(b);
    });
    sel.after(box); sel.classList.add('skryto'); sel.obnovPrepinac=obnov; obnov();
    sel.addEventListener('change',obnov);
  });
}
prepinace();
</script>
