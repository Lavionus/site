<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydrosféra</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .popis-h { color: var(--text-muted); max-width: 560px; line-height: 1.55; }
    .nazev-h { font-size: 1.2rem; font-weight: 700; }
    .kolobeh { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; min-height: 46px; }
    .kolobeh .krok {
      background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 10px;
      padding: 8px 12px; font-size: 0.92rem; font-weight: 600;
    }
    .kolobeh .sipka { color: var(--text-faint); font-size: 1.3rem; }
  </style>
</head>
<body>
  <h1>🌊 Hydrosféra</h1>
  <p class="podtitul">Pro 6.–7. ročník: oceány, řeky, jezera, ledovce a koloběh vody.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="pojmy" class="active">📖 Vodstvo a pojmy</button>
    <button data-rezim="kolobeh">🔄 Koloběh vody</button>
    <button data-rezim="oceany">🌏 Oceány a moře</button>
    <button data-rezim="rekordy">📊 Rekordy a čísla</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Voda pokrývá <b>71 % povrchu</b> Země, ale sladká voda tvoří jen asi <b>3 %</b> –
    a většina z ní je vázaná v ledovcích. Voda v přírodě neustále koluje díky energii Slunce.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_z6_hydrosfera', $('skore'));
let rezim = 'pojmy';

const POJMY = [
  { n: 'pramen', o: 'místo, kde voda vyvěrá na povrch a začíná tok řeky' },
  { n: 'ústí', o: 'místo, kde se řeka vlévá do jiné řeky, jezera nebo moře' },
  { n: 'povodí', o: 'území, ze kterého odtéká voda do jedné řeky' },
  { n: 'úmoří', o: 'území, ze kterého voda odtéká do jednoho moře' },
  { n: 'přítok', o: 'menší řeka, která se vlévá do většího toku' },
  { n: 'rozvodí', o: 'hranice mezi dvěma povodími, obvykle hřeben pohoří' },
  { n: 'ledovec', o: 'mohutná masa ledu, která se vlastní vahou pomalu pohybuje' },
  { n: 'podzemní voda', o: 'voda ukrytá v půdě a horninách, čerpáme ji ze studní' },
];

const KOLOBEH = [
  '☀️ Slunce ohřívá vodní hladinu',
  '💨 voda se vypařuje do ovzduší',
  '☁️ pára kondenzuje a tvoří oblaka',
  '🌧️ voda padá zpět jako srážky',
  '🏞️ část odtéká řekami, část vsakuje do půdy',
  '🌊 řeky přivádějí vodu zpátky do moří',
];

const OCEANY = [
  { n: 'Tichý oceán', o: 'největší a nejhlubší oceán, leží v něm Mariánský příkop' },
  { n: 'Atlantský oceán', o: 'druhý největší oceán, odděluje Evropu a Ameriku' },
  { n: 'Indický oceán', o: 'teplý oceán mezi Afrikou, Asií a Austrálií' },
  { n: 'Severní ledový oceán', o: 'nejmenší a nejchladnější, z velké části pokrytý ledem' },
  { n: 'Jižní oceán', o: 'obklopuje Antarktidu, proudí v něm silné mořské proudy' },
];

const REKORDY = [
  { o: 'Kolik procent zemského povrchu pokrývá voda?', spr: 'asi 71 %', jine: ['asi 30 %', 'asi 50 %', 'asi 90 %'] },
  { o: 'Kolik z veškeré vody na Zemi je sladká?', spr: 'asi 3 %', jine: ['asi 30 %', 'asi 50 %', 'asi 70 %'] },
  { o: 'Která je nejdelší řeka světa?', spr: 'Nil (podle jiných měření Amazonka)',
    jine: ['Vltava', 'Dunaj', 'Temže'] },
  { o: 'Kde je největší zásoba sladké vody?', spr: 'v ledovcích', jine: ['v řekách', 'v jezerech', 'v mracích'] },
  { o: 'Která řeka protéká Prahou?', spr: 'Vltava', jine: ['Labe', 'Morava', 'Odra'] },
  { o: 'Do kterého moře odtéká většina vody z Česka?', spr: 'do Severního moře',
    jine: ['do Černého moře', 'do Baltského moře', 'do Středozemního moře'] },
  { o: 'Jak se nazývá nejhlubší místo oceánu?', spr: 'Mariánský příkop',
    jine: ['Grónský práh', 'Suezský průplav', 'Golfský proud'] },
];

/* ---- Vodstvo a pojmy ------------------------------------------------------------------- */
function pojmy() {
  const p = $('plocha');
  const u = Uloha.nahodne(POJMY);
  const jine = Uloha.zamichej(POJMY.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Který pojem odpovídá popisu?</div>
    <div class="karta"><div class="obrazek">💧</div><div class="popis-h">${u.o}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.o}.`,
    zpravaChyba: 'Zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Koloběh vody ----------------------------------------------------------------------- */
function kolobeh() {
  const p = $('plocha');
  p.innerHTML = '<div class="zadani">Seřaď koloběh vody v přírodě.</div>';
  const porada = document.createElement('div');
  porada.className = 'kolobeh';
  const nabidka = document.createElement('div');
  nabidka.className = 'nabidka';
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  let dalsiIndex = 0, chyboval = false;

  Uloha.zamichej(KOLOBEH).forEach(krok => {
    const b = document.createElement('button');
    b.textContent = krok;
    b.dataset.krok = krok;
    b.addEventListener('click', () => {
      if (b.disabled) return;
      if (krok === KOLOBEH[dalsiIndex]) {
        if (dalsiIndex > 0) {
          const s = document.createElement('span');
          s.className = 'sipka';
          s.textContent = '→';
          porada.appendChild(s);
        }
        const el = document.createElement('span');
        el.className = 'krok';
        el.textContent = krok;
        porada.appendChild(el);
        b.disabled = true;
        dalsiIndex++;
        odezva.className = 'odezva ok';
        odezva.textContent = '✅ Správně!';
        if (dalsiIndex === KOLOBEH.length) {
          odezva.textContent = '🎉 Koloběh se uzavřel – a začíná znovu!';
          skore.vyhodnot(!chyboval);
          setTimeout(novaUloha, Uloha.PRODLEVA + 600);
        }
      } else {
        chyboval = true;
        Uloha.trhni(b);
        odezva.className = 'odezva chyba';
        odezva.textContent = dalsiIndex === 0 ? 'Co dodává celému koloběhu energii?' : 'Tenhle krok přijde jindy.';
      }
    });
    nabidka.appendChild(b);
  });
  p.append(porada, nabidka, odezva);
}

/* ---- Oceány a moře ------------------------------------------------------------------------ */
function oceany() {
  const p = $('plocha');
  const u = Uloha.nahodne(OCEANY);
  const jine = Uloha.zamichej(OCEANY.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O který oceán jde?</div>
    <div class="karta"><div class="obrazek">🌏</div><div class="popis-h">${u.o}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.o}.`,
    zpravaChyba: 'Zkus jiný oceán.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Rekordy a čísla ---------------------------------------------------------------------- */
function rekordy() {
  const p = $('plocha');
  const u = Uloha.nahodne(REKORDY);
  p.innerHTML = `<div class="zadani">${u.o}</div>
    <div class="karta"><div class="obrazek">📊</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.spr, ...u.jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.spr,
    zpravaOk: `✅ ${u.spr}.`,
    zpravaChyba: 'Zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { pojmy, kolobeh, oceany, rekordy };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
