<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přímá a nepřímá úměrnost</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../uloha.js"></script>
  <style>
    .uloha-text { max-width: 620px; font-size: 1.05rem; line-height: 1.65; }
    .uloha-text b { color: var(--accent); }
    .trojclenka { font-family: 'Courier New', monospace; font-size: clamp(1rem, 3.6vw, 1.3rem);
      line-height: 1.7; text-align: left; display: inline-block; }
    .trojclenka .sipka { color: var(--accent); font-weight: 700; }
    .graf { width: min(320px, 80%); }
    .graf .osy { stroke: var(--text-muted); stroke-width: 2; }
    .graf .krivka { fill: none; stroke: var(--accent); stroke-width: 3; }
    .graf .popis { fill: var(--text-faint); font-size: 11px; }
    .tabulka-hodnot { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .tabulka-hodnot td, .tabulka-hodnot th {
      border: 1px solid var(--border-strong); padding: 7px 14px; font-size: 1rem;
    }
    .tabulka-hodnot th { color: var(--text-muted); font-weight: 600; background: var(--bg-control); }
    .tabulka-hodnot .otazka { color: var(--accent); font-weight: 700; }

    /* ---- živá úměrnost ---- */
    .scena { width: min(360px, 92%); }
    .scena .mrizka { stroke: var(--border); stroke-width: 0.9; }
    .scena .osy { stroke: var(--text-muted); stroke-width: 1.7; }
    .scena .krivka { fill: none; stroke: var(--accent); stroke-width: 3; }
    .scena .bod { fill: var(--warn); stroke: var(--bg-panel); stroke-width: 2; }
    .scena .vodici { stroke: var(--warn); stroke-width: 1.3; stroke-dasharray: 4 4; }
    .scena .popis { fill: var(--text-faint); font-size: 11px; text-anchor: middle; }

    .ovladace { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: center; max-width: 560px; }
    .ovladace label {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px; font-size: 0.8rem; color: var(--text-muted);
    }
    .ovladace input[type=range] { width: 150px; accent-color: var(--accent); }
    .ovladace .hodnota { color: var(--text); font-weight: 600; min-width: 2.6em; text-align: right;
      font-variant-numeric: tabular-nums; }
    .prepinac-druh { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .prepinac-druh button {
      background: var(--bg-control); border: 1px solid var(--border-strong); color: var(--text-muted);
      border-radius: 6px; padding: 5px 12px; font-size: 0.82rem; font-family: inherit; cursor: pointer;
    }
    .prepinac-druh button:hover { border-color: var(--accent); color: var(--text); }
    .prepinac-druh button.zap { background: var(--accent); border-color: var(--accent); color: #fff; }

    .konstanta {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 18px; max-width: 560px; font-variant-numeric: tabular-nums;
    }
    .konstanta .radek { font-size: 1rem; line-height: 1.9; color: var(--text-muted); }
    .konstanta .vysledek { font-size: 1.2rem; font-weight: 700; color: var(--ok); }
    .vysvetlivka { color: var(--text-faint); font-size: 0.82rem; max-width: 560px; line-height: 1.55; }
    .vysvetlivka b { color: var(--text-muted); }
  </style>
</head>
<body>
  <h1>📉 Přímá a nepřímá úměrnost</h1>
  <p class="podtitul">Pro 7. ročník: rozlišení úměrností, výpočet trojčlenkou a čtení grafu.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="ziva" class="active">🔗 Úměrnost naživo</button>
    <button data-rezim="rozliseni">🔀 Přímá, nebo nepřímá?</button>
    <button data-rezim="trojclenka">🧮 Vypočítej trojčlenkou</button>
    <button data-rezim="tabulka">🔢 Doplň tabulku</button>
    <button data-rezim="graf">📈 Poznej graf</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Přímá úměrnost</b>: kolikrát víc jednoho, tolikrát víc druhého (podíl je stálý, graf je přímka).
    <b>Nepřímá úměrnost</b>: kolikrát víc jednoho, tolikrát méně druhého (součin je stálý, graf je hyperbola).
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_m7_umernost', $('skore'));
let rezim = 'ziva';

const fmt = x => Number(Number(x).toFixed(2)).toLocaleString('cs-CZ');
function odezvaEl() { const d = document.createElement('div'); d.className = 'odezva'; return d; }

/* Úlohy: prima = přímá úměrnost, neprima = nepřímá.
   {a} první veličina, {b} druhá; hodnoty se dosazují za běhu. */
const SITUACE = [
  { druh: 'prima', text: '{a} rohlíků stojí {b} Kč.', otazka: 'Kolik Kč stojí {x} rohlíků?',
    jedA: 'rohlíků', jedB: 'Kč', duvod: 'Víc rohlíků – víc peněz.' },
  { druh: 'prima', text: 'Auto ujede za {a} hodiny {b} km.', otazka: 'Kolik km ujede za {x} hodiny?',
    jedA: 'h', jedB: 'km', duvod: 'Delší čas – delší dráha (při stejné rychlosti).' },
  { druh: 'prima', text: 'Na {a} m² spotřebujeme {b} litrů barvy.', otazka: 'Kolik litrů na {x} m²?',
    jedA: 'm²', jedB: 'l', duvod: 'Větší plocha – víc barvy.' },
  { druh: 'prima', text: '{a} sešitů váží {b} gramů.', otazka: 'Kolik gramů váží {x} sešitů?',
    jedA: 'sešitů', jedB: 'g', duvod: 'Víc sešitů – větší hmotnost.' },
  { druh: 'neprima', text: '{a} dělníků postaví zeď za {b} dní.', otazka: 'Za kolik dní ji postaví {x} dělníků?',
    jedA: 'dělníků', jedB: 'dní', duvod: 'Víc dělníků – kratší čas.' },
  { druh: 'neprima', text: 'Při rychlosti {a} km/h trvá cesta {b} hodin.', otazka: 'Jak dlouho potrvá při {x} km/h?',
    jedA: 'km/h', jedB: 'h', duvod: 'Vyšší rychlost – kratší čas.' },
  { druh: 'neprima', text: 'Zásoby vystačí {a} lidem na {b} dní.', otazka: 'Na kolik dní vystačí {x} lidem?',
    jedA: 'lidem', jedB: 'dní', duvod: 'Víc strávníků – kratší doba.' },
  { druh: 'neprima', text: 'Bazén naplní {a} čerpadel za {b} minut.', otazka: 'Za kolik minut ho naplní {x} čerpadel?',
    jedA: 'čerpadel', jedB: 'min', duvod: 'Víc čerpadel – kratší čas.' },
];

/* Vytvoří konkrétní čísla tak, aby výsledek vyšel hezky. */
function priklad(situace) {
  const a = Uloha.nahodneCislo(2, 9);
  const nasobek = Uloha.nahodneCislo(2, 6);
  const x = a * nasobek;
  let b, vysledek;
  if (situace.druh === 'prima') {
    b = Uloha.nahodneCislo(2, 30);
    vysledek = b * nasobek;
  } else {
    b = Uloha.nahodneCislo(2, 12) * nasobek;    // ať dělení vyjde celé
    vysledek = b / nasobek;
  }
  return { a, b, x, vysledek };
}

/* ---- Úměrnost naživo ---------------------------------------------------------------
   Jedním posuvníkem se mění první veličina; druhá se dopočítá. Vedle běží graf
   a hlavně konstanta – u přímé zůstává podíl, u nepřímé součin. */
const ZU = { druh: 'prima', x: 4, situace: null, k: 12 };

const ZIVE_SITUACE = {
  prima: [
    { a: 'rohlíků', b: 'Kč', text: n => `${n} rohlíků`, text2: n => `${n} Kč`, k: 4 },
    { a: 'hodin', b: 'km', text: n => `${n} h jízdy`, text2: n => `${n} km`, k: 60 },
    { a: 'm²', b: 'l barvy', text: n => `${n} m² stěny`, text2: n => `${n} l barvy`, k: 3 },
  ],
  neprima: [
    { a: 'dělníků', b: 'dní', text: n => `${n} dělníků`, text2: n => `${n} dní`, k: 48 },
    { a: 'km/h', b: 'h', text: n => `rychlost ${n} km/h`, text2: n => `${n} h cesty`, k: 240 },
    { a: 'čerpadel', b: 'min', text: n => `${n} čerpadel`, text2: n => `${n} min`, k: 120 },
  ],
};

function ziva() {
  if (!ZU.situace) {
    ZU.situace = Uloha.nahodne(ZIVE_SITUACE[ZU.druh]);
    ZU.k = ZU.situace.k;
    ZU.x = 4;
  }
  const p = $('plocha');
  const prima = ZU.druh === 'prima';
  p.innerHTML = `
    <div class="zadani uloha-text" style="max-width:560px">Posuvníkem měň první veličinu.
      U <b>přímé</b> úměrnosti zůstává stálý <b>podíl</b>, u <b>nepřímé</b> <b>součin</b> —
      sleduj zelené číslo dole, to se měnit nesmí.</div>
    <div class="prepinac-druh" id="druhy">
      <button data-druh="prima"${prima ? ' class="zap"' : ''}>📈 Přímá úměrnost</button>
      <button data-druh="neprima"${prima ? '' : ' class="zap"'}>📉 Nepřímá úměrnost</button>
    </div>
    <svg class="scena" id="scenaZu" viewBox="0 0 320 260" role="img"
         aria-label="Graf umernosti"></svg>
    <div class="ovladace">
      <label>
        <span id="jmenoVeliciny"></span>
        <input type="range" id="posZu" min="1" max="12" step="1" value="${ZU.x}">
        <span class="hodnota" id="hodZu"></span>
      </label>
    </div>
    <div class="konstanta" id="konstantaZu"></div>
    <p class="vysvetlivka" id="poznamkaZu"></p>`;

  $('druhy').addEventListener('click', e => {
    const b = e.target.closest('button[data-druh]');
    if (!b) return;
    ZU.druh = b.dataset.druh;
    ZU.situace = null;
    ziva();
  });
  $('posZu').addEventListener('input', e => { ZU.x = +e.target.value; kresliZivou(); });
  kresliZivou();
}

function kresliZivou() {
  if (!$('scenaZu')) return;
  const prima = ZU.druh === 'prima';
  const s = ZU.situace, k = ZU.k, x = ZU.x;
  const y = prima ? k * x : k / x;

  // měřítko podle největší zobrazované hodnoty
  const maxY = prima ? k * 12 : k / 1;
  const OSA_X = 224, X0 = 40, SIR = 250, VYS = 190;
  const X = v => X0 + v / 12 * SIR;
  const Y = v => OSA_X - Math.min(v, maxY) / maxY * VYS;

  let mrizka = '';
  for (let i = 2; i <= 12; i += 2) mrizka += `<line class="mrizka" x1="${X(i)}" y1="24" x2="${X(i)}" y2="${OSA_X}"/>`;

  let d = '';
  for (let t = 1; t <= 12; t += 0.1) {
    const v = prima ? k * t : k / t;
    d += (d ? 'L' : 'M') + X(t).toFixed(1) + ',' + Y(v).toFixed(1) + ' ';
  }
  if (prima) d = `M${X(0)},${Y(0)} ` + d;      // přímá úměrnost jde počátkem

  $('scenaZu').innerHTML = mrizka +
    `<line class="osy" x1="${X0}" y1="${OSA_X}" x2="${X0 + SIR + 12}" y2="${OSA_X}"/>
     <line class="osy" x1="${X0}" y1="20" x2="${X0}" y2="${OSA_X}"/>
     <path class="krivka" d="${d}"/>
     <line class="vodici" x1="${X(x)}" y1="${Y(y)}" x2="${X(x)}" y2="${OSA_X}"/>
     <line class="vodici" x1="${X0}" y1="${Y(y)}" x2="${X(x)}" y2="${Y(y)}"/>
     <circle class="bod" cx="${X(x)}" cy="${Y(y)}" r="6"/>
     <text class="popis" x="${X0 + SIR / 2}" y="${OSA_X + 22}">${s.a}</text>
     <text class="popis" x="${X0 - 4}" y="14">${s.b}</text>`;

  $('jmenoVeliciny').textContent = s.a;
  $('hodZu').textContent = x;
  $('konstantaZu').innerHTML =
    `<div class="radek">${s.text(x)} &nbsp;→&nbsp; <b>${s.text2(fmt(y))}</b></div>` +
    (prima
      ? `<div class="radek vysledek">podíl ${fmt(y)} ÷ ${x} = ${fmt(y / x)} (stálý)</div>`
      : `<div class="radek vysledek">součin ${x} · ${fmt(y)} = ${fmt(x * y)} (stálý)</div>`);

  $('poznamkaZu').innerHTML = prima
    ? 'Graf přímé úměrnosti je <b>přímka procházející počátkem</b>. Kolikrát se zvětší '
      + 'první veličina, tolikrát se zvětší i druhá.'
    : 'Graf nepřímé úměrnosti je <b>hyperbola</b> — nikdy se nedotkne os. Kolikrát se zvětší '
      + 'první veličina, tolikrát se druhá zmenší.';
}

/* ---- Přímá, nebo nepřímá? ------------------------------------------------------------- */
function rozliseni() {
  const p = $('plocha');
  const s = Uloha.nahodne(SITUACE);
  const { a, b } = priklad(s);
  p.innerHTML = `<div class="zadani uloha-text">${s.text.replace('{a}', a).replace('{b}', b)}
    <br>O jakou úměrnost jde?</div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'prima', ikona: '📈', popis: 'přímá úměrnost' },
      { klic: 'neprima', ikona: '📉', popis: 'nepřímá úměrnost' },
    ],
    spravnyKlic: s.druh,
    zpravaOk: `✅ ${s.druh === 'prima' ? 'Přímá' : 'Nepřímá'} úměrnost. ${s.duvod}`,
    zpravaChyba: 'Zeptej se: když se první veličina zvětší, zvětší se i druhá, nebo se zmenší?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Vypočítej trojčlenkou ------------------------------------------------------------ */
function trojclenka() {
  const p = $('plocha');
  const s = Uloha.nahodne(SITUACE);
  const { a, b, x, vysledek } = priklad(s);
  const prima = s.druh === 'prima';

  const jine = new Set();
  let pojistka = 0;
  while (jine.size < 3 && pojistka++ < 200) {
    const k = Uloha.nahodne([b, b * 2, vysledek + b, Math.round(b * b / x), Math.round(a * b / x), vysledek * 2]);
    if (k > 0 && k !== vysledek) jine.add(fmt(k));
  }

  p.innerHTML = `<div class="zadani uloha-text">${s.text.replace('{a}', a).replace('{b}', b)}
      <br><b>${s.otazka.replace('{x}', x)}</b></div>
    <div class="karta"><div class="trojclenka">
      ${a} ${s.jedA} …… ${b} ${s.jedB}<br>
      ${x} ${s.jedA} …… <span class="sipka">?</span> ${s.jedB}<br>
      <span style="color:var(--text-faint);font-size:0.8em">šipky ${prima ? 'stejným směrem (přímá)' : 'opačným směrem (nepřímá)'}</span>
    </div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(vysledek), ...jine]).map(t => ({ klic: t, popis: t + ' ' + s.jedB })),
    spravnyKlic: fmt(vysledek),
    zpravaOk: prima
      ? `✅ ${b} · ${x}/${a} = ${fmt(vysledek)} ${s.jedB}`
      : `✅ ${b} · ${a}/${x} = ${fmt(vysledek)} ${s.jedB}`,
    zpravaChyba: prima
      ? 'U přímé úměrnosti násob poměrem, o který se první veličina zvětšila.'
      : 'U nepřímé úměrnosti poměr obrať – čím víc, tím míň.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Doplň tabulku --------------------------------------------------------------------- */
function tabulka() {
  const p = $('plocha');
  const prima = Math.random() < 0.5;
  const zaklad = Uloha.nahodneCislo(2, 6);
  const konstanta = prima ? Uloha.nahodneCislo(2, 9) : zaklad * Uloha.nahodneCislo(4, 12) * 6;
  const xs = [zaklad, zaklad * 2, zaklad * 3, zaklad * 6];
  const ys = xs.map(x => prima ? x * konstanta : konstanta / x);
  const skryty = Uloha.nahodneCislo(1, 3);

  const jine = new Set();
  let pojistka = 0;
  while (jine.size < 3 && pojistka++ < 200) {
    const k = Uloha.nahodne([ys[skryty] * 2, ys[skryty] / 2, ys[skryty] + xs[skryty], ys[0], ys[3]]);
    if (k > 0 && Math.abs(k - ys[skryty]) > 0.001) jine.add(fmt(k));
  }

  p.innerHTML = `<div class="zadani">Tabulka zachycuje <b>${prima ? 'přímou' : 'nepřímou'}</b> úměrnost.
      Jaké číslo patří na místo otazníku?</div>
    <div class="karta"><table class="tabulka-hodnot">
      <tr><th>x</th>${xs.map(x => `<td>${fmt(x)}</td>`).join('')}</tr>
      <tr><th>y</th>${ys.map((y, i) => i === skryty ? '<td class="otazka">?</td>' : `<td>${fmt(y)}</td>`).join('')}</tr>
    </table></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(ys[skryty]), ...jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: fmt(ys[skryty]),
    zpravaOk: prima
      ? `✅ Podíl y : x je stále ${fmt(konstanta)}, proto y = ${fmt(xs[skryty])} · ${fmt(konstanta)} = ${fmt(ys[skryty])}.`
      : `✅ Součin x · y je stále ${fmt(konstanta)}, proto y = ${fmt(konstanta)} : ${fmt(xs[skryty])} = ${fmt(ys[skryty])}.`,
    zpravaChyba: prima ? 'U přímé úměrnosti je podíl y : x pořád stejný.' : 'U nepřímé úměrnosti je součin x · y pořád stejný.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Poznej graf ------------------------------------------------------------------------ */
function svgGraf(druh) {
  let d = '';
  if (druh === 'prima') d = 'M30 150 L170 30';
  else if (druh === 'neprima') {
    const body = [];
    for (let x = 35; x <= 170; x += 5) body.push(`${x} ${Math.min(150, 30 + 2600 / (x - 20))}`);
    d = 'M' + body.join(' L');
  } else d = 'M30 90 L170 90';   // konstantní závislost
  return `<svg class="graf" viewBox="0 0 200 180">
    <line class="osy" x1="30" y1="10" x2="30" y2="160"/>
    <line class="osy" x1="20" y1="150" x2="185" y2="150"/>
    <text class="popis" x="8" y="16">y</text>
    <text class="popis" x="180" y="168">x</text>
    <path class="krivka" d="${d}"/>
  </svg>`;
}
function graf() {
  const p = $('plocha');
  const druh = Uloha.nahodne(['prima', 'neprima', 'zadna']);
  p.innerHTML = `<div class="zadani">Jakou závislost ukazuje graf?</div>
    <div class="karta">${svgGraf(druh)}</div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([
      { klic: 'prima', popis: 'přímá úměrnost' },
      { klic: 'neprima', popis: 'nepřímá úměrnost' },
      { klic: 'zadna', popis: 'ani jedna – y se nemění' },
    ]),
    spravnyKlic: druh,
    zpravaOk: druh === 'prima' ? '✅ Přímka procházející počátkem – přímá úměrnost.'
      : druh === 'neprima' ? '✅ Hyperbola – nepřímá úměrnost (součin x · y je stálý).'
      : '✅ Vodorovná přímka: y je pořád stejné, o úměrnost nejde.',
    zpravaChyba: 'Přímá úměrnost je přímka z počátku, nepřímá klesající hyperbola.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { ziva, rozliseni, trojclenka, tabulka, graf };
function novaUloha() {
  if (rezim === 'ziva') { ZU.situace = null; ziva(); return; }
  REZIMY[rezim]();
}

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  $('btnDalsi').textContent = rezim === 'ziva' ? '🎲 Jiná situace' : 'Přeskočit →';
  novaUloha();
}));
$('btnDalsi').textContent = rezim === 'ziva' ? '🎲 Jiná situace' : 'Přeskočit →';
$('btnDalsi').addEventListener('click', novaUloha);
novaUloha();
</script>
</body>
</html>
