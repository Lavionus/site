<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práce, výkon a energie</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .uloha-text { max-width: 620px; font-size: 1.02rem; line-height: 1.6; }
    .uloha-text b { color: var(--accent); }
    .vzorec { font-family: 'Courier New', monospace; color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; }
    .scena { width: min(340px, 86%); }
    .scena .zeme { stroke: var(--border-strong); stroke-width: 3; }
    .scena .drah { stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: 6 5; }
    .scena .telo { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
    .scena .popis { fill: var(--text-muted); font-size: 12px; text-anchor: middle; }
    .scena .kulicka { fill: var(--warn); }
  </style>
</head>
<body>
  <h1>🔧 Práce, výkon a energie</h1>
  <p class="podtitul">Pro 8. ročník: mechanická práce, výkon a přeměny energie.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="prace" class="active">💪 Práce</button>
    <button data-rezim="vykon">⚡ Výkon</button>
    <button data-rezim="energie">🎢 Polohová a pohybová energie</button>
    <button data-rezim="premeny">🔄 Přeměny energie</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Práce <b>W = F · s</b> [J], výkon <b>P = W / t</b> [W], polohová energie <b>E<sub>p</sub> = m · g · h</b>,
    pohybová energie <b>E<sub>k</sub> = ½ · m · v²</b>. Energie se neztrácí, jen se <b>mění na jinou</b>.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_f8_prace_energie', $('skore'));
let rezim = 'prace';
const fmt = x => Number(Number(x).toFixed(2)).toLocaleString('cs-CZ');
function odezvaEl() { const d = document.createElement('div'); d.className = 'odezva'; return d; }

const CINNOSTI = [
  { co: 'táhne bednu po podlaze', ikona: '📦' }, { co: 'zvedá tašku s nákupem', ikona: '🛍️' },
  { co: 'tlačí kolečko na stavbě', ikona: '🛒' }, { co: 'vytahuje kbelík ze studny', ikona: '🪣' },
];
function prace() {
  const p = $('plocha');
  const c = Uloha.nahodne(CINNOSTI);
  const F = Uloha.nahodneCislo(2, 40) * 5;
  const s = Uloha.nahodneCislo(2, 20);
  const W = F * s;
  const jine = new Set([fmt(F + s), fmt(W / 2), fmt(F * s * 2), fmt(F / s)]);
  jine.delete(fmt(W));

  p.innerHTML = `<div class="zadani uloha-text">${c.ikona} Člověk ${c.co} silou <b>${F} N</b>
      po dráze <b>${s} m</b>. Jakou vykoná práci?</div>
    <div class="karta"><svg class="scena" viewBox="0 0 320 120">
      <line class="zeme" x1="10" y1="90" x2="310" y2="90"/>
      <rect class="telo" x="40" y="55" width="46" height="35" rx="5"/>
      <line class="drah" x1="90" y1="72" x2="260" y2="72"/>
      <text class="popis" x="175" y="64">s = ${s} m</text>
      <text class="popis" x="63" y="46">F = ${F} N</text>
    </svg><div class="vzorec">W = F · s</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(W), ...[...jine].slice(0, 3)]).map(t => ({ klic: t, popis: t + ' J' })),
    spravnyKlic: fmt(W),
    zpravaOk: `✅ W = ${F} · ${s} = ${fmt(W)} J`,
    zpravaChyba: 'Práce je součin síly a dráhy ve směru síly.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

function vykon() {
  const p = $('plocha');
  const W = Uloha.nahodneCislo(10, 120) * 100;
  const t = Uloha.nahodne([5, 10, 20, 30, 60]);
  const P = W / t;
  const hledameCas = Math.random() < 0.3;
  const vysledek = hledameCas ? t : P;
  const jednotka = hledameCas ? 's' : 'W';
  const jine = new Set([fmt(W * t), fmt(vysledek * 2), fmt(vysledek / 2), fmt(W - t)]);
  jine.delete(fmt(vysledek));

  p.innerHTML = `<div class="zadani uloha-text">${hledameCas
    ? `Stroj s výkonem <b>${fmt(P)} W</b> vykoná práci <b>${W.toLocaleString('cs-CZ')} J</b>. Jak dlouho pracoval?`
    : `Stroj vykoná práci <b>${W.toLocaleString('cs-CZ')} J</b> za <b>${t} s</b>. Jaký má výkon?`}</div>
    <div class="karta"><div class="vzorec">P = W / t &nbsp;·&nbsp; 1 W = 1 J/s</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(vysledek), ...[...jine].slice(0, 3)]).map(x => ({ klic: x, popis: x + ' ' + jednotka })),
    spravnyKlic: fmt(vysledek),
    zpravaOk: hledameCas
      ? `✅ t = W / P = ${W} / ${fmt(P)} = ${t} s`
      : `✅ P = ${W} / ${t} = ${fmt(P)} W`,
    zpravaChyba: 'Výkon říká, jak rychle se práce koná – práci dělíme časem.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

function energie() {
  const p = $('plocha');
  const polohova = Math.random() < 0.5;
  const m = Uloha.nahodneCislo(1, 20);
  const h = Uloha.nahodneCislo(2, 20);
  const v = Uloha.nahodneCislo(2, 12);
  const Ep = m * 10 * h, Ek = 0.5 * m * v * v;
  const vysledek = polohova ? Ep : Ek;
  const jine = new Set([fmt(polohova ? Ek : Ep), fmt(vysledek * 2), fmt(vysledek / 2), fmt(m * (polohova ? h : v))]);
  jine.delete(fmt(vysledek));

  p.innerHTML = `<div class="zadani uloha-text">${polohova
    ? `Těleso o hmotnosti <b>${m} kg</b> je ve výšce <b>${h} m</b>. Jakou má polohovou energii? (g = 10 N/kg)`
    : `Těleso o hmotnosti <b>${m} kg</b> se pohybuje rychlostí <b>${v} m/s</b>. Jakou má pohybovou energii?`}</div>
    <div class="karta"><svg class="scena" viewBox="0 0 320 140">
      <line class="zeme" x1="10" y1="120" x2="310" y2="120"/>
      ${polohova
        ? `<circle class="kulicka" cx="160" cy="30" r="12"/>
           <line class="drah" x1="160" y1="42" x2="160" y2="120"/>
           <text class="popis" x="196" y="82">h = ${h} m</text>`
        : `<circle class="kulicka" cx="120" cy="104" r="12"/>
           <line class="drah" x1="136" y1="104" x2="250" y2="104"/>
           <text class="popis" x="196" y="94">v = ${v} m/s</text>`}
    </svg><div class="vzorec">${polohova ? 'Ep = m · g · h' : 'Ek = ½ · m · v²'}</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([fmt(vysledek), ...[...jine].slice(0, 3)]).map(x => ({ klic: x, popis: x + ' J' })),
    spravnyKlic: fmt(vysledek),
    zpravaOk: polohova
      ? `✅ Ep = ${m} · 10 · ${h} = ${fmt(Ep)} J`
      : `✅ Ek = ½ · ${m} · ${v}² = ${fmt(Ek)} J`,
    zpravaChyba: polohova
      ? 'Polohová energie roste s hmotností i výškou.'
      : 'Rychlost se umocňuje na druhou – dvojnásobná rychlost znamená čtyřnásobnou energii.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const PREMENY = [
  { s: 'Míč padá z výšky k zemi.', a: 'polohová energie se mění na pohybovou', b: ['pohybová na polohovou', 'teplo na světlo', 'chemická na jadernou'] },
  { s: 'Sáňkař vyjíždí na kopec.', a: 'pohybová energie se mění na polohovou', b: ['polohová na pohybovou', 'elektrická na teplo', 'zvuková na světelnou'] },
  { s: 'Vodní elektrárna vyrábí proud.', a: 'polohová energie vody se mění na elektrickou', b: ['elektrická na polohovou', 'chemická na světelnou', 'jaderná na zvukovou'] },
  { s: 'Baterie napájí svítilnu.', a: 'chemická energie se mění na elektrickou a pak na světlo a teplo', b: ['světlo na chemickou', 'polohová na elektrickou', 'zvuk na teplo'] },
  { s: 'Auto brzdí a kotouče se zahřejí.', a: 'pohybová energie se mění na teplo', b: ['teplo na pohybovou', 'polohová na chemickou', 'elektrická na světelnou'] },
  { s: 'Fotovoltaický panel na střeše.', a: 'energie záření se mění na elektrickou', b: ['elektrická na chemickou', 'teplo na polohovou', 'zvuk na elektrickou'] },
  { s: 'Napnutá tětiva luku vystřelí šíp.', a: 'pružná energie se mění na pohybovou', b: ['pohybová na chemickou', 'teplo na světlo', 'jaderná na elektrickou'] },
  { s: 'Kyvadlo se houpe z krajní polohy dolů a zase nahoru.', a: 'polohová a pohybová energie se stále přeměňují jedna v druhou', b: ['energie se ztrácí okamžitě', 'vzniká nová energie', 'polohová energie roste bez omezení'] },
];
function premeny() {
  const p = $('plocha');
  const u = Uloha.nahodne(PREMENY);
  p.innerHTML = `<div class="zadani uloha-text">${u.s}<br>Jaká přeměna energie probíhá?</div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.a, ...u.b]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.a,
    zpravaOk: `✅ ${u.a}`,
    zpravaChyba: 'Energie nevzniká ani nemizí – jen se mění z jedné formy na druhou.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { prace, vykon, energie, premeny };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
novaUloha();
</script>
</body>
</html>
