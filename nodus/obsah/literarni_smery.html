<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Literární směry a autoři</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    /* Vzhled kvízu (plocha, možnosti, odezva, kartičky) řeší vyuka.css – tady
       zůstávají jen styly přehledu směrů, který má tahle stránka vlastní. */
    .smer { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; margin-bottom: 12px; max-width: 860px; transition: border-color 0.2s; }
    .smer h2 { font-size: 1.05rem; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .smer h2 .obdobi { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
    .smer .znaky { color: var(--text-muted); font-size: 0.88rem; margin: 6px 0 10px; }
    .smer table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .smer td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    .smer td:first-child { font-weight: 600; white-space: nowrap; }
    .smer td:last-child { color: var(--text-muted); }
    /* přehled žije: po odpovědi se rozsvítí směr a autor, o které v úloze šlo */
    .smer.sviti { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .smer tr.sviti td { color: var(--ok-text); }
    .dotaz { font-size: clamp(1.3rem, 5vw, 1.9rem); font-weight: 700; }
    .moznosti.smery button { max-width: 100%; text-align: left; font-size: 0.98rem; }
  </style>
</head>
<body>
  <h1>📚 Literární směry a autoři</h1>
  <p class="podtitul">Přehled hlavních směrů, autorů a děl + kvíz (SŠ, maturitní minimum).</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="prehled" class="active">📖 Přehled</button>
    <button data-rezim="autor">✍️ Autor → směr</button>
    <button data-rezim="dilo">📕 Dílo → autor</button>
    <button data-rezim="obdobi">🕰️ Směr → období</button>
  </div>

  <div class="plocha" id="plocha" style="display:none"></div>

  <div class="ovladani" id="ovladani" style="display:none">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <button id="btnNapoveda">💡 Nápověda</button>
    <span class="serie" id="serie"></span>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda" id="klavesy" style="display:none">
    Směr se dá skoro vždycky odhadnout z <b>doby</b>: kdy autor žil, takový směr ho
    obklopoval. Celý přehled zůstává pod úlohou.
    Klávesy: <kbd>H</kbd> nápověda · <kbd>Enter</kbd> další.
  </p>

  <div id="prehled"></div>

<script>
const SMERY = [
  { nazev: 'Antika', obdobi: '8. st. př. n. l. – 5. st. n. l.',
    znaky: 'Základ evropské literatury; epika, lyrika i drama, důraz na harmonii a míru.',
    autori: [['Homér', 'Ilias, Odyssea'], ['Sofoklés', 'Král Oidipús, Antigona'], ['Ovidius', 'Proměny'], ['Vergilius', 'Aeneis']] },
  { nazev: 'Středověk', obdobi: '5.–15. století',
    znaky: 'Náboženská i světská tvorba, legendy, kroniky, rytířská epika; anonymita autorů.',
    autori: [['(anonym)', 'Legenda o sv. Václavu'], ['Kosmas', 'Kronika česká'], ['(anonym)', 'Dalimilova kronika'], ['Jan Hus', 'O církvi, listy z Kostnice']] },
  { nazev: 'Renesance a humanismus', obdobi: '14.–16. století',
    znaky: 'Návrat k antice, zájem o člověka a pozemský život, rozvoj národních jazyků.',
    autori: [['Dante Alighieri', 'Božská komedie'], ['Giovanni Boccaccio', 'Dekameron'], ['William Shakespeare', 'Hamlet, Romeo a Julie'], ['Miguel de Cervantes', 'Důmyslný rytíř Don Quijote']] },
  { nazev: 'Baroko', obdobi: '17.–18. století',
    znaky: 'Zbožnost, kontrasty, pomíjivost světa; v Čechách exulantská a lidová tvorba.',
    autori: [['Jan Amos Komenský', 'Labyrint světa a ráj srdce'], ['Bedřich Bridel', 'Co Bůh? Člověk?'], ['Hans Ch. von Grimmelshausen', 'Simplicius Simplicissimus']] },
  { nazev: 'Klasicismus a osvícenství', obdobi: '17.–18. století',
    znaky: 'Řád, rozum, pevná pravidla; vysoké a nízké žánry; víra v pokrok a vzdělání.',
    autori: [['Molière', 'Lakomec, Tartuffe'], ['Voltaire', 'Candide'], ['Daniel Defoe', 'Robinson Crusoe']] },
  { nazev: 'Národní obrození', obdobi: 'konec 18. – pol. 19. století',
    znaky: 'Obnova českého jazyka a kultury, sběr lidové slovesnosti, vlastenectví.',
    autori: [['Josef Dobrovský', 'Zevrubná mluvnice jazyka českého'], ['Josef Jungmann', 'Slovník česko-německý'], ['František Palacký', 'Dějiny národu českého'], ['Karel Jaromír Erben', 'Kytice'], ['Božena Němcová', 'Babička']] },
  { nazev: 'Romantismus', obdobi: '1. pol. 19. století',
    znaky: 'Cit, individualita, rozpor snu a skutečnosti, výjimečný hrdina, příroda.',
    autori: [['Karel Hynek Mácha', 'Máj'], ['Victor Hugo', 'Chrám Matky Boží v Paříži, Bídníci'], ['Alexandr S. Puškin', 'Evžen Oněgin'], ['E. A. Poe', 'Havran']] },
  { nazev: 'Realismus a naturalismus', obdobi: '2. pol. 19. století',
    znaky: 'Pravdivé zobrazení skutečnosti, typizace, kritika společnosti.',
    autori: [['Jan Neruda', 'Povídky malostranské'], ['Alois Jirásek', 'Staré pověsti české, F. L. Věk'], ['Honoré de Balzac', 'Otec Goriot'], ['Lev N. Tolstoj', 'Vojna a mír'], ['Fjodor M. Dostojevskij', 'Zločin a trest'], ['Émile Zola', 'Zabiják']] },
  { nazev: 'Moderna přelomu století', obdobi: 'konec 19. – zač. 20. století',
    znaky: 'Symbolismus, impresionismus, dekadence; důraz na dojem, symbol, hudebnost verše.',
    autori: [['Charles Baudelaire', 'Květy zla'], ['Paul Verlaine', 'Saturnské básně'], ['Antonín Sova', 'Květy intimních nálad'], ['Otokar Březina', 'Tajemné dálky'], ['Petr Bezruč', 'Slezské písně']] },
  { nazev: 'Avantgarda', obdobi: '1. pol. 20. století',
    znaky: 'Experiment, poetismus a surrealismus; hravost, asociace, obraznost.',
    autori: [['Vítězslav Nezval', 'Edison, Sbohem a šáteček'], ['Jaroslav Seifert', 'Na vlnách TSF; nositel Nobelovy ceny'], ['Guillaume Apollinaire', 'Pásmo (Alkoholy)'], ['André Breton', 'Manifest surrealismu']] },
  { nazev: 'Meziválečná próza', obdobi: '20.–30. léta 20. století',
    znaky: 'Demokratický proud, legionářská a společenská próza, expresionismus, pražská německá literatura.',
    autori: [['Karel Čapek', 'R.U.R., Válka s mloky, Bílá nemoc'], ['Jaroslav Hašek', 'Osudy dobrého vojáka Švejka'], ['Franz Kafka', 'Proměna, Proces'], ['Ivan Olbracht', 'Nikola Šuhaj loupežník'], ['E. M. Remarque', 'Na západní frontě klid'], ['Ernest Hemingway', 'Stařec a moře, Sbohem armádo']] },
  { nazev: 'Literatura 2. pol. 20. století', obdobi: 'po roce 1945',
    znaky: 'Reakce na válku a totalitu; oficiální, exilová a samizdatová větev; absurdní drama.',
    autori: [['Bohumil Hrabal', 'Ostře sledované vlaky, Obsluhoval jsem anglického krále'], ['Milan Kundera', 'Žert, Nesnesitelná lehkost bytí'], ['Josef Škvorecký', 'Zbabělci'], ['Václav Havel', 'Zahradní slavnost, Audience'], ['Arnošt Lustig', 'Modlitba pro Kateřinu Horovitzovou'], ['George Orwell', '1984, Farma zvířat'], ['J. D. Salinger', 'Kdo chytá v žitě']] },
];

const $ = id => document.getElementById(id);

/* ---------- přehled ---------- */
$('prehled').innerHTML = SMERY.map(s => `
  <div class="smer" data-smer="${s.nazev}">
    <h2>${s.nazev} <span class="obdobi">${s.obdobi}</span></h2>
    <div class="znaky">${s.znaky}</div>
    <table>${s.autori.map(([a, d]) =>
      `<tr data-autor="${a}"><td>${a}</td><td>${d}</td></tr>`).join('')}</table>
  </div>`).join('');

/* ---------- kvíz ----------
   Chování odpovědí (zaklepání u chyby, zelená a automatický posun u správné,
   skóre v localStorage a zápis do studijního deníku) řeší sdílený uloha.js –
   stránka se tak ovládá stejně jako ostatní procvičování v Nodusu. */
const skore = Uloha.skore('nodus_literarni_smery', $('skore'));
let rezim = 'prehled', uloha = null, posledni = null, serie = 0, napovedaVidet = false;

const SMER_PODLE_NAZVU = Object.fromEntries(SMERY.map(s => [s.nazev, s]));

/* Dvojice pro kvízy. Anonymní autoři se vynechávají – „(anonym)“ by jako odpověď
   nedávalo smysl a ve dvou směrech je navíc tentýž řetězec. */
const AUTOR_SMER = SMERY.flatMap(s => s.autori.filter(([a]) => a !== '(anonym)')
  .map(([a, d]) => ({ otazka: a, odpoved: s.nazev, smer: s.nazev, dila: d })));
const DILO_AUTOR = SMERY.flatMap(s => s.autori.filter(([a]) => a !== '(anonym)')
  .flatMap(([a, d]) => d.split(/[,;]/).slice(0, 2).map(x => x.trim())
    .filter(x => x && !x.startsWith('nositel'))
    .map(x => ({ otazka: x, odpoved: a, smer: s.nazev, dila: d }))));
const SMER_OBDOBI = SMERY.map(s => ({ otazka: s.nazev, odpoved: s.obdobi, smer: s.nazev }));

const ZDROJE = { autor: AUTOR_SMER, dilo: DILO_AUTOR, obdobi: SMER_OBDOBI };
const ZADANI = {
  autor: 'Do kterého směru / období patří autor?',
  dilo: 'Kdo je autorem díla?',
  obdobi: 'Do jakého období směr spadá?',
};

/* Kartička s vysvětlením potřebuje čas na přečtení; po chybě ještě delší. */
const PRODLEVA = napoprve => (napoprve ? 2600 : 3600);

/* Přehled pod kvízem žije – po odpovědi se v něm rozsvítí probíraný směr i autor. */
function rozsvit(smer, autor) {
  $('prehled').querySelectorAll('.smer').forEach(el =>
    el.classList.toggle('sviti', el.dataset.smer === smer));
  $('prehled').querySelectorAll('tr').forEach(el =>
    el.classList.toggle('sviti', !!autor && el.dataset.autor === autor));
}

function hotovo(p, napoprve, smer, autor) {
  skore.vyhodnot(napoprve);
  serie = napoprve ? serie + 1 : 0;
  $('serie').textContent = serie >= 3 ? '🔥 série ' + serie : '';
  rozsvit(smer, autor);
  const tip = p.querySelector('.pravidlo.tip');
  if (tip) tip.remove();
}

/* Kartička „proč“ – zasadí odpověď do směru, období a k dalším dílům autora. */
function pravidloEl(u) {
  const smer = SMER_PODLE_NAZVU[u.smer];
  const el = document.createElement('div');
  el.className = 'pravidlo ok';
  el.innerHTML = `<span class="znak">📚</span><div>
      <span class="vysledek">${u.odpoved}</span>
      <div style="margin-top:6px"><b>${smer.nazev}</b> (${smer.obdobi}) — ${smer.znaky}</div>
      ${u.dila ? `<div style="margin-top:6px">Další díla: <i>${u.dila}</i></div>` : ''}
    </div>`;
  return el;
}

/* Nápověda zužuje, neprozrazuje: ztlumí polovinu špatných možností. */
function ztlum(p, spravnyKlic) {
  const spatne = [...p.querySelectorAll('.moznosti button')]
    .filter(b => b.dataset.klic !== spravnyKlic && !b.disabled);
  Uloha.zamichej(spatne).slice(0, Math.ceil(spatne.length / 2))
    .forEach(b => { b.disabled = true; b.style.opacity = '0.25'; });
}

function novaUloha() {
  napovedaVidet = false;
  if (rezim === 'prehled') return;
  const p = $('plocha');
  const zdroj = ZDROJE[rezim];
  let u;
  do { u = Uloha.nahodne(zdroj); } while (u === posledni && zdroj.length > 1);
  posledni = u;
  uloha = u;

  const spatne = Uloha.zamichej([...new Set(zdroj.map(z => z.odpoved))]
    .filter(x => x !== u.odpoved)).slice(0, 3);
  p.innerHTML = `<div class="zadani">${ZADANI[rezim]}</div>
    <div class="karta"><div class="dotaz">${u.otazka}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'smery',
    moznosti: Uloha.zamichej([u.odpoved, ...spatne]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.odpoved,
    zpravaOk: '\u2705 ' + u.odpoved,
    zpravaChyba: rezim === 'dilo'
      ? 'Zkus si vybavit dobu, ve které dílo vzniklo – autor do ní patří.'
      : 'Rozhodni podle doby: kdy autor žil, takový směr ho obklopoval.',
    poSpravne: napoprve => {
      hotovo(p, napoprve, u.smer, rezim === 'autor' ? u.otazka : u.odpoved);
      p.appendChild(pravidloEl(u));
    },
    prodleva: PRODLEVA, dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- nápověda -------------------------------------------------------------- */
/* Zužuje: prozradí období nebo typický znak, ne odpověď samotnou. */
function napoveda() {
  if (!uloha || napovedaVidet || rezim === 'prehled') return;
  const p = $('plocha');
  const smer = SMER_PODLE_NAZVU[uloha.smer];
  const el = document.createElement('div');
  el.className = 'pravidlo tip';
  el.innerHTML = `<span class="znak">🔎</span><div>${rezim === 'obdobi'
    ? `Čím je směr typický: ${smer.znaky} Podle toho odhadni, do jakého století patří.`
    : `Hledaný směr spadá do období <b>${smer.obdobi}</b>. Typické pro něj je: ${smer.znaky}`}</div>`;
  p.appendChild(el);
  ztlum(p, uloha.odpoved);
  napovedaVidet = true;
}

/* ---- ovládání -------------------------------------------------------------- */
document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  const kviz = rezim !== 'prehled';
  $('plocha').style.display = kviz ? '' : 'none';
  $('ovladani').style.display = kviz ? '' : 'none';
  $('klavesy').style.display = kviz ? '' : 'none';
  if (kviz) novaUloha(); else rozsvit(null, null);
}));
$('btnDalsi').addEventListener('click', novaUloha);
$('btnNapoveda').addEventListener('click', napoveda);
document.addEventListener('keydown', e => {
  if (rezim === 'prehled') return;
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
  if (e.key === 'h' || e.key === 'H') napoveda();
});
</script>
</body>
</html>
