<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 Trigonometrie v pravoúhlém trojúhelníku</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="../vyuka.css">
<script src="../theme.js"></script>
<script src="../uloha.js" defer></script>
<script src="../procvic.js" defer></script>
</head>
<body>
  <h1>📐 Trigonometrie</h1>
  <p class="podtitul">Sinus, kosinus a tangens v pravoúhlém trojúhelníku. Po chybě máš druhý pokus a na konci přehled chyb.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="odvesna">📏 Odvěsna z přepony</button>
    <button data-rezim="prepona">📐 Přepona z odvěsny</button>
    <button data-rezim="mix" class="active">🔀 Mix</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnNova">🔄 Nová série</button>
    <span class="pokrok" id="pokrok"></span>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">V pravoúhlém trojúhelníku platí: <b>sin α = protilehlá / přepona</b>, <b>cos α = přilehlá / přepona</b>, <b>tg α = protilehlá / přilehlá</b>. Výsledek zaokrouhluj na 1 desetinné místo.</p>

<script>
const $ = id => document.getElementById(id);
let rezim = 'mix';

const nadesetiny = x => Math.round(x * 10) / 10;

function nakresli(a, b, c, hledana) {
  return function (karta) {
    const cv = karta.querySelector('canvas');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const okraj = 34;
    const x0 = okraj, y0 = H - okraj;
    const delka = Math.max(a, b) || 1;
    const mer = Math.min((W - 2 * okraj) / b, (H - 2 * okraj) / a) || 1;
    const x1 = x0 + b * mer, y1 = y0 - a * mer;
    const styl = getComputedStyle(document.documentElement);
    const barvaCary = styl.getPropertyValue('--text-muted').trim() || '#b0b0b0';
    const barvaZvyraz = styl.getPropertyValue('--accent').trim() || '#6aa6fd';

    ctx.lineWidth = 2;
    ctx.strokeStyle = barvaCary;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.lineTo(x0, y1); ctx.closePath(); ctx.stroke();
    // pravý úhel
    ctx.beginPath(); ctx.moveTo(x0 + 12, y0); ctx.lineTo(x0 + 12, y0 - 12); ctx.lineTo(x0, y0 - 12); ctx.stroke();

    ctx.font = '13px sans-serif';
    ctx.fillStyle = barvaCary;
    const popis = (text, x, y, zvyraz) => {
      ctx.fillStyle = zvyraz ? barvaZvyraz : barvaCary;
      ctx.fillText(text, x, y);
    };
    popis(hledana === 'a' ? 'a = ?' : 'a = ' + a, x0 - 30, (y0 + y1) / 2, hledana === 'a');
    popis(hledana === 'b' ? 'b = ?' : 'b = ' + b, (x0 + x1) / 2 - 18, y0 + 22, hledana === 'b');
    popis(hledana === 'c' ? 'c = ?' : 'c = ' + c, (x0 + x1) / 2, (y0 + y1) / 2 - 8, hledana === 'c');
    popis('α', x1 - 26, y0 - 8, false);
  };
}

const PLATNO = '<canvas width="300" height="210" aria-hidden="true"></canvas>';

function generuj(r) {
  const uhelSt = 20 + Math.floor(Math.random() * 50);
  const uhel = uhelSt * Math.PI / 180;
  const c = nadesetiny(8 + Math.random() * 12);
  const a = nadesetiny(c * Math.sin(uhel));
  const b = nadesetiny(c * Math.cos(uhel));
  let hledana;
  if (r === 'odvesna') hledana = Math.random() < 0.5 ? 'a' : 'b';
  else if (r === 'prepona') hledana = 'c';
  else hledana = ['a', 'b', 'c'][Math.floor(Math.random() * 3)];

  if (hledana === 'a') {
    return { zadani: `Přepona c = ${c}, úhel α = ${uhelSt}°. Vypočti odvěsnu <span class="zvyraz">a</span> (protilehlou) na 1 des. místo.`,
             obrazekHtml: PLATNO, poVykresleni: nakresli(a, b, c, 'a'),
             odpoved: a, tolerance: 0.15, napoveda: `a = c · sin α = ${c} · sin ${uhelSt}°` };
  }
  if (hledana === 'b') {
    return { zadani: `Přepona c = ${c}, úhel α = ${uhelSt}°. Vypočti odvěsnu <span class="zvyraz">b</span> (přilehlou) na 1 des. místo.`,
             obrazekHtml: PLATNO, poVykresleni: nakresli(a, b, c, 'b'),
             odpoved: b, tolerance: 0.15, napoveda: `b = c · cos α = ${c} · cos ${uhelSt}°` };
  }
  return { zadani: `Odvěsna a = ${a}, úhel α = ${uhelSt}°. Vypočti přeponu <span class="zvyraz">c</span> na 1 des. místo.`,
           obrazekHtml: PLATNO, poVykresleni: nakresli(a, b, c, 'c'),
           odpoved: c, tolerance: 0.3, napoveda: `c = a / sin α = ${a} / sin ${uhelSt}°` };
}

let serie = null;
window.addEventListener('DOMContentLoaded', () => {
  serie = Procvic.spust({
    klic: 'nodus_trigonometrie',
    pocet: 10,
    typ: 'text',
    plocha: $('plocha'),
    skoreEl: $('skore'),
    pokrokEl: $('pokrok'),
    rezim: () => rezim,
    generuj,
  });
  $('rezimy').addEventListener('click', e => {
    const b = e.target.closest('button[data-rezim]');
    if (!b) return;
    $('rezimy').querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    rezim = b.dataset.rezim;
    serie.restart();
  });
  $('btnNova').onclick = () => serie.restart();
  serie.restart();
});
</script>
</body>
</html>
