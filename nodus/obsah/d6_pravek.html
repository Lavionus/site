<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pravěk</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .popis-p { color: var(--text-muted); max-width: 560px; line-height: 1.55; }
    .nazev-p { font-size: 1.2rem; font-weight: 700; }
    .osa-cas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; min-height: 44px; }
    .osa-cas .bod {
      background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 8px;
      padding: 7px 11px; font-size: 0.85rem; font-weight: 600;
    }
    .osa-cas .sipka { color: var(--text-faint); }
  </style>
</head>
<body>
  <h1>🦴 Pravěk</h1>
  <p class="podtitul">Pro 6. ročník: doba kamenná, bronzová a železná, vývoj člověka a první zemědělci.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="doby" class="active">⏳ Které období</button>
    <button data-rezim="poradi">↕️ Seřaď vývoj</button>
    <button data-rezim="predci">🧍 Vývoj člověka</button>
    <button data-rezim="zivot">🏹 Život v pravěku</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Pravěk dělíme podle materiálu nástrojů: <b>doba kamenná</b> (starší, střední a mladší),
    <b>doba bronzová</b> a <b>doba železná</b>. Zásadní změnou byl přechod od lovu a sběru
    k <b>zemědělství</b> – takzvaná neolitická revoluce.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_d6_pravek', $('skore'));
let rezim = 'doby';

const DOBY = [
  { n: 'starší doba kamenná (paleolit)', o: 'lovci a sběrači, štípané kamenné nástroje, život v tlupách', poradi: 1 },
  { n: 'mladší doba kamenná (neolit)', o: 'začátek zemědělství, chov zvířat, broušené nástroje a keramika', poradi: 2 },
  { n: 'doba bronzová', o: 'lidé slévají měď s cínem, vznikají obchodní stezky a mohyly', poradi: 3 },
  { n: 'doba železná', o: 'železné nástroje a zbraně, na našem území Keltové a oppida', poradi: 4 },
];

const PREDCI = [
  { n: 'člověk zručný', o: 'první vyráběl jednoduché kamenné nástroje', poradi: 1 },
  { n: 'člověk vzpřímený', o: 'naučil se používat oheň a rozšířil se z Afriky', poradi: 2 },
  { n: 'člověk neandertálský', o: 'žil v době ledové, pohřbíval mrtvé a lovil velkou zvěř', poradi: 3 },
  { n: 'člověk dnešního typu', o: 'tvořil jeskynní malby a sošky, například Věstonickou venuši', poradi: 4 },
];

const ZIVOT = [
  { o: 'Čím se živili lidé ve starší době kamenné?', spr: 'lovem zvířat a sběrem plodů',
    jine: ['pěstováním obilí', 'chovem dobytka', 'obchodem s kovy'] },
  { o: 'Co znamenala neolitická revoluce?', spr: 'přechod od lovu a sběru k zemědělství',
    jine: ['objevení železa', 'vynález kola', 'stavbu měst z kamene'] },
  { o: 'Jaký nález z Dolních Věstonic je světoznámý?', spr: 'Věstonická venuše',
    jine: ['zlatá maska', 'kamenná deska s písmem', 'bronzový meč'] },
  { o: 'K čemu sloužila oppida?', spr: 'byla to opevněná keltská sídliště',
    jine: ['pohřebiště', 'chrámy', 'doly na sůl'] },
  { o: 'Který kov lidé zpracovávali jako první?', spr: 'měď', jine: ['železo', 'hliník', 'ocel'] },
  { o: 'Co umožnil objev ohně?', spr: 'teplo, ochranu před zvěří a tepelnou úpravu jídla',
    jine: ['stavbu kamenných hradů', 'psaní', 'zemědělství'] },
  { o: 'Jak se nazývají hrobky z doby bronzové navršené ze zeminy?', spr: 'mohyly',
    jine: ['pyramidy', 'menhiry', 'oppida'] },
];

/* ---- Které období ---------------------------------------------------------------------- */
function doby() {
  const p = $('plocha');
  const u = Uloha.nahodne(DOBY);
  const jine = Uloha.zamichej(DOBY.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O které období pravěku jde?</div>
    <div class="karta"><div class="obrazek">🪨</div><div class="popis-p">${u.o}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.o}.`,
    zpravaChyba: 'Podívej se, z jakého materiálu byly nástroje.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Seřaď vývoj -------------------------------------------------------------------------- */
function poradi() {
  const p = $('plocha');
  const predci = Math.random() < 0.5;
  const data = predci ? PREDCI : DOBY;
  const serazene = [...data].sort((a, b) => a.poradi - b.poradi);

  p.innerHTML = `<div class="zadani">Seřaď ${predci ? 'předchůdce člověka' : 'období pravěku'}
      od nejstaršího.</div>`;
  const osa = document.createElement('div');
  osa.className = 'osa-cas';
  const nabidka = document.createElement('div');
  nabidka.className = 'nabidka';
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  let dalsiIndex = 0, chyboval = false;

  Uloha.zamichej(data).forEach(o => {
    const b = document.createElement('button');
    b.textContent = o.n;
    b.dataset.n = o.n;
    b.addEventListener('click', () => {
      if (b.disabled) return;
      if (o.n === serazene[dalsiIndex].n) {
        if (dalsiIndex > 0) {
          const s = document.createElement('span');
          s.className = 'sipka';
          s.textContent = '→';
          osa.appendChild(s);
        }
        const el = document.createElement('span');
        el.className = 'bod';
        el.textContent = o.n;
        osa.appendChild(el);
        b.disabled = true;
        dalsiIndex++;
        odezva.className = 'odezva ok';
        odezva.textContent = '✅ Správně!';
        if (dalsiIndex === serazene.length) {
          odezva.textContent = '🎉 Časová osa je hotová!';
          skore.vyhodnot(!chyboval);
          setTimeout(novaUloha, Uloha.PRODLEVA + 600);
        }
      } else {
        chyboval = true;
        Uloha.trhni(b);
        odezva.className = 'odezva chyba';
        odezva.textContent = 'Tohle je pozdější – hledej starší.';
      }
    });
    nabidka.appendChild(b);
  });
  p.append(osa, nabidka, odezva);
}

/* ---- Vývoj člověka ------------------------------------------------------------------------- */
function predci() {
  const p = $('plocha');
  const u = Uloha.nahodne(PREDCI);
  const jine = Uloha.zamichej(PREDCI.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O kterého předchůdce člověka jde?</div>
    <div class="karta"><div class="obrazek">🧍</div><div class="popis-p">${u.o}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.o}.`,
    zpravaChyba: 'Zkus jiného předchůdce.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Život v pravěku ------------------------------------------------------------------------ */
function zivot() {
  const p = $('plocha');
  const u = Uloha.nahodne(ZIVOT);
  p.innerHTML = `<div class="zadani">${u.o}</div>
    <div class="karta"><div class="obrazek">🏹</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.spr, ...u.jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.spr,
    zpravaOk: `✅ ${u.spr}.`,
    zpravaChyba: 'Zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { doby, poradi, predci, zivot };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
