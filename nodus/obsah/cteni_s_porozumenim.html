<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Čtení s porozuměním</title>
<link rel="stylesheet" href="../common.css">
<script src="../theme.js"></script>
<script src="../podpis.js" defer></script>
<script src="../uloha.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.container{max-width:680px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:18px;font-weight:600;text-align:center}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:22px;margin-bottom:16px}
.setup{display:flex;gap:12px;flex-wrap:wrap;align-items:end;justify-content:center}
label{display:block;font-size:.78rem;color:var(--text-faint);margin-bottom:4px}
select{background:var(--border);border:1px solid var(--border-strong);border-radius:4px;color:var(--text);padding:9px}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 28px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.95rem}
.btn:hover{background:var(--accent)}
.game,.results{display:none}
.text{line-height:1.7;font-size:1.05rem;white-space:pre-line}
.qtitle{font-weight:600;margin:16px 0 10px;font-size:1.02rem}
.opt{display:block;width:100%;text-align:left;background:var(--bg-hover);border:1px solid var(--border-strong);border-radius:6px;padding:10px 14px;margin-bottom:8px;color:var(--text);cursor:pointer;font-size:.95rem}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:#27ae60;background:#1f3a2a}
.opt.wrong{border-color:#e74c3c;background:#3a1f1f}
.opt[disabled]{cursor:default}
.progress{font-size:.8rem;color:var(--text-faint);margin-bottom:6px;text-align:center}
.results{text-align:center}
.big{font-size:2.4rem;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<div class="container">
  <h1>📖 Čtení s porozuměním</h1>
  <div class="card" id="setupCard">
    <div class="setup">
      <div><label>Náročnost</label><select id="level">
        <option value="1">1. stupeň</option>
        <option value="2" selected>2. stupeň</option>
        <option value="3">Střední škola</option>
      </select></div>
      <button class="btn" id="startBtn">▶️ Začít</button>
    </div>
  </div>

  <div class="card game" id="gameCard">
    <div class="progress" id="progress"></div>
    <div class="text" id="text"></div>
    <div class="qtitle" id="qtitle"></div>
    <div id="opts"></div>
  </div>

  <div class="card results" id="resultsCard">
    <div class="big" id="finalScore"></div>
    <p style="color:var(--text-faint);margin-top:8px" id="finalDetail"></p>
    <button class="btn" id="againBtn" style="margin-top:16px">🔄 Znovu</button>
  </div>
</div>

const TEXTU_V_KOLE=3;   // z celé zásoby se náhodně vyberou tři texty
let pool,idx,qi,score,stav={chyboval:false,hotovo:false};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  const lvl=$('level').value;
  pool=shuffle([...TEXTY[lvl]]).slice(0,TEXTU_V_KOLE);
  idx=0;score=0;
  $('setupCard').style.display='none';$('resultsCard').style.display='none';$('gameCard').style.display='block';
  loadText();
}
function loadText(){
  qi=0;
  const item=pool[idx];
  $('text').textContent=item.t;
  $('progress').textContent=`Text ${idx+1} / ${pool.length}`;
  showQ();
}
function showQ(){
  const item=pool[idx];
  if(qi>=item.qs.length){
    idx++;
    if(idx>=pool.length){finish();return;}
    loadText();return;
  }
  const q=item.qs[qi];
  $('qtitle').textContent=`Otázka ${qi+1}/${item.qs.length}: ${q.q}`;
  const box=$('opts');box.innerHTML='';
  stav={chyboval:false,hotovo:false};
  q.o.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=opt;
    b.onclick=()=>answer(i,q.a,b,box);
    box.appendChild(b);
  });
}
/* Špatná odpověď se zaklepe a nechá žáka hledat dál, správná zezelená
   a stránka sama pokračuje – stejně jako na ostatních stránkách. */
function answer(i,correct,btn,box){
  if(stav.hotovo)return;
  if(i!==correct){
    stav.chyboval=true;
    Uloha.trhni(btn);
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),420);
    return;
  }
  stav.hotovo=true;
  btn.classList.add('correct');
  [...box.children].forEach(b=>b.disabled=true);
  if(!stav.chyboval)score++;
  setTimeout(()=>{qi++;showQ();},Uloha.PRODLEVA);
}
function finish(){
  $('gameCard').style.display='none';$('resultsCard').style.display='block';
  const total=pool.reduce((s,i)=>s+i.qs.length,0);
  $('finalScore').textContent=`${score} / ${total}`;
  $('finalScore').title='Počítají se jen odpovědi napoprvé.';
  const pct=Math.round(score/total*100);
  $('finalDetail').textContent=pct>=80?'🏆 Výborné porozumění textu!':pct>=50?'👍 Dobrá práce, zkus to znovu pro lepší výsledek.':'💪 Zkus text číst pomaleji a pozorněji.';
}
$('startBtn').onclick=start;
$('againBtn').onclick=()=>{$('setupCard').style.display='block';$('resultsCard').style.display='none';};
</script>
