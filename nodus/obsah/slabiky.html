<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slabiky a první čtení</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <style>
    /* Rozcestník režimů, lišta ovládání i řada slabik jsou ve vyuka.css –
       tady zůstává jen vlastní čtecí tabule. */
    .tabule {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
      max-width: 720px; min-height: 300px; display: flex; align-items: center; justify-content: center;
      padding: 30px; text-align: center; cursor: pointer; user-select: none;
    }
    .tabule .text { font-weight: 700; line-height: 1.35; letter-spacing: 0.05em; }
    .tabule .text .zvyraz { color: var(--accent); }
    .tabule .text .delic { opacity: 0.35; }
    label.prep { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted);
      font-size: 0.88rem; cursor: pointer; }
    /* Řada slabik s toutéž souhláskou – dítě vidí, kde se právě nachází v řadě
       (MA MÁ ME MÉ MI MÍ MO MU MY), stejně jako u vyjmenovaných slov. */
    #rada { margin-top: 12px; }
    #rada span { font-size: 1.05rem; letter-spacing: 0.04em; }
    .pruh { max-width: 720px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>📖 Slabiky a první čtení</h1>
  <p class="podtitul">Nácvik čtení pro 1.–2. ročník: písmena → slabiky → slova → věty. Klepnutím na tabuli zobrazíš další.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="pismena" class="active">🔤 Písmena</button>
    <button data-rezim="slabiky">🔡 Slabiky</button>
    <button data-rezim="slova">📝 Slova</button>
    <button data-rezim="vety">📄 Věty</button>
  </div>

  <div class="tabule" id="tabule"><div class="text" id="text"></div></div>

  <div class="pruh"><i id="pruh"></i></div>

  <div class="ovladani">
    <button id="btnPredchozi">← Předchozí</button>
    <button class="hlavni" id="btnDalsi">Další →</button>
    <button id="btnCist" title="Přečíst nahlas">🔊</button>
    <button id="btnAuto" class="prepinac" title="Číst každou kartu automaticky">🔁 Číst samo</button>
    <label class="prep"><input type="checkbox" id="chkVelka" checked> VELKÁ písmena</label>
    <label class="prep"><input type="checkbox" id="chkSlabikovat" checked> dělit na slabiky</label>
    <span class="skore" id="pocitadlo"></span>
  </div>

  <div class="rada" id="rada"></div>

  <p class="napoveda" id="poznamka">
    Klepnutím na tabuli se objeví další karta. Barvy střídavě oddělují <b>slabiky</b>,
    aby je dítě vidělo i bez pomlček.
    Klávesy: <kbd>→</kbd> / <kbd>mezerník</kbd> další · <kbd>←</kbd> zpět · <kbd>P</kbd> přečíst.
  </p>

<script>
const $ = id => document.getElementById(id);

const SOUHLASKY = ['M', 'L', 'S', 'P', 'T', 'J', 'N', 'D', 'K', 'V', 'Z', 'R', 'B', 'C', 'H'];
const SAMOHLASKY = ['A', 'Á', 'E', 'É', 'I', 'Í', 'O', 'Ó', 'U', 'Ú', 'Y', 'Ý'];

const DATA = {
  pismena: [...'AÁBCČDĎEÉĚFGHIÍJKLMNŇOÓPRŘSŠTŤUÚVYÝZŽ'],
  slabiky: (() => {
    const s = [];
    for (const k of SOUHLASKY) for (const v of ['A', 'Á', 'E', 'É', 'I', 'Í', 'O', 'U', 'Y']) s.push(k + v.toLowerCase());
    return s;
  })(),
  // slova dělená na slabiky pomlčkou
  slova: [
    'má-ma', 'tá-ta', 'te-ta', 'se-le', 'pi-je', 'me-le', 'mí-sa', 'má-me',
    'pes', 'les', 'los', 'sud', 'dům', 'kos', 'nos', 'sýr',
    'so-va', 'ry-ba', 'ko-za', 'no-ha', 'lo-pa-ta', 'ko-le-no', 'ba-nán', 'je-le-ni',
    'mo-tý-li', 'ho-di-ny', 'ma-li-na', 'ka-lu-že', 'pa-pí-ry', 'ko-lo-toč', 've-se-lo',
    // jednoslabičná slova
    'sůl', 'vůz', 'med', 'led', 'sen', 'pán', 'mrak', 'strom', 'vlak', 'pták', 'klíč', 'chléb',
    'kůň', 'hrad', 'most', 'mlé-ko',
    // dvojslabičná
    'vá-za', 'ví-la', 'pi-la', 'ko-la', 'lu-pa', 'se-no', 'pá-ra', 'ku-ře', 'ko-tě', 'sá-ně',
    'má-ta', 'ži-to', 'ka-še', 'ja-ro', 'lé-to', 'zi-ma', 'rá-no', 've-čer', 'kluk', 'hol-ka',
    'ryb-ník', 'les-ník', 'zá-hon', 'sla-ma', 'kni-ha', 'lav-ka', 'ta-bu-le',
    'pol-ka', 'mý-dlo', 'ká-va', 'pe-řin-ka',
    // tříslabičná a delší
    'za-hra-da', 'po-lév-ka', 'ma-min-ka', 'ba-bič-ka', 'ta-tí-nek', 'dě-de-ček',
    'ku-ře-cí', 'le-tad-lo', 'ko-cou-rek', 'me-du-za', 'za-hrád-ka', 'sně-hu-lák',
    'ko-lo-běž-ka', 'ma-lo-va-ný', 'u-či-tel-ka', 'po-hád-ka', 'ko-lá-če', 'zví-řát-ka',
  ],
  vety: [
    'Máma má mísu.', 'Ema má maso.', 'Táta je doma.', 'Pes leží u boudy.', 'Sova sedí na dubu.',
    'Jana nese jahody.', 'U lesa je louka.', 'Kolo je u domu.', 'Míša pije kakao.',
    'Teta peče koláče.', 'Na dubu sedí sojka.', 'Máme malé kotě.', 'Vlak jede tunelem.',
    'Děti si hrají na písku.', 'Ryba plave v rybníce.', 'Sluníčko hřeje.',
    'Máme doma malé kotě.', 'Kočka spí na peřině.', 'Pes hlídá dům.',
    'Máma vaří polévku.', 'Táta myje auto.', 'Babička plete čepici.',
    'Dědeček čte noviny.', 'Ema kreslí obrázek.', 'Adam staví hrad z písku.',
    'V lese roste hodně hub.', 'Na louce kvetou květiny.', 'Ptáci letí nad polem.',
    'Ráno svítí sluníčko.', 'Večer se rozsvítí lampy.', 'V zimě padá sníh.',
    'Na jaře kvetou stromy.', 'V létě jezdíme k vodě.', 'Na podzim padá listí.',
    'Kluci hrají fotbal.', 'Holky skáčou přes gumu.', 'Ve škole máme přestávku.',
    'Píšeme do sešitu.', 'Učíme se číst a psát.', 'Míša má nové boty.',
    'Vlak jede do Prahy.', 'Auto stojí u domu.', 'Kolo mám opřené o plot.',
    'Jíme jablko a hrušku.', 'Piju mléko z hrnku.', 'Na stole je chleba.',
    'Sova houká v noci.', 'Žába skáče do vody.', 'Ježek běží po louce.',
  ],
};
let rezim = 'pismena', poradi = [], idx = 0, cist = false;

/* Souhlásky se v řadě slabik drží v pořadí, ve kterém se probírají ve slabikáři. */
const SAMOHLASKY_RADY = ['A', 'Á', 'E', 'É', 'I', 'Í', 'O', 'U', 'Y'];

function zamichej(pole) {
  const p = [...pole];
  for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  return p;
}
function start() { poradi = zamichej(DATA[rezim]); idx = 0; ukaz(); }

/* Řada slabik s touž souhláskou. Ukazuje se jen v režimu slabik – u písmen,
   slov a vět by neměla co rozsvítit. Rozsvícená je právě ta na tabuli, takže
   dítě vidí, kde v řadě je a co bude následovat. */
function vykresliRadu(slabika) {
  const rada = $('rada');
  if (rezim !== 'slabiky') { rada.innerHTML = ''; return; }
  const souhlaska = slabika[0].toUpperCase();
  const velka = $('chkVelka').checked;
  rada.innerHTML = SAMOHLASKY_RADY.map(v => {
    const cela = souhlaska + v.toLowerCase();
    const zobraz = velka ? cela.toUpperCase() : cela.toLowerCase();
    return `<span class="${cela.toLowerCase() === slabika.toLowerCase() ? 'sviti' : ''}">${zobraz}</span>`;
  }).join('');
}

function ukaz() {
  const puvodni = poradi[idx];
  let t = puvodni;
  const velka = $('chkVelka').checked;
  const slabikovat = $('chkSlabikovat').checked;
  if (!slabikovat) t = t.replace(/-/g, '');
  if (velka) t = t.toUpperCase(); else if (rezim !== 'vety') t = t.toLowerCase();
  // slabiky střídavě obarvit
  const casti = t.split('-');
  $('text').innerHTML = casti.map((c, i) => i % 2 ? '<span class="zvyraz">' + c + '</span>' : c)
    .join('<span class="delic">-</span>');
  const delka = t.replace(/-/g, '').length;
  $('text').style.fontSize = rezim === 'vety' ? 'clamp(1.6rem, 5vw, 3rem)' : delka > 8 ? 'clamp(2.2rem, 9vw, 4.5rem)' : 'clamp(3rem, 14vw, 7rem)';
  $('pocitadlo').textContent = (idx + 1) + ' / ' + poradi.length;
  $('pruh').style.width = ((idx + 1) / poradi.length * 100) + '%';
  vykresliRadu(puvodni);
  if (cist) precti();
}

/* Čte se vždycky text bez pomlček – syntetizér by je vyslovil jako pomlčku. */
function precti() { Rec.mluv(poradi[idx].replace(/-/g, ''), { rychlost: 0.8 }); }
function dalsi() { idx = (idx + 1) % poradi.length; ukaz(); }
function predchozi() { idx = (idx - 1 + poradi.length) % poradi.length; ukaz(); }

document.querySelectorAll('#rezimy button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); rezim = b.dataset.rezim; start();
});
$('tabule').onclick = dalsi;
$('btnDalsi').onclick = dalsi;
$('btnPredchozi').onclick = predchozi;
$('chkVelka').onchange = ukaz;
$('chkSlabikovat').onchange = ukaz;
$('btnCist').onclick = e => { e.stopPropagation(); precti(); };
$('btnAuto').onclick = () => {
  cist = !cist;
  $('btnAuto').classList.toggle('zapnuto', cist);
  if (cist) precti(); else Rec.ticho();
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); dalsi(); }
  if (e.key === 'ArrowLeft') predchozi();
  if (e.key === 'p' || e.key === 'P') precti();
});

/* Bez nainstalovaného hlasu se čtení „přehraje“ do ticha – proto se tlačítka
   schovají a pod úlohou se objeví vysvětlivka, jak hlas doplnit. */
Rec.hlidejTlacitko($('btnCist'));
Rec.hlidejTlacitko($('btnAuto'));
Rec.poznamkaOHlasu($('poznamka'));

start();
</script>
</body>
</html>
