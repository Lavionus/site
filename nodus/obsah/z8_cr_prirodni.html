<body>
  <h1>🇨🇿 ČR – povrch, podnebí a vodstvo</h1>
  <p class="podtitul">Pro 8. ročník: pohoří a nížiny, řeky a úmoří, podnebí České republiky.</p>

  <div class="rezimy" id="rezimy">

    <button data-rezim="mapa2">💧 Slepá mapa – vodstvo</button>

    <button data-rezim="kviz2">🌦️ Povrch a podnebí</button>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">

    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">Česko leží na <b>rozvodí tří moří</b>: Labe s Vltavou teče do Severního moře, Odra do Baltského a Morava s Dyjí přes Dunaj do Černého moře. Nejvyšší horou je <b>Sněžka (1 603 m)</b> v Krkonoších.</p>

/* Slepá mapa: na plochu se vloží šest značek a hledá se jedna z nich. */
function mapaUloha(sada, zadaniText) {
  const p = $('plocha');
  const body = Uloha.zamichej([...sada]).slice(0, 6);
  const cil = Uloha.nahodne(body);
  const stav = { chyboval: false, hotovo: false };

  p.innerHTML = `<div class="zadani">${zadaniText} <b>${cil.popis}</b></div>` + Mapy.svg('cesko', body);
  const odezva = odezvaEl();
  p.querySelectorAll('.znacka').forEach(g => g.addEventListener('click', () => {
    const trefa = sada.find(x => x.klic === g.dataset.klic);
    Uloha.odpoved({
      prvek: g, spravne: g.dataset.klic === cil.klic, stav, odezva,
      zpravaOk: `✅ ${cil.popis} – ${cil.info}`,
      zpravaChyba: `Tady je ${trefa.popis}. Hledáme ${cil.popis}.`,
      poSpravne: skore.vyhodnot,
      dalsi: novaUloha,
    });
  }));
  p.appendChild(odezva);
}
const mapa1 = () => mapaUloha(SADA1, 'Najdi na mapě');
const mapa2 = () => mapaUloha(SADA2, 'Najdi na mapě');

function kviz(sada, napoveda) {
  const p = $('plocha');
  const u = Uloha.nahodne(sada);
  p.innerHTML = `<div class="zadani uloha-text">${u.q}</div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.a, ...u.b]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.a,
    zpravaOk: `✅ ${u.a}` + (u.proc ? ` – ${u.proc}` : ''),
    zpravaChyba: napoveda,
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}
const kviz1 = () => kviz(KVIZ1, 'Vzpomeň si, kterým směrem řeka teče a do kterého moře nakonec doteče.');
const kviz2 = () => kviz(KVIZ2, 'Čechy lemují pohoří po obvodu, uprostřed Moravy leží nížiny.');

const REZIMY = { mapa1, mapa2, kviz1, kviz2 };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
novaUloha();
</script>
