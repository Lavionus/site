<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planeta Země – tvar a pohyby</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .schema { width: min(320px, 82vw); }
    .schema .slunce { fill: #f0b429; }
    .schema .zeme { fill: #4a90d9; }
    .schema .draha { fill: none; stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 5 5; }
    .schema .osa { stroke: var(--danger); stroke-width: 2.5; }
    .schema .popisek { fill: var(--text-muted); font-size: 12px; text-anchor: middle; }
    .otazka-t { max-width: 560px; font-size: 1.05rem; line-height: 1.55; }
  </style>
</head>
<body>
  <h1>🌎 Planeta Země – tvar a pohyby</h1>
  <p class="podtitul">Pro 6. ročník: otáčení a oběh Země, střídání dne a noci, roční období a časová pásma.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="pohyby" class="active">🔄 Který pohyb</button>
    <button data-rezim="dusledky">🌗 Důsledky pohybů</button>
    <button data-rezim="rovnodennost">📅 Významné dny</button>
    <button data-rezim="fakta">🌍 Fakta o Zemi</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Země se <b>otáčí kolem své osy</b> jednou za 24 hodin – proto se střídá den a noc.
    Kolem <b>Slunce oběhne</b> za 365 dní a její osa je nakloněná o 23,5°, což způsobuje
    <b>střídání ročních období</b>.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_z6_zeme', $('skore'));
let rezim = 'pohyby';

const POHYBY = {
  rotace: 'otáčení kolem osy (rotace)',
  obeh: 'oběh kolem Slunce (revoluce)',
};

const DUSLEDKY = [
  { t: 'střídání dne a noci', p: 'rotace' },
  { t: 'zdánlivý pohyb Slunce po obloze', p: 'rotace' },
  { t: 'časová pásma na Zemi', p: 'rotace' },
  { t: 'střídání ročních období', p: 'obeh' },
  { t: 'různá délka dne v zimě a v létě', p: 'obeh' },
  { t: 'polární den a polární noc', p: 'obeh' },
  { t: 'kalendářní rok trvá 365 dní', p: 'obeh' },
  { t: 'ráno vychází Slunce na východě', p: 'rotace' },
];

const VYZNAMNE_DNY = [
  { d: '21. březen', n: 'jarní rovnodennost', proc: 'den a noc jsou stejně dlouhé, začíná astronomické jaro' },
  { d: '21. červen', n: 'letní slunovrat', proc: 'nejdelší den v roce, začíná astronomické léto' },
  { d: '23. září', n: 'podzimní rovnodennost', proc: 'den a noc jsou opět stejně dlouhé, začíná podzim' },
  { d: '21. prosinec', n: 'zimní slunovrat', proc: 'nejkratší den v roce, začíná astronomická zima' },
];

const FAKTA = [
  { o: 'Jaký tvar má Země?', spr: 'geoid – koule zploštělá na pólech',
    jine: ['dokonalá koule', 'placka', 'krychle'] },
  { o: 'Jak dlouho trvá otočení Země kolem osy?', spr: '24 hodin',
    jine: ['365 dní', '12 hodin', '30 dní'] },
  { o: 'Jak dlouho trvá oběh Země kolem Slunce?', spr: '365 dní a 6 hodin',
    jine: ['24 hodin', '30 dní', '100 let'] },
  { o: 'Co je rovník?', spr: 'nejdelší rovnoběžka, která dělí Zemi na dvě polokoule',
    jine: ['spojnice pólů', 'nultý poledník', 'osa otáčení'] },
  { o: 'Kolik stupňů měří sklon zemské osy?', spr: 'asi 23,5°',
    jine: ['0°', '45°', '90°'] },
  { o: 'Proč se přidává přestupný den?', spr: 'oběh trvá o zhruba 6 hodin déle než 365 dní',
    jine: ['Země se zpomaluje', 'kvůli změně času', 'kvůli Měsíci'] },
  { o: 'Co způsobuje střídání ročních období?', spr: 'sklon zemské osy při oběhu kolem Slunce',
    jine: ['měnící se vzdálenost od Slunce', 'rotace Země', 'fáze Měsíce'] },
];

/* ---- Který pohyb ---------------------------------------------------------------------- */
function pohyby() {
  const p = $('plocha');
  const u = Uloha.nahodne(DUSLEDKY);
  p.innerHTML = `<div class="zadani">Který pohyb Země to způsobuje?</div>
    <svg class="schema" viewBox="0 0 320 180">
      <ellipse class="draha" cx="160" cy="90" rx="130" ry="60"/>
      <circle class="slunce" cx="160" cy="90" r="24"/>
      <circle class="zeme" cx="290" cy="90" r="13"/>
      <line class="osa" x1="290" y1="72" x2="290" y2="108" transform="rotate(23.5 290 90)"/>
      <text class="popisek" x="160" y="94">Slunce</text>
      <text class="popisek" x="290" y="122">Země</text>
    </svg>
    <div class="otazka-t">${u.t}</div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: Uloha.zamichej(Object.entries(POHYBY)).map(([klic, popis]) => ({ klic, popis })),
    spravnyKlic: u.p,
    zpravaOk: u.p === 'rotace'
      ? '✅ Způsobuje to otáčení Země kolem vlastní osy (jednou za 24 hodin).'
      : '✅ Způsobuje to oběh Země kolem Slunce spolu se sklonem osy.',
    zpravaChyba: 'Souvisí to s jedním dnem (rotace), nebo s celým rokem (oběh)?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Důsledky pohybů ------------------------------------------------------------------- */
function dusledky() {
  const p = $('plocha');
  const rotace = Math.random() < 0.5;
  const spravny = Uloha.nahodne(DUSLEDKY.filter(x => x.p === (rotace ? 'rotace' : 'obeh')));
  const jine = Uloha.zamichej(DUSLEDKY.filter(x => x.p !== spravny.p)).slice(0, 3);

  p.innerHTML = `<div class="zadani">Co je důsledkem
      <b>${rotace ? 'otáčení Země kolem osy' : 'oběhu Země kolem Slunce'}</b>?</div>
    <div class="karta"><div class="obrazek">${rotace ? '🔄' : '🛰️'}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([spravny, ...jine]).map(x => ({ klic: x.t, popis: x.t })),
    spravnyKlic: spravny.t,
    zpravaOk: `✅ ${spravny.t} – způsobuje to ${POHYBY[spravny.p]}.`,
    zpravaChyba: 'Tenhle jev souvisí s druhým pohybem.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Významné dny ---------------------------------------------------------------------- */
function rovnodennost() {
  const p = $('plocha');
  const u = Uloha.nahodne(VYZNAMNE_DNY);
  const podleData = Math.random() < 0.5;
  p.innerHTML = podleData
    ? `<div class="zadani">Co připadá na tento den?</div>
       <div class="karta"><div class="obrazek">📅</div><div class="otazka-t">${u.d}</div></div>`
    : `<div class="zadani">Kdy nastává tento den?</div>
       <div class="karta"><div class="obrazek">🌗</div><div class="otazka-t">${u.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(VYZNAMNE_DNY).map(x => ({ klic: x.d, popis: podleData ? x.n : x.d })),
    spravnyKlic: u.d,
    zpravaOk: `✅ ${u.d} – ${u.n}: ${u.proc}.`,
    zpravaChyba: 'Zkus jinou možnost – rovnodennosti jsou na jaře a na podzim.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Fakta o Zemi ------------------------------------------------------------------------ */
function fakta() {
  const p = $('plocha');
  const u = Uloha.nahodne(FAKTA);
  p.innerHTML = `<div class="zadani">${u.o}</div>
    <div class="karta"><div class="obrazek">🌍</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.spr, ...u.jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.spr,
    zpravaOk: `✅ ${u.spr}.`,
    zpravaChyba: 'Zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { pohyby, dusledky, rovnodennost, fakta };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
