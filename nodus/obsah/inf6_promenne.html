<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programování – proměnné a podmínky</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .kod {
      font-family: 'Courier New', monospace; font-size: clamp(1rem, 3.6vw, 1.25rem);
      line-height: 1.75; background: var(--bg-deep); border: 1px solid var(--border-strong);
      border-radius: 10px; padding: 14px 18px; text-align: left; min-width: min(340px, 90vw);
    }
    .kod .klic { color: var(--accent); font-weight: 700; }
    .kod .promenna { color: var(--warn); }
    .kod .odsazeni { display: block; padding-left: 24px; }
    .stopa { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .stopa span {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 11px; font-family: 'Courier New', monospace; font-size: 0.9rem;
    }
    .situace-t { max-width: 540px; font-size: 1.02rem; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>📦 Programování – proměnné a podmínky</h1>
  <p class="podtitul">Pro 6.–7. ročník: co je proměnná, jak se mění její hodnota a jak funguje větvení.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="hodnota" class="active">🔢 Jaká je hodnota</button>
    <button data-rezim="vetveni">🔀 Co program vypíše</button>
    <button data-rezim="operatory">⚖️ Porovnávání</button>
    <button data-rezim="pojmy">📖 Pojmy</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Proměnná</b> je pojmenované místo v paměti, kam se dá uložit hodnota a kdykoli ji změnit.
    Zápis <b>x = x + 1</b> neznamená rovnici – přečte se „do x ulož hodnotu x zvětšenou o jedna“.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_inf6_promenne', $('skore'));
let rezim = 'hodnota';

/* ---- Jaká je hodnota ------------------------------------------------------------------- */
function hodnota() {
  const p = $('plocha');
  const start = Uloha.nahodneCislo(2, 12);
  const kroky = [];
  let x = start;
  const pocet = Uloha.nahodneCislo(2, 4);

  for (let i = 0; i < pocet; i++) {
    const op = Uloha.nahodne(['+', '-', '*']);
    const c = op === '*' ? Uloha.nahodneCislo(2, 3) : Uloha.nahodneCislo(1, 9);
    kroky.push(`x = x ${op} ${c}`);
    x = op === '+' ? x + c : op === '-' ? x - c : x * c;
  }

  p.innerHTML = `<div class="zadani">Jakou hodnotu má proměnná <b>x</b> na konci?</div>
    <div class="kod"><span class="promenna">x</span> = ${start}<br>
      ${kroky.map(k => k.replace(/x/g, '<span class="promenna">x</span>')).join('<br>')}</div>`;

  const jine = new Set();
  let pokusu1 = 0;
  while (jine.size < 3 && pokusu1++ < 200) {
    const k = x + Uloha.nahodne([-10, -5, -2, -1, 1, 2, 5, 10]);
    if (k !== x) jine.add(k);
  }
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([x, ...jine]).map(v => ({ klic: String(v), popis: String(v) })),
    spravnyKlic: String(x),
    zpravaOk: `✅ Postupně: ${start} → ${x}. Každý řádek přepíše hodnotu proměnné.`,
    zpravaChyba: 'Počítej řádek po řádku a po každém si zapiš novou hodnotu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Co program vypíše ------------------------------------------------------------------ */
function vetveni() {
  const p = $('plocha');
  const x = Uloha.nahodneCislo(1, 20);
  const mez = Uloha.nahodneCislo(5, 15);
  const typ = Uloha.nahodne(['vetsi', 'mensiRovno', 'sude']);

  let podminka, vysledek, textA = 'VELKÉ', textB = 'MALÉ';
  if (typ === 'vetsi') {
    podminka = `x &gt; ${mez}`;
    vysledek = x > mez ? textA : textB;
  } else if (typ === 'mensiRovno') {
    podminka = `x &lt;= ${mez}`;
    vysledek = x <= mez ? textA : textB;
  } else {
    podminka = 'x % 2 == 0';
    textA = 'SUDÉ'; textB = 'LICHÉ';
    vysledek = x % 2 === 0 ? textA : textB;
  }

  p.innerHTML = `<div class="zadani">Co program vypíše?</div>
    <div class="kod"><span class="promenna">x</span> = ${x}<br>
      <span class="klic">když</span> ${podminka}:
      <span class="odsazeni">vypiš „${textA}“</span>
      <span class="klic">jinak</span>:
      <span class="odsazeni">vypiš „${textB}“</span></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: Uloha.zamichej([textA, textB]).map(t => ({ klic: t, popis: '„' + t + '“' })),
    spravnyKlic: vysledek,
    zpravaOk: `✅ Pro x = ${x} je podmínka ${vysledek === textA ? 'splněná' : 'nesplněná'},
      proto se vypíše „${vysledek}“.`,
    zpravaChyba: 'Dosaď hodnotu x do podmínky a rozhodni, jestli platí.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Porovnávání ------------------------------------------------------------------------ */
function operatory() {
  const p = $('plocha');
  const a = Uloha.nahodneCislo(1, 20), b = Uloha.nahodneCislo(1, 20);
  const op = Uloha.nahodne(['>', '<', '>=', '<=', '==', '!=']);
  const vysledky = {
    '>': a > b, '<': a < b, '>=': a >= b, '<=': a <= b, '==': a === b, '!=': a !== b,
  };
  const zapis = { '>': '&gt;', '<': '&lt;', '>=': '&gt;=', '<=': '&lt;=', '==': '==', '!=': '!=' };
  const vyznam = {
    '>': 'je větší než', '<': 'je menší než', '>=': 'je větší nebo rovno',
    '<=': 'je menší nebo rovno', '==': 'se rovná', '!=': 'se nerovná',
  };

  p.innerHTML = `<div class="zadani">Platí tato podmínka?</div>
    <div class="kod">${a} ${zapis[op]} ${b}</div>
    <div class="situace-t">Operátor <b>${zapis[op]}</b> znamená „${vyznam[op]}“.</div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'ano', ikona: '✅', popis: 'pravda' },
      { klic: 'ne', ikona: '❌', popis: 'nepravda' },
    ],
    spravnyKlic: vysledky[op] ? 'ano' : 'ne',
    zpravaOk: `✅ ${a} ${op} ${b} je ${vysledky[op] ? 'pravda' : 'nepravda'}.`,
    zpravaChyba: `Operátor ${op} znamená „${vyznam[op]}“.`,
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Pojmy ------------------------------------------------------------------------------- */
const POJMY = [
  { n: 'proměnná', o: 'pojmenované místo v paměti, kam ukládáme hodnotu' },
  { n: 'přiřazení', o: 'zápis, kterým do proměnné uložíme novou hodnotu' },
  { n: 'podmínka', o: 'výraz, který je buď pravdivý, nebo nepravdivý' },
  { n: 'větvení', o: 'program se podle podmínky vydá jednou ze dvou cest' },
  { n: 'cyklus', o: 'opakování části programu' },
  { n: 'hodnota', o: 'to, co je v proměnné právě uloženo' },
  { n: 'datový typ', o: 'určuje, jestli jde o číslo, text, nebo pravdivostní hodnotu' },
  { n: 'ladění (debugging)', o: 'hledání a oprava chyb v programu' },
];

function pojmy() {
  const p = $('plocha');
  const u = Uloha.nahodne(POJMY);
  const jine = Uloha.zamichej(POJMY.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Který pojem odpovídá popisu?</div>
    <div class="karta"><div class="obrazek">📦</div><div class="situace-t">${u.o}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.o}.`,
    zpravaChyba: 'Zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { hodnota, vetveni, operatory, pojmy };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
