<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voda, vzduch a půda</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .nazev-jevu { font-size: 1.2rem; font-weight: 700; }
    .otazka-text { font-size: 1.08rem; max-width: 580px; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>💧 Voda, vzduch a půda</h1>
  <p class="podtitul">Pro 3.–4. ročník: skupenství vody, koloběh vody v přírodě, vlastnosti vzduchu a půdy.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="skupenstvi" class="active">🧊 Skupenství vody</button>
    <button data-rezim="kolobeh">🔄 Koloběh vody</button>
    <button data-rezim="kviz">❓ Vzduch a půda</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Voda má tři skupenství: <b>pevné</b> (led), <b>kapalné</b> (voda) a <b>plynné</b> (vodní pára).
    V přírodě neustále koluje – vypařuje se, tvoří mraky, prší a stéká zpátky do moří.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_prv3_voda', $('skore'));
let rezim = 'skupenstvi';

const SKUPENSTVI = [
  { n: 'led v mrazáku', e: '🧊', s: 'pevne' },
  { n: 'sníh na střeše', e: '❄️', s: 'pevne' },
  { n: 'kroupy', e: '🧊', s: 'pevne' },
  { n: 'rampouch', e: '🥶', s: 'pevne' },
  { n: 'voda v řece', e: '🌊', s: 'kapalne' },
  { n: 'déšť', e: '🌧️', s: 'kapalne' },
  { n: 'rosa na trávě', e: '💧', s: 'kapalne' },
  { n: 'voda v hrnci', e: '🥣', s: 'kapalne' },
  { n: 'pára nad hrncem', e: '♨️', s: 'plynne' },
  { n: 'mlha nad loukou', e: '🌫️', s: 'plynne' },
  { n: 'vodní pára ve vzduchu', e: '💨', s: 'plynne' },
  { n: 'obláček z konvice', e: '☁️', s: 'plynne' },
];

const NAZVY_SKUPENSTVI = {
  pevne: { nazev: 'pevné (led)', ikona: '🧊' },
  kapalne: { nazev: 'kapalné (voda)', ikona: '💧' },
  plynne: { nazev: 'plynné (pára)', ikona: '💨' },
};

const KOLOBEH = [
  '☀️ Slunce ohřeje vodu v moři',
  '💨 Voda se vypaří do vzduchu',
  '☁️ Pára se ochladí a vzniknou mraky',
  '🌧️ Z mraků prší nebo sněží',
  '🏞️ Voda steče do potoků a řek',
  '🌊 Řeky odnesou vodu zpátky do moře',
];

const KVIZ = [
  { o: 'Z čeho je hlavně složený vzduch?', v: ['dusík a kyslík', 'jen kyslík', 'vodní pára a kouř'], proc: 'Vzduch je směs plynů – nejvíc je v něm dusíku, pak kyslíku.' },
  { o: 'Který plyn potřebujeme k dýchání?', v: ['kyslík', 'dusík', 'oxid uhličitý'], proc: 'Kyslík vdechujeme, oxid uhličitý vydechujeme.' },
  { o: 'Co vyrábějí rostliny na světle?', v: ['kyslík', 'dusík', 'prach'], proc: 'Rostliny při fotosyntéze uvolňují kyslík – proto je les tak zdravý.' },
  { o: 'Čím se pozná úrodná půda?', v: ['má hodně humusu', 'je úplně suchá', 'nemá žádné živočichy'], proc: 'Humus je tlející zbytky rostlin a živočichů – dělá půdu úrodnou.' },
  { o: 'Kdo pomáhá kypřit půdu?', v: ['žížaly', 'vosy', 'mouchy'], proc: 'Žížaly hloubí chodbičky, kterými se do půdy dostane vzduch a voda.' },
  { o: 'Co se stane s vodou při 100 °C?', v: ['začne se vařit a měnit v páru', 'zmrzne', 'zmizí beze zbytku'], proc: 'Při varu se voda mění v plynné skupenství – vodní páru.' },
  { o: 'Při jaké teplotě voda mrzne?', v: ['0 °C', '10 °C', '100 °C'], proc: 'Při nule se voda mění v led – pevné skupenství.' },
  { o: 'Proč se nesmí do potoka lít barvy a oleje?', v: ['znečistí vodu pro rostliny i živočichy', 'změní barvu vody a to je vše', 'nic se nestane'], proc: 'Znečištěná voda ubližuje rybám i rostlinám a vrací se k nám v pitné vodě.' },
  { o: 'Jak poznáme, že vzduch je v pohybu?', v: ['fouká vítr', 'je vidět', 'je slyšet ticho'], proc: 'Vzduch není vidět, ale jeho pohyb cítíme jako vítr.' },
  { o: 'K čemu je v půdě voda?', v: ['rostliny ji nasávají kořeny', 'jen ji ochlazuje', 'nemá tam význam'], proc: 'Kořeny nasávají vodu s rozpuštěnými živinami.' },
];

/* ---- Skupenství ------------------------------------------------------------ */
function skupenstvi() {
  const p = $('plocha');
  const u = Uloha.nahodne(SKUPENSTVI);
  p.innerHTML = `<div class="zadani">Jaké je to skupenství vody?</div>
    <div class="karta"><div class="obrazek">${u.e}</div><div class="nazev-jevu">${u.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Object.entries(NAZVY_SKUPENSTVI).map(([klic, s]) => ({ klic, ikona: s.ikona, popis: s.nazev })),
    spravnyKlic: u.s,
    zpravaOk: `✅ ${u.n} – skupenství ${NAZVY_SKUPENSTVI[u.s].nazev}.`,
    zpravaChyba: 'Zkus to znovu – dá se to nabrat do dlaně, nalít, nebo je to jen ve vzduchu?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Koloběh vody (řazení) ------------------------------------------------- */
function kolobeh() {
  const p = $('plocha');
  p.innerHTML = '<div class="zadani">Seřaď koloběh vody – klepej popořadě od začátku.</div>';
  const porada = document.createElement('div');
  porada.className = 'porada';
  const nabidka = document.createElement('div');
  nabidka.className = 'nabidka';
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  let dalsiIndex = 0, chyboval = false;

  Uloha.zamichej(KOLOBEH).forEach(krok => {
    const b = document.createElement('button');
    b.textContent = krok;
    b.dataset.krok = krok;
    b.addEventListener('click', () => {
      if (b.disabled) return;
      if (krok === KOLOBEH[dalsiIndex]) {
        const el = document.createElement('span');
        el.className = 'polozka';
        el.innerHTML = `<span class="cislo">${dalsiIndex + 1}.</span>${krok}`;
        porada.appendChild(el);
        b.disabled = true;
        dalsiIndex++;
        odezva.className = 'odezva ok';
        odezva.textContent = '✅ Správně!';
        if (dalsiIndex === KOLOBEH.length) {
          odezva.textContent = '🎉 Koloběh vody je hotový – a začíná znovu!';
          skore.vyhodnot(!chyboval);
          setTimeout(novaUloha, Uloha.PRODLEVA + 600);
        }
      } else {
        chyboval = true;
        Uloha.trhni(b);
        odezva.className = 'odezva chyba';
        odezva.textContent = dalsiIndex === 0
          ? 'Čím to celé začíná? Co dodává energii?'
          : `Po kroku „${KOLOBEH[dalsiIndex - 1]}“ následuje něco jiného.`;
      }
    });
    nabidka.appendChild(b);
  });
  p.append(porada, nabidka, odezva);
}

/* ---- Kvíz vzduch a půda ---------------------------------------------------- */
function kviz() {
  const p = $('plocha');
  const u = Uloha.nahodne(KVIZ);
  p.innerHTML = `<div class="zadani"><span class="otazka-text">${u.o}</span></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(u.v).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.v[0],
    zpravaOk: '✅ ' + u.proc,
    zpravaChyba: 'Ještě ne – zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { skupenstvi, kolobeh, kviz };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
