<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hustota</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .zadani-vypoctu { font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 700; max-width: 560px; line-height: 1.5; }
    .vzorec { color: var(--text-faint); font-size: 0.9rem; }
    .nadoba { width: min(260px, 68vw); }
    .nadoba .sklo { fill: none; stroke: var(--border-strong); stroke-width: 3; }
    .nadoba .voda { fill: var(--accent); fill-opacity: 0.35; }
    .nadoba .telisko { stroke: var(--text); stroke-width: 2; }
    .tabulka-hustot { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; max-width: 900px; margin-top: 12px; }
    .tabulka-hustot span {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 10px; font-size: 0.76rem; color: var(--text-muted);
    }
    .tabulka-hustot b { color: var(--text); }
  </style>
</head>
<body>
  <h1>⚖️ Hustota</h1>
  <p class="podtitul">Pro 6.–7. ročník: výpočet hustoty, hmotnosti a objemu, plavání a potápění těles.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="vypocet" class="active">🧮 Vypočítej hustotu</button>
    <button data-rezim="hmotnost">⚖️ Dopočítej hmotnost</button>
    <button data-rezim="plavani">🛟 Bude plavat?</button>
    <button data-rezim="porovnej">📊 Co je těžší</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <div class="tabulka-hustot" id="tabulkaHustot"></div>

  <p class="napoveda">
    <b>ρ = m / V</b> (hustota = hmotnost děleno objemem), <b>m = ρ × V</b>, <b>V = m / ρ</b>.
    Těleso plave, když má <b>menší hustotu než kapalina</b>, ve které je.
    Hustota vody je 1000 kg/m³, tedy 1 g/cm³.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_f6_hustota', $('skore'));
let rezim = 'vypocet';

/* hustoty v g/cm³ */
const LATKY = [
  { n: 'korek', e: '🟤', ro: 0.2 }, { n: 'suché dřevo', e: '🪵', ro: 0.6 },
  { n: 'led', e: '🧊', ro: 0.92 }, { n: 'voda', e: '💧', ro: 1 },
  { n: 'cukr', e: '🍬', ro: 1.6 }, { n: 'sklo', e: '🪟', ro: 2.5 },
  { n: 'hliník', e: '🥫', ro: 2.7 }, { n: 'žula', e: '🪨', ro: 2.8 },
  { n: 'železo', e: '⛓️', ro: 7.8 }, { n: 'měď', e: '🔶', ro: 8.9 },
  { n: 'olovo', e: '⚫', ro: 11.3 }, { n: 'zlato', e: '🥇', ro: 19.3 },
];

$('tabulkaHustot').innerHTML = LATKY
  .map(l => `<span>${l.e} <b>${l.n}</b> ${String(l.ro).replace('.', ',')} g/cm³</span>`).join('');

/* ---- Vypočítej hustotu -------------------------------------------------------------- */
function vypocet() {
  const p = $('plocha');
  const l = Uloha.nahodne(LATKY.filter(x => Number.isInteger(x.ro) || x.ro >= 1));
  const V = Uloha.nahodneCislo(2, 20);
  const m = +(l.ro * V).toFixed(1);

  p.innerHTML = `<div class="zadani">Vypočítej hustotu látky:</div>
    <div class="karta"><div class="obrazek">${l.e}</div>
    <div class="zadani-vypoctu">Těleso má hmotnost ${String(m).replace('.', ',')} g
      a objem ${V} cm³.</div>
    <div class="vzorec">ρ = m / V</div></div>`;

  const jine = new Set(LATKY.filter(x => x.ro !== l.ro).map(x => x.ro));
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([l.ro, ...Uloha.zamichej([...jine]).slice(0, 3)])
      .map(v => ({ klic: String(v), popis: String(v).replace('.', ',') + ' g/cm³' })),
    spravnyKlic: String(l.ro),
    zpravaOk: `✅ ρ = ${String(m).replace('.', ',')} : ${V} = ${String(l.ro).replace('.', ',')} g/cm³ – je to ${l.n}.`,
    zpravaChyba: 'Vyděl hmotnost objemem.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Dopočítej hmotnost -------------------------------------------------------------- */
function hmotnost() {
  const p = $('plocha');
  const l = Uloha.nahodne(LATKY);
  const V = Uloha.nahodneCislo(2, 15);
  const m = +(l.ro * V).toFixed(1);

  p.innerHTML = `<div class="zadani">Jakou hmotnost má těleso?</div>
    <div class="karta"><div class="obrazek">${l.e}</div>
    <div class="zadani-vypoctu">${l.n} o objemu ${V} cm³,
      hustota ${String(l.ro).replace('.', ',')} g/cm³</div>
    <div class="vzorec">m = ρ × V</div></div>`;

  const jine = new Set([+(m / 2).toFixed(1), +(m * 2).toFixed(1), +(V / l.ro).toFixed(1)]
    .filter(x => x !== m && x > 0));
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'velke',
    moznosti: Uloha.zamichej([m, ...[...jine].slice(0, 3)])
      .map(v => ({ klic: String(v), popis: String(v).replace('.', ',') + ' g' })),
    spravnyKlic: String(m),
    zpravaOk: `✅ m = ${String(l.ro).replace('.', ',')} × ${V} = ${String(m).replace('.', ',')} g`,
    zpravaChyba: 'Hmotnost spočítáš vynásobením hustoty a objemu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Bude plavat? --------------------------------------------------------------------- */
function plavani() {
  const p = $('plocha');
  const l = Uloha.nahodne(LATKY.filter(x => x.n !== 'voda'));
  const plave = l.ro < 1;

  p.innerHTML = `<div class="zadani">Bude těleso ve vodě plavat, nebo se potopí?</div>
    <svg class="nadoba" viewBox="0 0 200 160">
      <rect class="voda" x="22" y="58" width="156" height="88"/>
      <path class="sklo" d="M20 20 V146 H180 V20"/>
      <circle class="telisko" cx="100" cy="${plave ? 58 : 130}" r="17"
        fill="var(--bg-control)"/>
      <text x="100" y="${plave ? 64 : 136}" font-size="18" text-anchor="middle">${l.e}</text>
    </svg>
    <div class="zadani-vypoctu">${l.n} – hustota ${String(l.ro).replace('.', ',')} g/cm³</div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'plave', ikona: '🛟', popis: 'bude plavat' },
      { klic: 'potopi', ikona: '⚓', popis: 'potopí se' },
    ],
    spravnyKlic: plave ? 'plave' : 'potopi',
    zpravaOk: plave
      ? `✅ ${l.n} má hustotu ${String(l.ro).replace('.', ',')} g/cm³, což je méně než voda (1 g/cm³) – plave.`
      : `✅ ${l.n} má hustotu ${String(l.ro).replace('.', ',')} g/cm³, tedy víc než voda – potopí se.`,
    zpravaChyba: 'Porovnej hustotu látky s hustotou vody, která je 1 g/cm³.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Co je těžší ----------------------------------------------------------------------- */
function porovnej() {
  const p = $('plocha');
  const a = Uloha.nahodne(LATKY);
  let b = Uloha.nahodne(LATKY);
  while (b.ro === a.ro) b = Uloha.nahodne(LATKY);
  const V = Uloha.nahodne([1, 2, 5, 10]);
  const tezsi = a.ro > b.ro ? 'a' : 'b';

  p.innerHTML = `<div class="zadani">Které těleso o objemu <b>${V} cm³</b> bude těžší?</div>
    <div class="karta"><div style="display:flex;gap:30px;justify-content:center">
      <div><div class="obrazek">${a.e}</div><div>${a.n}</div></div>
      <div><div class="obrazek">${b.e}</div><div>${b.n}</div></div>
    </div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'a', popis: a.n },
      { klic: 'b', popis: b.n },
    ],
    spravnyKlic: tezsi,
    zpravaOk: `✅ ${a.n}: ${String(+(a.ro * V).toFixed(1)).replace('.', ',')} g, `
      + `${b.n}: ${String(+(b.ro * V).toFixed(1)).replace('.', ',')} g – při stejném objemu rozhoduje hustota.`,
    zpravaChyba: 'Při stejném objemu je těžší látka s větší hustotou.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { vypocet, hmotnost, plavani, porovnej };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
