<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mýty, báje a pohádky</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .ukazka {
      background: var(--bg-deep); border-left: 4px solid var(--accent); border-radius: 8px;
      padding: 14px 18px; max-width: 580px; text-align: left; font-size: 1rem;
      line-height: 1.6; font-style: italic;
    }
    .postava { font-size: 1.3rem; font-weight: 700; }
    .popis-p { color: var(--text-muted); max-width: 540px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>🐉 Mýty, báje a pohádky</h1>
  <p class="podtitul">Pro 6. ročník: literární žánry, řecké báje a postavy pověstí.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="zanr" class="active">📖 Jaký je to žánr?</button>
    <button data-rezim="bohove">⚡ Řečtí bohové</button>
    <button data-rezim="hrdinove">🛡️ Báje a hrdinové</button>
    <button data-rezim="pojmy">🔤 Literární pojmy</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Mýtus</b> vysvětluje vznik světa a jevů, <b>báje</b> vypráví o bozích a hrdinech,
    <b>pověst</b> se váže ke skutečnému místu či osobě a <b>pohádka</b> je vymyšlený příběh
    s dobrým koncem, kde vítězí dobro.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_cj6_baje', $('skore'));
let rezim = 'zanr';

const ZANRY = {
  pohadka: 'pohádka',
  povest: 'pověst',
  baje: 'báje (mýtus)',
  bajka: 'bajka',
};

const UKAZKY = [
  { t: 'Byl jednou jeden král a ten měl tři syny. Nejmladší z nich se vydal do světa hledat zlaté jablko…',
    z: 'pohadka', proc: 'neurčitý čas a místo, kouzelné předměty, dobrý konec' },
  { t: 'Praotec Čech vystoupil na horu Říp a rozhlédl se po zemi, kterou pro svůj lid vybral.',
    z: 'povest', proc: 'váže se ke skutečnému místu – hoře Říp' },
  { t: 'Zeus vládl z Olympu a svými blesky trestal ty, kdo se provinili proti bohům.',
    z: 'baje', proc: 'vypráví o bozích a vysvětluje jevy v přírodě' },
  { t: 'Liška spatřila na větvi havrana se sýrem a začala mu lichotit, jak krásně zpívá.',
    z: 'bajka', proc: 'zvířata jednají jako lidé a příběh končí ponaučením' },
  { t: 'Když Prométheus přinesl lidem oheň, Zeus ho nechal přikovat ke skále.',
    z: 'baje', proc: 'vysvětluje původ ohně skrze příběh bohů' },
  { t: 'V pražských sklepeních prý dodnes žije golem, kterého stvořil rabi Löw.',
    z: 'povest', proc: 'váže se ke skutečnému místu a historické osobě' },
  { t: 'Mravenec celé léto pilně sbíral zásoby, zatímco cvrček jen hrál a zpíval.',
    z: 'bajka', proc: 'zvířecí postavy nesou lidské vlastnosti a příběh učí' },
  { t: 'Za devatero horami a devatero řekami žila chudá dívka se zlým otčímem.',
    z: 'pohadka', proc: 'typický pohádkový úvod a neurčité místo' },
];

const BOHOVE = [
  { n: 'Zeus', e: '⚡', o: 'nejvyšší bůh, vládce blesků a hromů' },
  { n: 'Poseidon', e: '🔱', o: 'bůh moří, zemětřesení a koní' },
  { n: 'Hádes', e: '💀', o: 'vládce podsvětí a říše mrtvých' },
  { n: 'Athéna', e: '🦉', o: 'bohyně moudrosti, řemesel a spravedlivé války' },
  { n: 'Apollón', e: '🎵', o: 'bůh slunce, hudby a věštění' },
  { n: 'Artemis', e: '🏹', o: 'bohyně lovu a divoké přírody' },
  { n: 'Áres', e: '⚔️', o: 'bůh krvavé války a bitevní vřavy' },
  { n: 'Afrodita', e: '🌹', o: 'bohyně lásky a krásy' },
  { n: 'Hermes', e: '👟', o: 'posel bohů, ochránce obchodníků a cestovatelů' },
  { n: 'Héfaistos', e: '🔨', o: 'kovář bohů, bůh ohně a řemesel' },
];

const HRDINOVE = [
  { n: 'Héraklés', e: '💪', o: 'vykonal dvanáct nadlidských úkolů, například zabil lernskou hydru' },
  { n: 'Théseus', e: '🧵', o: 'zabil Mínotaura v labyrintu a našel cestu ven podle nitě' },
  { n: 'Ikaros', e: '🪶', o: 'letěl na křídlech z vosku, ale přiblížil se ke slunci a zřítil se' },
  { n: 'Odysseus', e: '⛵', o: 'deset let bloudil po moři cestou domů z trojské války' },
  { n: 'Achilles', e: '🛡️', o: 'nejlepší řecký bojovník, zranitelný jen na patě' },
  { n: 'Prométheus', e: '🔥', o: 'přinesl lidem oheň a byl za to přikován ke skále' },
  { n: 'Orfeus', e: '🎻', o: 'svou hrou obměkčil vládce podsvětí, ale ohlédl se po Eurydice' },
  { n: 'Daidalos', e: '🏛️', o: 'stavitel labyrintu, který vyrobil křídla pro sebe a syna' },
];

const POJMY = [
  { n: 'mýtus', o: 'příběh vysvětlující vznik světa a přírodních jevů' },
  { n: 'bajka', o: 'krátký příběh se zvířaty, který končí ponaučením' },
  { n: 'pověst', o: 'vyprávění vázané ke konkrétnímu místu nebo osobě' },
  { n: 'pohádka', o: 'vymyšlený příběh s kouzly, kde dobro vítězí nad zlem' },
  { n: 'personifikace', o: 'zvíře nebo věc jedná a mluví jako člověk' },
  { n: 'ponaučení', o: 'myšlenka, kterou si má čtenář z příběhu odnést' },
  { n: 'hrdina', o: 'hlavní postava, která překonává překážky' },
  { n: 'labyrint', o: 'bludiště, ze kterého je těžké najít cestu ven' },
];

/* ---- Jaký je to žánr? ------------------------------------------------------------ */
function zanr() {
  const p = $('plocha');
  const u = Uloha.nahodne(UKAZKY);
  p.innerHTML = `<div class="zadani">Z jakého žánru je ukázka?</div>
    <div class="ukazka">„${u.t}“</div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(Object.entries(ZANRY)).map(([klic, popis]) => ({ klic, popis })),
    spravnyKlic: u.z,
    zpravaOk: `✅ ${ZANRY[u.z]} – ${u.proc}.`,
    zpravaChyba: 'Všimni si, kdo v příběhu vystupuje a jestli se váže ke skutečnému místu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Řečtí bohové ----------------------------------------------------------------- */
function bohove() {
  const p = $('plocha');
  const u = Uloha.nahodne(BOHOVE);
  const jine = Uloha.zamichej(BOHOVE.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O kterého boha jde?</div>
    <div class="karta"><div class="obrazek">${u.e}</div><div class="popis-p">${u.o}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.o}.`,
    zpravaChyba: 'To je jiný bůh z řecké mytologie.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Báje a hrdinové --------------------------------------------------------------- */
function hrdinove() {
  const p = $('plocha');
  const u = Uloha.nahodne(HRDINOVE);
  const jine = Uloha.zamichej(HRDINOVE.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O kterém hrdinovi se to vypráví?</div>
    <div class="karta"><div class="obrazek">${u.e}</div><div class="popis-p">${u.o}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.o}.`,
    zpravaChyba: 'To je příběh jiného hrdiny.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Literární pojmy ---------------------------------------------------------------- */
function pojmy() {
  const p = $('plocha');
  const u = Uloha.nahodne(POJMY);
  const jine = Uloha.zamichej(POJMY.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Který pojem se sem hodí?</div>
    <div class="karta"><div class="obrazek">📖</div><div class="popis-p">${u.o}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.o}.`,
    zpravaChyba: 'To je jiný pojem.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { zanr, bohove, hrdinove, pojmy };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
