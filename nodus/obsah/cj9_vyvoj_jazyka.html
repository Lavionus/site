<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Útvary a vývoj českého jazyka</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../uloha.js"></script>
  <script src="../mapy.js"></script>
  <style>
    .ukazka { max-width: 620px; text-align: left; line-height: 1.6; background: var(--bg-elevated);
      border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 16px; font-style: italic;
      font-size: 1.05rem; }
    .uloha-text { max-width: 640px; font-size: 1.02rem; line-height: 1.6; }
    .uloha-text b { color: var(--accent); }
    .slovo-velke { font-size: clamp(1.5rem, 5.5vw, 2.2rem); font-weight: 700; }
  </style>
</head>
<body>
  <h1>🗿 Útvary a vývoj českého jazyka</h1>
  <p class="podtitul">Pro 9. ročník: spisovná i nespisovná čeština, nářečí a proměny jazyka v čase.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="utvary" class="active">🗣️ Útvary jazyka</button>
    <button data-rezim="nareci">🗺️ Nářeční oblasti</button>
    <button data-rezim="vyvoj">⏳ Vývoj jazyka</button>
    <button data-rezim="slova">📜 Stará a nová slova</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Spisovná čeština</b> má psanou i mluvenou (hovorovou) podobu. Mezi <b>nespisovné útvary</b>
    patří obecná čeština, nářečí, slang a argot. Čeština patří mezi <b>západoslovanské jazyky</b>.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_cj9_vyvoj_jazyka', $('skore'));
let rezim = 'utvary';
function odezvaEl() { const d = document.createElement('div'); d.className = 'odezva'; return d; }

const UTVARY = {
  spisovny: 'spisovná čeština',
  hovorovy: 'hovorová čeština (mluvená podoba spisovného jazyka)',
  obecna: 'obecná čeština',
  nareci: 'nářečí (dialekt)',
  slang: 'slang',
  argot: 'argot',
};
const UKAZKY = [
  { u: 'spisovny', t: 'Vážená paní ředitelko, dovoluji si Vás požádat o uvolnění z výuky.' },
  { u: 'spisovny', t: 'Hlavním úkolem této práce je popsat vývoj vodních toků v regionu.' },
  { u: 'hovorovy', t: 'Musím ještě zajít do knihovny, ale asi to dneska nestihnu.' },
  { u: 'obecna', t: 'Dneska sem byl u doktora, ale ten mladej doktor tam nebyl.' },
  { u: 'obecna', t: 'Ty velký stromy vokolo baráku museli pokácet.' },
  { u: 'nareci', t: 'Idu do mesta, mosím eště kúpit chlebu.' },
  { u: 'nareci', t: 'Ná co tam chodíš, dyť je zavřeno, ogare.' },
  { u: 'slang', t: 'Dneska máme dvě suplovaný hodiny a pak píšeme písemku z matiky.' },
  { u: 'slang', t: 'Vyfotil jsem to na širokáč a hodil do postprodukce.' },
  { u: 'argot', t: 'Mluva zlodějů a překupníků, které ostatní schválně nemají rozumět.' },
];
function utvary() {
  const p = $('plocha');
  const u = Uloha.nahodne(UKAZKY);
  p.innerHTML = `<div class="zadani">Ke kterému útvaru jazyka ukázka patří?</div>
    <div class="ukazka">${u.t}</div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.u, ...Uloha.zamichej(Object.keys(UTVARY).filter(k => k !== u.u)).slice(0, 3)])
      .map(k => ({ klic: k, popis: UTVARY[k] })),
    spravnyKlic: u.u,
    zpravaOk: `✅ ${UTVARY[u.u]}`,
    zpravaChyba: 'Sleduj koncovky a slovní zásobu – prozradí, zda jde o spisovný projev, nebo ne.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const NARECI = [
  { klic: 'ceska', popis: 'česká nářeční skupina', lon: 14.3, lat: 49.9,
    info: 'Čechy a západní Morava; typické je „ej“ místo „ý“ (dobrej) a „vo“ na začátku slov (vokno)' },
  { klic: 'stredomoravska', popis: 'středomoravská (hanácká)', lon: 17.0, lat: 49.5,
    info: 'okolí Olomouce a Prostějova; místo „ý“ a „ej“ se objevuje „é“ (dobré den)' },
  { klic: 'vychodomoravska', popis: 'východomoravská (moravskoslovenská)', lon: 17.8, lat: 49.1,
    info: 'Slovácko a Valašsko; blíží se slovenštině (múka, ogar)' },
  { klic: 'slezska', popis: 'slezská (lašská)', lon: 18.3, lat: 49.9,
    info: 'Opavsko a Ostravsko; krátké samohlásky a přízvuk na předposlední slabice' },
];
function nareci() {
  const p = $('plocha');
  const cil = Uloha.nahodne(NARECI);
  const stav = { chyboval: false, hotovo: false };
  p.innerHTML = `<div class="zadani uloha-text">Kde se mluví nářečím: <b>${cil.popis}</b>?
      Klepni na správnou oblast.</div>` + Mapy.svg('cesko', NARECI);
  const odezva = odezvaEl();
  p.querySelectorAll('.znacka').forEach(g => {
    const trefa = NARECI.find(x => x.klic === g.dataset.klic);
    g.addEventListener('click', () => Uloha.odpoved({
      prvek: g, spravne: g.dataset.klic === cil.klic, stav, odezva,
      zpravaOk: `✅ ${cil.popis} – ${cil.info}`,
      zpravaChyba: `Tady je oblast: ${trefa.popis}.`,
      poSpravne: skore.vyhodnot,
      dalsi: novaUloha,
    }));
  });
  p.appendChild(odezva);
}

const VYVOJ = [
  { q: 'Do které skupiny jazyků patří čeština?', a: 'západoslovanské jazyky', b: ['východoslovanské', 'jihoslovanské', 'germánské'] },
  { q: 'Který jazyk je češtině nejbližší?', a: 'slovenština', b: ['polština', 'ruština', 'němčina'] },
  { q: 'Jaký jazyk přinesli na Velkou Moravu Konstantin a Metoděj?', a: 'staroslověnštinu', b: ['latinu', 'starou češtinu', 'řečtinu jako lidový jazyk'] },
  { q: 'Které písmo sestavil Konstantin?', a: 'hlaholici', b: ['latinku', 'runy', 'klínové písmo'] },
  { q: 'Kdy se objevují první souvislé české texty?', a: 've 13. a 14. století', b: ['v 9. století', 'v 18. století', 've 20. století'] },
  { q: 'Čím je významná Bible kralická?', a: 'je vzorem tzv. humanistické češtiny 16. století', b: ['je nejstarší českou knihou', 'je psaná hlaholicí', 'vznikla za obrození'] },
  { q: 'Co se s češtinou stalo po roce 1620?', a: 'ustoupila němčině ve veřejném životě, udržela se hlavně na venkově', b: ['zanikla úplně', 'stala se úředním jazykem říše', 'sloučila se s polštinou'] },
  { q: 'Kdo v obrození obhájil češtinu jako jazyk vědy?', a: 'Josef Dobrovský a Josef Jungmann', b: ['Karel IV.', 'Jan Hus', 'Bohuslav Balbín jako jediný'] },
  { q: 'Co zavedl pravopis navržený v době Jana Husa?', a: 'diakritická znaménka (háčky a čárky) místo spřežek', b: ['latinku místo hlaholice', 'psaní velkých písmen', 'psaní zprava doleva'] },
  { q: 'Jak se čeština mění dnes?', a: 'přejímá slova z angličtiny a vznikají nová slova pro nové věci', b: ['nemění se vůbec', 'vrací se ke staroslověnštině', 'ztrácí pády'] },
];
function vyvoj() {
  const p = $('plocha');
  const u = Uloha.nahodne(VYVOJ);
  p.innerHTML = `<div class="zadani uloha-text">${u.q}</div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.a, ...u.b]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.a,
    zpravaOk: `✅ ${u.a}`,
    zpravaChyba: 'Postupuj po časové ose: staroslověnština – stará čeština – humanistická – obrozenská – dnešní.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const SLOVA = [
  { s: 'šenkýř', typ: 'historismus', vyznam: 'hostinský – slovo zaniklo spolu s věcí' },
  { s: 'rytíř', typ: 'historismus', vyznam: 'označení, které patří k zaniklé době' },
  { s: 'pacholek', typ: 'historismus', vyznam: 'čeledín na statku, dnes už taková práce neexistuje' },
  { s: 'anžto', typ: 'archaismus', vyznam: 'zastaralé slovo pro „protože“, dnes říkáme jinak' },
  { s: 'zajisté', typ: 'archaismus', vyznam: 'zastaralý výraz pro „určitě“' },
  { s: 'lékárník řečený apatykář', typ: 'archaismus', vyznam: 'starý název pro věc, která existuje dodnes' },
  { s: 'selfie', typ: 'neologismus', vyznam: 'nové slovo přejaté z angličtiny' },
  { s: 'e-shop', typ: 'neologismus', vyznam: 'nové slovo pro internetový obchod' },
  { s: 'blogovat', typ: 'neologismus', vyznam: 'nové sloveso odvozené od slova blog' },
];
const TYPY_SLOV = {
  archaismus: 'archaismus – zastaralé slovo pro věc, která existuje dodnes',
  historismus: 'historismus – slovo pro věc, která zanikla',
  neologismus: 'neologismus – nově vzniklé slovo',
};
function slova() {
  const p = $('plocha');
  const u = Uloha.nahodne(SLOVA);
  p.innerHTML = `<div class="zadani">Jak označíme toto slovo?</div>
    <div class="karta"><div class="slovo-velke">${u.s}</div></div>`;
  const odezva = odezvaEl();
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(Object.entries(TYPY_SLOV).map(([k, v]) => ({ klic: k, popis: v }))),
    spravnyKlic: u.typ,
    zpravaOk: `✅ ${TYPY_SLOV[u.typ].split(' – ')[0]} – ${u.vyznam}`,
    zpravaChyba: 'Zeptej se: zanikla ta věc, nebo jen slovo? A nevzniklo slovo teprve nedávno?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { utvary, nareci, vyvoj, slova };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
novaUloha();
</script>
</body>
</html>
