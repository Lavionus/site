<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angličtina – pozdravy a představení</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .fraze { font-size: clamp(1.5rem, 6vw, 2.4rem); font-weight: 700; }
    .vyslovnost { color: var(--text-faint); font-size: 0.92rem; font-style: italic; }
    .hodiny-cas { font-size: clamp(2rem, 8vw, 3rem); font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>👋 Pozdravy a představení</h1>
  <p class="podtitul">Pro 3. ročník angličtiny: jak pozdravit, odpovědět a představit se.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="vyznam" class="active">🇨🇿 Co to znamená?</button>
    <button data-rezim="odpoved">💬 Co odpovíš?</button>
    <button data-rezim="denniDoba">🕐 Podle denní doby</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Good morning</b> říkáme do oběda, <b>good afternoon</b> odpoledne,
    <b>good evening</b> večer a <b>good night</b> na rozloučenou před spaním.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_aj3_pozdravy', $('skore'));
let rezim = 'vyznam';

const FRAZE = [
  { en: 'Hello!', cz: 'Ahoj! / Dobrý den!', vysl: 'helou' },
  { en: 'Good morning!', cz: 'Dobré ráno!', vysl: 'gud mórnyn' },
  { en: 'Good afternoon!', cz: 'Dobré odpoledne!', vysl: 'gud áftrnůn' },
  { en: 'Good evening!', cz: 'Dobrý večer!', vysl: 'gud ívnyn' },
  { en: 'Good night!', cz: 'Dobrou noc!', vysl: 'gud najt' },
  { en: 'Goodbye!', cz: 'Na shledanou!', vysl: 'gudbaj' },
  { en: 'See you tomorrow!', cz: 'Uvidíme se zítra!', vysl: 'sí jů tumorou' },
  { en: 'What is your name?', cz: 'Jak se jmenuješ?', vysl: 'wot iz jór nejm' },
  { en: 'My name is Tom.', cz: 'Jmenuji se Tom.', vysl: 'maj nejm iz tom' },
  { en: 'How are you?', cz: 'Jak se máš?', vysl: 'hau ár jů' },
  { en: 'I am fine, thank you.', cz: 'Mám se dobře, děkuji.', vysl: 'aj em fajn senk jů' },
  { en: 'Nice to meet you.', cz: 'Těší mě.', vysl: 'najs tu mít jů' },
  { en: 'How old are you?', cz: 'Kolik je ti let?', vysl: 'hau ould ár jů' },
  { en: 'I am nine years old.', cz: 'Je mi devět let.', vysl: 'aj em najn jírs ould' },
  { en: 'Where are you from?', cz: 'Odkud jsi?', vysl: 'wér ár jů from' },
  { en: 'I am from Czechia.', cz: 'Jsem z Česka.', vysl: 'aj em from čekija' },
  { en: 'Please.', cz: 'Prosím.', vysl: 'plíz' },
  { en: 'Thank you.', cz: 'Děkuji.', vysl: 'senk jů' },
  { en: 'You are welcome.', cz: 'Není zač.', vysl: 'jů ár welkam' },
  { en: 'Sorry!', cz: 'Promiň!', vysl: 'sory' },
];

const DIALOGY = [
  { otazka: 'How are you?', spravna: 'I am fine, thank you.', jine: ['My name is Tom.', 'I am nine years old.', 'Good night!'] },
  { otazka: 'What is your name?', spravna: 'My name is Tom.', jine: ['I am fine, thank you.', 'Nice to meet you.', 'Goodbye!'] },
  { otazka: 'How old are you?', spravna: 'I am nine years old.', jine: ['I am from Czechia.', 'Hello!', 'Thank you.'] },
  { otazka: 'Where are you from?', spravna: 'I am from Czechia.', jine: ['I am nine years old.', 'See you tomorrow!', 'Please.'] },
  { otazka: 'Thank you!', spravna: 'You are welcome.', jine: ['Good morning!', 'What is your name?', 'How are you?'] },
  { otazka: 'Nice to meet you.', spravna: 'Nice to meet you too.', jine: ['I am fine.', 'Good night!', 'Sorry!'] },
  { otazka: 'Good night!', spravna: 'Good night! Sleep well.', jine: ['Good morning!', 'How old are you?', 'Nice to meet you.'] },
  { otazka: 'Hello!', spravna: 'Hi!', jine: ['Goodbye!', 'Thank you.', 'I am from Czechia.'] },
];

const DENNI_DOBY = [
  { klic: 'morning', popis: 'Good morning!', ikona: '🌅', od: 6, do: 11 },
  { klic: 'afternoon', popis: 'Good afternoon!', ikona: '☀️', od: 12, do: 17 },
  { klic: 'evening', popis: 'Good evening!', ikona: '🌆', od: 18, do: 21 },
  { klic: 'night', popis: 'Good night!', ikona: '🌙', od: 22, do: 5 },
];

/* ---- Co to znamená? -------------------------------------------------------- */
function vyznam() {
  const p = $('plocha');
  const f = Uloha.nahodne(FRAZE);
  const jine = Uloha.zamichej(FRAZE.filter(x => x.cz !== f.cz)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Co znamená tato věta?</div>
    <div class="karta"><div class="fraze">${f.en}</div>
    <div class="vyslovnost">čti: ${f.vysl}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([f, ...jine]).map(x => ({ klic: x.cz, popis: x.cz })),
    spravnyKlic: f.cz,
    zpravaOk: `✅ ${f.en} = ${f.cz}`,
    zpravaChyba: 'To znamená něco jiného – zkus to znovu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Co odpovíš? ----------------------------------------------------------- */
function odpoved() {
  const p = $('plocha');
  const d = Uloha.nahodne(DIALOGY);
  p.innerHTML = `<div class="zadani">Co odpovíš?</div>
    <div class="karta"><div class="obrazek">💬</div><div class="fraze">${d.otazka}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([d.spravna, ...d.jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: d.spravna,
    zpravaOk: `✅ „${d.otazka}“ → „${d.spravna}“`,
    zpravaChyba: 'Tahle odpověď se sem nehodí – zkus jinou.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Podle denní doby ------------------------------------------------------ */
function denniDoba() {
  const p = $('plocha');
  const doba = Uloha.nahodne(DENNI_DOBY);
  const hodina = doba.klic === 'night'
    ? Uloha.nahodne([22, 23, 0, 1, 2, 3, 4, 5])
    : Uloha.nahodneCislo(doba.od, doba.do);
  p.innerHTML = `<div class="zadani">Jak pozdravíš v tuto dobu?</div>
    <div class="karta"><div class="obrazek">${doba.ikona}</div>
    <div class="hodiny-cas">${String(hodina).padStart(2, '0')}:00</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(DENNI_DOBY).map(x => ({ klic: x.klic, popis: x.popis })),
    spravnyKlic: doba.klic,
    zpravaOk: `✅ V ${hodina} hodin se říká „${doba.popis}“`,
    zpravaChyba: 'V tuhle hodinu se používá jiný pozdrav.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { vyznam, odpoved, denniDoba };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
