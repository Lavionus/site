<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rodina a domov</title>
  <link rel="stylesheet" href="../common.css">
  <script src="../theme.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    body { background-color: var(--bg-deep); padding: 20px clamp(12px, 3vw, 36px); min-height: 100vh; }
    h1 { font-size: 1.35rem; margin-bottom: 3px; }
    .podtitul { color: var(--text-muted); font-size: 0.86rem; margin-bottom: 14px; }

    .rezimy { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .rezimy button {
      background: var(--bg-control); border: 1px solid var(--border-strong); color: var(--text-muted);
      border-radius: 6px; padding: 8px 14px; font-size: 0.86rem; font-family: inherit; cursor: pointer;
    }
    .rezimy button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .plocha {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
      max-width: 900px; padding: 22px; text-align: center; min-height: 360px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .zadani { color: var(--text-muted); font-size: 1rem; }
    .zadani b { color: var(--text); font-size: 1.2rem; }
    .obrazek { font-size: clamp(3rem, 11vw, 4.6rem); line-height: 1; }

    /* Rodokmen */
    .patro { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
    .patro .nazev { color: var(--text-faint); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .patro .mista { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .misto {
      width: 96px; height: 92px; border-radius: 12px;
      border: 2px dashed var(--border-strong); background: var(--bg-deep);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: var(--text-faint); font-size: 0.8rem; cursor: pointer; transition: all 0.15s ease;
    }
    .misto .em { font-size: 1.9rem; line-height: 1; }
    .misto:hover { border-color: var(--accent); }
    .misto.cil { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .misto.plne { border-style: solid; background: var(--bg-elevated); color: var(--text); cursor: default; }
    .misto.chyba { border-color: var(--danger); animation: trhni 0.3s; }
    @keyframes trhni { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .spojka { color: var(--text-faint); font-size: 1.1rem; line-height: 1; }

    .kartiky { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
    .kartik {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-width: 92px; padding: 10px 8px; border-radius: 12px;
      background: var(--bg-control); border: 2px solid var(--border-strong); color: var(--text);
      font-size: 0.84rem; font-family: inherit; cursor: pointer; transition: all 0.15s ease;
    }
    .kartik .em { font-size: 1.7rem; line-height: 1; }
    .kartik:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-3px); }
    .kartik.vybrany { border-color: var(--accent); background: var(--accent-soft); }
    .kartik:disabled { opacity: 0.25; cursor: default; }

    /* Možnosti */
    .moznosti { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .moznosti button {
      min-width: 112px; padding: 14px 16px; border-radius: 12px;
      background: var(--bg-elevated); border: 2px solid var(--border); color: var(--text);
      font-size: 0.95rem; font-family: inherit; cursor: pointer; transition: all 0.15s ease;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .moznosti button .ikona { font-size: 2rem; line-height: 1; }
    .moznosti button:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-3px); }
    .moznosti button.spravne { background: var(--ok); border-color: var(--ok); color: #fff; }
    .moznosti button.spatne { background: var(--danger); border-color: var(--danger); color: #fff; }
    .moznosti button:disabled { cursor: default; }

    .odezva { font-size: 1.05rem; font-weight: 600; min-height: 28px; }
    .odezva.ok { color: var(--ok); }
    .odezva.chyba { color: var(--danger); }

    .ovladani { display: flex; gap: 10px; align-items: center; margin-top: 14px; max-width: 900px; flex-wrap: wrap; }
    .ovladani button {
      background: var(--bg-control); border: 1px solid var(--border-strong); color: var(--text);
      border-radius: 6px; padding: 10px 18px; font-size: 0.92rem; font-family: inherit; cursor: pointer;
    }
    .ovladani button.hlavni { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .ovladani button.hlavni:hover { background: var(--accent-hover); }
    .skore { margin-left: auto; color: var(--text-muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    .skore b { color: var(--ok); }
    .napoveda { max-width: 900px; margin-top: 12px; color: var(--text-faint); font-size: 0.8rem; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>👨‍👩‍👧 Rodina a domov</h1>
  <p class="podtitul">Pro 1.–2. ročník: kdo do rodiny patří, jak si říkáme a co se kde doma dělá.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="rodokmen" class="active">🌳 Rodokmen</button>
    <button data-rezim="vztahy">❓ Kdo je kdo</button>
    <button data-rezim="domov">🏠 Doma</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Další →</button>
    <button id="btnCist" title="Přečíst zadání nahlas">🔊 Přečti</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Rodokmen</b> je obrázek rodiny: nahoře jsou prarodiče (babička a dědeček), uprostřed rodiče
    (maminka a tatínek) a dole děti. Každá rodina vypadá trochu jinak – a to je v pořádku.
  </p>

<script>
const $ = id => document.getElementById(id);
const KLIC = 'nodus_prv1_rodina';

/* ---- Data ----------------------------------------------------------------- */
const PATRA = [
  {
    nazev: 'Prarodiče', clenove: [
      { id: 'babicka', em: '👵', nazev: 'babička' },
      { id: 'dedecek', em: '👴', nazev: 'dědeček' },
    ],
  },
  {
    nazev: 'Rodiče', clenove: [
      { id: 'maminka', em: '👩', nazev: 'maminka' },
      { id: 'tatinek', em: '👨', nazev: 'tatínek' },
    ],
  },
  {
    nazev: 'Děti', clenove: [
      { id: 'sestra', em: '👧', nazev: 'sestra' },
      { id: 'bratr', em: '👦', nazev: 'bratr' },
    ],
  },
];

const VZTAHY = [
  { e: '👵', o: 'Maminka tvojí maminky je tvoje…', s: 'babicka' },
  { e: '👴', o: 'Tatínek tvojí maminky je tvůj…', s: 'dedecek' },
  { e: '👩', o: 'Dcera tvojí babičky může být tvoje…', s: 'maminka' },
  { e: '👧', o: 'Holčička, která má stejné rodiče jako ty, je tvoje…', s: 'sestra' },
  { e: '👦', o: 'Chlapec, který má stejné rodiče jako ty, je tvůj…', s: 'bratr' },
  { e: '👩‍🦰', o: 'Sestra tvojí maminky je tvoje…', s: 'teta' },
  { e: '🧔', o: 'Bratr tvého tatínka je tvůj…', s: 'stryc' },
  { e: '👧', o: 'Dcera tvojí tety je tvoje…', s: 'sestrenice' },
  { e: '👦', o: 'Syn tvého strýce je tvůj…', s: 'bratranec' },
  { e: '👵', o: 'Maminka tvého tatínka je tvoje…', s: 'babicka' },
];

const OSOBY = {
  babicka: { em: '👵', nazev: 'babička' },
  dedecek: { em: '👴', nazev: 'dědeček' },
  maminka: { em: '👩', nazev: 'maminka' },
  tatinek: { em: '👨', nazev: 'tatínek' },
  sestra: { em: '👧', nazev: 'sestra' },
  bratr: { em: '👦', nazev: 'bratr' },
  teta: { em: '👩‍🦰', nazev: 'teta' },
  stryc: { em: '🧔', nazev: 'strýc' },
  sestrenice: { em: '👧', nazev: 'sestřenice' },
  bratranec: { em: '👦', nazev: 'bratranec' },
};

const MISTNOSTI = {
  kuchyne: { em: '🍳', nazev: 'kuchyň' },
  loznice: { em: '🛏️', nazev: 'ložnice' },
  koupelna: { em: '🛁', nazev: 'koupelna' },
  obyvak: { em: '🛋️', nazev: 'obývák' },
  predsin: { em: '🚪', nazev: 'předsíň' },
};

const DOMOV = [
  { e: '🍲', t: 'Kde se vaří oběd?', s: 'kuchyne' },
  { e: '😴', t: 'Kde se spí?', s: 'loznice' },
  { e: '🪥', t: 'Kde si čistíme zuby?', s: 'koupelna' },
  { e: '📺', t: 'Kde se dívá na televizi?', s: 'obyvak' },
  { e: '🧥', t: 'Kde si věšíme bundu?', s: 'predsin' },
  { e: '🍽️', t: 'Kde se myje nádobí?', s: 'kuchyne' },
  { e: '🚿', t: 'Kde se sprchujeme?', s: 'koupelna' },
  { e: '🧸', t: 'Kde má postýlku plyšák?', s: 'loznice' },
  { e: '👟', t: 'Kde se zouvají boty?', s: 'predsin' },
  { e: '🎲', t: 'Kde spolu hrajeme hry?', s: 'obyvak' },
  { e: '🥣', t: 'Kde je lednička?', s: 'kuchyne' },
  { e: '🧼', t: 'Kde si myjeme ruce?', s: 'koupelna' },
];

/* ---- Pomocné -------------------------------------------------------------- */
const nahodne = pole => pole[Math.floor(Math.random() * pole.length)];
function zamichej(pole) {
  const p = [...pole];
  for (let i = p.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  return p;
}
// čtení nahlas řeší sdílený rec.js – pozná i chybějící hlas v systému
const precti = (text, rychlost = 0.85) => Rec.mluv(text, { rychlost });

let spravne = 0, pokusy = 0, cteniZadani = '';
try {
  const s = JSON.parse(localStorage.getItem(KLIC));
  if (s) { spravne = s.spravne; pokusy = s.pokusy; }
} catch { /* bez trvalé paměti */ }
function ulozSkore() {
  try { localStorage.setItem(KLIC, JSON.stringify({ spravne, pokusy })); } catch { /* bez paměti */ }
}
function zobrazSkore() { $('skore').innerHTML = `Správně: <b>${spravne}</b> z ${pokusy}`; }
function vyhodnot(napoprve) { pokusy++; if (napoprve) spravne++; ulozSkore(); zobrazSkore(); }

/* ---- Režim: rodokmen ------------------------------------------------------
   Přetahování je pro prvňáka obtížné, proto se kartička nejdřív vybere
   klepnutím a druhým klepnutím se položí na místo. */
function rodokmen() {
  const p = $('plocha');
  cteniZadani = 'Poskládej rodokmen. Kam patří kdo?';
  p.innerHTML = `<div class="zadani">Poskládej rodinu – vyber kartičku a klepni, kam patří.</div>`;

  // Kartička patří do patra (generace), ne na konkrétní políčko – maminka
  // i tatínek můžou stát vlevo i vpravo, hlavně ať jsou v prostředním patře.
  const vsichni = PATRA.flatMap((patro, i) => patro.clenove.map(c => ({ ...c, patro: i })));
  let vybrany = null;
  let chyboval = false;
  let polozeno = 0;

  const odezva = document.createElement('div');
  odezva.className = 'odezva';

  const kartiky = document.createElement('div');
  kartiky.className = 'kartiky';

  PATRA.forEach((patro, i) => {
    const box = document.createElement('div');
    box.className = 'patro';
    const nazev = document.createElement('div');
    nazev.className = 'nazev';
    nazev.textContent = patro.nazev;
    const mista = document.createElement('div');
    mista.className = 'mista';
    patro.clenove.forEach(() => {
      const m = document.createElement('div');
      m.className = 'misto';
      m.dataset.patro = i;
      m.innerHTML = `<span class="em">❔</span><span>?</span>`;
      m.addEventListener('click', () => {
        if (!vybrany || m.classList.contains('plne')) return;
        const clen = vsichni.find(c => c.id === vybrany.dataset.id);
        if (clen.patro === Number(m.dataset.patro)) {
          m.classList.add('plne');
          m.innerHTML = `<span class="em">${clen.em}</span><span>${clen.nazev}</span>`;
          vybrany.disabled = true;
          vybrany.classList.remove('vybrany');
          vybrany = null;
          polozeno++;
          precti(clen.nazev, 0.8);
          odezva.className = 'odezva ok';
          if (polozeno === vsichni.length) {
            odezva.textContent = '🎉 Rodokmen je hotový!';
            vyhodnot(!chyboval);
            setTimeout(novaUloha, Uloha.PRODLEVA + 600);
          } else {
            odezva.textContent = '✅ Správně!';
          }
        } else {
          chyboval = true;
          Uloha.trhni(m);
          m.classList.add('chyba');
          setTimeout(() => m.classList.remove('chyba'), 420);
          odezva.className = 'odezva chyba';
          odezva.textContent = `${clen.nazev[0].toUpperCase() + clen.nazev.slice(1)} patří do jiného patra – `
            + (clen.patro === 0 ? 'mezi prarodiče nahoře.'
               : clen.patro === 1 ? 'mezi rodiče doprostřed.' : 'mezi děti dole.');
        }
      });
      mista.appendChild(m);
    });
    box.append(nazev, mista);
    p.appendChild(box);
    if (i < PATRA.length - 1) {
      const s = document.createElement('div');
      s.className = 'spojka';
      s.textContent = '│';
      p.appendChild(s);
    }
  });

  zamichej(vsichni).forEach(clen => {
    const b = document.createElement('button');
    b.className = 'kartik';
    b.dataset.id = clen.id;
    b.innerHTML = `<span class="em">${clen.em}</span><span>${clen.nazev}</span>`;
    b.addEventListener('click', () => {
      kartiky.querySelectorAll('.kartik').forEach(x => x.classList.remove('vybrany'));
      b.classList.add('vybrany');
      vybrany = b;
      odezva.className = 'odezva';
      odezva.textContent = 'Teď klepni, kam ' + clen.nazev + ' patří.';
    });
    kartiky.appendChild(b);
  });

  p.append(kartiky, odezva);
}

/* ---- Společné tlačítkové úlohy -------------------------------------------- */
function tlacitkovaUloha(zadaniHtml, volby, spravnyKlic, popisSpravne) {
  const p = $('plocha');
  p.innerHTML = zadaniHtml;
  const m = document.createElement('div');
  m.className = 'moznosti';
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  const stav = { chyboval: false, hotovo: false };
  volby.forEach(v => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="ikona">${v.em}</span><span>${v.nazev}</span>`;
    b.dataset.klic = v.klic;
    b.addEventListener('click', () => Uloha.odpoved({
      prvek: b,
      spravne: v.klic === spravnyKlic,
      stav, odezva,
      zpravaOk: '✅ Správně – ' + popisSpravne + '!',
      poSpravne: napoprve => { vyhodnot(napoprve); precti(popisSpravne, 0.85); },
      dalsi: novaUloha,
    }));
    m.appendChild(b);
  });
  p.append(m, odezva);
}

/* ---- Režim: kdo je kdo ---------------------------------------------------- */
function vztahy() {
  const v = nahodne(VZTAHY);
  cteniZadani = v.o;
  const jine = zamichej(Object.keys(OSOBY).filter(k => k !== v.s)).slice(0, 3);
  const volby = zamichej([v.s, ...jine]).map(k => ({ klic: k, ...OSOBY[k] }));
  tlacitkovaUloha(
    `<div class="zadani">${v.o}</div><div class="obrazek">${v.e}</div>`,
    volby, v.s, OSOBY[v.s].nazev);
}

/* ---- Režim: doma ---------------------------------------------------------- */
function domov() {
  const d = nahodne(DOMOV);
  cteniZadani = d.t;
  const volby = zamichej(Object.keys(MISTNOSTI)).map(k => ({ klic: k, ...MISTNOSTI[k] }));
  tlacitkovaUloha(
    `<div class="zadani">${d.t}</div><div class="obrazek">${d.e}</div>`,
    volby, d.s, MISTNOSTI[d.s].nazev);
}

/* ---- Ovládání ------------------------------------------------------------- */
const REZIMY = { rodokmen, vztahy, domov };
let rezim = 'rodokmen';
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
$('btnCist').addEventListener('click', () => precti(cteniZadani));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});

Rec.hlidejTlacitko($('btnCist'));
Rec.poznamkaOHlasu(document.querySelector('.napoveda').parentNode);

zobrazSkore();
novaUloha();
</script>
</body>
</html>
