<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Státní symboly a instituce</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .symbol { width: min(230px, 62vw); }
    .popis-s { color: var(--text-muted); max-width: 540px; font-size: 1rem; line-height: 1.5; }
    .nazev-s { font-size: 1.2rem; font-weight: 700; }
  </style>
</head>
<body>
  <h1>🇨🇿 Státní symboly a instituce</h1>
  <p class="podtitul">Pro 5. ročník: symboly našeho státu, kdo co řídí a jak se dělí moc.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="symboly" class="active">🎌 Poznej symbol</button>
    <button data-rezim="kdoResi">🏛️ Kdo to má na starost</button>
    <button data-rezim="moc">⚖️ Tři moci ve státě</button>
    <button data-rezim="svatky">📅 Státní svátky</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Česká republika má <b>šest státních symbolů</b>: velký a malý státní znak, státní barvy,
    státní vlajku, vlajku prezidenta republiky, státní pečeť a státní hymnu.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('nodus_prv5_symboly', $('skore'));
let rezim = 'symboly';

const SYMBOLY = [
  { n: 'státní vlajka', popis: 'dva pruhy – bílý a červený – a modrý klín od žerdi',
    svg: `<rect x="0" y="0" width="180" height="60" fill="#fff"/>
          <rect x="0" y="60" width="180" height="60" fill="#d7141a"/>
          <polygon points="0,0 90,60 0,120" fill="#11457e"/>` },
  { n: 'malý státní znak', popis: 'jeden červený štít se stříbrným dvouocasým lvem',
    svg: `<path d="M90 12 L154 32 V72 C154 96 126 110 90 116 C54 110 26 96 26 72 V32 Z" fill="#d7141a" stroke="#f2f2f2" stroke-width="3"/>
          <text x="90" y="80" font-size="42" text-anchor="middle">🦁</text>` },
  { n: 'velký státní znak', popis: 'štít rozdělený na čtyři pole – lev, orlice moravská a slezská',
    svg: `<path d="M90 12 L154 32 V72 C154 96 126 110 90 116 C54 110 26 96 26 72 V32 Z" fill="#11457e" stroke="#f2f2f2" stroke-width="3"/>
          <line x1="90" y1="12" x2="90" y2="116" stroke="#f2f2f2" stroke-width="3"/>
          <line x1="26" y1="60" x2="154" y2="60" stroke="#f2f2f2" stroke-width="3"/>
          <text x="58" y="50" font-size="22" text-anchor="middle">🦁</text>
          <text x="122" y="50" font-size="22" text-anchor="middle">🦅</text>
          <text x="58" y="100" font-size="22" text-anchor="middle">🦅</text>
          <text x="122" y="100" font-size="22" text-anchor="middle">🦁</text>` },
  { n: 'státní barvy', popis: 'bílá, červená a modrá v tomto pořadí',
    svg: `<rect x="10" y="20" width="160" height="26" fill="#fff"/>
          <rect x="10" y="47" width="160" height="26" fill="#d7141a"/>
          <rect x="10" y="74" width="160" height="26" fill="#11457e"/>` },
  { n: 'vlajka prezidenta republiky', popis: 'bílá vlajka s nápisem Pravda vítězí a lipovými ratolestmi',
    svg: `<rect x="10" y="15" width="160" height="90" fill="#f2f2f2" stroke="#d7141a" stroke-width="6"/>
          <text x="90" y="62" font-size="13" text-anchor="middle" fill="#11457e">PRAVDA VÍTĚZÍ</text>
          <text x="90" y="86" font-size="18" text-anchor="middle">🌿</text>` },
  { n: 'státní hymna', popis: 'píseň Kde domov můj z divadelní hry Fidlovačka',
    svg: `<rect x="20" y="25" width="140" height="70" rx="8" fill="#2b2b2b" stroke="#888" stroke-width="2"/>
          <text x="90" y="72" font-size="34" text-anchor="middle">🎵</text>` },
];

const INSTITUCE = [
  { n: 'obecní úřad', e: '🏘️', k: 'vydá ti výpis z matriky a stará se o obec' },
  { n: 'krajský úřad', e: '🏢', k: 'spravuje střední školy a silnice II. třídy v kraji' },
  { n: 'Poslanecká sněmovna', e: '🗳️', k: 'schvaluje zákony, má 200 poslanců' },
  { n: 'Senát', e: '🏛️', k: 'druhá komora parlamentu, má 81 senátorů' },
  { n: 'vláda', e: '👔', k: 'řídí stát a jednotlivá ministerstva' },
  { n: 'prezident republiky', e: '🎖️', k: 'hlava státu, jmenuje vládu a soudce' },
  { n: 'soud', e: '⚖️', k: 'rozhoduje spory a trestá porušení zákona' },
];

const MOCI = {
  zakonodarna: { nazev: 'zákonodárná (tvoří zákony)', kdo: ['Poslanecká sněmovna', 'Senát'] },
  vykonna: { nazev: 'výkonná (řídí stát)', kdo: ['vláda', 'prezident republiky', 'ministerstva'] },
  soudni: { nazev: 'soudní (rozhoduje spory)', kdo: ['soudy', 'Ústavní soud'] },
};

const SVATKY = [
  { d: '1. ledna', n: 'Den obnovy samostatného českého státu', proc: 'v roce 1993 vznikla samostatná Česká republika' },
  { d: '8. května', n: 'Den vítězství', proc: 'konec druhé světové války v Evropě roku 1945' },
  { d: '5. července', n: 'Den slovanských věrozvěstů Cyrila a Metoděje', proc: 'příchod věrozvěstů na Velkou Moravu roku 863' },
  { d: '6. července', n: 'Den upálení mistra Jana Husa', proc: 'Jan Hus byl upálen v Kostnici roku 1415' },
  { d: '28. září', n: 'Den české státnosti', proc: 'svátek svatého Václava, patrona české země' },
  { d: '28. října', n: 'Den vzniku samostatného Československa', proc: 'Československo vzniklo roku 1918' },
  { d: '17. listopadu', n: 'Den boje za svobodu a demokracii', proc: 'sametová revoluce začala roku 1989' },
];

/* ---- Poznej symbol --------------------------------------------------------------- */
function symboly() {
  const p = $('plocha');
  const s = Uloha.nahodne(SYMBOLY);
  const jine = Uloha.zamichej(SYMBOLY.filter(x => x.n !== s.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Který státní symbol to je?</div>
    <div class="karta"><svg class="symbol" data-symbol="${s.n}" viewBox="0 0 180 120">${s.svg}</svg></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([s, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: s.n,
    zpravaOk: `✅ ${s.n} – ${s.popis}.`,
    zpravaChyba: 'To je jiný symbol – všimni si barev a tvaru.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Kdo to má na starost --------------------------------------------------------- */
function kdoResi() {
  const p = $('plocha');
  const i = Uloha.nahodne(INSTITUCE);
  const jine = Uloha.zamichej(INSTITUCE.filter(x => x.n !== i.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Kdo to má na starost?</div>
    <div class="karta"><div class="obrazek">📋</div><div class="popis-s">${i.k}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([i, ...jine]).map(x => ({ klic: x.n, ikona: x.e, popis: x.n })),
    spravnyKlic: i.n,
    zpravaOk: `✅ ${i.n} – ${i.k}.`,
    zpravaChyba: 'Zkus jinou instituci – kdo je tomuhle úkolu nejblíž?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Tři moci ve státě ------------------------------------------------------------ */
function moc() {
  const p = $('plocha');
  const klic = Uloha.nahodne(Object.keys(MOCI));
  const kdo = Uloha.nahodne(MOCI[klic].kdo);
  p.innerHTML = `<div class="zadani">Ke které moci ve státě to patří?</div>
    <div class="karta"><div class="obrazek">⚖️</div><div class="nazev-s">${kdo}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(Object.entries(MOCI))
      .map(([k, m]) => ({ klic: k, popis: m.nazev })),
    spravnyKlic: klic,
    zpravaOk: `✅ ${kdo} patří k moci ${MOCI[klic].nazev.split(' (')[0]}.`,
    zpravaChyba: 'Tvoří to zákony, řídí stát, nebo rozhoduje spory?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Státní svátky ----------------------------------------------------------------- */
function svatky() {
  const p = $('plocha');
  const s = Uloha.nahodne(SVATKY);
  const jine = Uloha.zamichej(SVATKY.filter(x => x.d !== s.d)).slice(0, 3);
  const podleData = Math.random() < 0.5;

  p.innerHTML = podleData
    ? `<div class="zadani">Jaký svátek slavíme v tento den?</div>
       <div class="karta"><div class="obrazek">📅</div><div class="nazev-s">${s.d}</div></div>`
    : `<div class="zadani">Kdy tento svátek slavíme?</div>
       <div class="karta"><div class="obrazek">🇨🇿</div><div class="popis-s">${s.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([s, ...jine]).map(x => ({ klic: x.d, popis: podleData ? x.n : x.d })),
    spravnyKlic: s.d,
    zpravaOk: `✅ ${s.d} – ${s.n}: ${s.proc}.`,
    zpravaChyba: 'Zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { symboly, kdoResi, moc, svatky };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
